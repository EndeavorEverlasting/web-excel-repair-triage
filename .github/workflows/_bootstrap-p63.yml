name: Bootstrap P61 prompt registry

on:
  push:
    branches:
      - feat/prompt-kit-clone-enter-repo
    paths:
      - scripts/_bootstrap_add_p63.py
      - scripts/_bootstrap_run_p61.py
      - .github/workflows/_bootstrap-p63.yml

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical registry update and rebuild outputs
        run: python scripts/_bootstrap_run_p61.py
      - name: Validate JSON and generated web surface
        run: |
          python -m json.tool docs/prompts.json >/dev/null
          python -m py_compile build_prompt_kit.py
          git diff --check
          grep -q '"id": "P61"' docs/prompts.json
          grep -q 'xyz_repository_url_or_owner_name' web/prompt-kit/index.html
          grep -q 'set terminal directory' build_prompt_kit.py
      - name: Remove one-time bootstrap machinery
        run: git rm -f scripts/_bootstrap_add_p63.py scripts/_bootstrap_run_p61.py .github/workflows/_bootstrap-p63.yml
      - name: Commit generated registry release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prompts.json build_prompt_kit.py web/prompt-kit/index.html
          git commit -m 'feat(prompt-kit): add repository clone directory bootstrapper'
          git push origin HEAD:feat/prompt-kit-clone-enter-repo
