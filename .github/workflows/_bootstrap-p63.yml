name: Bootstrap P63 prompt registry

on:
  push:
    branches:
      - feat/prompt-kit-clone-enter-repo
    paths:
      - scripts/_bootstrap_add_p63.py
      - .github/workflows/_bootstrap-p63.yml

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical registry update and rebuild outputs
        run: python scripts/_bootstrap_add_p63.py
      - name: Validate JSON and generated surfaces
        run: |
          python -m json.tool docs/prompts.json >/dev/null
          python -m py_compile build_prompt_kit.py
          git diff --check
          grep -q '"id": "P63"' docs/prompts.json
          grep -q 'Existing Repository Clone + Working-Directory Bootstrapper' docs/prompt-kit.html
          grep -q 'Existing Repository Clone + Working-Directory Bootstrapper' web/prompt-kit/index.html
      - name: Remove one-time bootstrap machinery
        run: git rm scripts/_bootstrap_add_p63.py .github/workflows/_bootstrap-p63.yml
      - name: Commit generated registry release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prompts.json build_prompt_kit.py docs/prompt-kit.html web/prompt-kit/index.html
          git commit -m 'feat(prompt-kit): add repository clone directory bootstrapper'
          git push origin HEAD:feat/prompt-kit-clone-enter-repo
