name: Fix P61 prompt sequence

on:
  push:
    branches:
      - feat/prompt-kit-clone-enter-repo
    paths:
      - scripts/_fix_p61_seq.py
      - .github/workflows/_fix-p61-seq.yml

permissions:
  contents: write

jobs:
  fix-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct registry sequence and rebuild
        run: python scripts/_fix_p61_seq.py
      - name: Validate final registry and web output
        run: |
          python -m json.tool docs/prompts.json >/dev/null
          python -m py_compile build_prompt_kit.py
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          prompts = json.loads(Path('docs/prompts.json').read_text(encoding='utf-8'))
          p = [x for x in prompts if x['id'] == 'P61']
          assert len(p) == 1
          assert p[0]['seq'] == '61'
          assert p[0]['copySheet'] == 'P61_COPY_SAFE'
          assert prompts[-1]['id'] == 'P61'
          web = Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          assert 'Existing Repository Clone + Working-Directory Bootstrapper' in web
          assert 'xyz_repository_url_or_owner_name' in web
          PY
      - name: Remove one-time correction machinery
        run: git rm -f scripts/_fix_p61_seq.py .github/workflows/_fix-p61-seq.yml
      - name: Commit and push correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prompts.json web/prompt-kit/index.html
          git commit -m 'fix(prompt-kit): align P61 sequence metadata'
          git push origin HEAD:feat/prompt-kit-clone-enter-repo
