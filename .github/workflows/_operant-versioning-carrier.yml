name: Temporary Operant Versioning Carrier

on:
  push:
    branches:
      - feat/operant-deterministic-versioning-20260908

permissions:
  contents: write

jobs:
  implement-and-prove:
    if: ${{ !contains(github.event.head_commit.message, '[operant-versioning-carrier-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded renderer/test cutover
        run: python scripts/_operant_versioning_carrier.py

      - name: Prove canonical version system
        run: |
          python scripts/operant_version.py validate
          python scripts/validate_operant_product_identity.py --summary
          python -m unittest tests.test_operant_product_identity tests.test_prompt_kit_order_navigation_product -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Commit exact proven carrier result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_prompt_kit.py tests/test_prompt_kit_order_navigation_product.py web/prompt-kit/index.html
          if git diff --cached --quiet; then
            echo "No carrier delta remained after validation."
            exit 0
          fi
          git commit -m "feat(operant): derive visible version from authority [operant-versioning-carrier-complete]"
          git push origin HEAD:${GITHUB_REF_NAME}
