name: Temporary P110 mobile orientation stability executor

on:
  push:
    branches:
      - feat/p110-mobile-orientation-stability-20260910

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/p110-mobile-orientation-stability-20260910
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh default-branch floor
        run: |
          set -euo pipefail
          git fetch origin main --prune --tags
          git merge --no-edit origin/main
          echo "FRESH_MAIN=$(git rev-parse origin/main)"
          echo "WORK_HEAD=$(git rev-parse HEAD)"

      - name: Apply bounded P110 strengthening
        run: |
          set -euo pipefail
          python scripts/_temp_p110_mobile_orientation_stability.py

      - name: Build canonical Prompt Kit artifact
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Focused semantic and registry proof
        run: |
          set -euo pipefail
          python -m unittest tests.test_ux_design_prompt_suite -v
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Remove temporary transport and commit durable contribution
        run: |
          set -euo pipefail
          git rm scripts/_temp_p110_mobile_orientation_stability.py
          git rm .github/workflows/_temp-p110-mobile-orientation-stability.yml
          git add registry/prompts/spec-architecture-prompts.v1.json tests/test_ux_design_prompt_suite.py web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git commit -m "feat(prompt-kit): stabilize mobile UX across orientation"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"

      - name: Re-prove exact committed candidate
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python -m unittest tests.test_ux_design_prompt_suite -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff HEAD^ HEAD --check
          git show --stat --oneline --decorate HEAD

      - name: Push exact candidate
        run: |
          set -euo pipefail
          git push origin HEAD:feat/p110-mobile-orientation-stability-20260910
