name: Temporary Prompt Semantic Hardener Executor

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  apply-to-feature:
    if: github.head_ref == 'feat/prompt-kit-prompt-semantic-hardener-p86-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-prompt-semantic-hardener-p86-20260819
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add prompt through repo-owned helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! grep -q 'Prompt Semantic Hardener & Principle Integrator' registry/prompts/spec-architecture-prompts.v1.json; then
            python scripts/prompt_registry_ops.py add --input .prompt-hardener-draft.json --registry spec-architecture-prompts | tee "$RUNNER_TEMP/prompt-hardener-helper-receipt.json"
            cat "$RUNNER_TEMP/prompt-hardener-helper-receipt.json"
          else
            echo 'Semantic hardener already present; helper add skipped on idempotent rerun.'
          fi
      - name: Validate durable contribution
        run: |
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_prompt_language_audit -v
          python -m unittest tests.test_prompt_kit_order_navigation_contract tests.test_prompt_kit_discovery -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Remove temporary contribution transport
        run: |
          git fetch origin main --prune
          git checkout origin/main -- scripts/validate_prompt_kit_interactions.py
          git rm -f .github/workflows/apply-prompt-semantic-hardener.yml .prompt-hardener-draft.json
      - name: Commit and push helper-generated contribution
        run: |
          git add registry/prompts/spec-architecture-prompts.v1.json tests/test_spec_architecture_prompt_registry.py web/prompt-kit/index.html scripts/validate_prompt_kit_interactions.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): add prompt semantic hardener'
          git push origin HEAD:feat/prompt-kit-prompt-semantic-hardener-p86-20260819
