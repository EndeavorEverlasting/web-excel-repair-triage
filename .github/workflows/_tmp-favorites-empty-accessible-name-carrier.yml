name: Temporary Favorites empty accessible-name carrier

on:
  push:
    branches:
      - feat/prompt-kit-favorites-empty-persistence-20260905

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply accessible-name repair
        run: python scripts/_tmp_fix_favorites_empty_accessible_names.py
      - name: Rebuild and validate
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_mobile tests.test_prompt_kit_hotkey_completion -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Prove visible and accessible labels agree
        run: |
          python - <<'PY'
          from pathlib import Path
          for text in (
              Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8'),
              Path('web/prompt-kit/index.html').read_text(encoding='utf-8'),
          ):
              assert "action.textContent='Browse all prompts'" in text
              assert "action.setAttribute('aria-label','Browse all prompts')" in text
              assert "action.textContent='Clear Favorites filters'" in text
              assert "action.setAttribute('aria-label','Clear Favorites filters')" in text
          print('FAVORITES_EMPTY_ACCESSIBLE_NAME_PARITY=PASS')
          PY
      - name: Commit durable repair and remove temporary files
        run: |
          git rm .github/workflows/_tmp-favorites-empty-accessible-name-carrier.yml
          git rm scripts/_tmp_fix_favorites_empty_accessible_names.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prompt-kit-polish.js web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "fix(prompt-kit): align Favorites recovery accessible names"
          git push origin HEAD:feat/prompt-kit-favorites-empty-persistence-20260905
