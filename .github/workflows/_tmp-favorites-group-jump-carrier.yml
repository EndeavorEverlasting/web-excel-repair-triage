name: Temporary Favorites group jump carrier

on:
  push:
    branches:
      - feat/prompt-kit-favorites-group-jump-20260905

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded implementation
        run: python scripts/_tmp_apply_favorites_group_jump.py
      - name: Rebuild canonical release
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate focused contracts
        run: |
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_mobile tests.test_prompt_kit_hotkey_completion tests.test_prompt_kit_filtering_access tests.test_prompt_kit_product_interactions -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_prompt_kit_discovery.py --summary
          git diff --check
      - name: Deliberate structured-navigation review
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8')
          deployed=Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          markers=(
              "nav.id='favoritesGroupJumpNav'",
              "grid.querySelectorAll('.section-divider[data-category]')",
              "link.setAttribute('data-favorite-group',name)",
              "target.scrollIntoView({block:'start',behavior:hotkeyScrollBehavior()})",
              "installFavoritesGroupJumpNavigation();",
          )
          for marker in markers:
              assert marker in src, marker
              assert marker in deployed, marker
          assert 'favoriteGroupsStorage' not in src
          assert 'favoriteCollections' not in src
          print('FAVORITES_GROUP_JUMP_SECOND_PASS=PASS')
          PY
          git diff --check
      - name: Commit durable work and remove temporary execution files
        run: |
          git rm .github/workflows/_tmp-favorites-group-jump-carrier.yml
          git rm scripts/_tmp_apply_favorites_group_jump.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prompt-kit-polish.js harness/contracts/prompt-kit-mobile.v1.json tests/test_prompt_kit_mobile.py tests/prompt_kit_favorite_browser_proof.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "feat(prompt-kit): add Favorites group jump navigation"
          git push origin HEAD:feat/prompt-kit-favorites-group-jump-20260905
