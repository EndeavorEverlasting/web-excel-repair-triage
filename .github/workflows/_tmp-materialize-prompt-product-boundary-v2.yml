name: TEMP materialize prompt product boundary v2

on:
  push:
    branches:
      - refactor/prompt-registry-product-boundaries-20260913
    paths:
      - '.github/workflows/_tmp-materialize-prompt-product-boundary-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/prompt-registry-product-boundaries-20260913
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Replace duplicated builder registry ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_prompt_kit_registry.py')
          text = path.read_text(encoding='utf-8')
          old_lines = [
              'from scripts import prompt_classification  # noqa: E402',
              '',
              'BASE_REGISTRY = REPO_ROOT / "docs" / "prompts.json"',
              'EXTENSION_REGISTRIES = (',
              '    REPO_ROOT / "registry" / "prompts" / "skill-development-prompts.v1.json",',
              '    REPO_ROOT / "registry" / "prompts" / "tutorial-discovery-prompts.v1.json",',
              '    REPO_ROOT / "registry" / "prompts" / "ai-engineering-level-up-prompts.v1.json",',
              '    REPO_ROOT / "registry" / "prompts" / "repository-work-ledger-prompts.v1.json",',
              '    REPO_ROOT / "registry" / "prompts" / "management-operations-prompts.v1.json",',
              '    REPO_ROOT / "registry" / "prompts" / "spec-architecture-prompts.v1.json",',
              ')',
              'CONTENT_REGISTRIES = (',
              '    REPO_ROOT / "registry" / "prompts" / "correspondence-prompts.v1.json",',
              ')',
          ]
          new_lines = [
              'from scripts import prompt_classification  # noqa: E402',
              'from scripts import prompt_registry_product_boundaries  # noqa: E402',
              '',
              'PRODUCT_BOUNDARIES = prompt_registry_product_boundaries.load_contract()',
              'BASE_REGISTRY = prompt_registry_product_boundaries.base_registry(PRODUCT_BOUNDARIES)',
              'EXTENSION_REGISTRIES = prompt_registry_product_boundaries.legacy_extension_registries(',
              '    PRODUCT_BOUNDARIES',
              ')',
              'CONTENT_REGISTRIES = prompt_registry_product_boundaries.content_registries(',
              '    PRODUCT_BOUNDARIES',
              ')',
          ]
          old = '\n'.join(old_lines) + '\n'
          new = '\n'.join(new_lines) + '\n'
          if text.count(old) != 1:
              raise SystemExit('expected builder registry block was not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Prove byte-equivalent legacy output and boundary ownership
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_prompt_kit_registry.py scripts/prompt_registry_product_boundaries.py tests/test_prompt_registry_product_boundaries.py
          python scripts/prompt_registry_product_boundaries.py --summary
          python -m unittest tests.test_prompt_registry_product_boundaries -v
          python scripts/build_prompt_kit_registry.py --check
          git diff --check

      - name: Commit durable refactor and remove carriers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-materialize-prompt-product-boundary.yml
          rm -f .github/workflows/_tmp-materialize-prompt-product-boundary-v2.yml
          git add scripts/build_prompt_kit_registry.py scripts/prompt_registry_product_boundaries.py tests/test_prompt_registry_product_boundaries.py .github/workflows/_tmp-materialize-prompt-product-boundary.yml .github/workflows/_tmp-materialize-prompt-product-boundary-v2.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(prompt-registry): route builder through product owner'
          git push origin HEAD:refactor/prompt-registry-product-boundaries-20260913
