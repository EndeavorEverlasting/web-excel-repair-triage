name: Temporary mobile Favorites persistence carrier

on:
  push:
    branches:
      - feat/prompt-kit-mobile-favorites-quick-access-20260905

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply persistence repair
        run: python scripts/_tmp_fix_mobile_favorites_persistence.py
      - name: Rebuild and validate
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_mobile tests.test_prompt_kit_hotkey_completion tests.test_prompt_kit_filtering_access tests.test_prompt_kit_product_interactions -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_prompt_kit_discovery.py --summary
          git diff --check
      - name: Prove persistent quick access seam
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8')
          deployed=Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          marker="if(search)headerTop.insertBefore(mobileFavoritesQuick,search);else headerTop.appendChild(mobileFavoritesQuick)"
          selector=".header-top>.mobile-favorites-quick{display:inline-flex;width:100%;grid-column:1/-1}"
          for text in (src,deployed):
              assert marker in text
              assert selector in text
              assert ".header-top>.header-controls .mobile-favorites-quick" not in text
          print('MOBILE_FAVORITES_PERSISTENT_HEADER=PASS')
          PY
      - name: Commit durable repair and remove temporary files
        run: |
          git rm .github/workflows/_tmp-mobile-favorites-persistence-carrier.yml
          git rm scripts/_tmp_fix_mobile_favorites_persistence.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prompt-kit-polish.js tests/test_prompt_kit_mobile.py tests/prompt_kit_favorite_browser_proof.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "fix(prompt-kit): keep mobile Favorites quick access visible"
          git push origin HEAD:feat/prompt-kit-mobile-favorites-quick-access-20260905
