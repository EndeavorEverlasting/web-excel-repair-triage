name: Temporary mobile ID edge-case repair

on:
  push:
    branches:
      - fix/prompt-kit-mobile-id-edge-cases-20260907
    paths:
      - .github/workflows/_tmp-mobile-id-edge-cases.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/prompt-kit-mobile-id-edge-cases-20260907
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded repair
        run: python scripts/_tmp_mobile_id_edge_case_executor.py

      - name: Regenerate canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Static and unit validation
        run: |
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_mobile_quick_controls -v
          python -m unittest tests.test_prompt_kit_mobile -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Install Chromium proof dependency
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium

      - name: Run 390x844 edge-case journey
        run: python tests/prompt_kit_mobile_quick_controls_browser_proof.py

      - name: Commit durable repair only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/prompt-kit-polish.js \
            tests/test_prompt_kit_mobile_quick_controls.py \
            tests/prompt_kit_mobile_quick_controls_browser_proof.py \
            harness/contracts/prompt-kit-mobile.v1.json \
            OPEN_PROMPT_KIT_ON_PHONE.md \
            web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --quiet && { echo "No durable changes produced"; exit 1; }
          git commit -m "fix(prompt-kit): clarify mobile prompt ID edge cases"
          git push origin HEAD:fix/prompt-kit-mobile-id-edge-cases-20260907
