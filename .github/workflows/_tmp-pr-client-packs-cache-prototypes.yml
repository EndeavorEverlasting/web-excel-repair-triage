name: Temporary PR runner for client packs cache prototypes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'feat/prompt-kit-client-packs-cache-prototypes-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-client-packs-cache-prototypes-20260819
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute staged P80-P82 patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          path = Path('.github/workflows/_tmp-prompt-kit-client-packs-cache-prototypes.yml')
          text = path.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index('\n          PY', start)
          block = textwrap.dedent(text[start:end])
          exec(compile(block, str(path) + ':staged-python', 'exec'))
      - name: Build and validate canonical Prompt Kit
        run: |
          python -m py_compile tests/test_spec_architecture_prompt_registry.py scripts/build_prompt_kit_registry.py
          python -m json.tool registry/prompts/spec-architecture-prompts.v1.json >/dev/null
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output "$RUNNER_TEMP/prompt-kit-order-navigation-audit.json" --summary
          git diff --check
      - name: Commit permanent implementation and remove temporary runners
        run: |
          rm .github/workflows/_tmp-prompt-kit-client-packs-cache-prototypes.yml
          rm .github/workflows/_tmp-pr-client-packs-cache-prototypes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/prompts/spec-architecture-prompts.v1.json tests/test_spec_architecture_prompt_registry.py web/prompt-kit/index.html .github/workflows/_tmp-prompt-kit-client-packs-cache-prototypes.yml .github/workflows/_tmp-pr-client-packs-cache-prototypes.yml
          git diff --cached --check
          git commit -m 'feat(prompt-kit): add client packs caching and prototype loops'
          git push origin HEAD:feat/prompt-kit-client-packs-cache-prototypes-20260819
