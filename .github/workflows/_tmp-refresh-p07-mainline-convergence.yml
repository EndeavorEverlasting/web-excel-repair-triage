name: Temporary P7 mainline convergence refresh

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'feat/green-branch-integration-default-20260808' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/green-branch-integration-default-20260808
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile stale PR history onto current main
        run: |
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge -s ours --no-edit origin/main
          git read-tree --reset -u origin/main
      - name: Strengthen P7 and global integration policy
        shell: python
        run: |
          import json
          from pathlib import Path

          prompts_path = Path('docs/prompts.json')
          prompts = json.loads(prompts_path.read_text(encoding='utf-8'))
          p07 = next(prompt for prompt in prompts if prompt['id'] == 'P07')
          p07['sprintRole'] = 'Execute any bounded repo change through validated mainline integration'
          p07['expectedOutput'] = 'Validated repository progress integrated into the current main/default branch when integration gates permit, or an exact named integration blocker with the action that advances it.'
          p07['nextStep'] = 'Continue the owned change through focused validation, exact-head checks, and integration into the current main/default branch; a branch or PR is an intermediate lane, not completion. If integration is blocked, advance the named merge, review, protection, dependency, credential, or authority gate.'
          p07['proofGate'] = 'The intended change is verified on the current main/default branch after integration, or an exact integration blocker is proven with the action that advances it; branch creation, a pushed commit, or an open/green PR alone is insufficient.'

          content = p07['copyContent']
          content = content.replace(
              'Your job is to change the repository, validate the change, commit it, and push or open/update a PR when the environment allows.',
              "Your job is to change the repository, validate the change, commit it, push it, and carry the exact validated work through integration into current `main` (or the repository's configured default branch) when the gates permit. A feature branch, worktree, or pull request is a temporary safety/integration lane, not the intended final repository state.",
          )
          anchor = 'Context or plan path: xyz_plan_directory\n'
          contract = '''MAINLINE CONVERGENCE CONTRACT
- Treat current `main` (or the repository's configured default branch when it is not named `main`) as the consolidation destination for completed owned work.
- Do not create a new feature branch or pull request merely because repository work was requested. First inspect current, open, and recent overlapping branches, worktrees, pull requests, and commits. Reuse, repair, update, retarget, or finish the existing owner whenever it can safely carry the sprint.
- Create an isolated branch/worktree only when repository policy, branch protection, dirty/separately owned work, review requirements, or collision isolation makes it necessary. The branch is an execution lane, not a completion artifact.
- After implementation, validate the exact current head. Inspect required checks, owning validators, dependency state, blocking reviews, conflicts, branch protection, and merge authority.
- When the exact validated head is mergeable, required checks and owning validators are green, dependencies are satisfied, no blocking review/conflict/protection gate remains, merge authority exists, and the operator has not explicitly prohibited merge, integrate it into the current default branch in the same run using a repository-accepted merge method. Do not stop at push, PR-open, review-ready, or green-status reporting.
- For stacked or dependent branches, integrate in dependency order, refresh downstream branches against the moved base without force, rerun affected validators, and continue convergence while gates remain green.
- After integration, fetch the current default branch and verify that it contains the intended behavior/artifact by provider merge state plus the owning test, validator, build, or content check. Report the resulting default-branch SHA and merge/PR state.
- Stop short of integration only for an explicit no-merge instruction or a concrete failing/pending check, validator, dependency, review, conflict, protection rule, credential, permission, or merge-authority gate. Name the exact blocker and execute or provide the smallest action that advances that gate; generic `wait for review` is not enough.
- Branch creation, worktree creation, a commit, a push, or an open/green pull request may be useful movement, but none is a valid terminal state while safe authorized integration into the default branch remains available.

'''
          if 'MAINLINE CONVERGENCE CONTRACT' not in content:
              if anchor not in content:
                  raise SystemExit('P07 insertion anchor missing')
              content = content.replace(anchor, anchor + contract, 1)
          content = content.replace(
              'Minimum movement:\nAt least one useful repository mutation must occur unless the sprint is already complete or blocked. Valid movement includes tracked-file changes, commits, branch or worktree creation, cherry-picks, merges, pushes, PR comments, labels, base or draft changes, PR closure, or other owned Git/GitHub mutations.',
              'Minimum movement:\nAt least one useful repository mutation must occur unless the sprint is already complete or blocked. Valid movement includes tracked-file changes, commits, branch or worktree creation, cherry-picks, merges, pushes, PR comments, labels, base or draft changes, PR closure, or other owned Git/GitHub mutations. Branch/worktree creation alone is setup, not completion, when safe implementation or integration remains executable.',
          )
          content = content.replace(
              'Open or update a PR when appropriate.',
              "Open or update the correct PR when the work is not already on the default branch, but do not treat PR creation as the finish line. Continue through exact-head validation and merge into the current default branch when the MAINLINE CONVERGENCE CONTRACT permits it.",
          )
          content = content.replace(
              '- PR: URL or not opened\n',
              '- PR: URL or not opened\n- integration target: current default branch and pre/post SHA\n- merged/integrated: yes/no\n- merge commit or provider merge SHA:\n- main/default-branch verification: owning test/validator/content proof\n',
          )
          content = content.replace(
              '- blocker:\n- gap:\n- risk:\n',
              '- blocker:\n- integration blocker, if unmerged:\n- advancing action for that blocker:\n- gap:\n- risk:\n',
          )
          content = content.replace(
              'Do the repo work. Commit it. Then stop.',
              'Do the repo work. Validate it. Commit and push it. Integrate the exact green authorized head into the current default branch when the gates permit, verify the default branch contains the intended change, then stop.',
          )
          p07['copyContent'] = content
          prompts_path.write_text(json.dumps(prompts, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          policy_path = Path('registry/prompts/actionable-next-step-policy.v1.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          policy['integration_marker'] = 'GREEN BRANCH INTEGRATION CONTRACT'
          policy['integration_target'] = "current `main` or the repository's configured default branch"
          policy['next_step_suffix'] = (
              'Do not leave the next step empty or generic: identify the first executable, dependency-aware action that advances or consumes the canonical artifact or proof; '
              'PR, status, branch, or log inspection alone is invalid when safe executable work remains. If the owned branch or pull request is mergeable and all required checks, owning harness validators, dependency gates, and blocking reviews are green, merge it into the current default branch in the same run using a repository-accepted merge method; do not stop at PR-open or green-status reporting unless a named external gate actually blocks integration.'
          )
          policy['green_merge_conditions'] = [
              'the exact current head is the head that was validated',
              'all required repository checks are passing',
              'the owning harness validators and focused validators are passing',
              'declared dependencies are satisfied or already included in the merge target',
              'no unresolved blocking review, merge conflict, branch-protection gate, or required approval remains',
              'the merge contains only reviewed owned or intentionally integrated scope',
              'the acting agent has repository merge authority and the user has not explicitly prohibited merge',
          ]
          policy['merge_exceptions'] = [
              'the user explicitly requested that the branch remain unmerged',
              'a required check, owning validator, dependency, review, conflict, branch-protection rule, or approval is pending or failing',
              'the branch head moved after the evidence used to declare it green',
              'the merge would include unrelated, unreviewed, unsafe, secret, private, or forbidden-scope work',
              'the repository or provider denies merge authority',
          ]
          reuse = policy['existing_work_reuse']
          reuse['rule'] = reuse['rule'].replace('retarget, or extend', 'retarget, integrate, or extend')
          reuse['preservation_rule'] = reuse['preservation_rule'].replace('abandoning an existing', 'abandoning, or merging an existing')
          reuse['disposition_evidence'] = reuse['disposition_evidence'].replace('repaired, superseded', 'repaired, integrated, superseded')
          forbidden = policy['forbidden_solo_actions']
          green_forbidden = 'report that a pull request is green without merging it when the green merge conditions are satisfied'
          if green_forbidden not in forbidden:
              forbidden.insert(2, green_forbidden)
          base_appendix = policy['copy_content_appendix'].split('\n\nGREEN BRANCH INTEGRATION CONTRACT', 1)[0]
          base_appendix = base_appendix.replace(
              '- For unmerged remote work, provide one copy-paste command that sets the repository location, fetches without force, verifies the exact branch and commit, preserves dirty or separately owned work through an isolated worktree or another non-destructive mechanism, runs the owning validator, build, or launcher, resolves the canonical artifact from tracked registry, manifest, builder, workflow, or operator documentation, opens or prints that artifact, and propagates every nonzero exit code.',
              '- For unmerged remote work, fetch without force, verify the exact branch and commit, preserve dirty or separately owned work through an isolated worktree or another non-destructive mechanism, run the owning validator/build/launcher, and advance the work through the next available integration gate.',
          )
          integration = '''GREEN BRANCH INTEGRATION CONTRACT
- Treat integration into current `main` or the repository's configured default branch as the normal completion state for repository work, not an optional follow-up. A bounded implementation scope limits what may be changed; it does not require validated owned work to remain stranded on a branch.
- A feature branch, worktree, or pull request is a temporary execution/review lane. Do not create a new one when a suitable existing owner can be safely reused, repaired, updated, retargeted, integrated, or extended.
- After implementation and validation, inspect the exact current branch/PR head, required checks, owning harness validators, focused validators, dependency state, blocking reviews, conflicts, and branch-protection requirements.
- When the exact validated head is mergeable, required checks and owning validators are green, dependencies are satisfied, no blocking review/conflict/protection gate remains, merge authority exists, and the user has not explicitly prohibited merge, merge the branch or PR into the current default branch in the same run using a repository-accepted merge method. Do not merely report that it is green.
- If several green branches are dependency-related, integrate them in dependency order, refresh/revalidate affected downstream heads after the base moves, and continue merging while the gates remain green.
- Do not merge when a required gate is pending or failing, the head moved after validation, an unresolved dependency/review/conflict/protection rule remains, authorization is absent, or the merge would carry unrelated, unreviewed, unsafe, private, secret, or forbidden-scope work.
- After merge, fetch/resolve the current default branch, verify it contains the intended change with provider merge state plus the owning test/validator/build/content proof, report its resulting SHA, and preserve or close superseded work safely.
- An open PR, pushed feature branch, or green status is not a valid terminal state while safe authorized integration remains available. If integration is blocked, name the exact gate and advance that gate instead of leaving generic future advice.'''
          policy['copy_content_appendix'] = base_appendix + '\n\n' + integration
          policy_path.write_text(json.dumps(policy, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test_path = Path('tests/test_actionable_prompt_registry.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''        self.assertIn("PR, status, branch, or log inspection alone is invalid", p07["nextStep"])
'''
          new = '''        self.assertIn("PR, status, branch, or log inspection alone is invalid", p07["nextStep"])
        self.assertIn("MAINLINE CONVERGENCE CONTRACT", p07["copyContent"])
        self.assertIn("temporary safety/integration lane", p07["copyContent"])
        self.assertIn("not a valid terminal state", p07["copyContent"])
        self.assertIn("integrate it into the current default branch in the same run", p07["copyContent"])
        self.assertIn("verify the default branch contains the intended change", p07["copyContent"])
        self.assertNotIn("Do the repo work. Commit it. Then stop.", p07["copyContent"])
        self.assertIn("current main/default branch", p07["expectedOutput"])
        self.assertIn("open/green PR alone is insufficient", p07["proofGate"])
'''
          if 'MAINLINE CONVERGENCE CONTRACT' not in text:
              if old not in text:
                  raise SystemExit('P07 focused-test anchor missing')
              text = text.replace(old, new, 1)
              test_path.write_text(text, encoding='utf-8')

          green_test = Path('tests/test_green_branch_integration_policy.py')
          green_test.write_text('''from __future__ import annotations

import json
import sys
import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
SCRIPTS = ROOT / "scripts"
if str(SCRIPTS) not in sys.path:
    sys.path.insert(0, str(SCRIPTS))

import build_prompt_kit_registry


class GreenBranchIntegrationPolicyTests(unittest.TestCase):
    @classmethod
    def setUpClass(cls) -> None:
        cls.policy = json.loads((ROOT / "registry" / "prompts" / "actionable-next-step-policy.v1.json").read_text(encoding="utf-8"))
        cls.prompts = {prompt["id"]: prompt for prompt in build_prompt_kit_registry.load_prompt_registry()}

    def test_policy_defines_fail_closed_default_branch_merge_gate(self) -> None:
        self.assertEqual(self.policy["integration_marker"], "GREEN BRANCH INTEGRATION CONTRACT")
        self.assertIn("main", self.policy["integration_target"])
        conditions = "\\n".join(self.policy["green_merge_conditions"]).lower()
        for phrase in ("exact current head", "required repository checks", "owning harness validators", "dependencies", "blocking review", "merge authority"):
            self.assertIn(phrase, conditions)
        exceptions = "\\n".join(self.policy["merge_exceptions"]).lower()
        for phrase in ("user explicitly requested", "pending or failing", "head moved", "unrelated", "denies merge authority"):
            self.assertIn(phrase, exceptions)

    def test_every_effective_prompt_receives_green_integration_contract(self) -> None:
        marker = self.policy["integration_marker"]
        for prompt in self.prompts.values():
            with self.subTest(prompt=prompt["id"]):
                self.assertIn(marker, prompt["copyContent"])
                self.assertIn("merge it into the current default branch in the same run", prompt["nextStep"])

    def test_p07_is_stricter_than_global_policy_about_branch_only_completion(self) -> None:
        p07 = self.prompts["P07"]
        content = p07["copyContent"]
        self.assertIn("MAINLINE CONVERGENCE CONTRACT", content)
        self.assertIn("Do not create a new feature branch or pull request merely because repository work was requested", content)
        self.assertIn("execution lane, not a completion artifact", content)
        self.assertIn("Do not stop at push, PR-open, review-ready, or green-status reporting", content)
        self.assertIn("verify that it contains the intended behavior/artifact", content)
        self.assertIn("not a valid terminal state", content)

    def test_green_pr_status_is_explicitly_not_terminal(self) -> None:
        forbidden = "\\n".join(self.policy["forbidden_solo_actions"]).lower()
        self.assertIn("report that a pull request is green without merging it", forbidden)
        appendix = self.policy["copy_content_appendix"].lower()
        self.assertIn("do not merely report that it is green", appendix)
        self.assertIn("open pr, pushed feature branch, or green status is not a valid terminal state", appendix)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
      - name: Build and validate Prompt Kit
        run: |
          python -m py_compile tests/test_actionable_prompt_registry.py tests/test_green_branch_integration_policy.py scripts/build_prompt_kit_registry.py
          python -m json.tool docs/prompts.json >/dev/null
          python -m json.tool registry/prompts/actionable-next-step-policy.v1.json >/dev/null
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_actionable_prompt_registry tests.test_green_branch_integration_policy -v
          python tests/test_prompt_kit_discovery.py
          python tests/test_prompt_language_audit.py
          git diff --check
      - name: Commit durable refresh and remove temporary runner
        run: |
          git rm --ignore-unmatch .github/workflows/_tmp-refresh-p07-mainline-convergence.yml
          git add docs/prompts.json registry/prompts/actionable-next-step-policy.v1.json tests/test_actionable_prompt_registry.py tests/test_green_branch_integration_policy.py web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): require P7 mainline convergence'
          git push origin HEAD:feat/green-branch-integration-default-20260808