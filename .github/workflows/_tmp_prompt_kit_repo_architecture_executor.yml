name: Temporary Prompt Kit repository architecture diagnostic

on:
  push:
    branches:
      - feat/prompt-kit-repo-architecture-hosting-20260903

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact mutation preconditions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          prompts = json.loads(Path('docs/prompts.json').read_text(encoding='utf-8'))
          spec = json.loads(Path('registry/prompts/spec-architecture-prompts.v1.json').read_text(encoding='utf-8'))
          tests = Path('tests/test_prompt_registry_expansion_regression_design_teach.py').read_text(encoding='utf-8')
          p03 = next(p for p in prompts if p.get('id') == 'P03')
          p95 = next(p for p in spec['prompts'] if p.get('id') == 'P95')
          compact = '''\n1C. CHOOSE THE DEPLOYMENT OPERATING MODEL FROM EVIDENCE\nCompare: managed PaaS/serverless for velocity and low ops; one host with OCI containers via Docker or Podman for low-cost control; Kubernetes/managed orchestration only for demonstrated horizontal scaling, HA/isolation, or spiky distributed load. “Millions someday” is not proof; keep an upgrade seam. Record the chosen/rejected tier and migration triggers: saturation, p95/p99/SLO, queues/connections, RTO/RPO, toil, and cost.\n'''
          report = {
              'p03_anchor': 'FIRST-SPRINT SELECTION RULES\n' in p03['copyContent'],
              'p95_anchor': '\n2. BUILD A PRECISE DOMAIN VOCABULARY\n' in p95['copyContent'],
              'p95_copy_length_before': len(p95['copyContent']),
              'p95_copy_length_after_compact': len(p95['copyContent']) + len(compact),
              'focused_test_anchor': '    def test_teach_prompt_is_grounded_stateful_and_active(self) -> None:\n' in tests,
              'existing_greenfield_p03': 'GREENFIELD REPOSITORY CREATION' in p03['copyContent'],
              'existing_hosting_p95': 'CHOOSE THE DEPLOYMENT OPERATING MODEL FROM EVIDENCE' in p95['copyContent'],
          }
          Path('.tmp_prompt_architecture_diag.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY
      - name: Commit diagnostic receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp_prompt_architecture_diag.json
          git commit -m "chore(prompt-kit): record architecture mutation diagnostics"
          git push origin HEAD:feat/prompt-kit-repo-architecture-hosting-20260903
