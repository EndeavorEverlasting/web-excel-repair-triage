name: AFK Agent Flow migration executor

on:
  push:
    branches:
      - feat/afk-agent-flow-brand-route-20260911
    paths:
      - .github/workflows/afk-agent-flow-migration-executor.yml
      - scripts/migrate_afk_agent_flow_brand.py

permissions:
  contents: write

concurrency:
  group: afk-agent-flow-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply canonical migration and prove owned surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/afk-agent-flow-brand-route-20260911"
          python scripts/migrate_afk_agent_flow_brand.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_operant_product_identity.py")
          text = path.read_text(encoding="utf-8")
          old = 'self.assertIn("legacy `prompt-kit` paths", governance)'
          new = 'self.assertIn("legacy `operant` / `prompt-kit` paths", governance)'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("focused governance assertion is neither pre- nor post-migration form")
          PY
          python scripts/operant_version.py validate
          python scripts/validate_operant_product_identity.py --summary
          python -m unittest tests.test_operant_product_identity tests.test_prompt_kit_order_navigation_product -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git status --short

      - name: Commit and push validated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            AGENTS.md \
            build_prompt_kit.py \
            scripts/operant_version.py \
            tests/test_operant_product_identity.py \
            tests/test_prompt_kit_order_navigation_product.py \
            PROMPT_KIT_ACCESS.md \
            OPEN_PROMPT_KIT_ON_PHONE.md \
            README.md \
            CAPABILITIES.md \
            CODEBASE_MAP.md \
            WORKFLOW.md \
            harness/reports/PROMPT_KIT_RELEASE_IDENTITY.md \
            harness/reports/PROMPT_KIT_FRESHNESS.md \
            docs/REPOSITORY_PRESENTATION.md \
            .ai/skills/technician-prompt-kit-acquisition/SKILL.md \
            web/prompt-kit/index.html
          if git diff --cached --quiet; then
            echo "Migration already applied; no commit required."
            exit 0
          fi
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(afk-agent-flow): complete canonical brand migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
