name: AFK Agent Flow migration executor

on:
  push:
    branches:
      - feat/afk-agent-flow-brand-route-20260911
    paths:
      - .github/workflows/afk-agent-flow-migration-executor.yml

permissions:
  contents: write

concurrency:
  group: afk-agent-flow-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Repair canonical migration owner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/migrate_afk_agent_flow_brand.py")
          text = path.read_text(encoding="utf-8")

          if 'self.assertIn("compatibility and historical release identifiers", access)' not in text:
              access_anchor = 'self.assertTrue(access.startswith("# Get Operant"))'
              anchor_index = text.find(access_anchor)
              if anchor_index < 0:
                  raise SystemExit("migration access-test owner drifted")
              block_end = text.find("\n    )", anchor_index)
              if block_end < 0:
                  raise SystemExit("migration access-test block end drifted")
              block_end += len("\n    )")
              addition = '''    apply(
                  "tests/test_operant_product_identity.py",
                  'self.assertIn("legacy `prompt-kit` paths", governance)',
                  'self.assertIn("legacy `operant` / `prompt-kit` paths", governance)',
                  expected=1,
              )
              apply(
                  "tests/test_operant_product_identity.py",
                  'self.assertIn("compatibility paths", access)',
                  'self.assertIn("compatibility and historical release identifiers", access)',
                  expected=1,
              )'''
              text = text[:block_end] + "\n" + addition + text[block_end:]

          if "The public-route sweep above also touches the prompt-kit URL embedded" not in text:
              route_marker = "    # Keep technical internal Prompt Kit path names, but make the main mobile\n"
              route_index = text.find(route_marker)
              if route_index < 0:
                  raise SystemExit("migration compatibility insertion point drifted")
              route_addition = '''    # The public-route sweep above also touches the prompt-kit URL embedded
              # in the transition note. Restore that documented compatibility alias
              # while keeping /afk-agent-flow/ canonical everywhere else.
              apply(
                  "PROMPT_KIT_ACCESS.md",
                  f"Legacy public compatibility URLs remain {LEGACY_OPERANT_URL} and {NEW_PUBLIC_URL}.",
                  f"Legacy public compatibility URLs remain {LEGACY_OPERANT_URL} and {OLD_PUBLIC_URL}.",
                  expected=1,
              )

          '''
              text = text[:route_index] + route_addition + text[route_index:]

          if 'ensure_contains("PROMPT_KIT_ACCESS.md", OLD_PUBLIC_URL)' not in text:
              proof_anchor = '    ensure_contains("PROMPT_KIT_ACCESS.md", LEGACY_OPERANT_URL)\n'
              proof_index = text.find(proof_anchor)
              if proof_index < 0:
                  raise SystemExit("migration compatibility proof point drifted")
              insert_at = proof_index + len(proof_anchor)
              text = text[:insert_at] + '    ensure_contains("PROMPT_KIT_ACCESS.md", OLD_PUBLIC_URL)\n' + text[insert_at:]

          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile scripts/migrate_afk_agent_flow_brand.py
          git diff --check -- scripts/migrate_afk_agent_flow_brand.py

      - name: Apply canonical migration and prove owned surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/afk-agent-flow-brand-route-20260911"
          python scripts/migrate_afk_agent_flow_brand.py
          python scripts/operant_version.py validate
          python scripts/validate_operant_product_identity.py --summary
          python -m unittest tests.test_operant_product_identity tests.test_prompt_kit_order_navigation_product -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git status --short

      - name: Commit and push validated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/afk-agent-flow-migration-executor.yml
          git add -- \
            AGENTS.md \
            build_prompt_kit.py \
            scripts/migrate_afk_agent_flow_brand.py \
            scripts/operant_version.py \
            tests/test_operant_product_identity.py \
            tests/test_prompt_kit_order_navigation_product.py \
            PROMPT_KIT_ACCESS.md \
            OPEN_PROMPT_KIT_ON_PHONE.md \
            README.md \
            CAPABILITIES.md \
            CODEBASE_MAP.md \
            WORKFLOW.md \
            harness/reports/PROMPT_KIT_RELEASE_IDENTITY.md \
            harness/reports/PROMPT_KIT_FRESHNESS.md \
            docs/REPOSITORY_PRESENTATION.md \
            .ai/skills/technician-prompt-kit-acquisition/SKILL.md \
            web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(afk-agent-flow): complete canonical brand migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
