name: AFK Agent Flow migration executor

on:
  push:
    branches:
      - feat/afk-agent-flow-brand-route-20260911
    paths:
      - .github/workflows/afk-agent-flow-migration-executor.yml
      - scripts/migrate_afk_agent_flow_brand.py

permissions:
  contents: write

concurrency:
  group: afk-agent-flow-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Repair migration owner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/migrate_afk_agent_flow_brand.py")
          text = path.read_text(encoding="utf-8")

          tests_anchor = '''    apply(
              "tests/test_operant_product_identity.py",
              'self.assertTrue(access.startswith("# Get Operant"))',
              'self.assertTrue(access.startswith("# Get AFK Agent Flow"))',
              expected=1,
          )

          apply(
              "tests/test_prompt_kit_order_navigation_product.py",'''
          tests_replacement = '''    apply(
              "tests/test_operant_product_identity.py",
              'self.assertTrue(access.startswith("# Get Operant"))',
              'self.assertTrue(access.startswith("# Get AFK Agent Flow"))',
              expected=1,
          )
          apply(
              "tests/test_operant_product_identity.py",
              'self.assertIn("legacy `prompt-kit` paths", governance)',
              'self.assertIn("legacy `operant` / `prompt-kit` paths", governance)',
              expected=1,
          )
          apply(
              "tests/test_operant_product_identity.py",
              'self.assertIn("compatibility paths", access)',
              'self.assertIn("compatibility and historical release identifiers", access)',
              expected=1,
          )

          apply(
              "tests/test_prompt_kit_order_navigation_product.py",'''
          if tests_anchor in text:
              text = text.replace(tests_anchor, tests_replacement, 1)
          elif 'self.assertIn("compatibility and historical release identifiers", access)' not in text:
              raise SystemExit("migration test-owner anchor drifted")

          route_anchor = '''    # Keep technical internal Prompt Kit path names, but make the main mobile
              # instructions and visible title current where exact text is known.'''
          route_replacement = '''    # The generic public-route replacement above also touches the legacy
              # /prompt-kit/ URL in the transition note. Restore that compatibility
              # alias explicitly while keeping /afk-agent-flow/ canonical elsewhere.
              apply(
                  "PROMPT_KIT_ACCESS.md",
                  "Legacy public compatibility URLs remain https://endeavoreverlasting.github.io/web-excel-repair-triage/operant/ and https://endeavoreverlasting.github.io/web-excel-repair-triage/afk-agent-flow/.",
                  "Legacy public compatibility URLs remain https://endeavoreverlasting.github.io/web-excel-repair-triage/operant/ and https://endeavoreverlasting.github.io/web-excel-repair-triage/prompt-kit/.",
                  expected=1,
              )

              # Keep technical internal Prompt Kit path names, but make the main mobile
              # instructions and visible title current where exact text is known.'''
          if route_anchor in text:
              text = text.replace(route_anchor, route_replacement, 1)
          elif "The generic public-route replacement above also touches the legacy" not in text:
              raise SystemExit("migration route-repair anchor drifted")

          contains_anchor = '''    ensure_contains("PROMPT_KIT_ACCESS.md", LEGACY_OPERANT_URL)
              ensure_contains("PROMPT_KIT_ACCESS.md", NEW_PUBLIC_URL)'''
          contains_replacement = '''    ensure_contains("PROMPT_KIT_ACCESS.md", LEGACY_OPERANT_URL)
              ensure_contains("PROMPT_KIT_ACCESS.md", OLD_PUBLIC_URL)
              ensure_contains("PROMPT_KIT_ACCESS.md", NEW_PUBLIC_URL)'''
          if contains_anchor in text:
              text = text.replace(contains_anchor, contains_replacement, 1)
          elif 'ensure_contains("PROMPT_KIT_ACCESS.md", OLD_PUBLIC_URL)' not in text:
              raise SystemExit("migration compatibility-proof anchor drifted")

          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile scripts/migrate_afk_agent_flow_brand.py
          git diff --check -- scripts/migrate_afk_agent_flow_brand.py

      - name: Apply canonical migration and prove owned surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/afk-agent-flow-brand-route-20260911"
          python scripts/migrate_afk_agent_flow_brand.py
          python scripts/operant_version.py validate
          python scripts/validate_operant_product_identity.py --summary
          python -m unittest tests.test_operant_product_identity tests.test_prompt_kit_order_navigation_product -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git status --short

      - name: Commit and push validated migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            AGENTS.md \
            build_prompt_kit.py \
            scripts/migrate_afk_agent_flow_brand.py \
            scripts/operant_version.py \
            tests/test_operant_product_identity.py \
            tests/test_prompt_kit_order_navigation_product.py \
            PROMPT_KIT_ACCESS.md \
            OPEN_PROMPT_KIT_ON_PHONE.md \
            README.md \
            CAPABILITIES.md \
            CODEBASE_MAP.md \
            WORKFLOW.md \
            harness/reports/PROMPT_KIT_RELEASE_IDENTITY.md \
            harness/reports/PROMPT_KIT_FRESHNESS.md \
            docs/REPOSITORY_PRESENTATION.md \
            .ai/skills/technician-prompt-kit-acquisition/SKILL.md \
            web/prompt-kit/index.html
          if git diff --cached --quiet; then
            echo "Migration already applied; no commit required."
            exit 0
          fi
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(afk-agent-flow): complete canonical brand migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
