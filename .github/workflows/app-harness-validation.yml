name: App harness validation

on:
  push:
    branches:
      - fix/prompt-kit-mobile-direct-p-id-20260907

permissions:
  contents: write

jobs:
  mobile-direct-prompt-id-sprint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact sprint branch
        uses: actions/checkout@v7
        with:
          ref: fix/prompt-kit-mobile-direct-p-id-20260907
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fresh floor gate
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git branch --show-current
          git log --oneline --decorate -5
          git fetch --all --prune --tags
          echo "candidate=$(git rev-parse HEAD)"
          echo "main=$(git rev-parse origin/main)"
          git merge-base --is-ancestor origin/main HEAD || {
            echo 'Current main moved after this sprint branch was cut; fail closed before mutation.' >&2
            exit 41
          }
      - name: Implement direct known-ID phone journey
        shell: bash
        run: |
          set -euo pipefail
          python scripts/execute_mobile_prompt_jump_sprint.py
          node --check docs/prompt-kit-polish.js
      - name: Regenerate canonical Prompt Kit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Focused and connected validation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_prompt_kit_mobile \
            tests.test_prompt_kit_mobile_quick_controls \
            tests.test_prompt_kit_product_interactions \
            tests.test_prompt_kit_hotkey_completion \
            tests.test_ux_design_prompt_suite -v
          git diff --check
      - name: Android-width Chromium journey
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python tests/prompt_kit_mobile_quick_controls_browser_proof.py
      - name: Deliberate second-pass review
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Go to P#' docs/prompt-kit-polish.js
          grep -Fq 'type **111**' OPEN_PROMPT_KIT_ON_PHONE.md
          grep -Fq 'mobilePromptJumpToggle' web/prompt-kit/index.html
          ! grep -Fq 'SWIPE HERE' docs/prompt-kit-polish.js
          ! grep -Fq 'MOBILE_QUICK_GESTURE_THRESHOLD' docs/prompt-kit-polish.js
          ! grep -Fq 'mobileQuickGestureMap' web/prompt-kit/index.html
          git diff --check
          git diff --stat
          git diff -- docs/prompt-kit-polish.js tests/test_prompt_kit_mobile_quick_controls.py tests/prompt_kit_mobile_quick_controls_browser_proof.py harness/contracts/prompt-kit-mobile.v1.json OPEN_PROMPT_KIT_ON_PHONE.md | sed -n '1,1200p'
      - name: Commit durable product result and restore canonical workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/execute_mobile_prompt_jump_sprint.py
          git checkout origin/main -- .github/workflows/app-harness-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prompt-kit-polish.js tests/test_prompt_kit_mobile_quick_controls.py tests/prompt_kit_mobile_quick_controls_browser_proof.py harness/contracts/prompt-kit-mobile.v1.json OPEN_PROMPT_KIT_ON_PHONE.md web/prompt-kit/index.html scripts/execute_mobile_prompt_jump_sprint.py .github/workflows/app-harness-validation.yml
          git diff --cached --check
          git diff --cached --stat
          git status --short
          git commit -m 'fix(prompt-kit): add direct mobile prompt ID jump'
          git push origin HEAD:fix/prompt-kit-mobile-direct-p-id-20260907
