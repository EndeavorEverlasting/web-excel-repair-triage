name: App harness validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-harness-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse validator and focused tests
        run: python -m py_compile scripts/validate_app_harness.py tests/test_app_harness_validator.py
      - name: Focused P11 contract tests
        run: python -m unittest tests.test_app_harness_validator -v
      - name: One canonical offline harness proof
        run: python scripts/validate_app_harness.py --output Outputs/app-harness-validation.json
      - name: Patch hygiene
        run: git diff --check
      - name: Upload exact-head synthetic harness receipt
        uses: actions/upload-artifact@v4
        with:
          name: app-harness-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: Outputs/app-harness-validation.json
          if-no-files-found: error
