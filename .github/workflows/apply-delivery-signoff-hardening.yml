name: apply-delivery-signoff-hardening

on:
  push:
    branches:
      - feat/delivery-signoff-generator-20260805
    paths:
      - '.github/delivery-signoff-hardening/**'
      - '.github/workflows/apply-delivery-signoff-hardening.yml'

permissions:
  contents: write

concurrency:
  group: delivery-signoff-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-validated-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct and verify bounded archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/delivery-signoff-hardening/part-* | base64 --decode > /tmp/delivery-signoff-hardening.tar.gz
          echo '84637941efc4cf261ae7a51932c74099b19bdaee408b2dc44c62328f2403b069  /tmp/delivery-signoff-hardening.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/delivery-signoff-hardening.tar.gz | tee /tmp/delivery-signoff-hardening-files.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/delivery-signoff-hardening-files.txt; then
            echo 'Archive contains an unsafe path' >&2
            exit 1
          fi
          tar -xzf /tmp/delivery-signoff-hardening.tar.gz
          sed -i 's#ROOT / "trigger.json"#ROOT / "triggers/delivery-signoff-generation.json"#' tests/test_delivery_signoff_trigger.py
          grep -F 'triggers/delivery-signoff-generation.json' tests/test_delivery_signoff_trigger.py
          chmod +x scripts/generate_delivery_signoff.py scripts/validate_delivery_signoff_harness.py scripts/evaluate_delivery_signoff_trigger.py .githooks/pre-commit-delivery-signoff
      - name: Install render and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Validate extracted implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_delivery_signoff_generator.py tests/test_delivery_signoff_harness_validator.py tests/test_delivery_signoff_trigger.py
          python scripts/validate_delivery_signoff_harness.py
          python -m py_compile triage/delivery_signoff/*.py scripts/generate_delivery_signoff.py scripts/evaluate_delivery_signoff_trigger.py scripts/validate_delivery_signoff_harness.py
          python scripts/generate_delivery_signoff.py tests/fixtures/delivery_signoff/melville_3hq_20260805.json --output-root Outputs/delivery-signoff/migration-proof
          python scripts/generate_delivery_signoff.py tests/fixtures/delivery_signoff/huntington_hospital_20260805.json --output-root Outputs/delivery-signoff/migration-proof
          find Outputs/delivery-signoff/migration-proof -name delivery-signoff-artifact-manifest.json -print0 | xargs -0 -n1 python scripts/validate_delivery_signoff_harness.py --manifest
          rm -rf Outputs/delivery-signoff/migration-proof
          git diff --check
      - name: Commit validated non-workflow implementation
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/delivery-signoff-generator.yml .github/workflows/delivery-signoff-harness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            triage/delivery_signoff \
            scripts/generate_delivery_signoff.py \
            scripts/validate_delivery_signoff_harness.py \
            scripts/evaluate_delivery_signoff_trigger.py \
            tests/test_delivery_signoff_generator.py \
            tests/test_delivery_signoff_harness_validator.py \
            tests/test_delivery_signoff_trigger.py \
            tests/fixtures/delivery_signoff_trigger \
            .githooks/pre-commit-delivery-signoff \
            capabilities/delivery-signoff-generation.json \
            triggers/delivery-signoff-generation.json \
            harness/delivery-signoff \
            skills/delivery-signoff-generation/SKILL.md \
            reports/harness/delivery-signoff-state.md \
            configs/delivery_signoff_layout_v1.json
          git diff --cached --check
          git commit -m 'fix(signoff): harden generation and proof contracts'
          git push origin HEAD:"${GITHUB_REF_NAME}"
