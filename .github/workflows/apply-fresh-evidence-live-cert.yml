name: Apply fresh evidence and live cert hardening

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/prompt-kit-fresh-evidence-live-cert-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-fresh-evidence-live-cert-20260819
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover pinned post-194 migration helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin ca766e4982ecf5041ee05ef5f2318ef5e284ad80
          git cherry-pick ca766e4982ecf5041ee05ef5f2318ef5e284ad80
          python -m py_compile scripts/_fresh_evidence_live_cert_patch.py
      - name: Apply and validate durable hardening
        run: |
          python scripts/_fresh_evidence_live_cert_patch.py
          python -m py_compile scripts/build_prompt_kit_registry.py tests/test_remote_freshness_p13_iteration.py
          python -m json.tool docs/prompts.json > /dev/null
          python -m json.tool registry/prompts/actionable-next-step-policy.v1.json > /dev/null
          python -m unittest tests.test_remote_freshness_p13_iteration -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python -m unittest tests.test_green_branch_integration_policy -v
          python scripts/validate_context_architecture.py --summary
          python -m unittest tests.test_context_architecture -v
      - name: Rebuild and prove Prompt Kit
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_prompt_language_audit -v
          git diff --check
      - name: Commit only durable implementation
        run: |
          git rm -f scripts/_fresh_evidence_live_cert_patch.py
          git add docs/prompts.json registry/prompts/actionable-next-step-policy.v1.json harness/specs/operator-delivery.md tests/test_remote_freshness_p13_iteration.py web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): refresh build and live-cert evidence floors'
          git push origin HEAD:feat/prompt-kit-fresh-evidence-live-cert-20260819
