name: Apply management prompt integration

on:
  push:
    branches:
      - feat/prompt-kit-management-operations-20260815
    paths:
      - .github/workflows/apply-management-prompts.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-management-operations-20260815
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Register management prompts in canonical builder
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          path = 'scripts/build_prompt_kit_registry.py'
          replace_exact(
              path,
              '    REPO_ROOT / "registry" / "prompts" / "repository-work-ledger-prompts.v1.json",\n)',
              '    REPO_ROOT / "registry" / "prompts" / "repository-work-ledger-prompts.v1.json",\n    REPO_ROOT / "registry" / "prompts" / "management-operations-prompts.v1.json",\n)',
          )
          replace_exact(
              path,
              'CORRESPONDENCE_RUNTIME = REPO_ROOT / "docs" / "prompt-kit-correspondence.js"\n',
              'CORRESPONDENCE_RUNTIME = REPO_ROOT / "docs" / "prompt-kit-correspondence.js"\nMANAGEMENT_RUNTIME = REPO_ROOT / "docs" / "prompt-kit-management.js"\n',
          )
          replace_exact(
              path,
              '    correspondence_script = _read_runtime(\n        CORRESPONDENCE_RUNTIME, "Prompt Kit correspondence profile behavior"\n    )\n',
              '    correspondence_script = _read_runtime(\n        CORRESPONDENCE_RUNTIME, "Prompt Kit correspondence profile behavior"\n    )\n    management_script = _read_runtime(\n        MANAGEMENT_RUNTIME, "Prompt Kit management profile behavior"\n    )\n',
          )
          replace_exact(
              path,
              '        f"<script>\\n{correspondence_script}\\n</script>\\n"\n    )\n',
              '        f"<script>\\n{correspondence_script}\\n</script>\\n"\n        f"<script>\\n{management_script}\\n</script>\\n"\n    )\n',
          )
          PY
      - name: Validate management prompt integration
        run: |
          python -m py_compile scripts/build_prompt_kit_registry.py tests/test_management_operations_prompt_registry.py
          node --check docs/prompt-kit-management.js
          python -m unittest tests.test_management_operations_prompt_registry -v
          python -m unittest tests.test_correspondence_prompt_registry -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python scripts/evaluate_prompt_language.py --summary
      - name: Regenerate canonical Prompt Kit
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit integrated builder and generated site
        run: |
          git config user.name "EndeavorEverlasting"
          git config user.email "71802818+EndeavorEverlasting@users.noreply.github.com"
          git add scripts/build_prompt_kit_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "feat(prompt-kit): integrate management operation profiles"
          git push origin HEAD:feat/prompt-kit-management-operations-20260815
