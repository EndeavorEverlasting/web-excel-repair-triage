name: Apply NTH review fixes

on:
  push:
    branches:
      - feat/nth-qualitative-admin-profile-20260819
    paths:
      - '.github/workflows/apply-nth-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nth-qualitative-admin-profile-20260819
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/nth-review-fix.b64 <<'EOF'

EOF
          base64 -d /tmp/nth-review-fix.b64 > /tmp/nth-review-fix.tar.gz
          tar -xzf /tmp/nth-review-fix.tar.gz -C .
          python -m py_compile \
            triage/nth_qualitative_admin/model.py \
            triage/nth_qualitative_admin/builder.py \
            triage/nth_qualitative_admin/validator.py \
            scripts/validate_nth_qualitative_admin.py \
            tests/test_nth_qualitative_admin.py
          python scripts/validate_nth_qualitative_admin.py --profile-only --summary
          git diff --check
          git add \
            triage/nth_qualitative_admin/model.py \
            triage/nth_qualitative_admin/builder.py \
            triage/nth_qualitative_admin/validator.py \
            triage/nth_qualitative_admin/templates/theme1.xml \
            scripts/validate_nth_qualitative_admin.py \
            tests/test_nth_qualitative_admin.py
          if git diff --cached --quiet; then
            echo 'No review fixes to commit.'
            exit 0
          fi
          git config user.name 'EndeavorEverlasting'
          git config user.email '71802818+EndeavorEverlasting@users.noreply.github.com'
          git commit -m 'fix(nth): harden evidence and package validation'
          git push origin HEAD:feat/nth-qualitative-admin-profile-20260819
