name: Apply Prompt Kit portability integration

on:
  push:
    branches:
      - feat/prompt-kit-portable-favorites-20260806
    paths:
      - scripts/_apply_prompt_kit_portability_patch.py
      - .github/workflows/apply-prompt-kit-portability.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply bounded source integration and rebuild canonical site
        run: python scripts/_apply_prompt_kit_portability_patch.py
      - name: Compile focused portability surfaces
        run: |
          python -m py_compile \
            build_prompt_kit.py \
            scripts/validate_prompt_kit_portability.py \
            tests/test_prompt_kit_portability.py
      - name: Validate portable runtime syntax
        run: node --check docs/prompt-kit-favorites-portability.js
      - name: Validate portable Favorites and harness discipline
        run: |
          python scripts/validate_prompt_kit_portability.py --summary
          python -m unittest tests.test_prompt_kit_portability -v
      - name: Validate existing discovery and generated parity
        run: |
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Validate repository hygiene
        run: |
          python -m triage.gitignore_hygiene
          git diff --check
      - name: Commit integrated portable Favorites implementation
        run: |
          test ! -e .github/workflows/apply-prompt-kit-portability.yml
          test ! -e scripts/_apply_prompt_kit_portability_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(prompt-kit): make favorites portable across upgrades"
          git push origin HEAD:feat/prompt-kit-portable-favorites-20260806
