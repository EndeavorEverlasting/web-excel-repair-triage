name: Finalize guided Prompt Kit recommendations

on:
  push:
    branches:
      - feat/prompt-kit-guided-recommendations-20260806
    paths:
      - scripts/_finalize_prompt_kit_guided_recommendations.py
      - .github/workflows/apply-prompt-kit-portability.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate canonical site and remove temporary finalizer
        run: python scripts/_finalize_prompt_kit_guided_recommendations.py
      - name: Compile guided recommendation surfaces
        run: |
          python -m py_compile \
            scripts/build_prompt_kit_registry.py \
            scripts/validate_prompt_kit_discovery.py \
            tests/test_prompt_kit_discovery.py \
            tests/test_skill_prompt_registry.py
      - name: Validate Prompt Kit JavaScript syntax
        run: |
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-guided-recommendations.js
      - name: Validate guided discovery and exact generated parity
        run: |
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery tests.test_skill_prompt_registry -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Validate repository hygiene
        run: git diff --check
      - name: Commit canonical guided Prompt Kit artifact
        run: |
          test ! -e .github/workflows/apply-prompt-kit-portability.yml
          test ! -e scripts/_finalize_prompt_kit_guided_recommendations.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build(prompt-kit): regenerate guided Prompt Kit"
          git push origin HEAD:feat/prompt-kit-guided-recommendations-20260806
