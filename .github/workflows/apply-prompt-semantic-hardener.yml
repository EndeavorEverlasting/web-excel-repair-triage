name: Apply Prompt Semantic Hardener contribution

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  contribute:
    if: github.head_ref == 'feat/prompt-kit-prompt-semantic-hardener-p86-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-prompt-semantic-hardener-p86-20260819
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add prompt through repo-owned helper
        run: |
          cat > "$RUNNER_TEMP/prompt-hardener-draft.json" <<'JSON'
          {
            "name": "Prompt Semantic Hardener & Principle Integrator",
            "type": "MAINTENANCE + HARDEN",
            "class": "PROMPT KIT / PROMPT ARCHITECTURE",
            "sprintRole": "Audit one existing Prompt Kit prompt against stronger compatible principles already proven elsewhere in the current registry, then harden that same canonical prompt without duplicating shared policy or changing its identity unnecessarily.",
            "useWhen": "An existing prompt still works but is older, thinner, or semantically weaker than newer Prompt Kit patterns; for example P03 may need compatible principles now present in P07, P13, P48, P76, P83, P84, P85, or shared policy owners.",
            "inspectFirst": "Current main/PR/evidence floor; target prompt in both raw and effective registry form; target registry/profile owner; shared prompt policies; the smallest set of stronger related prompts; target-focused tests; generated Prompt Kit parity and current review/CI evidence.",
            "expectedOutput": "The same target prompt identity hardened through a documented principle-applicability matrix, minimal compatible semantic edits, focused regression proof, bounded source size, exact generated-site parity, and integration to main when authorized.",
            "nextStep": "Select the named target prompt, compare its raw and effective behavior to the strongest relevant peers and shared owners, apply only compatible missing principles, add focused semantic regression proof, validate exact site parity, and converge the exact green head to main.",
            "proofGate": "The target retains its identity and primary role; every added principle has a current donor or policy owner plus an applicability reason; inherited policy is not recopied into raw source; incompatible or irrelevant principles are rejected explicitly; old required semantics and new hardening semantics are both tested; raw prompt size stays bounded; generated-site parity and exact-head integration proof pass.",
            "copyContent": "HARDEN ONE EXISTING PROMPT USING THE STRONGEST COMPATIBLE PRINCIPLES ALREADY PROVEN ELSEWHERE IN THE CURRENT PROMPT KIT. MODIFY THE CANONICAL TARGET; DO NOT CREATE A DUPLICATE PROMPT JUST TO IMPROVE IT.\n\nTarget prompt: xyz_prompt_id_or_name_or_resolve_from_immediately_preceding_context\nSpecific weakness, if known: xyz_known_gap_or_infer_from_evidence\n\nMISSION\nMake an existing prompt materially stronger without turning it into a collage of every rule in the Prompt Kit. Preserve the target's identity, role, registry/profile, and useful semantics. Find stronger current patterns, decide which actually apply, harden the target source and focused tests, rebuild through canonical machinery, and integrate the exact validated result.\n\n1. RESOLVE CURRENT TRUTH\nWork from current repository/provider truth, not remembered prompt text. Resolve the current target prompt, its owning raw registry record, its effective built form, current shared policy owners, focused tests, generated site, and overlapping prompt/PR work. If the prompt identity already has an owning hardening branch or PR, reuse or repair that owner instead of opening a competing lane. Refresh again immediately before final exact-head conclusions; if main, the target, a donor, or a shared owner moves materially, reclassify affected evidence and rerun the applicability/validation decisions it could change.\n\n2. RAW VS EFFECTIVE PROMPT\nRead both forms before editing. The raw registry record owns prompt-specific semantics. The effective prompt may also contain injected shared policy. Separate those layers so you do not paste global actionability, repository-freshness, integration, or other builder-owned boilerplate back into the source record. If a desired behavior is already inherited and effective, count it as present unless the raw prompt has a direct-consumer reason to carry a small prompt-specific version.\n\n3. HARVEST ONLY RELEVANT DONORS\nInspect the smallest useful set of stronger current prompts and shared owners that overlap the target's job. Candidate principles may include: fresh repository/evidence floors; exact artifact or commit identity; evidence-version invalidation; bounded implement/validate/critique iteration; continuous acceptance-gate progression without status spinning; autonomous agent work with a user-only escalation gate; fail-closed safety; source-of-truth precedence; proof ceilings; existing-work reuse and convergence; progressive disclosure/context restraint; interruption recovery from durable checkpoints; preservation of dirty or separately owned work; explicit acceptance criteria; anti-fabrication boundaries; canonical-owner selection instead of duplicated doctrine; and focused semantic regression. Do not assume every strong principle belongs in every target.\n\n4. BUILD A PRINCIPLE APPLICABILITY MATRIX\nBefore mutation, record a compact matrix with one row per candidate principle:\n- principle\n- current donor or canonical policy owner\n- already present in RAW, EFFECTIVE, BOTH, or ABSENT\n- target-specific gap or failure mode\n- COMPATIBLE, INCOMPATIBLE, or NOT NEEDED\n- minimal source change, shared-owner change, or NO CHANGE\n- focused proof that will show the decision is correct\nUse repository semantics and the target's purpose to decide applicability. A newer prompt is evidence of a pattern, not automatic authority over an unrelated prompt.\n\n5. HARDEN THE CANONICAL TARGET\nPatch the existing prompt record rather than renumbering or cloning it. Update only the semantic fields that need strengthening: usually inspectFirst, sprintRole, expectedOutput, nextStep, proofGate, copyContent, or keywords. Keep profile/color/category and identity stable unless the repository has a separate explicit reason to change them. Reuse concise named concepts instead of copying whole donor sections. If the correct fix belongs in a shared policy or builder-owned contract, change that owner only when the requested scope genuinely applies to all affected prompts and run the broader regressions that ownership requires.\n\n6. P03 REFERENCE CASE\nWhen P03 / Repository Evidence + First Sprint Executor is the target, explicitly compare its older evidence-harvest/execution semantics with applicable current principles from P07 (iterative autonomous repo execution and convergence), P13 (bounded self-improvement and evidence critique), P48 (fresh subject/evidence pinning and stale-proof invalidation where certification-like proof is claimed), P76 (progressive disclosure and context restraint), P83 (treat completion/handoff claims as hypotheses until verified), P84 (continuous acceptance-gate progression, green-slice convergence, anti-spin, and resumable checkpoints), P85 (canonical-owner hardening, focused failure regressions, and avoiding duplicated doctrine), and the current shared policies. Adopt only principles that strengthen P03's actual discovery-plus-first-sprint job; do not transform P03 into P07, P13, P48, P76, P83, P84, or P85.\n\n7. ANTI-BLOAT / ANTI-CARGO-CULT GATE\nReject changes whose only rationale is 'another prompt has this.' Do not copy every strong rule into every prompt. Prefer inherited shared policy, compact references, or one target-specific sentence when they provide equivalent enforcement. Remove duplicated source prose introduced by the hardening pass. If the raw target grows materially, justify each added block against a concrete gap and look for a smaller formulation before accepting it.\n\n8. SEMANTIC REGRESSION PROOF\nExtend the closest existing focused test. Prove the target still retains its prior defining behavior and now contains the newly selected semantics. Add a negative/boundary assertion when useful so the test also proves the target did not absorb an incompatible donor role. Check the raw-source size or other anti-bloat boundary when practical. Do not replace semantic proof with a screenshot or generated-site presence test alone.\n\n9. VALIDATE AND ITERATE\nRun the target registry/helper validation, focused semantic test, applicable prompt-language/order/discovery/build checks, exact generated-site parity, and patch hygiene. Inspect the resulting diff and evidence for one deliberate second pass. If the hardening introduced duplicated policy, identity drift, weakened old behavior, stale generated output, an untested principle, unnecessary size growth, or a newly moved donor/base, repair it and rerun affected checks. Stop iterating only when no practical in-scope semantic improvement or regression remains.\n\nDELIVER\nReport the target prompt identity, donor/applicability decisions, semantic fields changed, focused proof, rejected incompatible principles, raw-size impact, helper/builder or registry validation, generated-site parity, commit/PR/merge state, and resulting main SHA or exact blocker. Keep the report compact. The success condition is a stronger prompt with clearer proof, not a larger prompt.",
            "keywords": [
              "prompt hardening",
              "harden prompt",
              "prompt semantic hardening",
              "prompt refactor",
              "strengthen prompt",
              "prompt audit",
              "principle integration",
              "cross-prompt principles",
              "prompt regression",
              "P03 hardening",
              "prompt architecture"
            ]
          }
          python scripts/prompt_registry_ops.py add --input "$RUNNER_TEMP/prompt-hardener-draft.json" --registry spec-architecture-prompts | tee "$RUNNER_TEMP/prompt-hardener-helper-receipt.json"
          cat "$RUNNER_TEMP/prompt-hardener-helper-receipt.json"
      - name: Add focused semantic regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_spec_architecture_prompt_registry.py')
          text = path.read_text(encoding='utf-8')
          marker = '\n\nif __name__ == "__main__":\n'
          if marker not in text:
              raise SystemExit('test module tail marker missing')
          method = '''
    def test_prompt_semantic_hardener_selectively_integrates_stronger_principles(self) -> None:
        matches = [
            prompt
            for prompt in self.full.values()
            if prompt["name"] == "Prompt Semantic Hardener & Principle Integrator"
        ]
        self.assertEqual(len(matches), 1)
        prompt = matches[0]
        content = prompt["copyContent"]
        raw_content = self.raw[prompt["id"]]["copyContent"]
        self.assertEqual(prompt["profile"], "spec-architecture")
        self.assertEqual(prompt["color"], "Cyan")
        self.assertEqual(prompt["class"], "PROMPT KIT / PROMPT ARCHITECTURE")
        self.assertIn("RAW VS EFFECTIVE PROMPT", content)
        self.assertIn("PRINCIPLE APPLICABILITY MATRIX", content)
        self.assertIn("COMPATIBLE, INCOMPATIBLE, or NOT NEEDED", content)
        self.assertIn("P03 REFERENCE CASE", content)
        for donor in ("P07", "P13", "P48", "P76", "P83", "P84", "P85"):
            self.assertIn(donor, content)
        self.assertIn("do not transform P03 into P07, P13, P48, P76, P83, P84, or P85", content)
        self.assertIn("Do not copy every strong rule into every prompt", content)
        self.assertIn("shared policy", content.lower())
        self.assertIn("Extend the closest existing focused test", content)
        self.assertIn("one deliberate second pass", content)
        self.assertIn("Refresh again immediately before final exact-head conclusions", content)
        self.assertLess(len(raw_content), 7600)
        self.assertGreater(len(raw_content), 3000)
        self.assertEqual(prompt["actionabilityPolicy"], self.policy["policy_id"])
        self.assertIn(self.policy["marker"], content)
        html = build_prompt_kit_registry.render()
        self.assertIn("Prompt Semantic Hardener & Principle Integrator", html)
'''
          if 'def test_prompt_semantic_hardener_selectively_integrates_stronger_principles' not in text:
              text = text.replace(marker, '\n' + method + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate contribution and Prompt Kit
        run: |
          python scripts/prompt_registry_ops.py validate | tee "$RUNNER_TEMP/prompt-hardener-validation-receipt.json"
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_prompt_language_audit -v
          python -m unittest tests.test_prompt_kit_order_navigation_contract tests.test_prompt_kit_discovery -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit durable contribution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/prompts/spec-architecture-prompts.v1.json tests/test_spec_architecture_prompt_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): add prompt semantic hardener'
          git push origin HEAD:feat/prompt-kit-prompt-semantic-hardener-p86-20260819
