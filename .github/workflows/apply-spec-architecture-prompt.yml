name: Apply spec architecture prompt integration

on:
  push:
    branches:
      - feat/prompt-kit-spec-progressive-disclosure-20260816
    paths:
      - .github/workflows/apply-spec-architecture-prompt.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-spec-progressive-disclosure-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Register spec prompt and discovery aliases
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          base = 'build_prompt_kit.py'
          replace_exact(
              base,
              '    "context engineering": "P68", "context pruning": "P68", "token pruning": "P68",\n',
              '    "context engineering": "P68", "context pruning": "P68", "token pruning": "P68",\n'
              '    "spec driven development": "P76", "spec-driven development": "P76",\n'
              '    "progressive disclosure": "P76", "harness bloat": "P76", "spec bloat": "P76",\n'
              '    "50000 ft": "P76", "30000 ft": "P76", "15000 ft": "P76",\n'
              '    "50,000 ft": "P76", "30,000 ft": "P76", "15,000 ft": "P76",\n',
          )

          builder = 'scripts/build_prompt_kit_registry.py'
          replace_exact(
              builder,
              '    REPO_ROOT / "registry" / "prompts" / "management-operations-prompts.v1.json",\n)',
              '    REPO_ROOT / "registry" / "prompts" / "management-operations-prompts.v1.json",\n'
              '    REPO_ROOT / "registry" / "prompts" / "spec-architecture-prompts.v1.json",\n)',
          )
          replace_exact(
              builder,
              'MANAGEMENT_RUNTIME = REPO_ROOT / "docs" / "prompt-kit-management.js"\n',
              'MANAGEMENT_RUNTIME = REPO_ROOT / "docs" / "prompt-kit-management.js"\n'
              'SPEC_ARCHITECTURE_RUNTIME = REPO_ROOT / "docs" / "prompt-kit-spec-architecture.js"\n',
          )
          replace_exact(
              builder,
              '    management_script = _read_runtime(\n        MANAGEMENT_RUNTIME, "Prompt Kit management profile behavior"\n    )\n',
              '    management_script = _read_runtime(\n        MANAGEMENT_RUNTIME, "Prompt Kit management profile behavior"\n    )\n'
              '    spec_architecture_script = _read_runtime(\n'
              '        SPEC_ARCHITECTURE_RUNTIME, "Prompt Kit spec architecture profile behavior"\n'
              '    )\n',
          )
          replace_exact(
              builder,
              '        f"<script>\\n{management_script}\\n</script>\\n"\n    )\n',
              '        f"<script>\\n{management_script}\\n</script>\\n"\n'
              '        f"<script>\\n{spec_architecture_script}\\n</script>\\n"\n'
              '    )\n',
          )
          PY
      - name: Regenerate canonical Prompt Kit
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Validate spec architecture integration
        run: |
          python -m py_compile build_prompt_kit.py scripts/build_prompt_kit_registry.py tests/test_spec_architecture_prompt_registry.py
          node --check docs/prompt-kit-spec-architecture.js
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_ai_engineering_level_up -v
          python -m unittest tests.test_management_operations_prompt_registry -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python -m unittest tests.test_prompt_kit_discovery -v
          python scripts/evaluate_prompt_language.py --summary
      - name: Commit integrated source and generated site
        run: |
          git config user.name "EndeavorEverlasting"
          git config user.email "71802818+EndeavorEverlasting@users.noreply.github.com"
          git add build_prompt_kit.py scripts/build_prompt_kit_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "feat(prompt-kit): integrate progressive disclosure spec prompt"
          git push origin HEAD:feat/prompt-kit-spec-progressive-disclosure-20260816
