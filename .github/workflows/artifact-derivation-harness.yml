name: Artifact derivation harness

on:
  pull_request:
    paths:
      - 'harness/artifact-derivation/**'
      - '.ai/skills/artifact-derivation/**'
      - 'scripts/validate_artifact_derivation_harness.py'
      - 'tests/test_artifact_derivation_harness.py'
      - '.githooks/**'
      - 'harness/CONTEXT.md'
  push:
    branches: [main]
    paths:
      - 'harness/artifact-derivation/**'
      - '.ai/skills/artifact-derivation/**'
      - 'scripts/validate_artifact_derivation_harness.py'
      - 'tests/test_artifact_derivation_harness.py'
      - '.githooks/**'
      - 'harness/CONTEXT.md'

jobs:
  artifact-derivation-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile
        run: python -m py_compile scripts/validate_artifact_derivation_harness.py tests/test_artifact_derivation_harness.py
      - name: Harness completeness
        run: python scripts/validate_artifact_derivation_harness.py --summary
      - name: Regression tests
        run: python -m unittest tests.test_artifact_derivation_harness -v
      - name: Existing root harness
        run: python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
      - name: Artifact hygiene
        run: python -m triage.gitignore_hygiene
      - name: Patch hygiene
        run: git diff --check
