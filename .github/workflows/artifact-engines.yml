name: Artifact engine tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  artifact-engines:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install openpyxl
          fi
          python -m pip install pytest

      - name: Import artifact engines
        run: |
          python -c "import triage.nw_prj_neuron_track_hours.cli; import triage.nw_prj_neuron_track_hours.bonita_cli; import triage.nth_qualitative_admin; import triage.nth_evidence_bounded_allocation; import triage.admin_billing_summary.cli; import triage.one_marcus_recon.cli; import triage.sidecar_html; import triage.artifact_fingerprint; import triage.artifact_profiles; import triage.artifact_compare; import triage.same_family_compare; import triage.roster_log_compare.compare; import triage.roster_log_review_queue.cli; import triage.gitignore_hygiene; print('imports ok')"

      - name: Gitignore hygiene
        run: python -m triage.gitignore_hygiene

      - name: Run artifact engine tests
        run: |
          python -m pytest \
            tests/test_nw_prj_neuron_track_hours.py \
            tests/test_nw_prj_neuron_track_hours_bonita.py \
            tests/test_nth_qualitative_admin.py \
            tests/test_nth_evidence_bounded_allocation.py \
            tests/test_admin_billing_summary.py \
            tests/test_one_marcus_recon.py \
            tests/test_one_marcus_generate.py \
            tests/test_one_marcus_immutability.py \
            tests/test_sidecar_html_portal.py \
            tests/test_artifact_compare.py \
            tests/test_roster_log_compare.py \
            tests/test_same_family_compare.py \
            tests/test_gitignore_hygiene.py \
            tests/test_roster_log_review_queue.py \
            -q

  canonical-local-path-prompt-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/prompt-kit-artifact-risk-path-20260822'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-artifact-risk-path-20260822
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repair bounded canonical path transport and execute
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.prompt-contrib/canonical_path_repair.py')
          text = path.read_text(encoding='utf-8')
          old_count = 'self.assertEqual(len(self.prompts), 100)'
          new_count = 'self.assertEqual(len(self.prompts), len(self.by_id))'
          if old_count not in text and new_count not in text:
              raise SystemExit('canonical-path count assertion anchor missing')
          text = text.replace(old_count, new_count)
          old_heading = 'FAIL-CLOSED\nIf multiple plausible ordinary checkouts remain'
          new_heading = 'UNPROVED PATH STOP CONDITION\nIf multiple plausible ordinary checkouts remain'
          if old_heading not in text and new_heading not in text:
              raise SystemExit('canonical-path stop-condition heading anchor missing')
          text = text.replace(old_heading, new_heading)
          path.write_text(text, encoding='utf-8')
          PY
          python .prompt-contrib/canonical_path_repair.py

  hierarchy-state-transition-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/hierarchy-state-transition-trigger-20260823'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pin current main floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short
          git log --oneline --decorate -5

      - name: Repair hierarchy state transitions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label}: anchor missing')
              return text.replace(old, new, 1)

          js_path = Path('docs/prompt-kit.js')
          polish_path = Path('docs/prompt-kit-polish.js')
          contract_path = Path('harness/contracts/prompt-kit-filtering.v1.json')
          test_path = Path('tests/test_prompt_kit_filtering_access.py')

          js = js_path.read_text(encoding='utf-8')
          js = replace_once(
              js,
              "function toggleFavoritePrompt(id){var key=String(id||'').toUpperCase();if(!key)return;if(isFavoritePrompt(key)){delete favoritePromptIds[key];showToast('Removed '+key+' from Favorites')}else{favoritePromptIds[key]=true;showToast('Saved '+key+' to Favorites')}saveFavoritePromptIds();render()}",
              "function toggleFavoritePrompt(id){var key=String(id||'').toUpperCase();if(!key)return;if(isFavoritePrompt(key)){delete favoritePromptIds[key];showToast('Removed '+key+' from Favorites')}else{favoritePromptIds[key]=true;showToast('Saved '+key+' to Favorites')}saveFavoritePromptIds();if(activeSection==='__favorites__')renderTypes();render()}",
              'favorite membership refresh',
          )
          js = replace_once(
              js,
              "if(activeSection){activeSection=null;render();return}",
              "if(activeSection){activeSection=null;activeType=null;renderTypes();render();return}",
              'Escape section reset refresh',
          )
          js_path.write_text(js, encoding='utf-8')

          polish = polish_path.read_text(encoding='utf-8')
          old = """function activateFavoritesView(){
            activeCat='all';
            activeSection='__favorites__';
            clearTransientPromptFilters();
            document.querySelectorAll('.cat-tab').forEach(function(button){button.classList.toggle('active',button.id==='favoritesShortcut')});
            document.querySelectorAll('.section-tab').forEach(function(button){button.classList.toggle('active',button.dataset.section==='__favorites__')});
            render();
          }"""
          new = """function activateFavoritesView(){
            activeCat='all';
            activeSection='__favorites__';
            clearTransientPromptFilters();
            document.querySelectorAll('.cat-tab').forEach(function(button){button.classList.toggle('active',button.id==='favoritesShortcut')});
            document.querySelectorAll('.section-tab').forEach(function(button){button.classList.toggle('active',button.dataset.section==='__favorites__')});
            renderTypes();
            render();
          }"""
          polish = replace_once(polish, old, new, 'Favorites activation refresh')
          polish_path.write_text(polish, encoding='utf-8')

          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          requirement = next((item for item in contract['requirements'] if item['id'] == 'progressive_type_disclosure'), None)
          if requirement is None:
              raise SystemExit('progressive_type_disclosure contract owner missing')
          sentence = ' Favorites activation, favorite membership changes while Favorites is active, and Escape section reset refresh subordinate navigation so controls cannot describe a stale scope.'
          if sentence.strip() not in requirement['expected']:
              requirement['expected'] = requirement['expected'].rstrip() + sentence
          contract_path.write_text(json.dumps(contract, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test = test_path.read_text(encoding='utf-8')
          contract_anchor = '        self.assertIn("only subcategories available in that scope", expected["progressive_type_disclosure"])\n'
          contract_assert = '        self.assertIn("favorite membership changes while Favorites is active", expected["progressive_type_disclosure"])\n        self.assertIn("Escape section reset", expected["progressive_type_disclosure"])\n'
          if contract_assert not in test:
              if contract_anchor not in test:
                  raise SystemExit('contract regression anchor missing')
              test = test.replace(contract_anchor, contract_anchor + contract_assert, 1)

          if 'def test_hierarchy_refreshes_on_non_click_state_transitions' not in test:
              anchor = '    def test_all_view_is_an_atomic_reset_after_favorites(self) -> None:\n'
              addition = '''    def test_hierarchy_refreshes_on_non_click_state_transitions(self) -> None:\n        js = JS.read_text(encoding="utf-8")\n        polish = POLISH.read_text(encoding="utf-8")\n\n        toggle_start = js.index("function toggleFavoritePrompt")\n        toggle_end = js.index("\\n\\nfunction syncLibraryTabs", toggle_start)\n        toggle = js[toggle_start:toggle_end]\n        self.assertIn("if(activeSection==='__favorites__')renderTypes();render()", toggle)\n\n        favorites_start = polish.index("function activateFavoritesView()")\n        favorites_end = polish.index("function ensureCompactBrowsingControls()", favorites_start)\n        favorites = polish[favorites_start:favorites_end]\n        self.assertIn("renderTypes();", favorites)\n        self.assertLess(favorites.index("renderTypes();"), favorites.index("render();"))\n\n        self.assertIn("if(activeSection){activeSection=null;activeType=null;renderTypes();render();return}", js)\n\n'''
              if anchor not in test:
                  raise SystemExit('hierarchy transition test insertion anchor missing')
              test = test.replace(anchor, addition + anchor, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Validate pass 1
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_filtering_access -v
          python -m unittest tests.test_prompt_kit_product_interactions tests.test_prompt_kit_mobile -v
          python -m unittest tests.test_prompt_kit_mainline_delivery tests.test_prompt_kit_header_contract tests.test_prompt_kit_pages tests.test_prompt_kit_hotkey_completion -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_prompt_kit_order_navigation.py --summary
          git diff --check

      - name: Deliberate pass 2 falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          js = Path('docs/prompt-kit.js').read_text(encoding='utf-8')
          polish = Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8')
          test = Path('tests/test_prompt_kit_filtering_access.py').read_text(encoding='utf-8')
          html = Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          favorites = polish[polish.index('function activateFavoritesView()'):polish.index('function ensureCompactBrowsingControls()')]
          checks = {
              'Favorites activation refresh': 'renderTypes();' in favorites and favorites.index('renderTypes();') < favorites.index('render();'),
              'favorite membership refresh': "if(activeSection==='__favorites__')renderTypes();render()" in js,
              'Escape section refresh': "if(activeSection){activeSection=null;activeType=null;renderTypes();render();return}" in js,
              'focused regression': 'test_hierarchy_refreshes_on_non_click_state_transitions' in test,
              'generated parity': "if(activeSection==='__favorites__')renderTypes();render()" in html,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'hierarchy second-pass falsification failed: {failed}')
          PY
          python -m unittest tests.test_prompt_kit_filtering_access -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Recheck floor, self-clean, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git show ea3002468931e2ee238f20a88597b21cee3ecb49:.github/workflows/artifact-engines.yml > .github/workflows/artifact-engines.yml
          git rm .github/workflows/tmp-hierarchy-state-transition-repair.yml
          git add \
            .github/workflows/artifact-engines.yml \
            docs/prompt-kit.js \
            docs/prompt-kit-polish.js \
            harness/contracts/prompt-kit-filtering.v1.json \
            tests/test_prompt_kit_filtering_access.py \
            web/prompt-kit/index.html
          git diff --cached --check
          echo '--- final staged files ---'
          git diff --cached --name-only
          git commit -m "fix(prompt-kit): refresh hierarchy on state transitions"
          git push origin HEAD:main

  p65-verifier-routing-repair:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/p65-verifier-routing-trigger-20260824')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pin current main floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short
          git log --oneline --decorate -5

      - name: Harden canonical P65 routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('registry/prompts/tutorial-discovery-prompts.v1.json')
          payload = json.loads(registry_path.read_text(encoding='utf-8'))
          p65 = next(p for p in payload['prompts'] if p['id'] == 'P65')

          def append_once(field: str, sentence: str) -> None:
              current = p65[field]
              if sentence not in current:
                  p65[field] = current.rstrip() + ' ' + sentence

          append_once('useWhen', 'It also covers the high-risk handoff case where another agent, chat, branch, PR, report, artifact, or implementation claims work is complete, fixed, green, passed, done, or partially complete but the user needs that claim independently verified and advanced from evidence rather than trusted.')
          append_once('inspectFirst', 'When prior work or a completion claim exists, also inspect who made the claim, what exact work/head/artifact it refers to, whether observed behavior contradicts it, and what proof actually supports it; do not ask the user to restate recoverable prior-work context.')
          append_once('expectedOutput', "A prior-agent completion-verification signal routes primarily to P83 Agent Work Verifier & Iterative Advancer; experimentation, regression, runtime-proof, and integration prompts remain follow-ons unless they are independently the user's primary need.")
          append_once('proofGate', "If the user is checking another agent's claimed completion and that claim is unverified, contradicted, or distrusted, P83 is selected as primary and later answers about prototyping, regression proof, runtime proof, or integration do not silently erase that stronger routing signal.")

          content = p65['copyContent']
          old_start = '1. Starting state: no checkout, unfamiliar repository, known repository, active failure, open PR floor, or app currently in front of me.'
          new_start = '1. Starting state: no checkout, unfamiliar repository, known repository, active failure, open PR floor, app currently in front of me, or prior work that another agent/chat/branch/PR/report claims is complete or partially complete.'
          if new_start not in content:
              if old_start not in content: raise SystemExit('P65 starting-state anchor missing')
              content = content.replace(old_start, new_start, 1)
          old_outcome = '2. Desired outcome: recover repeated friction or urgency, understand, plan, coordinate or maintain a repository work ledger, build or repair, diagnose, validate, integrate or deploy, document or teach, or close out and hand off.'
          new_outcome = "2. Desired outcome: verify/correct/advance another agent's claimed work or claimed completion, recover repeated friction or urgency, understand, plan, coordinate or maintain a repository work ledger, build or repair, diagnose, validate, integrate or deploy, document or teach, or close out and hand off."
          if new_outcome not in content:
              if old_outcome not in content: raise SystemExit('P65 desired-outcome anchor missing')
              content = content.replace(old_outcome, new_outcome, 1)

          p83_route = "- P83 Agent Work Verifier & Iterative Advancer: independently verify another agent's claimed complete/partial work, repair what is wrong or missing, advance unfinished work, revalidate, and integrate bounded proven slices instead of trusting the handoff."
          if p83_route not in content:
              anchor = '- P82 Prototype-Measure-Refine Delivery Loop: iterate a broadly uncertain feature/interface through measured working candidates when the main question is experimentation rather than a specific flow defect.'
              if anchor not in content: raise SystemExit('P65 P82 routing anchor missing')
              content = content.replace(anchor, anchor + '\n' + p83_route, 1)

          precedence = """PRIOR-AGENT COMPLETION CLAIM OVERRIDE
- If the user is checking work that another agent, chat, branch, PR, report, artifact, or implementation says is complete, fixed, green, passed, done, or partially complete—and that claim is unverified, contradicted by observed behavior, or explicitly distrusted—recommend P83 Agent Work Verifier & Iterative Advancer as the primary prompt.
- This signal outranks generic repair, broad experimentation, regression proof, runtime proof, or integration because the first job is to independently verify inherited claims against current evidence and advance the actual state.
- Do not let a later answer such as “iterate prototypes,” “prove it live,” “guard regressions,” or “land it on main” silently replace P83 as primary when those are methods or downstream gates for verifying prior claimed work.
- P82 may be a follow-on only if P83 establishes that genuine solution uncertainty requires iterative candidate experimentation. P94 or P08 may follow for regression/live proof, and P15 may follow for integration after the exact work is proven.
- Distinguish P13: use P13 when the primary problem is recurring process friction, missed urgency, proof-floor looping, or omitted safe parallelism without a specific inherited completion claim that needs independent verification. If the user specifically says the agent keeps telling them it is complete and it is not, P83 wins.
- If current chat context already establishes a prior completion claim, treat that questionnaire fact as answered. Do not spend a question making the user repeat it; use the remaining questions to resolve the smallest missing distinction.
"""
          if 'PRIOR-AGENT COMPLETION CLAIM OVERRIDE' not in content:
              anchor = '\n\nRECOMMENDATION CONTRACT'
              if anchor not in content: raise SystemExit('P65 recommendation-contract anchor missing')
              content = content.replace(anchor, '\n\n' + precedence.rstrip() + anchor, 1)
          p65['copyContent'] = content
          keywords = p65.setdefault('keywords', [])
          for keyword in ('another agent says complete','agent said done','claimed complete','false completion','verify agent work','verify prior agent'):
              if keyword not in keywords: keywords.append(keyword)
          registry_path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test_path = Path('tests/test_prompt_kit_discovery.py')
          tests = test_path.read_text(encoding='utf-8')
          if 'test_guided_finder_prior_agent_completion_claim_routes_to_p83' not in tests:
              anchor = '    def test_repo_front_door_exposes_browser_phone_zip_cmd_and_clone(self) -> None:\n'
              if anchor not in tests: raise SystemExit('focused discovery test insertion anchor missing')
              block = '''    def test_guided_finder_prior_agent_completion_claim_routes_to_p83(self) -> None:\n        payload = json.loads(TUTORIAL_PROMPTS.read_text(encoding="utf-8"))\n        p65 = next(item for item in payload["prompts"] if item["id"] == "P65")\n        content = p65["copyContent"]\n        self.assertIn("PRIOR-AGENT COMPLETION CLAIM OVERRIDE", content)\n        self.assertIn("- P83 Agent Work Verifier & Iterative Advancer:", content)\n        self.assertIn("recommend P83 Agent Work Verifier & Iterative Advancer as the primary prompt", content)\n        self.assertIn("This signal outranks generic repair, broad experimentation, regression proof, runtime proof, or integration", content)\n        self.assertIn("Do not let a later answer such as", content)\n        self.assertIn("P82 may be a follow-on only if P83", content)\n        self.assertIn("the agent keeps telling them it is complete and it is not, P83 wins", content)\n        self.assertIn("treat that questionnaire fact as answered", content)\n        self.assertIn("completion claim", p65["useWhen"].lower())\n        self.assertIn("P83", p65["proofGate"])\n\n'''
              test_path.write_text(tests.replace(anchor, block + anchor, 1), encoding='utf-8')
          PY

      - name: Build and validate pass 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_prompt_kit_discovery -v
          python -m unittest tests.test_agentic_loop_prompts -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Deliberate pass 2 falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          tutorial = json.loads(Path('registry/prompts/tutorial-discovery-prompts.v1.json').read_text(encoding='utf-8'))
          ledger = json.loads(Path('registry/prompts/repository-work-ledger-prompts.v1.json').read_text(encoding='utf-8'))
          p65 = next(p for p in tutorial['prompts'] if p['id'] == 'P65')
          p83 = next(p for p in ledger['prompts'] if p['id'] == 'P83')
          html = Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          checks = {
              'P83 canonical identity': p83['name'] == 'Agent Work Verifier & Iterative Advancer',
              'P83 already owns completion claims': 'claims work is complete or partially complete' in p83['useWhen'],
              'P65 exact P83 route': '- P83 Agent Work Verifier & Iterative Advancer:' in p65['copyContent'],
              'P65 precedence rule': 'PRIOR-AGENT COMPLETION CLAIM OVERRIDE' in p65['copyContent'],
              'P83 wins false completion case': 'the agent keeps telling them it is complete and it is not, P83 wins' in p65['copyContent'],
              'prototype cannot erase verifier': 'Do not let a later answer such as' in p65['copyContent'] and 'P82 may be a follow-on only if P83' in p65['copyContent'],
              'P13 distinction': 'Distinguish P13' in p65['copyContent'],
              'context is not re-asked': 'treat that questionnaire fact as answered' in p65['copyContent'],
              'generated-site parity marker': 'PRIOR-AGENT COMPLETION CLAIM OVERRIDE' in html,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed: raise SystemExit(f'P65 second-pass falsification failed: {failed}')
          PY
          git diff --quiet -- registry/prompts/repository-work-ledger-prompts.v1.json
          changed="$(git diff --name-only | sort)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(registry/prompts/tutorial-discovery-prompts.v1.json|tests/test_prompt_kit_discovery.py|web/prompt-kit/index.html)$' || true)"
          test -z "$unexpected"
          python -m unittest tests.test_prompt_kit_discovery.PromptKitDiscoveryTests.test_guided_finder_prior_agent_completion_claim_routes_to_p83 -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Recheck floor, commit exact proven slice, and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git add registry/prompts/tutorial-discovery-prompts.v1.json tests/test_prompt_kit_discovery.py web/prompt-kit/index.html
          git diff --cached --check
          echo '--- final staged durable files ---'
          git diff --cached --name-only
          git commit -m "fix(prompt-kit): route claimed completion to P83"
          git push origin HEAD:fix/p65-verifier-routing-validated-20260824
