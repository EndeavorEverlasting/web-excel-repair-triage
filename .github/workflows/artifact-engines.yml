name: Artifact engine tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  artifact-engines:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install openpyxl
          fi
          python -m pip install pytest

      - name: Import artifact engines
        run: |
          python -c "import triage.nw_prj_neuron_track_hours.cli; import triage.nw_prj_neuron_track_hours.bonita_cli; import triage.nth_qualitative_admin; import triage.admin_billing_summary.cli; import triage.one_marcus_recon.cli; import triage.sidecar_html; import triage.artifact_fingerprint; import triage.artifact_profiles; import triage.artifact_compare; import triage.same_family_compare; import triage.roster_log_compare.compare; import triage.roster_log_review_queue.cli; import triage.gitignore_hygiene; print('imports ok')"

      - name: Gitignore hygiene
        run: python -m triage.gitignore_hygiene

      - name: Run artifact engine tests
        run: |
          python -m pytest \
            tests/test_nw_prj_neuron_track_hours.py \
            tests/test_nw_prj_neuron_track_hours_bonita.py \
            tests/test_nth_qualitative_admin.py \
            tests/test_admin_billing_summary.py \
            tests/test_one_marcus_recon.py \
            tests/test_one_marcus_generate.py \
            tests/test_one_marcus_immutability.py \
            tests/test_sidecar_html_portal.py \
            tests/test_artifact_compare.py \
            tests/test_roster_log_compare.py \
            tests/test_same_family_compare.py \
            tests/test_gitignore_hygiene.py \
            tests/test_roster_log_review_queue.py \
            -q

  teach-framework-prompt-contribution:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/prompt-kit-teach-workspace-bootstrap-20260822'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-teach-workspace-bootstrap-20260822
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconcile current main and strip execution transport
        shell: bash
        run: |
          set -euo pipefail
          feature_pre="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --prune --tags
          echo "feature_pre=$feature_pre"
          echo "main=$(git rev-parse origin/main)"
          git merge --no-commit --no-ff origin/main
          git checkout "$feature_pre" -- .github/workflows/artifact-engines.yml
          git checkout origin/main -- .github/workflows/prompt-kit-web.yml
          git rm -f --ignore-unmatch .github/workflows/tmp-prompt-kit-teach-workspace-bootstrap-20260822.yml
          git rm -f --ignore-unmatch .prompt-contrib/tmp-teach-framework-pr-trigger.txt

      - name: Run repo-owned helper and expanded teach contribution
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_teach_framework_retry_20260822.py
          cat .teach-bootstrap-receipt.tmp.json >> "$GITHUB_STEP_SUMMARY"

      - name: Validate contribution and generated Prompt Kit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_prompt_registry_expansion_regression_design_teach -v
          python -m unittest tests.test_prompt_kit_discovery -v
          python -m unittest tests.test_skill_prompt_registry -v
          python scripts/validate_prompt_kit_order_navigation.py --output "$RUNNER_TEMP/prompt-kit-order-navigation-audit.json" --summary
          python -m unittest tests.test_prompt_kit_order_navigation_contract -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/evaluate_prompt_language.py --output "$RUNNER_TEMP/prompt-language-audit.json" --summary
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Commit durable Prompt Kit files only
        shell: bash
        run: |
          set -euo pipefail
          receipt_id="$(python -c 'import json; print(json.load(open(".teach-bootstrap-receipt.tmp.json"))["id"])')"
          rm -f .teach-bootstrap-receipt.tmp.json .teach-language-audit.tmp.json
          git rm -f scripts/tmp_teach_workspace_contribution_20260822.py
          git rm -f scripts/tmp_teach_framework_contribution_20260822.py
          git rm -f scripts/tmp_teach_framework_retry_20260822.py
          git add registry/prompts/tutorial-discovery-prompts.v1.json tests/test_prompt_registry_expansion_regression_design_teach.py tests/test_prompt_kit_discovery.py web/prompt-kit/index.html .github/workflows/artifact-engines.yml .github/workflows/prompt-kit-web.yml
          git diff --cached --check
          echo "prompt_id=$receipt_id"
          git status --short
          git commit -m "feat(prompt-kit): establish teach workspace protocol"
          git push origin HEAD:feat/prompt-kit-teach-workspace-bootstrap-20260822
