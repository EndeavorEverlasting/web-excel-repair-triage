name: Artifact engine tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  artifact-engines:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install openpyxl
          fi
          python -m pip install pytest

      - name: Import artifact engines
        run: |
          python -c "import triage.nw_prj_neuron_track_hours.cli; import triage.nw_prj_neuron_track_hours.bonita_cli; import triage.nth_qualitative_admin; import triage.admin_billing_summary.cli; import triage.one_marcus_recon.cli; import triage.sidecar_html; import triage.artifact_fingerprint; import triage.artifact_profiles; import triage.artifact_compare; import triage.same_family_compare; import triage.roster_log_compare.compare; import triage.roster_log_review_queue.cli; import triage.gitignore_hygiene; print('imports ok')"

      - name: Gitignore hygiene
        run: python -m triage.gitignore_hygiene

      - name: Run artifact engine tests
        run: |
          python -m pytest \
            tests/test_nw_prj_neuron_track_hours.py \
            tests/test_nw_prj_neuron_track_hours_bonita.py \
            tests/test_nth_qualitative_admin.py \
            tests/test_admin_billing_summary.py \
            tests/test_one_marcus_recon.py \
            tests/test_one_marcus_generate.py \
            tests/test_one_marcus_immutability.py \
            tests/test_sidecar_html_portal.py \
            tests/test_artifact_compare.py \
            tests/test_roster_log_compare.py \
            tests/test_same_family_compare.py \
            tests/test_gitignore_hygiene.py \
            tests/test_roster_log_review_queue.py \
            -q

  prompt-failure-suite-219:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 219 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-failure-suite-p02-updates-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh and execute canonical contribution
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          python .github/tmp_failure_suite_219.py
      - name: Commit durable PR219 result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/artifact-engines.yml
          git rm --ignore-unmatch \
            .github/prompt91-draft.json \
            .github/prompt92-draft.json \
            .github/prompt93-draft.json \
            .github/workflows/prompt-failure-suite-bootstrap.yml \
            .github/tmp_failure_suite_219.py
          git add \
            registry/prompts/spec-architecture-prompts.v1.json \
            registry/prompts/prompt-overrides.v1.json \
            tests/test_spec_architecture_prompt_registry.py \
            tests/test_p02_p07_autonomous_iteration.py \
            web/prompt-kit/index.html \
            .github/workflows/artifact-engines.yml
          git diff --cached --check
          git commit -m "feat(prompt-kit): complete failure-audit suite and tighten P02 updates"
          git push origin HEAD:feat/prompt-failure-suite-p02-updates-20260821
