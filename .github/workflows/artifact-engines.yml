name: Artifact engine tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  favorite-observed-proof-executor:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/prompt-kit-favorite-observed-proof-20260824'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-kit-favorite-observed-proof-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin fresh main evidence floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          BASE_SHA="$(git rev-parse origin/main)"
          MERGE_BASE="$(git merge-base HEAD origin/main)"
          test "$BASE_SHA" = "$MERGE_BASE"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "EXECUTOR_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short
          git log --oneline --decorate -5

      - name: Apply bounded product harness and prompt repair
        shell: bash
        run: |
          set -euo pipefail
          python .prompt-contrib/favorite_observed_proof_repair.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/prompt_kit_favorite_browser_proof.py')
          text = path.read_text(encoding='utf-8')
          old = """            page.keyboard.press('9')
            page.wait_for_timeout(250)
            toast_text = page.locator('#toast').inner_text()
"""
          new = """            page.keyboard.press('9')
            try:
                page.wait_for_function(\"\"\"() => {
                  const card=document.querySelector('[data-prompt-id=\\\"P79\\\"]');
                  if(!card)return false;
                  const r=card.getBoundingClientRect();
                  return r.bottom>0 && r.top<innerHeight;
                }\"\"\", timeout=4000)
            except Exception:
                pass
            toast_text = page.locator('#toast').inner_text()
"""
          if text.count(old) != 1:
              raise SystemExit('browser scroll synchronization anchor mismatch')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          print('browser proof now waits for the observed scroll destination rather than a fixed animation delay')
          PY

      - name: Pass 1 deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/prompt-kit-polish.js
          node --check docs/prompt-kit-hotkey-prototype.js
          python -m py_compile \
            scripts/validate_observed_behavior_receipt.py \
            tests/prompt_kit_favorite_browser_proof.py \
            tests/test_observed_behavior_proof_harness.py
          python -m unittest \
            tests.test_observed_behavior_proof_harness \
            tests.test_prompt_kit_hotkey_completion \
            tests.test_ai_engineering_level_up \
            -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_prompt_kit_interactions.py \
            --require-implementation \
            --output "$RUNNER_TEMP/prompt-kit-interactions.json" \
            --summary
          git diff --check

      - name: Pass 2 deliberate falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          polish = Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8')
          start = polish.index('function activatePromptShortcutTarget(promptId)')
          end = polish.index('function handleConfiguredPromptShortcutKey', start)
          activation = polish[start:end]
          required = ['revealPromptShortcutTarget(promptId)', 'copyPrompt(promptId)']
          missing = [item for item in required if item not in activation]
          if missing:
              raise SystemExit('favorite activation missing required behavior: ' + repr(missing))
          if 'showPromptDetail(' in activation:
              raise SystemExit('favorite activation still opens prompt detail')
          if '.focus(' in activation:
              raise SystemExit('favorite activation introduces a keyboard focus target')
          contract = Path('harness/observed-proof/CONTRACT.md').read_text(encoding='utf-8')
          for marker in ('UNKNOWN', 'occurred: true', 'passed: true', 'clipboard', 'focus/keyboard'):
              if marker not in contract:
                  raise SystemExit('observed-proof contract missing: ' + marker)
          proof = Path('tests/prompt_kit_favorite_browser_proof.py').read_text(encoding='utf-8')
          if 'wait_for_function' not in proof or 'timeout=4000' not in proof:
              raise SystemExit('browser proof does not wait for scroll destination observation')
          print('Second-pass falsification: PASS')
          PY
          python -m unittest \
            tests.test_observed_behavior_proof_harness \
            tests.test_prompt_kit_hotkey_completion \
            tests.test_ai_engineering_level_up \
            -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Restore bootstrap surface and create exact candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA":.github/workflows/artifact-engines.yml > .github/workflows/artifact-engines.yml
          git rm .github/workflows/tmp-apply-favorite-observed-proof.yml
          git rm .prompt-contrib/favorite_observed_proof_repair.py
          rm -rf Outputs/observed-proof
          git add \
            .github/workflows/artifact-engines.yml \
            .github/workflows/prompt-kit-observed-browser-proof.yml \
            docs/PROMPT_KIT_HOTKEY_PROGRAM_DESIGN.md \
            docs/prompt-kit-hotkey-prototype.js \
            docs/prompt-kit-polish.js \
            docs/prompts.json \
            harness/observed-proof \
            registry/prompts/ai-engineering-level-up-prompts.v1.json \
            scripts/validate_observed_behavior_receipt.py \
            tests/prompt_kit_favorite_browser_proof.py \
            tests/test_observed_behavior_proof_harness.py \
            tests/test_prompt_kit_hotkey_completion.py \
            web/prompt-kit/index.html
          git diff --cached --check
          echo '--- candidate staged files ---'
          git diff --cached --name-only
          git diff --cached --stat
          git commit -m "fix(prompt-kit): prove favorite copy and scroll before pass"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short

      - name: Install observed browser proof runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Observe exact candidate Favorite interaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p Outputs/observed-proof
          python tests/prompt_kit_favorite_browser_proof.py \
            --receipt Outputs/observed-proof/favorite-shortcut-receipt.json \
            --screenshot Outputs/observed-proof/favorite-shortcut.png
          python scripts/validate_observed_behavior_receipt.py \
            Outputs/observed-proof/favorite-shortcut-receipt.json \
            --expected-sha "$CANDIDATE_SHA" \
            --summary
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload exact-head observed evidence
        uses: actions/upload-artifact@v4
        with:
          name: prompt-kit-favorite-observed-proof
          path: Outputs/observed-proof/
          if-no-files-found: error

      - name: Re-fetch floor and push exact proven candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          git push origin "$CANDIDATE_SHA":fix/prompt-kit-favorite-observed-proof-20260824
          git status --short
