name: Artifact engine tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  artifact-engines:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install openpyxl
          fi
          python -m pip install pytest

      - name: Import artifact engines
        run: |
          python -c "import triage.nw_prj_neuron_track_hours.cli; import triage.nw_prj_neuron_track_hours.bonita_cli; import triage.nth_qualitative_admin; import triage.admin_billing_summary.cli; import triage.one_marcus_recon.cli; import triage.sidecar_html; import triage.artifact_fingerprint; import triage.artifact_profiles; import triage.artifact_compare; import triage.same_family_compare; import triage.roster_log_compare.compare; import triage.roster_log_review_queue.cli; import triage.gitignore_hygiene; print('imports ok')"

      - name: Gitignore hygiene
        run: python -m triage.gitignore_hygiene

      - name: Run artifact engine tests
        run: |
          python -m pytest \
            tests/test_nw_prj_neuron_track_hours.py \
            tests/test_nw_prj_neuron_track_hours_bonita.py \
            tests/test_nth_qualitative_admin.py \
            tests/test_admin_billing_summary.py \
            tests/test_one_marcus_recon.py \
            tests/test_one_marcus_generate.py \
            tests/test_one_marcus_immutability.py \
            tests/test_sidecar_html_portal.py \
            tests/test_artifact_compare.py \
            tests/test_roster_log_compare.py \
            tests/test_same_family_compare.py \
            tests/test_gitignore_hygiene.py \
            tests/test_roster_log_review_queue.py \
            -q

  flow-telemetry-owner-review-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/prompt-kit-flow-preference-telemetry-20260822'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-flow-preference-telemetry-20260822
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tighten shared telemetry ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune --tags
          python - <<'PY'
          import json
          from pathlib import Path

          registry = Path('registry/prompts/spec-architecture-prompts.v1.json')
          data = json.loads(registry.read_text(encoding='utf-8'))
          prompt = next(p for p in data['prompts'] if p['name'] == 'User-Flow Friction & Preference Telemetry Refiner')
          anchor = "Define event identity, item ID, timestamp or bucket only when needed, storage owner, schema/version, retention/reset behavior, device/profile/account scope, migration, and failure behavior. "
          rule = "Before mutating a shared telemetry/preferences owner, confirm this journey is authorized to own that schema or contract change; otherwise reuse the existing owner and route the shared-owner change separately instead of expanding scope implicitly. "
          if rule not in prompt['copyContent']:
              if prompt['copyContent'].count(anchor) != 1:
                  raise SystemExit('P99 telemetry ownership anchor mismatch')
              prompt['copyContent'] = prompt['copyContent'].replace(anchor, anchor + rule, 1)
          proof_rule = "shared telemetry/preferences authority is reused or explicitly authorized rather than silently widened by a local flow repair"
          if proof_rule not in prompt['proofGate']:
              prompt['proofGate'] = prompt['proofGate'].rstrip('. ') + "; " + proof_rule + "."
          registry.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test = Path('tests/test_spec_architecture_prompt_registry.py')
          text = test.read_text(encoding='utf-8')
          test_anchor = '            "reuse the normal success toast/feedback",\n'
          test_rule = test_anchor + '            "Before mutating a shared telemetry/preferences owner",\n'
          if '            "Before mutating a shared telemetry/preferences owner",\n' not in text:
              if text.count(test_anchor) != 1:
                  raise SystemExit('P99 telemetry ownership test anchor mismatch')
              text = text.replace(test_anchor, test_rule, 1)
          test.write_text(text, encoding='utf-8')
          PY
          git rm -f --ignore-unmatch .prompt-contrib/tmp-flow-owner-review-trigger.txt
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Validate review repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_prompt_registry_expansion_regression_design_teach -v
          python -m unittest tests.test_prompt_kit_discovery -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git status --short

      - name: Commit review repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/prompts/spec-architecture-prompts.v1.json \
                  tests/test_spec_architecture_prompt_registry.py \
                  web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "fix(prompt-kit): bound shared telemetry ownership"
          git push origin HEAD:feat/prompt-kit-flow-preference-telemetry-20260822
