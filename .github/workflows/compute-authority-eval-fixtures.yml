name: Compute Authority Eval Harness
run-name: Compute Authority Eval Harness | ${{ github.event_name }} | ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'harness/evals/compute-authority/**'
      - 'tests/test_compute_authority_eval_harness.py'
      - 'tests/test_compute_authority_runtime_harness.py'
      - '.github/workflows/compute-authority-eval-fixtures.yml'
  push:
    branches: [main]
    paths:
      - 'harness/evals/compute-authority/**'
      - 'tests/test_compute_authority_eval_harness.py'
      - 'tests/test_compute_authority_runtime_harness.py'
      - '.github/workflows/compute-authority-eval-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute-authority-harness:
    name: Compute-Authority Sprint 1+2 Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize and validate frozen fixtures
        run: |
          set -euo pipefail
          python harness/evals/compute-authority/scripts/materialize_fixtures.py
          python harness/evals/compute-authority/scripts/validate_fixtures.py --summary \
            --output Outputs/repository-ai-evals/compute-authority-fixtures.json
          python harness/evals/compute-authority/scripts/conditions.py --summary

      - name: Focused Sprint 1+2 harness tests
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_compute_authority_eval_harness \
            tests.test_compute_authority_runtime_harness -v

      - name: Prove no-runtime pilot remains explicitly unproven
        run: |
          set -euo pipefail
          python harness/evals/compute-authority/scripts/pilot.py \
            --plan-only \
            --pilot-id ci-no-runtime \
            --plan-output Outputs/repository-ai-evals/compute-authority/pilot-plan.json \
            --receipt-output Outputs/repository-ai-evals/compute-authority/pilot-receipt.json \
            --summary
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("Outputs/repository-ai-evals/compute-authority/pilot-receipt.json").read_text())
          assert receipt["runtime_state"] == "UNPROVEN_RUNTIME", receipt
          assert receipt["planned_runs"] == 16, receipt
          assert receipt["valid_runs"] == 0, receipt
          assert receipt["invalid_runs"] == 0, receipt
          assert receipt["blocker"] == "RUNTIME_UNAVAILABLE", receipt
          assert receipt["effectiveness_promoted"] is False, receipt
          print("no-runtime proof boundary: PASS")
          PY
          git diff --check

      - name: Upload deterministic Sprint 2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: compute-authority-sprint2-harness-evidence
          path: |
            Outputs/repository-ai-evals/compute-authority-fixtures.json
            Outputs/repository-ai-evals/compute-authority/pilot-plan.json
            Outputs/repository-ai-evals/compute-authority/pilot-receipt.json
          if-no-files-found: error
