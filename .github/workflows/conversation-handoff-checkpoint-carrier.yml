name: Conversation handoff checkpoint contract carrier

on:
  push:
    branches: [fix/repository-plan-durability-20260912]
    paths:
      - '.github/workflows/conversation-handoff-checkpoint-carrier.yml'

permissions:
  contents: write

jobs:
  build-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repository-plan-durability-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh floor and require main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/repository-plan-durability-20260912 --prune --tags
          git merge --ff-only origin/fix/repository-plan-durability-20260912
          git merge-base --is-ancestor origin/main HEAD
      - name: Build live-thread to P02 checkpoint contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p harness/conversation-continuity
          cat > harness/conversation-continuity/checkpoint.schema.v1.json <<'EOF'
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "$id": "live-thread-p02-checkpoint/v1",
            "title": "Live Thread-Convergence to P02 Checkpoint",
            "description": "Machine-checkable durable handoff from the live thread-convergence controller to P02. Structure is strict; scripts/validate_conversation_handoff_checkpoint.py owns cross-field semantic validation.",
            "schema_version": "live-thread-p02-checkpoint/v1",
            "type": "object",
            "additionalProperties": false,
            "required": ["handoff_version", "source_controller", "source_conversation_state", "created_at", "threads"],
            "properties": {
              "handoff_version": {"const": "live-thread-p02-checkpoint/v1"},
              "source_controller": {"const": "live-thread-convergence-controller"},
              "source_conversation_state": {"type": "string", "enum": ["ACTIVE", "DEGRADED", "CLOSING", "TERMINAL"]},
              "created_at": {"type": "string", "format": "date-time"},
              "threads": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/thread"}}
            },
            "$defs": {
              "nonempty": {"type": "string", "minLength": 1},
              "priority": {
                "type": "object",
                "additionalProperties": false,
                "required": ["rank", "rationale"],
                "properties": {
                  "rank": {"type": "integer", "minimum": 1},
                  "rationale": {"$ref": "#/$defs/nonempty"}
                }
              },
              "decision": {
                "type": "object",
                "additionalProperties": false,
                "required": ["decision", "status", "evidence"],
                "properties": {
                  "decision": {"$ref": "#/$defs/nonempty"},
                  "status": {"type": "string", "enum": ["SETTLED", "PROVISIONAL", "REOPEN ONLY IF EVIDENCE CHANGES"]},
                  "evidence": {"$ref": "#/$defs/nonempty"}
                }
              },
              "evidence": {
                "type": "object",
                "additionalProperties": false,
                "required": ["type", "identity", "value", "mutable"],
                "properties": {
                  "type": {"type": "string", "enum": ["conversation", "repository", "artifact", "file", "runtime", "external-system", "other"]},
                  "identity": {"$ref": "#/$defs/nonempty"},
                  "value": {"$ref": "#/$defs/nonempty"},
                  "mutable": {"type": "boolean"}
                }
              },
              "validation": {
                "type": "object",
                "additionalProperties": false,
                "required": ["check", "target", "result"],
                "properties": {
                  "check": {"$ref": "#/$defs/nonempty"},
                  "target": {"$ref": "#/$defs/nonempty"},
                  "result": {"type": "string", "enum": ["PASS", "FAIL", "UNKNOWN", "SKIPPED"]},
                  "evidence": {"type": ["string", "null"]}
                }
              },
              "remaining_work": {
                "type": "object",
                "additionalProperties": false,
                "required": ["item", "status", "dependency", "consequence"],
                "properties": {
                  "item": {"$ref": "#/$defs/nonempty"},
                  "status": {"type": "string", "enum": ["SAFE & EXECUTABLE", "BLOCKED", "USER-ONLY", "OUT OF SCOPE", "UNKNOWN"]},
                  "dependency": {"$ref": "#/$defs/nonempty"},
                  "consequence": {"$ref": "#/$defs/nonempty"}
                }
              },
              "next_action": {
                "type": "object",
                "additionalProperties": false,
                "required": ["owner", "dependency", "action", "expected_output", "completion_gate"],
                "properties": {
                  "owner": {"$ref": "#/$defs/nonempty"},
                  "dependency": {"$ref": "#/$defs/nonempty"},
                  "action": {"$ref": "#/$defs/nonempty"},
                  "expected_output": {"$ref": "#/$defs/nonempty"},
                  "completion_gate": {"$ref": "#/$defs/nonempty"}
                }
              },
              "blocker": {
                "type": "object",
                "additionalProperties": false,
                "required": ["exact_blocker", "unblock_owner", "unblocking_action", "resume_trigger", "resume_point"],
                "properties": {
                  "exact_blocker": {"$ref": "#/$defs/nonempty"},
                  "unblock_owner": {"$ref": "#/$defs/nonempty"},
                  "unblocking_action": {"$ref": "#/$defs/nonempty"},
                  "resume_trigger": {"$ref": "#/$defs/nonempty"},
                  "resume_point": {"$ref": "#/$defs/nonempty"}
                }
              },
              "repository_state": {
                "type": "object",
                "additionalProperties": true,
                "required": ["repository", "default_branch", "working_branch", "head_sha", "first_unproven_repository_gate"],
                "properties": {
                  "repository": {"$ref": "#/$defs/nonempty"},
                  "default_branch": {"$ref": "#/$defs/nonempty"},
                  "working_branch": {"$ref": "#/$defs/nonempty"},
                  "head_sha": {"type": "string", "pattern": "^[0-9a-f]{7,40}$"},
                  "base_sha": {"type": ["string", "null"]},
                  "pr": {"type": ["string", "null"]},
                  "integration_sha": {"type": ["string", "null"]},
                  "current_default_sha": {"type": ["string", "null"]},
                  "changed_files": {"type": "array", "items": {"type": "string"}},
                  "artifacts": {"type": "array", "items": {"type": "string"}},
                  "overlap": {"type": "array", "items": {"type": "string"}},
                  "dirty_state": {"type": ["string", "null"]},
                  "first_unproven_repository_gate": {"$ref": "#/$defs/nonempty"}
                }
              },
              "thread": {
                "type": "object",
                "additionalProperties": false,
                "required": ["id", "target", "disposition", "priority", "current_state", "last_meaningful_action", "first_unproven_gate", "decisions", "evidence", "changed_surfaces", "validations", "remaining_work", "next_action", "route", "return_trigger"],
                "properties": {
                  "id": {"$ref": "#/$defs/nonempty"},
                  "target": {"$ref": "#/$defs/nonempty"},
                  "disposition": {"type": "string", "enum": ["COMPLETE", "BLOCKED", "HANDOFF-READY", "SUSPENDED", "SUPERSEDED"]},
                  "priority": {"$ref": "#/$defs/priority"},
                  "current_state": {"$ref": "#/$defs/nonempty"},
                  "last_meaningful_action": {"$ref": "#/$defs/nonempty"},
                  "first_unproven_gate": {"type": ["string", "null"]},
                  "decisions": {"type": "array", "items": {"$ref": "#/$defs/decision"}},
                  "evidence": {"type": "array", "items": {"$ref": "#/$defs/evidence"}},
                  "changed_surfaces": {"type": "array", "items": {"type": "string"}},
                  "validations": {"type": "array", "items": {"$ref": "#/$defs/validation"}},
                  "remaining_work": {"type": "array", "items": {"$ref": "#/$defs/remaining_work"}},
                  "next_action": {"oneOf": [{"$ref": "#/$defs/next_action"}, {"type": "null"}]},
                  "route": {"type": "string", "enum": ["RESUME IN NEW CONVERSATION", "ROUTE TO P07", "ROUTE TO DOMAIN OWNER", "USER ACTION THEN RESUME", "ARCHIVE ONLY", "NO CONTINUATION REQUIRED"]},
                  "return_trigger": {"type": ["string", "null"]},
                  "blocker": {"$ref": "#/$defs/blocker"},
                  "repository_state": {"$ref": "#/$defs/repository_state"}
                }
              }
            }
          }
          EOF

          cat > scripts/validate_conversation_handoff_checkpoint.py <<'PY'
          #!/usr/bin/env python3
          """Validate live-thread convergence checkpoints handed to P02."""
          from __future__ import annotations

          import argparse
          import json
          import re
          from pathlib import Path
          from typing import Any

          ROOT = Path(__file__).resolve().parents[1]
          SCHEMA_PATH = ROOT / "harness" / "conversation-continuity" / "checkpoint.schema.v1.json"
          SCHEMA_VERSION = "live-thread-p02-checkpoint/v1"
          DISPOSITIONS = {"COMPLETE", "BLOCKED", "HANDOFF-READY", "SUSPENDED", "SUPERSEDED"}
          DECISION_STATUSES = {"SETTLED", "PROVISIONAL", "REOPEN ONLY IF EVIDENCE CHANGES"}
          WORK_STATUSES = {"SAFE & EXECUTABLE", "BLOCKED", "USER-ONLY", "OUT OF SCOPE", "UNKNOWN"}
          ROUTES = {"RESUME IN NEW CONVERSATION", "ROUTE TO P07", "ROUTE TO DOMAIN OWNER", "USER ACTION THEN RESUME", "ARCHIVE ONLY", "NO CONTINUATION REQUIRED"}
          TERMINAL = {"COMPLETE", "SUPERSEDED"}
          REQUIRED_THREAD = {
              "id", "target", "disposition", "priority", "current_state", "last_meaningful_action",
              "first_unproven_gate", "decisions", "evidence", "changed_surfaces", "validations",
              "remaining_work", "next_action", "route", "return_trigger",
          }
          NEXT_ACTION_FIELDS = {"owner", "dependency", "action", "expected_output", "completion_gate"}
          BLOCKER_FIELDS = {"exact_blocker", "unblock_owner", "unblocking_action", "resume_trigger", "resume_point"}
          REPO_FIELDS = {"repository", "default_branch", "working_branch", "head_sha", "first_unproven_repository_gate"}


          class ContractError(ValueError):
              pass


          def _require(condition: bool, message: str) -> None:
              if not condition:
                  raise ContractError(message)


          def _nonempty(value: Any, field: str) -> str:
              _require(isinstance(value, str) and bool(value.strip()), f"{field} must be a non-empty string")
              return value


          def _required_keys(value: Any, required: set[str], field: str) -> dict[str, Any]:
              _require(isinstance(value, dict), f"{field} must be an object")
              missing = sorted(required - set(value))
              _require(not missing, f"{field} missing required fields: {missing}")
              return value


          def load_json(path: Path) -> dict[str, Any]:
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  raise ContractError(f"cannot read JSON {path}: {exc}") from exc
              _require(isinstance(value, dict), f"{path} must contain a JSON object")
              return value


          def validate_schema_contract(schema: dict[str, Any] | None = None) -> None:
              schema = schema or load_json(SCHEMA_PATH)
              _require(schema.get("$schema") == "https://json-schema.org/draft/2020-12/schema", "checkpoint schema must use JSON Schema 2020-12")
              _require(schema.get("$id") == SCHEMA_VERSION, "checkpoint schema $id drift")
              _require(schema.get("schema_version") == SCHEMA_VERSION, "checkpoint schema version drift")
              top_required = set(schema.get("required", []))
              _require({"handoff_version", "source_controller", "source_conversation_state", "created_at", "threads"} <= top_required, "top-level checkpoint fields are incomplete")
              thread = schema.get("$defs", {}).get("thread", {})
              _require(REQUIRED_THREAD <= set(thread.get("required", [])), "thread checkpoint required fields are incomplete")
              dispositions = set(thread.get("properties", {}).get("disposition", {}).get("enum", []))
              _require(dispositions == DISPOSITIONS, "thread disposition enum drift")
              work_statuses = set(schema.get("$defs", {}).get("remaining_work", {}).get("properties", {}).get("status", {}).get("enum", []))
              _require(work_statuses == WORK_STATUSES, "remaining-work status enum drift")
              routes = set(thread.get("properties", {}).get("route", {}).get("enum", []))
              _require(routes == ROUTES, "checkpoint route enum drift")


          def _validate_decisions(items: Any, prefix: str) -> None:
              _require(isinstance(items, list), f"{prefix}.decisions must be an array")
              for index, item in enumerate(items):
                  field = f"{prefix}.decisions[{index}]"
                  obj = _required_keys(item, {"decision", "status", "evidence"}, field)
                  _nonempty(obj["decision"], f"{field}.decision")
                  _require(obj["status"] in DECISION_STATUSES, f"{field}.status is invalid")
                  _nonempty(obj["evidence"], f"{field}.evidence")


          def _validate_evidence(items: Any, prefix: str) -> bool:
              _require(isinstance(items, list), f"{prefix}.evidence must be an array")
              has_repository = False
              for index, item in enumerate(items):
                  field = f"{prefix}.evidence[{index}]"
                  obj = _required_keys(item, {"type", "identity", "value", "mutable"}, field)
                  _nonempty(obj["type"], f"{field}.type")
                  _nonempty(obj["identity"], f"{field}.identity")
                  _nonempty(obj["value"], f"{field}.value")
                  _require(isinstance(obj["mutable"], bool), f"{field}.mutable must be boolean")
                  has_repository |= obj["type"] == "repository"
              return has_repository


          def _validate_validations(items: Any, prefix: str) -> None:
              _require(isinstance(items, list), f"{prefix}.validations must be an array")
              for index, item in enumerate(items):
                  field = f"{prefix}.validations[{index}]"
                  obj = _required_keys(item, {"check", "target", "result"}, field)
                  _nonempty(obj["check"], f"{field}.check")
                  _nonempty(obj["target"], f"{field}.target")
                  _require(obj["result"] in {"PASS", "FAIL", "UNKNOWN", "SKIPPED"}, f"{field}.result is invalid")


          def _validate_remaining_work(items: Any, prefix: str) -> None:
              _require(isinstance(items, list), f"{prefix}.remaining_work must be an array")
              for index, item in enumerate(items):
                  field = f"{prefix}.remaining_work[{index}]"
                  obj = _required_keys(item, {"item", "status", "dependency", "consequence"}, field)
                  for key in ("item", "dependency", "consequence"):
                      _nonempty(obj[key], f"{field}.{key}")
                  _require(obj["status"] in WORK_STATUSES, f"{field}.status is invalid")


          def _validate_next_action(value: Any, prefix: str) -> None:
              obj = _required_keys(value, NEXT_ACTION_FIELDS, f"{prefix}.next_action")
              for key in NEXT_ACTION_FIELDS:
                  _nonempty(obj[key], f"{prefix}.next_action.{key}")


          def _validate_repository_state(value: Any, prefix: str) -> None:
              obj = _required_keys(value, REPO_FIELDS, f"{prefix}.repository_state")
              for key in ("repository", "default_branch", "working_branch", "first_unproven_repository_gate"):
                  _nonempty(obj[key], f"{prefix}.repository_state.{key}")
              _require(isinstance(obj["head_sha"], str) and re.fullmatch(r"[0-9a-f]{7,40}", obj["head_sha"]) is not None, f"{prefix}.repository_state.head_sha must be a 7-40 character lowercase hex SHA")


          def validate_checkpoint(payload: dict[str, Any]) -> None:
              _require(payload.get("handoff_version") == SCHEMA_VERSION, "unsupported handoff_version")
              _require(payload.get("source_controller") == "live-thread-convergence-controller", "unsupported source_controller")
              _require(payload.get("source_conversation_state") in {"ACTIVE", "DEGRADED", "CLOSING", "TERMINAL"}, "invalid source_conversation_state")
              _nonempty(payload.get("created_at"), "created_at")
              threads = payload.get("threads")
              _require(isinstance(threads, list) and bool(threads), "threads must be a non-empty array")
              seen: set[str] = set()
              for index, item in enumerate(threads):
                  prefix = f"threads[{index}]"
                  thread = _required_keys(item, REQUIRED_THREAD, prefix)
                  thread_id = _nonempty(thread["id"], f"{prefix}.id")
                  _require(thread_id not in seen, f"duplicate thread id: {thread_id}")
                  seen.add(thread_id)
                  _nonempty(thread["target"], f"{prefix}.target")
                  disposition = thread["disposition"]
                  _require(disposition in DISPOSITIONS, f"{prefix}.disposition is invalid")
                  priority = _required_keys(thread["priority"], {"rank", "rationale"}, f"{prefix}.priority")
                  _require(isinstance(priority["rank"], int) and priority["rank"] >= 1, f"{prefix}.priority.rank must be >= 1")
                  _nonempty(priority["rationale"], f"{prefix}.priority.rationale")
                  _nonempty(thread["current_state"], f"{prefix}.current_state")
                  _nonempty(thread["last_meaningful_action"], f"{prefix}.last_meaningful_action")
                  _validate_decisions(thread["decisions"], prefix)
                  has_repo_evidence = _validate_evidence(thread["evidence"], prefix)
                  _require(isinstance(thread["changed_surfaces"], list), f"{prefix}.changed_surfaces must be an array")
                  _validate_validations(thread["validations"], prefix)
                  _validate_remaining_work(thread["remaining_work"], prefix)
                  _require(thread["route"] in ROUTES, f"{prefix}.route is invalid")

                  if disposition in TERMINAL:
                      _require(thread["first_unproven_gate"] is None, f"{prefix}.first_unproven_gate must be null for terminal disposition")
                      _require(thread["next_action"] is None, f"{prefix}.next_action must be null for terminal disposition")
                      _require(thread["route"] in {"ARCHIVE ONLY", "NO CONTINUATION REQUIRED"}, f"{prefix}.route must be terminal")
                  else:
                      _nonempty(thread["first_unproven_gate"], f"{prefix}.first_unproven_gate")
                      _validate_next_action(thread["next_action"], prefix)

                  if disposition == "SUSPENDED":
                      _nonempty(thread["return_trigger"], f"{prefix}.return_trigger")
                  if disposition == "BLOCKED":
                      blocker = _required_keys(thread.get("blocker"), BLOCKER_FIELDS, f"{prefix}.blocker")
                      for key in BLOCKER_FIELDS:
                          _nonempty(blocker[key], f"{prefix}.blocker.{key}")
                  if disposition == "HANDOFF-READY":
                      _require(thread["route"] not in {"ARCHIVE ONLY", "NO CONTINUATION REQUIRED"}, f"{prefix}.HANDOFF-READY requires a continuation route")
                  if has_repo_evidence:
                      _validate_repository_state(thread.get("repository_state"), prefix)


          def main(argv: list[str] | None = None) -> int:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("checkpoint", nargs="?", type=Path)
              parser.add_argument("--schema-only", action="store_true", help="Validate the repository-owned schema contract without an instance")
              args = parser.parse_args(argv)
              try:
                  validate_schema_contract()
                  if args.schema_only:
                      print(json.dumps({"status": "PASS", "schema": SCHEMA_VERSION}, indent=2))
                      return 0
                  if args.checkpoint is None:
                      parser.error("checkpoint is required unless --schema-only is used")
                  validate_checkpoint(load_json(args.checkpoint))
              except ContractError as exc:
                  print(f"[FAIL] {exc}")
                  return 2
              print(json.dumps({"status": "PASS", "schema": SCHEMA_VERSION, "checkpoint": str(args.checkpoint)}, indent=2))
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          cat > harness/conversation-continuity/README.md <<'EOF'
          # Live Thread-Convergence → P02 Continuity Contract

          This directory owns the durable machine-checkable seam between a live conversation thread-convergence controller and P02 (`Previous Chat → Active Sprint Executor`). It does not replace either prompt. It makes the handoff resumable and testable.

          ## Ownership boundary

          - **Live controller:** detects material divergence, selects one focused thread, checkpoints every suspended thread, drives the focused target to COMPLETE, BLOCKED, HANDOFF-READY, or SUPERSEDED, then either restores work in the current conversation or emits this checkpoint for P02.
          - **P02:** ingests a validated checkpoint when the current conversation is being retired or a clean execution surface is required. P02 refreshes mutable repository/provider/runtime evidence and resumes from the first unproven gate. It does not replay completed work merely to rebuild context.

          ## Trigger boundary

          Emit a checkpoint for P02 when conversation closeout is explicit, the context surface has become execution-degrading, the remaining thread belongs on a different execution surface, or the active thread is coherently blocked/hand-off ready. Do not route to P02 for a brief side question, a normal dependency, or a suspended thread that can be safely restored in the current conversation.

          ## Contract

          Canonical schema: `harness/conversation-continuity/checkpoint.schema.v1.json`

          Canonical validator: `scripts/validate_conversation_handoff_checkpoint.py`

          Stable invocation:

          ```bash
          python scripts/validate_conversation_handoff_checkpoint.py path/to/checkpoint.json
          ```

          Validate the repository-owned schema contract itself with:

          ```bash
          python scripts/validate_conversation_handoff_checkpoint.py --schema-only
          ```

          Each surviving thread carries target/disposition/priority, current execution state, last meaningful action, first unproven gate, settled/provisional decisions, exact evidence anchors, changed surfaces, completed validations, classified remaining work, exact next action, route, and return trigger. BLOCKED threads additionally carry the exact blocker and unblocking/resumption contract. Repository-backed threads carry exact branch/head and first unproven repository gate state.

          ## P02 ingestion algorithm

          1. Validate the checkpoint before treating it as a durable execution ledger.
          2. Preserve valid settled decisions and historical proof; do not reconstruct them from scratch.
          3. Refresh every mutable evidence anchor before treating it as current truth.
          4. Reconcile moved state narrowly: state moved, unsupported prior claim, invalidated decision, or work collision.
          5. Resume from `first_unproven_gate` and `next_action`; rerun only proof invalidated by moved inputs/head/dependencies.
          6. Search older conversation/history only for genuine gaps, contradictions, or omitted targets.
          7. Route every surviving thread to resumed execution, durable handoff, exact blocker, user-only gate, archive, superseded, or complete.

          ## Anti-rework invariant

          The checkpoint is a starting execution ledger, not a prose summary. A new agent must not re-plan everything when the carried decisions/proof remain valid. Mutable state is refreshed; durable proof is preserved; execution restarts at the first unproven gate.

          ## Proof ceiling

          Schema/validator PASS proves structural and cross-field resumability requirements. It does **not** prove that evidence values are factually current. P02 still owns current-truth refresh before mutation.
          EOF

          cat > tests/test_conversation_handoff_checkpoint.py <<'PY'
          import copy
          import json
          import unittest
          from pathlib import Path

          from scripts.validate_conversation_handoff_checkpoint import (
              ContractError,
              SCHEMA_VERSION,
              validate_checkpoint,
              validate_schema_contract,
          )

          ROOT = Path(__file__).resolve().parents[1]


          def good_checkpoint():
              return {
                  "handoff_version": SCHEMA_VERSION,
                  "source_controller": "live-thread-convergence-controller",
                  "source_conversation_state": "CLOSING",
                  "created_at": "2026-09-13T00:00:00Z",
                  "threads": [{
                      "id": "thread-p02-checkpoint",
                      "target": "Persist resumable live-thread handoff",
                      "disposition": "HANDOFF-READY",
                      "priority": {"rank": 1, "rationale": "Current context is closing."},
                      "current_state": "Implementation is ready for P02 continuation.",
                      "last_meaningful_action": "Validated the focused handoff contract.",
                      "first_unproven_gate": "Refresh current provider truth before mutation.",
                      "decisions": [{"decision": "Resume from first unproven gate.", "status": "SETTLED", "evidence": "Live/P02 continuity contract."}],
                      "evidence": [{"type": "conversation", "identity": "handoff-contract", "value": "Checkpoint produced after focused convergence.", "mutable": False}],
                      "changed_surfaces": ["harness/conversation-continuity/checkpoint.schema.v1.json"],
                      "validations": [{"check": "checkpoint contract", "target": SCHEMA_VERSION, "result": "PASS"}],
                      "remaining_work": [{"item": "Refresh mutable provider evidence.", "status": "SAFE & EXECUTABLE", "dependency": "Repository access", "consequence": "Current branch/PR state would otherwise be stale."}],
                      "next_action": {"owner": "P02", "dependency": "Validated checkpoint", "action": "Refresh mutable evidence and resume first unproven gate.", "expected_output": "Current execution floor", "completion_gate": "All mutable anchors reconciled"},
                      "route": "RESUME IN NEW CONVERSATION",
                      "return_trigger": "P02 ingestion begins"
                  }]
              }


          class ConversationHandoffCheckpointTests(unittest.TestCase):
              def test_schema_contract_is_stable(self):
                  validate_schema_contract()

              def test_valid_handoff_ready_checkpoint_passes(self):
                  validate_checkpoint(good_checkpoint())

              def test_missing_required_thread_field_fails(self):
                  payload = good_checkpoint()
                  del payload["threads"][0]["first_unproven_gate"]
                  with self.assertRaisesRegex(ContractError, "first_unproven_gate"):
                      validate_checkpoint(payload)

              def test_suspended_thread_requires_return_trigger(self):
                  payload = good_checkpoint()
                  payload["threads"][0]["disposition"] = "SUSPENDED"
                  payload["threads"][0]["return_trigger"] = ""
                  with self.assertRaisesRegex(ContractError, "return_trigger"):
                      validate_checkpoint(payload)

              def test_blocked_thread_requires_exact_blocker_contract(self):
                  payload = good_checkpoint()
                  payload["threads"][0]["disposition"] = "BLOCKED"
                  with self.assertRaisesRegex(ContractError, "blocker"):
                      validate_checkpoint(payload)
                  payload["threads"][0]["blocker"] = {
                      "exact_blocker": "Protected runtime unavailable",
                      "unblock_owner": "runtime owner",
                      "unblocking_action": "Restore runtime access",
                      "resume_trigger": "Runtime is reachable",
                      "resume_point": "Run the first unproven runtime check"
                  }
                  validate_checkpoint(payload)

