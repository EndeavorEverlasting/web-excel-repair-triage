name: Conversation checkpoint validator review carrier

on:
  push:
    branches: [fix/repository-plan-durability-20260912]
    paths:
      - '.github/workflows/conversation-handoff-checkpoint-review-carrier.yml'

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repository-plan-durability-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh floor
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/repository-plan-durability-20260912 --prune --tags
          git merge --ff-only origin/fix/repository-plan-durability-20260912
          git merge-base --is-ancestor origin/main HEAD
      - name: Tighten validator to schema semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate_conversation_handoff_checkpoint.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import re\nfrom pathlib import Path', 'import re\nfrom datetime import datetime\nfrom pathlib import Path', 1)
          text = text.replace(
              'ROUTES = {"RESUME IN NEW CONVERSATION", "ROUTE TO P07", "ROUTE TO DOMAIN OWNER", "USER ACTION THEN RESUME", "ARCHIVE ONLY", "NO CONTINUATION REQUIRED"}\n',
              'ROUTES = {"RESUME IN NEW CONVERSATION", "ROUTE TO P07", "ROUTE TO DOMAIN OWNER", "USER ACTION THEN RESUME", "ARCHIVE ONLY", "NO CONTINUATION REQUIRED"}\nEVIDENCE_TYPES = {"conversation", "repository", "artifact", "file", "runtime", "external-system", "other"}\n',
              1,
          )
          needle = '''def _required_keys(value: Any, required: set[str], field: str) -> dict[str, Any]:\n    _require(isinstance(value, dict), f"{field} must be an object")\n    missing = sorted(required - set(value))\n    _require(not missing, f"{field} missing required fields: {missing}")\n    return value\n'''
          replacement = needle + '''\n\ndef _no_extra_keys(value: dict[str, Any], allowed: set[str], field: str) -> None:\n    extras = sorted(set(value) - allowed)\n    _require(not extras, f"{field} has unsupported fields: {extras}")\n\n\ndef _date_time(value: Any, field: str) -> str:\n    raw = _nonempty(value, field)\n    try:\n        parsed = datetime.fromisoformat(raw.replace("Z", "+00:00"))\n    except ValueError as exc:\n        raise ContractError(f"{field} must be an RFC 3339 date-time") from exc\n    _require(parsed.utcoffset() is not None, f"{field} must include a timezone")\n    return raw\n'''
          if needle not in text:
              raise SystemExit('required-keys helper marker missing')
          text = text.replace(needle, replacement, 1)
          text = text.replace(
              '    routes = set(thread.get("properties", {}).get("route", {}).get("enum", []))\n    _require(routes == ROUTES, "checkpoint route enum drift")\n',
              '    routes = set(thread.get("properties", {}).get("route", {}).get("enum", []))\n    _require(routes == ROUTES, "checkpoint route enum drift")\n    evidence_types = set(schema.get("$defs", {}).get("evidence", {}).get("properties", {}).get("type", {}).get("enum", []))\n    _require(evidence_types == EVIDENCE_TYPES, "checkpoint evidence-type enum drift")\n',
              1,
          )
          text = text.replace(
              '        obj = _required_keys(item, {"decision", "status", "evidence"}, field)\n',
              '        obj = _required_keys(item, {"decision", "status", "evidence"}, field)\n        _no_extra_keys(obj, {"decision", "status", "evidence"}, field)\n',
              1,
          )
          text = text.replace(
              '        obj = _required_keys(item, {"type", "identity", "value", "mutable"}, field)\n        _nonempty(obj["type"], f"{field}.type")\n',
              '        obj = _required_keys(item, {"type", "identity", "value", "mutable"}, field)\n        _no_extra_keys(obj, {"type", "identity", "value", "mutable"}, field)\n        _require(obj["type"] in EVIDENCE_TYPES, f"{field}.type is invalid")\n',
              1,
          )
          text = text.replace(
              '        obj = _required_keys(item, {"check", "target", "result"}, field)\n',
              '        obj = _required_keys(item, {"check", "target", "result"}, field)\n        _no_extra_keys(obj, {"check", "target", "result", "evidence"}, field)\n',
              1,
          )
          text = text.replace(
              '        _require(obj["result"] in {"PASS", "FAIL", "UNKNOWN", "SKIPPED"}, f"{field}.result is invalid")\n',
              '        _require(obj["result"] in {"PASS", "FAIL", "UNKNOWN", "SKIPPED"}, f"{field}.result is invalid")\n        _require(obj.get("evidence") is None or isinstance(obj.get("evidence"), str), f"{field}.evidence must be string or null")\n',
              1,
          )
          text = text.replace(
              '        obj = _required_keys(item, {"item", "status", "dependency", "consequence"}, field)\n',
              '        obj = _required_keys(item, {"item", "status", "dependency", "consequence"}, field)\n        _no_extra_keys(obj, {"item", "status", "dependency", "consequence"}, field)\n',
              1,
          )
          text = text.replace(
              '    obj = _required_keys(value, NEXT_ACTION_FIELDS, f"{prefix}.next_action")\n',
              '    obj = _required_keys(value, NEXT_ACTION_FIELDS, f"{prefix}.next_action")\n    _no_extra_keys(obj, NEXT_ACTION_FIELDS, f"{prefix}.next_action")\n',
              1,
          )
          text = text.replace(
              '    _require(payload.get("handoff_version") == SCHEMA_VERSION, "unsupported handoff_version")\n',
              '    _require(isinstance(payload, dict), "checkpoint must be an object")\n    _no_extra_keys(payload, {"handoff_version", "source_controller", "source_conversation_state", "created_at", "threads"}, "checkpoint")\n    _require(payload.get("handoff_version") == SCHEMA_VERSION, "unsupported handoff_version")\n',
              1,
          )
          text = text.replace('    _nonempty(payload.get("created_at"), "created_at")\n', '    _date_time(payload.get("created_at"), "created_at")\n', 1)
          text = text.replace(
              '        thread = _required_keys(item, REQUIRED_THREAD, prefix)\n',
              '        thread = _required_keys(item, REQUIRED_THREAD, prefix)\n        _no_extra_keys(thread, REQUIRED_THREAD | {"blocker", "repository_state"}, prefix)\n',
              1,
          )
          text = text.replace(
              '        priority = _required_keys(thread["priority"], {"rank", "rationale"}, f"{prefix}.priority")\n',
              '        priority = _required_keys(thread["priority"], {"rank", "rationale"}, f"{prefix}.priority")\n        _no_extra_keys(priority, {"rank", "rationale"}, f"{prefix}.priority")\n',
              1,
          )
          text = text.replace(
              '        _require(isinstance(thread["changed_surfaces"], list), f"{prefix}.changed_surfaces must be an array")\n',
              '        _require(isinstance(thread["changed_surfaces"], list), f"{prefix}.changed_surfaces must be an array")\n        for surface_index, surface in enumerate(thread["changed_surfaces"]):\n            _nonempty(surface, f"{prefix}.changed_surfaces[{surface_index}]")\n',
              1,
          )
          text = text.replace(
              '            blocker = _required_keys(thread.get("blocker"), BLOCKER_FIELDS, f"{prefix}.blocker")\n',
              '            blocker = _required_keys(thread.get("blocker"), BLOCKER_FIELDS, f"{prefix}.blocker")\n            _no_extra_keys(blocker, BLOCKER_FIELDS, f"{prefix}.blocker")\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_conversation_handoff_checkpoint.py')
          test = test_path.read_text(encoding='utf-8')
          marker = '''    def test_suspended_thread_requires_return_trigger(self):\n'''
          addition = '''    def test_unknown_top_level_field_is_rejected(self):\n        payload = good_checkpoint()\n        payload["unexpected"] = True\n        with self.assertRaisesRegex(ContractError, "unsupported fields"):\n            validate_checkpoint(payload)\n\n    def test_invalid_evidence_type_is_rejected(self):\n        payload = good_checkpoint()\n        payload["threads"][0]["evidence"][0]["type"] = "wishful-thinking"\n        with self.assertRaisesRegex(ContractError, "type is invalid"):\n            validate_checkpoint(payload)\n\n    def test_created_at_requires_timezone(self):\n        payload = good_checkpoint()\n        payload["created_at"] = "2026-09-13T00:00:00"\n        with self.assertRaisesRegex(ContractError, "timezone"):\n            validate_checkpoint(payload)\n\n'''
          if addition not in test:
              if marker not in test:
                  raise SystemExit('test insertion marker missing')
              test = test.replace(marker, addition + marker, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Revalidate focused and generated contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_conversation_handoff_checkpoint.py --schema-only
          python -m unittest -v \
            tests.test_conversation_handoff_checkpoint \
            tests.test_repository_plan_durability \
            tests.test_p02_p07_autonomous_iteration \
            tests.test_operational_closeout_contract
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit repair and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_conversation_handoff_checkpoint.py tests/test_conversation_handoff_checkpoint.py
          git commit -m "fix(harness): enforce checkpoint schema parity"
          git rm -f .github/workflows/conversation-handoff-checkpoint-review-carrier.yml
          git commit -m "chore(harness): remove checkpoint review carrier"
          git push origin HEAD:fix/repository-plan-durability-20260912
