name: delivery-signoff-generator

on:
  pull_request:
    paths:
      - 'triage/delivery_signoff/**'
      - 'scripts/generate_delivery_signoff.py'
      - 'scripts/evaluate_delivery_signoff_trigger.py'
      - 'scripts/validate_delivery_signoff_harness.py'
      - 'tests/fixtures/delivery_signoff/**'
      - 'tests/fixtures/delivery_signoff_trigger/**'
      - 'tests/test_delivery_signoff_generator.py'
      - 'tests/test_delivery_signoff_harness_validator.py'
      - 'tests/test_delivery_signoff_trigger.py'
      - 'harness/delivery-signoff/**'
      - 'reports/harness/delivery-signoff-state.md'
      - 'skills/delivery-signoff-generation/**'
      - 'capabilities/delivery-signoff-generation.json'
      - 'triggers/delivery-signoff-generation.json'
      - '.github/workflows/delivery-signoff-generator.yml'
  push:
    branches:
      - main
      - 'feat/delivery-signoff-*'

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Run focused generator, manifest, and trigger tests
        run: python -m pytest -q tests/test_delivery_signoff_generator.py tests/test_delivery_signoff_harness_validator.py tests/test_delivery_signoff_trigger.py
      - name: Generate protected-data-safe acceptance fixtures
        run: |
          python scripts/generate_delivery_signoff.py tests/fixtures/delivery_signoff/melville_3hq_20260805.json --output-root Outputs/delivery-signoff/ci
          python scripts/generate_delivery_signoff.py tests/fixtures/delivery_signoff/huntington_hospital_20260805.json --output-root Outputs/delivery-signoff/ci
      - name: Validate generated manifests against normalized inputs
        run: |
          find Outputs/delivery-signoff/ci -name delivery-signoff-artifact-manifest.json -print0 |
            xargs -0 -n1 python scripts/validate_delivery_signoff_harness.py --manifest
      - name: Compile generator surfaces
        run: python -m py_compile triage/delivery_signoff/*.py scripts/generate_delivery_signoff.py scripts/evaluate_delivery_signoff_trigger.py scripts/validate_delivery_signoff_harness.py
      - name: Check patch whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
      - name: Publish sign-off acceptance packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-signoff-acceptance-packages
          path: Outputs/delivery-signoff/ci
          if-no-files-found: error
