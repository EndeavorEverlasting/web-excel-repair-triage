name: Deterministic repository test floor

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deterministic-test-floor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  CI: "true"

jobs:
  deterministic-test-floor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Verify exact candidate and fetch main evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" != ""
          echo "deterministic test-floor candidate sha=$actual"
          echo "deterministic test-floor main floor=$(git rev-parse origin/main)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test-floor.txt

      - name: One-shot P114 network contribution carrier
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/p114-canary-network-20260826'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python scripts/tmp_p114_network_patch.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_conversation_context_canary_prompt -v
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('registry/prompts/spec-architecture-prompts.v1.json').read_text(encoding='utf-8'))
          matches = [x for x in data['prompts'] if x.get('id') == 'P114']
          if len(matches) != 1:
              raise SystemExit(f'P114 ownership drift: {len(matches)} matches')
          c = matches[0]['copyContent']
          labels = ('WAB', 'Guest', 'Hardwire', 'Local', 'Arbitrary/N/A')
          checks = {
              'exact network vocabulary': all(x in c for x in labels),
              'unknown distinct from n/a': 'It must never be used as a synonym for unknown' in c and 'NETWORK=UNKNOWN' in c,
              'required vs observed': 'network the user should be on for the current task' in c and 'observed live network' in c,
              'lightweight stub': 'CANARY STUB — Before every response emit CANARY | PROFILE=<canonical computer profile> | NETWORK=<WAB|Guest|Hardwire|Local|Arbitrary/N/A>' in c,
              'neighbor boundary': 'must not create a competing profile or network registry' in c,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'P114 pass-2 semantic falsification failed: {failed}')
          ordered = ('1. STABLE BASELINE', '2. RECOVERY CASE', '3. LEGITIMATE CHANGE', '4. REPEATED DRIFT', '5. UNRECOVERABLE STATE')
          positions = [c.index(x) for x in ordered]
          if positions != sorted(positions):
              raise SystemExit('P114 semantic validation order is not monotonic')
          print('P114 pass-2 semantic falsification: PASS')
          PY

          python -m unittest tests.test_conversation_context_canary_prompt -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          git checkout origin/main -- .github/workflows/deterministic-test-floor.yml
          git reset HEAD -- .github/workflows/tmp-p114-canary-network-strengthen.yml .github/workflows/tmp-p114-canary-network-push.yml scripts/tmp_p114_network_patch.py || true
          rm -f .github/workflows/tmp-p114-canary-network-strengthen.yml .github/workflows/tmp-p114-canary-network-push.yml scripts/tmp_p114_network_patch.py
          git add -A .github/workflows/deterministic-test-floor.yml .github/workflows/tmp-p114-canary-network-strengthen.yml .github/workflows/tmp-p114-canary-network-push.yml scripts/tmp_p114_network_patch.py registry/prompts/spec-architecture-prompts.v1.json tests/test_conversation_context_canary_prompt.py web/prompt-kit/index.html
          git diff --cached --check

          final_diff="$(git diff --name-only origin/main --cached)"
          printf '%s\n' '--- final durable diff vs main ---' "$final_diff"
          test "$(printf '%s\n' "$final_diff" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$final_diff" | grep -Fx 'registry/prompts/spec-architecture-prompts.v1.json'
          printf '%s\n' "$final_diff" | grep -Fx 'tests/test_conversation_context_canary_prompt.py'
          printf '%s\n' "$final_diff" | grep -Fx 'web/prompt-kit/index.html'

          git commit -m "feat(prompt-kit): add network posture to P114 canary"
          git push origin HEAD:feat/p114-canary-network-20260826

      - name: Negative generated-site canary must fail closed
        shell: bash
        run: |
          set -euo pipefail
          cp web/prompt-kit/index.html "$RUNNER_TEMP/prompt-kit-index.clean.html"
          printf '\n<!-- deterministic-test-floor-negative-canary -->\n' >> web/prompt-kit/index.html
          set +e
          python scripts/run_deterministic_test_floor.py \
            --report "$RUNNER_TEMP/negative-canary-report.json"
          status=$?
          set -e
          mv "$RUNNER_TEMP/prompt-kit-index.clean.html" web/prompt-kit/index.html
          if [ "$status" -eq 0 ]; then
            echo "Negative canary unexpectedly passed" >&2
            exit 1
          fi
          python - "$RUNNER_TEMP/negative-canary-report.json" harness/test-floor.v1.json <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          expected = manifest['required_canary_failure']
          if report.get('status') != 'FAIL' or report.get('failed_step') != expected:
              raise SystemExit(
                  f"negative canary failed at {report.get('failed_step')!r}; expected {expected!r}"
              )
          print(f"negative canary proved earliest registered failure gate: {expected}")
          PY

      - name: Run clean deterministic test floor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_deterministic_test_floor.py \
            --report "$RUNNER_TEMP/deterministic-test-floor-report.json"

      - name: Upload deterministic test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-test-floor-reports
          path: |
            ${{ runner.temp }}/negative-canary-report.json
            ${{ runner.temp }}/deterministic-test-floor-report.json
          if-no-files-found: error
