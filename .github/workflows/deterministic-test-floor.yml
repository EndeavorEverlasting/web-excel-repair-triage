name: Deterministic repository test floor

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deterministic-test-floor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  CI: "true"

jobs:
  deterministic-test-floor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact candidate and fetch comparison evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" != ""
          if [[ -n "${PR_BASE:-}" && "$PR_BASE" != "main" ]]; then
            git fetch --no-tags origin \
              "+refs/heads/${PR_BASE}:refs/remotes/origin/${PR_BASE}"
            test "$(git rev-parse "origin/${PR_BASE}")" != ""
          fi
          echo "deterministic test-floor candidate sha=$actual"
          echo "deterministic test-floor main floor=$(git rev-parse origin/main)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test-floor.txt

      - name: Enforce canonical prompt mutator quarantine
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="origin/${PR_BASE:-main}"
          elif [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_ref="$BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_ref="HEAD^"
          else
            echo "cannot establish a safe candidate base for quarantine enforcement" >&2
            exit 1
          fi
          candidate_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          python scripts/validate_prompt_regression_safety.py \
            --summary \
            --enforce-mutator-quarantine \
            --base-ref "$base_ref" \
            --head-ref HEAD \
            --candidate-ref "$candidate_ref"

      - name: Negative generated-site canary must prove declared failure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_deterministic_test_floor_canary.py \
            --contract harness/contracts/deterministic-test-floor-canary.v1.json \
            --report "$RUNNER_TEMP/negative-canary-report.json" \
            --floor-report "$RUNNER_TEMP/negative-canary-floor-report.json" \
            --baseline-floor-report "$RUNNER_TEMP/negative-canary-clean-floor-report.json"

      - name: Negative P07 semantic-weakening canary must prove declared failure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_deterministic_test_floor_canary.py \
            --contract harness/contracts/prompt-semantic-weakening-canary.v1.json \
            --report "$RUNNER_TEMP/semantic-weakening-canary-report.json" \
            --floor-report "$RUNNER_TEMP/semantic-weakening-canary-floor-report.json" \
            --baseline-floor-report "$RUNNER_TEMP/semantic-weakening-canary-clean-floor-report.json"

      - name: Private-input gate must block on clean public runner
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python scripts/run_private_input_test_floor.py \
            --report "$RUNNER_TEMP/private-input-blocked-report.json"
          status=$?
          set -e
          if [ "$status" -ne 3 ]; then
            echo "Expected private-input readiness blocker (exit 3), observed $status" >&2
            exit 1
          fi
          python - "$RUNNER_TEMP/private-input-blocked-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if report.get('status') != 'BLOCKED' or report.get('failed_step') != 'private-input-readiness':
              raise SystemExit(f"unexpected private-input gate receipt: {report}")
          missing = report.get('missing_input_ids') or []
          if len(missing) != 3:
              raise SystemExit(f"expected three unavailable private inputs, observed {missing!r}")
          print("private-input gate proved fail-closed on clean public runner: " + ", ".join(missing))
          PY

      - name: Run clean deterministic test floor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_deterministic_test_floor.py \
            --report "$RUNNER_TEMP/deterministic-test-floor-report.json"

      - name: Upload deterministic test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-test-floor-reports
          path: |
            ${{ runner.temp }}/negative-canary-report.json
            ${{ runner.temp }}/negative-canary-floor-report.json
            ${{ runner.temp }}/negative-canary-clean-floor-report.json
            ${{ runner.temp }}/semantic-weakening-canary-report.json
            ${{ runner.temp }}/semantic-weakening-canary-floor-report.json
            ${{ runner.temp }}/semantic-weakening-canary-clean-floor-report.json
            ${{ runner.temp }}/private-input-blocked-report.json
            ${{ runner.temp }}/deterministic-test-floor-report.json
          if-no-files-found: error
