name: Deterministic repository test floor

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deterministic-test-floor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  CI: "true"

jobs:
  deterministic-test-floor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Verify exact candidate and fetch main evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" != ""
          echo "deterministic test-floor candidate sha=$actual"
          echo "deterministic test-floor main floor=$(git rev-parse origin/main)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test-floor.txt

      - name: One-shot P125 period/source coercion contribution
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/p125-period-source-coercion-20260908'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python tmp/p125_period_source_coercion.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_hh_ticket_tracking_prompt -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          git add \
            registry/prompts/management-operations-prompts.v1.json \
            tests/test_hh_ticket_tracking_prompt.py \
            web/prompt-kit/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "P125 durable contribution already present; no push needed."
          else
            git commit -m "fix(prompt-kit): coerce P125 period across Outlook and Teams"
            git push origin HEAD:fix/p125-period-source-coercion-20260908
          fi

      - name: Negative generated-site canary must fail closed
        shell: bash
        run: |
          set -euo pipefail
          cp web/prompt-kit/index.html "$RUNNER_TEMP/prompt-kit-index.clean.html"
          printf '\n<!-- deterministic-test-floor-negative-canary -->\n' >> web/prompt-kit/index.html
          set +e
          python scripts/run_deterministic_test_floor.py \
            --report "$RUNNER_TEMP/negative-canary-report.json"
          status=$?
          set -e
          mv "$RUNNER_TEMP/prompt-kit-index.clean.html" web/prompt-kit/index.html
          if [ "$status" -eq 0 ]; then
            echo "Negative canary unexpectedly passed" >&2
            exit 1
          fi
          python - "$RUNNER_TEMP/negative-canary-report.json" harness/test-floor.v1.json <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          expected = manifest['required_canary_failure']
          if report.get('status') != 'FAIL' or report.get('failed_step') != expected:
              raise SystemExit(
                  f"negative canary failed at {report.get('failed_step')!r}; expected {expected!r}"
              )
          print(f"negative canary proved earliest registered failure gate: {expected}")
          PY

      - name: Private-input gate must block on clean public runner
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python scripts/run_private_input_test_floor.py \
            --report "$RUNNER_TEMP/private-input-blocked-report.json"
          status=$?
          set -e
          if [ "$status" -ne 3 ]; then
            echo "Expected private-input readiness blocker (exit 3), observed $status" >&2
            exit 1
          fi
          python - "$RUNNER_TEMP/private-input-blocked-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if report.get('status') != 'BLOCKED' or report.get('failed_step') != 'private-input-readiness':
              raise SystemExit(f"unexpected private-input gate receipt: {report}")
          missing = report.get('missing_input_ids') or []
          if len(missing) != 3:
              raise SystemExit(f"expected three unavailable private inputs, observed {missing!r}")
          print("private-input gate proved fail-closed on clean public runner: " + ", ".join(missing))
          PY

      - name: Run clean deterministic test floor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_deterministic_test_floor.py \
            --report "$RUNNER_TEMP/deterministic-test-floor-report.json"

      - name: Upload deterministic test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-test-floor-reports
          path: |
            ${{ runner.temp }}/negative-canary-report.json
            ${{ runner.temp }}/private-input-blocked-report.json
            ${{ runner.temp }}/deterministic-test-floor-report.json
          if-no-files-found: error
