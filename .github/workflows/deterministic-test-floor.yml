name: Deterministic repository test floor

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deterministic-test-floor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  CI: "true"

jobs:
  deterministic-test-floor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Verify exact candidate and fetch main evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" != ""
          echo "deterministic test-floor candidate sha=$actual"
          echo "deterministic test-floor main floor=$(git rev-parse origin/main)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test-floor.txt

      - name: One-shot H+H ticket prompt helper contribution
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/hh-ticket-tracker-copilot-20260903'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo '--- helper add receipt ---'
          python scripts/prompt_registry_ops.py add \
            --input tmp/hh-ticket-tracking-prompt-draft.json \
            --registry management-operations-prompts \
            | tee "$RUNNER_TEMP/hh-ticket-helper-receipt.json"

          echo '--- focused semantic assertion ---'
          python -m unittest tests.test_hh_ticket_tracking_prompt -v

          echo '--- pass 1 validation ---'
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py \
            --output web/prompt-kit/index.html --check
          git diff --check

          echo '--- pass 2 whole-context semantic falsification ---'
          python - <<'PY'
          from scripts import build_prompt_kit_registry
          prompts = build_prompt_kit_registry.load_prompt_kit_registry()
          target = [p for p in prompts if p.get('name') == 'Health + Hospitals Ticket Discovery & Tracking Harvester']
          if len(target) != 1:
              raise SystemExit(f'expected one H+H ticket owner, found {len(target)}')
          p = target[0]
          c = p['copyContent']
          required_people = (
              'Brian McCarthy', "Dennis O'Connell", 'Kurt Lavia', 'Anthony James',
              'Vanessa Burks', 'Richard Plaza', 'Carol Ann Rosado', 'Kaiyang He (Kelly)'
          )
          required_statuses = (
              'NEW / INTAKE', 'COORDINATION', 'ASSIGNED', 'IN PROGRESS',
              'WAITING / BLOCKED', 'COMPLETION REPORTED', 'CLOSED / RESOLVED', 'UNKNOWN'
          )
          checks = {
              'new distinct owner': p['id'] not in {'P88', 'P89'} and p['class'] == 'H+H SUPPORT / TICKET TRACKING',
              'non-billing profile': p.get('profile') == 'triage-management',
              'both source workflow': 'Search both Outlook and Teams inside the requested window' in c,
              'priority people': all(name in c for name in required_people),
              'priority not whitelist': 'DO NOT TREAT THEM AS AN EXCLUSIVE WHITELIST' in c,
              'cross-source incident reconciliation': 'If an Outlook hit contains an incident number, search that incident in Teams' in c,
              'identity fail-closed': 'PROVISIONAL identity' in c and 'Never merge two records solely because' in c,
              'status separation': all(state in c for state in required_statuses),
              'completion discipline': '`In progress` is not completion' in c and 'do not upgrade to CLOSED / RESOLVED unless' in c,
              'billing boundary': 'THIS IS NOT A BILLING HARVEST' in c and 'must not calculate hours, billing allocations, attendance' in c,
              'empty result fail-closed': 'do not manufacture a ticket to make the digest nonempty' in c,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'H+H pass-2 semantic falsification failed: {failed}')
          if prompts[[p.get('id') for p in prompts].index('P88')]['name'] != 'Outlook Work-Evidence Harvester':
              raise SystemExit('P88 role drifted')
          if prompts[[p.get('id') for p in prompts].index('P89')]['name'] != 'Teams Work-Evidence Harvester':
              raise SystemExit('P89 role drifted')
          print(f"H+H pass-2 semantic falsification: PASS id={p['id']}")
          PY

          python -m unittest tests.test_hh_ticket_tracking_prompt -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py \
            --output web/prompt-kit/index.html --check
          git diff --check

          echo '--- deterministic floor on mutated candidate ---'
          python scripts/run_deterministic_test_floor.py \
            --report "$RUNNER_TEMP/hh-ticket-deterministic-floor.json"

          echo '--- restore transport and commit only durable contribution ---'
          git checkout origin/main -- .github/workflows/deterministic-test-floor.yml
          git rm -f tmp/hh-ticket-tracking-prompt-draft.json
          git add \
            .github/workflows/deterministic-test-floor.yml \
            registry/prompts/management-operations-prompts.v1.json \
            tests/test_hh_ticket_tracking_prompt.py \
            web/prompt-kit/index.html
          git diff --cached --check

          final_diff="$(git diff --cached --name-only origin/main)"
          printf '%s\n' '--- final durable diff vs main ---' "$final_diff"
          test "$(printf '%s\n' "$final_diff" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$final_diff" | grep -Fx 'registry/prompts/management-operations-prompts.v1.json'
          printf '%s\n' "$final_diff" | grep -Fx 'tests/test_hh_ticket_tracking_prompt.py'
          printf '%s\n' "$final_diff" | grep -Fx 'web/prompt-kit/index.html'

          git commit -m "feat(prompt-kit): add H+H ticket tracking harvester"
          git push origin HEAD:feat/hh-ticket-tracker-copilot-20260903

      - name: Negative generated-site canary must fail closed
        shell: bash
        run: |
          set -euo pipefail
          cp web/prompt-kit/index.html "$RUNNER_TEMP/prompt-kit-index.clean.html"
          printf '\n<!-- deterministic-test-floor-negative-canary -->\n' >> web/prompt-kit/index.html
          set +e
          python scripts/run_deterministic_test_floor.py \
            --report "$RUNNER_TEMP/negative-canary-report.json"
          status=$?
          set -e
          mv "$RUNNER_TEMP/prompt-kit-index.clean.html" web/prompt-kit/index.html
          if [ "$status" -eq 0 ]; then
            echo "Negative canary unexpectedly passed" >&2
            exit 1
          fi
          python - "$RUNNER_TEMP/negative-canary-report.json" harness/test-floor.v1.json <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          expected = manifest['required_canary_failure']
          if report.get('status') != 'FAIL' or report.get('failed_step') != expected:
              raise SystemExit(
                  f"negative canary failed at {report.get('failed_step')!r}; expected {expected!r}"
              )
          print(f"negative canary proved earliest registered failure gate: {expected}")
          PY

      - name: Run clean deterministic test floor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_deterministic_test_floor.py \
            --report "$RUNNER_TEMP/deterministic-test-floor-report.json"

      - name: Upload deterministic test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-test-floor-reports
          path: |
            ${{ runner.temp }}/negative-canary-report.json
            ${{ runner.temp }}/deterministic-test-floor-report.json
            ${{ runner.temp }}/hh-ticket-helper-receipt.json
            ${{ runner.temp }}/hh-ticket-deterministic-floor.json
          if-no-files-found: warn
