name: Fresh floor and P13 iteration sync v5

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'feat/p07-fresh-floor-p13-iteration-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p07-fresh-floor-p13-iteration-20260819
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair temporary patcher and strengthen freshness assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_fresh_floor_p13_patch.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'The goal is repository memory that improves itself through evidence, not a rule landfill."\n\nprompts_path.write_text': 'The goal is repository memory that improves itself through evidence, not a rule landfill."""\n\nprompts_path.write_text',
              'Repository progress executed from a freshly reconciled remote/default-branch floor, ': 'Repository progress executed from a refreshed and reconciled remote/default-branch floor, ',
              'self.assertIn("refreshed remote/default-branch floor", p07["expectedOutput"])': 'self.assertIn("refreshed and reconciled remote/default-branch floor", p07["expectedOutput"])',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/_fresh_floor_p13_patch.py
      - name: Apply durable freshness and P13 changes
        run: python scripts/_fresh_floor_p13_patch.py
      - name: Pass 1 focused policy validation
        run: |
          python -m py_compile scripts/build_prompt_kit_registry.py tests/test_remote_freshness_p13_iteration.py
          python -m json.tool registry/prompts/actionable-next-step-policy.v1.json > /dev/null
          python -m unittest tests.test_remote_freshness_p13_iteration -v
          python -m unittest tests.test_green_branch_integration_policy -v
          python -m unittest tests.test_actionable_prompt_registry -v
      - name: Pass 2 generated artifact and regression validation
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_remote_freshness_p13_iteration -v
          python -m unittest tests.test_prompt_language_audit -v
          git diff --check
      - name: Commit durable artifacts and remove temporary sync machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/fresh-floor-p13-sync-v5.yml scripts/_fresh_floor_p13_patch.py
          git add docs/prompts.json registry/prompts/actionable-next-step-policy.v1.json scripts/build_prompt_kit_registry.py tests/test_remote_freshness_p13_iteration.py web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): require fresh repo floors and iterate P13'
          git push origin HEAD:feat/p07-fresh-floor-p13-iteration-20260819
