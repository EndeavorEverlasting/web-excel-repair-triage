name: Fresh floor and P13 iteration sync

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'feat/p07-fresh-floor-p13-iteration-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p07-fresh-floor-p13-iteration-20260819
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply durable freshness and P13 changes
        run: python scripts/_fresh_floor_p13_patch.py
      - name: Pass 1 focused policy validation
        run: |
          python -m py_compile scripts/build_prompt_kit_registry.py tests/test_remote_freshness_p13_iteration.py
          python -m json.tool registry/prompts/actionable-next-step-policy.v1.json > /dev/null
          python -m unittest tests.test_remote_freshness_p13_iteration -v
          python -m unittest tests.test_green_branch_integration_policy -v
          python -m unittest tests.test_actionable_prompt_registry -v
      - name: Pass 2 generated artifact and regression validation
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_remote_freshness_p13_iteration -v
          python -m unittest tests.test_prompt_language_audit -v
          git diff --check
      - name: Commit durable artifacts and remove temporary sync machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fresh-floor-p13-sync.yml scripts/_fresh_floor_p13_patch.py
          git add docs/prompts.json registry/prompts/actionable-next-step-policy.v1.json scripts/build_prompt_kit_registry.py tests/test_remote_freshness_p13_iteration.py web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): require fresh repo floors and iterate P13'
          git push origin HEAD:feat/p07-fresh-floor-p13-iteration-20260819
