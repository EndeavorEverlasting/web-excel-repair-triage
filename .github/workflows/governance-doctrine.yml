name: Governance doctrine

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'scripts/validate_governance_doctrine.py'
      - '.github/workflows/governance-doctrine.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'scripts/validate_governance_doctrine.py'
      - '.github/workflows/governance-doctrine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-doctrine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile governance validator
        run: python -m py_compile scripts/validate_governance_doctrine.py
      - name: Validate governance doctrine
        run: python scripts/validate_governance_doctrine.py --summary
      - name: Preserve progressive-disclosure context budget
        run: python scripts/validate_context_architecture.py --summary
      - name: Validate patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}...HEAD"
          else
            git diff --check HEAD^
          fi
