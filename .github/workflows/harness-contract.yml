name: Operational harness contracts

on:
  pull_request:
    paths:
      - AGENTS.md
      - CODEBASE_MAP.md
      - WORKFLOW.md
      - ARTIFACT_REGISTRY.md
      - SKILLS.md
      - CAPABILITIES.md
      - TRIGGERS.md
      - PROMPT_KIT_ACCESS.md
      - OPEN_PROMPT_KIT_ON_PHONE.md
      - Acquire-Latest-PromptKit.cmd
      - Open-Latest-PromptKit.cmd
      - harness/**
      - .ai/skills/**
      - .githooks/**
      - .gitignore
      - scripts/Acquire-LatestPromptKit.ps1
      - scripts/evaluate_prompt_language.py
      - scripts/prompt_outcome_contract.py
      - scripts/prompt_outcome_classifier.py
      - scripts/run_validator_profile.py
      - scripts/validate_prompt_outcome_receipts.py
      - scripts/validate_context_architecture.py
      - scripts/validate_operator_command_envelope.py
      - scripts/validate_pr_merge_gate.py
      - scripts/validate_prompt_kit_cross_device_access.py
      - scripts/validate_prompt_kit_freshness_guidance.py
      - scripts/validate_prompt_kit_release_identity.py
      - scripts/validate_prompt_kit_order_navigation.py
      - scripts/validate_prompt_kit_interactions.py
      - scripts/validate_prompt_kit_discovery.py
      - scripts/validate_harness.py
      - scripts/validate_operant_product_identity.py
      - scripts/validate_staged_artifacts.py
      - triage/artifact_hygiene_policy.py
      - triage/gitignore_hygiene.py
      - tests/test_context_architecture.py
      - tests/test_governance_contract.py
      - tests/test_gitignore_hygiene.py
      - tests/test_harness_contract.py
      - tests/test_required_check_program_call_stacks.py
      - tests/test_validator_profile_runner.py
      - tests/test_operant_product_identity.py
      - tests/test_operator_command_envelope.py
      - tests/test_pr_merge_gate.py
      - tests/test_prompt_outcome_receipt_prompt.py
      - tests/test_prompt_kit_cross_device_access.py
      - tests/test_prompt_kit_freshness_guidance.py
      - tests/test_prompt_kit_release_identity.py
      - tests/test_prompt_kit_order_navigation_contract.py
      - tests/test_prompt_kit_interactions_contract.py
      - tests/test_prompt_kit_discovery.py
      - tests/test_prompt_language_audit.py
      - tests/test_staged_artifact_hygiene.py
      - .github/workflows/harness-contract.yml
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - CODEBASE_MAP.md
      - WORKFLOW.md
      - ARTIFACT_REGISTRY.md
      - SKILLS.md
      - CAPABILITIES.md
      - TRIGGERS.md
      - PROMPT_KIT_ACCESS.md
      - OPEN_PROMPT_KIT_ON_PHONE.md
      - Acquire-Latest-PromptKit.cmd
      - Open-Latest-PromptKit.cmd
      - harness/**
      - .ai/skills/**
      - .githooks/**
      - .gitignore
      - scripts/Acquire-LatestPromptKit.ps1
      - scripts/evaluate_prompt_language.py
      - scripts/prompt_outcome_contract.py
      - scripts/prompt_outcome_classifier.py
      - scripts/run_validator_profile.py
      - scripts/validate_prompt_outcome_receipts.py
      - scripts/validate_context_architecture.py
      - scripts/validate_operator_command_envelope.py
      - scripts/validate_pr_merge_gate.py
      - scripts/validate_prompt_kit_cross_device_access.py
      - scripts/validate_prompt_kit_freshness_guidance.py
      - scripts/validate_prompt_kit_release_identity.py
      - scripts/validate_prompt_kit_order_navigation.py
      - scripts/validate_prompt_kit_interactions.py
      - scripts/validate_prompt_kit_discovery.py
      - scripts/validate_harness.py
      - scripts/validate_operant_product_identity.py
      - scripts/validate_staged_artifacts.py
      - triage/artifact_hygiene_policy.py
      - triage/gitignore_hygiene.py
      - tests/test_context_architecture.py
      - tests/test_governance_contract.py
      - tests/test_gitignore_hygiene.py
      - tests/test_harness_contract.py
      - tests/test_required_check_program_call_stacks.py
      - tests/test_validator_profile_runner.py
      - tests/test_operant_product_identity.py
      - tests/test_operator_command_envelope.py
      - tests/test_pr_merge_gate.py
      - tests/test_prompt_outcome_receipt_prompt.py
      - tests/test_prompt_kit_cross_device_access.py
      - tests/test_prompt_kit_freshness_guidance.py
      - tests/test_prompt_kit_release_identity.py
      - tests/test_prompt_kit_order_navigation_contract.py
      - tests/test_prompt_kit_interactions_contract.py
      - tests/test_prompt_kit_discovery.py
      - tests/test_prompt_language_audit.py
      - tests/test_staged_artifact_hygiene.py
      - .github/workflows/harness-contract.yml

permissions:
  contents: read

jobs:
  operational-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile harness validators, eval runners, and contracts
        run: |
          python -m py_compile \
            scripts/run_validator_profile.py \
            scripts/validate_harness.py \
            scripts/validate_operant_product_identity.py \
            scripts/prompt_outcome_contract.py \
            scripts/prompt_outcome_classifier.py \
            scripts/validate_prompt_outcome_receipts.py \
            scripts/validate_context_architecture.py \
            scripts/validate_operator_command_envelope.py \
            scripts/validate_pr_merge_gate.py \
            scripts/validate_prompt_kit_cross_device_access.py \
            scripts/validate_prompt_kit_freshness_guidance.py \
            scripts/validate_prompt_kit_release_identity.py \
            scripts/validate_prompt_kit_order_navigation.py \
            scripts/validate_prompt_kit_interactions.py \
            scripts/validate_prompt_kit_discovery.py \
            scripts/validate_staged_artifacts.py \
            scripts/evaluate_prompt_language.py \
            triage/artifact_hygiene_policy.py \
            triage/gitignore_hygiene.py \
            tests/test_context_architecture.py \
            tests/test_governance_contract.py \
            tests/test_gitignore_hygiene.py \
            tests/test_harness_contract.py \
            tests/test_required_check_program_call_stacks.py \
            tests/test_validator_profile_runner.py \
            tests/test_operant_product_identity.py \
            tests/test_operator_command_envelope.py \
            tests/test_pr_merge_gate.py \
            tests/test_prompt_outcome_receipt_prompt.py \
            tests/test_prompt_kit_cross_device_access.py \
            tests/test_prompt_kit_freshness_guidance.py \
            tests/test_prompt_kit_release_identity.py \
            tests/test_prompt_kit_order_navigation_contract.py \
            tests/test_prompt_kit_interactions_contract.py \
            tests/test_prompt_kit_discovery.py \
            tests/test_prompt_language_audit.py \
            tests/test_staged_artifact_hygiene.py
      - name: Validate context architecture and governance factoring
        run: |
          python scripts/validate_context_architecture.py --summary
          python -m unittest tests.test_context_architecture tests.test_governance_contract -v
      - name: Validate operator proof PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath 'harness/templates/Invoke-RemoteHarnessProof.ps1' -Raw -Encoding UTF8
          $null = [scriptblock]::Create($source)
          Write-Host 'Operator remote-proof PowerShell syntax: PASS'
      - name: Validate Prompt Kit cross-device access
        run: |
          python scripts/validate_prompt_kit_cross_device_access.py --summary
          python -m unittest tests.test_prompt_kit_cross_device_access -v
      - name: Validate Prompt Kit freshness guidance
        run: |
          python scripts/validate_prompt_kit_freshness_guidance.py --summary
          python -m unittest tests.test_prompt_kit_freshness_guidance -v
      - name: Validate PR merge gate
        run: |
          python scripts/validate_pr_merge_gate.py --summary
          python -m unittest tests.test_pr_merge_gate -v
      - name: Validate Prompt Kit release identity
        run: |
          python scripts/validate_prompt_kit_release_identity.py --output "$RUNNER_TEMP/prompt-kit-release-identity.json" --summary
          python -m unittest tests.test_prompt_kit_release_identity -v
      - name: Upload Prompt Kit release identity report
        uses: actions/upload-artifact@v7
        with:
          name: prompt-kit-release-identity-report
          path: ${{ runner.temp }}/prompt-kit-release-identity.json
          if-no-files-found: error
      - name: Validate Prompt Kit ordering and long-list navigation harness
        run: |
          python scripts/validate_prompt_kit_order_navigation.py --output "$RUNNER_TEMP/prompt-kit-order-navigation-audit.json" --summary
          python -m unittest tests.test_prompt_kit_order_navigation_contract -v
      - name: Upload Prompt Kit order/navigation audit
        uses: actions/upload-artifact@v7
        with:
          name: prompt-kit-order-navigation-audit
          path: ${{ runner.temp }}/prompt-kit-order-navigation-audit.json
          if-no-files-found: error
      - name: Validate operator command envelope
        run: |
          python scripts/validate_operator_command_envelope.py --summary
          python -m unittest tests.test_operator_command_envelope -v
      - name: Prototype required-check program call stacks
        run: python -m unittest tests.test_required_check_program_call_stacks -v
      - name: Execute repository-owned harness profile
        run: |
          python scripts/run_validator_profile.py \
            --profile harness \
            --report "$RUNNER_TEMP/harness-validator-profile.json"
      - name: Upload harness profile receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-validator-profile
          path: ${{ runner.temp }}/harness-validator-profile.json
          if-no-files-found: error
      - name: Upload harness completeness report
        uses: actions/upload-artifact@v7
        with:
          name: harness-completeness-report
          path: Outputs/harness-completeness-report.json
          if-no-files-found: error
      - name: Upload Prompt Kit interaction audit
        uses: actions/upload-artifact@v7
        with:
          name: prompt-kit-interaction-audit-report
          path: Outputs/prompt-kit-interaction-audit.json
          if-no-files-found: error
      - name: Upload prompt-language audit report
        uses: actions/upload-artifact@v7
        with:
          name: prompt-language-audit-report
          path: Outputs/prompt-language-audit.json
          if-no-files-found: error
      - name: Validate staged artifact contract
        run: python -m unittest tests.test_staged_artifact_hygiene -v
      - name: Check exact candidate patch hygiene
        run: git diff --check origin/main...HEAD
