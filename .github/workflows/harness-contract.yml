name: Operational harness contracts

on:
  pull_request:
    paths:
      - CODEBASE_MAP.md
      - WORKFLOW.md
      - ARTIFACT_REGISTRY.md
      - SKILLS.md
      - CAPABILITIES.md
      - TRIGGERS.md
      - PROMPT_KIT_ACCESS.md
      - OPEN_PROMPT_KIT_ON_PHONE.md
      - Acquire-Latest-PromptKit.cmd
      - Open-Latest-PromptKit.cmd
      - harness/**
      - .ai/skills/**
      - .githooks/**
      - scripts/Acquire-LatestPromptKit.ps1
      - scripts/evaluate_prompt_language.py
      - scripts/validate_operator_command_envelope.py
      - scripts/validate_prompt_kit_cross_device_access.py
      - scripts/validate_prompt_kit_interactions.py
      - scripts/validate_prompt_kit_discovery.py
      - scripts/validate_harness.py
      - tests/test_harness_contract.py
      - tests/test_operator_command_envelope.py
      - tests/test_prompt_kit_cross_device_access.py
      - tests/test_prompt_kit_interactions_contract.py
      - tests/test_prompt_kit_discovery.py
      - tests/test_prompt_language_audit.py
      - .github/workflows/harness-contract.yml
  push:
    branches: [main]
    paths:
      - CODEBASE_MAP.md
      - WORKFLOW.md
      - ARTIFACT_REGISTRY.md
      - SKILLS.md
      - CAPABILITIES.md
      - TRIGGERS.md
      - PROMPT_KIT_ACCESS.md
      - OPEN_PROMPT_KIT_ON_PHONE.md
      - Acquire-Latest-PromptKit.cmd
      - Open-Latest-PromptKit.cmd
      - harness/**
      - .ai/skills/**
      - .githooks/**
      - scripts/Acquire-LatestPromptKit.ps1
      - scripts/evaluate_prompt_language.py
      - scripts/validate_operator_command_envelope.py
      - scripts/validate_prompt_kit_cross_device_access.py
      - scripts/validate_prompt_kit_interactions.py
      - scripts/validate_prompt_kit_discovery.py
      - scripts/validate_harness.py
      - tests/test_harness_contract.py
      - tests/test_operator_command_envelope.py
      - tests/test_prompt_kit_cross_device_access.py
      - tests/test_prompt_kit_interactions_contract.py
      - tests/test_prompt_kit_discovery.py
      - tests/test_prompt_language_audit.py
      - .github/workflows/harness-contract.yml

permissions:
  contents: read

jobs:
  operational-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile harness validators, eval runners, and contracts
        run: |
          python -m py_compile \
            scripts/validate_harness.py \
            scripts/validate_operator_command_envelope.py \
            scripts/validate_prompt_kit_cross_device_access.py \
            scripts/validate_prompt_kit_interactions.py \
            scripts/validate_prompt_kit_discovery.py \
            scripts/evaluate_prompt_language.py \
            tests/test_harness_contract.py \
            tests/test_operator_command_envelope.py \
            tests/test_prompt_kit_cross_device_access.py \
            tests/test_prompt_kit_interactions_contract.py \
            tests/test_prompt_kit_discovery.py \
            tests/test_prompt_language_audit.py
      - name: Validate operator proof PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath 'harness/templates/Invoke-RemoteHarnessProof.ps1' -Raw -Encoding UTF8
          $null = [scriptblock]::Create($source)
          Write-Host 'Operator remote-proof PowerShell syntax: PASS'
      - name: Validate Prompt Kit cross-device access
        run: |
          python scripts/validate_prompt_kit_cross_device_access.py --summary
          python -m unittest tests.test_prompt_kit_cross_device_access -v
      - name: Validate operator command envelope
        run: |
          python scripts/validate_operator_command_envelope.py --summary
          python -m unittest tests.test_operator_command_envelope -v
      - name: Validate harness completeness
        run: python scripts/validate_harness.py --report "$RUNNER_TEMP/harness-completeness-report.json"
      - name: Upload harness completeness report
        uses: actions/upload-artifact@v4
        with:
          name: harness-completeness-report
          path: ${{ runner.temp }}/harness-completeness-report.json
          if-no-files-found: error
      - name: Run harness contracts
        run: |
          python -m unittest tests.test_harness_contract -v
          python -m unittest tests.test_prompt_kit_interactions_contract -v
          python -m unittest tests.test_prompt_kit_discovery -v
          python -m unittest tests.test_prompt_language_audit -v
      - name: Audit Prompt Kit interaction contract
        run: python scripts/validate_prompt_kit_interactions.py --output "$RUNNER_TEMP/prompt-kit-interaction-audit.json" --summary
      - name: Upload Prompt Kit interaction audit
        uses: actions/upload-artifact@v4
        with:
          name: prompt-kit-interaction-audit-report
          path: ${{ runner.temp }}/prompt-kit-interaction-audit.json
          if-no-files-found: error
      - name: Audit Prompt Kit discovery contract
        run: python scripts/validate_prompt_kit_discovery.py --summary
      - name: Run exhaustive prompt-language audit
        run: python scripts/evaluate_prompt_language.py --output "$RUNNER_TEMP/prompt-language-audit.json" --summary
      - name: Upload prompt-language audit report
        uses: actions/upload-artifact@v4
        with:
          name: prompt-language-audit-report
          path: ${{ runner.temp }}/prompt-language-audit.json
          if-no-files-found: error
      - name: Validate connected Prompt Kit contracts
        run: |
          python -m unittest tests.test_skill_prompt_registry -v
          python tests/test_prompt_kit_header_contract.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Validate repository artifact hygiene
        run: python -m triage.gitignore_hygiene
      - name: Check patch hygiene
        run: git diff --check origin/main...HEAD
