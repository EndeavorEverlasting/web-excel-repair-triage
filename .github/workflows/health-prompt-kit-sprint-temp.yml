name: Temporary health prompt contribution runner

on:
  push:
    branches:
      - feat/prompt-kit-health-record-sync-20260912
    paths:
      - .github/workflows/health-prompt-kit-sprint-temp.yml

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-health-record-sync-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-prove pre-authoring receipt exists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('.tmp-health-prompt-sprint/prior-art.json').read_text())
          assert receipt['all_registered_sources_searched'] is True
          assert {'deepseek-harness','prompts-chat','mattpocock-skills'} <= {row['source_id'] for row in receipt['sources']}
          assert receipt['distinct_residual_terms']
          PY
      - name: Add prompt through canonical helper
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py add --input .tmp-health-prompt-sprint/draft.json --registry repository-work-ledger-prompts | tee .tmp-health-prompt-sprint/add-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('.tmp-health-prompt-sprint/add-receipt.json').read_text())
          assert receipt['status'] == 'added'
          assert receipt['site_parity'] is True
          assert receipt['external_prior_art']['all_registered_sources_searched'] is True
          Path('.tmp-health-prompt-sprint/prompt-id.txt').write_text(receipt['id']+'\n', encoding='utf-8')
          PY
      - name: Add focused semantic regression
        shell: bash
        run: |
          set -euo pipefail
          PROMPT_ID="$(tr -d '\r\n' < .tmp-health-prompt-sprint/prompt-id.txt)"
          cat > tests/test_health_record_workspace_sync_prompt.py <<PY
          from __future__ import annotations

          import json
          import sys
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SCRIPTS = ROOT / "scripts"
          if str(SCRIPTS) not in sys.path:
              sys.path.insert(0, str(SCRIPTS))

          import build_prompt_kit_registry


          class HealthRecordWorkspaceSyncPromptTests(unittest.TestCase):
              def prompt(self) -> dict:
                  prompts = {item["id"]: item for item in build_prompt_kit_registry.load_prompt_registry()}
                  return prompts["${PROMPT_ID}"]

              def test_identity_and_role_are_distinct_from_generic_repo_drive_sync(self) -> None:
                  prompt = self.prompt()
                  self.assertEqual(prompt["name"], "Connected Health Record Workspace Synchronizer")
                  self.assertEqual(prompt["type"], "SYNC + ARTIFACT")
                  self.assertEqual(prompt["class"], "HEALTH / RECORD SYNC")
                  self.assertEqual(prompt["seq"], prompt["id"][1:])
                  generic = next(
                      item for item in build_prompt_kit_registry.load_prompt_registry()
                      if item["name"] == "Repository + Google Drive Artifact Synchronizer"
                  )
                  self.assertNotEqual(prompt["class"], generic["class"])
                  self.assertIn("health connector discovery", prompt["keywords"])

              def test_prompt_preserves_private_canonical_health_contract(self) -> None:
                  content = self.prompt()["copyContent"]
                  for phrase in (
                      "DISCOVER CAPABILITIES BEFORE ASKING",
                      "SILENT CANONICAL RESOLUTION",
                      "Capability discovery does not imply capability disclosure",
                      "Subjects — one stable subject per tracked person or pet",
                      "Problems — one stable row per ongoing tracked problem/condition",
                      "Episodes — one row per distinct flare",
                      "Checkins — append-only follow-up/progress observations",
                      "Medications — longitudinal subject-medication relationships",
                      "Product Reference",
                      "data/Health_Subjects.csv",
                      "data/Health_Problems.csv",
                      "data/Health_Episodes.csv",
                      "data/Health_Checkins.csv",
                      "data/Health_Subject_Medications.csv",
                      "SUBJ-###",
                      "H-P###",
                      "H-EYYYYMMDD-###",
                      "H-CYYYYMMDD-###",
                      "MEDREC-###",
                      "Health Records/",
                      "Ledgers/Health Tracking Ledger",
                      "References/Medication & Product Reference",
                      "Narrative/Health Symptom Narrative Archive",
                      "Evidence/",
                      "Treatment response is evidence about response, not proof of etiology",
                      "READ BACK EVERY CLAIMED MUTATION",
                      "FALLBACK WHEN THE CANONICAL WORKSPACE IS ABSENT",
                  ):
                      self.assertIn(phrase, content)

              def test_prompt_does_not_advertise_private_implementation_identity(self) -> None:
                  content = self.prompt()["copyContent"]
                  for forbidden in (
                      "MedsPetsAndPeople",
                      "EndeavorEverlasting",
                      "1tSPSFP2v3yq6Kir0mt2gg0i1EsbLvRhiJQdlnk_ahOE",
                      "0AHPtF1SfaW7gUk9PVA",
                      "1QkhAVNwoucvsDx8KKd98J5hjKp8yHri_nGgbLSjUfow",
                  ):
                      self.assertNotIn(forbidden, content)
                  self.assertIn("Do not volunteer private application names", content)
                  self.assertIn("Access only resources needed for this health-record operation", content)

              def test_prompt_is_in_generated_site_and_has_tutorial_fallback_route(self) -> None:
                  prompt = self.prompt()
                  html = build_prompt_kit_registry.render()
                  self.assertIn(f'"id": "{prompt["id"]}"', html)
                  self.assertIn("Connected Health Record Workspace Synchronizer", html)
                  deployed = (ROOT / "web" / "prompt-kit" / "index.html").read_text(encoding="utf-8")
                  self.assertEqual(deployed, html)

                  coverage = json.loads((ROOT / "registry" / "prompts" / "tutorial-coverage.v1.json").read_text(encoding="utf-8"))
                  wired = {item["prompt_id"] for item in coverage["wired_prompts"]}
                  self.assertNotIn(prompt["id"], wired)
                  self.assertEqual(coverage["fallback_status"], "CLASSIFIER_FALLBACK_NEEDS_WIRING")
                  self.assertIn("Every canonical prompt", coverage["wiring_rule"])


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Run focused and connected proof
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_health_record_workspace_sync_prompt.py
          python scripts/prompt_registry_ops.py validate | tee .tmp-health-prompt-sprint/validate-receipt.json
          python scripts/evaluate_prompt_language.py --summary
          python -m unittest tests.test_prompt_language_quality tests.test_prompt_kit_tutorial_coverage tests.test_prompt_kit_discovery -v
          mkdir -p Outputs
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output Outputs/health-prompt-order-navigation-audit.json --summary
          python scripts/build_prompt_kit_registry.py --check
          git diff --check
      - name: Commit generated contribution and proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/prompts/repository-work-ledger-prompts.v1.json web/prompt-kit/index.html tests/test_health_record_workspace_sync_prompt.py .tmp-health-prompt-sprint/add-receipt.json .tmp-health-prompt-sprint/prompt-id.txt .tmp-health-prompt-sprint/validate-receipt.json Outputs/health-prompt-order-navigation-audit.json
          git commit -m "feat: add connected health record sync prompt"
          git push origin HEAD:feat/prompt-kit-health-record-sync-20260912
