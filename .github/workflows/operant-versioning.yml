name: Operant Deterministic Versioning

on:
  pull_request:
    paths:
      - OPERANT_VERSION
      - build_prompt_kit.py
      - docs/OPERANT_CHANGELOG.md
      - docs/OPERANT_VERSIONING.md
      - docs/prompts.json
      - docs/reference.json
      - harness/contracts/operant-product-identity.v1.json
      - scripts/build_prompt_kit_registry.py
      - scripts/operant_release_pr_request.py
      - scripts/operant_version.py
      - scripts/validate_operant_product_identity.py
      - tests/test_operant_product_identity.py
      - tests/test_operant_versioning_workflow.py
      - tests/test_prompt_kit_order_navigation_product.py
      - web/prompt-kit/index.html
      - .github/workflows/operant-versioning.yml
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Push and manual-dispatch mainline owners share one serialized queue. PR policy
  # checks stay isolated per PR; any unexpected external branch writer still
  # fails closed because candidate publication uses an ordinary non-force push.
  group: operant-versioning-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'mainline-owner' }}
  cancel-in-progress: false

jobs:
  verify-policy:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify deterministic authority and mirrors
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python scripts/operant_version.py validate
          python scripts/operant_version.py validate-release-candidate --base origin/main
          python scripts/validate_operant_product_identity.py --summary
          python -m unittest tests.test_operant_product_identity tests.test_operant_versioning_workflow tests.test_prompt_kit_order_navigation_product -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

  mainline-version-owner:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact mainline head with release history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Tag validated mainline version changes before planning again
        shell: bash
        run: |
          set -euo pipefail
          version_changed=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            before="${{ github.event.before }}"
            zero_sha="0000000000000000000000000000000000000000"
            if [[ -n "$before" && "$before" != "$zero_sha" ]] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              if ! git diff --quiet "$before" HEAD -- OPERANT_VERSION; then
                version_changed=true
              fi
            fi
          fi

          if [[ "$version_changed" == "true" ]]; then
            python scripts/operant_version.py validate
            python scripts/validate_operant_product_identity.py --summary
            python -m unittest tests.test_operant_product_identity tests.test_operant_versioning_workflow -v
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check

            version="$(python scripts/operant_version.py current)"
            tag="operant-v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              target="$(git rev-list -n 1 "$tag")"
              head="$(git rev-parse HEAD)"
              if [[ "$target" != "$head" ]]; then
                echo "Released version reuse/drift: ${tag} -> ${target}; HEAD=${head}" >&2
                exit 1
              fi
            else
              head_sha="$(git rev-parse HEAD)"
              gh release create "$tag" \
                --target "$head_sha" \
                --title "Operant v${version}" \
                --generate-notes
            fi
            git fetch --tags
            python scripts/operant_version.py validate --require-tag
          fi

      - name: Derive next release from natural mainline development
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Outputs
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python scripts/operant_version.py plan --output Outputs/operant-version-plan.json
          release_type="$(python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('Outputs/operant-version-plan.json').read_text(encoding='utf-8'))
          print(payload['release_type'] or '')
          PY
          )"
          next_version="$(python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('Outputs/operant-version-plan.json').read_text(encoding='utf-8'))
          print(payload['next_version'])
          PY
          )"
          echo "release_type=${release_type}" >> "$GITHUB_OUTPUT"
          echo "next_version=${next_version}" >> "$GITHUB_OUTPUT"

      - name: Prepare or refresh one reviewable release PR candidate when a bump is earned
        id: prepare_release
        if: ${{ steps.plan.outputs.release_type != '' }}
        shell: bash
        run: |
          set -euo pipefail
          next_version="${{ steps.plan.outputs.next_version }}"
          main_sha="$(git rev-parse origin/main)"
          pending_branch="automation/operant-release-v${next_version}"
          staging_branch="automation/operant-release-staging-v${next_version}"
          existing_pr="$(gh pr list --state open --base main --json headRefName,url,number --jq '[.[] | select(.headRefName | startswith(\"automation/operant-release-v\"))] | first // {}')"
          existing_branch="$(jq -r '.headRefName // empty' <<< "$existing_pr")"
          existing_url="$(jq -r '.url // empty' <<< "$existing_pr")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          target_head="${existing_branch:-$pending_branch}"
          candidate_branch="$staging_branch"
          if [[ -n "$existing_branch" ]]; then
            echo "Staging refreshed Operant release candidate for external publication: $existing_branch ($existing_url)"
          else
            echo "Staging unpublished Operant release candidate for external publication: $target_head"
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/${candidate_branch}" >/dev/null 2>&1; then
            git fetch origin "$candidate_branch"
            git checkout -B "$candidate_branch" "origin/$candidate_branch"
            git merge --no-edit origin/main
            git checkout origin/main -- \
              OPERANT_VERSION \
              harness/contracts/operant-product-identity.v1.json \
              docs/OPERANT_CHANGELOG.md \
              web/prompt-kit/index.html
          else
            git checkout -B "$candidate_branch" origin/main
          fi

          python scripts/operant_version.py apply --plan Outputs/operant-version-plan.json
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/operant_version.py validate
          python scripts/operant_version.py validate-release-candidate --base origin/main
          python scripts/validate_operant_product_identity.py --summary
          python -m unittest tests.test_operant_product_identity tests.test_operant_versioning_workflow tests.test_prompt_kit_order_navigation_product -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          git add OPERANT_VERSION \
            harness/contracts/operant-product-identity.v1.json \
            docs/OPERANT_CHANGELOG.md \
            web/prompt-kit/index.html
          if git diff --cached --quiet; then
            echo "Release candidate already matches recomputed plan on $candidate_branch"
          else
            git commit -m "chore(operant): release v${next_version}"
          fi
          git push origin HEAD:"$candidate_branch"

          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree_sha="$(git rev-parse HEAD^{tree})"
          python scripts/operant_release_pr_request.py \
            --version "$next_version" \
            --source-sha "$main_sha" \
            --head "$target_head" \
            --base main \
            --candidate-branch "$candidate_branch" \
            --candidate-sha "$candidate_sha" \
            --candidate-tree-sha "$candidate_tree_sha" \
            --existing-pr-url "$existing_url" \
            --output Outputs/operant-release-pr-request.json \
            --body-output Outputs/operant-release-pr.md

          echo "publication_required=true" >> "$GITHUB_OUTPUT"
          echo "target_head=$target_head" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "request_path=Outputs/operant-release-pr-request.json" >> "$GITHUB_OUTPUT"
          {
            echo "## Operant release PR external publication required"
            echo
            echo "The release candidate was generated, validated, committed, and pushed successfully."
            if [[ -n "$existing_url" ]]; then
              echo "The existing release PR head is deliberately not mutated by github-actions[bot]."
              echo "An external provider/agent must publish the staged candidate tree onto the existing PR head with a non-force convergence commit so pull_request checks execute under an externally authorized mutation."
              echo
              echo "- existing PR: `$existing_url`"
              echo "- target head: `$target_head`"
            else
              echo "Repository Actions settings prohibit the workflow token from creating the first pull request, so creation is deliberately owned by an external provider/agent."
              echo
              echo "- target head: `$target_head`"
            fi
            echo "- candidate branch: `$candidate_branch`"
            echo "- candidate SHA: `$candidate_sha`"
            echo "- candidate tree: `$candidate_tree_sha`"
            echo "- base: `main`"
            echo "- request artifact: `Outputs/operant-release-pr-request.json`"
            echo "- body artifact: `Outputs/operant-release-pr.md`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Operant release PR publication request
        if: ${{ steps.plan.outputs.release_type != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: operant-release-pr-request-${{ github.sha }}
          path: |
            Outputs/operant-release-pr-request.json
            Outputs/operant-release-pr.md