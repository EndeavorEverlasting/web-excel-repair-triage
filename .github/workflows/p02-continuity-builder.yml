name: P02 continuity canonical builder

on:
  push:
    branches:
      - feat/p02-continuity-alignment-20260920

permissions:
  contents: write

concurrency:
  group: p02-continuity-builder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Regenerate canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: P02 focused regressions
        run: |
          python -m unittest tests.test_p02_continuity_regression_matrix -v
          python -m unittest tests.test_skill_prompt_registry -v
          python -m unittest tests.test_p02_p07_autonomous_iteration -v

      - name: Prompt semantic and strength gates
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_prompt_strength.py --summary
          python -m unittest tests.test_prompt_strength_contract_prompt -v
          python -m unittest tests.test_deterministic_test_floor -v
          python scripts/evaluate_prompt_language.py --output Outputs/prompt-language-audit.json --summary

      - name: Patch hygiene
        run: git diff --check

      - name: Commit generated site
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/prompt-kit/index.html; then
            echo "Canonical site already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/index.html
          git commit -m "build(prompt-kit): regenerate P02 continuity site"
          git push origin "HEAD:${GITHUB_REF_NAME}"
