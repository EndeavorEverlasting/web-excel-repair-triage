name: P07 iterative sprint and prompt ops sync v2

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'feat/p07-iterative-sprint-prompt-ops-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p07-iterative-sprint-prompt-ops-20260819
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply durable prompt contracts
        run: python scripts/_p07_prompt_ops_patch.py
      - name: Pass 1 targeted validation
        run: |
          python -m py_compile scripts/prompt_registry_ops.py scripts/build_prompt_kit_registry.py tests/test_spec_architecture_prompt_registry.py
          python scripts/prompt_registry_ops.py inspect > "$RUNNER_TEMP/prompt-registry-inspect.json"
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_green_branch_integration_policy -v
          python -m unittest tests.test_actionable_prompt_registry -v
      - name: Pass 2 artifact and fixed-point validation
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          git diff --check
      - name: Commit durable artifacts and remove temporary sync machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p07-iterative-prompt-ops-sync-v2.yml scripts/_p07_prompt_ops_patch.py
          git add docs/prompts.json registry/prompts/spec-architecture-prompts.v1.json scripts/prompt_registry_ops.py tests/test_spec_architecture_prompt_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): iterate P7 and streamline prompt contributions'
          git push origin HEAD:feat/p07-iterative-sprint-prompt-ops-20260819
