name: Temporary P11 harness bootstrap

on:
  push:
    branches: [feat/p11-one-command-harness-proof-20260825]
    paths:
      - '.github/workflows/p11-harness-bootstrap.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p11-one-command-harness-proof-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch canonical harness owners and P11
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          command = "python scripts/validate_app_harness.py --output Outputs/app-harness-validation.json"

          artifacts_path = Path("harness/artifacts.v1.json")
          artifacts = json.loads(artifacts_path.read_text(encoding="utf-8"))
          if not any(x.get("id") == "app-harness-validation-report" for x in artifacts["artifacts"]):
              artifacts["artifacts"].append({
                  "id": "app-harness-validation-report",
                  "kind": "runtime",
                  "canonical_path": "Outputs/app-harness-validation.json",
                  "producer": command,
                  "validator": "app-harness-validation",
                  "naming": "Stable exact-head synthetic harness receipt; CI artifact name includes the observed head SHA.",
                  "tracking_policy": "Gitignored runtime evidence or CI artifact; never treat it as live/runtime proof.",
                  "schema": "app-harness-validation/v2",
                  "proof_ceiling": "Offline/synthetic repository harness proof only; no live runtime, browser, launcher, network, target, save/account, provider-runtime, deployment, or production proof."
              })
          artifacts_path.write_text(json.dumps(artifacts, indent=2) + "\n", encoding="utf-8")

          validators_path = Path("harness/validators.v1.json")
          validators = json.loads(validators_path.read_text(encoding="utf-8"))
          if not any(x.get("id") == "app-harness-validation" for x in validators["validators"]):
              validators["validators"].append({
                  "id": "app-harness-validation",
                  "class": "contract",
                  "command": command,
                  "blocking": True,
                  "output": "Outputs/app-harness-validation.json",
                  "proof_ceiling": "Exact-head offline/synthetic harness readiness with explicit requirement classes and honest optional skips; no application/runtime proof."
              })
          for profile in ("harness", "pre_push"):
              ids = validators["profiles"][profile]
              if "app-harness-validation" not in ids:
                  insert_at = ids.index("patch-hygiene") if "patch-hygiene" in ids else len(ids)
                  ids.insert(insert_at, "app-harness-validation")
          validators_path.write_text(json.dumps(validators, indent=2) + "\n", encoding="utf-8")

          manifest_path = Path("harness/manifest.v1.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if command not in manifest["validation_order"]:
              manifest["validation_order"].insert(-1, command)
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          harness_path = Path("scripts/validate_harness.py")
          text = harness_path.read_text(encoding="utf-8")
          if '"app-harness-validation-report"' not in text:
              text = text.replace('    "prompt-kit-browser-proof-cleanup-report",\n}', '    "prompt-kit-browser-proof-cleanup-report",\n    "app-harness-validation-report",\n}')
          if '"app-harness-validation",' not in text:
              text = text.replace('    "prompt-kit-responsive-layout-tests",\n}', '    "prompt-kit-responsive-layout-tests",\n    "app-harness-validation",\n}')
          harness_path.write_text(text, encoding="utf-8")

          prepush_path = Path(".githooks/pre-push")
          prepush = prepush_path.read_text(encoding="utf-8")
          if command not in prepush:
              prepush = prepush.replace("python -m unittest tests.test_staged_artifact_hygiene -v\ngit diff --check", f"python -m unittest tests.test_staged_artifact_hygiene -v\n{command}\ngit diff --check")
          prepush_path.write_text(prepush, encoding="utf-8")

          report_path = Path("harness/reports/APP_HARNESS_VALIDATION.md")
          report_path.write_text("""# App Harness Validation\n\n## Canonical owner\n\n**P11 · End-to-End Harness Validator — aggregate safe repository harness proof into one exact-head offline/synthetic PASS/SKIP/FAIL gate.**\n\nThe canonical local and CI command is:\n\n```text\npython scripts/validate_app_harness.py --output Outputs/app-harness-validation.json\n```\n\n## Healthy matrix\n\n```text\nAPP HARNESS VALIDATION\n[PASS] required files\n[PASS] run context\n[PASS] artifact registry\n[PASS] report renderer\n[SKIP] optional MCP symbol smoke: lsp_project_not_loaded\n[PASS] hook hygiene\nResult: 5 passed / 1 skipped / 0 failed\n```\n\n## Gate semantics\n\nEvery check carries `REQUIRED`, `OPTIONAL`, `ENVIRONMENT_BLOCKED`, or `INAPPLICABLE` classification plus `PASS`, `SKIP`, or `FAIL`. Any required check that is not `PASS` makes the aggregate gate fail. Optional missing LSP/MCP readiness is an honest `SKIP`, never an inferred pass.\n\nThe JSON receipt records schema, proof level, `runtime_proof=false`, branch, exact head SHA, canonical command, validator set, required checks, skipped checks/reasons, P11 identifier/name/purpose, summary, final status, and proof ceiling. A moved head or required dependency requires a new receipt.\n\n## Prompt-reference identity contract\n\nWhen this harness, its reports, or a consuming agent refers an operator to a Prompt Kit prompt, the reference is incomplete unless it gives the **canonical identifier + canonical name + concise purpose** together, for example `P11 · End-to-End Harness Validator — one-command offline/synthetic harness proof`. Resolve those fields from the canonical prompt registry; never guess an ID from a description.\n\n## CI/CD boundary\n\nGitHub Actions invokes the canonical command exactly once and uploads its receipt; YAML does not reimplement the matrix. This receipt is one promotion-pipeline gate. Application/browser/service/device E2E, deployment, provider-runtime proof, and post-promotion containment remain separate downstream gates.\n\n## Safety / proof ceiling\n\nThe validator uses an explicit subprocess allowlist. It does not launch products, games, browsers, servers, network probes, deployment tools, save/account operations, target mutations, or secret collection. Its proof ceiling is offline/synthetic repository harness readiness for the observed exact head.\n""", encoding="utf-8")

          artifact_doc = Path("ARTIFACT_REGISTRY.md")
          doc = artifact_doc.read_text(encoding="utf-8")
          if "## One-command P11 synthetic harness receipt" not in doc:
              doc += """\n\n## One-command P11 synthetic harness receipt\n\n- Owner: **P11 · End-to-End Harness Validator — one-command offline/synthetic repository harness proof.**\n- Canonical command: `python scripts/validate_app_harness.py --output Outputs/app-harness-validation.json`.\n- Machine authority: `harness/artifacts.v1.json` (`app-harness-validation-report`) and `harness/validators.v1.json` (`app-harness-validation`).\n- Receipt schema: `app-harness-validation/v2`; records exact head SHA, validator set, requirement/status per check, skipped reasons, final status, and proof ceiling.\n- CI invokes the same command; it does not reproduce validation logic in workflow YAML.\n- A green receipt is offline/synthetic harness proof only, not browser/application E2E, provider-runtime, deployment, or production proof.\n"""
          artifact_doc.write_text(doc, encoding="utf-8")

          prompts_path = Path("docs/prompts.json")
          prompts = json.loads(prompts_path.read_text(encoding="utf-8"))
          p11 = next(item for item in prompts if item.get("id") == "P11")
          identity_contract = """\nPROMPT REFERENCE IDENTITY CONTRACT\n- Whenever this validator, its report, its next-step routing, or the executing agent refers the operator to a Prompt Kit prompt, emit the canonical identifier + canonical name + concise purpose together. A description without the identifier is incomplete.\n- Resolve prompt identity from the canonical registry; never infer or guess an ID from remembered wording.\n- Machine-readable evidence should carry prompt owner fields separately as id, name, and purpose so downstream CI/CD or agents do not have to parse prose.\n"""
          if "PROMPT REFERENCE IDENTITY CONTRACT" not in p11["copyContent"]:
              p11["copyContent"] += identity_contract
          if "identifier + canonical name + concise purpose" not in p11["expectedOutput"]:
              p11["expectedOutput"] += " Any Prompt Kit prompt reference includes its canonical identifier + canonical name + concise purpose."
          if "prompt identity" not in p11["keywords"]:
              p11["keywords"].append("prompt identity")
          prompts_path.write_text(json.dumps(prompts, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Rebuild generated Prompt Kit through canonical builder
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Focused and root validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_app_harness.py tests/test_app_harness_validator.py
          python -m unittest tests.test_app_harness_validator -v
          python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
          python -m unittest tests.test_harness_contract -v
          python scripts/validate_app_harness.py --output Outputs/app-harness-validation.json
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_skill_prompt_registry -v
          git diff --check
      - name: Remove temporary bootstrap and commit durable result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p11-harness-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .githooks/pre-push ARTIFACT_REGISTRY.md docs/prompts.json harness/artifacts.v1.json harness/manifest.v1.json harness/reports/APP_HARNESS_VALIDATION.md harness/validators.v1.json scripts/validate_harness.py web/prompt-kit/index.html .github/workflows/p11-harness-bootstrap.yml
          if git diff --cached --quiet; then
            echo "No durable bootstrap changes produced" >&2
            exit 1
          fi
          git commit -m "feat(harness): register P11 one-command proof"
          git push origin HEAD:feat/p11-one-command-harness-proof-20260825
