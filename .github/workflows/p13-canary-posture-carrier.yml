name: P13 canary posture carrier

on:
  push:
    branches:
      - "fix/p13-canary-execution-posture-20260910"

permissions:
  contents: write

jobs:
  patch_validate_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify base and apply bounded patch
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git merge-base HEAD origin/main)" = "c3478d5fafea8b9d0c1aa7996b968ee6cb635b72"
          python .github/p13_canary_posture_patch.py
      - name: Build canonical Prompt Kit
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validation pass one
        run: |
          set -euo pipefail
          python -m unittest tests.test_skill_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Deliberate semantic pass two
        run: |
          set -euo pipefail
          python -m unittest tests.test_skill_prompt_registry.SkillPromptRegistryTests.test_p13_recurring_urgency_recovery_advances_and_parallelizes -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit durable candidate and remove transport
        run: |
          set -euo pipefail
          rm .github/p13_canary_posture_patch.py
          rm .github/workflows/p13-canary-posture-carrier.yml
          git diff --check
          git status --short
          git diff --stat
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(prompt-kit): gate P13 on execution posture canary"
          git push origin HEAD:fix/p13-canary-execution-posture-20260910
