name: P13 parallel fixed point carrier

on:
  push:
    branches:
      - "fix/p13-canary-execution-posture-20260910"

permissions:
  contents: write

jobs:
  reconcile_patch_validate_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconcile current main and apply fixed-point repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          git merge --no-edit origin/main
          python .github/p13_parallel_fixed_point_patch.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validation pass one
        run: |
          set -euo pipefail
          python -m unittest tests.test_skill_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Deliberate semantic pass two
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('registry/prompts/prompt-overrides.v1.json').read_text(encoding='utf-8'))
          p13 = next(item for item in payload['overrides'] if item['id'] == 'P13')
          c = p13['copyContent']
          for phrase in (
              'MANDATORY CANARY / EXECUTION POSTURE GATE — P114 OWNER',
              'actual P07 dispatch evidence when worker capacity and collision-safe lanes exist',
              'PARALLEL EXECUTION: unavailable — <exact capability limitation>.',
              'P13 remains the recurrence/prevention/convergence owner',
          ):
              assert phrase in c, phrase
          for stale in (
              'SUB-PART AGENT PLAN IS MANDATORY',
              'Sub-Part Agent: none — serialized dependency',
              'explicit Sub-Part Agent plan or serialized-dependency reason',
              'prepared for a Sub-Part Agent',
              'emit one self-contained copy-paste Sub-Part Agent prompt',
          ):
              assert stale not in c, stale
          PY
          python -m unittest tests.test_skill_prompt_registry.SkillPromptRegistryTests.test_p13_recurring_urgency_recovery_advances_and_parallelizes -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit durable candidate and remove transport
        run: |
          set -euo pipefail
          rm .github/p13_parallel_fixed_point_patch.py
          rm .github/workflows/p13-parallel-fixed-point-carrier.yml
          git diff --check
          git status --short
          git diff --stat
          git add -A
          git commit -m "fix(prompt-kit): align P13 regression with P07 dispatch"
          git push origin HEAD:fix/p13-canary-execution-posture-20260910
