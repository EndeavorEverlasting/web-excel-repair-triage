name: P13 specialized owner routing repair

on:
  push:
    branches:
      - feat/p13-specialized-owner-routing-20260822

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p13-specialized-owner-routing-20260822
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch canonical P13 and focused regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          registry_path = root / 'registry/prompts/prompt-overrides.v1.json'
          payload = json.loads(registry_path.read_text(encoding='utf-8'))
          p13 = next(item for item in payload['overrides'] if item['id'] == 'P13')
          before_len = len(p13['copyContent'])

          p13['expectedOutput'] = (
              'Immediate advancement of the current critical path, an explicit Sub-Part Agent launch/packet or '
              'serialized-dependency reason, the smallest implemented durable prevention, specialist repair routed '
              'to its existing canonical owner instead of duplicated into P13, and the exact validated owned change '
              'integrated into the current default branch and verified there; otherwise an exact integration/user-only '
              'blocker plus the action that advances it.'
          )
          p13['proofGate'] = (
              'The recurrence is evidence-backed; current proof floor and next gate are explicit; critical-path work '
              'advances until a bounded fixed point or exact blocker; Sub-Part Agent analysis is present; one correct '
              'authority owns the prevention; any material specialist failure mode is routed to its canonical owner '
              'without duplicating that owner\'s doctrine into P13; focused regression/build/parity validation passes; '
              'a deliberate second pass finds no practical in-scope improvement; and the exact validated owned head is '
              'integrated into and verified on the current default branch when authorized. A branch or PR alone is '
              'insufficient completion; when integration is blocked, the exact gate and advancing action are proven '
              'without proof inflation.'
          )

          marker = '6A. SPECIALIZED OWNER ROUTING — REFER, DO NOT DUPLICATE'
          block = '''\n\n6A. SPECIALIZED OWNER ROUTING — REFER, DO NOT DUPLICATE\nP13 owns recurrence recovery, urgency, durable prevention, and convergence. It must not absorb the full operating doctrine of specialist prompts.\n- If the recurring defect is an agent's plausible-but-wrong result and the repair depends on whether required truth was absent, ignored, or buried in excessive context, route diagnosis to P100. If exact IDs, schemas, API/tool parameters, or protected side effects need deterministic grounding, route the prevention layer to P101.\n- If the defect is systemic runtime context load/selection, route to P68; if it is repository spec/harness progressive-disclosure bloat, route to P76.\n- If the recurrence is a questionable done/closed/handoff claim, route verification to P83. If a live-certification claim depends on exact subject/evidence freshness or stale-proof invalidation, route certification to P48.\n- Record the specialist owner and the evidence that triggered it, invoke or extend that owner when the specialized repair is in scope, and continue P13's critical path. Routing is not a stopping condition.\n- Do not copy the specialist prompt's full checklist into P13. Add only the smallest P13-specific routing sentence or regression needed to prevent the recurrence.\n'''
          if marker not in p13['copyContent']:
              needle = '\n\n7. REGRESSION SCENARIO\n'
              if needle not in p13['copyContent']:
                  raise SystemExit('P13 regression section anchor not found')
              p13['copyContent'] = p13['copyContent'].replace(needle, block + needle, 1)

          after_len = len(p13['copyContent'])
          growth = after_len - before_len
          if growth > 1800:
              raise SystemExit(f'P13 routing growth too large: +{growth} chars')
          if after_len >= 18000:
              raise SystemExit(f'P13 raw copy exceeds anti-bloat ceiling: {after_len}')
          print(f'P13 copyContent: {before_len} -> {after_len} (+{growth})')
          registry_path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test_path = root / 'tests/test_prompt_kit_mainline_delivery.py'
          text = test_path.read_text(encoding='utf-8')
          test_marker = '    def test_p13_routes_specialized_failures_without_absorbing_their_doctrine(self):\n'
          if test_marker not in text:
              insertion = '''    def test_p13_routes_specialized_failures_without_absorbing_their_doctrine(self):\n        payload = load_json("registry/prompts/prompt-overrides.v1.json")\n        p13 = next(item for item in payload["overrides"] if item["id"] == "P13")\n        copy = p13["copyContent"]\n        self.assertIn("specialist repair routed", p13["expectedOutput"])\n        self.assertIn("specialist failure mode is routed to its canonical owner", p13["proofGate"])\n        for phrase in (\n            "SPECIALIZED OWNER ROUTING — REFER, DO NOT DUPLICATE",\n            "route diagnosis to P100",\n            "route the prevention layer to P101",\n            "route to P68",\n            "route to P76",\n            "route verification to P83",\n            "route certification to P48",\n            "Routing is not a stopping condition",\n            "Do not copy the specialist prompt's full checklist into P13",\n        ):\n            self.assertIn(phrase, copy)\n\n        ai = load_json("registry/prompts/ai-engineering-level-up-prompts.v1.json")\n        ai_ids = {item["id"] for item in ai["prompts"]}\n        self.assertTrue({"P68", "P100", "P101"}.issubset(ai_ids))\n        spec = load_json("registry/prompts/spec-architecture-prompts.v1.json")\n        spec_ids = {item["id"] for item in spec["prompts"]}\n        self.assertTrue({"P48", "P76"}.issubset(spec_ids))\n        ledger = load_json("registry/prompts/repository-work-ledger-prompts.v1.json")\n        ledger_ids = {item["id"] for item in ledger["prompts"]}\n        self.assertIn("P83", ledger_ids)\n        self.assertLess(len(copy), 18000)\n\n'''
              anchor = '    def test_p65_can_route_repeated_friction_without_browser_finder(self):\n'
              if anchor not in text:
                  raise SystemExit('focused test insertion anchor not found')
              text = text.replace(anchor, insertion + anchor, 1)
              test_path.write_text(text, encoding='utf-8')
          PY

      - name: Build canonical Prompt Kit and validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_prompt_kit_mainline_delivery -v
          python -m unittest tests.test_remote_freshness_p13_iteration -v
          python -m unittest tests.test_ai_engineering_level_up tests.test_repository_work_ledger_prompt tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_prompt_kit_discovery.py --summary
          git diff --check

      - name: Deliberate second-pass critique
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('registry/prompts/prompt-overrides.v1.json').read_text(encoding='utf-8'))
          p13 = next(item for item in payload['overrides'] if item['id'] == 'P13')
          copy = p13['copyContent']
          required = ['P100', 'P101', 'P68', 'P76', 'P83', 'P48', 'Routing is not a stopping condition']
          missing = [item for item in required if item not in copy]
          if missing:
              raise SystemExit(f'missing specialized owner routes: {missing}')
          forbidden = ['FACTUALITY_MISSING_CONTEXT', 'FAITHFULNESS_CONTEXT_IGNORED', 'ATTENTION_SATURATION', 'GROUNDED_PASS', 'UNSOURCED_BLOCK']
          leaked = [item for item in forbidden if item in copy]
          if leaked:
              raise SystemExit(f'P13 absorbed specialist implementation doctrine: {leaked}')
          print(f'P13 specialized routing critique: PASS; chars={len(copy)}')
          PY
          git diff --stat
          git diff -- registry/prompts/prompt-overrides.v1.json tests/test_prompt_kit_mainline_delivery.py

      - name: Commit durable repair and self-remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p13-specialized-owner-routing-repair.yml
          git add registry/prompts/prompt-overrides.v1.json tests/test_prompt_kit_mainline_delivery.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'feat(prompt-kit): route P13 to specialized canonical owners'
          git push origin HEAD:feat/p13-specialized-owner-routing-20260822
