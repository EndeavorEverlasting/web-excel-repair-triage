name: P66 one-shot canonical site regeneration

on:
  push:
    branches:
      - feat/prompt-kit-repository-ledger-p66-20260809

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-repository-ledger-p66-20260809
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate exact Prompt Kit site
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_repository_work_ledger_prompt -v
          git diff --check
      - name: Commit generated site only when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- web/prompt-kit/index.html; then
            echo "Canonical site is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/index.html
          git commit -m "build(prompt-kit): regenerate site with P66"
          git push origin HEAD:feat/prompt-kit-repository-ledger-p66-20260809
