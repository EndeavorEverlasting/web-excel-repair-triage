name: one-shot-p77-roster-private-math-sync

on:
  push:
    branches:
      - feat/p77-roster-private-math-sync-20260819

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p77-roster-private-math-sync-20260819
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Strengthen P77 and focused regression coverage
        shell: python
        run: |
          import json
          from pathlib import Path

          registry_path = Path('registry/prompts/management-operations-prompts.v1.json')
          data = json.loads(registry_path.read_text(encoding='utf-8'))
          p77 = next(prompt for prompt in data['prompts'] if prompt['id'] == 'P77')

          p77['inspectFirst'] = (
              "The current conversation/new evidence; current `EndeavorEverlasting/web-excel-repair-triage` and "
              "`EndeavorEverlasting/FUN` main/branch/PR floors; each repo's closest governance/context router; current "
              "producer/consumer or pinned cross-repo contracts; the canonical integrated roster including its durable "
              "activity/context ledger and split-project allocation surface; the private quantitative Math Packet or "
              "equivalent internal reconciliation surface; Google Drive NTH workspace navigation, dated evidence folders, "
              "glossary, and current audience routes; the Prompt Kit registry/profile owning the operation; existing reports, "
              "artifact registries, validators, and generated outputs that materially depend on the changed fact."
          )
          p77['expectedOutput'] = (
              "A dependency-aware cross-repo synchronization in which the changed fact is encoded only at its supported "
              "authority level; the integrated roster preserves attendance truth, durable day-by-day context, and multi-project "
              "allocation without thin derivatives replacing it; private quantitative Math Packets retain evidence IDs, direct "
              "task-span controls, labeled assumptions/proof gaps, and reconciliation detail; outward admin/client artifacts are "
              "regenerated or left unchanged according to their audience profile rather than inheriting private mechanics; "
              "screenshots/source artifacts are preserved in dated Drive evidence routes and discoverable through glossary/navigation; "
              "FUN and Triage owned surfaces are mutated in separate bounded lanes; and validators/CI plus PR integration prove the result."
          )
          p77['nextStep'] = (
              "Build the material dependency map from the supplied evidence, then mutate the first authoritative surface immediately: "
              "post completed attendance/context to the integrated roster when available, record any same-day project split in its "
              "allocation ledger, preserve source screenshots/evidence in the dated Drive route, update the private quantitative Math "
              "Packet before projecting outward, and continue through dependent registries/glossary/Prompt Kit/generated artifacts until "
              "only a real protected-runtime, credential, review, attendance-close, or external-proof gate remains."
          )
          p77['proofGate'] = (
              "Every changed fact has an explicit source/authority boundary; attendance remains the paid-hour authority; same-day project "
              "allocations reconcile to attendance before billing close; planned durations and device quantities do not create paid time; "
              "direct task spans are usable internally only within their evidence boundary; the canonical integrated roster is not replaced "
              "by a thin derivative; private quantitative Math Packets remain richer than outward projections; screenshot/source evidence is "
              "preserved in a dated Drive evidence route and is discoverable through glossary/navigation; FUN, Triage, and Drive agree on "
              "identities and routing where they overlap; the green Triage profile and blue FUN profile remain distinct; generated Prompt Kit "
              "output matches its registry when touched; focused/full applicable validators pass; and each authorized exact green PR is merged "
              "or an exact blocking gate is named."
          )

          section = """

          INTEGRATED ROSTER / SPLIT-PROJECT CONTRACT
          - Treat the codified integrated roster as the attendance and durable operating authority. Do not replace it with a project-scoped thin roster or a separate thin evidence ledger merely because one project is being analyzed.
          - Preserve a day-by-day activity/ad-hoc context ledger so assignments, requests, corrections, screenshots, carryover, and proof gaps accumulate rather than disappearing after a workbook is sent.
          - When one person supports more than one project/workstream on the same attendance day, preserve multiple allocation rows under that one attendance day. Attendance creates paid time; allocation explains it. Require the allocated total to reconcile to attendance before billing close.
          - Planned assignments, future training durations, device counts, capacity ceilings, and management estimates may be preserved as context but must not silently create paid hours.

          PRIVATE QUANTITATIVE MATH VS OUTWARD PROJECTION
          - Maintain or update the private quantitative Math Packet/equivalent internal model before simplifying the outward story. Internal management surfaces may retain exact reconciliation, direct task-span controls, evidence IDs, labeled assumptions, contradictions, proof gaps, remainder rules, and dispute-defense math when supported by their authority.
          - A direct request-to-response span can support an INTERNAL allocation control after same-day attendance posts, but it is not independently paid-hours authority, does not prove every minute was one atomic task, and must not be manufactured from device quantity.
          - Treat admin/client workbooks as audience-specific projections, not as the place to perform the investigation. Default leadership/client projection should favor direct paid-time facts plus supported qualitative operational depth; only expose exact quantitative allocation/ratios when the requested audience profile explicitly calls for them and the evidence supports them.
          - Never let a qualitative share artifact erase or overwrite the richer private quantitative model needed for self-audit and billing-defense work.

          DRIVE EVIDENCE / GLOSSARY DISCOVERY
          - Preserve material screenshots, source extracts, or message-thread evidence in the correct dated Drive evidence folder; never leave a new workspace artifact loose in Drive root.
          - Give durable evidence stable IDs or references where the existing workspace contract supports them, and update the Drive File Map, glossary, audience route, or equivalent navigation so a future agent can locate the source, understand what it proves, and understand what it does not prove without guessing.
          - If an email, ServiceNow ticket, attendance close, or other external source is still missing, preserve the operator-reported context internally and mark the external proof gate instead of promoting it into verified policy or billing truth.
          """
          section = '\n'.join(line.strip() for line in section.strip().splitlines())
          if 'INTEGRATED ROSTER / SPLIT-PROJECT CONTRACT' not in p77['copyContent']:
              marker = '\n\nCOVER FORGOTTEN WORK WITHOUT SCOPE CREEP\n'
              if marker not in p77['copyContent']:
                  raise SystemExit('P77 insertion marker not found')
              p77['copyContent'] = p77['copyContent'].replace(marker, '\n\n' + section + marker, 1)

          extra_keywords = [
              'integrated roster', 'split project day', 'daily project allocation', 'private math packet',
              'qualitative admin surface', 'screenshot evidence', 'evidence glossary', 'attendance allocation',
              'billing defense math', 'direct task span'
          ]
          for keyword in extra_keywords:
              if keyword not in p77['keywords']:
                  p77['keywords'].append(keyword)

          registry_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test_path = Path('tests/test_management_operations_prompt_registry.py')
          text = test_path.read_text(encoding='utf-8')
          anchor = '        self.assertIn("merge every exact green authorized head", content)\n'
          additions = (
              '        self.assertIn("INTEGRATED ROSTER / SPLIT-PROJECT CONTRACT", content)\n'
              '        self.assertIn("codified integrated roster", content)\n'
              '        self.assertIn("multiple allocation rows", content)\n'
              '        self.assertIn("Attendance creates paid time; allocation explains it", content)\n'
              '        self.assertIn("PRIVATE QUANTITATIVE MATH VS OUTWARD PROJECTION", content)\n'
              '        self.assertIn("private quantitative Math Packet", content)\n'
              '        self.assertIn("direct request-to-response span", content)\n'
              '        self.assertIn("qualitative share artifact erase", content)\n'
              '        self.assertIn("DRIVE EVIDENCE / GLOSSARY DISCOVERY", content)\n'
              '        self.assertIn("dated Drive evidence folder", content)\n'
              '        self.assertIn("understand what it does not prove", content)\n'
          )
          if 'INTEGRATED ROSTER / SPLIT-PROJECT CONTRACT' not in text:
              if anchor not in text:
                  raise SystemExit('focused test insertion anchor not found')
              text = text.replace(anchor, anchor + additions, 1)
              test_path.write_text(text, encoding='utf-8')

      - name: Regenerate canonical Prompt Kit website
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check

      - name: Run focused and harness validation
        run: |
          python -m unittest tests.test_management_operations_prompt_registry -v
          python -m unittest tests.test_skill_prompt_registry -v
          python tests/test_prompt_kit_header_contract.py
          python scripts/validate_harness.py
          git diff --check

      - name: Commit permanent P77 changes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p77-roster-private-math-sync.yml
          git add registry/prompts/management-operations-prompts.v1.json tests/test_management_operations_prompt_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(prompt-kit): preserve roster and private math boundaries in P77"
          git push origin HEAD:feat/p77-roster-private-math-sync-20260819
