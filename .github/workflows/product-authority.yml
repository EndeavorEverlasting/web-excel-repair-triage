name: Product authority regression
on:
  pull_request:
    paths: [AGENTS.md, .github/workflows/product-authority.yml]
  push:
    paths: [AGENTS.md, .github/workflows/product-authority.yml]
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check retired donor authority
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("AGENTS.md").read_text(encoding="utf-8")
          for value in ("AgentSwitchboard is a retired product", "TokenCorridor owns the product control plane", "Technical cleanup does not reopen retirement"):
              assert value in s, "POLICY_GAP:" + value
          print("PASS: donor retirement is settled")
          PY
