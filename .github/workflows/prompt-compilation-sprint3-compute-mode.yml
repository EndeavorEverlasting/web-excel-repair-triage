name: Prompt Compilation Sprint 3 Compute Mode

on:
  push:
    branches:
      - feat/prompt-compilation-sprint3-compute-mode-20260916

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Sprint 3 lane
        uses: actions/checkout@v4
        with:
          ref: feat/prompt-compilation-sprint3-compute-mode-20260916
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium proof runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Implement, validate, generate, and push exact candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          carrier = Path('.github/carriers/prompt_compilation_sprint3_compute_mode.py')
          spec = importlib.util.spec_from_file_location('prompt_compilation_sprint3_compute_mode', carrier)
          if spec is None or spec.loader is None:
              raise RuntimeError('unable to load Sprint 3 carrier')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          original_validation = module.deterministic_validation

          def ordered_validation():
              # Generated-site assertions are part of the focused suite, so build first.
              module.run('python', 'scripts/build_prompt_kit_registry.py', '--output', 'web/prompt-kit/index.html')
              original_validation()

          module.deterministic_validation = ordered_validation
          raise SystemExit(module.main())
          PY
