name: Prompt Compute Mode Regenerate

on:
  push:
    branches:
      - feat/prompt-compilation-compute-mode-20260916

permissions:
  contents: write

jobs:
  regenerate-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-compilation-compute-mode-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve exact copied content through legacy confirmation contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/prompt-kit-polish.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one Prompt Kit polish target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "var copyToastTimer=null;\n",
              "var copyToastTimer=null;\nvar pendingCopyConfirmation=null;\n",
          )
          replace_once(
              "window.showCopyConfirmation=function(id,copyContentOverride){\n  var promptId=String(id||'');\n  var catalog=typeof PROMPTS!=='undefined'&&Array.isArray(PROMPTS)?PROMPTS:[];\n  var prompt=catalog.find(function(item){return item&&item.id===promptId});\n  var copyContent=copyContentOverride!=null?String(copyContentOverride):(prompt&&prompt.copyContent?(window.PromptKitComputeMode?window.PromptKitComputeMode.effectivePrompt(window,prompt):prompt.copyContent):'');\n",
              "window.showCopyConfirmation=function(id){\n  var promptId=String(id||'');\n  var catalog=typeof PROMPTS!=='undefined'&&Array.isArray(PROMPTS)?PROMPTS:[];\n  var prompt=catalog.find(function(item){return item&&item.id===promptId});\n  var pending=pendingCopyConfirmation&&pendingCopyConfirmation.promptId===promptId?pendingCopyConfirmation:null;\n  var copyContent=pending?pending.copyContent:(prompt&&prompt.copyContent?(window.PromptKitComputeMode?window.PromptKitComputeMode.effectivePrompt(window,prompt):prompt.copyContent):'');\n  pendingCopyConfirmation=null;\n",
          )
          replace_once(
              "    showCopyConfirmation(id,effectiveCopyContent);\n",
              "    pendingCopyConfirmation={promptId:String(id),copyContent:effectiveCopyContent};\n    showCopyConfirmation(id);\n",
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Focused Prompt Compilation suite
        run: python -m unittest tests.test_prompt_compilation tests.test_prompt_context_engine tests.test_prompt_improvement_compiler tests.test_prompt_compute_mode -v
      - name: Browser runtime syntax and behavior
        run: |
          node --check docs/prompt-kit-compute-mode.js
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-polish.js
          node tests/prompt_compute_mode_runtime_test.js
      - name: Compiler fixture
        run: python scripts/prompt_language_compiler.py validate-fixtures --summary
      - name: Generate canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate generated parity and protected regressions
        run: |
          python scripts/build_prompt_kit_registry.py --check
          python scripts/validate_repository_work_ledger.py
          python -m unittest tests.test_prompt_kit_hotkey_completion -v
      - name: Remove one-shot workflow and verify patch hygiene
        run: |
          git rm .github/workflows/prompt-compute-mode-regenerate.yml
          git diff --check
      - name: Commit regenerated product artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prompt-kit-polish.js web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'fix(prompt-kit): preserve Compute Mode copy confirmation proof'
          git push origin HEAD:feat/prompt-compilation-compute-mode-20260916
