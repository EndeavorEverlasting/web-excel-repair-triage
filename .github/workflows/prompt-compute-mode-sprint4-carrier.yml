name: Prompt Compute Mode Sprint 4 Carrier

on:
  push:
    branches:
      - feat/prompt-compilation-compute-mode-20260916

permissions:
  contents: write

jobs:
  apply-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-compilation-compute-mode-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded Sprint 4 source mutations
        run: |
          python scripts/apply_prompt_compute_mode_sprint4.py
          python - <<'PY'
          from pathlib import Path
          path = Path('.ai/WORK_QUEUE.md')
          text = path.read_text(encoding='utf-8')
          old = '- **Status:** ACTIVE / VALIDATION PENDING\n'
          if old not in text:
              raise SystemExit('TRQ-013 provisional status marker missing')
          text = text.replace(old, '- **Status:** VERIFY\n', 1)
          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Focused tests before generation
        run: python -m unittest tests.test_prompt_compilation tests.test_prompt_context_engine tests.test_prompt_improvement_compiler tests.test_prompt_compute_mode -v
      - name: Browser runtime syntax
        run: |
          node --check docs/prompt-kit-compute-mode.js
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-polish.js
      - name: Generate canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Verify canonical Prompt Kit parity
        run: python scripts/build_prompt_kit_registry.py --check
      - name: Validate work ledger and compiler fixtures
        run: |
          python scripts/prompt_language_compiler.py validate-fixtures --summary
          python scripts/validate_repository_work_ledger.py
      - name: Remove one-shot carrier sources
        run: git rm scripts/apply_prompt_compute_mode_sprint4.py .github/workflows/prompt-compute-mode-sprint4-carrier.yml
      - name: Patch hygiene
        run: git diff --check
      - name: Commit canonical Sprint 4 result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/prompt_language_compiler.py scripts/build_prompt_kit_registry.py docs/prompt-kit.js docs/prompt-kit-polish.js docs/prompt-kit-compute-mode.js registry/prompts/prompt-compute-mode.v1.json scripts/prompt_compute_mode.py tests/test_prompt_compute_mode.py harness/prompt-compilation/PROMPT_COMPILATION_SPRINT_MAP.md harness/prompt-compilation/PROMPT_COMPILATION_ARCHITECTURE.md harness/prompt-compilation/README.md .ai/WORK_QUEUE.md .github/workflows/prompt-compute-mode.yml web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'feat(prompt-kit): wire compiler-backed Compute Mode'
          git push origin HEAD:feat/prompt-compilation-compute-mode-20260916
