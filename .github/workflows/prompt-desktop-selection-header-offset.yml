name: Prompt desktop selection header offset repair

on:
  push:
    branches:
      - fix/prompt-desktop-selection-header-offset-20260921

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated repair lane
        uses: actions/checkout@v4
        with:
          ref: fix/prompt-desktop-selection-header-offset-20260921
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium proof runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Repair, regression-test, and push exact candidate
        run: |
          set -euo pipefail
          python .github/carriers/prompt_desktop_selection_header_offset.py
