name: Prompt freshness and evidence contracts

on:
  pull_request:
    paths:
      - 'docs/prompts.json'
      - 'registry/prompts/actionable-next-step-policy.v1.json'
      - 'registry/prompts/repository-work-ledger-prompts.v1.json'
      - 'scripts/build_prompt_kit_registry.py'
      - 'scripts/validate_context_architecture.py'
      - 'harness/contracts/context-architecture.v1.json'
      - 'harness/specs/operator-delivery.md'
      - 'tests/test_actionable_prompt_registry.py'
      - 'tests/test_green_branch_integration_policy.py'
      - 'tests/test_context_architecture.py'
      - 'tests/test_remote_freshness_p13_iteration.py'
      - 'tests/test_operational_closeout_contract.py'
      - 'web/prompt-kit/index.html'
      - '.github/workflows/prompt-freshness-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'docs/prompts.json'
      - 'registry/prompts/actionable-next-step-policy.v1.json'
      - 'registry/prompts/repository-work-ledger-prompts.v1.json'
      - 'scripts/build_prompt_kit_registry.py'
      - 'scripts/validate_context_architecture.py'
      - 'harness/contracts/context-architecture.v1.json'
      - 'harness/specs/operator-delivery.md'
      - 'tests/test_actionable_prompt_registry.py'
      - 'tests/test_green_branch_integration_policy.py'
      - 'tests/test_context_architecture.py'
      - 'tests/test_remote_freshness_p13_iteration.py'
      - 'tests/test_operational_closeout_contract.py'
      - 'web/prompt-kit/index.html'
      - '.github/workflows/prompt-freshness-evidence.yml'

permissions:
  contents: read

jobs:
  freshness-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile freshness contracts
        run: |
          python -m py_compile \
            scripts/build_prompt_kit_registry.py \
            scripts/validate_context_architecture.py \
            tests/test_actionable_prompt_registry.py \
            tests/test_green_branch_integration_policy.py \
            tests/test_context_architecture.py \
            tests/test_remote_freshness_p13_iteration.py \
            tests/test_operational_closeout_contract.py
      - name: Validate prompt freshness and evidence floors
        run: python -m unittest tests.test_remote_freshness_p13_iteration -v
      - name: Validate shared actionability and integration policy
        run: |
          python -m unittest tests.test_actionable_prompt_registry -v
          python -m unittest tests.test_green_branch_integration_policy -v
          python -m unittest tests.test_operational_closeout_contract -v
      - name: Validate live-cert domain routing
        run: |
          python scripts/validate_context_architecture.py --summary
          python -m unittest tests.test_context_architecture -v
      - name: Validate generated Prompt Kit parity
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check origin/main...HEAD

  pr272-scope-exhaustion-hardening:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/prompt-closeout-evidence-hardening-20260824'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-closeout-evidence-hardening-20260824
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh and apply bounded hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --all --prune --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          if [ ! -f .prompt-contrib/scope_exhaustion_after_ci.txt ]; then
            echo 'scope-exhaustion transport already consumed; no mutation needed'
            exit 0
          fi
          git show origin/main:.github/scripts/tmp_scope_exhaustion_closeout_patch.py > /tmp/scope_exhaustion_patch.py
          python /tmp/scope_exhaustion_patch.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate exact changed surface
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .prompt-contrib/scope_exhaustion_after_ci.txt ]; then exit 0; fi
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_operational_closeout_contract -v
          python -m unittest tests.test_repository_work_ledger_prompt -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Pass two, self-clean, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .prompt-contrib/scope_exhaustion_after_ci.txt ]; then exit 0; fi
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import build_prompt_kit_registry
          policy = json.loads(Path('registry/prompts/actionable-next-step-policy.v1.json').read_text(encoding='utf-8'))
          ledger = json.loads(Path('registry/prompts/repository-work-ledger-prompts.v1.json').read_text(encoding='utf-8'))
          p83 = next(p for p in ledger['prompts'] if p['id'] == 'P83')
          effective = {p['id']: p for p in build_prompt_kit_registry.load_prompt_registry()}
          checks = {
              'safe residual invalidates none': 'SAFE & EXECUTABLE means work remains' in policy['copy_content_appendix'],
              'unsafe evidence required': 'UNSAFE is a narrow evidence-bearing classification' in policy['copy_content_appendix'],
              'blocked differs from unsafe': 'Missing access is not evidence that the work is unsafe' in policy['copy_content_appendix'],
              'out-of-scope boundary': 'Do not move unfinished requested work out of scope' in policy['copy_content_appendix'],
              'P83 reusable audit': 'SCOPE-EXHAUSTION AUDIT — CHALLENGE `NONE`' in p83['copyContent'],
              'appendix single': effective['P83']['copyContent'].count(policy['marker']) == 1,
          }
          failed = [k for k,v in checks.items() if not v]
          if failed: raise SystemExit(f'scope-exhaustion pass-two failed: {failed}')
          print(json.dumps({'pass_two':'bounded fixed point', **checks}, indent=2))
          PY
          git rm -f .prompt-contrib/scope_exhaustion_after_ci.txt .github/workflows/tmp-pr272-scope-exhaustion-executor.yml
          git add registry/prompts/actionable-next-step-policy.v1.json registry/prompts/repository-work-ledger-prompts.v1.json tests/test_operational_closeout_contract.py docs/PROMPT_FINDER_QUESTIONNAIRE_TUTORIAL.md web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m 'fix(prompt-kit): make scope exhaustion evidence-bearing'
          git fetch origin main --prune
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
            python scripts/prompt_registry_ops.py validate
            python -m unittest tests.test_operational_closeout_contract tests.test_repository_work_ledger_prompt tests.test_actionable_prompt_registry -v
            python -m unittest tests.test_prompt_language_audit -v
            python scripts/validate_prompt_kit_discovery.py --summary
            python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
            git add web/prompt-kit/index.html
            if ! git diff --cached --quiet; then git commit -m 'chore(prompt-kit): refresh scope closeout site after main reconciliation'; fi
          fi
          git diff --check HEAD
          git push origin HEAD:feat/prompt-closeout-evidence-hardening-20260824
          echo "PROVEN_HEAD=$(git rev-parse HEAD)"
