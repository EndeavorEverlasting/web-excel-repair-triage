name: Prompt Kit canonical sync (temporary sprint)

on:
  push:
    branches:
      - feat/prompt-kit-chronological-order-dense-navigation-20260808
    paths:
      - .github/workflows/prompt-kit-canonical-sync.yml
      - docs/prompt-kit.js
      - docs/prompt-kit-guided-recommendations.js
      - scripts/build_prompt_kit_registry.py

permissions:
  contents: write

jobs:
  sync-canonical-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate exact canonical Prompt Kit
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit canonical artifact when changed
        shell: bash
        run: |
          if git diff --quiet -- web/prompt-kit/index.html; then
            echo "Canonical Prompt Kit is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/index.html
          git commit -m "build(prompt-kit): regenerate canonical website"
          git push origin "HEAD:${GITHUB_REF_NAME}"
