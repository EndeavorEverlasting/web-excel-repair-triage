name: Prompt Kit correspondence generated-site sync

on:
  push:
    branches:
      - feat/prompt-kit-correspondence-prompts-20260815

permissions:
  contents: write

jobs:
  sync-generated-site:
    if: "${{ !contains(github.event.head_commit.message, 'chore(prompt-kit): sync generated correspondence site') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-correspondence-prompts-20260815
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate canonical tracked Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate generated correspondence contracts
        run: |
          python -m unittest tests.test_correspondence_prompt_registry -v
          node --check docs/prompt-kit-correspondence.js
          git diff --check
      - name: Commit generated site when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/prompt-kit/index.html; then
            echo "Canonical Prompt Kit was already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/index.html
          git commit -m "chore(prompt-kit): sync generated correspondence site"
          git push origin HEAD:feat/prompt-kit-correspondence-prompts-20260815
