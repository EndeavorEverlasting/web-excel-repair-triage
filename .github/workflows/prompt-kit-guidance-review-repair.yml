name: Prompt Kit guidance review repair

on:
  pull_request:
    paths:
      - .github/workflows/prompt-kit-guidance-review-repair.yml

permissions:
  contents: write

jobs:
  repair-review-findings:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/prompt-kit-guided-next-steps-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-guided-next-steps-20260807
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repair successor completeness and focus restoration
        run: |
          python - <<'PY'
          from pathlib import Path

          journey = Path('docs/prompt-kit-journey.js')
          text = journey.read_text(encoding='utf-8')

          replacements = [
              ("var MAX_NEXT=3;\n", ""),
              ("return ids.slice(0,MAX_NEXT)", "return ids"),
              (
                  "function attachGuideButtons(container){",
                  "function stableGuidanceOrigin(){if(guidanceReturnOrigin&&document.body.contains(guidanceReturnOrigin))return guidanceReturnOrigin;return document.getElementById('promptFinderBtn')||document.getElementById('homeReset')||null}\nfunction attachGuideButtons(container){",
              ),
              (
                  "root.showPromptDetail(button.getAttribute('data-guide-open'),button)",
                  "root.showPromptDetail(button.getAttribute('data-guide-open'),stableGuidanceOrigin())",
              ),
              (
                  "var originalShowPromptDetail=root.showPromptDetail;if(typeof originalShowPromptDetail==='function'){root.showPromptDetail=function(id,origin){originalShowPromptDetail(id,origin);enhancePromptDetail(id)}}",
                  "var guidanceReturnOrigin=null;var originalShowPromptDetail=root.showPromptDetail;if(typeof originalShowPromptDetail==='function'){root.showPromptDetail=function(id,origin){if(origin&&origin.closest&&origin.closest('#promptDetail'))origin=stableGuidanceOrigin();if(origin&&document.body.contains(origin))guidanceReturnOrigin=origin;originalShowPromptDetail(id,origin);enhancePromptDetail(id)}}",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one journey marker: {old[:80]!r}; found {text.count(old)}')
              text = text.replace(old, new, 1)
          journey.write_text(text, encoding='utf-8')

          guidance_test = Path('tests/test_prompt_kit_guidance.py')
          text = guidance_test.read_text(encoding='utf-8')
          old = '            "MutationObserver",\n            "finder-journey-preview",\n'
          new = '            "MutationObserver",\n            "stableGuidanceOrigin",\n            "closest(\'#promptDetail\')",\n            "finder-journey-preview",\n'
          if text.count(old) != 1:
              raise SystemExit('guidance marker insertion point drifted')
          text = text.replace(old, new, 1)
          old = '        self.assertNotIn("hard-coded prompt", source.lower())\n\n'
          new = '        self.assertNotIn("hard-coded prompt", source.lower())\n        self.assertNotIn("MAX_NEXT", source)\n\n'
          if text.count(old) != 1:
              raise SystemExit('guidance anti-truncation insertion point drifted')
          text = text.replace(old, new, 1)
          anchor = '    def test_builder_and_discovery_contract_register_journey_runtime(self) -> None:\n'
          test = '''    def test_complex_next_step_preserves_every_registered_route(self) -> None:\n        node = shutil.which("node")\n        if not node:\n            self.skipTest("Node is not installed in this test environment")\n        script = f"""\nconst fs=require('fs');\nglobal.PROMPTS=[\n {{id:'P03',name:'Intake',nextStep:'Use P06.',useWhen:'intake'}},\n {{id:'P06',name:'Cleanup',nextStep:'Use P07.',useWhen:'cleanup'}},\n {{id:'P07',name:'Sprint',nextStep:'Use P12.',useWhen:'build'}},\n {{id:'P12',name:'Close',nextStep:'none; no safe actionable work remains',useWhen:'close'}},\n {{id:'P14',name:'Repair',nextStep:'Use P15.',useWhen:'repair'}},\n {{id:'P15',name:'Merge',nextStep:'Use P12.',useWhen:'merge'}},\n {{id:'P20',name:'Discover',nextStep:'Use P07.',useWhen:'discover'}},\n {{id:'P57',name:'Router',nextStep:'Route through P03, P06, P07, P14, P15, P20, then P12.',useWhen:'route'}}\n];\nconst vm=require('vm');\nvm.runInThisContext(fs.readFileSync({json.dumps(str(JOURNEY))},'utf8'));\nconst ids=global.promptGuidanceNextIds('P57');\nconst expected=['P03','P06','P07','P14','P15','P20','P12'];\nif(JSON.stringify(ids)!==JSON.stringify(expected)) throw new Error(JSON.stringify(ids));\nconsole.log('GUIDANCE_COMPLEX_ROUTE_PASS');\n"""\n        completed = subprocess.run(\n            [node, "-e", script],\n            cwd=ROOT,\n            check=False,\n            capture_output=True,\n            text=True,\n        )\n        self.assertEqual(completed.returncode, 0, completed.stderr)\n        self.assertIn("GUIDANCE_COMPLEX_ROUTE_PASS", completed.stdout)\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('guidance complex-route insertion point drifted')
          text = text.replace(anchor, test + anchor, 1)
          guidance_test.write_text(text, encoding='utf-8')

          discovery_test = Path('tests/test_prompt_kit_discovery.py')
          text = discovery_test.read_text(encoding='utf-8')
          old = '            "sessionStorage",\n            "finder-journey-preview",\n'
          new = '            "sessionStorage",\n            "stableGuidanceOrigin",\n            "closest(\'#promptDetail\')",\n            "finder-journey-preview",\n'
          if text.count(old) != 1:
              raise SystemExit('discovery focus marker insertion point drifted')
          text = text.replace(old, new, 1)
          old = '        self.assertNotIn("localStorage", journey)\n\n'
          new = '        self.assertNotIn("localStorage", journey)\n        self.assertNotIn("MAX_NEXT", journey)\n\n'
          if text.count(old) != 1:
              raise SystemExit('discovery anti-truncation insertion point drifted')
          text = text.replace(old, new, 1)
          discovery_test.write_text(text, encoding='utf-8')

          validator = Path('scripts/validate_prompt_kit_discovery.py')
          text = validator.read_text(encoding='utf-8')
          old = '        "MutationObserver",\n        "prefers-reduced-motion:reduce",\n'
          new = '        "MutationObserver",\n        "stableGuidanceOrigin",\n        "closest(\'#promptDetail\')",\n        "prefers-reduced-motion:reduce",\n'
          if text.count(old) != 1:
              raise SystemExit('validator focus marker insertion point drifted')
          text = text.replace(old, new, 1)
          old = '    if "NEXT_PROMPT_MAP" in journey_js or "hard-coded prompt" in journey_js.lower():\n        missing.append("guided_next_step_journey")\n'
          new = '    if (\n        "NEXT_PROMPT_MAP" in journey_js\n        or "hard-coded prompt" in journey_js.lower()\n        or "MAX_NEXT" in journey_js\n    ):\n        missing.append("guided_next_step_journey")\n'
          if text.count(old) != 1:
              raise SystemExit('validator anti-truncation insertion point drifted')
          text = text.replace(old, new, 1)
          validator.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate and validate exact Prompt Kit
        run: |
          node --check docs/prompt-kit-journey.js
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_kit_guidance -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Commit review repairs and generated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prompt-kit-journey.js scripts/validate_prompt_kit_discovery.py tests/test_prompt_kit_discovery.py tests/test_prompt_kit_guidance.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'fix(prompt-kit): preserve complete guided routes and focus'
          git push origin HEAD:feat/prompt-kit-guided-next-steps-20260807
