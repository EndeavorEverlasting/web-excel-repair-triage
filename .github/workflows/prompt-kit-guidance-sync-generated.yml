name: Prompt Kit guidance generated-site sync

on:
  pull_request:
    paths:
      - docs/prompt-kit-journey.js
      - scripts/build_prompt_kit_registry.py
      - .github/workflows/prompt-kit-guidance-sync-generated.yml

permissions:
  contents: write

jobs:
  sync-generated-site:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/prompt-kit-guided-next-steps-20260807'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-guided-next-steps-20260807
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repair known fallback quote escape
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/prompt-kit-journey.js')
          text = path.read_text(encoding='utf-8')
          bad = "'\"':'&quot',"
          good = "'\"':'&quot;',"
          if bad in text:
              text = text.replace(bad, good, 1)
              path.write_text(text, encoding='utf-8')
          if good not in path.read_text(encoding='utf-8'):
              raise SystemExit('expected escaped quote marker was not repaired')
          PY
      - name: Regenerate canonical Prompt Kit
        run: |
          node --check docs/prompt-kit-journey.js
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Commit exact generated site when changed
        run: |
          if git diff --quiet -- docs/prompt-kit-journey.js web/prompt-kit/index.html; then
            echo 'Generated site is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prompt-kit-journey.js web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'build(prompt-kit): refresh guided workflow website'
          git push origin HEAD:feat/prompt-kit-guided-next-steps-20260807
