name: Prompt Kit hierarchical filter mainline bridge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: prompt-kit-hierarchy-mainline-bridge
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feat/prompt-kit-hierarchical-filters-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-hierarchical-filters-20260823
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh and reconcile exact heads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/prompt-kit-hierarchical-filters-20260823 --prune
          feature_sha="$(git rev-parse HEAD)"
          remote_feature_sha="$(git rev-parse origin/feat/prompt-kit-hierarchical-filters-20260823)"
          main_sha="$(git rev-parse origin/main)"
          echo "feature=$feature_sha"
          echo "main=$main_sha"
          test "$feature_sha" = "$remote_feature_sha"
          git merge --no-edit origin/main

      - name: Bound transport to hierarchy-only product change
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.prompt-contrib/hierarchical_filter_patch.py')
          if not path.exists():
              raise SystemExit('hierarchical filter patch transport is missing')
          text = path.read_text(encoding='utf-8')

          anchor = 'test = test.replace("self.assertIn(\\"aria-label\x27,\x27Prompt types\\", js)", "self.assertIn(\\"aria-label\x27,\x27Prompt subcategories\\", js)")'
          label_patch = 'test = test.replace(\x27        self.assertIn("All Types", js)\\n\x27, \x27        self.assertIn("All Subcategories", js)\\n\x27)'
          if label_patch not in text:
              if anchor not in text:
                  raise SystemExit('hierarchical filter label-repair anchor missing')
              text = text.replace(anchor, label_patch + '\n' + anchor, 1)

          cleanup_old = '''if WORKFLOW.exists():\n    run("git", "rm", str(WORKFLOW.relative_to(ROOT)))\nrun("git", "rm", str(SELF.relative_to(ROOT)))'''
          cleanup_new = '''for relative in (\n    ".github/workflows/prompt-kit-hierarchical-filter-repair.yml",\n    ".prompt-contrib/hierarchical_filter_patch.py",\n    ".prompt-contrib/hierarchical_filter_search_suppression.yml",\n    ".prompt-contrib/hierarchical_filter_trigger.txt",\n):\n    candidate = ROOT / relative\n    if candidate.exists():\n        run("git", "rm", relative)'''
          if cleanup_new not in text:
              if cleanup_old not in text:
                  raise SystemExit('hierarchy transport-cleanup anchor missing')
              text = text.replace(cleanup_old, cleanup_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply hierarchy and run owning proof
        shell: bash
        run: |
          set -euo pipefail
          python .prompt-contrib/hierarchical_filter_patch.py

      - name: Prove remote convergence and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/prompt-kit-hierarchical-filters-20260823 --prune
          remote_feature="$(git rev-parse origin/feat/prompt-kit-hierarchical-filters-20260823)"
          test "$(git rev-parse HEAD)" = "$remote_feature"
          expected="docs/prompt-kit.js
harness/contracts/prompt-kit-filtering.v1.json
tests/test_prompt_kit_filtering_access.py
web/prompt-kit/index.html"
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check origin/main...HEAD
