name: Prompt Kit mobile Favorites quick-access carrier

on:
  push:
    branches:
      - feat/prompt-kit-mobile-favorites-quick-access-20260905

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply bounded mobile Favorites implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          polish_path = Path('docs/prompt-kit-polish.js')
          polish = polish_path.read_text(encoding='utf-8')

          style_anchor = ".header.filters-collapsed .filter-panel-toggle{justify-self:end;margin-left:0}@keyframes"
          style_insert = ".header.filters-collapsed .filter-panel-toggle{justify-self:end;margin-left:0}.mobile-favorites-quick{display:none;align-items:center;justify-content:center;min-height:44px;padding:8px 12px;border:1px solid rgba(245,158,11,.45);border-radius:8px;background:rgba(245,158,11,.08);color:#fbbf24;font-size:12px;font-weight:800;letter-spacing:.02em;cursor:pointer;touch-action:manipulation}.mobile-favorites-quick:hover,.mobile-favorites-quick:focus-visible{outline:none;border-color:#f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,.18)}@keyframes"
          if polish.count(style_anchor) != 1:
              raise SystemExit('Mobile Favorites style anchor missing or non-unique')
          polish = polish.replace(style_anchor, style_insert, 1)

          mobile_anchor = ".header-top>.header-controls .stats{justify-content:center}.header.filters-collapsed .header-top{grid-template-columns:minmax(0,1fr) auto}}"
          mobile_insert = ".header-top>.header-controls .stats{justify-content:center}.header-top>.header-controls .mobile-favorites-quick{display:inline-flex;width:100%;grid-column:1/-1}.header.filters-collapsed .header-top{grid-template-columns:minmax(0,1fr) auto}}"
          if polish.count(mobile_anchor) != 1:
              raise SystemExit('Mobile Favorites responsive anchor missing or non-unique')
          polish = polish.replace(mobile_anchor, mobile_insert, 1)

          controls_anchor = "  if(!document.getElementById('favoritesShortcut')){\n    var favoritesButton=document.createElement('button');"
          quick_block = """  if(!document.getElementById('mobileFavoritesQuick')){
    var mobileFavoritesQuick=document.createElement('button');
    mobileFavoritesQuick.className='mobile-favorites-quick';
    mobileFavoritesQuick.id='mobileFavoritesQuick';
    mobileFavoritesQuick.type='button';
    mobileFavoritesQuick.setAttribute('data-view','favorites');
    mobileFavoritesQuick.setAttribute('aria-label','Open saved favorite prompts');
    mobileFavoritesQuick.textContent='★ Favorites';
    mobileFavoritesQuick.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();activateFavoritesView()});
    if(catTabs.parentNode)catTabs.parentNode.insertBefore(mobileFavoritesQuick,catTabs)
  }

"""
          if polish.count(controls_anchor) != 1:
              raise SystemExit('Favorites control anchor missing or non-unique')
          polish = polish.replace(controls_anchor, quick_block + controls_anchor, 1)
          polish_path.write_text(polish, encoding='utf-8')

          contract_path = Path('harness/contracts/prompt-kit-mobile.v1.json')
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          ids = [item.get('id') for item in contract.get('requirements', [])]
          if 'favorites_quick_access' in ids:
              raise SystemExit('favorites_quick_access already exists; carrier is stale')
          requirements = contract['requirements']
          insert_at = ids.index('touch_copy_preserved') + 1
          requirements.insert(insert_at, {
              'id': 'favorites_quick_access',
              'expected': 'On narrow mobile layouts, a persistent touch-sized Favorites quick action remains visible outside horizontally scrollable rails and opens the existing canonical Favorites view without creating separate Favorites state or storage.'
          })
          contract_path.write_text(json.dumps(contract, indent=2) + '\n', encoding='utf-8')

          test_path = Path('tests/test_prompt_kit_mobile.py')
          tests = test_path.read_text(encoding='utf-8')
          root_anchor = 'JS = ROOT / "docs" / "prompt-kit.js"\n'
          if tests.count(root_anchor) != 1:
              raise SystemExit('Mobile test root anchor missing or non-unique')
          tests = tests.replace(root_anchor, root_anchor + 'POLISH = ROOT / "docs" / "prompt-kit-polish.js"\n', 1)
          requirement_anchor = '                "touch_copy_preserved",\n'
          if tests.count(requirement_anchor) != 1:
              raise SystemExit('Mobile requirement-set anchor missing or non-unique')
          tests = tests.replace(requirement_anchor, requirement_anchor + '                "favorites_quick_access",\n', 1)
          next_test = '    def test_category_collapse_control_is_touch_sized_and_native(self) -> None:\n'
          regression = '''    def test_mobile_favorites_quick_action_is_persistent_and_reuses_canonical_view(self) -> None:\n        polish = POLISH.read_text(encoding="utf-8")\n        for marker in (\n            "id='mobileFavoritesQuick'",\n            "className='mobile-favorites-quick'",\n            "setAttribute('data-view','favorites')",\n            "setAttribute('aria-label','Open saved favorite prompts')",\n            "textContent='★ Favorites'",\n            "activateFavoritesView()",\n            "catTabs.parentNode.insertBefore(mobileFavoritesQuick,catTabs)",\n            ".mobile-favorites-quick{display:none",\n            ".header-top>.header-controls .mobile-favorites-quick{display:inline-flex;width:100%;grid-column:1/-1}",\n        ):\n            self.assertIn(marker, polish)\n        self.assertEqual(polish.count("id='mobileFavoritesQuick'"), 1)\n        self.assertNotIn("mobileFavoritePromptIds", polish)\n        self.assertNotIn("mobileFavoritesStorage", polish)\n\n'''
          if tests.count(next_test) != 1:
              raise SystemExit('Mobile regression insertion point missing or non-unique')
          tests = tests.replace(next_test, regression + next_test, 1)
          test_path.write_text(tests, encoding='utf-8')

          browser_path = Path('tests/prompt_kit_favorite_browser_proof.py')
          browser = browser_path.read_text(encoding='utf-8')
          before_browser_close = "            browser.close()\n"
          mobile_scenario = '''            mobile_context = browser.new_context(\n                viewport={"width": 390, "height": 844},\n                is_mobile=True,\n                has_touch=True,\n                reduced_motion="reduce",\n            )\n            mobile_page = mobile_context.new_page()\n            mobile_page.goto(f"http://127.0.0.1:{port}/web/prompt-kit/index.html", wait_until="domcontentloaded")\n            quick = mobile_page.locator('#mobileFavoritesQuick')\n            quick_visible = quick.is_visible()\n            quick_rect = quick.bounding_box() or {}\n            quick_in_viewport = bool(quick_rect and quick_rect.get('x', -1) >= 0 and quick_rect.get('y', -1) >= 0 and quick_rect.get('x', 0) + quick_rect.get('width', 0) <= 390 and quick_rect.get('y', 0) + quick_rect.get('height', 0) <= 844)\n            mobile_card = mobile_page.locator('[data-prompt-id="P79"]')\n            mobile_card.locator('.prompt-favorite-btn').click()\n            mobile_page.wait_for_timeout(80)\n            quick.click()\n            mobile_page.wait_for_timeout(100)\n            favorite_view_active = mobile_page.evaluate("activeSection === '__favorites__'")\n            favorite_card_present = mobile_page.locator('[data-prompt-id="P79"]').count() == 1\n            showing_favorite = mobile_page.locator('#showing').inner_text() == '1'\n            mobile_page.locator('[data-prompt-id="P79"] .prompt-favorite-btn').click()\n            mobile_page.wait_for_timeout(100)\n            removed_from_view = mobile_page.locator('[data-prompt-id="P79"]').count() == 0 and mobile_page.locator('#showing').inner_text() == '0'\n            quick_still_visible = quick.is_visible()\n            mobile_page.locator('#homeReset').click()\n            mobile_page.wait_for_timeout(100)\n            returned_to_all = mobile_page.evaluate("activeSection === null && activeCat === 'all'") and mobile_page.locator('[data-prompt-id="P79"]').count() == 1\n            observations.append({\n                "id": "mobile_favorites_quick_access",\n                "event": "Mobile Favorites quick action stays visible outside scroll rails and reuses canonical Favorites state",\n                "occurred": True,\n                "passed": bool(all((quick_visible, quick_in_viewport, favorite_view_active, favorite_card_present, showing_favorite, removed_from_view, quick_still_visible, returned_to_all))),\n                "quick_visible": bool(quick_visible),\n                "quick_in_viewport": bool(quick_in_viewport),\n                "favorite_view_active": bool(favorite_view_active),\n                "favorite_card_present": bool(favorite_card_present),\n                "showing_favorite": bool(showing_favorite),\n                "removed_from_view": bool(removed_from_view),\n                "quick_still_visible": bool(quick_still_visible),\n                "returned_to_all": bool(returned_to_all),\n                "viewport": {"width": 390, "height": 844},\n            })\n            mobile_context.close()\n\n'''
          if browser.count(before_browser_close) != 1:
              raise SystemExit('Browser-close anchor missing or non-unique')
          browser = browser.replace(before_browser_close, mobile_scenario + before_browser_close, 1)

          claim_anchor = '        "claims": [\n'
          claim = '''            {"id": "mobile_favorites_quick_access", "statement": "A phone-width viewport exposes a persistent Favorites quick action outside horizontal rails; saving, opening Favorites, removing, and returning to All reuse the canonical Favorites state", "status": "PASS" if by_id["mobile_favorites_quick_access"]["passed"] else "FAIL", "required_evidence_class": "browser_runtime_observed", "observation_ids": ["mobile_favorites_quick_access"]},\n'''
          if browser.count(claim_anchor) != 1:
              raise SystemExit('Browser claim anchor missing or non-unique')
          browser = browser.replace(claim_anchor, claim_anchor + claim, 1)
          browser_path.write_text(browser, encoding='utf-8')
          PY

      - name: Rebuild canonical Prompt Kit release
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Validate implementation and generated parity
        run: |
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_mobile tests.test_prompt_kit_hotkey_completion tests.test_prompt_kit_filtering_access tests.test_prompt_kit_product_interactions -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_prompt_kit_discovery.py --summary
          git diff --check

      - name: Deliberate second-pass invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8')
          deployed = Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          markers = (
              "id='mobileFavoritesQuick'",
              "catTabs.parentNode.insertBefore(mobileFavoritesQuick,catTabs)",
              ".header-top>.header-controls .mobile-favorites-quick{display:inline-flex;width:100%;grid-column:1/-1}",
              "activateFavoritesView()",
          )
          for marker in markers:
              assert marker in source, marker
              assert marker in deployed, marker
          assert source.count("id='mobileFavoritesQuick'") == 1
          assert deployed.count("id='mobileFavoritesQuick'") == 1
          assert 'mobileFavoritePromptIds' not in source
          assert 'mobileFavoritesStorage' not in source
          print('MOBILE_FAVORITES_QUICK_FIXED_POINT=PASS')
          PY
          git diff --check

      - name: Commit durable change and remove carrier
        shell: bash
        run: |
          git rm .github/workflows/prompt-kit-mobile-favorites-quick-carrier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prompt-kit-polish.js harness/contracts/prompt-kit-mobile.v1.json tests/test_prompt_kit_mobile.py tests/prompt_kit_favorite_browser_proof.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "feat(prompt-kit): add mobile Favorites quick access"
          git push origin HEAD:feat/prompt-kit-mobile-favorites-quick-access-20260905
