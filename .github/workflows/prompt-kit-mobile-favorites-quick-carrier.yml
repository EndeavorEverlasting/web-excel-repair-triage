name: Prompt Kit mobile Favorites quick-access carrier

on:
  push:
    branches:
      - feat/prompt-kit-mobile-favorites-quick-access-20260905

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply bounded patch
        run: python scripts/_tmp_apply_mobile_favorites_quick_access.py

      - name: Rebuild canonical site
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Validate focused behavior
        run: |
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_mobile tests.test_prompt_kit_hotkey_completion tests.test_prompt_kit_filtering_access tests.test_prompt_kit_product_interactions -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_prompt_kit_discovery.py --summary
          git diff --check

      - name: Review generated/source parity
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8')
          deployed=Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          markers=(
              "id='mobileFavoritesQuick'",
              "catTabs.parentNode.insertBefore(mobileFavoritesQuick,catTabs)",
              ".header-top>.header-controls .mobile-favorites-quick{display:inline-flex;width:100%;grid-column:1/-1}",
          )
          for marker in markers:
              assert marker in source
              assert marker in deployed
          assert source.count("id='mobileFavoritesQuick'")==1
          assert deployed.count("id='mobileFavoritesQuick'")==1
          assert 'mobileFavoritePromptIds' not in source
          assert 'mobileFavoritesStorage' not in source
          print('MOBILE_FAVORITES_QUICK_FIXED_POINT=PASS')
          PY
          git diff --check

      - name: Commit durable change and remove temporary execution files
        run: |
          git rm .github/workflows/prompt-kit-mobile-favorites-quick-carrier.yml
          git rm scripts/_tmp_apply_mobile_favorites_quick_access.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prompt-kit-polish.js harness/contracts/prompt-kit-mobile.v1.json tests/test_prompt_kit_mobile.py tests/prompt_kit_favorite_browser_proof.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "feat(prompt-kit): add mobile Favorites quick access"
          git push origin HEAD:feat/prompt-kit-mobile-favorites-quick-access-20260905
