name: Prompt Kit mobile Quick Controls repair runner

on:
  push:
    branches:
      - fix/prompt-kit-mobile-quick-controls-focus-20260907

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/prompt-kit-mobile-quick-controls-focus-20260907
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Apply bounded UX repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/execute_mobile_quick_controls_discoverability_patch.py
          python - <<'PY'
          import json
          from pathlib import Path

          polish = Path('docs/prompt-kit-polish.js')
          text = polish.read_text(encoding='utf-8')
          replacements = (
              ("grid-template-areas:'. up .' 'left center right' '. down .';",
               'grid-template-areas:". up ." "left center right" ". down .";'),
              ('.hotkey-help-list,.hotkey-shortcut-config{display:none}',
               '.hotkey-help-list,.hotkey-shortcut-config,.prompt-profile-editor{display:none!important}'),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one Prompt Kit source reconciliation for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          polish.write_text(text, encoding='utf-8')

          tests = Path('tests/test_prompt_kit_mobile_quick_controls.py')
          test_text = tests.read_text(encoding='utf-8')
          replacements = (
              ('".mobile-quick-controls{display:grid}",', '".mobile-quick-controls{display:grid;gap:8px",'),
              ('".hotkey-help-list,.hotkey-shortcut-config{display:none}",',
               '".hotkey-help-list,.hotkey-shortcut-config,.prompt-profile-editor{display:none!important}",'),
              ('"Tap Quick Controls",', '"Tap **Quick Controls**",'),
              ('"Swipe up from Quick Controls",', '"swipe up on the pill",'),
              ('"Swipe left from Quick Controls",', '"swipe left or tap the arrow",'),
              ('"Swipe right from Quick Controls",', '"swipe right or tap the arrow",'),
              ('"Swipe down from Quick Controls",', '"swipe down or tap the arrow",'),
          )
          for old_test, new_test in replacements:
              count = test_text.count(old_test)
              if count != 1:
                  raise SystemExit(f'expected one test-literal reconciliation for {old_test!r}, found {count}')
              test_text = test_text.replace(old_test, new_test, 1)
          tests.write_text(test_text, encoding='utf-8')

          contract_path = Path('harness/contracts/prompt-kit-mobile.v1.json')
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          requirement = next(item for item in contract['requirements'] if item['id'] == 'mobile_quick_controls_gesture_parity')
          old_contract = 'On mobile the desktop Hotkeys list and Favorite-shortcut editor are hidden so the panel does not become screen-filling.'
          new_contract = 'On mobile the desktop Hotkeys list, Favorite-shortcut editor, and profile editor are hidden so the panel does not become screen-filling.'
          if old_contract not in requirement['expected']:
              raise SystemExit('mobile contract desktop-only editor sentence not found')
          requirement['expected'] = requirement['expected'].replace(old_contract, new_contract, 1)
          contract_path.write_text(json.dumps(contract, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          guide = Path('OPEN_PROMPT_KIT_ON_PHONE.md')
          guide_text = guide.read_text(encoding='utf-8')
          old_guide = 'Desktop-only Hotkeys rows and Favorite-shortcut configuration stay hidden on narrow touch layouts so Quick Controls does not turn into a screen-filling keyboard reference.'
          new_guide = 'Desktop-only Hotkeys rows, Favorite-shortcut configuration, and the profile editor stay hidden on narrow touch layouts so Quick Controls does not turn into a screen-filling configuration sheet.'
          if guide_text.count(old_guide) != 1:
              raise SystemExit('phone guide desktop-only editor sentence not found')
          guide.write_text(guide_text.replace(old_guide, new_guide, 1), encoding='utf-8')

          proof = Path('tests/prompt_kit_mobile_quick_controls_browser_proof.py')
          proof_text = proof.read_text(encoding='utf-8')
          proof_replacements = (
              ('assert box.get("height", 0) >= 44 and box.get("width", 0) >= 44, box',
               'assert box.get("height", 0) >= 44 and 44 <= box.get("width", 0) <= 260, box'),
              ('assert 0 < panel_box.get("height", 0) <= 500, panel_box',
               'assert 0 < panel_box.get("height", 0) <= 470, panel_box\n'
               '                panel_metrics = panel.evaluate("el => ({clientHeight: el.clientHeight, scrollHeight: el.scrollHeight})")\n'
               '                assert panel_metrics["scrollHeight"] <= panel_metrics["clientHeight"] + 2, panel_metrics'),
              ('assert not page.locator(".hotkey-shortcut-config").is_visible(), "desktop shortcut editor leaks into mobile Quick Controls"',
               'assert not page.locator(".hotkey-shortcut-config").is_visible(), "desktop shortcut editor leaks into mobile Quick Controls"\n'
               '                assert not page.locator(".prompt-profile-editor").is_visible(), "desktop profile editor leaks into mobile Quick Controls"'),
          )
          for old_proof, new_proof in proof_replacements:
              count = proof_text.count(old_proof)
              if count != 1:
                  raise SystemExit(f'expected one browser-proof reconciliation for {old_proof!r}, found {count}')
              proof_text = proof_text.replace(old_proof, new_proof, 1)
          proof.write_text(proof_text, encoding='utf-8')
          PY
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_mobile tests.test_prompt_kit_mobile_quick_controls tests.test_prompt_kit_hotkey_completion -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python tests/prompt_kit_mobile_quick_controls_browser_proof.py
          git diff --check
      - name: Commit durable result and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/execute_mobile_quick_controls_discoverability_patch.py
          rm -f .github/workflows/prompt-kit-mobile-focus-test-reconcile-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prompt-kit-polish.js tests/test_prompt_kit_mobile_quick_controls.py tests/prompt_kit_mobile_quick_controls_browser_proof.py harness/contracts/prompt-kit-mobile.v1.json OPEN_PROMPT_KIT_ON_PHONE.md web/prompt-kit/index.html scripts/execute_mobile_quick_controls_discoverability_patch.py .github/workflows/prompt-kit-mobile-focus-test-reconcile-runner.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(prompt-kit): make mobile swipe controls obvious and compact'
          git push origin HEAD:fix/prompt-kit-mobile-quick-controls-focus-20260907
