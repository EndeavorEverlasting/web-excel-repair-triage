name: Prompt Kit mobile Quick Controls repair runner

on:
  push:
    branches:
      - fix/prompt-kit-mobile-quick-controls-focus-20260907

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/prompt-kit-mobile-quick-controls-focus-20260907
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Apply bounded UX repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/execute_mobile_quick_controls_discoverability_patch.py
          python - <<'PY'
          from pathlib import Path

          polish = Path('docs/prompt-kit-polish.js')
          text = polish.read_text(encoding='utf-8')
          old = "grid-template-areas:'. up .' 'left center right' '. down .';"
          new = 'grid-template-areas:". up ." "left center right" ". down .";'
          if text.count(old) != 1:
              raise SystemExit(f'expected one grid-template-areas quote repair, found {text.count(old)}')
          polish.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_prompt_kit_mobile_quick_controls.py')
          test_text = tests.read_text(encoding='utf-8')
          replacements = (
              ('".mobile-quick-controls{display:grid}",', '".mobile-quick-controls{display:grid;gap:8px",'),
              ('for phrase in ("Tap Quick Controls", "swipe up", "swipe left", "swipe right", "swipe down", "optional accelerator"):',
               'for phrase in ("Tap **Quick Controls**", "swipe up", "swipe left", "swipe right", "swipe down", "optional accelerator"):')
          )
          for old_test, new_test in replacements:
              count = test_text.count(old_test)
              if count != 1:
                  raise SystemExit(f'expected one test-literal reconciliation for {old_test!r}, found {count}')
              test_text = test_text.replace(old_test, new_test, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_mobile tests.test_prompt_kit_mobile_quick_controls tests.test_prompt_kit_hotkey_completion -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python tests/prompt_kit_mobile_quick_controls_browser_proof.py
          git diff --check
      - name: Commit durable result and remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/execute_mobile_quick_controls_discoverability_patch.py
          rm -f .github/workflows/prompt-kit-mobile-focus-test-reconcile-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prompt-kit-polish.js tests/test_prompt_kit_mobile_quick_controls.py tests/prompt_kit_mobile_quick_controls_browser_proof.py harness/contracts/prompt-kit-mobile.v1.json OPEN_PROMPT_KIT_ON_PHONE.md web/prompt-kit/index.html scripts/execute_mobile_quick_controls_discoverability_patch.py .github/workflows/prompt-kit-mobile-focus-test-reconcile-runner.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(prompt-kit): make mobile swipe controls obvious and compact'
          git push origin HEAD:fix/prompt-kit-mobile-quick-controls-focus-20260907
