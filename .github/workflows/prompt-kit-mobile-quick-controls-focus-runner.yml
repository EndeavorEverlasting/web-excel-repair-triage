name: Prompt Kit mobile quick controls focus runner

on:
  push:
    branches:
      - fix/prompt-kit-mobile-quick-controls-focus-20260907

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/prompt-kit-mobile-quick-controls-focus-20260907
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Apply focus repair
        run: python scripts/execute_mobile_quick_controls_focus_patch.py
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_mobile tests.test_prompt_kit_mobile_quick_controls -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python tests/prompt_kit_mobile_quick_controls_browser_proof.py
          git diff --check
      - name: Commit durable repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/execute_mobile_quick_controls_focus_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/prompt-kit-polish.js tests/test_prompt_kit_mobile_quick_controls.py tests/prompt_kit_mobile_quick_controls_browser_proof.py web/prompt-kit/index.html scripts/execute_mobile_quick_controls_focus_patch.py
          git commit -m 'fix(prompt-kit): keep Quick Controls focus touch-first'
          git push origin HEAD:fix/prompt-kit-mobile-quick-controls-focus-20260907
