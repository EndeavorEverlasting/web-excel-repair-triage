name: Prompt Kit mobile quick controls runner

on:
  push:
    branches:
      - feat/prompt-kit-mobile-quick-controls-20260907

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-mobile-quick-controls-20260907
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Apply bounded patch
        run: python scripts/execute_mobile_quick_controls_patch.py
      - name: Regenerate and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_mobile tests.test_prompt_kit_mobile_quick_controls -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit durable slice
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prompt-kit-mobile-quick-controls-executor.yml
          rm -f .github/workflows/prompt-kit-mobile-quick-controls-runner.yml
          rm -f scripts/execute_mobile_quick_controls_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(prompt-kit): add mobile Quick Controls gesture handle'
          git push origin HEAD:feat/prompt-kit-mobile-quick-controls-20260907
