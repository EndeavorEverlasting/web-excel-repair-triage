name: Prompt Kit GitHub Pages

on:
  pull_request:
    paths:
      - OPEN_PROMPT_KIT_ON_PHONE.md
      - PROMPT_KIT_ACCESS.md
      - build_prompt_kit.py
      - scripts/build_prompt_kit_registry.py
      - registry/prompts/**
      - docs/prompt-kit.js
      - docs/prompts.json
      - docs/reference.json
      - web/prompt-kit/index.html
      - web/prompt-kit-mobile/**
      - tests/test_prompt_kit_pages.py
      - .github/workflows/prompt-kit-pages.yml
  push:
    branches: [main]
    paths:
      - OPEN_PROMPT_KIT_ON_PHONE.md
      - PROMPT_KIT_ACCESS.md
      - build_prompt_kit.py
      - scripts/build_prompt_kit_registry.py
      - registry/prompts/**
      - docs/prompt-kit.js
      - docs/prompts.json
      - docs/reference.json
      - web/prompt-kit/index.html
      - web/prompt-kit-mobile/**
      - tests/test_prompt_kit_pages.py
      - .github/workflows/prompt-kit-pages.yml
  workflow_dispatch:

concurrency:
  group: prompt-kit-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Pages contract
        run: python -m py_compile scripts/build_prompt_kit_registry.py tests/test_prompt_kit_pages.py
      - name: Validate Pages publishing contract
        run: python -m unittest tests.test_prompt_kit_pages -v
      - name: Validate committed patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            git diff --check "${{ github.event.before }}..HEAD"
          else
            git diff --check HEAD^..HEAD
          fi
      - name: Validate exact checked-in Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Build Pages bundle from canonical registry
        env:
          SITE_ROOT: ${{ runner.temp }}/prompt-kit-pages
        run: |
          set -euo pipefail
          mkdir -p "$SITE_ROOT/prompt-kit"
          python scripts/build_prompt_kit_registry.py --output "$SITE_ROOT/prompt-kit/index.html"
          cp -R web/prompt-kit-mobile/. "$SITE_ROOT/"
          test -s "$SITE_ROOT/index.html"
          test -s "$SITE_ROOT/manifest.webmanifest"
          test -s "$SITE_ROOT/service-worker.js"
          test -s "$SITE_ROOT/icon-192.png"
          test -s "$SITE_ROOT/icon-512.png"
          test -s "$SITE_ROOT/qr-prompt-kit.png"
          test -s "$SITE_ROOT/prompt-kit/index.html"
          cmp "$SITE_ROOT/prompt-kit/index.html" web/prompt-kit/index.html
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/prompt-kit-pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Prompt Kit to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
