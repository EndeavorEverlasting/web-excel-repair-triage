name: Prompt Kit GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prompt-kit-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact candidate and current main floor
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test -n "$(git rev-parse origin/main)"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git merge-base --is-ancestor origin/main HEAD
          fi
          echo "candidate sha=$(git rev-parse HEAD)"
          echo "main floor=$(git rev-parse origin/main)"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Harness E2E gate
        run: |
          python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
          python -m unittest tests.test_harness_contract -v
      - name: Explicit feedback contract gate
        run: |
          node --check docs/prompt-kit-feedback-prototype.js
          node docs/prompt-kit-feedback-prototype.js > Outputs/prompt-kit-feedback-prototype.json
          python -m unittest tests.test_prompt_kit_feedback_prototype tests.test_prompt_kit_feedback_production -v
          python scripts/prompt_kit_feedback_hook.py --input feedback/inbox --output Outputs/prompt-kit-feedback-maintenance.json
      - name: Promotion fail-closed regression gate
        run: python -m unittest tests.test_prompt_kit_promotion_pipeline -v
      - name: Validate exact checked-in Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Validate Roster Log V2 static app
        run: |
          node --check web/roster-log-v2/app.js
          python -m pytest tests/test_roster_log_v2.py -q
      - name: Application browser E2E gate
        run: bash scripts/run_prompt_kit_browser_e2e.sh | tee Outputs/prompt-kit-browser-e2e.json
      - name: Release identity gate
        run: python scripts/validate_prompt_kit_release_identity.py --output Outputs/prompt-kit-release-identity.json --summary
      - name: Pages contract gate
        run: python -m unittest tests.test_prompt_kit_pages -v
      - name: Validate committed patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            git diff --check "${{ github.event.before }}..HEAD"
          else
            git diff --check HEAD^..HEAD
          fi
      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: prompt-kit-validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: Outputs/
          if-no-files-found: error
          retention-days: 14

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build Pages bundle from canonical registry
        env:
          SITE_ROOT: ${{ runner.temp }}/prompt-kit-pages
        run: |
          set -euo pipefail
          mkdir -p "$SITE_ROOT/prompt-kit" "$SITE_ROOT/roster-log-v2" Outputs
          python scripts/build_prompt_kit_registry.py --output "$SITE_ROOT/prompt-kit/index.html"
          cp -R web/prompt-kit-mobile/. "$SITE_ROOT/"
          cp -R web/roster-log-v2/. "$SITE_ROOT/roster-log-v2/"
          test -s "$SITE_ROOT/index.html"
          test -s "$SITE_ROOT/manifest.webmanifest"
          test -s "$SITE_ROOT/service-worker.js"
          test -s "$SITE_ROOT/icon-192.png"
          test -s "$SITE_ROOT/icon-512.png"
          test -s "$SITE_ROOT/qr-prompt-kit.png"
          test -s "$SITE_ROOT/prompt-kit/index.html"
          test -s "$SITE_ROOT/roster-log-v2/index.html"
          test -s "$SITE_ROOT/roster-log-v2/app.js"
          test -s "$SITE_ROOT/roster-log-v2/styles.css"
          cmp "$SITE_ROOT/prompt-kit/index.html" web/prompt-kit/index.html
          cmp "$SITE_ROOT/roster-log-v2/index.html" web/roster-log-v2/index.html
          cmp "$SITE_ROOT/roster-log-v2/app.js" web/roster-log-v2/app.js
          cmp "$SITE_ROOT/roster-log-v2/styles.css" web/roster-log-v2/styles.css
          (cd "$SITE_ROOT" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > Outputs/prompt-kit-pages-manifest.sha256
      - name: Write exact-candidate promotion receipt
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/write_prompt_kit_promotion_receipt.py --candidate "$CANDIDATE_SHA" --base "$BASE_SHA" --target github-pages --output Outputs/prompt-kit-promotion-receipt.json
      - name: Upload promotion evidence
        uses: actions/upload-artifact@v7
        with:
          name: prompt-kit-promotion-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            Outputs/prompt-kit-promotion-receipt.json
            Outputs/prompt-kit-pages-manifest.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/prompt-kit-pages

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

  post-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout deployed candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prove deployed canonical bytes
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "${PAGE_URL}prompt-kit/" --output deployed-prompt-kit.html
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "${PAGE_URL}roster-log-v2/" --output deployed-roster-v2.html
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "${PAGE_URL}roster-log-v2/app.js" --output deployed-roster-v2.js
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "${PAGE_URL}roster-log-v2/styles.css" --output deployed-roster-v2.css
          cmp deployed-prompt-kit.html web/prompt-kit/index.html
          cmp deployed-roster-v2.html web/roster-log-v2/index.html
          cmp deployed-roster-v2.js web/roster-log-v2/app.js
          cmp deployed-roster-v2.css web/roster-log-v2/styles.css
          echo "deployed_sha=${GITHUB_SHA}"
          echo "prompt_kit_url=${PAGE_URL}prompt-kit/"
          echo "roster_v2_url=${PAGE_URL}roster-log-v2/"
