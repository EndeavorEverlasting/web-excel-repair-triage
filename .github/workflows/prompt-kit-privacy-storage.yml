name: Prompt Kit privacy and storage contract

on:
  pull_request:
    paths:
      - docs/prompts.json
      - registry/prompts/**
      - harness/contracts/prompt-kit-cross-device-access.v1.json
      - scripts/build_prompt_kit_registry.py
      - scripts/validate_prompt_kit_privacy_storage.py
      - tests/test_prompt_kit_privacy_storage.py
      - docs/PROMPT_KIT_PRIVACY_STORAGE.md
      - web/prompt-kit-mobile/**
      - web/prompt-kit/**
      - web/prompt-kit-legacy-redirect/**
      - web/operant-legacy-redirect/**
      - web/roster-log-v2/**
      - .gitignore
      - .github/workflows/prompt-kit-pages.yml
      - .github/workflows/prompt-kit-privacy-storage.yml
  push:
    branches: [main]
    paths:
      - docs/prompts.json
      - registry/prompts/**
      - harness/contracts/prompt-kit-cross-device-access.v1.json
      - scripts/build_prompt_kit_registry.py
      - scripts/validate_prompt_kit_privacy_storage.py
      - tests/test_prompt_kit_privacy_storage.py
      - docs/PROMPT_KIT_PRIVACY_STORAGE.md
      - web/prompt-kit-mobile/**
      - web/prompt-kit/**
      - web/prompt-kit-legacy-redirect/**
      - web/operant-legacy-redirect/**
      - web/roster-log-v2/**
      - .gitignore
      - .github/workflows/prompt-kit-pages.yml
      - .github/workflows/prompt-kit-privacy-storage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify candidate and current main floor
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test -n "$(git rev-parse origin/main)"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git merge-base --is-ancestor origin/main HEAD
          fi
          echo "candidate sha=$(git rev-parse HEAD)"
          echo "main floor=$(git rev-parse origin/main)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate existing cross-device acquisition contract
        run: |
          python scripts/validate_prompt_kit_cross_device_access.py --summary
          python -m unittest tests.test_prompt_kit_cross_device_access -v

      - name: Validate privacy and storage boundaries
        run: |
          python scripts/validate_prompt_kit_privacy_storage.py --summary
          python -m unittest tests.test_prompt_kit_privacy_storage -v

      - name: Validate canonical Prompt Kit parity
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check

      - name: Validate patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            git diff --check "${{ github.event.before }}..HEAD"
          else
            git diff --check HEAD^..HEAD
          fi
