name: Prompt Kit profile and modality prototype

on:
  pull_request:
    paths:
      - docs/PROMPT_KIT_PROFILE_MODALITY_PROGRAM_DESIGN.md
      - docs/prompt-kit-profile-modality-prototype.js
      - docs/PROMPT_KIT_PROGRAM_ARCHITECTURE.md
      - docs/prompt-kit-program-prototype.js
      - docs/PROMPT_KIT_HOTKEY_PROGRAM_DESIGN.md
      - docs/prompt-kit-hotkey-prototype.js
      - docs/prompt-kit.js
      - docs/prompt-kit-polish.js
      - build_prompt_kit.py
      - web/README.md
      - web/prompt-kit/index.html
      - tests/test_prompt_kit_header_contract.py
      - tests/test_prompt_kit_profile_modality_prototype.py
      - tests/test_prompt_kit_program_prototype.py
      - tests/test_prompt_kit_hotkey_completion.py
      - .github/workflows/prompt-kit-profile-modality-prototype.yml
  push:
    branches: [main]
    paths:
      - docs/PROMPT_KIT_PROFILE_MODALITY_PROGRAM_DESIGN.md
      - docs/prompt-kit-profile-modality-prototype.js
      - docs/PROMPT_KIT_PROGRAM_ARCHITECTURE.md
      - docs/prompt-kit-program-prototype.js
      - docs/PROMPT_KIT_HOTKEY_PROGRAM_DESIGN.md
      - docs/prompt-kit-hotkey-prototype.js
      - docs/prompt-kit.js
      - docs/prompt-kit-polish.js
      - build_prompt_kit.py
      - web/README.md
      - web/prompt-kit/index.html
      - tests/test_prompt_kit_header_contract.py
      - tests/test_prompt_kit_profile_modality_prototype.py
      - tests/test_prompt_kit_program_prototype.py
      - tests/test_prompt_kit_hotkey_completion.py
      - .github/workflows/prompt-kit-profile-modality-prototype.yml

permissions:
  contents: write

jobs:
  profile-modality-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact candidate and current main floor
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test -n "$(git rev-parse origin/main)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git merge-base --is-ancestor origin/main HEAD
          fi
          echo "candidate sha=$(git rev-parse HEAD)"
          echo "main floor=$(git rev-parse origin/main)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply canonical header hotkey and user-profile repair
        if: github.event_name == 'pull_request'
        shell: python
        run: |
          from pathlib import Path

          builder_source = Path('build_prompt_kit.py').read_text(encoding='utf-8')
          polish_source = Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8')
          already_applied = (
              'data-profile="profile1"' in builder_source
              and "{key:'A',label:'All prompts'}" in polish_source
              and "{key:'D',label:'User Profile 2'}" in polish_source
          )

          if already_applied:
              print('canonical header/profile repair already present; validation-only pass')
          else:
              workflow = Path('.github/workflows/prompt-kit-profile-modality-review-repair.yml').read_text(encoding='utf-8')
              anchor = '      - name: Apply canonical header hotkey and user-profile repair\n'
              start = workflow.index(anchor) + len(anchor)
              start = workflow.index('        run: |\n', start) + len('        run: |\n')
              end = workflow.index('      - name: Regenerate canonical Prompt Kit artifact\n', start)
              lines = workflow[start:end].splitlines()
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
              namespace = {}
              try:
                  exec(compile(script, 'prompt-kit-header-repair.py', 'exec'), namespace)
              except SystemExit as exc:
                  expected = 'test_buffered_prompt_sequence_precedes_builtin_digit_dispatch'
                  if expected not in str(exc):
                      raise
                  path = Path('tests/test_prompt_kit_hotkey_completion.py')
                  text = path.read_text(encoding='utf-8')
                  if 'BASE_RUNTIME = ROOT / "docs" / "prompt-kit.js"' not in text:
                      text = text.replace(
                          'POLISH = ROOT / "docs" / "prompt-kit-polish.js"\n',
                          'POLISH = ROOT / "docs" / "prompt-kit-polish.js"\nBASE_RUNTIME = ROOT / "docs" / "prompt-kit.js"\n',
                          1,
                      )
                  function_start = text.index('    def test_buffered_prompt_sequence_precedes_builtin_digit_dispatch(self) -> None:\n')
                  function_end = text.index('\n    def test_executable_prototype_proves_success_failure_and_digit_collision_paths', function_start)
                  replacement = '''    def test_p111_digits_cannot_fall_through_to_header_navigation(self) -> None:
                      source = POLISH.read_text(encoding="utf-8")
                      base = BASE_RUNTIME.read_text(encoding="utf-8")
                      buffered = "if(promptShortcutBuffer&&handleConfiguredPromptShortcutKey(e,key))return;"
                      self.assertIn(buffered, source)
                      for digit in "12345":
                          self.assertNotIn(f"if(key==='{digit}')", source)
                          self.assertNotIn(f"case'{digit}'", base)
                      for header in ("if(key==='a')", "if(key==='s')", "if(key==='g')", "if(key==='v')", "if(key==='d')"):
                          self.assertIn(header, source)
                          self.assertLess(source.index(buffered), source.index(header))
                      self.assertIn("var escapeHelpPanel=document.getElementById('hotkeyHelpPanel');", source)
                      self.assertIn("if(key==='escape'&&escapeHelpPanel&&!escapeHelpPanel.hidden)", source)
                  '''
                  text = text[:function_start] + replacement + text[function_end:]
                  marker = '            "Save favorite prompt keyboard shortcut",\n'
                  if '            "User profiles",\n' not in text:
                      text = text.replace(
                          marker,
                          marker + '            "User profiles",\n            "User Profile 1",\n            "User Profile 2",\n            "hotkey-profile-choice",\n',
                          1,
                      )
                  path.write_text(text, encoding='utf-8')
                  remaining_start = script.index('# Human contract: explain that profiles replace only the obsolete top shortcuts;')
                  exec(compile(script[remaining_start:], 'prompt-kit-header-repair-readme.py', 'exec'), namespace)

              # Replace the whole generated builder-header assertion with semantic
              # source literals. This avoids false negatives from Python-string escaping.
              path = Path('tests/test_prompt_kit_header_contract.py')
              text = path.read_text(encoding='utf-8')
              function_start = text.index('def test_builder_header_replaces_obsolete_slots() -> None:\n')
              function_end = text.index('\n\ndef test_runtime_header_keys_are_single_letters_and_not_prompt_prefix', function_start)
              replacement = '''def test_builder_header_replaces_obsolete_slots() -> None:
                  source = BUILDER.read_text(encoding='utf-8')
                  start = source.index('<div class="cat-tabs">')
                  end = source.index("html.append('      </div>')", start)
                  region = source[start:end]
                  expected = [
                      ('data-cat="all"', 'All', 'A'),
                      ('data-cat="standard"', 'Standard', 'S'),
                      ('data-profile="profile1"', 'User Profile 1', 'G'),
                      ('data-profile="profile2"', 'User Profile 2', 'D'),
                  ]
                  positions = []
                  for marker, label, key in expected:
                      position = region.find(marker)
                      assert position >= 0, f'missing {label}'
                      positions.append(position)
                      assert f'>{label}<span class="kbd">{key}</span>' in region
                  assert positions == sorted(positions)
                  assert 'GNHF<span class="kbd">' not in region
                  assert 'Doctrine<span class="kbd">' not in region
                  assert not re.search(r'<span class="kbd">[1-5]</span>', region)
              '''
              text = text[:function_start] + replacement + text[function_end:]
              path.write_text(text, encoding='utf-8')

      - name: Regenerate canonical Prompt Kit artifact
        if: github.event_name == 'pull_request'
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Pass 1 targeted validation
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-polish.js
          node --check docs/prompt-kit-program-prototype.js
          node --check docs/prompt-kit-profile-modality-prototype.js
          node --check docs/prompt-kit-hotkey-prototype.js
          python tests/test_prompt_kit_header_contract.py
          python -m unittest tests.test_prompt_kit_hotkey_completion tests.test_prompt_kit_profile_modality_prototype tests.test_prompt_kit_program_prototype -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Pass 2 critique and broad Prompt Kit validation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq "case'[1-5]'|key==='[1-5]'" docs/prompt-kit.js docs/prompt-kit-polish.js
          grep -F "User Profile 1" web/prompt-kit/index.html >/dev/null
          grep -F "User Profile 2" web/prompt-kit/index.html >/dev/null
          grep -F "Favorites<span class=\"kbd\">V</span>" docs/prompt-kit-polish.js >/dev/null
          python -m unittest discover -s tests -p 'test_prompt_kit_*.py' -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Commit and push exact validated repair
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_prompt_kit.py docs/prompt-kit.js docs/prompt-kit-polish.js tests/test_prompt_kit_header_contract.py tests/test_prompt_kit_hotkey_completion.py web/README.md web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "validated source/artifact already committed; no mutation required"
            exit 0
          fi
          git commit -m "fix(prompt-kit): isolate prompt digits from header hotkeys"
          git push origin HEAD:design/prompt-kit-profile-modality-seams-20260824
