              '| existing `ShortcutRegistry` semantic owner | effective bindings for active profile | existing registry API over a profile-scoped store | collision/target policy and binding hydration remain in the canonical registry | existing ShortcutStore via profile namespace | existing hotkey contract | existing hotkey prototype + executable profile isolation/rehydration fixture |',
          )
          design = replace_exact(
              design,
              'The default profile Favorite set is untouched.\n\n## Failure call stacks',
              '''The default profile Favorite set is untouched.

## Success call stack — profile-scoped shortcut configuration and dispatch

```text
USER CONFIGURES SHORTCUT IN ACTIVE PROFILE
  -> existing ShortcutRegistry.configure(binding)
  -> profile-bound ShortcutStore.save(candidate)          [TRANSACTION BOUNDARY]
  -> canonical ShortcutRegistry publishes userBindings
  <- CONFIGURED

USER TYPES SHORTCUT
  -> existing ShortcutDispatcher
  -> ActiveShortcutRegistry selects canonical registry for ActiveProfile
  -> existing effective binding / sequence policy
  -> semantic prompt navigation/command target
```

Switching profiles selects another canonical `ShortcutRegistry` context hydrated from that profile's persisted bindings. Built-in collision rules remain shared; only durable user bindings are scoped.

## Failure call stacks''',
          )
          design = replace_exact(
              design,
              '### Async copy while user switches profile\n',
              '''### Profile-scoped shortcut persistence failure

```text
ShortcutRegistry.configure while work profile is active
  -> profile-bound ShortcutStore.save(work, candidate)
  -> PERSISTENCE_FAILED
  -> canonical ShortcutRegistry does not publish candidate
  -> work binding set remains prior truth
  -> default profile binding set remains untouched
```

### Async copy while user switches profile
''',
          )
          design = replace_exact(
              design,
              '- profile isolation;\n- unknown-profile rejection;',
              '- Favorite isolation and active-profile Favorite projection refresh;\n- shortcut isolation, persisted rehydration, and persistence-failure isolation through the existing `ShortcutRegistry`;\n- unknown-profile rejection;',
          )
          design = replace_exact(
              design,
              '9. **Keep semantic traces privacy-bounded.** Profile attribution uses an opaque initiating ID only; display names and prompt bodies remain outside trace payloads.\n\nNo safer bounded design improvement remains',
              '''9. **Keep semantic traces privacy-bounded.** Profile attribution uses an opaque initiating ID only; display names and prompt bodies remain outside trace payloads.
10. **Do not prototype a second Favorite authority.** Review correctly found that `ProfiledFavoritePreferences` duplicated canonical set semantics. The repair replaces it with `FavoritePreferenceContexts`, which only selects a profile-bound store and instantiates the already-merged `FavoritePreferences` owner.
11. **A scoped-storage claim needs an executable ShortcutRegistry path.** Running the hotkey prototype beside this prototype was insufficient proof. The repaired slice exercises the existing `ShortcutRegistry` and `ShortcutDispatcher` across profile configuration, switching, rehydration, and failed persistence.
12. **Profile activation must refresh preference projection before success.** Merely changing `ActiveProfile` can leave stale stars on screen. `ACTIVATE_PROFILE` now loads the target profile through the canonical Favorite owner and replaces the active Favorite projection before returning `PROFILE_ACTIVE`.

No safer bounded design improvement remains''',
          )
          design = replace_exact(
