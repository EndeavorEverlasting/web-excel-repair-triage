          test = replace_exact(
              test,
              '        self.assertEqual(report["journeys"]["profileFavoriteIsolation"], "PASS")\n        self.assertEqual(report["journeys"]["profilePersistenceFailureIsolation"], "PASS")',
              '        self.assertEqual(report["journeys"]["profileFavoriteIsolation"], "PASS")\n        self.assertEqual(report["journeys"]["profileFavoriteProjectionRefresh"], "PASS")\n        self.assertEqual(report["journeys"]["profileShortcutIsolation"], "PASS")\n        self.assertEqual(report["journeys"]["profileShortcutRehydration"], "PASS")\n        self.assertEqual(report["journeys"]["profileShortcutPersistenceFailure"], "PASS")\n        self.assertEqual(report["journeys"]["profilePersistenceFailureIsolation"], "PASS")',
          )
          test_path.write_text(test, encoding='utf-8')

          design_path = Path('docs/PROMPT_KIT_PROFILE_MODALITY_PROGRAM_DESIGN.md')
          design = design_path.read_text(encoding='utf-8')
          design = replace_exact(
              design,
              '- **ProfiledFavoritePreferences** — prototype proof that the existing Favorite semantic owner can operate over a profile-scoped persistence port without becoming a second Favorite system.',
              '- **FavoritePreferenceContexts** — profile selector that binds the existing canonical `FavoritePreferences` owner to a profile-scoped store; it owns no Favorite-set semantics itself.',
          )
          design = replace_exact(
