name: Prompt Kit profile modality second-pass repair

on:
  pull_request:
    paths:
      - .github/workflows/prompt-kit-profile-modality-review-repair.yml
      - docs/PROMPT_KIT_PROFILE_MODALITY_PROGRAM_DESIGN.md
      - docs/prompt-kit-profile-modality-prototype.js
      - tests/test_prompt_kit_profile_modality_prototype.py

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'design/prompt-kit-profile-modality-seams-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply bounded second-pass repair
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, expected: int = 1) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} copies of {old!r}, observed {count}')
              return text.replace(old, new)

          prototype_path = Path('docs/prompt-kit-profile-modality-prototype.js')
          prototype = prototype_path.read_text(encoding='utf-8')
          prototype = replace_exact(
              prototype,
              "class MemoryProfilePreferenceStore {\n  constructor(trace, {\n    legacyFavorites = ['P07'],\n    profileFavorites = {work: ['P95']},\n    failProfileIds = [],\n  } = {}) {",
              "class MemoryProfilePreferenceStore {\n  constructor(trace, {\n    legacyFavorites = ['P07'],\n    profileFavorites = {work: ['P95']},\n    failProfileIds = [],\n    defaultProfileId = 'default',\n  } = {}) {",
          )
          prototype = replace_exact(
              prototype,
              "    this.trace = trace;\n    this.legacyFavorites = [...legacyFavorites].sort();",
              "    this.trace = trace;\n    if (typeof defaultProfileId !== 'string' || !defaultProfileId.trim()) {\n      throw new PromptKitProgramError('INVALID_DEFAULT_PROFILE_ID', 'Profile preference storage requires the catalog default profile id.');\n    }\n    this.defaultProfileId = defaultProfileId;\n    this.legacyFavorites = [...legacyFavorites].sort();",
          )
          prototype = replace_exact(
              prototype,
              "    return profileId === 'default' ? 'legacy-default-slot' : `named-profile:${profileId}`;",
              "    return profileId === this.defaultProfileId ? 'legacy-default-slot' : `named-profile:${profileId}`;",
          )
          prototype = replace_exact(
              prototype,
              "    const favorites = profileId === 'default'\n      ? this.legacyFavorites",
              "    const favorites = profileId === this.defaultProfileId\n      ? this.legacyFavorites",
          )
          prototype = replace_exact(
              prototype,
              "    if (profileId === 'default') {\n      this.legacyFavorites = [...next];",
              "    if (profileId === this.defaultProfileId) {\n      this.legacyFavorites = [...next];",
          )
          prototype = replace_exact(
              prototype,
              "  const preferenceStore = new MemoryProfilePreferenceStore(trace, {\n    legacyFavorites,\n    profileFavorites,\n    failProfileIds,\n  });",
              "  const preferenceStore = new MemoryProfilePreferenceStore(trace, {\n    legacyFavorites,\n    profileFavorites,\n    failProfileIds,\n    defaultProfileId: profileCatalog.defaultProfile().id,\n  });",
          )
          prototype = replace_exact(
              prototype,
              "    profiles: [{id: 'default', name: 'Default', isDefault: true}],",
              "    profiles: [{id: 'solo', name: 'Default', isDefault: true}],",
          )
          prototype = replace_exact(
              prototype,
              "  assert(pointerCopy.profileId === 'default', 'single-profile pointer command uses implicit default profile');",
              "  assert(pointerCopy.profileId === 'solo', 'single-profile pointer command uses the catalog-defined default profile identity');",
          )
          prototype = replace_exact(
              prototype,
              "  assert(!Object.prototype.hasOwnProperty.call(singleProfile.preferenceStore.profileFavorites, 'default'), 'default profile does not invent a named-profile storage slot');",
              "  assert(singleProfile.preferenceStore.storageSlot('solo') === 'legacy-default-slot', 'catalog-defined default profile uses the legacy compatibility slot');\n  assert(!Object.prototype.hasOwnProperty.call(singleProfile.preferenceStore.profileFavorites, 'solo'), 'default profile does not invent a named-profile storage slot');",
          )
          prototype_path.write_text(prototype, encoding='utf-8')

          test_path = Path('tests/test_prompt_kit_profile_modality_prototype.py')
          test = test_path.read_text(encoding='utf-8')
          test = replace_exact(
              test,
              '        self.assertIn("PROFILE_PREFERENCE_PERSISTENCE_FAILED", text)\n',
              '        self.assertIn("PROFILE_PREFERENCE_PERSISTENCE_FAILED", text)\n        self.assertIn("defaultProfileId: profileCatalog.defaultProfile().id", text)\n        self.assertNotIn("return profileId === \'default\' ?", text)\n        self.assertNotIn("const favorites = profileId === \'default\'", text)\n        self.assertNotIn("if (profileId === \'default\') {", text)\n',
          )
          test_path.write_text(test, encoding='utf-8')

          design_path = Path('docs/PROMPT_KIT_PROFILE_MODALITY_PROGRAM_DESIGN.md')
          design = design_path.read_text(encoding='utf-8')
          design = replace_exact(
              design,
              '- The application exposes an implicit `default` Prompt Profile.',
              '- The application exposes one implicit default Prompt Profile; defaultness is catalog metadata, not a magic profile ID.',
          )
          design = replace_exact(
              design,
              '9. **Default profile is a compatibility boundary.** Production may map the default profile to today\'s existing storage keys; named profiles may use namespaced records. The prototype does not invent new production key names.',
              '9. **Default profile is a compatibility boundary, not a magic ID.** Production may map whichever profile `ProfileCatalog` marks default to today\'s existing storage keys; named profiles may use namespaced records. The prototype does not invent new production key names.',
          )
          design = replace_exact(
              design,
              '13. **Presentation differences stay at the presentation seam.** Focus/scroll/reveal policy may inspect interaction context; clipboard, persistence, catalog validation, and completion semantics may not fork by modality.',
              '13. **Presentation differences stay at the presentation seam.** Focus/scroll/reveal policy may inspect interaction context; clipboard, persistence, catalog validation, and completion semantics may not fork by modality.\n14. **Profile attribution is privacy-bounded.** If semantic usage is enabled, traces/events carry only the initiating opaque profile ID plus semantic action metadata; they do not record profile display names or prompt bodies.',
          )
          design = replace_exact(
              design,
              '7. **Do not persist last active profile yet.** Session-only activation is sufficient to prove architecture; durable resume semantics need an explicit product decision.\n\nNo safer bounded design improvement remains',
              '7. **Do not persist last active profile yet.** Session-only activation is sufficient to prove architecture; durable resume semantics need an explicit product decision.\n8. **Green tests exposed a hidden default-ID coupling on review.** The first executable fake treated `isDefault` as catalog metadata but independently hard-coded the literal ID `default` in storage. The second pass removed that split-brain assumption: `ProfileCatalog.defaultProfile().id` now configures the compatibility store, and the executable one-profile journey uses `solo` to prove the role is not tied to a magic identifier.\n9. **Keep semantic traces privacy-bounded.** Profile attribution uses an opaque initiating ID only; display names and prompt bodies remain outside trace payloads.\n\nNo safer bounded design improvement remains',
          )
          design_path.write_text(design, encoding='utf-8')

      - name: Prove repaired executable seams
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/prompt-kit-profile-modality-prototype.js
          node docs/prompt-kit-profile-modality-prototype.js >/tmp/prompt-kit-profile-modality-report.json
          python -m unittest tests.test_prompt_kit_profile_modality_prototype -v
          python -m unittest tests.test_prompt_kit_program_prototype tests.test_prompt_kit_hotkey_completion -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Commit durable second-pass repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROMPT_KIT_PROFILE_MODALITY_PROGRAM_DESIGN.md docs/prompt-kit-profile-modality-prototype.js tests/test_prompt_kit_profile_modality_prototype.py
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "docs/PROMPT_KIT_PROFILE_MODALITY_PROGRAM_DESIGN.md docs/prompt-kit-profile-modality-prototype.js tests/test_prompt_kit_profile_modality_prototype.py "
          git commit -m 'docs(prompt-kit): close profile architecture review gap'
          git push origin HEAD:design/prompt-kit-profile-modality-seams-20260824
