name: Prompt Kit public mainline convergence

on:
  push:
    branches:
      - fix/prompt-kit-public-mainline-72-20260811

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-kit-public-mainline-72-20260811
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and merge exact stacked head
        shell: bash
        env:
          STACK_BRANCH: feat/prompt-kit-ai-engineering-level-up-20260811
          STACK_SHA: 8d49281a35f722602f84c446f19d86b9fd336455
          MAIN_BASE: 13b2955454a23b0f264b106f9798da08f5f420a0
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$MAIN_BASE" HEAD
          git fetch --no-force origin "refs/heads/${STACK_BRANCH}:refs/remotes/origin/${STACK_BRANCH}"
          actual="$(git rev-parse "refs/remotes/origin/${STACK_BRANCH}")"
          test "$actual" = "$STACK_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit "$STACK_SHA"
      - name: Repair stack review findings and root harness registration
        run: |
          python scripts/_converge_prompt_kit_public_mainline.py
          python scripts/_sync_prompt_kit_root_harness.py
          python scripts/_finish_prompt_kit_root_sync.py
      - name: Rebuild canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate converged Prompt Kit and harness
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile build_prompt_kit.py scripts/build_prompt_kit_registry.py scripts/validate_prompt_kit_layout_harness.py scripts/validate_harness.py tests/test_prompt_kit_mainline_delivery.py tests/test_ai_engineering_level_up.py
          python -m json.tool registry/prompts/ai-engineering-level-up-prompts.v1.json >/dev/null
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_prompt_kit_mainline_delivery tests.test_prompt_kit_layout_harness tests.test_skill_prompt_registry tests.test_ai_engineering_level_up -v
          python scripts/validate_prompt_kit_layout_harness.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python tests/test_prompt_kit_header_contract.py
          python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
          python -m unittest tests.test_harness_contract -v
          python -m triage.gitignore_hygiene
          git diff --check
          python -c "from pathlib import Path; h=Path('web/prompt-kit/index.html').read_text(encoding='utf-8'); missing=[x for x in ('P67','P68','P69','P70','P71','Production AI Engineering Doctrine','Repeated Friction') if x not in h]; assert not missing, missing"
      - name: Commit final mainline convergence
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/prompt-kit-public-mainline-temporary.yml scripts/_converge_prompt_kit_public_mainline.py scripts/_sync_prompt_kit_root_harness.py scripts/_finish_prompt_kit_root_sync.py
          git add -A
          git diff --cached --check
          git status --short
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No convergence diff produced'
            exit 1
          fi
          git commit -m 'fix(prompt-kit): publish current registry to mainline website'
          git push origin HEAD:fix/prompt-kit-public-mainline-72-20260811
