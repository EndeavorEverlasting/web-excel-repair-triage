name: Temporary canonical Prompt Kit regeneration artifact

on:
  pull_request:
    paths:
      - '.github/workflows/prompt-kit-regenerate-artifact.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build canonical Prompt Kit through registered generator
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Commit generator-owned artifact to PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/index.html
          if git diff --cached --quiet; then
            echo "Canonical generated site already current"
            exit 0
          fi
          git commit -m "chore(prompt-kit): regenerate canonical site"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
