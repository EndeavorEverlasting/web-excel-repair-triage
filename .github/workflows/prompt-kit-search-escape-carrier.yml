name: Prompt Kit search Escape repair carrier

on:
  push:
    branches:
      - fix/prompt-kit-search-escape-20260905

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Apply bounded runtime and regression repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          polish_path = Path('docs/prompt-kit-polish.js')
          polish = polish_path.read_text(encoding='utf-8')

          helper_marker = "\nfunction installCompactBrowsingHotkeys(){"
          helper = """
          function exitFocusedSearch(search){
            if(!search)return false;
            var changed=search.value!=='';
            search.value='';
            var clear=document.getElementById('searchClear');
            if(clear)clear.style.display='none';
            if(changed)render();
            try{search.blur()}catch(e){}
            return true
          }
          """
          if polish.count(helper_marker) != 1:
              raise SystemExit('Prompt Kit hotkey install marker is missing or non-unique; refusing stale patch')
          if 'function exitFocusedSearch(search)' in polish:
              raise SystemExit('Search Escape helper already exists; carrier is stale')
          polish = polish.replace(helper_marker, '\n' + helper + helper_marker, 1)

          editable_guard = "    if(editable)return;"
          search_guard = """    var search=document.getElementById('search');
            if(key==='escape'&&search&&target===search){
              e.preventDefault();e.stopImmediatePropagation();resetPromptShortcutBuffer();exitFocusedSearch(search);return
            }
          """
          if polish.count(editable_guard) != 1:
              raise SystemExit('Expected editable hotkey guard is missing or non-unique; refusing stale patch')
          polish = polish.replace(editable_guard, search_guard + editable_guard, 1)
          polish_path.write_text(polish, encoding='utf-8')

          test_path = Path('tests/test_prompt_kit_hotkey_completion.py')
          tests = test_path.read_text(encoding='utf-8')
          next_test = "    def test_hotkey_open_focuses_favorite_input_and_escape_recovers_from_editable(self) -> None:\n"
          regression = '''    def test_escape_clears_and_releases_focused_search_before_editable_guard(self) -> None:\n        source = POLISH.read_text(encoding="utf-8")\n        deployed = DEPLOYED.read_text(encoding="utf-8")\n        markers = (\n            "function exitFocusedSearch(search)",\n            "var changed=search.value!=='';",\n            "search.value='';",\n            "var clear=document.getElementById('searchClear');",\n            "if(clear)clear.style.display='none';",\n            "if(changed)render();",\n            "search.blur()",\n            "var search=document.getElementById('search');",\n            "if(key==='escape'&&search&&target===search)",\n            "resetPromptShortcutBuffer();exitFocusedSearch(search);return",\n        )\n        for marker in markers:\n            self.assertIn(marker, source)\n            self.assertIn(marker, deployed)\n        self.assertLess(\n            source.index("if(key==='escape'&&search&&target===search)"),\n            source.index("if(editable)return;"),\n        )\n\n'''
          if tests.count(next_test) != 1:
              raise SystemExit('Expected hotkey regression insertion point is missing or non-unique; refusing stale patch')
          if 'test_escape_clears_and_releases_focused_search_before_editable_guard' in tests:
              raise SystemExit('Search Escape regression already exists; carrier is stale')
          tests = tests.replace(next_test, regression + next_test, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Rebuild canonical Prompt Kit website
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Validate pass 1 targeted behavior
        run: |
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_hotkey_completion tests.test_prompt_kit_header_contract tests.test_prompt_kit_filtering_access -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Deliberate second-pass review and broader Prompt Kit proof
        run: |
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_interactions_contract tests.test_prompt_kit_product_interactions -v
          python - <<'PY'
          from pathlib import Path
          source = Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8')
          deployed = Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          guard = "if(key==='escape'&&search&&target===search)"
          editable = "if(editable)return;"
          assert source.count('function exitFocusedSearch(search)') == 1
          assert deployed.count('function exitFocusedSearch(search)') == 1
          assert source.index(guard) < source.index(editable)
          assert deployed.index(guard) < deployed.index(editable)
          assert "if(key==='f'){e.preventDefault();e.stopImmediatePropagation();toggleCompactFilters();return}" in source
          assert "if(/^[a-e]$/.test(key)&&window.PromptKitProfiles" in source
          print('SEARCH_ESCAPE_SECOND_PASS=PASS')
          PY
          git diff --check

      - name: Commit durable bounded change and remove carrier
        shell: bash
        run: |
          git rm .github/workflows/prompt-kit-search-escape-carrier.yml
          git status --short
          git diff --stat
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prompt-kit-polish.js tests/test_prompt_kit_hotkey_completion.py web/prompt-kit/index.html
          git commit -m "fix(prompt-kit): let Escape exit focused search"
          git push origin HEAD:fix/prompt-kit-search-escape-20260905
