name: Prompt Kit search Escape polish carrier

on:
  push:
    branches:
      - fix/prompt-kit-search-escape-20260905

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Normalize owned hotkey block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/prompt-kit-polish.js')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"^[ \t]*var search=document\.getElementById\('search'\);\n"
              r"^[ \t]*if\(key==='escape'&&search&&target===search\)\{\n"
              r"^[ \t]*e\.preventDefault\(\);e\.stopImmediatePropagation\(\);resetPromptShortcutBuffer\(\);exitFocusedSearch\(search\);return\n"
              r"^[ \t]*\}\n"
              r"^[ \t]*if\(editable\)return;",
              re.MULTILINE,
          )
          normalized = (
              "    var search=document.getElementById('search');\n"
              "    if(key==='escape'&&search&&target===search){\n"
              "      e.preventDefault();e.stopImmediatePropagation();resetPromptShortcutBuffer();exitFocusedSearch(search);return\n"
              "    }\n"
              "    if(editable)return;"
          )
          text, count = pattern.subn(normalized, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one focused-search Escape block, replaced {count}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Rebuild and validate exact polished source
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_hotkey_completion tests.test_prompt_kit_header_contract tests.test_prompt_kit_filtering_access tests.test_prompt_kit_interactions_contract tests.test_prompt_kit_product_interactions -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_prompt_kit_discovery.py --summary
          python - <<'PY'
          from pathlib import Path
          src = Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8')
          deployed = Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          expected = (
              "    var search=document.getElementById('search');\n"
              "    if(key==='escape'&&search&&target===search){\n"
              "      e.preventDefault();e.stopImmediatePropagation();resetPromptShortcutBuffer();exitFocusedSearch(search);return\n"
              "    }\n"
              "    if(editable)return;"
          )
          assert expected in src
          assert expected in deployed
          assert src.count('function exitFocusedSearch(search)') == 1
          assert deployed.count('function exitFocusedSearch(search)') == 1
          print('SEARCH_ESCAPE_FORMAT_REVIEW=PASS')
          PY
          git diff --check

      - name: Commit polished durable change and remove carrier
        run: |
          git rm .github/workflows/prompt-kit-search-escape-polish-carrier.yml
          git status --short
          git diff --stat
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prompt-kit-polish.js tests/test_prompt_kit_hotkey_completion.py web/prompt-kit/index.html
          git commit -m "style(prompt-kit): align search Escape hotkey guard"
          git push origin HEAD:fix/prompt-kit-search-escape-20260905
