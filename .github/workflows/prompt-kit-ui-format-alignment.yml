name: Prompt Kit UI format alignment

on:
  pull_request:
    paths:
      - 'docs/prompt-kit*.js'
      - 'build_prompt_kit.py'
      - 'web/prompt-kit/index.html'
      - 'harness/contracts/prompt-kit-ui-format-alignment.v1.json'
      - 'harness/prompt-kit-ui-format-alignment/**'
      - 'scripts/validate_prompt_kit_ui_format_alignment.py'
      - 'tests/test_prompt_kit_ui_format_alignment.py'
      - 'tests/test_prompt_kit_storage_lifecycle_runtime.py'
      - '.github/workflows/prompt-kit-ui-format-alignment.yml'
  push:
    branches: [main]
    paths:
      - 'docs/prompt-kit*.js'
      - 'build_prompt_kit.py'
      - 'web/prompt-kit/index.html'
      - 'harness/contracts/prompt-kit-ui-format-alignment.v1.json'
      - 'harness/prompt-kit-ui-format-alignment/**'
      - 'scripts/validate_prompt_kit_ui_format_alignment.py'
      - 'tests/test_prompt_kit_ui_format_alignment.py'
      - 'tests/test_prompt_kit_storage_lifecycle_runtime.py'
      - '.github/workflows/prompt-kit-ui-format-alignment.yml'

jobs:
  ui-format-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile alignment surfaces
        run: python -m py_compile scripts/validate_prompt_kit_ui_format_alignment.py tests/test_prompt_kit_ui_format_alignment.py
      - name: Validate UI format alignment
        run: python scripts/validate_prompt_kit_ui_format_alignment.py --summary
      - name: Alignment contract tests
        run: python -m unittest tests.test_prompt_kit_ui_format_alignment -v
      - name: Protected storage lifecycle runtime
        run: python -m unittest tests.test_prompt_kit_storage_lifecycle_runtime -v
      - name: Protected header contract
        run: python tests/test_prompt_kit_header_contract.py
      - name: Generated site parity
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Upload alignment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-kit-ui-format-alignment-report
          path: Outputs/prompt-kit-ui-format-alignment.json
