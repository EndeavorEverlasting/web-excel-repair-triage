name: Prompt Kit urgency recovery integration

on:
  push:
    branches:
      - feat/prompt-kit-repeated-urgency-recovery-20260811

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-repeated-urgency-recovery-20260811
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate recurring urgency recovery
        run: python scripts/_integrate_prompt_kit_urgency_recovery.py
      - name: Build canonical Prompt Kit and validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile build_prompt_kit.py scripts/build_prompt_kit_registry.py tests/test_skill_prompt_registry.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_skill_prompt_registry -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python tests/test_prompt_kit_header_contract.py
          python -m triage.gitignore_hygiene
          git diff --check
      - name: Commit registry, references, tests, and generated website
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/prompt-kit-urgency-recovery-temporary.yml scripts/_integrate_prompt_kit_urgency_recovery.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/prompts/prompt-overrides.v1.json registry/prompts/prompt-display-order.v1.json docs/reference.json docs/prompt-kit-guided-recommendations.js build_prompt_kit.py tests/test_skill_prompt_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No sprint diff produced'
            exit 1
          fi
          git commit -m 'feat(prompt-kit): recover repeated urgency into execution'
          git push origin HEAD:feat/prompt-kit-repeated-urgency-recovery-20260811
