name: Prompt Kit web contracts

on:
  pull_request:
    paths:
      - PROMPT_KIT_ACCESS.md
      - build_prompt_kit.py
      - scripts/build_prompt_kit_registry.py
      - scripts/validate_prompt_kit_interactions.py
      - registry/prompts/skill-development-prompts.v1.json
      - docs/prompt-kit.js
      - docs/prompts.json
      - docs/reference.json
      - harness/contracts/prompt-kit-interactions.v1.json
      - harness/contracts/prompt-kit-filtering.v1.json
      - web/prompt-kit/index.html
      - web/README.md
      - tests/test_prompt_kit_header_contract.py
      - tests/test_prompt_kit_product_interactions.py
      - tests/test_prompt_kit_filtering_access.py
      - tests/test_skill_prompt_registry.py
      - .github/workflows/prompt-kit-web.yml
  push:
    branches: [main]
    paths:
      - PROMPT_KIT_ACCESS.md
      - build_prompt_kit.py
      - scripts/build_prompt_kit_registry.py
      - scripts/validate_prompt_kit_interactions.py
      - registry/prompts/skill-development-prompts.v1.json
      - docs/prompt-kit.js
      - docs/prompts.json
      - docs/reference.json
      - harness/contracts/prompt-kit-interactions.v1.json
      - harness/contracts/prompt-kit-filtering.v1.json
      - web/prompt-kit/index.html
      - web/README.md
      - tests/test_prompt_kit_header_contract.py
      - tests/test_prompt_kit_product_interactions.py
      - tests/test_prompt_kit_filtering_access.py
      - tests/test_skill_prompt_registry.py
      - .github/workflows/prompt-kit-web.yml

# Temporary bounded permission for one exact generated-artifact transaction.
# Final head restores `contents: read`; no branch push occurs here.
permissions:
  contents: write

jobs:
  prompt-kit-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize Prompt Kit JS EOF in working copy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/prompt-kit.js')
          path.write_text(path.read_text(encoding='utf-8').rstrip('\n') + '\n', encoding='utf-8')
          PY
      - name: Compile website builders and contracts
        run: |
          python -m py_compile \
            build_prompt_kit.py \
            scripts/build_prompt_kit_registry.py \
            scripts/validate_prompt_kit_interactions.py \
            tests/test_prompt_kit_header_contract.py \
            tests/test_prompt_kit_product_interactions.py \
            tests/test_prompt_kit_filtering_access.py \
            tests/test_skill_prompt_registry.py
      - name: Validate Prompt Kit JavaScript syntax
        run: node --check docs/prompt-kit.js
      - name: Validate strict interaction implementation contract
        run: python scripts/validate_prompt_kit_interactions.py --require-implementation --output "$RUNNER_TEMP/prompt-kit-interaction-audit.json" --summary
      - name: Build current Prompt Kit preview
        run: |
          mkdir -p "$RUNNER_TEMP/prompt-kit"
          python scripts/build_prompt_kit_registry.py --output "$RUNNER_TEMP/prompt-kit/index.html"
      - name: Publish corrected source and generated site as unattached Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          def publish(label, path):
              payload = {
                  'content': base64.b64encode(Path(path).read_bytes()).decode('ascii'),
                  'encoding': 'base64',
              }
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
                  data=json.dumps(payload).encode('utf-8'),
                  method='POST',
                  headers={
                      'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'prompt-kit-generated-blob-publisher',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  result = json.load(response)
              print(f"{label}={result['sha']}")

          publish('FINAL_JS_BLOB_SHA', 'docs/prompt-kit.js')
          publish('FINAL_HTML_BLOB_SHA', Path(os.environ['RUNNER_TEMP'], 'prompt-kit', 'index.html'))
          PY
      - name: Upload current Prompt Kit preview
        uses: actions/upload-artifact@v4
        with:
          name: prompt-kit-current-preview
          path: ${{ runner.temp }}/prompt-kit/index.html
          if-no-files-found: error
      - name: Validate Prompt Kit product interactions, filtering, and access
        run: |
          python -m unittest tests.test_prompt_kit_product_interactions -v
          python -m unittest tests.test_prompt_kit_filtering_access -v
      - name: Validate exact deployed website
        run: |
          python tests/test_prompt_kit_header_contract.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
