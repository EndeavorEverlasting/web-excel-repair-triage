name: Prompt Kit web contracts

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  p07-mainline-sync:
    if: github.head_ref == 'feat/green-branch-integration-default-20260808' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/green-branch-integration-default-20260808
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade stale injected actionability appendices
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/build_prompt_kit_registry.py')
          text = path.read_text(encoding='utf-8')
          old = '''    marker = str(policy["marker"])
    appendix = str(policy["copy_content_appendix"]).strip()
    if marker not in copy_content:
        strengthened["copyContent"] = f"{copy_content}\\n\\n{appendix}"

    strengthened["actionabilityPolicy"] = str(policy["policy_id"])
'''
          new = '''    marker = str(policy["marker"])
    appendix = str(policy["copy_content_appendix"]).strip()
    integration_marker = str(policy.get("integration_marker", "")).strip()
    has_current_integration = not integration_marker or integration_marker in copy_content
    if marker not in copy_content:
        strengthened["copyContent"] = f"{copy_content}\\n\\n{appendix}"
    elif not has_current_integration:
        legacy_prefix = f"{marker}\\n- Do not leave NEXT COMMAND"
        legacy_start = copy_content.rfind(legacy_prefix)
        if legacy_start >= 0:
            base_content = copy_content[:legacy_start].rstrip()
            strengthened["copyContent"] = (
                f"{base_content}\\n\\n{appendix}" if base_content else appendix
            )
        else:
            strengthened["copyContent"] = f"{copy_content}\\n\\n{appendix}"

    strengthened["actionabilityPolicy"] = str(policy["policy_id"])
'''
          if old not in text:
              raise SystemExit('apply_actionability_policy patch anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Build canonical Prompt Kit and prove P7 convergence policy
        run: |
          python -m py_compile scripts/build_prompt_kit_registry.py tests/test_green_branch_integration_policy.py tests/test_prompt_kit_header_contract.py
          python -m json.tool registry/prompts/actionable-next-step-policy.v1.json >/dev/null
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_green_branch_integration_policy -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python tests/test_prompt_kit_header_contract.py
          git diff --check
      - name: Restore normal workflow and commit durable policy upgrade
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/prompt-kit-web.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/prompt-kit-web.yml scripts/build_prompt_kit_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): propagate current mainline convergence policy'
          git push origin HEAD:feat/green-branch-integration-default-20260808
