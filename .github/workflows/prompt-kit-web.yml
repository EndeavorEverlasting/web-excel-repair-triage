permissions:
  contents: read

jobs:
  prompt-kit-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile website builders and contracts
        run: |
          python -m py_compile \
            build_prompt_kit.py \
            scripts/build_prompt_kit_registry.py \
            scripts/serve_prompt_kit_portable.py \
            scripts/validate_prompt_kit_interactions.py \
            scripts/validate_prompt_kit_discovery.py \
            scripts/validate_prompt_kit_order_navigation.py \
            scripts/validate_prompt_kit_portability.py \
            triage/prompt_library_portability.py \
            tests/test_prompt_kit_header_contract.py \
            tests/test_prompt_kit_product_interactions.py \
            tests/test_prompt_kit_filtering_access.py \
            tests/test_prompt_kit_mobile.py \
            tests/test_prompt_kit_discovery.py \
            tests/test_prompt_kit_guidance.py \
            tests/test_prompt_kit_order_navigation_contract.py \
            tests/test_prompt_kit_order_navigation_product.py \
            tests/test_prompt_kit_portability.py \
            tests/test_prompt_kit_portability_regressions.py \
            tests/test_prompt_kit_portable_health.py \
            tests/test_prompt_library_portability.py \
            tests/test_skill_prompt_registry.py \
            tests/test_repository_work_ledger_prompt.py \
            tests/test_correspondence_prompt_registry.py
      - name: Validate Prompt Kit JavaScript syntax
        run: |
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-guided-recommendations.js
          node --check docs/prompt-kit-journey.js
          node --check docs/prompt-kit-polish.js
          node --check docs/prompt-kit-correspondence.js
          node --check docs/prompt-kit-favorites-portability.js
      - name: Validate acquisition and portable PowerShell syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content -Raw scripts/Acquire-LatestPromptKit.ps1))
          $null = [scriptblock]::Create((Get-Content -Raw scripts/Open-LatestPromptKitPortable.ps1))
      - name: Reproduce empty-list path insertion
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile('scripts/Acquire-LatestPromptKit.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors -join '; ') }
          $fn = $ast.Find({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Add-UniquePath' }, $true)
          if (-not $fn) { throw 'Add-UniquePath not found' }
          Invoke-Expression $fn.Extent.Text
          $paths = [System.Collections.Generic.List[string]]::new()
          $expected = [System.IO.Path]::GetFullPath((Join-Path ([System.IO.Path]::GetTempPath()) 'prompt-kit-dev'))
          Add-UniquePath -Paths $paths -Path $expected
          if ($paths.Count -ne 1 -or $paths[0] -ne $expected) { throw 'empty-list path insertion did not resolve correctly' }
          Write-Host 'Add-UniquePath empty-list regression: PASS'
      - name: Validate deterministic quick-open path
        shell: pwsh
        run: ./tests/Test-PromptKitQuickOpenPathResolution.ps1
      - name: Validate strict interaction implementation contract
        run: python scripts/validate_prompt_kit_interactions.py --require-implementation --output "$RUNNER_TEMP/prompt-kit-interaction-audit.json" --summary
      - name: Build current Prompt Kit preview
        run: |
          mkdir -p "$RUNNER_TEMP/prompt-kit"
          python scripts/build_prompt_kit_registry.py --output "$RUNNER_TEMP/prompt-kit/index.html"
      - name: Upload current Prompt Kit preview
        uses: actions/upload-artifact@v4
        with:
          name: prompt-kit-current-preview
          path: ${{ runner.temp }}/prompt-kit/index.html
          if-no-files-found: error
      - name: Build portable Prompt Kit runtime artifact
        run: |
          python scripts/serve_prompt_kit_portable.py --build-only
          test -f Outputs/prompt-kit-portable/index.html
          test -f Outputs/prompt-kit-portable/manifest.json
      - name: Validate portable Favorites and harness discipline
        run: |
          python scripts/validate_prompt_kit_portability.py \
            --require-artifact \
            --output Outputs/prompt-kit-portability-validation.json \
            --summary
          python -m unittest \
            tests.test_prompt_kit_portability \
            tests.test_prompt_kit_portability_regressions \
            tests.test_prompt_kit_portable_health \
            -v
      - name: Validate Prompt Library portability contract
        run: python -m unittest tests.test_prompt_library_portability -v
      - name: Upload portable Prompt Kit runtime proof
        uses: actions/upload-artifact@v4
        with:
          name: prompt-kit-portable-runtime
          path: |
            Outputs/prompt-kit-portable/index.html
            Outputs/prompt-kit-portable/manifest.json
            Outputs/prompt-kit-portability-validation.json
          if-no-files-found: error
      - name: Validate search favorites tutorial journey and polish contract
        run: |
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_kit_guidance -v
      - name: Validate combined prompt registry
        run: |
          python -m unittest tests.test_skill_prompt_registry -v
          python -m unittest tests.test_repository_work_ledger_prompt -v
          python -m unittest tests.test_correspondence_prompt_registry -v
      - name: Validate chronological ordering and dense navigation
        run: |
          python -m unittest \
            tests.test_prompt_kit_order_navigation_contract \
            tests.test_prompt_kit_order_navigation_product \
            -v
          python scripts/validate_prompt_kit_order_navigation.py \
            --require-implementation \
            --output "$RUNNER_TEMP/prompt-kit-order-navigation-audit.json" \
            --summary
      - name: Validate Prompt Kit product interactions
        run: python -m unittest tests.test_prompt_kit_product_interactions -v
      - name: Validate Prompt Kit category and type filtering
        run: python -m unittest tests.test_prompt_kit_filtering_access -v
      - name: Validate Prompt Kit mobile and quick-open behavior
        run: python -m unittest tests.test_prompt_kit_mobile -v
      - name: Validate exact deployed website
        run: |
          python tests/test_prompt_kit_header_contract.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
