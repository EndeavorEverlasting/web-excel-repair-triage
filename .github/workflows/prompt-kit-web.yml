name: Prompt Kit web contracts

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  p07-mainline-source-sync:
    if: github.head_ref == 'feat/green-branch-integration-default-20260808' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/green-branch-integration-default-20260808
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strengthen canonical P7 and production policy validation
        shell: python
        run: |
          import json
          from pathlib import Path

          prompts_path = Path('docs/prompts.json')
          prompts = json.loads(prompts_path.read_text(encoding='utf-8'))
          p07 = next(prompt for prompt in prompts if prompt['id'] == 'P07')
          p07['sprintRole'] = 'Execute any bounded repo change through validated mainline convergence'
          p07['expectedOutput'] = 'Validated repository progress integrated into the current default branch when integration gates permit, or an exact named integration blocker with the action that advances it.'
          p07['nextStep'] = 'Continue the owned change through focused validation, exact-head checks, and integration into the current default branch; use P11 or P12 only when one of them is the actual next executable integration gate.'
          p07['proofGate'] = 'The intended change is verified on the current default branch after integration, or an exact integration blocker is proven with the action that advances it; a feature branch or PR alone is insufficient.'
          content = p07['copyContent']
          old_job = 'Your job is to change the repository, validate the change, commit it, and push or open/update a PR when the environment allows.'
          new_job = "Your job is to change the repository, validate the change, commit and push it, and carry the exact validated work through integration into current `main` (or the repository's configured default branch) when the gates permit."
          if old_job not in content:
              raise SystemExit('P07 job-contract anchor missing')
          content = content.replace(old_job, new_job, 1)
          anchor = 'Context or plan path: xyz_plan_directory\n'
          section_lines = [
              'MAINLINE CONVERGENCE',
              "- Treat current `main` (or the repository's configured default branch when it is not named `main`) as the consolidation destination for completed owned work.",
              '- Do not create a new feature branch or pull request merely because repository work was requested. First inspect current, open, and recent overlapping branches, worktrees, pull requests, and commits; reuse, repair, update, retarget, integrate, or extend the existing owner when safe.',
              '- Create an isolated branch or worktree only when repository policy, branch protection, dirty or separately owned work, required review, or collision isolation makes it necessary. A feature branch, worktree, or pull request is a temporary execution/review lane, not the intended final repository state.',
              '- After implementation, validate the exact current head and inspect required checks, owning validators, dependencies, blocking reviews, conflicts, protection rules, and merge authority.',
              '- When those gates are satisfied and the operator has not explicitly prohibited merge, merge the exact validated head into the current default branch in the same run. Do not stop at commit, push, PR-open, review-ready, or green-status reporting.',
              '- Stop short of integration only for an explicit no-merge instruction or a concrete failing/pending check, validator, dependency, review, conflict, protection, credential, permission, or merge-authority gate. Name the exact blocker and advance that gate.',
              '- After integration, verify the current default branch contains the intended change with provider merge state plus the owning test, validator, build, or content proof, and report the resulting default-branch SHA.',
              '',
          ]
          section = '\n'.join(section_lines)
          if 'MAINLINE CONVERGENCE\n' not in content:
              if anchor not in content:
                  raise SystemExit('P07 mainline insertion anchor missing')
              content = content.replace(anchor, anchor + section, 1)
          movement_old = 'At least one useful repository mutation must occur unless the sprint is already complete or blocked. Valid movement includes tracked-file changes, commits, branch or worktree creation, cherry-picks, merges, pushes, PR comments, labels, base or draft changes, PR closure, or other owned Git/GitHub mutations.'
          movement_new = movement_old + ' Branch or worktree creation is setup, not completion, while safe implementation or integration remains executable.'
          if movement_old in content:
              content = content.replace(movement_old, movement_new, 1)
          pr_old = 'Open or update a PR when appropriate.'
          pr_new = 'Open or update the correct PR when an integration lane is required, then continue through exact-head validation and merge into the current default branch when the MAINLINE CONVERGENCE gates permit it.'
          if pr_old in content:
              content = content.replace(pr_old, pr_new, 1)
          final_old = 'Do the repo work. Commit it. Then stop.'
          final_new = 'Do the repo work. Validate it. Commit and push it. Integrate the exact green authorized head into the current default branch when the gates permit, verify the default branch contains the intended change, then stop.'
          if final_old not in content:
              raise SystemExit('P07 final imperative anchor missing')
          content = content.replace(final_old, final_new, 1)
          report_anchor = '- PR: URL or not opened\n'
          report_extra = '- integration target: current default branch and pre/post SHA\n- merged/integrated: yes/no\n- merge commit or provider merge SHA:\n- default-branch verification: owning test/validator/build/content proof\n'
          if '- integration target: current default branch and pre/post SHA' not in content:
              if report_anchor not in content:
                  raise SystemExit('P07 final report anchor missing')
              content = content.replace(report_anchor, report_anchor + report_extra, 1)
          p07['copyContent'] = content
          prompts_path.write_text(json.dumps(prompts, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          builder_path = Path('scripts/build_prompt_kit_registry.py')
          text = builder_path.read_text(encoding='utf-8')
          required_start = text.index('REQUIRED_ACTIONABILITY_POLICY_FIELDS = {')
          required_end = text.index('REQUIRED_DISPLAY_ORDER_FIELDS = {', required_start)
          required_lines = [
              'REQUIRED_ACTIONABILITY_POLICY_FIELDS = {',
              '    "schema_version",',
              '    "policy_id",',
              '    "marker",',
              '    "integration_marker",',
              '    "integration_target",',
              '    "applies_to",',
              '    "next_step_suffix",',
              '    "allowed_none_value",',
              '    "green_merge_conditions",',
              '    "merge_exceptions",',
              '    "existing_work_reuse",',
              '    "forbidden_solo_actions",',
              '    "copy_content_appendix",',
              '}',
              '',
          ]
          text = text[:required_start] + '\n'.join(required_lines) + text[required_end:]
          old_string_fields = '    for field in (\n        "policy_id",\n        "marker",\n        "applies_to",\n        "next_step_suffix",\n        "allowed_none_value",\n        "copy_content_appendix",\n    ):\n'
          new_string_fields = '    for field in (\n        "policy_id",\n        "marker",\n        "integration_marker",\n        "integration_target",\n        "applies_to",\n        "next_step_suffix",\n        "allowed_none_value",\n        "copy_content_appendix",\n    ):\n'
          if old_string_fields not in text:
              raise SystemExit('actionability string-field validation anchor missing')
          text = text.replace(old_string_fields, new_string_fields, 1)
          validation_anchor = '    if any(not isinstance(item, str) or not item.strip() for item in forbidden):\n        raise SystemExit("Every forbidden solo action must be a non-empty string")\n\n'
          validation_lines = [
              '    for field in ("green_merge_conditions", "merge_exceptions"):',
              '        values = payload.get(field)',
              '        if not isinstance(values, list) or not values:',
              '            raise SystemExit(',
              '                f"Actionability policy field must define a non-empty list: {field}"',
              '            )',
              '        if any(not isinstance(item, str) or not item.strip() for item in values):',
              '            raise SystemExit(',
              '                f"Every actionability policy entry must be a non-empty string: {field}"',
              '            )',
              '        if len(values) != len(set(values)):',
              '            raise SystemExit(',
              '                f"Actionability policy list must not contain duplicates: {field}"',
              '            )',
              '',
              '    reuse = payload.get("existing_work_reuse")',
              '    if not isinstance(reuse, dict):',
              '        raise SystemExit("Actionability policy must define existing_work_reuse")',
              '    for field in ("rule", "preservation_rule", "disposition_evidence"):',
              '        value = reuse.get(field)',
              '        if not isinstance(value, str) or not value.strip():',
              '            raise SystemExit(',
              '                f"Actionability existing-work field must be non-empty: {field}"',
              '            )',
              '    allowed = reuse.get("new_pr_allowed_when")',
              '    if not isinstance(allowed, list) or not allowed:',
              '        raise SystemExit(',
              '            "Actionability existing-work policy must define new_pr_allowed_when"',
              '        )',
              '    if any(not isinstance(item, str) or not item.strip() for item in allowed):',
              '        raise SystemExit(',
              '            "Every new-PR allowance must be a non-empty string"',
              '        )',
              '',
          ]
          if validation_anchor not in text:
              raise SystemExit('actionability structured-validation anchor missing')
          text = text.replace(validation_anchor, validation_anchor + '\n'.join(validation_lines), 1)
          marker_anchor = '    marker = str(payload["marker"])\n    if marker not in str(payload["copy_content_appendix"]):\n        raise SystemExit("Actionability appendix must include its declared marker")\n'
          marker_replacement = '    marker = str(payload["marker"])\n    appendix = str(payload["copy_content_appendix"])\n    if marker not in appendix:\n        raise SystemExit("Actionability appendix must include its declared marker")\n    integration_marker = str(payload["integration_marker"])\n    if integration_marker not in appendix:\n        raise SystemExit("Actionability appendix must include its integration marker")\n'
          if marker_anchor not in text:
              raise SystemExit('actionability marker-validation anchor missing')
          text = text.replace(marker_anchor, marker_replacement, 1)
          builder_path.write_text(text, encoding='utf-8')
      - name: Build and validate canonical P7 convergence
        run: |
          python -m py_compile scripts/build_prompt_kit_registry.py tests/test_green_branch_integration_policy.py tests/test_prompt_kit_header_contract.py
          python -m json.tool docs/prompts.json >/dev/null
          python -m json.tool registry/prompts/actionable-next-step-policy.v1.json >/dev/null
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_green_branch_integration_policy -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python tests/test_prompt_kit_header_contract.py
          python tests/test_prompt_language_audit.py
          git diff --check
      - name: Restore normal workflow and commit canonical P7 convergence
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/prompt-kit-web.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/prompt-kit-web.yml docs/prompts.json scripts/build_prompt_kit_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): make P7 converge validated work to main'
          git push origin HEAD:feat/green-branch-integration-default-20260808
