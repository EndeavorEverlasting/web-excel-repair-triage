      - tests/test_prompt_kit_filtering_access.py
      - tests/test_prompt_kit_mobile.py
      - tests/test_prompt_kit_discovery.py
      - tests/test_prompt_kit_guidance.py
      - tests/test_prompt_kit_order_navigation_contract.py
      - tests/test_prompt_kit_order_navigation_product.py
      - tests/test_prompt_kit_portability.py
      - tests/test_prompt_kit_portability_regressions.py
