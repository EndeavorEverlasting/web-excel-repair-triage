name: Prompt Kit web contracts

on:
  pull_request:
    paths:
      - PROMPT_KIT_ACCESS.md
      - Open-Latest-PromptKit.cmd
      - Acquire-Latest-PromptKit.cmd
      - build_prompt_kit.py
      - scripts/Acquire-LatestPromptKit.ps1
      - scripts/build_prompt_kit_registry.py
      - scripts/validate_prompt_kit_interactions.py
      - registry/prompts/skill-development-prompts.v1.json
      - docs/GET_LATEST_PROMPT_KIT_WEBSITE.md
      - docs/prompt-kit.js
      - docs/prompts.json
      - docs/reference.json
      - harness/contracts/prompt-kit-interactions.v1.json
      - harness/contracts/prompt-kit-filtering.v1.json
      - harness/contracts/prompt-kit-mobile.v1.json
      - web/prompt-kit/index.html
      - web/README.md
      - tests/Test-PromptKitQuickOpenPathResolution.ps1
      - tests/test_prompt_kit_header_contract.py
      - tests/test_prompt_kit_product_interactions.py
      - tests/test_prompt_kit_filtering_access.py
      - tests/test_prompt_kit_mobile.py
      - tests/test_skill_prompt_registry.py
      - .github/workflows/prompt-kit-web.yml
  push:
    branches: [main]
    paths:
      - PROMPT_KIT_ACCESS.md
      - Open-Latest-PromptKit.cmd
      - Acquire-Latest-PromptKit.cmd
      - build_prompt_kit.py
      - scripts/Acquire-LatestPromptKit.ps1
      - scripts/build_prompt_kit_registry.py
      - scripts/validate_prompt_kit_interactions.py
      - registry/prompts/skill-development-prompts.v1.json
      - docs/GET_LATEST_PROMPT_KIT_WEBSITE.md
      - docs/prompt-kit.js
      - docs/prompts.json
      - docs/reference.json
      - harness/contracts/prompt-kit-interactions.v1.json
      - harness/contracts/prompt-kit-filtering.v1.json
      - harness/contracts/prompt-kit-mobile.v1.json
      - web/prompt-kit/index.html
      - web/README.md
      - tests/Test-PromptKitQuickOpenPathResolution.ps1
      - tests/test_prompt_kit_header_contract.py
      - tests/test_prompt_kit_product_interactions.py
      - tests/test_prompt_kit_filtering_access.py
      - tests/test_prompt_kit_mobile.py
      - tests/test_skill_prompt_registry.py
      - .github/workflows/prompt-kit-web.yml

permissions:
  contents: write

jobs:
  prompt-kit-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile website builders and contracts
        run: |
          python -m py_compile \
            build_prompt_kit.py \
            scripts/build_prompt_kit_registry.py \
            scripts/validate_prompt_kit_interactions.py \
            tests/test_prompt_kit_header_contract.py \
            tests/test_prompt_kit_product_interactions.py \
            tests/test_prompt_kit_filtering_access.py \
            tests/test_prompt_kit_mobile.py \
            tests/test_skill_prompt_registry.py
      - name: Patch empty-list path helper and commit hotfix branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/prompt-kit-quick-open-empty-path-list' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          head_sha = os.environ['HEAD_SHA']
          branch = os.environ['HEAD_BRANCH']
          path = Path('scripts/Acquire-LatestPromptKit.ps1')
          text = path.read_text(encoding='utf-8')
          old = '[Parameter(Mandatory)][System.Collections.Generic.List[string]]$Paths'
          new = '[Parameter(Mandatory)][AllowEmptyCollection()][System.Collections.Generic.List[string]]$Paths'

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          def request_json(url, *, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one Add-UniquePath parameter marker, found {text.count(old)}')
              patched = text.replace(old, new, 1)
              path.write_text(patched, encoding='utf-8', newline='\n')

              blob = request_json(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  method='POST',
                  payload={
                      'content': base64.b64encode(patched.encode('utf-8')).decode('ascii'),
                      'encoding': 'base64',
                  },
              )
              parent = request_json(f'https://api.github.com/repos/{repo}/git/commits/{head_sha}')
              tree = request_json(
                  f'https://api.github.com/repos/{repo}/git/trees',
                  method='POST',
                  payload={
                      'base_tree': parent['tree']['sha'],
                      'tree': [{
                          'path': 'scripts/Acquire-LatestPromptKit.ps1',
                          'mode': '100644',
                          'type': 'blob',
                          'sha': blob['sha'],
                      }],
                  },
              )
              commit = request_json(
                  f'https://api.github.com/repos/{repo}/git/commits',
                  method='POST',
                  payload={
                      'message': 'fix(prompt-kit): allow first resolved path insertion',
                      'tree': tree['sha'],
                      'parents': [head_sha],
                  },
              )
              request_json(
                  f"https://api.github.com/repos/{repo}/git/refs/heads/{urllib.parse.quote(branch, safe='/')}",
                  method='PATCH',
                  payload={'sha': commit['sha'], 'force': False},
              )
              print(f"HOTFIX_COMMIT_SHA={commit['sha']}")
          elif new in text:
              print('Add-UniquePath already accepts empty collections; no branch mutation required.')
          else:
              raise SystemExit('Add-UniquePath parameter marker was not recognized.')
          PY
      - name: Validate Prompt Kit JavaScript syntax
        run: node --check docs/prompt-kit.js
      - name: Validate acquisition PowerShell syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content -Raw scripts/Acquire-LatestPromptKit.ps1))
      - name: Reproduce empty-list path insertion
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile('scripts/Acquire-LatestPromptKit.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors -join '; ') }
          $fn = $ast.Find({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Add-UniquePath' }, $true)
          if (-not $fn) { throw 'Add-UniquePath not found' }
          Invoke-Expression $fn.Extent.Text
          $paths = [System.Collections.Generic.List[string]]::new()
          $expected = [System.IO.Path]::GetFullPath((Join-Path ([System.IO.Path]::GetTempPath()) 'prompt-kit-dev'))
          Add-UniquePath -Paths $paths -Path $expected
          if ($paths.Count -ne 1 -or $paths[0] -ne $expected) { throw 'empty-list path insertion did not resolve correctly' }
          Write-Host 'Add-UniquePath empty-list regression: PASS'
      - name: Validate deterministic quick-open path
        shell: pwsh
        run: ./tests/Test-PromptKitQuickOpenPathResolution.ps1
      - name: Validate strict interaction implementation contract
        run: python scripts/validate_prompt_kit_interactions.py --require-implementation --output "$RUNNER_TEMP/prompt-kit-interaction-audit.json" --summary
      - name: Build current Prompt Kit preview
        run: |
          mkdir -p "$RUNNER_TEMP/prompt-kit"
          python scripts/build_prompt_kit_registry.py --output "$RUNNER_TEMP/prompt-kit/index.html"
      - name: Upload current Prompt Kit preview
        uses: actions/upload-artifact@v4
        with:
          name: prompt-kit-current-preview
          path: ${{ runner.temp }}/prompt-kit/index.html
          if-no-files-found: error
      - name: Validate Prompt Kit product interactions
        run: python -m unittest tests.test_prompt_kit_product_interactions -v
      - name: Validate Prompt Kit category and type filtering
        run: python -m unittest tests.test_prompt_kit_filtering_access -v
      - name: Validate Prompt Kit mobile and quick-open behavior
        run: python -m unittest tests.test_prompt_kit_mobile -v
      - name: Validate exact deployed website
        run: |
          python tests/test_prompt_kit_header_contract.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
