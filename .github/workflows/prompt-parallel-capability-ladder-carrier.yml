name: Prompt parallel capability ladder carrier

on:
  push:
    branches:
      - fix/prompt-parallel-capability-ladder-20260913

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/prompt-parallel-capability-ladder-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply bounded prompt-contract repair
        run: python scripts/_tmp_parallel_capability_repair.py
      - name: Validate focused prompt semantics
        run: python -m unittest tests.test_p02_p07_autonomous_iteration tests.test_skill_prompt_registry tests.test_prompt_parallel_execution_contract -v
      - name: Validate language discovery harness and generated parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_harness.py
          git diff --check
      - name: Commit durable repair and self-remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/_tmp_parallel_capability_repair.py
          rm .github/workflows/prompt-parallel-capability-ladder-carrier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(prompt-kit): enforce autonomous parallel dispatch"
          git push origin HEAD:fix/prompt-parallel-capability-ladder-20260913
