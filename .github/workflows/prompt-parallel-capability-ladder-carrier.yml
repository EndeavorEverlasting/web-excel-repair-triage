name: Prompt parallel capability ladder carrier

on:
  push:
    branches:
      - fix/prompt-parallel-capability-ladder-20260913

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/prompt-parallel-capability-ladder-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply bounded prompt-contract repair
        run: python scripts/_tmp_parallel_capability_repair.py
      - name: Preserve adjacent established contracts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          prompts_path = Path('docs/prompts.json')
          prompts = json.loads(prompts_path.read_text(encoding='utf-8'))
          p07 = next(p for p in prompts if p['id'] == 'P07')
          p07['expectedOutput'] = p07['expectedOutput'].replace('dependency-graph width', 'dependency graph width')
          p07['expectedOutput'] += ' Genuine user involvement remains limited to a genuinely user-only gate. Strategic follow-ons remain optional and evidence-triggered rather than sprint-expanding.'
          p07['proofGate'] += ' A terminal human gate must name a genuinely user-only dependency; agent-capable scheduling, lane launch, context shuttling, and ordinary repository operations are never such a dependency. A branch or PR alone is insufficient completion evidence while safe authorized execution or integration remains. Strategic follow-on discovery never authorizes unfinished owned work or replaces the bounded fixed-point and integration gates.'
          p07['nextStep'] += ' The optional evidence-triggered strategic follow-on does not replace bounded fixed-point execution, validation, integration, or the active critical path.'
          p07['copyContent'] = p07['copyContent'].replace('Parallel-execution proof remains UNPROVEN', 'parallel proof remains UNPROVEN')
          prompts_path.write_text(json.dumps(prompts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          overrides_path = Path('registry/prompts/prompt-overrides.v1.json')
          payload = json.loads(overrides_path.read_text(encoding='utf-8'))
          p13 = next(p for p in payload['overrides'] if p['id'] == 'P13')
          p13['copyContent'] = p13['copyContent'].replace(
              'P13 treats missing parallelism as recurring friction; P07 owns dispatch/coordinator semantics.',
              'P13 treats missing parallelism as recurring friction; P07 owns the execution/coordinator contract.'
          )
          overrides_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          skill_test = Path('tests/test_skill_prompt_registry.py')
          text = skill_test.read_text(encoding='utf-8')
          old = 'actual P07 dispatch evidence when worker capacity and collision-safe lanes exist'
          new = 'P07 dependency-graph width plus capability-ladder evidence'
          if old not in text:
              raise SystemExit('expected obsolete P13 parallelism test phrase not found')
          skill_test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate focused prompt semantics
        run: python -m unittest tests.test_p02_p07_autonomous_iteration tests.test_skill_prompt_registry tests.test_prompt_parallel_execution_contract -v
      - name: Validate language discovery harness and generated parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_harness.py
          git diff --check
      - name: Commit durable repair and self-remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/_tmp_parallel_capability_repair.py
          rm .github/workflows/prompt-parallel-capability-ladder-carrier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(prompt-kit): enforce autonomous parallel dispatch"
          git push origin HEAD:fix/prompt-parallel-capability-ladder-20260913
