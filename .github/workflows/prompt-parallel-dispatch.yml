name: Prompt parallel dispatch

on:
  pull_request:
    paths:
      - 'docs/prompts.json'
      - 'registry/prompts/**'
      - 'harness/specs/prompt-operations.md'
      - 'harness/contracts/prompt-parallel-dispatch.v1.json'
      - 'harness/evals/fixtures/prompt-parallel-dispatch-valid.v1.json'
      - 'scripts/prompt_parallel_dispatch.py'
      - 'tests/test_prompt_parallel_execution_contract.py'
      - 'tests/test_prompt_parallel_dispatch.py'
      - '.github/workflows/prompt-parallel-dispatch.yml'
  push:
    branches: [main]
    paths:
      - 'docs/prompts.json'
      - 'registry/prompts/**'
      - 'harness/specs/prompt-operations.md'
      - 'harness/contracts/prompt-parallel-dispatch.v1.json'
      - 'harness/evals/fixtures/prompt-parallel-dispatch-valid.v1.json'
      - 'scripts/prompt_parallel_dispatch.py'
      - 'tests/test_prompt_parallel_execution_contract.py'
      - 'tests/test_prompt_parallel_dispatch.py'
      - '.github/workflows/prompt-parallel-dispatch.yml'

permissions:
  contents: read

jobs:
  parallel-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Compile dispatcher
        run: python -m py_compile scripts/prompt_parallel_dispatch.py tests/test_prompt_parallel_dispatch.py tests/test_prompt_parallel_execution_contract.py
      - name: Run deterministic dispatch contracts
        run: python -m unittest tests.test_prompt_parallel_dispatch tests.test_prompt_parallel_execution_contract -v
      - name: Validate and execute real two-lane fixture
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=harness/evals/fixtures/prompt-parallel-dispatch-valid.v1.json
          RECEIPT=Outputs/prompt-parallel-dispatch/ci-receipt.json
          python scripts/prompt_parallel_dispatch.py validate --manifest "$MANIFEST"
          python scripts/prompt_parallel_dispatch.py run --manifest "$MANIFEST" --receipt "$RECEIPT"
          python scripts/prompt_parallel_dispatch.py verify-receipt --manifest "$MANIFEST" --receipt "$RECEIPT"
      - name: Check generated product parity and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check origin/main...HEAD
