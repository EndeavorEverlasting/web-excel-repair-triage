name: Prompt parallel executable contract carrier

on:
  push:
    branches:
      - fix/prompt-parallel-capability-ladder-20260913

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/prompt-parallel-capability-ladder-20260913
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Wire executable contract
        run: python scripts/_tmp_wire_parallel_contract.py
      - name: Rebuild canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Run dispatch and prompt regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_prompt_parallel_dispatch tests.test_prompt_parallel_execution_contract tests.test_p02_p07_autonomous_iteration tests.test_skill_prompt_registry tests.test_actionable_prompt_registry tests.test_remote_freshness_p13_iteration -v
          MANIFEST=harness/evals/fixtures/prompt-parallel-dispatch-valid.v1.json
          RECEIPT=Outputs/prompt-parallel-dispatch/carrier-receipt.json
          python scripts/prompt_parallel_dispatch.py validate --manifest "$MANIFEST"
          python scripts/prompt_parallel_dispatch.py run --manifest "$MANIFEST" --receipt "$RECEIPT"
          python scripts/prompt_parallel_dispatch.py verify-receipt --manifest "$MANIFEST" --receipt "$RECEIPT"
      - name: Run owning product gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_harness.py
          git diff --check
      - name: Commit durable wiring and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/_tmp_wire_parallel_contract.py
          rm .github/workflows/prompt-parallel-executable-contract-carrier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(prompt-kit): make parallel dispatch manifest executable"
          git push origin HEAD:fix/prompt-parallel-capability-ladder-20260913
