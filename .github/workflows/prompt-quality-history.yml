name: Prompt quality history

on:
  pull_request:
    paths:
      - ".github/workflows/prompt-quality-history.yml"
      - "harness/contracts/prompt-quality-history.v1.json"
      - "harness/prompt-compilation/prompt-semantic-migrations.v1.json"
      - "harness/prompt-compilation/semantics/**"
      - "harness/prompt-compilation/build-context/**"
      - "docs/prompts.json"
      - "registry/prompts/**"
      - "registry/prompts/product-boundaries.v1.json"
      - "scripts/build_prompt_kit_registry.py"
      - "scripts/prompt_registry_product_boundaries.py"
      - "scripts/prompt_improvement_compiler.py"
      - "scripts/validate_prompt_quality_history.py"
      - "tests/test_prompt_quality_history.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/prompt-quality-history.yml"
      - "harness/contracts/prompt-quality-history.v1.json"
      - "harness/prompt-compilation/prompt-semantic-migrations.v1.json"
      - "harness/prompt-compilation/semantics/**"
      - "harness/prompt-compilation/build-context/**"
      - "docs/prompts.json"
      - "registry/prompts/**"
      - "registry/prompts/product-boundaries.v1.json"
      - "scripts/build_prompt_kit_registry.py"
      - "scripts/prompt_registry_product_boundaries.py"
      - "scripts/prompt_improvement_compiler.py"
      - "scripts/validate_prompt_quality_history.py"
      - "tests/test_prompt_quality_history.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prompt-quality-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate prompt quality history
        run: python scripts/validate_prompt_quality_history.py --summary
      - name: Run prompt quality history regressions
        run: python -m unittest tests.test_prompt_quality_history -v
      - name: Check patch hygiene
        run: git diff --check
