name: Prompt routing control plane carrier

on:
  push:
    branches:
      - feat/prompt-routing-control-plane-20260912

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-routing-control-plane-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Detect complete payload
        id: ready
        shell: bash
        run: |
          if [[ -f .tmp/prompt-route/READY ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Prompt-route payload is not complete yet; carrier exits without mutation.'
          fi
      - name: Refresh current main floor
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge --no-edit origin/main
      - name: Materialize and verify bounded routing implementation
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path

          entries = {
              '.tmp/prompt-route/scripts__operant_prompt_route.py.b64': ('scripts/operant_prompt_route.py', '1f7e25b549c208852197e8553be08aa015e0bd617f1ca00fcb8db0e189918c1e'),
              '.tmp/prompt-route/scripts__evaluate_prompt_route_receipts.py.b64': ('scripts/evaluate_prompt_route_receipts.py', '2088f6930b56561bcea9cef6774bee1113cb6d505221685ebea52c81627be281'),
              '.tmp/prompt-route/tests__test_prompt_route_receipt_acceptance.py.b64': ('tests/test_prompt_route_receipt_acceptance.py', 'c608db16d285e75494f87428e3b17d6a06b64a21accfe801507573d15b06b8b5'),
              '.tmp/prompt-route/harness__contracts__operant-prompt-routing.v1.json.b64': ('harness/contracts/operant-prompt-routing.v1.json', 'e83dd2f9d87ef6f000a698582ad0e67cdf4085a364ec5188c16866eb063fb223'),
              '.tmp/prompt-route/harness__schemas__prompt-route-receipt.v1.schema.json.b64': ('harness/schemas/prompt-route-receipt.v1.schema.json', 'b6d0db23423f7c925a53715d6f4dd243d2f0171b4c9c1092fa43231e21351c95'),
              '.tmp/prompt-route/harness__evals__fixtures__prompt-route-receipt-cases.v1.json.b64': ('harness/evals/fixtures/prompt-route-receipt-cases.v1.json', '9e122e7ce7fcbc82a4e38063e8c75b063e28bd645a610657a141304c6f8b8edc'),
          }
          for encoded_path, (target_path, expected) in entries.items():
              encoded = Path(encoded_path).read_text(encoding='ascii').strip()
              raw = gzip.decompress(base64.b64decode(encoded, validate=True))
              actual = hashlib.sha256(raw).hexdigest()
              if actual != expected:
                  raise SystemExit(f'hash mismatch for {target_path}: expected={expected} actual={actual}')
              target = Path(target_path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
              print(f'materialized {target_path} sha256={actual}')
          PY
      - name: Register deterministic routing eval
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('harness/evals/repository-ai-evals.v1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          suite = {
            'id': 'prompt-route-control-plane',
            'owner': 'AFK Agent Flow/P67',
            'surface': 'Canonical prompt routing across human, agent, classifier, script, and workflow actors',
            'layer': 'deterministic',
            'blocking': True,
            'command': ['python','scripts/evaluate_prompt_route_receipts.py','--output','Outputs/repository-ai-evals/prompt-route-receipts.json','--summary'],
            'artifact': 'Outputs/repository-ai-evals/prompt-route-receipts.json',
            'case_source': 'harness/evals/fixtures/prompt-route-receipt-cases.v1.json',
            'contract': 'harness/contracts/operant-prompt-routing.v1.json',
            'failure_classes': ['precedence_conflict','arrival_order_dependence','tie_break_nondeterminism','stale_route_mutation','duplicate_second_mutation','idempotency_key_collision','human_dependency_accepted','validation_repair_unrouted','dom_dependency'],
            'proof_ceiling': 'Deterministic route-state semantics, canonical registry resolution, autonomy-gap classification, CAS, precedence, idempotency, and headless routing at one exact repository head.'
          }
          data['suites'] = [s for s in data['suites'] if s.get('id') != suite['id']]
          data['suites'].insert(0, suite)
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          test_path = Path('tests/test_repository_ai_eval_framework.py')
          text = test_path.read_text(encoding='utf-8')
          marker = '        self.assertEqual(self.by_id["prompt-finder-routing"]["layer"], "deterministic")\n'
          addition = marker + '        self.assertEqual(self.by_id["prompt-route-control-plane"]["layer"], "deterministic")\n        self.assertTrue(self.by_id["prompt-route-control-plane"]["blocking"])\n'
          if 'self.by_id["prompt-route-control-plane"]' not in text:
              if marker not in text:
                  raise SystemExit('framework test insertion marker missing')
              text = text.replace(marker, addition, 1)
              test_path.write_text(text, encoding='utf-8')
          PY
      - name: Prove routing control plane before commit
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_prompt_route_receipt_acceptance -v
          python scripts/evaluate_prompt_route_receipts.py --output Outputs/repository-ai-evals/prompt-route-receipts.json --summary
          python -m unittest tests.test_repository_ai_eval_framework -v
          python scripts/run_repository_ai_evals.py --validate-only --observed-candidates harness/evals/fixtures/repository-ai-eval-observed-candidates.v1.json --summary
          python scripts/run_repository_ai_evals.py --observed-candidates harness/evals/fixtures/repository-ai-eval-observed-candidates.v1.json --output Outputs/repository-ai-eval-report.json --summary
          git diff --check
      - name: Commit durable implementation and self-remove carrier
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/prompt-route
          rm -f .github/workflows/prompt-routing-control-plane-carrier.yml
          git add scripts/operant_prompt_route.py scripts/evaluate_prompt_route_receipts.py tests/test_prompt_route_receipt_acceptance.py tests/test_repository_ai_eval_framework.py harness/contracts/operant-prompt-routing.v1.json harness/schemas/prompt-route-receipt.v1.schema.json harness/evals/fixtures/prompt-route-receipt-cases.v1.json harness/evals/repository-ai-evals.v1.json .github/workflows/prompt-routing-control-plane-carrier.yml .tmp/prompt-route || true
          git commit -m 'feat(operant): install canonical prompt routing control plane'
          git push origin HEAD:feat/prompt-routing-control-plane-20260912
