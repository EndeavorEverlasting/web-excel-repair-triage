name: Prompt snap header-first repair carrier

on:
  push:
    branches:
      - fix/prompt-snap-header-first-20260915

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact carrier head
        uses: actions/checkout@v4
        with:
          ref: fix/prompt-snap-header-first-20260915
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baseline protected deterministic controls
        run: |
          set -euo pipefail
          node --check docs/prompt-kit-polish.js
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest \
            tests.test_prompt_kit_discovery \
            tests.test_prompt_kit_hotkey_completion \
            tests.test_prompt_kit_mobile_quick_controls \
            tests.test_prompt_kit_selected_prompt \
            tests.test_prompt_kit_cross_input_modality -v

      - name: Install Chromium proof runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Baseline protected browser journeys
        run: |
          set -euo pipefail
          mkdir -p Outputs/observed-proof
          python tests/prompt_kit_mobile_quick_controls_browser_proof.py
          python tests/prompt_kit_favorite_browser_proof.py \
            --receipt Outputs/observed-proof/baseline-favorite-receipt.json \
            --screenshot Outputs/observed-proof/baseline-favorite.png

      - name: Repair and prove header-first snapping
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/carriers/prompt_snap_header_first_carrier.py
