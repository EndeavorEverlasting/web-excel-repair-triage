name: Prompt snap header-first repair carrier

on:
  push:
    branches:
      - fix/prompt-snap-header-first-20260915

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact carrier head
        uses: actions/checkout@v4
        with:
          ref: fix/prompt-snap-header-first-20260915
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baseline protected deterministic controls
        run: |
          set -euo pipefail
          node --check docs/prompt-kit-polish.js
          if python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check; then
            echo 'BASELINE_GENERATED_PARITY=PASS'
          else
            echo '::warning::BASELINE_GENERATED_PARITY=PRE_EXISTING_FAIL; candidate must rebuild and pass parity'
          fi
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest \
            tests.test_prompt_kit_discovery \
            tests.test_prompt_kit_hotkey_completion \
            tests.test_prompt_kit_mobile_quick_controls \
            tests.test_prompt_kit_selected_prompt \
            tests.test_prompt_kit_cross_input_modality -v

      - name: Install Chromium proof runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Materialize exact current-source browser baseline
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo 'BASELINE_RUNTIME_SITE=regenerated from accepted source because tracked main artifact was stale'
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git add web/prompt-kit/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore(carrier): materialize current-source baseline projection'
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Baseline protected browser journeys
        run: |
          set -euo pipefail
          mkdir -p Outputs/observed-proof
          python tests/prompt_kit_mobile_quick_controls_browser_proof.py
          python tests/prompt_kit_favorite_browser_proof.py \
            --receipt Outputs/observed-proof/baseline-favorite-receipt.json \
            --screenshot Outputs/observed-proof/baseline-favorite.png

      - name: Repair and prove header-first snapping
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/carriers/prompt_snap_header_first_carrier.py')
          text = path.read_text(encoding='utf-8')
          old = '''        prompt_id = str(candidate["id"])
          page.evaluate("id => centerRenderedPromptCard(id,'instant')", prompt_id)
          page.wait_for_timeout(120)
          '''
          new = '''        prompt_id = "P126"
          candidate = page.evaluate("""() => {
            const card=document.querySelector('[data-prompt-id="P126"]');
            if(!card)return null;
            const r=card.getBoundingClientRect();
            return {id:'P126',height:r.height,top:r.top+scrollY};
          }""")
          if not candidate:
              raise AssertionError("P126 is unavailable for snap probe")
          page.evaluate("() => { if(document.activeElement && document.activeElement.blur)document.activeElement.blur(); window.scrollTo(0,0); }")
          page.keyboard.type("126")
          page.wait_for_timeout(900)
          '''
          if text.count(old) != 1:
              raise SystemExit(f'carrier keyboard-probe patch target count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/carriers/prompt_snap_header_first_carrier.py
