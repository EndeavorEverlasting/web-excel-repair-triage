name: Prompt topology Phase A

on:
  pull_request:
    paths:
      - 'harness/prompt-topology/**'
      - 'harness/contracts/prompt-topology-classifier.v1.json'
      - 'scripts/prompt-topology/**'
      - 'scripts/validate_prompt_topology.py'
      - 'scripts/build_prompt_kit_registry.py'
      - 'scripts/prompt_classification.py'
      - 'scripts/prompt_kit_tutorial_coverage.py'
      - 'registry/prompts/**'
      - 'docs/prompts.json'
      - 'tests/test_prompt_topology_phase_a.py'
      - 'requirements-prompt-topology.txt'
      - '.github/workflows/prompt-topology-phase-a.yml'
  push:
    branches: [main]
    paths:
      - 'harness/prompt-topology/**'
      - 'harness/contracts/prompt-topology-classifier.v1.json'
      - 'scripts/prompt-topology/**'
      - 'scripts/validate_prompt_topology.py'
      - 'scripts/build_prompt_kit_registry.py'
      - 'scripts/prompt_classification.py'
      - 'scripts/prompt_kit_tutorial_coverage.py'
      - 'registry/prompts/**'
      - 'docs/prompts.json'
      - 'tests/test_prompt_topology_phase_a.py'
      - 'requirements-prompt-topology.txt'
      - '.github/workflows/prompt-topology-phase-a.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONHASHSEED: '0'
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  phase-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact candidate and refreshed main floor
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git diff --check origin/main...HEAD
          echo "candidate=$EXPECTED_SHA main=$(git rev-parse origin/main)"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: P79 lifecycle bridge for repository organization owner
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/p144-repository-organization-auditor-20260922'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p Outputs/p79-repo-organizer
          python -m pip install --disable-pip-version-check -r requirements-test-floor.txt -r requirements-prompt-topology.txt

          if grep -Fq '"id": "P144"' registry/prompts/spec-architecture-prompts.v1.json; then
            echo "P144 already lifecycle-added; validating only."
            python scripts/prompt_registry_ops.py validate > Outputs/p79-repo-organizer/validate.json
            python -m unittest               tests.test_repository_ssh_setup_prompt               tests.test_repository_organization_prompt               tests.test_prompt_semantic_coverage               tests.test_prompt_semantic_validator_1b -v
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
            git diff --check
          else
            python scripts/prompt_registry_ops.py prior-art               --query "repository SSH transport setup authentication provider-neutral key host trust git remote usage"               > Outputs/p79-repo-organizer/prior-art-p143.json
            python scripts/prompt_registry_ops.py add               --input .github/p79-staging/p143-repository-ssh.json               --registry ai-engineering-level-up-prompts               > Outputs/p79-repo-organizer/add-p143.json

            python scripts/prompt_registry_ops.py prior-art               --query "repository organization audit topology canonical ownership placement naming lifecycle reachability in-flight hygiene navigation read-only before mutation"               > Outputs/p79-repo-organizer/prior-art-p144.json
            python scripts/prompt_registry_ops.py add               --input .github/p79-staging/p144-repository-organization.json               --registry spec-architecture-prompts               > Outputs/p79-repo-organizer/add-p144.json

            python scripts/prompt_registry_ops.py validate > Outputs/p79-repo-organizer/validate.json
            python -m unittest               tests.test_repository_ssh_setup_prompt               tests.test_repository_organization_prompt               tests.test_prompt_semantic_coverage               tests.test_prompt_semantic_validator_1b -v
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
            python scripts/evaluate_prompt_language.py --summary
            git diff --check

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add               registry/prompts/ai-engineering-level-up-prompts.v1.json               registry/prompts/spec-architecture-prompts.v1.json               harness/prompt-topology/prompt-capability-profiles.v1.json               harness/prompt-topology/prompt-capability-migrations.v1.json               harness/prompt-compilation/prompt-semantic-migrations.v1.json               web/prompt-kit/index.html
            git commit -m "feat(prompt-kit): add repository organization auditor"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Upload P79 lifecycle receipts
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feat/p144-repository-organization-auditor-20260922'
        uses: actions/upload-artifact@v7
        with:
          name: p79-repository-organization-${{ github.event.pull_request.head.sha }}
          path: Outputs/p79-repo-organizer/
          if-no-files-found: ignore
          retention-days: 14

      - name: Install scoped topology runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-prompt-topology.txt

      - name: Validate contract and focused engine fixtures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_prompt_topology.py --summary
          python -m unittest tests.test_prompt_topology_phase_a -v

      - name: Build live canonical topology and prove determinism
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt-topology/run.py --output "$RUNNER_TEMP/topology.v1.json" --summary
          python scripts/prompt-topology/run.py --output "$RUNNER_TEMP/topology.v1.json" --check
          python scripts/prompt-topology/run.py --shuffle-source --output "$RUNNER_TEMP/topology.shuffled.v1.json"
          cmp "$RUNNER_TEMP/topology.v1.json" "$RUNNER_TEMP/topology.shuffled.v1.json"
          python scripts/prompt-topology/validate.py --artifact "$RUNNER_TEMP/topology.v1.json" --rebuild --summary > "$RUNNER_TEMP/validation.json"
          cat "$RUNNER_TEMP/validation.json"

      - name: Upload Phase A evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prompt-topology-phase-a-evidence
          path: |
            ${{ runner.temp }}/topology.v1.json
            ${{ runner.temp }}/topology.shuffled.v1.json
            ${{ runner.temp }}/validation.json
          if-no-files-found: error
