name: Prompt topology Phase C

on:
  pull_request:
    paths:
      - 'harness/prompt-topology/**'
      - 'harness/contracts/prompt-topology-classifier.v1.json'
      - 'scripts/prompt-topology/**'
      - 'scripts/validate_prompt_topology.py'
      - 'scripts/build_prompt_topology_viewer.py'
      - 'scripts/build_prompt_kit_registry.py'
      - 'scripts/prompt_classification.py'
      - 'scripts/prompt_kit_tutorial_coverage.py'
      - 'registry/prompts/**'
      - 'docs/prompts.json'
      - 'docs/prompt-topology-viewer.*'
      - 'tests/test_prompt_topology_phase_a.py'
      - 'tests/test_prompt_topology_phase_b.py'
      - 'tests/test_prompt_topology_phase_c.py'
      - 'tests/prompt_topology_viewer_browser_proof.py'
      - 'requirements-prompt-topology.txt'
      - '.github/workflows/prompt-topology-phase-c.yml'
  push:
    branches: [main]
    paths:
      - 'harness/prompt-topology/**'
      - 'harness/contracts/prompt-topology-classifier.v1.json'
      - 'scripts/prompt-topology/**'
      - 'scripts/validate_prompt_topology.py'
      - 'scripts/build_prompt_topology_viewer.py'
      - 'scripts/build_prompt_kit_registry.py'
      - 'scripts/prompt_classification.py'
      - 'scripts/prompt_kit_tutorial_coverage.py'
      - 'registry/prompts/**'
      - 'docs/prompts.json'
      - 'docs/prompt-topology-viewer.*'
      - 'tests/test_prompt_topology_phase_a.py'
      - 'tests/test_prompt_topology_phase_b.py'
      - 'tests/test_prompt_topology_phase_c.py'
      - 'tests/prompt_topology_viewer_browser_proof.py'
      - 'requirements-prompt-topology.txt'
      - '.github/workflows/prompt-topology-phase-c.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  phase-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact candidate and refreshed main floor
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git diff --check origin/main...HEAD
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install topology runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-prompt-topology.txt
      - name: Validate Phase A B C contracts
        run: |
          set -euo pipefail
          python scripts/validate_prompt_topology.py --summary
          python -m unittest tests.test_prompt_topology_phase_a tests.test_prompt_topology_phase_b tests.test_prompt_topology_phase_c -v
          node --check docs/prompt-topology-viewer.js
      - name: Rebuild exact topology projection and viewer parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt-topology/run.py --output "$RUNNER_TEMP/topology.v1.json" --summary
          python scripts/prompt-topology/project.py --topology "$RUNNER_TEMP/topology.v1.json" --output "$RUNNER_TEMP/projection-3d.json" --state-output "$RUNNER_TEMP/projection-state.v1.json" --summary
          mkdir -p Outputs/prompt-topology-viewer
          python scripts/build_prompt_topology_viewer.py --topology "$RUNNER_TEMP/topology.v1.json" --projection "$RUNNER_TEMP/projection-3d.json" --state "$RUNNER_TEMP/projection-state.v1.json" --output Outputs/prompt-topology-viewer/index.html --summary
          python scripts/build_prompt_topology_viewer.py --topology "$RUNNER_TEMP/topology.v1.json" --projection "$RUNNER_TEMP/projection-3d.json" --state "$RUNNER_TEMP/projection-state.v1.json" --output "$RUNNER_TEMP/prompt-topology-viewer-second.html"
          cmp Outputs/prompt-topology-viewer/index.html "$RUNNER_TEMP/prompt-topology-viewer-second.html"
      - name: Install Chromium proof runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Observe Phase C interactions and privacy boundary
        run: python tests/prompt_topology_viewer_browser_proof.py
      - name: Upload Phase C observed evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prompt-topology-phase-c-evidence
          path: |
            Outputs/observed-proof/prompt-topology-phase-c.json
            Outputs/observed-proof/prompt-topology-phase-c.png
            Outputs/prompt-topology-viewer/index.html
          if-no-files-found: error
