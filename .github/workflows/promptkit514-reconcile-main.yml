name: Prompt Kit 514 reconcile main

on:
  push:
    branches:
      - feat/michaelshimeles-skill-intake-20260916

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge current main and regenerate owned sidecars
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'MAIN_ALREADY_CONTAINED=1'
          else
            set +e
            git merge --no-commit --no-ff origin/main
            merge_status=$?
            set -e
            if [ "$merge_status" -ne 0 ]; then
              unresolved="$(git diff --name-only --diff-filter=U)"
              allowed=$'registry/resources/operant-external-resource-gaps.v1.json\nweb/prompt-kit/resources.v1.json'
              if [ "$unresolved" != "$allowed" ]; then
                echo 'Unexpected merge conflicts:' >&2
                printf '%s\n' "$unresolved" >&2
                exit 1
              fi
            fi
            python scripts/sync_operant_external_resources.py
            git add registry/resources/operant-external-resource-gaps.v1.json web/prompt-kit/resources.v1.json
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo 'Unresolved merge conflicts remain' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
            git add -A
            python -m py_compile scripts/operant_external_resource_paths.py scripts/sync_operant_external_resources.py scripts/validate_operant_external_resources.py
            python scripts/validate_operant_external_resources.py --summary
            python -m unittest tests.test_operant_external_resources tests.test_external_prior_art_gate -v
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
            git diff --check --cached
            git commit -m 'merge main into Michael Shimeles donor intake'
            git push origin HEAD:feat/michaelshimeles-skill-intake-20260916
          fi
