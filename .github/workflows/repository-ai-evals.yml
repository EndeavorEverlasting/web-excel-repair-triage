name: Repository AI Evals
run-name: Repository AI Evals | ${{ github.event_name }} | ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'harness/evals/**'
      - 'tests/fixtures/p123_youtube_ingestion_behavior/**'
      - 'tests/fixtures/p67_source_faithfulness/**'
      - 'tests/fixtures/p100_closeout_replay/**'
      - 'scripts/run_repository_ai_evals.py'
      - 'scripts/prompt_kit_classifier_eval.py'
      - 'scripts/evaluate_prompt_language.py'
      - 'scripts/evaluate_p123_youtube_ingestion_behavior.py'
      - 'scripts/evaluate_p67_source_faithfulness.py'
      - 'docs/prompt-kit.js'
      - 'docs/prompt-kit-guided-recommendations.js'
      - 'registry/prompts/**'
      - 'tests/test_repository_ai_eval_framework.py'
      - 'tests/test_prompt_kit_classifier_eval.py'
      - 'tests/test_prompt_language_audit.py'
      - 'tests/test_p123_youtube_ingestion_behavior_eval_prompt.py'
      - 'tests/test_p67_source_faithfulness_eval_prompt.py'
      - 'harness/test-floor.v1.json'
      - '.github/workflows/repository-ai-evals.yml'
  push:
    branches: [main]
    paths:
      - 'harness/evals/**'
      - 'tests/fixtures/p123_youtube_ingestion_behavior/**'
      - 'tests/fixtures/p67_source_faithfulness/**'
      - 'tests/fixtures/p100_closeout_replay/**'
      - 'scripts/run_repository_ai_evals.py'
      - 'scripts/prompt_kit_classifier_eval.py'
      - 'scripts/evaluate_prompt_language.py'
      - 'scripts/evaluate_p123_youtube_ingestion_behavior.py'
      - 'scripts/evaluate_p67_source_faithfulness.py'
      - 'docs/prompt-kit.js'
      - 'docs/prompt-kit-guided-recommendations.js'
      - 'registry/prompts/**'
      - 'tests/test_repository_ai_eval_framework.py'
      - 'tests/test_prompt_kit_classifier_eval.py'
      - 'tests/test_prompt_language_audit.py'
      - 'tests/test_p123_youtube_ingestion_behavior_eval_prompt.py'
      - 'tests/test_p67_source_faithfulness_eval_prompt.py'
      - 'harness/test-floor.v1.json'
      - '.github/workflows/repository-ai-evals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-ai-evals:
    name: Repository AI Eval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Validate framework contract and observed-candidate boundary
        run: >-
          python scripts/run_repository_ai_evals.py
          --validate-only
          --observed-candidates harness/evals/fixtures/repository-ai-eval-observed-candidates.v1.json
          --summary
      - name: Run framework regression tests
        run: python -m unittest tests.test_repository_ai_eval_framework -v
      - name: Execute repository AI eval pyramid
        id: evals
        continue-on-error: true
        run: >-
          python scripts/run_repository_ai_evals.py
          --observed-candidates harness/evals/fixtures/repository-ai-eval-observed-candidates.v1.json
          --output Outputs/repository-ai-eval-report.json
          --summary
      - name: Publish repository AI eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-ai-eval-report
          path: Outputs/repository-ai-eval-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce repository AI eval gate
        if: steps.evals.outcome != 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('Outputs/repository-ai-eval-report.json')
          if path.is_file():
              report = json.loads(path.read_text(encoding='utf-8'))
              print('blocking_failures=', report.get('blocking_failures'))
              for suite in report.get('suites', []):
                  if suite.get('status') == 'FAIL':
                      print('FAIL', suite.get('id'), suite.get('execution', {}).get('stderr_tail', ''))
          raise SystemExit('Repository AI eval gate failed; report artifact preserved above.')
          PY
