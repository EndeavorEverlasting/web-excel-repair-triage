name: Repository local action adapter

on:
  workflow_dispatch:
    inputs:
      action:
        description: Reviewed repository-local action id
        required: true
        type: choice
        options:
          - prompt-kit-proof
          - prompt-kit-build-proof
          - required-checks-proof
          - pre-push-proof
          - repo-native-update-check
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repository-local-action.yml
      - registry/prompts/actionable-next-step-policy.v1.json
      - harness/contracts/execution-boundary-enforcement.v1.json
      - harness/contracts/execution-boundary-taxonomy.v1.json
      - harness/evals/execution-boundaries/boundary-regression-matrix.v1.json

permissions:
  contents: write

concurrency:
  group: repository-local-action-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'prompt-kit-build-proof' || inputs.action }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  CI: "true"

jobs:
  repository-action:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test-floor.txt
      - name: Run reviewed repository-local action
        shell: bash
        env:
          ACTION_ID: ${{ github.event_name == 'pull_request' && 'prompt-kit-build-proof' || inputs.action }}
        run: |
          set -euo pipefail
          python scripts/run_repository_action.py \
            --action "$ACTION_ID" \
            --base-ref "origin/${{ github.event.repository.default_branch }}" \
            --report "Outputs/repository-actions/${ACTION_ID}.json"
      - name: Commit canonical generated Prompt Kit for same-repository PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- web/prompt-kit/index.html; then
            echo "Canonical Prompt Kit already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/index.html
          git commit -m "build(prompt-kit): publish execution boundary policy"
          git push origin "HEAD:${HEAD_REF}"
      - name: Upload local-action receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-local-action-${{ github.event_name == 'pull_request' && 'prompt-kit-build-proof' || inputs.action }}
          path: Outputs/repository-actions/${{ github.event_name == 'pull_request' && 'prompt-kit-build-proof' || inputs.action }}.json
          if-no-files-found: error
