name: Repository local action adapter

on:
  workflow_dispatch:
    inputs:
      action:
        description: Reviewed repository-local action id
        required: true
        type: choice
        options:
          - prompt-kit-proof
          - prompt-kit-build-proof
          - required-checks-proof
          - pre-push-proof
          - repo-native-update-check

permissions:
  contents: read

concurrency:
  group: repository-local-action-${{ github.ref }}-${{ inputs.action }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  CI: "true"

jobs:
  repository-action:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test-floor.txt
      - name: Run reviewed repository-local action
        shell: bash
        env:
          ACTION_ID: ${{ inputs.action }}
        run: |
          set -euo pipefail
          python scripts/run_repository_action.py \
            --action "$ACTION_ID" \
            --base-ref "origin/${{ github.event.repository.default_branch }}" \
            --report "Outputs/repository-actions/${ACTION_ID}.json"
      - name: Upload local-action receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-local-action-${{ inputs.action }}
          path: Outputs/repository-actions/${{ inputs.action }}.json
          if-no-files-found: error
