name: Repository plan durability carrier

on:
  push:
    branches: [fix/repository-plan-durability-20260912]
    paths:
      - '.github/workflows/repository-plan-durability-carrier.yml'
      - 'scripts/_repository_plan_durability_patch_temp.py'

permissions:
  contents: write

jobs:
  patch-build-prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/repository-plan-durability-20260912
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch canonical policy and durable plan owners
        run: python scripts/_repository_plan_durability_patch_temp.py
      - name: Regenerate canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate plan durability and prompt contracts
        run: |
          python -m unittest -v tests.test_repository_plan_durability tests.test_actionable_prompt_registry tests.test_p02_p07_autonomous_iteration
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit durable changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prompts.json registry/prompts/actionable-next-step-policy.v1.json harness/prompt-topology/PHASE_B_C_ROADMAP.md tests/test_repository_plan_durability.py web/prompt-kit/index.html
          git commit -m "fix(prompt-kit): persist actionable repository plans"
          git push origin HEAD:fix/repository-plan-durability-20260912
