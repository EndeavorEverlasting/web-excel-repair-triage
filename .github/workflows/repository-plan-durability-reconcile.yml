name: Repository plan durability reconciliation

on:
  push:
    branches: [fix/repository-plan-durability-20260912]
    paths:
      - '.github/workflows/repository-plan-durability-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile-and-prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/repository-plan-durability-20260912
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge refreshed main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune --tags
          set +e
          git merge --no-edit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "web/prompt-kit/index.html" ]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi
            git checkout --theirs web/prompt-kit/index.html
            git add web/prompt-kit/index.html
            git commit --no-edit
          fi
      - name: Regenerate canonical Prompt Kit from reconciled sources
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate reconciled owners and generated site
        run: |
          python -m unittest -v \
            tests.test_repository_plan_durability \
            tests.test_actionable_prompt_registry \
            tests.test_p02_p07_autonomous_iteration \
            tests.test_p07_phase_continuity \
            tests.test_operational_closeout_contract \
            tests.test_ai_engineering_level_up \
            tests.test_spec_architecture_prompt_registry
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit reconciliation and site convergence
        shell: bash
        run: |
          git add web/prompt-kit/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(prompt-kit): reconcile durability repair with current main"
          fi
      - name: Remove temporary carrier and push
        shell: bash
        run: |
          git rm -f .github/workflows/repository-plan-durability-reconcile.yml
          git commit -m "chore(prompt-kit): remove durability reconciliation carrier"
          git push origin HEAD:fix/repository-plan-durability-20260912
