name: Shared prompt focus interaction repair

on:
  push:
    branches:
      - fix/shared-prompt-focus-interaction-20260921

permissions:
  contents: write

jobs:
  validate-and-regenerate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated UX lane
        uses: actions/checkout@v4
        with:
          ref: fix/shared-prompt-focus-interaction-20260921
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install observed-browser runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Regenerate canonical Prompt Kit
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Validate shared UX contracts and Prompt Kit
        run: |
          set -euo pipefail
          python -m json.tool harness/contracts/ux-interaction-language.v1.json >/dev/null
          python -m json.tool harness/contracts/prompt-kit-cross-input-modality.v1.json >/dev/null
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-polish.js
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_ui_format_alignment.py --require-implementation --summary
          python -m unittest tests.test_prompt_kit_selected_prompt tests.test_prompt_kit_discovery tests.test_prompt_kit_cross_input_modality tests.test_prompt_kit_mobile_quick_controls tests.test_prompt_kit_hotkey_completion tests.test_ux_design_prompt_suite -v
          git diff --check
      - name: Commit generated candidate locally
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Generated site already exact"
          else
            git commit -m "build(prompt-kit): regenerate shared focus interaction"
          fi
          test -z "$(git status --short --untracked-files=no)"
      - name: Prove first-click focus and mode regressions in Chromium
        run: |
          set -euo pipefail
          mkdir -p Outputs/observed-proof
          python tests/prompt_kit_favorite_browser_proof.py --receipt Outputs/observed-proof/shared-focus-receipt.json --screenshot Outputs/observed-proof/shared-focus.png
          python tests/prompt_kit_mobile_quick_controls_browser_proof.py
          python tests/prompt_kit_medium_stability_browser_proof.py
      - name: Push exact validated candidate
        run: |
          set -euo pipefail
          git diff --check
          git push origin HEAD:fix/shared-prompt-focus-interaction-20260921
