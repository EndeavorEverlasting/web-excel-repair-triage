name: Sync generated Prompt Kit on roster validation branch

on:
  push:
    branches:
      - fix/roster-ledger-range-validation-20260821
    paths:
      - .github/workflows/sync-generated-prompt-kit-branch.yml
      - registry/prompts/management-operations-prompts.v1.json

permissions:
  contents: write

jobs:
  sync-generated-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/roster-ledger-range-validation-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build canonical Prompt Kit website
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Prove generated site parity before commit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Commit generated website when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/prompt-kit/index.html; then
            echo "Generated Prompt Kit already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/index.html
          git commit -m "build(prompt-kit): refresh generated website"
          git push origin HEAD:fix/roster-ledger-range-validation-20260821
