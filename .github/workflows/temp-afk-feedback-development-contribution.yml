name: Temporary AFK feedback development contribution

on:
  push:
    branches:
      - feat/prompt-kit-afk-feedback-development-loop-20260826

permissions:
  contents: write

concurrency:
  group: temp-afk-feedback-development-contribution
  cancel-in-progress: false

jobs:
  contribute-validate-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-afk-feedback-development-loop-20260826
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Refresh and pin current contribution floor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/prompt-kit-afk-feedback-development-loop-20260826)"
          git merge-base --is-ancestor origin/main HEAD
          echo "candidate=$(git rev-parse HEAD)"
          echo "main=$(git rev-parse origin/main)"

      - name: Helper contribution and whole-chat pass 2
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/tmp_strengthen_afk_feedback_prompts.py
          python scripts/tmp_strengthen_afk_feedback_prompts.py | tee "$RUNNER_TEMP/afk-feedback-helper-receipt.json"
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_afk_feedback_development_prompt.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("'deduplicate already-consumed signal identities',", "'Deduplicate already-consumed signal identities',")
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git status --short
          git diff --stat

      - name: Pass 1 focused semantic and registry proof
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_afk_feedback_development_prompt \
            tests.test_afk_deterministic_testing_prompt \
            tests.test_test_floor_evolution_prompt \
            tests.test_spec_architecture_prompt_registry \
            tests.test_actionable_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Pass 2 fixed-point falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import build_prompt_kit_registry

          prompts = build_prompt_kit_registry.load_prompt_kit_registry()
          by_id = {p['id']: p for p in prompts}
          matches = [p for p in prompts if p.get('name') == 'AFK Feedback-Driven Development Loop Executor']
          assert len(matches) == 1, len(matches)
          owner = matches[0]
          content = owner['copyContent']
          for phrase in (
              'FEEDBACK IS A WORK QUEUE, NOT A REPORT ENDPOINT',
              'P07-STYLE NONTERMINAL WORK LOOP',
              'A status-only pass is a failed pass when safe agent-capable work exists',
              'developers, scripts, agents, models, PRs',
              'AFK WAKEUPS ARE NOT AFK WORK',
              'COERCE REAL WORK, NOT STATUS THEATER',
              'PROVE THE LOOP IN THE REAL PROVIDER',
              'After every merge/integration, refresh current default-branch truth',
          ):
              assert phrase in content, phrase
          for prompt_id in ('P112', 'P113', 'P105'):
              assert owner['id'] in by_id[prompt_id]['copyContent'], prompt_id
              assert owner['id'] in by_id[prompt_id]['nextStep'], prompt_id
          assert 'P113' in by_id['P112']['copyContent']
          assert 'This pipeline remains promotion-only' in by_id['P105']['copyContent']
          assert Path('web/prompt-kit/index.html').read_text(encoding='utf-8') == build_prompt_kit_registry.render()
          print(json.dumps({'fixed_point': True, 'new_prompt_id': owner['id'], 'prompt_count': len(prompts), 'site_parity': True}))
          PY
          python -m unittest \
            tests.test_afk_feedback_development_prompt \
            tests.test_afk_deterministic_testing_prompt \
            tests.test_test_floor_evolution_prompt \
            tests.test_spec_architecture_prompt_registry -v
          git diff --check

      - name: Remove transport and prove durable contribution
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-afk-feedback-development-contribution.yml scripts/tmp_strengthen_afk_feedback_prompts.py
          python -m unittest \
            tests.test_afk_feedback_development_prompt \
            tests.test_afk_deterministic_testing_prompt \
            tests.test_test_floor_evolution_prompt \
            tests.test_spec_architecture_prompt_registry \
            tests.test_actionable_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git status --short
          git diff --stat

      - name: Commit exact validated durable slice
        shell: bash
        env:
          BRANCH: feat/prompt-kit-afk-feedback-development-loop-20260826
        run: |
          set -euo pipefail
          git fetch origin main "$BRANCH"
          git merge-base --is-ancestor origin/main HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/prompts/spec-architecture-prompts.v1.json \
                  tests/test_afk_feedback_development_prompt.py \
                  tests/test_afk_deterministic_testing_prompt.py \
                  tests/test_test_floor_evolution_prompt.py \
                  tests/test_spec_architecture_prompt_registry.py \
                  web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(prompt-kit): make AFK feedback drive development"
          git push origin "HEAD:$BRANCH"
          echo "durable_head=$(git rev-parse HEAD)"
