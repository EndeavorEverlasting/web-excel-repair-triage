name: Temporary AFK feedback review hardening

on:
  push:
    branches:
      - feat/prompt-kit-afk-feedback-development-loop-20260826

permissions:
  contents: write

concurrency:
  group: temp-afk-feedback-review-hardening
  cancel-in-progress: false

jobs:
  harden-validate-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-afk-feedback-development-loop-20260826
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Refresh exact floor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/prompt-kit-afk-feedback-development-loop-20260826)"
          git merge-base --is-ancestor origin/main HEAD

      - name: Strengthen lifecycle regressions from review feedback
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/tmp_afk_feedback_review_hardening.py
          python scripts/tmp_afk_feedback_review_hardening.py
          python -m py_compile tests/test_afk_deterministic_testing_prompt.py tests/test_afk_feedback_development_prompt.py tests/test_test_floor_evolution_prompt.py tests/test_spec_architecture_prompt_registry.py
          git diff --check

      - name: Focused review-feedback proof
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_afk_feedback_development_prompt tests.test_afk_deterministic_testing_prompt tests.test_test_floor_evolution_prompt tests.test_spec_architecture_prompt_registry tests.test_actionable_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Canonical deterministic floor
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-test-floor.txt
          python scripts/run_deterministic_test_floor.py --report "$RUNNER_TEMP/afk-review-deterministic-floor.json"
          git diff --check

      - name: Remove transport and commit exact validated review repairs
        shell: bash
        env:
          BRANCH: feat/prompt-kit-afk-feedback-development-loop-20260826
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-afk-feedback-review-hardening.yml scripts/tmp_afk_feedback_review_hardening.py
          git fetch origin main "$BRANCH"
          git merge-base --is-ancestor origin/main HEAD
          python -m unittest tests.test_afk_feedback_development_prompt tests.test_afk_deterministic_testing_prompt tests.test_test_floor_evolution_prompt tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_afk_deterministic_testing_prompt.py tests/test_afk_feedback_development_prompt.py tests/test_test_floor_evolution_prompt.py tests/test_spec_architecture_prompt_registry.py
          git diff --cached --check
          git commit -m "test(prompt-kit): pin AFK feedback lifecycle contracts"
          git push origin "HEAD:$BRANCH"
          echo "review_repair_head=$(git rev-parse HEAD)"
