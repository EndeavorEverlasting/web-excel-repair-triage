name: Temporary AFK mainline reconcile

on:
  push:
    branches:
      - feat/prompt-kit-afk-feedback-development-loop-20260826

permissions:
  contents: write

concurrency:
  group: temp-afk-mainline-reconcile
  cancel-in-progress: false

jobs:
  reconcile-validate-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-afk-feedback-development-loop-20260826
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Merge refreshed main and resolve generated output only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf 'merge conflicts:\n%s\n' "$conflicts"
            unexpected="$(printf '%s\n' "$conflicts" | grep -vx 'web/prompt-kit/index.html' || true)"
            test -z "$unexpected" || { echo "unexpected merge conflicts: $unexpected" >&2; exit 1; }
            git checkout --theirs -- web/prompt-kit/index.html
            git add web/prompt-kit/index.html
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          git add web/prompt-kit/index.html
          git diff --check

      - name: Install deterministic floor dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-test-floor.txt

      - name: Prove merged AFK feedback and deterministic floor
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_afk_feedback_development_prompt \
            tests.test_afk_deterministic_testing_prompt \
            tests.test_test_floor_evolution_prompt \
            tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/run_deterministic_test_floor.py --report "$RUNNER_TEMP/afk-mainline-reconcile-floor.json"
          git diff --check

      - name: Remove transport, commit merge, and push exact head
        shell: bash
        env:
          BRANCH: feat/prompt-kit-afk-feedback-development-loop-20260826
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-afk-mainline-reconcile.yml
          git add web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "merge current main into AFK feedback development loop"
          git push origin "HEAD:$BRANCH"
          echo "reconciled_head=$(git rev-parse HEAD)"
