name: Temporary execution-boundary Prompt Kit rebuild

on:
  push:
    branches:
      - feat/execution-boundary-enforcement-architecture-20260918

permissions:
  contents: write

concurrency:
  group: temp-execution-boundary-prompt-kit-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned repository test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test-floor.txt
      - name: Run canonical Prompt Kit build/proof action
        run: |
          set -euo pipefail
          python scripts/run_repository_action.py \
            --action prompt-kit-build-proof \
            --base-ref origin/main \
            --report Outputs/repository-actions/prompt-kit-build-proof.json
      - name: Commit canonical generated Prompt Kit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- web/prompt-kit/index.html; then
            echo "Canonical Prompt Kit already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/index.html
          git commit -m "build(prompt-kit): publish execution boundary policy"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload proof receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: temp-execution-boundary-prompt-kit-build-proof
          path: Outputs/repository-actions/prompt-kit-build-proof.json
          if-no-files-found: warn
