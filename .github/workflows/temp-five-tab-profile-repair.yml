name: Temporary five-tab profile repair

on:
  push:
    branches:
      - feat/prompt-kit-five-tab-named-profiles-20260825

permissions:
  contents: write

jobs:
  repair-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-five-tab-named-profiles-20260825
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh exact branch floor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          git merge-base --is-ancestor origin/main HEAD
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MAIN=$(git rev-parse origin/main)"

      - name: Apply canonical migration and repair transport literals
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_prompt_kit_five_tab_migration.py
          python scripts/apply_prompt_kit_five_tab_migration.py
          python - <<'PY'
          from pathlib import Path

          filtering = Path('tests/test_prompt_kit_filtering_access.py')
          text = filtering.read_text(encoding='utf-8')
          broken = 'end = js.index("\n\nfunction showAddPrompt", start)'
          fixed = 'end = js.index("\\n\\nfunction showAddPrompt", start)'
          count = text.count(broken)
          if count != 1:
              raise SystemExit(f'expected one filtering literal repair, found {count}')
          filtering.write_text(text.replace(broken, fixed, 1), encoding='utf-8')

          order = Path('tests/test_prompt_kit_order_navigation_product.py')
          text = order.read_text(encoding='utf-8')
          repairs = {
              '            "Favorites<span class="kbd">C</span>",': '            \'Favorites<span class="kbd">C</span>\',',
              '        self.assertNotIn("Favorites<span class="kbd">4</span>", polish)': '        self.assertNotIn(\'Favorites<span class="kbd">4</span>\', polish)',
          }
          for broken, fixed in repairs.items():
              count = text.count(broken)
              if count != 1:
                  raise SystemExit(f'expected one order-navigation literal repair, found {count}: {broken}')
              text = text.replace(broken, fixed, 1)
          order.write_text(text, encoding='utf-8')
          PY
          python -m py_compile \
            build_prompt_kit.py \
            scripts/build_prompt_kit_registry.py \
            tests/test_prompt_kit_filtering_access.py \
            tests/test_prompt_kit_header_contract.py \
            tests/test_prompt_kit_hotkey_completion.py \
            tests/test_prompt_kit_profiles.py \
            tests/test_prompt_kit_order_navigation_product.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          git diff --check

      - name: Pass 1 focused product proof
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-polish.js
          node --check docs/prompt-kit-profiles.js
          python tests/test_prompt_kit_header_contract.py
          python -m unittest \
            tests.test_prompt_kit_profiles \
            tests.test_prompt_kit_hotkey_completion \
            tests.test_prompt_kit_filtering_access \
            tests.test_prompt_kit_order_navigation_product -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Pass 2 fixed-point falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          builder = Path('build_prompt_kit.py').read_text(encoding='utf-8')
          base = Path('docs/prompt-kit.js').read_text(encoding='utf-8')
          polish = Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8')
          profiles = Path('docs/prompt-kit-profiles.js').read_text(encoding='utf-8')
          deployed = Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          design = Path('docs/PROMPT_KIT_FIVE_TAB_PROFILES.md').read_text(encoding='utf-8')

          for key, label in [('A','All'),('B','Standard'),('C','Favorites'),('D','SAS'),('E','PM')]:
              assert f'data-profile-slot="{key}"' in builder
              assert f'>{label}<span class="kbd">{key}</span>' in builder
              assert f'data-profile-slot="{key}"' in deployed
          for digit in '12345':
              assert f"case'{digit}'" not in base
              assert f"if(key==='{digit}')" not in polish
          assert "{key:'A',label:'All'}" in polish
          assert "{key:'E',label:'PM'}" in polish
          assert "SLOT_KEYS=['A','B','C','D','E']" in profiles
          assert "promptKit.profileSlots.v1" in profiles
          assert "Digits remain available to configured prompt-ID sequences such as `P111`" in design
          assert "no header shortcut uses `P`" in design
          assert "data-profile-slot=\"D\"" in deployed and "data-profile-slot=\"E\"" in deployed
          assert "Favorites<span class=\"kbd\">C</span>" in deployed
          PY
          python -m unittest discover -s tests -p 'test_prompt_kit_*.py' -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git status --short
          git diff --stat

      - name: Commit exact durable product slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/prompt-kit-five-tab-profile-build.yml
          git rm .github/workflows/temp-five-tab-profile-repair.yml
          git rm scripts/apply_prompt_kit_five_tab_migration.py
          git add \
            build_prompt_kit.py \
            docs/prompt-kit.js \
            docs/prompt-kit-polish.js \
            docs/prompt-kit-profiles.js \
            docs/PROMPT_KIT_FIVE_TAB_PROFILES.md \
            scripts/build_prompt_kit_registry.py \
            tests/test_prompt_kit_header_contract.py \
            tests/test_prompt_kit_hotkey_completion.py \
            tests/test_prompt_kit_profiles.py \
            tests/test_prompt_kit_filtering_access.py \
            tests/test_prompt_kit_order_navigation_product.py \
            web/README.md \
            web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): replace numeric header with five profile tabs'
          git push origin HEAD:feat/prompt-kit-five-tab-named-profiles-20260825
