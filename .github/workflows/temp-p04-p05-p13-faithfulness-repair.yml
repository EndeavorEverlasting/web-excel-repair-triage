# One-shot protected carrier. Removed by the job after a green lifecycle mutation.
name: Temporary P04 P05 P13 faithfulness repair

on:
  push:
    branches:
      - fix/p04-p05-p13-faithfulness-systemic-20260927
    paths:
      - .github/workflows/temp-p04-p05-p13-faithfulness-repair.yml

permissions:
  contents: write

jobs:
  protected-faithfulness-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prove exact triggering head and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git fetch origin main --prune
          git merge-base --is-ancestor a9dad7322d02f8df8370a56382da4b8e2fbbea41 HEAD
          git diff --check origin/main...HEAD

      - name: Execute protected lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/temp_apply_p04_p05_p13_faithfulness_repair.py | tee /tmp/p04-p05-p13-faithfulness-repair.json
          python - <<'PY'
          import json
          receipt=json.load(open("/tmp/p04-p05-p13-faithfulness-repair.json", encoding="utf-8"))
          assert receipt["status"] == "REPAIR_APPLIED"
          assert receipt["cursor_mutator_state"] == "QUARANTINED_CANONICAL_PROMPT_MUTATION"
          assert receipt["runtime_partition_status"] == "INTEGRATED"
          assert receipt["site_parity"] is True
          print("protected repair receipt: PASS")
          PY

      - name: Focused faithfulness and recurrence regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_prompt_runtime_partition_contract \
            tests.test_planning_runtime_partition \
            tests.test_repository_plan_durability \
            tests.test_prompt_regression_safety_prompt \
            tests.test_prompt_quality_history \
            tests.test_skill_prompt_registry \
            tests.test_prompt_kit_mainline_delivery \
            -v

      - name: Canonical semantic and build gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_prompt_regression_safety.py --summary
          python scripts/validate_prompt_topology.py
          python scripts/validate_prompt_semantic_coverage.py
          python scripts/validate_prompt_quality_history.py
          python scripts/validate_prompt_retrospective_evaluations.py
          python scripts/prompt_parallel_dispatch.py validate --manifest Outputs/prompt-parallel-dispatch/manifest.json
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check origin/main...HEAD
          git diff --check

      - name: Remove temporary execution carrier and prove staged hygiene
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/temp_apply_p04_p05_p13_faithfulness_repair.py
          git rm .github/workflows/temp-p04-p05-p13-faithfulness-repair.yml
          git add -A
          git diff --cached --check
          git status --short
          git diff --cached --stat

      - name: Commit protected repair outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(prompt-kit): repair P04 P05 P13 faithfulness and quarantine recurrent mutator"
          git push origin HEAD:"${GITHUB_REF_NAME}"
