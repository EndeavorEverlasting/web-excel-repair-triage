name: Temporary P105 Augment MCP context PR carrier

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prompt-kit-p105-augment-mcp-context-pr
  cancel-in-progress: false

jobs:
  strengthen:
    if: github.event.pull_request.head.ref == 'feat/p105-augment-mcp-context-20260826'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p105-augment-mcp-context-20260826
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Reconcile exact current main floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --prune --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          echo "MAIN_FLOOR=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git status --short

      - name: Apply bounded P105 MCP contract and rebuild
        shell: bash
        run: |
          set -euo pipefail
          python .github/p105_augment_mcp_executor.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Focused semantic and registry proof
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Prove MCP execution semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from scripts import build_prompt_kit_registry

          prompts = {p['id']: p for p in build_prompt_kit_registry.load_prompt_kit_registry()}
          p105 = prompts['P105']
          content = p105['copyContent']
          required = (
              'MCP / SEMANTIC REPOSITORY RETRIEVAL CONTRACT',
              'FIRST EVIDENCE ACTION',
              'Augment Context Engine MCP',
              'Resolve the active MCP server/tool identity from Cursor',
              'promotion authority, validation owners, proof/provenance, and write authority',
              'MCP maps architecture; it does not prove current SHA/base',
              'MCP_RETRIEVAL_BLOCKED',
          )
          for phrase in required:
              assert phrase in content, phrase
          assert content.index(required[0]) < content.index('\nMISSION\n')
          assert 'augment mcp' in p105['keywords']
          assert sum(p['name'] == 'Validated CI/CD Promotion Pipeline Builder' for p in prompts.values()) == 1
          PY

      - name: Remove transport and commit exact durable change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/p105_augment_mcp_executor.py
          rm -f .github/workflows/temp-p105-augment-mcp-context-pr.yml
          git diff --check
          git status --short
          git add registry/prompts/spec-architecture-prompts.v1.json \
                  tests/test_spec_architecture_prompt_registry.py \
                  web/prompt-kit/index.html \
                  .github/p105_augment_mcp_executor.py \
                  .github/workflows/temp-p105-augment-mcp-context-pr.yml
          git diff --cached --check
          git commit -m 'feat(prompt-kit): require Augment MCP discovery in P105'
          git push origin HEAD:feat/p105-augment-mcp-context-20260826

      - name: Prove durable head scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/p105-augment-mcp-context-20260826 main --prune
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/p105-augment-mcp-context-20260826)"
          test ! -e .github/p105_augment_mcp_executor.py
          test ! -e .github/workflows/temp-p105-augment-mcp-context-pr.yml
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$changed"
          allowed=$'registry/prompts/spec-architecture-prompts.v1.json\ntests/test_spec_architecture_prompt_registry.py\nweb/prompt-kit/index.html'
          test "$changed" = "$allowed"
          git log -1 --oneline
