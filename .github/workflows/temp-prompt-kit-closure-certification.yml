name: Temporary Prompt Kit closure certification

on:
  push:
    branches:
      - feat/prompt-kit-five-tab-named-profiles-20260825

permissions:
  contents: write

jobs:
  certify-repair-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-five-tab-named-profiles-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install canonical deterministic-floor dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-test-floor.txt

      - name: Refresh exact main floor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/prompt-kit-five-tab-named-profiles-20260825)"
          git merge-base --is-ancestor origin/main HEAD
          echo "candidate_pre=$(git rev-parse HEAD)"
          echo "main=$(git rev-parse origin/main)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Repair falsified closure obligations
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/repair_prompt_kit_closure_certification.py
          python scripts/repair_prompt_kit_closure_certification.py
          node --check docs/prompt-kit-profiles.js
          node --check docs/prompt-kit-polish.js
          node --check docs/prompt-kit.js
          python -m py_compile \
            tests/test_prompt_kit_profiles.py \
            tests/test_prompt_kit_filtering_access.py \
            tests/prompt_kit_hotkey_identity_browser_proof.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          git diff --check

      - name: Pass 1 focused acceptance proof
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_prompt_kit_header_contract.py
          python -m unittest \
            tests.test_prompt_kit_hotkey_identity_runtime \
            tests.test_prompt_kit_hotkey_header_handoff \
            tests.test_prompt_kit_hotkey_completion \
            tests.test_prompt_kit_profiles \
            tests.test_prompt_kit_filtering_access \
            tests.test_prompt_kit_order_navigation_product -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Pass 2 deterministic floor and falsification review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          profiles=Path('docs/prompt-kit-profiles.js').read_text(encoding='utf-8')
          polish=Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8')
          base=Path('docs/prompt-kit.js').read_text(encoding='utf-8')
          site=Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          access=Path('PROMPT_KIT_ACCESS.md').read_text(encoding='utf-8')
          assert "var MODES=['all','standard','favorites','doctrine','packs'];" in profiles
          assert "['doctrine','Doctrine']" in profiles
          assert "root.activeCat='doctrine'" in profiles
          assert "DOCTRINE:{id:'DOCTRINE'" not in profiles
          assert "GNHF:{id:'GNHF'" in profiles
          assert "if(activeSection){activeSection=null;renderSections();renderTypes();render();return}" in base
          assert "if(activeCat!=='all'){activeCat='all';syncLibraryTabs();renderTypes();render();return}" in base
          assert "{key:'Home',label:'Scroll to top'}" in polish
          assert "{key:'End',label:'Scroll to bottom'}" in polish
          assert "{key:'T',label:'Scroll to top'}" not in polish
          for digit in '12345':
              assert f"if(key==='{digit}')" not in polish
          for key in 'ABCDE':
              assert f'data-profile-slot="{key}"' in site
          assert "Doctrine is a dedicated view mode" in Path('web/README.md').read_text(encoding='utf-8')
          assert "**Doctrine** remains a first-class built-in profile mode" in access
          assert "Press **4** or use the header **Favorites**" not in access
          assert "Doctrine** remains available in the header" not in access
          PY
          python scripts/run_deterministic_test_floor.py --report "$RUNNER_TEMP/deterministic-test-floor-report.json"
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD

      - name: Commit exact certification candidate
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/prompt-kit-profiles.js \
            docs/prompt-kit.js \
            docs/PROMPT_KIT_FIVE_TAB_PROFILES.md \
            PROMPT_KIT_ACCESS.md \
            web/README.md \
            tests/test_prompt_kit_profiles.py \
            tests/test_prompt_kit_filtering_access.py \
            tests/prompt_kit_hotkey_identity_browser_proof.py \
            web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(prompt-kit): preserve Doctrine through A-E profiles'
          echo "candidate=$(git rev-parse HEAD)"

      - name: Install observed browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: User-facing browser falsification pass
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Outputs/observed-proof
          python tests/prompt_kit_favorite_browser_proof.py \
            --receipt Outputs/observed-proof/five-tab-favorite-shortcut-receipt.json \
            --screenshot Outputs/observed-proof/five-tab-favorite-shortcut.png \
            --port 8765
          python scripts/validate_observed_behavior_receipt.py \
            Outputs/observed-proof/five-tab-favorite-shortcut-receipt.json \
            --expected-sha "$(git rev-parse HEAD)" --summary
          python tests/prompt_kit_hotkey_identity_browser_proof.py \
            --receipt Outputs/observed-proof/prompt-hotkey-identity-receipt.json \
            --screenshot Outputs/observed-proof/prompt-hotkey-identity.png \
            --port 8766
          python scripts/validate_observed_behavior_receipt.py \
            Outputs/observed-proof/prompt-hotkey-identity-receipt.json \
            --expected-sha "$(git rev-parse HEAD)" --summary
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('Outputs/observed-proof/prompt-hotkey-identity-receipt.json').read_text())
          by={x['id']:x for x in p['observations']}
          required=[
            'p11_waits_for_longer_prefix',
            'p111_wins_over_p11_prefix',
            'pending_p11_hands_off_to_header_a',
            'incomplete_prefix_hands_off_to_header_b',
            'home_end_page_navigation',
            'numeric_sequences_do_not_drive_header',
            'doctrine_profile_mode_reaches_dedicated_view',
            'doctrine_profile_mode_survives_reload',
          ]
          missing=[k for k in required if k not in by]
          failed=[k for k in required if k in by and not by[k]['passed']]
          assert not missing, missing
          assert not failed, failed
          print(json.dumps({'required_observations':required,'failed':failed}))
          PY

      - name: Remove certification transport and push durable head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git rm \
            .github/workflows/temp-prompt-kit-closure-certification.yml \
            scripts/repair_prompt_kit_closure_certification.py
          git diff --cached --check
          git commit -m 'chore(prompt-kit): remove closure certification transport'
          git push origin HEAD:feat/prompt-kit-five-tab-named-profiles-20260825
          echo "durable=$(git rev-parse HEAD)"
