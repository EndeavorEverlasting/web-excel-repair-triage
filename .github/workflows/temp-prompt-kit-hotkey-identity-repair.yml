name: Temporary Prompt Kit hotkey identity repair

on:
  push:
    branches:
      - feat/prompt-kit-five-tab-named-profiles-20260825
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-validate-commit:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'feat/prompt-kit-five-tab-named-profiles-20260825')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-five-tab-named-profiles-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deterministic floor dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-test-floor.txt

      - name: Refresh and reconcile current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/prompt-kit-five-tab-named-profiles-20260825)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge-base --is-ancestor origin/main HEAD; then
            set +e
            git merge --no-commit --no-ff origin/main
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              for f in $conflicts; do
                case "$f" in
                  build_prompt_kit.py|web/prompt-kit/index.html) git checkout --ours -- "$f" ;;
                  *) echo "unexpected merge conflict: $f" >&2; exit 1 ;;
                esac
              done
            fi
            python - <<'PY'
          from pathlib import Path
          p=Path('build_prompt_kit.py')
          text=p.read_text(encoding='utf-8')
          anchor='    "repo location": "P92", "repository location": "P92", "path drift": "P92", "scattered clones": "P92",\n'
          addition=(
              '    "onedrive path": "P92", "onedrive repository path": "P92", "onedrive desktop": "P92",\n'
              '    "known folder redirection": "P92", "user profile path": "P92", "home directory path": "P92",\n'
              '    "os path resolution": "P92", "environment-derived path": "P92", "path input receipt": "P92",\n'
          )
          if '"onedrive path": "P92"' not in text:
              if text.count(anchor)!=1: raise SystemExit('P92 builder merge anchor drifted')
              text=text.replace(anchor,anchor+addition,1)
              p.write_text(text,encoding='utf-8')
          PY
            git add build_prompt_kit.py web/prompt-kit/index.html registry/prompts/spec-architecture-prompts.v1.json tests/test_spec_architecture_prompt_registry.py
            test -z "$(git diff --name-only --diff-filter=U)"
            git commit -m 'merge current main into five-tab hotkey sprint'
          fi
          git merge-base --is-ancestor origin/main HEAD
          echo "candidate=$(git rev-parse HEAD)"
          echo "main=$(git rev-parse origin/main)"

      - name: Apply complete hotkey namespace repair
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/repair_prompt_kit_hotkey_identity.py scripts/repair_prompt_kit_profile_review.py scripts/repair_prompt_kit_hotkey_identity_handoff.py
          python scripts/repair_prompt_kit_hotkey_identity.py
          python scripts/repair_prompt_kit_profile_review.py
          python scripts/repair_prompt_kit_hotkey_identity_handoff.py
          python -m py_compile \
            tests/test_prompt_kit_hotkey_identity_runtime.py \
            tests/test_prompt_kit_hotkey_header_handoff.py \
            tests/test_prompt_kit_hotkey_completion.py \
            tests/test_prompt_kit_profiles.py \
            tests/test_prompt_kit_header_contract.py \
            tests/prompt_kit_hotkey_identity_browser_proof.py \
            tests/prompt_kit_favorite_browser_proof.py
          node --check docs/prompt-kit-polish.js
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-profiles.js
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          git diff --check

      - name: Pass 1 focused product proof
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_prompt_kit_header_contract.py
          python -m unittest \
            tests.test_prompt_kit_hotkey_identity_runtime \
            tests.test_prompt_kit_hotkey_header_handoff \
            tests.test_prompt_kit_hotkey_completion \
            tests.test_prompt_kit_profiles \
            tests.test_prompt_kit_filtering_access \
            tests.test_prompt_kit_order_navigation_product -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Pass 2 fixed-point and deterministic floor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          polish=Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8')
          base=Path('docs/prompt-kit.js').read_text(encoding='utf-8')
          profiles=Path('docs/prompt-kit-profiles.js').read_text(encoding='utf-8')
          deployed=Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          readme=Path('web/README.md').read_text(encoding='utf-8')
          design=Path('docs/PROMPT_KIT_FIVE_TAB_PROFILES.md').read_text(encoding='utf-8')
          for digit in '12345':
              assert f"if(key==='{digit}')" not in polish
              assert f"case'{digit}'" not in base
          for key in 'ABCDE':
              assert f'data-profile-slot="{key}"' in deployed
          for marker in (
              "{key:'Home',label:'Scroll to top'}",
              "{key:'End',label:'Scroll to bottom'}",
              "if(key==='home')",
              "if(key==='end')",
              "replace(/\\./g,'')",
              "promptShortcutHasLongerPrefix(candidate,gestures)",
              "var pendingExact=promptShortcutBindings[promptShortcutBuffer]||null",
          ):
              assert marker in polish and marker in deployed
          assert "{key:'T',label:'Scroll to top'}" not in polish
          assert "if(key==='t')" not in polish
          assert "['Home','Scroll to top']" in profiles
          assert "['End','Scroll to bottom']" in profiles
          assert '| `Home` | Scroll to top |' in readme
          assert '| `End` | Scroll to bottom |' in readme
          assert '| `T` | Scroll to top |' not in readme
          assert '`Home` scrolls to the true document top' in design
          assert '`End` scrolls to the document bottom' in design
          assert '"onedrive path": "P92"' in Path('build_prompt_kit.py').read_text(encoding='utf-8')
          PY
          python scripts/run_deterministic_test_floor.py --report "$RUNNER_TEMP/deterministic-test-floor-report.json"
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git status --short
          git diff --stat

      - name: Commit exact candidate runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git add \
            build_prompt_kit.py \
            docs/prompt-kit-polish.js \
            docs/prompt-kit-profiles.js \
            docs/PROMPT_KIT_FIVE_TAB_PROFILES.md \
            docs/PROMPT_KIT_HOTKEY_PROGRAM_DESIGN.md \
            registry/prompts/spec-architecture-prompts.v1.json \
            tests/test_spec_architecture_prompt_registry.py \
            tests/test_prompt_kit_hotkey_identity_runtime.py \
            tests/test_prompt_kit_hotkey_header_handoff.py \
            tests/prompt_kit_hotkey_identity_browser_proof.py \
            tests/test_prompt_kit_hotkey_completion.py \
            tests/test_prompt_kit_profiles.py \
            tests/test_prompt_kit_header_contract.py \
            web/README.md \
            web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(prompt-kit): reserve A-E and use Home-End navigation'

      - name: Install observed browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Observe A-E Home-End and prompt identity behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Outputs/observed-proof
          python tests/prompt_kit_favorite_browser_proof.py \
            --receipt Outputs/observed-proof/five-tab-favorite-shortcut-receipt.json \
            --screenshot Outputs/observed-proof/five-tab-favorite-shortcut.png
          python scripts/validate_observed_behavior_receipt.py \
            Outputs/observed-proof/five-tab-favorite-shortcut-receipt.json \
            --expected-sha "$(git rev-parse HEAD)" --summary
          python tests/prompt_kit_hotkey_identity_browser_proof.py \
            --receipt Outputs/observed-proof/prompt-hotkey-identity-receipt.json \
            --screenshot Outputs/observed-proof/prompt-hotkey-identity.png
          python scripts/validate_observed_behavior_receipt.py \
            Outputs/observed-proof/prompt-hotkey-identity-receipt.json \
            --expected-sha "$(git rev-parse HEAD)" --summary

      - name: Remove transport and push durable head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git rm \
            .github/workflows/temp-prompt-kit-hotkey-identity-repair.yml \
            scripts/repair_prompt_kit_hotkey_identity.py \
            scripts/repair_prompt_kit_profile_review.py \
            scripts/repair_prompt_kit_hotkey_identity_handoff.py
          git diff --cached --check
          git commit -m 'chore(prompt-kit): remove hotkey repair transport'
          git push origin HEAD:feat/prompt-kit-five-tab-named-profiles-20260825
