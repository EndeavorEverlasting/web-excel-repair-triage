name: Temporary Prompt Kit classification policy carrier v4

on:
  push:
    branches:
      - feat/prompt-kit-classification-hooks-20260827
    paths:
      - .github/workflows/temporary-classification-policy-carrier-v4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-classification-hooks-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Reapply validated candidate and commit without carrier residue
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import textwrap
          from pathlib import Path

          carrier = Path('.github/workflows/temporary-classification-policy-carrier-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n          python scripts/build_prompt_kit_registry.py"
          if start_marker not in carrier or end_marker not in carrier:
              raise SystemExit('v2 mutation body markers missing')
          body = carrier.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(body), 'classification-carrier-v2-body', 'exec'), {'__name__': '__main__'})

          path = Path('tests/test_prompt_kit_filtering_access.py')
          text = path.read_text(encoding='utf-8')
          requirement = '                "exhaustive_lifecycle_type_mapping",\n'
          anchor = '                "unique_type_filters",\n'
          if requirement not in text:
              if anchor not in text:
                  raise SystemExit('filtering requirement-id assertion anchor missing')
              text = text.replace(anchor, anchor + requirement, 1)
          assertion = '        self.assertIn("exactly one declared lifecycle section", expected["exhaustive_lifecycle_type_mapping"])\n'
          assertion_anchor = '        self.assertIn("at most once", expected["unique_categories"])\n'
          if assertion not in text:
              if assertion_anchor not in text:
                  raise SystemExit('filtering expected-text assertion anchor missing')
              text = text.replace(assertion_anchor, assertion_anchor + assertion, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_prompt_classification_refiner_prompt -v
          python -m unittest tests.test_p77_dataset_component_artifact_hooks -v
          python -m unittest tests.test_prompt_kit_filtering_access -v
          python -m unittest tests.test_prompt_kit_product_interactions -v
          python -m unittest tests.test_prompt_kit_mobile -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output /tmp/prompt-kit-order-navigation-audit.json --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-polish.js
          git diff --check

          git rm .github/workflows/temporary-classification-policy-carrier.yml
          git rm .github/workflows/temporary-classification-policy-carrier-v2.yml
          git rm .github/workflows/temporary-classification-policy-carrier-v3.yml
          git rm .github/workflows/temporary-classification-policy-carrier-v4.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            build_prompt_kit.py \
            scripts/build_prompt_kit_registry.py \
            scripts/prompt_registry_ops.py \
            scripts/prompt_classification.py \
            registry/prompts/prompt-classification.v1.json \
            registry/prompts/management-operations-prompts.v1.json \
            tests/test_prompt_classification_refiner_prompt.py \
            tests/test_p77_dataset_component_artifact_hooks.py \
            tests/test_prompt_kit_filtering_access.py \
            harness/contracts/prompt-kit-filtering.v1.json \
            web/prompt-kit/index.html

          git diff --cached --check
          git status --short

          if git diff --cached --quiet; then
            echo 'No durable diff after classification carrier.' >&2
            exit 1
          fi

          git commit -m 'feat(prompt-kit): enforce lifecycle classification hooks'
          git push origin HEAD:feat/prompt-kit-classification-hooks-20260827
