name: Agentic loop prompt contribution

on:
  push:
    branches:
      - feat/prompt-kit-agentic-loop-convergence-20260819
    paths:
      - '.tmp_agentic_loop_patch.py'
      - '.github/workflows/tmp-agentic-loop-contribution.yml'

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply helper-owned prompt contributions and focused strengthening
        run: python .tmp_agentic_loop_patch.py
      - name: Validate focused and connected contracts
        run: |
          python -m py_compile scripts/prompt_registry_ops.py scripts/build_prompt_kit_registry.py tests/test_agentic_loop_prompts.py
          python -m unittest tests.test_agentic_loop_prompts tests.test_repository_work_ledger_prompt tests.test_actionable_prompt_registry tests.test_green_branch_integration_policy tests.test_remote_freshness_p13_iteration -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit durable contribution only
        run: |
          set -euo pipefail
          cat .tmp-agentic-loop-receipts.json
          rm -f .tmp-agentic-loop-receipts.json
          git rm .tmp_agentic_loop_patch.py .github/workflows/tmp-agentic-loop-contribution.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prompts.json registry/prompts/repository-work-ledger-prompts.v1.json tests/test_agentic_loop_prompts.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "feat(prompt-kit): add continuous agentic loop utilities"
          git push origin HEAD
