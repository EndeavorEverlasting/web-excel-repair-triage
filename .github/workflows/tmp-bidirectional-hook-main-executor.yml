name: Temporary bidirectional hook main executor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-bidirectional-hook-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-bidirectional-repository-hook-router-20260821
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconcile exact current main without carrying executor into feature tree
        run: |
          set -euo pipefail
          git fetch origin main --prune --tags
          echo "feature_pre=$(git rev-parse HEAD)"
          echo "main=$(git rev-parse origin/main)"
          git merge --no-commit --no-ff origin/main
          git rm -f --ignore-unmatch .github/workflows/tmp-bidirectional-hook-main-executor.yml
      - name: Add prompt through repo-owned helper
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py add \
            --input .prompt-contrib/bidirectional-repository-hook.json \
            --registry spec-architecture-prompts \
            | tee "$RUNNER_TEMP/prompt-helper-receipt.json"
          cat "$RUNNER_TEMP/prompt-helper-receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Add focused bidirectional-routing semantic proof
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/prompt-helper-receipt.json" <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          prompt_id = receipt["id"]
          name = receipt["name"]
          path = Path("tests/test_spec_architecture_prompt_registry.py")
          source = path.read_text(encoding="utf-8")
          marker = '\n\nif __name__ == "__main__":\n'
          if marker not in source:
              raise SystemExit("Focused-test insertion marker not found")
          if "test_bidirectional_use_case_hook_routes_intent_and_reverse_ownership" in source:
              raise SystemExit("Focused bidirectional hook test already exists")

          method = f'''
              def test_bidirectional_use_case_hook_routes_intent_and_reverse_ownership(self) -> None:
                  matches = [
                      prompt
                      for prompt in self.full.values()
                      if prompt["name"] == {name!r}
                  ]
                  self.assertEqual(len(matches), 1)
                  prompt = matches[0]
                  content = prompt["copyContent"]
                  raw_content = self.raw[prompt["id"]]["copyContent"]
                  self.assertEqual(prompt["id"], {prompt_id!r})
                  self.assertEqual(prompt["seq"], {prompt_id[1:]!r})
                  self.assertEqual(prompt["copySheet"], {prompt_id + "_COPY_SAFE"!r})
                  self.assertEqual(prompt["profile"], "spec-architecture")
                  self.assertEqual(prompt["color"], "Cyan")
                  self.assertEqual(prompt["class"], "HARNESS / ROUTING ARCHITECTURE")
                  self.assertIn("BIDIRECTIONAL ROUTE CONTRACT", content)
                  self.assertIn("USER INTENT -> TRIGGER / HOOK -> CAPABILITY", content)
                  self.assertIn("SCRIPT / MANIFEST / VALIDATOR / PROMPT / WORKFLOW / CAPABILITY RECORD", content)
                  self.assertIn("INTENT OVER FILENAME", content)
                  self.assertIn("REVERSE-OWNERSHIP QUESTIONS", content)
                  self.assertIn("Why does this resource exist?", content)
                  self.assertIn("What capability or supported use case owns it?", content)
                  self.assertIn("PROVE BOTH DIRECTIONS", content)
                  self.assertIn("A. INTENT-FIRST", content)
                  self.assertIn("B. IMPLEMENTATION-FIRST", content)
                  self.assertIn("without a pre-supplied implementation filename", content)
                  self.assertIn("Do not create a second capabilities registry", content)
                  self.assertIn("Harness Builder may create or repair general harness infrastructure", content)
                  self.assertIn("Progressive-Disclosure factoring may reduce default context", content)
                  self.assertGreater(len(raw_content), 3500)
                  self.assertLess(len(raw_content), 9000)
                  self.assertEqual(prompt["actionabilityPolicy"], self.policy["policy_id"])
                  self.assertIn(self.policy["marker"], content)
                  html = build_prompt_kit_registry.render()
                  self.assertIn({name!r}, html)
          '''
          source = source.replace(marker, "\n" + method + marker, 1)
          path.write_text(source, encoding="utf-8")
          print(f"focused semantic proof inserted for {prompt_id} {name}")
          PY
      - name: Validate helper, focused semantics, language, order, and discovery
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_skill_prompt_registry -v
          python scripts/validate_prompt_kit_order_navigation.py --output "$RUNNER_TEMP/prompt-kit-order-navigation-audit.json" --summary
          python -m unittest tests.test_prompt_kit_order_navigation_contract -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery -v
          python scripts/evaluate_prompt_language.py --output "$RUNNER_TEMP/prompt-language-audit.json" --summary
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit and push reconciled durable feature result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            registry/prompts/spec-architecture-prompts.v1.json \
            tests/test_spec_architecture_prompt_registry.py \
            web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git commit -m "feat(prompt-kit): add bidirectional repository hook router"
          git push origin HEAD:feat/prompt-kit-bidirectional-repository-hook-router-20260821
