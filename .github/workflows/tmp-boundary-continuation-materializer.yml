name: Temporary boundary-continuation materializer

on:
  push:
    branches:
      - fix/prompt-kit-boundary-continuation-all-prompts-20260918

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate boundary continuation sources
        run: |
          python scripts/validate_execution_boundary_enforcement.py --summary
          python -m unittest             tests.test_execution_boundary_enforcement_prompt             tests.test_actionable_prompt_registry             tests.test_correspondence_prompt_registry -v

      - name: Generate canonical Prompt Kit projection
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Commit generated projection only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add web/prompt-kit/index.html
          if git diff --cached --quiet; then
            echo "Canonical projection already current."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(prompt-kit): publish universal boundary continuation [generated]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
