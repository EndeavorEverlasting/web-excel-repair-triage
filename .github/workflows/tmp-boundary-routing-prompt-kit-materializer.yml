name: Temporary boundary-routing Prompt Kit materializer

on:
  pull_request:
    paths:
      - .github/workflows/tmp-boundary-routing-prompt-kit-materializer.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate without write credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate canonical Prompt Kit artifact
        run: |
          set -euo pipefail
          mkdir -p Outputs/prompt-kit-materializer
          python scripts/build_prompt_kit_registry.py --output Outputs/prompt-kit-materializer/index.html

      - name: Upload generated artifact
        uses: actions/upload-artifact@v7
        with:
          name: boundary-routing-prompt-kit-${{ github.event.pull_request.head.sha }}
          path: Outputs/prompt-kit-materializer/index.html
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate for artifact-only publication
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Refuse moved branch
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download generated artifact
        uses: actions/download-artifact@v7
        with:
          name: boundary-routing-prompt-kit-${{ github.event.pull_request.head.sha }}
          path: Outputs/prompt-kit-materializer

      - name: Publish generated file only
        run: |
          set -euo pipefail
          cp Outputs/prompt-kit-materializer/index.html web/prompt-kit/index.html
          git diff --check -- web/prompt-kit/index.html
          if git diff --quiet -- web/prompt-kit/index.html; then
            echo "Canonical Prompt Kit already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/index.html
          git commit -m "build(prompt-kit): refresh boundary-routing projection [generated]"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
