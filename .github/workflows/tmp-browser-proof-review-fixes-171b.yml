name: Temporary browser-proof review fixes 171b

on:
  push:
    branches:
      - feat/harness-prompt-kit-browser-proof-cleanup-20260810

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/harness-prompt-kit-browser-proof-cleanup-20260810
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply bounded migration
        run: python .github/tmp_apply_browser_proof_review_fixes_171.py
      - name: Validate focused and root harnesses
        run: |
          python -m py_compile scripts/validate_harness.py scripts/validate_prompt_kit_browser_proof_cleanup.py tests/test_harness_contract.py tests/test_prompt_kit_browser_proof_cleanup_harness.py
          python scripts/validate_prompt_kit_browser_proof_cleanup.py --summary
          python -m unittest tests.test_prompt_kit_browser_proof_cleanup_harness -v
          python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
          python -m unittest tests.test_harness_contract -v
          git diff --check
      - name: Commit only owned review fixes
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            .ai/skills/prompt-kit-browser-proof-cleanup/SKILL.md \
            ARTIFACT_REGISTRY.md CAPABILITIES.md CODEBASE_MAP.md SKILLS.md TRIGGERS.md WORKFLOW.md \
            harness/manifest.v1.json harness/capabilities.v1.json harness/triggers.v1.json \
            harness/workflows.v1.json harness/artifacts.v1.json harness/validators.v1.json \
            harness/browser-proof-cleanup/manifest.v1.json \
            harness/browser-proof-cleanup/ARTIFACT_REGISTRY.md \
            harness/browser-proof-cleanup/artifacts.v1.json \
            scripts/Clear-PromptKitBrowserProofScratch.ps1 \
            scripts/validate_prompt_kit_browser_proof_cleanup.py \
            scripts/validate_harness.py \
            tests/test_prompt_kit_browser_proof_cleanup_harness.py \
            .github/workflows/prompt-kit-browser-proof-cleanup.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No review-fix changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(harness): register and retain browser-proof cleanup'
          git push origin HEAD:feat/harness-prompt-kit-browser-proof-cleanup-20260810
