name: Temporary P50 actionability hardening

on:
  push:
    branches:
      - feat/prompt-kit-artifact-risk-path-20260822
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden-p50:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-artifact-risk-path-20260822
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconcile stale owner onto current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --prune --tags
          echo "CURRENT_MAIN=$(git rev-parse origin/main)"
          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          echo "merge_rc=$merge_rc"

          for path in \
            .github/workflows/artifact-engines.yml \
            docs/prompts.json \
            registry/prompts/spec-architecture-prompts.v1.json \
            registry/prompts/tutorial-discovery-prompts.v1.json \
            tests/test_actionable_prompt_registry.py \
            web/prompt-kit/index.html
          do
            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              git checkout origin/main -- "$path"
            fi
          done
          git rm -f --ignore-unmatch tests/test_prompt_artifact_risk_path_prompts.py tests/test_prompt_canonical_path_contract.py

          unmerged="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unmerged" ]; then
            echo "Unresolved merge paths remain:" >&2
            echo "$unmerged" >&2
            exit 1
          fi

      - name: Harden canonical P50 without donor-role bloat
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')
          docs_path = root / 'docs/prompts.json'
          docs = json.loads(docs_path.read_text(encoding='utf-8'))
          p50 = next(prompt for prompt in docs if prompt['id'] == 'P50')

          identity = {
              key: p50[key]
              for key in ('id', 'seq', 'name', 'type', 'class', 'color', 'copySheet', 'category')
          }
          before_chars = len(p50['copyContent'])
          print(f'P50_RAW_COPY_CHARS_BEFORE={before_chars}')

          p50['sprintRole'] = (
              'Resolve, enter, and verify the intended local repository before task commands, '
              'executing the directory gate directly when tools permit and returning discovery '
              'commands only when access or proof is genuinely blocked'
          )
          p50['expectedOutput'] = (
              'One verified root; shell-matched directory entry actually executed when agent access '
              'exists; immediate root and remote verification; branch or worktree evidence; and the '
              'first safe repository-backed task step executed from that root, or exact bounded '
              'discovery commands plus blocker evidence when execution access is unavailable.'
          )
          p50['nextStep'] = (
              'After the directory gate passes, immediately execute the first safe repository-backed '
              'step of the requested task from the verified root, then continue with P51, P52, or the '
              'task-specific canonical owner as appropriate. Do not stop at printing location commands '
              'when current tools can run them.'
          )
          p50['proofGate'] = (
              'The requested remote and active git top-level match; when shell or filesystem tools '
              'exist, the agent has entered and re-verified the root and advanced one safe requested-task '
              'step from it; discovery-only output is valid only when tool access, directory proof, or '
              'a genuinely user-only dependency blocks direct execution.'
          )
          p50['copyContent'] = '''PROMPT SURFACE: STANDARD AI. THIS IS NOT A GOODNIGHT, HAVE FUN (GNHF) PROMPT.

RESOLVE, ENTER, AND VERIFY THE LOCAL REPOSITORY BEFORE ANY TASK COMMAND THAT ASSUMES A CHECKOUT. WHEN THIS AGENT HAS SHELL OR FILESYSTEM ACCESS, PERFORM THE DIRECTORY GATE DIRECTLY; DO NOT TURN THE USER INTO THE COMMAND RUNNER.

Repository: xyz_repo_url_or_name
Known local path, if any: xyz_known_or_unknown
Requested task: xyz_task

DIRECTORY GATE
1. Do not assume the current directory, remembered path, repository name, Desktop path, or newest checkout is correct.
2. Resolve the intended checkout by matching candidate remotes to the requested repository and inspecting `git worktree list` when available.
3. When shell/filesystem access exists, inspect candidate roots yourself, select from evidence, enter the verified root with shell-correct syntax, then immediately run `git rev-parse --show-toplevel` and `git remote get-url origin`. Do not merely print `Set-Location`, `cd`, or verification commands for the user to run.
4. If multiple candidates remain, exhaust current-directory, remote, worktree, repository, and operator-supplied evidence before escalating. Ask the user only for a genuinely user-only fact that materially determines the checkout.
5. If the root cannot be proved, or this environment cannot access the local shell/filesystem, return bounded discovery commands only. Do not return tests, builds, mutations, commits, cleanup, or deployment commands from a guessed root.
6. Once the root is proved, execute the first safe repository-backed step needed to advance `xyz_task` from that root, then continue under P51, P52, or the task-specific canonical owner. P50 remains the directory guard; do not absorb a general implementation, review, merge, or deployment role.
7. Re-verify the active root before a later action set when the shell, host, worktree, or execution context changes.

HARNESS CONTEXT
Name repo, branch or worktree, PR or sprint, lane, owned scope, forbidden scope, expected artifacts, validation order, proof level, and proof ceiling.
Search existing contracts, helpers, validators, scripts, manifests, and output patterns before inventing.

ACTIONABILITY BOUNDARY
- Keep agent-capable directory discovery, entry, and verification with the agent.
- Treat immediate root/remote verification as the feedback check for the directory action; a plausible path string is not proof.
- If the requested task needs broader mutation, route execution to its canonical task owner after the directory gate rather than copying that owner's doctrine into P50.
- Discovery-only output is valid only while access or directory proof is genuinely blocked; name that blocker exactly.

FINAL RESPONSE
Report the root evidence, directory action actually executed, root and remote verification, branch or worktree state, and the first requested-task action/result. Only when this environment cannot execute the directory gate, return exact bounded discovery commands plus the blocker and the proof they are intended to obtain.'''

          for key, value in identity.items():
              if p50[key] != value:
                  raise SystemExit(f'P50 identity drifted: {key}: {value!r} -> {p50[key]!r}')

          after_chars = len(p50['copyContent'])
          print(f'P50_RAW_COPY_CHARS_AFTER={after_chars}')
          print(f'P50_RAW_COPY_CHAR_DELTA={after_chars - before_chars:+d}')
          docs_path.write_text(json.dumps(docs, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test_path = root / 'tests/test_actionable_prompt_registry.py'
          test_text = test_path.read_text(encoding='utf-8')
          marker = '    def test_p50_executes_directory_gate_without_absorbing_p07(self) -> None:\n'
          if marker not in test_text:
              anchor = '    def test_policy_rejects_an_empty_next_step(self) -> None:\n'
              if anchor not in test_text:
                  raise SystemExit('Focused test insertion anchor missing')
              method = '''    def test_p50_executes_directory_gate_without_absorbing_p07(self) -> None:\n        raw_prompts = json.loads(\n            (REPO_ROOT / "docs" / "prompts.json").read_text(encoding="utf-8")\n        )\n        raw_p50 = next(prompt for prompt in raw_prompts if prompt["id"] == "P50")\n        effective_p50 = {prompt["id"]: prompt for prompt in self.prompts}["P50"]\n\n        self.assertEqual(raw_p50["name"], "Directory-First Repository Command Guard")\n        self.assertEqual(raw_p50["type"], "ANALYZE + DIRECTORY")\n        self.assertEqual(raw_p50["class"], "STANDARD AI / LOCAL-FIRST REPOSITORY INTAKE")\n        self.assertEqual(raw_p50["copySheet"], "P50_COPY_SAFE")\n        self.assertEqual(raw_p50["category"], "standard")\n\n        for phrase in (\n            "PERFORM THE DIRECTORY GATE DIRECTLY",\n            "Do not merely print `Set-Location`, `cd`, or verification commands",\n            "execute the first safe repository-backed step needed to advance `xyz_task`",\n            "Ask the user only for a genuinely user-only fact",\n            "P50 remains the directory guard",\n            "a plausible path string is not proof",\n        ):\n            self.assertIn(phrase, raw_p50["copyContent"])\n\n        self.assertNotIn(self.policy["marker"], raw_p50["copyContent"])
        self.assertIn(self.policy["marker"], effective_p50["copyContent"])
        for donor_role in (\n            "ITERATIVE SPRINT FIXED-POINT",\n            "MAINLINE CONVERGENCE",\n            "merge the exact validated head",\n        ):\n            self.assertNotIn(donor_role, raw_p50["copyContent"])
        self.assertLessEqual(len(raw_p50["copyContent"]), 3500)
\n'''
              test_text = test_text.replace(anchor, method + anchor, 1)
              test_path.write_text(test_text, encoding='utf-8')
          PY

          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Validate focused semantics and generated parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_actionable_prompt_registry -v
          python -m unittest tests.test_prompt_kit_discovery -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Commit and push exact validated result
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/tmp-canonical-local-path-20260822.yml \
            .prompt-contrib/canonical_path_repair.py \
            .prompt-contrib/tmp-canonical-path-trigger.txt \
            tests/test_prompt_canonical_path_contract.py
          git add docs/prompts.json tests/test_actionable_prompt_registry.py web/prompt-kit/index.html
          git add -u
          git diff --cached --check
          git status --short
          git commit -m "feat(prompt-kit): make P50 directory guard agent-actionable"
          git push origin HEAD:feat/prompt-kit-artifact-risk-path-20260822
