name: Temporary canonical local path target bridge

on:
  pull_request_target:
    types: [reopened]

permissions:
  contents: write

jobs:
  canonical-local-path-repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/prompt-kit-artifact-risk-path-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-artifact-risk-path-20260822
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute bounded canonical path repair
        run: python .prompt-contrib/canonical_path_repair.py
