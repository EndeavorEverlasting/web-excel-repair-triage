name: Temporary classifier observation carrier

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/tmp_classifier_observation_carrier.py
      - .github/workflows/tmp-classifier-observation-carrier.yml

permissions:
  contents: write

concurrency:
  group: tmp-classifier-observation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  mutate-prove-and-push:
    if: github.head_ref == 'feat/prompt-finder-observation-corpus-20260912'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair carrier transport literals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp_classifier_observation_carrier.py')
          text = path.read_text(encoding='utf-8')
          opening = "test_text = r'''"
          closing = "'''\nwrite(test_path, test_text)"
          candidate_old = "candidate_id=hashlib.sha256(f'{source}\\\\0{session_id}'.encode('utf-8')).hexdigest()[:20]"
          candidate_new = "candidate_id=hashlib.sha256(json.dumps([source,session_id],separators=(',',':')).encode('utf-8')).hexdigest()[:20]"
          doc_old = '    design = design.rstrip() + appendix + "\\n"'
          doc_new = '    design = design.rstrip() + appendix.rstrip() + "\\n"'
          metrics_old = 'if metrics.get("case_accuracy") != 1 or metrics.get("primary_route_accuracy") != 1 or metrics.get("recall_at_3") != 1 or metrics.get("determinism") != 1:'
          metrics_new = 'if report.get("verdict") != "pass" or metrics.get("case_pass_rate") != 1 or metrics.get("primary_accuracy") != 1 or metrics.get("required_recall_at_3") != 1 or metrics.get("deterministic_cases") != metrics.get("case_count"):'
          expected = {
              'fixture opening': (opening, 1),
              'fixture closing': (closing, 1),
              'candidate id': (candidate_old, 1),
              'design eof': (doc_old, 1),
              'metric schema': (metrics_old, 1),
          }
          for label, (needle, count) in expected.items():
              actual = text.count(needle)
              if actual != count:
                  raise SystemExit(f'{label} transport repair expected {count} match, found {actual}')
          text = text.replace(opening, 'test_text = r"""', 1)
          text = text.replace(closing, '"""\nwrite(test_path, test_text)', 1)
          text = text.replace(candidate_old, candidate_new, 1)
          text = text.replace(doc_old, doc_new, 1)
          text = text.replace(metrics_old, metrics_new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/tmp_classifier_observation_carrier.py
      - name: Mutate bounded sources and run proof
        run: python scripts/tmp_classifier_observation_carrier.py
      - name: Commit exact durable result and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            docs/prompt-kit-feedback-production.js \
            docs/prompt-kit-guided-recommendations.js \
            docs/PROMPT_KIT_FEEDBACK_POLLING_DESIGN.md \
            scripts/prompt_kit_feedback_hook.py \
            tests/test_prompt_finder_observation_pipeline.py \
            .github/workflows/prompt-kit-feedback-hook.yml \
            web/prompt-kit/index.html \
            scripts/tmp_classifier_observation_carrier.py \
            .github/workflows/tmp-classifier-observation-carrier.yml
          git diff --cached --check
          git status --short
          git commit -m "feat(prompt-kit): mine classifier observation candidates"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
