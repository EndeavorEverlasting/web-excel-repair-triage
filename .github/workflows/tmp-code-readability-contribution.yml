name: Temporary code readability prompt contribution

on:
  push:
    branches:
      - feat/prompt-kit-code-readability-20260830

permissions:
  contents: write

concurrency:
  group: tmp-code-readability-contribution
  cancel-in-progress: false

jobs:
  execute:
    if: github.ref == 'refs/heads/feat/prompt-kit-code-readability-20260830'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-code-readability-20260830
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add, strengthen, reverse-sweep, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/prompt-kit-code-readability-20260830 --prune
          test "$(git branch --show-current)" = "feat/prompt-kit-code-readability-20260830"
          git merge-base --is-ancestor 781616a1a42893fb5b521e41b217f5cef04b2701 HEAD

          if [ ! -f tmp/apply_code_readability_contribution.py ]; then
            echo 'Contribution carrier already consumed.'
            exit 0
          fi

          python tmp/apply_code_readability_contribution.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

          python -m py_compile \
            build_prompt_kit.py \
            scripts/prompt_registry_ops.py \
            tests/test_spec_architecture_prompt_registry.py
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          python - <<'PY'
          from scripts import build_prompt_kit_registry
          import build_prompt_kit
          prompts = build_prompt_kit_registry.load_prompt_kit_registry()
          matches = [p for p in prompts if p.get('name') == 'Repository Code Readability & Structural Refactorer']
          assert len(matches) == 1, matches
          owner = matches[0]
          assert 'DO NOT REPLACE A MONOLITH WITH A MAZE' in owner['copyContent']
          assert build_prompt_kit.SYNONYMS['code readability'] == owner['id']
          assert build_prompt_kit.SYNONYMS['structural refactor'] == owner['id']
          by_id = {p['id']: p for p in prompts}
          assert 'CODE READABILITY / EDITABILITY FLOOR' in by_id['P07']['copyContent']
          assert 'READABILITY / STRUCTURAL EDITABILITY CHECK' in by_id['P14']['copyContent']
          assert 'do not misclassify evidenced structural editability debt as speculative refactoring' in by_id['P03']['copyContent']
          print(f"SECOND_PASS_FIXED_POINT owner={owner['id']} prompts={len(prompts)} specialists_preserved=P76,P78,P63,P68,P04,P06")
          PY

          git add \
            docs/prompts.json \
            registry/prompts/spec-architecture-prompts.v1.json \
            build_prompt_kit.py \
            tests/test_spec_architecture_prompt_registry.py \
            web/prompt-kit/index.html
          git rm tmp/apply_code_readability_contribution.py tmp/code-readability-prompt-draft.json
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): add code readability refactor workflow'
          git push origin HEAD:feat/prompt-kit-code-readability-20260830
