name: Temporary conversation context Canary repair v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prompt-kit-conversation-context-canary-repair-v2
  cancel-in-progress: false

jobs:
  reconcile-prove-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/p114-conversation-context-canary-20260825'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p114-conversation-context-canary-20260825
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Establish refreshed main and exact transport floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "9ddd91a979a5b155b9adf0dd84c72cd07afb4777"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          echo "main-floor=$(git rev-parse origin/main)"
          echo "transport-head=$(git rev-parse HEAD)"

      - name: Reconcile P02 boundary from current owner evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          draft_path = Path('.github/tmp-conversation-context-canary-draft.json')
          draft = json.loads(draft_path.read_text(encoding='utf-8'))
          content = draft['copyContent']
          content = content.replace(
              'For a full multi-sprint conversation closeout and launch map, use P02; this Canary owns continuity detection and the smallest viable handoff, not full project decomposition.',
              'For a fresh-chat continuation that must recover a previous conversation and resume active implementation, use P02; this Canary owns continuity detection and the smallest viable handoff, while P02 owns the resumed execution.'
          )
          content = content.replace(
              '- P02 owns full conversation closeout, sprint mapping, and executable launch packs. Use it when the continuation needs project decomposition rather than a small continuity packet.',
              '- P02 owns previous-chat recovery and active sprint execution after a new chat starts. Use it to consume a Canary handoff and resume implementation; do not duplicate its execution doctrine here.'
          )
          if 'P02 owns full conversation closeout' in content:
              raise SystemExit('stale P02 boundary survived reconciliation')
          if 'P02 owns previous-chat recovery and active sprint execution' not in content:
              raise SystemExit('current P02 boundary was not installed')
          draft['copyContent'] = content
          draft_path.write_text(json.dumps(draft, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test_path = Path('tests/test_conversation_context_canary_prompt.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              '"Conversation Closeout + Executable Harness-Build Sprint Mapper",',
              '"Previous Chat → Active Sprint Executor",'
          )
          tests = tests.replace(
              'self.assertIn("P02 owns full conversation closeout", self.target["copyContent"])',
              'self.assertIn("P02 owns previous-chat recovery and active sprint execution", self.target["copyContent"])'
          )
          if 'Conversation Closeout + Executable Harness-Build Sprint Mapper' in tests:
              raise SystemExit('stale P02 test identity survived reconciliation')
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Allocate canonical Canary through helper
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py add \
            --input .github/tmp-conversation-context-canary-draft.json \
            --registry spec-architecture-prompts | tee /tmp/canary-helper-receipt.json
          python - <<'PY'
          import json
          receipt = json.load(open('/tmp/canary-helper-receipt.json', encoding='utf-8'))
          assert receipt['status'] == 'added', receipt
          assert receipt['name'] == 'Conversation Context Canary & Handoff Guard', receipt
          assert receipt['registry_id'] == 'spec-architecture-prompts', receipt
          assert receipt['site_parity'] is True, receipt
          print('HELPER_RECEIPT=' + json.dumps(receipt, sort_keys=True))
          PY

      - name: Remove all transport-only surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/tmp-conversation-context-canary-draft.json
          rm -f .github/workflows/tmp-conversation-context-canary.yml
          rm -f .github/workflows/tmp-conversation-context-canary-repair.yml
          rm -f .github/workflows/tmp-conversation-context-canary-repair-v2.yml

      - name: Focused proof and current-owner validation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_conversation_context_canary_prompt -v
          python -m unittest tests.test_deterministic_test_floor -v
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_skill_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --output /tmp/canary-order-navigation.json --summary
          python scripts/evaluate_prompt_language.py --output /tmp/canary-language-audit.json --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Whole-chat pass-two falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('registry/prompts/spec-architecture-prompts.v1.json').read_text(encoding='utf-8'))
          matches = [p for p in payload['prompts'] if p.get('name') == 'Conversation Context Canary & Handoff Guard']
          if len(matches) != 1:
              raise SystemExit(f'Canary owner count invalid: {len(matches)}')
          p = matches[0]
          c = p['copyContent']
          checks = {
              'profile every response': 'Before every response, emit one compact first line' in c,
              'computer profile signal': 'CANARY | PROFILE=<canonical computer profile>' in c,
              'unknown fails closed': 'CANARY | PROFILE=UNKNOWN' in c,
              'no fake context telemetry': 'not mathematical proof that the context window is exhausted' in c,
              'one bounded re-anchor': 'RE-ANCHOR ONCE' in c,
              'repeat failure hands off': 'HANDOFF ON REPEATED OR UNRECOVERABLE DRIFT' in c,
              'one canonical owner': 'ONE CANONICAL CONTRACT, LIGHTWEIGHT EMBEDDING' in c,
              'light embedded stub': 'CANARY STUB — Before every response emit CANARY | PROFILE=<canonical computer profile>' in c,
              'current P02 boundary': 'P02 owns previous-chat recovery and active sprint execution' in c,
              'P76 boundary': 'P76 owns repository spec/harness progressive disclosure' in c,
              'agent control limit': 'Do not pretend that the agent can terminate the current chat or open the next one itself' in c,
              'stale P02 boundary removed': 'P02 owns full conversation closeout' not in c,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'Canary semantic falsification failed: {failed}')
          print(f'SEMANTIC_FALSIFICATION=PASS checks={len(checks)} id={p["id"]}')
          PY

      - name: Run full repository pre-push contract
        shell: bash
        run: |
          set -euo pipefail
          sh .githooks/pre-push

      - name: Commit bounded durable tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "9ddd91a979a5b155b9adf0dd84c72cd07afb4777"
          git add -A
          git diff --cached --check
          echo 'durable changed surfaces:'
          git diff --cached --name-only | sort
          git commit -m "feat(prompt-kit): add conversation context Canary"
          echo "DURABLE_HEAD=$(git rev-parse HEAD)"

      - name: Re-prove exact committed head
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_conversation_context_canary_prompt -v
          python -m unittest tests.test_deterministic_test_floor -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          sh .githooks/pre-push
          test -z "$(git status --porcelain)"
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "9ddd91a979a5b155b9adf0dd84c72cd07afb4777"
          echo "EXACT_PROVEN_HEAD=$(git rev-parse HEAD)"

      - name: Publish exact validated head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/p114-conversation-context-canary-20260825
