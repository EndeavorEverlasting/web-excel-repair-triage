name: Temporary conversation context Canary builder

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prompt-kit-conversation-context-canary
  cancel-in-progress: false

jobs:
  build-and-prove:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/p114-conversation-context-canary-20260825'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p114-conversation-context-canary-20260825
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Establish fresh exact floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "9ddd91a979a5b155b9adf0dd84c72cd07afb4777"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          echo "main-floor=$(git rev-parse origin/main)"
          echo "carrier-head=$(git rev-parse HEAD)"

      - name: Add canonical Canary through registry helper
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/conversation-context-canary.json <<'JSON'
          {
            "name": "Conversation Context Canary & Handoff Guard",
            "type": "MONITOR + HANDOFF",
            "class": "CONTEXT / CONTINUITY",
            "sprintRole": "Keep a tiny per-response computer-profile signal visible during ordinary AI work so context drift is caught early, recoverable drift is re-anchored once, and repeated degradation produces a clean fresh-chat handoff before useful workflow state is lost",
            "useWhen": "A long-running AI conversation depends on a stable computer profile or execution identity and the operator wants a lightweight visible signal on every response that can reveal context drift before the chat becomes unreliable.",
            "inspectFirst": "The current conversation's explicitly established computer profile and active execution identity; when repository work is active, the canonical profile/path owner plus current repo, branch, lane, and task evidence; the latest proven artifacts or handoff state; and any accessible prior context needed to recover those facts without asking the operator to repeat them.",
            "expectedOutput": "One compact Canary line before every response, anchored to the canonical computer profile and only the smallest already-established execution fields that matter; fail-closed UNKNOWN handling instead of invented identity; one bounded re-anchor attempt on drift; and a compact continuity handoff when drift repeats or core execution identity can no longer be recovered reliably.",
            "nextStep": "Keep doing the user's substantive work while the Canary remains semantically correct; on the first material mismatch recover the authoritative profile and current task from accessible evidence, and on repeated or unrecoverable drift emit the continuity handoff that lets the operator open a fresh conversation with the same proven floor.",
            "proofGate": "Representative multi-response sequences keep the Canary compact and semantically stable; a seeded omission or wrong profile is detected and recoverable from authoritative context; unknown identity is never fabricated; stylistic variation is not falsely treated as context exhaustion; repeated drift crosses the handoff threshold; and the handoff preserves the current task, proof floor, forbidden scope, and first executable continuation without duplicating full closeout or context-factoring owners.",
            "profile": "spec-architecture",
            "copyContent": "RUN A LIGHTWEIGHT CONVERSATION CANARY THROUGHOUT THE CHAT. DO NOT TURN IT INTO A SECOND TASK REPORT, A GIANT HEADER, OR A TOKEN COUNTER.\n\nCANARY ANCHOR\nComputer profile: xyz_profile_or_resolve_from_accessible_context\nRepository, branch, and lane: include only when they are already established and materially affect the current work.\n\nMISSION\nMake silent context drift visible early enough to preserve workflow continuity. The computer profile is the primary repeated canary because it is small, stable, operationally meaningful, and easy for the operator to notice when an agent begins forgetting or substituting context. Keep the signal lighter than the work it protects.\n\nMANDATORY FIRST LINE\nBefore every response, emit one compact first line:\n`CANARY | PROFILE=<canonical computer profile>`\nWhen repository identity materially affects the response and those values are already established, the line may append only the useful fields:\n` | REPO=<repo> | BRANCH=<branch> | LANE=<lane>`\nDo not expand the normal Canary into scope narration, a status report, a checklist, or a recap. The substantive answer begins immediately after it.\n\nAUTHORITATIVE PROFILE RULE\nUse the strongest accessible current evidence for the computer profile: explicit current-chat state, repository-owned profile/path contracts, active harness state, or a current handoff. Prefer current evidence over remembered model context. Never invent a machine, profile, path, repo, branch, or lane merely to keep the Canary populated. If the computer profile cannot be recovered, emit `CANARY | PROFILE=UNKNOWN` and execute the re-anchor procedure. Do not ask the operator to repeat recoverable context.\n\nCANARY IS A SENSOR, NOT PROOF\nA wrong or missing canary is a drift signal, not mathematical proof that the context window is exhausted. Do not claim a token count, context percentage, or remaining-window estimate unless the runtime actually exposes authoritative telemetry. Do not treat harmless wording changes as drift when the semantic computer profile and active task identity remain correct. Stronger drift evidence includes a wrong or omitted profile, contradiction of established repo/branch/lane facts, forgetting current mission or forbidden scope, reintroducing closed decisions, or repeatedly losing the last proven state.\n\nNORMAL LOOP\n1. Emit the one-line Canary before every response.\n2. Perform the actual requested work normally.\n3. Keep the Canary semantically stable and compact; optional repo/branch/lane fields appear only when they help detect a material execution-context error.\n4. Refresh the Canary from newer authoritative evidence when the machine/profile or execution lane legitimately changes. A legitimate change is not drift when current evidence explains it.\n\nRE-ANCHOR ONCE\nOn the first material Canary mismatch, omission, contradiction, or `PROFILE=UNKNOWN`:\n- stop adding new scope while identity is uncertain;\n- recover the canonical computer profile and current task from accessible chat, repository, harness, artifact, or handoff evidence;\n- correct the Canary explicitly;\n- verify the current mission, last proven state, and next action still agree with that evidence;\n- continue the requested work when the re-anchor succeeds.\nDo not force a new conversation for one recoverable slip. Do not make the operator serve as a context courier when the evidence is accessible to the agent.\n\nHANDOFF ON REPEATED OR UNRECOVERABLE DRIFT\nCross the handoff threshold when the Canary fails again after a re-anchor, the canonical profile remains unrecoverable, or multiple core execution facts continue contradicting established evidence. At that point, stop expanding the current conversation's work and emit a compact continuity packet containing:\n- canonical computer profile or explicit UNKNOWN blocker;\n- repo, branch, PR, lane, and scope only when active;\n- current mission and forbidden scope;\n- last proven artifacts, SHAs, checks, or other evidence;\n- unresolved gap or blocker;\n- the first executable next action.\nThen state that the operator should continue with that packet in a fresh conversation. Do not pretend that the agent can terminate the current chat or open the next one itself. For a full multi-sprint conversation closeout and launch map, use P02; this Canary owns continuity detection and the smallest viable handoff, not full project decomposition.\n\nONE CANONICAL CONTRACT, LIGHTWEIGHT EMBEDDING\nMaintain this prompt as the full Canary owner. Other prompts and normal chats should embed only the lightweight stub when continuous context monitoring is useful; do not paste this entire contract into every prompt. Recommended embedded form:\n`CANARY STUB — Before every response emit CANARY | PROFILE=<canonical computer profile>. Never invent it: use PROFILE=UNKNOWN and re-anchor from accessible evidence. Repeated or unrecoverable profile/context drift => emit a compact fresh-chat handoff.`\nThe host prompt still owns its mission, scope, proof, and closure. The Canary stub owns only the repeated identity signal and drift-to-handoff transition. This keeps the mechanism portable without multiplying authorities or consuming the context it is meant to protect.\n\nBOUNDARIES WITH NEIGHBOR OWNERS\n- P02 owns full conversation closeout, sprint mapping, and executable launch packs. Use it when the continuation needs project decomposition rather than a small continuity packet.\n- P76 owns repository spec/harness progressive disclosure and context-budget reduction. Use it when the problem is repository information architecture rather than a drifting live conversation.\n- Repository machine/profile/path contracts remain authoritative for what the computer profile actually is; this Canary observes those facts and must not create a competing profile registry.\n\nFAIL-CLOSED RULES\n- Never fabricate the profile or silently substitute a different machine.\n- Never infer context exhaustion from style alone.\n- Never bloat every response with a full sprint declaration just to prove the Canary is alive.\n- Never keep working through repeated identity contradictions merely because the answer still sounds plausible.\n- Never let the continuity packet claim proof that the current chat did not actually establish.\n- Never duplicate P02 or P76 inside the Canary.\n\nSEMANTIC FALSIFICATION\nExercise at least these representative sequences when implementing or testing the prompt: stable profile across several responses; one seeded omission; one seeded wrong profile; successful recovery from authoritative context; a legitimate profile change backed by new evidence; harmless wording variation with stable identity; repeated drift after re-anchor; and unrecoverable profile state. The expected terminal behavior is ordinary continuation for stable/recovered cases and a compact fresh-chat handoff for repeated/unrecoverable drift.\n\nDELIVER\nKeep the normal Canary to one line. When a handoff is required, keep it small but evidence-bearing: profile, active execution identity, mission, proven floor, gap, forbidden scope, and first executable continuation. The purpose is to preserve momentum, not to make every response heavier.",
            "keywords": [
              "canary prompt",
              "context canary",
              "conversation drift",
              "context drift",
              "computer profile",
              "machine profile",
              "per-response profile",
              "fresh chat handoff",
              "context window handoff",
              "conversation continuity",
              "re-anchor context",
              "lightweight prompt stub"
            ]
          }
          JSON
          python scripts/prompt_registry_ops.py add --input /tmp/conversation-context-canary.json --registry spec-architecture-prompts | tee /tmp/canary-helper-receipt.json
          python - <<'PY'
          import json
          receipt = json.load(open('/tmp/canary-helper-receipt.json', encoding='utf-8'))
          assert receipt['status'] == 'added', receipt
          assert receipt['name'] == 'Conversation Context Canary & Handoff Guard', receipt
          assert receipt['registry_id'] == 'spec-architecture-prompts', receipt
          assert receipt['site_parity'] is True, receipt
          print('helper-receipt', json.dumps(receipt, sort_keys=True))
          PY

      - name: Add focused semantic regression and deterministic-floor registration
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_conversation_context_canary_prompt.py <<'PY'
          from __future__ import annotations

          import json
          import unittest
          from pathlib import Path

          from scripts import build_prompt_kit_registry


          REPO_ROOT = Path(__file__).resolve().parents[1]
          RAW_REGISTRY = REPO_ROOT / "registry" / "prompts" / "spec-architecture-prompts.v1.json"
          TEST_FLOOR = REPO_ROOT / "harness" / "test-floor.v1.json"
          TARGET_NAME = "Conversation Context Canary & Handoff Guard"
          TEST_PATH = "tests/test_conversation_context_canary_prompt.py"


          class ConversationContextCanaryPromptTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.full = build_prompt_kit_registry.load_prompt_kit_registry()
                  cls.by_id = {prompt["id"]: prompt for prompt in cls.full}
                  matches = [prompt for prompt in cls.full if prompt.get("name") == TARGET_NAME]
                  if len(matches) != 1:
                      raise AssertionError(f"expected one {TARGET_NAME!r}, found {len(matches)}")
                  cls.target = matches[0]
                  raw_prompts = json.loads(RAW_REGISTRY.read_text(encoding="utf-8"))["prompts"]
                  raw_matches = [prompt for prompt in raw_prompts if prompt.get("name") == TARGET_NAME]
                  if len(raw_matches) != 1:
                      raise AssertionError(f"expected one raw {TARGET_NAME!r}, found {len(raw_matches)}")
                  cls.raw = raw_matches[0]

              def test_helper_owns_identity_and_profile(self) -> None:
                  self.assertRegex(self.target["id"], r"^P\d+$")
                  self.assertEqual(self.target["seq"], self.target["id"][1:])
                  self.assertEqual(self.target["copySheet"], f"{self.target['id']}_COPY_SAFE")
                  self.assertEqual(self.target["profile"], "spec-architecture")
                  self.assertEqual(self.target["class"], "CONTEXT / CONTINUITY")
                  self.assertEqual(self.raw["id"], self.target["id"])

              def test_canary_requires_small_computer_profile_signal_every_response(self) -> None:
                  content = self.target["copyContent"]
                  for phrase in (
                      "MANDATORY FIRST LINE",
                      "Before every response, emit one compact first line",
                      "CANARY | PROFILE=<canonical computer profile>",
                      "Do not expand the normal Canary into scope narration",
                      "Keep the normal Canary to one line",
                  ):
                      self.assertIn(phrase, content)

              def test_unknown_profile_fails_closed_and_reanchors_from_evidence(self) -> None:
                  content = self.target["copyContent"]
                  for phrase in (
                      "CANARY | PROFILE=UNKNOWN",
                      "Never invent a machine, profile, path, repo, branch, or lane",
                      "RE-ANCHOR ONCE",
                      "Do not ask the operator to repeat recoverable context",
                  ):
                      self.assertIn(phrase, content)

              def test_canary_is_signal_not_fake_context_telemetry(self) -> None:
                  content = self.target["copyContent"]
                  self.assertIn("CANARY IS A SENSOR, NOT PROOF", content)
                  self.assertIn("not mathematical proof that the context window is exhausted", content)
                  self.assertIn("Do not claim a token count, context percentage, or remaining-window estimate", content)
                  self.assertIn("Do not treat harmless wording changes as drift", content)

              def test_repeated_drift_crosses_to_evidence_bearing_handoff(self) -> None:
                  content = self.target["copyContent"]
                  for phrase in (
                      "HANDOFF ON REPEATED OR UNRECOVERABLE DRIFT",
                      "fails again after a re-anchor",
                      "current mission and forbidden scope",
                      "last proven artifacts, SHAs, checks, or other evidence",
                      "first executable next action",
                      "Do not pretend that the agent can terminate the current chat or open the next one itself",
                  ):
                      self.assertIn(phrase, content)

              def test_one_canonical_contract_exports_only_a_lightweight_stub(self) -> None:
                  content = self.target["copyContent"]
                  self.assertIn("ONE CANONICAL CONTRACT, LIGHTWEIGHT EMBEDDING", content)
                  self.assertIn("do not paste this entire contract into every prompt", content)
                  self.assertIn("CANARY STUB — Before every response emit CANARY | PROFILE=<canonical computer profile>", content)
                  self.assertIn("The host prompt still owns its mission, scope, proof, and closure", content)

              def test_neighbor_owners_remain_distinct(self) -> None:
                  self.assertEqual(self.by_id["P02"]["name"], "Conversation Closeout + Executable Harness-Build Sprint Mapper")
                  self.assertEqual(self.by_id["P76"]["name"], "Progressive-Disclosure Spec & Harness Factorer")
                  self.assertNotEqual(self.target["id"], "P02")
                  self.assertNotEqual(self.target["id"], "P76")
                  self.assertIn("P02 owns full conversation closeout", self.target["copyContent"])
                  self.assertIn("P76 owns repository spec/harness progressive disclosure", self.target["copyContent"])

              def test_semantic_falsification_cases_are_explicit(self) -> None:
                  content = self.target["copyContent"]
                  for phrase in (
                      "SEMANTIC FALSIFICATION",
                      "stable profile across several responses",
                      "one seeded omission",
                      "one seeded wrong profile",
                      "a legitimate profile change backed by new evidence",
                      "repeated drift after re-anchor",
                      "unrecoverable profile state",
                  ):
                      self.assertIn(phrase, content)

              def test_registered_in_deterministic_test_floor(self) -> None:
                  floor = json.loads(TEST_FLOOR.read_text(encoding="utf-8"))
                  self.assertEqual(floor["self_tests"].count(TEST_PATH), 1)
                  self.assertTrue(any(TEST_PATH.startswith(pattern.removesuffix("*")) for pattern in floor["prompt_semantic_test_globs"]))

              def test_generated_site_is_exact_and_contains_canary(self) -> None:
                  html = build_prompt_kit_registry.DEFAULT_OUTPUT.read_text(encoding="utf-8")
                  self.assertEqual(html, build_prompt_kit_registry.render())
                  self.assertIn(self.target["id"], html)
                  self.assertIn(TARGET_NAME, html)


          if __name__ == "__main__":
              unittest.main()
          PY

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('harness/test-floor.v1.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          test_path = 'tests/test_conversation_context_canary_prompt.py'
          self_tests = payload['self_tests']
          if test_path not in self_tests:
              anchor = 'tests/test_correspondence_prompt_registry.py'
              index = self_tests.index(anchor)
              self_tests.insert(index, test_path)
          if self_tests.count(test_path) != 1:
              raise SystemExit('Canary focused test registration is not unique')
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Focused proof and whole-owner validation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_conversation_context_canary_prompt -v
          python -m unittest tests.test_deterministic_test_floor -v
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_skill_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --output /tmp/canary-order-navigation.json --summary
          python scripts/evaluate_prompt_language.py --output /tmp/canary-language-audit.json --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          sh .githooks/pre-push

      - name: Second-pass semantic falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('registry/prompts/spec-architecture-prompts.v1.json').read_text(encoding='utf-8'))
          matches = [p for p in payload['prompts'] if p.get('name') == 'Conversation Context Canary & Handoff Guard']
          if len(matches) != 1:
              raise SystemExit(f'Canary owner count invalid: {len(matches)}')
          p = matches[0]
          c = p['copyContent']
          checks = {
              'computer-profile primary signal': 'CANARY | PROFILE=<canonical computer profile>' in c,
              'every-response cadence': 'Before every response, emit one compact first line' in c,
              'unknown fails closed': 'CANARY | PROFILE=UNKNOWN' in c,
              'signal not token proof': 'not mathematical proof that the context window is exhausted' in c,
              'one bounded re-anchor': 'RE-ANCHOR ONCE' in c,
              'repeated-drift handoff': 'HANDOFF ON REPEATED OR UNRECOVERABLE DRIFT' in c,
              'single canonical owner': 'ONE CANONICAL CONTRACT, LIGHTWEIGHT EMBEDDING' in c,
              'lightweight embedded stub': 'CANARY STUB — Before every response emit CANARY | PROFILE=<canonical computer profile>' in c,
              'P02 boundary': 'P02 owns full conversation closeout' in c,
              'P76 boundary': 'P76 owns repository spec/harness progressive disclosure' in c,
              'agent control limit': 'Do not pretend that the agent can terminate the current chat or open the next one itself' in c,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'Canary semantic falsification failed: {failed}')
          print('semantic-falsification=PASS', len(checks))
          PY

      - name: Commit durable exact-head candidate and self-remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "9ddd91a979a5b155b9adf0dd84c72cd07afb4777"
          rm -f .github/workflows/tmp-conversation-context-canary.yml
          git add registry/prompts/spec-architecture-prompts.v1.json \
                  harness/test-floor.v1.json \
                  tests/test_conversation_context_canary_prompt.py \
                  web/prompt-kit/index.html \
                  .github/workflows/tmp-conversation-context-canary.yml
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/tmp-conversation-context-canary.yml|harness/test-floor.v1.json|registry/prompts/spec-architecture-prompts.v1.json|tests/test_conversation_context_canary_prompt.py|web/prompt-kit/index.html)$' || true)"
          test -z "$unexpected"
          git commit -m "feat(prompt-kit): add conversation context Canary"
          echo "durable-head=$(git rev-parse HEAD)"

      - name: Re-prove exact committed durable head
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_conversation_context_canary_prompt -v
          python -m unittest tests.test_deterministic_test_floor -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          sh .githooks/pre-push
          test -z "$(git status --porcelain)"
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "9ddd91a979a5b155b9adf0dd84c72cd07afb4777"
          echo "exact-proven-head=$(git rev-parse HEAD)"

      - name: Publish validated feature head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/p114-conversation-context-canary-20260825
