name: Temporary correspondence exhaustive compute carrier

on:
  push:
    branches:
      - prompt-kit/recipient-need-gate-20260909
    paths:
      - '.github/workflows/tmp-correspondence-exhaustive-compute.yml'

permissions:
  contents: write

concurrency:
  group: prompt-kit-correspondence-exhaustive-compute
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prompt-kit/recipient-need-gate-20260909
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh current floor and preserve reconciled owner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main prompt-kit/recipient-need-gate-20260909 --prune
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/prompt-kit/recipient-need-gate-20260909)"
          git merge-base --is-ancestor origin/main HEAD
          test -f scripts/tmp_apply_correspondence_exhaustive_compute.py

      - name: Apply content-only exhaustive editing contract and rebuild
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_apply_correspondence_exhaustive_compute.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Focused proof pass one
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python -m py_compile scripts/build_prompt_kit_registry.py scripts/prompt_registry_product_boundaries.py tests/test_correspondence_prompt_registry.py
          python scripts/prompt_registry_product_boundaries.py --summary
          python -m unittest \
            tests.test_correspondence_prompt_registry \
            tests.test_actionable_prompt_registry \
            tests.test_prompt_registry_product_boundaries -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Prove literal all-prompt exhaustive compute coverage
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python - <<'PY'
          from scripts import build_prompt_kit_registry

          operational = build_prompt_kit_registry.load_prompt_registry()
          content = build_prompt_kit_registry.load_content_prompt_registry()
          all_prompts = build_prompt_kit_registry.load_prompt_kit_registry()

          if len(all_prompts) != len(operational) + len(content):
              raise SystemExit('Prompt Kit count does not equal operational + content-only prompts')
          if {p['id'] for p in content} != {'P72', 'P73'}:
              raise SystemExit(f"unexpected content-only prompt set: {[p['id'] for p in content]}")

          failures = []
          for prompt in operational:
              if 'EXHAUSTIVE AVAILABLE COMPUTE RULE' not in prompt['copyContent']:
                  failures.append(f"{prompt['id']} missing operational exhaustive rule")
              if 'Exhaust the decision-relevant safe compute available' not in prompt['copyContent']:
                  failures.append(f"{prompt['id']} missing operational compute directive")
          for prompt in content:
              body = prompt['copyContent']
              if 'EXHAUSTIVE AVAILABLE EDITING COMPUTE' not in body:
                  failures.append(f"{prompt['id']} missing content-only exhaustive rule")
              if 'first sendable draft as a checkpoint, not an automatic stop' not in body:
                  failures.append(f"{prompt['id']} missing nonterminal first-draft rule")
              if 'editing fixed point is evidence-defined, not pass-count-defined' not in body:
                  failures.append(f"{prompt['id']} missing content editing fixed point")
              if prompt.get('actionabilityPolicy') != 'not-applicable:content-only':
                  failures.append(f"{prompt['id']} improperly inherited repo actionability policy")
              if 'ACTIONABLE NEXT COMMAND AND NEXT STEPS CONTRACT' in body:
                  failures.append(f"{prompt['id']} leaked repo execution contract")
          if failures:
              raise SystemExit('\n'.join(failures))
          print(
              'ALL PROMPTS EXHAUSTIVE COMPUTE: PASS | '
              f'operational={len(operational)} | content_only={len(content)} | total={len(all_prompts)}'
          )
          PY

      - name: Deliberate second proof pass
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python -m unittest tests.test_correspondence_prompt_registry -v
          python scripts/prompt_registry_product_boundaries.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Self-remove transport and commit durable contribution
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/tmp-correspondence-exhaustive-compute.yml \
            scripts/tmp_apply_correspondence_exhaustive_compute.py
          git add \
            registry/prompts/correspondence-prompts.v1.json \
            tests/test_correspondence_prompt_registry.py \
            web/prompt-kit/index.html
          git diff --cached --check
          echo '--- durable staged paths ---'
          git diff --cached --name-only
          git commit -m "feat(prompt-kit): exhaust compute in correspondence prompts"
          git fetch origin main --prune
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:prompt-kit/recipient-need-gate-20260909
