name: Temporary current-floor continuity repair

on:
  push:
    branches:
      - fix/current-floor-continuity-20260914

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair durable current-floor coordination truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          ledger = root / '.ai' / 'WORK_QUEUE.md'
          source = ledger.read_text(encoding='utf-8')
          marker = '## TRQ-007 — Measure Prompt Kit compute-authority effectiveness on external agents\n'
          if marker not in source:
              raise SystemExit('TRQ-007 marker missing')
          prefix = source.split(marker, 1)[0]
          replacement = '''## TRQ-007 — Measure Prompt Kit compute-authority effectiveness on external agents

          - **Status:** READY
          - **Priority:** P1
          - **Owner:** P67 / skill-evaluation
          - **Branch / PR:** main; Sprint 1 integrated by PR #464; Sprint 2 runtime-harness implementation not yet integrated
          - **Scope:** build and execute the bounded paired A/B evaluation that measures whether the strengthened Prompt Kit compute-authority contract increases decision-relevant useful compute, defect/contract discovery, evidence honesty, parallelism when available, and fixed-point quality without widening mutation scope or rewarding endless churn
          - **Forbidden:** changing Prompt Kit treatment behavior inside the frozen study; duplicating the P67 eval framework or skill-evaluation identity; modifying separately owned #450/#431 surfaces outside explicit reconciliation; secrets/private transcripts/personal data; promoting static proof to observed external-agent effectiveness
          - **Dependencies:** Sprint 1 merged via PR #464 / merge `43b1953092b518fe3a76b5fe0bfab179f730e849`; Sprint 2 consumes that immutable fixture floor; Sprint 3 must reconcile open PR #450 before touching its shared P67 registry/test files
          - **References:** `harness/evals/COMPUTE_AUTHORITY_EVALUATION_SPRINT_PLAN.md`, `harness/evals/compute-authority/manifest.json`, `harness/evals/compute-authority/README.md`, `harness/evals/repository-ai-evals.v1.json`, `.ai/skills/skill-evaluation/SKILL.md`, `harness/contracts/prompt-outcome-receipt.schema.v1.json`
          - **Acceptance gate:** Sprint 2 installs the exact control/treatment snapshot resolver, disposable-run isolation, generic provider/agent adapter seam, sanitized capture, metric extraction, paired-order randomization, pilot runner, and invalid-run classification; then a 16-run paired pilot executes only when an authorized model runtime is available; Sprint 3 later reconciles shared P67 registry ownership and reaches 48 valid runs before any observed-effectiveness verdict
          - **Gate:** Sprint 2 repository/runtime-harness implementation is SAFE & EXECUTABLE; provider credentials or an accessible external-agent runtime may block only the 16-run observed pilot and must remain `UNPROVEN_RUNTIME` rather than a synthetic PASS
          - **Last proof:** merge:43b1953092b518fe3a76b5fe0bfab179f730e849 integrated PR #464 Phase-A fixture harness; artifact:harness/evals/compute-authority/manifest.json artifact:harness/evals/compute-authority/fixtures/index.v1.json artifact:harness/evals/compute-authority/scripts/validate_fixtures.py
          - **Next action:** Implement Sprint 2 from `harness/evals/COMPUTE_AUTHORITY_EVALUATION_SPRINT_PLAN.md`: add the immutable condition resolver, disposable-run isolation, provider-neutral adapter/capture seam, paired-order pilot runner, invalid-run receipts, and focused tests without editing #450-owned shared P67 registry files; validate and integrate the deterministic harness before attempting external runs
          - **Updated:** 2026-09-14T12:49:00-04:00

          ## TRQ-008 — Converge Prompt Execution Evidence Spine runtime and donor lanes

          - **Status:** READY
          - **Priority:** P1
          - **Owner:** Prompt Topology / P95 runtime convergence coordinator
          - **Branch / PR:** main; stale planning PR #471 is superseded by integrated #467/#473/#474/#475/#477 and the canonical current-floor map
          - **Scope:** preserve the integrated adapter-only Evidence Spine architecture and minimal runtime, reconcile stale donor PR #450 routing concepts and PR #431 observation concepts against current main, salvage only missing architecture-admitted semantics under existing owners, and retire donor work that is already contained or superseded
          - **Forbidden:** universal lifecycle envelope or event bus; raw prompt/response/clipboard/transcript telemetry; hosted telemetry/vector DB; Phase D behavioral ingestion; wholesale stale-branch merges; duplicate P99/P115 classifiers; hand-editing generated `web/prompt-kit/index.html`; treating static runtime tests as provider-wide observed adoption
          - **Dependencies:** PR #467 merge `a1e9caa17c6a979a3747edb71632a66c9406af00`; PR #473 merge `1583882c386ae41d3db87388a1f8e0c4026d0a81`; PR #474 merge `eaa35ef3e940aca229bd8a82a3f7ceebd9c44182`; PR #475 merge `edb42410941f67285e5cda1e5b5b462a5da90578`; PR #477 merge `d8ef87ebb0f98fb49061429f9561ed3781556f44`
          - **References:** `harness/prompt-topology/EVIDENCE_SPINE_SPRINT_MAP.md`, `harness/prompt-topology/EVIDENCE_SPINE_ARCHITECTURE.md`, `harness/prompt-topology/EVIDENCE_SPINE_RUNTIME_COLLISION_MATRIX.md`, `harness/contracts/evidence-spine-continuation.v1.json`, `scripts/evidence_spine_runtime.py`, `tests/test_evidence_spine_runtime.py`
          - **Acceptance gate:** #450 and #431 are each dispositioned concept-by-concept as already-contained, salvage, or retire; any salvage uses the current adapter-only owner boundaries and privacy rules; focused Evidence Spine contracts/runtime tests plus affected repository gates pass; superseded donor PRs are closed only after containment/disposition evidence; validated changes converge onto refreshed main
          - **Gate:** current-floor donor reconciliation is SAFE & EXECUTABLE after this continuity repair; live provider adoption and authoritative destination observation remain separate runtime proof gates
          - **Last proof:** merge:a1e9caa17c6a979a3747edb71632a66c9406af00 integrated autonomous dispatch; merge:1583882c386ae41d3db87388a1f8e0c4026d0a81 integrated P95 architecture; merge:eaa35ef3e940aca229bd8a82a3f7ceebd9c44182 integrated collision matrix; merge:edb42410941f67285e5cda1e5b5b462a5da90578 integrated minimal runtime; merge:d8ef87ebb0f98fb49061429f9561ed3781556f44 integrated observed-parallelism repair
          - **Next action:** Inspect PR #450 and PR #431 against refreshed main and the integrated architecture/runtime; classify every architecture-admitted concept as already-contained, salvage, or retire, implement only missing bounded semantics under current owners, run focused and affected repository gates, then close superseded donor PRs and integrate any validated salvage
          - **Updated:** 2026-09-14T12:49:00-04:00
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          ledger.write_text(prefix + replacement, encoding='utf-8')

          sprint_map = '''# Prompt Execution Evidence Spine — Current-Floor Sprint Map

          **Status:** TRACKED / ACTIONABLE
          **Repository:** `EndeavorEverlasting/web-excel-repair-triage`
          **Current evidence floor:** `main@d8ef87ebb0f98fb49061429f9561ed3781556f44`
          **Architecture owner:** `harness/prompt-topology/EVIDENCE_SPINE_ARCHITECTURE.md`
          **Runtime owner:** `scripts/evidence_spine_runtime.py` + `harness/contracts/evidence-spine-continuation.v1.json`
          **Continuity index:** `.ai/WORK_QUEUE.md` / TRQ-008

          This map records the whole Evidence Spine dependency horizon on the refreshed repository floor. It replaces the stale launch order carried by open PR #471; chat and historical PR prose are not canonical execution state.

          ## Mission

          Keep recommendation, routing, dispatch, invocation, outcome, recovery, recurrence, continuation, and privacy as separate semantic owners connected only by thin adapters. Preserve zero-metadata human clipboard fallback while enabling deterministic agent continuation and recurrence-to-work behavior without a universal event bus or identity-bearing telemetry.

          ## Proven floor

          | Wave | State | Durable proof | What is proven |
          | --- | --- | --- | --- |
          | Panel 1 — autonomous dispatch floor | **PROVEN / INTEGRATED** | PR #467 → `a1e9caa17c6a979a3747edb71632a66c9406af00`; PR #477 → `d8ef87ebb0f98fb49061429f9561ed3781556f44` | capability ladder, executable dispatch manifest/receipt path, observed parallelism derived from overlapping lane intervals, runner failures preserved as lane failures |
          | Panel 2 — P95 architecture | **PROVEN / INTEGRATED** | PR #473 → `1583882c386ae41d3db87388a1f8e0c4026d0a81` | adapter-only/no-new-spine decision, provenance/owner matrix, #450/#431 donor dispositions, continuation-resolver admission |
          | Panel 3A — collision ownership | **PROVEN / INTEGRATED** | PR #474 → `eaa35ef3e940aca229bd8a82a3f7ceebd9c44182` | lanes A/B/C writer boundaries and coordinator-serialized shared surfaces |
          | Panel 3B — minimal runtime seam | **PROVEN / INTEGRATED** | PR #475 → `edb42410941f67285e5cda1e5b5b462a5da90578` | deterministic continuation, route provenance, bounded observation privacy, recurrence aggregation, P115-compatible work-request compilation |
          | Provider-wide adoption / live destination observation | **UNPROVEN** | none | no claim beyond exact repository/static/runtime tests |

          ## Current owner boundaries

          - **P07 / dispatch:** `prompt-parallel-dispatch/v1` and its runner/receipt path own dispatch attempts and observed concurrency.
          - **P99:** owns outcome classification and outcome receipts; no donor lane may redefine success/failure semantics.
          - **P115:** owns recovery/work-request coordination.
          - **Evidence Spine runtime:** owns deterministic continuation disposition, destination provenance gating, recurrence aggregation, observation privacy admission, and work-request compilation gates.
          - **Privacy/storage contracts:** own retention and identity exclusion; no raw prompt, response, clipboard, transcript, user, session, project, or device identity may leak into collective/observation evidence.
          - **PR #450:** donor only for routing-control-plane concepts until reconciled; never wholesale merge stale branch state.
          - **PR #431:** donor only for bounded observation concepts until reconciled; selection intent never proves terminal success.
          - **Generated Prompt Kit:** builder-owned; this program does not hand-edit `web/prompt-kit/index.html`.

          ## Remaining execution waves

          ### Wave 3 — Donor reconciliation and retirement — READY

          **Owner:** Prompt Topology / P95 runtime convergence coordinator.

          **Dependency:** integrated Panel 1–3B floor above; refresh exact current heads/diffs of #450 and #431 before any mutation.

          **Owned scope:** concept-by-concept comparison of donor diffs to current architecture/runtime; adapt only genuinely missing admitted semantics; close stale donor PRs once their useful concepts are either contained, salvaged, or explicitly rejected.

          **Forbidden scope:** stale wholesale merges; new lifecycle/event envelope; competing route/outcome/recovery classifier; raw telemetry; identity-bearing observation; Phase D.

          **Files to inspect:** `scripts/evidence_spine_runtime.py`, `harness/contracts/evidence-spine-continuation.v1.json`, `tests/test_evidence_spine_runtime.py`, exact #450/#431 changed files, P99/P115 contracts, privacy/storage contracts.

          **Files likely to change:** only current runtime/contract/tests when a donor concept is proven missing; otherwise coordination/PR disposition only.

          **Expected artifacts:** donor disposition matrix, any bounded adapter/test repair, exact validator/test receipts, PR closure or salvage integration evidence.

          **Validation:** focused Evidence Spine architecture/collision/runtime tests; any donor-owner tests for salvaged behavior; root harness/affected CI; `git diff --check`; refreshed-main containment.

          **Proof ceiling:** repository/static/runtime-test integration. No provider-wide adoption claim.

          **Completion gate:** each #450/#431 admitted concept has exactly one terminal disposition (`already-contained`, `salvaged`, `rejected/superseded`), no duplicate semantic owner remains, any salvage is on refreshed main with green owning gates, and superseded PRs are closed with evidence.

          ### Wave 4 — External/runtime observation — BLOCKED UNTIL A REAL TARGET EXISTS

          **Owner:** external launcher/provider integration owner selected by actual runtime evidence.

          **Dependency:** Wave 3 closed plus a named accessible runtime/provider that can emit invocation/route/outcome evidence without violating privacy contracts.

          **Owned scope:** thin provider/launcher adapter and observed receipts for exact runtime(s).

          **Forbidden scope:** fabricated destination, hidden credentials, provider-wide generalization, mandatory metadata on human clipboard fallback.

          **Expected proof:** invocation/route/outcome receipts tied to exact runtime version and tested conditions.

          **Proof ceiling:** OBSERVED only for the exact runtime/provider tested.

          ### Deferred — Phase D / Collective Learning

          Remains outside this map until a separate empirical/value/privacy gate admits it. Do not add behavioral topology ingestion, hosted telemetry, vector DB, or Collective Learning transport as a side effect of donor reconciliation.

          ## Independent adjacent program

          Compute-authority evaluation is tracked separately in `harness/evals/COMPUTE_AUTHORITY_EVALUATION_SPRINT_PLAN.md` / TRQ-007. Sprint 1 is already integrated via PR #464; its next repository-safe transition is Sprint 2 runtime-harness implementation. Do not couple its study registry to Evidence Spine donor reconciliation merely because both concern agents.

          ## Validation and integration order

          1. Refresh current `main`, donor PR heads, reviews, checks, and changed-file sets.
          2. Re-run current architecture/collision/runtime tests before donor comparison.
          3. Build a donor concept matrix against current main; no mutation until each candidate concept has a current owner.
          4. Reproduce any missing admitted behavior with a failing focused test before repair when practical.
          5. Apply the smallest adapter/contract repair; never transplant stale donor branches wholesale.
          6. Run focused and affected repository gates plus `git diff --check`.
          7. Re-fetch current main and reconcile any moved dependency floor.
          8. Integrate validated authorized work; prove refreshed-main containment and affected push CI.
          9. Close superseded donor PRs only after their concept disposition is recorded.

          ## Proof typing

          Keep `PLANNED/DESIGNED`, `TRACKED`, `IMPLEMENTED`, `WIRED/REACHABLE`, `VALIDATED`, `INTEGRATED`, `DEPLOYED`, and `OBSERVED` distinct. A schema, branch, PR, unit test, or merge never silently proves live provider adoption.

          ## First executable continuation

          **Inspect PR #450 and PR #431 against refreshed `main` and the integrated architecture/runtime; classify every architecture-admitted donor concept as already-contained, salvage, or retire before writing code.** If a missing concept is reproducible, repair it under the current owner with a failing regression first; otherwise close the donor as superseded with containment evidence.

          ## Durability rule

          This file is the canonical Evidence Spine execution map. Update it before handoff whenever sequencing, owner boundaries, donor dispositions, proof ceilings, or the first executable continuation materially change. `.ai/WORK_QUEUE.md` indexes this map but does not replace it.
          '''
          sprint_map = '\n'.join(line[10:] if line.startswith('          ') else line for line in sprint_map.splitlines()) + '\n'
          path = root / 'harness' / 'prompt-topology' / 'EVIDENCE_SPINE_SPRINT_MAP.md'
          path.write_text(sprint_map, encoding='utf-8')

          tests = root / 'tests' / 'test_repository_work_ledger.py'
          test_source = tests.read_text(encoding='utf-8')
          anchor = "\n\nif __name__ == '__main__':\n"
          if anchor not in test_source:
              raise SystemExit('ledger test anchor missing')
          additions = '''

              def test_active_program_continuity_matches_integrated_floor(self):
                  ledger = (ROOT / '.ai' / 'WORK_QUEUE.md').read_text(encoding='utf-8')
                  self.assertIn('merge:43b1953092b518fe3a76b5fe0bfab179f730e849', ledger)
                  self.assertIn('Next action:** Implement Sprint 2', ledger)
                  self.assertNotIn('implement Sprint 1 under `harness/evals/compute-authority/`', ledger)

              def test_evidence_spine_sprint_map_tracks_current_integrated_floor(self):
                  sprint_map = (ROOT / 'harness' / 'prompt-topology' / 'EVIDENCE_SPINE_SPRINT_MAP.md').read_text(encoding='utf-8')
                  for proof in (
                      'PR #467 → `a1e9caa17c6a979a3747edb71632a66c9406af00`',
                      'PR #473 → `1583882c386ae41d3db87388a1f8e0c4026d0a81`',
                      'PR #474 → `eaa35ef3e940aca229bd8a82a3f7ceebd9c44182`',
                      'PR #475 → `edb42410941f67285e5cda1e5b5b462a5da90578`',
                  ):
                      self.assertIn(proof, sprint_map)
                  self.assertIn('Wave 3 — Donor reconciliation and retirement — READY', sprint_map)
                  self.assertIn('PR #450', sprint_map)
                  self.assertIn('PR #431', sprint_map)
                  self.assertNotIn('Panel 1 is SAFE & EXECUTABLE', sprint_map)
          '''
          additions = '\n'.join(line[14:] if line.startswith('              ') else line for line in additions.splitlines())
          tests.write_text(test_source.replace(anchor, additions + anchor), encoding='utf-8')
          PY
      - name: Validate repaired coordination floor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_work_ledger.py --summary
          python -m unittest tests.test_repository_work_ledger -v
          python -m unittest tests.test_evidence_spine_runtime -v
          python -m pytest -q tests/test_evidence_spine_architecture_contract.py tests/test_evidence_spine_runtime_collision_matrix.py
          python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
          git diff --check
      - name: Commit durable repair and remove temporary carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-current-floor-continuity-20260914.yml
          git add .ai/WORK_QUEUE.md harness/prompt-topology/EVIDENCE_SPINE_SPRINT_MAP.md tests/test_repository_work_ledger.py
          git diff --cached --check
          git commit -m 'fix(harness): reconcile current execution floor'
          git push origin HEAD:fix/current-floor-continuity-20260914
