name: Temporary current-floor continuity repair final

on:
  push:
    branches:
      - fix/current-floor-continuity-20260914

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize bounded continuity repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          carrier = Path('.github/workflows/tmp-current-floor-continuity-20260914.yml').read_text(encoding='utf-8')
          start = carrier.index('          from pathlib import Path\n')
          end = carrier.index('\n          PY', start)
          code = textwrap.dedent(carrier[start:end]).replace('Implement Sprint 2', 'Build Sprint 2')
          exec(compile(code, 'continuity-repair-generator', 'exec'), {})
          PY
      - name: Validate repaired coordination floor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_work_ledger.py --summary
          python -m unittest tests.test_repository_work_ledger -v
          python -m unittest tests.test_evidence_spine_runtime -v
          python -m unittest tests.test_evidence_spine_architecture_contract tests.test_evidence_spine_runtime_collision_matrix -v
          python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
          git diff --check
          git status --short
          git diff --stat
      - name: Commit durable repair and remove temporary carriers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-current-floor-continuity-20260914.yml
          git rm .github/workflows/tmp-current-floor-continuity-retry-20260914.yml
          git rm .github/workflows/tmp-current-floor-continuity-final-20260914.yml
          git add .ai/WORK_QUEUE.md harness/prompt-topology/EVIDENCE_SPINE_SPRINT_MAP.md tests/test_repository_work_ledger.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(harness): reconcile current execution floor'
          git push origin HEAD:fix/current-floor-continuity-20260914
