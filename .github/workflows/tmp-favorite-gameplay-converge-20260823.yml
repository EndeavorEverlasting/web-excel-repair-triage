name: Temporary Prompt Kit Favorite Gameplay Convergence

on:
  push:
    branches:
      - feat/prompt-kit-favorite-gameplay-20260822

permissions:
  contents: write

concurrency:
  group: prompt-kit-favorite-gameplay-convergence-20260823
  cancel-in-progress: false

jobs:
  converge:
    if: github.event.head_commit.message == 'chore(prompt-kit): install bounded favorite gameplay convergence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-favorite-gameplay-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair, prove, rebuild, and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          git merge-base --is-ancestor origin/main HEAD
          test "$(git log -1 --pretty=%s)" = 'chore(prompt-kit): install bounded favorite gameplay convergence'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one repair anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = Path('docs/prompt-kit-preference-gameplay.js')
          replace_once(
              runtime,
              "  if(!promptById(id))return false;\n  var current=state.byPrompt[id]||{count:0,lastCopiedAt:null};",
              "  if(!promptById(id))return false;\n  state=loadState();\n  var current=state.byPrompt[id]||{count:0,lastCopiedAt:null};",
          )
          replace_once(
              runtime,
              "var previousCopyPrompt=root.copyPrompt;\nroot.copyPrompt=function(id){\n  var prompt=promptById(id);\n  if(!prompt||!prompt.copyContent)return previousCopyPrompt?previousCopyPrompt(id):undefined;\n  root.copyToClipboard(prompt.copyContent,function(){recordSuccessfulCopy(id);root.showCopyConfirmation(id)})\n};",
              "if(typeof root.addEventListener==='function'){\n  root.addEventListener('storage',function(event){\n    if(event&&event.key&&event.key!==STORAGE_KEY)return;\n    state=loadState();\n    renderDashboard()\n  })\n}\n\nvar previousCopyPrompt=root.copyPrompt;\nroot.copyPrompt=function(id){\n  var prompt=promptById(id);\n  if(!prompt||!prompt.copyContent)return previousCopyPrompt?previousCopyPrompt(id):undefined;\n  var handled=false;\n  root.copyToClipboard(prompt.copyContent,function(){\n    if(handled)return;\n    handled=true;\n    if(recordSuccessfulCopy(id))root.showCopyConfirmation(id)\n  })\n};",
          )

          test_path = Path('tests/test_prompt_kit_favorite_gameplay.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace(
              'import json\nimport re\nimport unittest\n',
              'import json\nimport subprocess\nimport textwrap\nimport unittest\n',
              1,
          )
          start = test_text.index('    def test_semantic_usage_is_recorded_only_inside_success_callback(self) -> None:\n')
          end = test_text.index('    def test_dashboard_is_interactive_game_like_and_badges_are_deferred(self) -> None:\n', start)
          executable_test = r'''    def test_copy_accounting_executes_success_failure_duplicate_and_multitab_paths(self) -> None:
        source = GAMEPLAY.read_text(encoding="utf-8")
        for marker in (
            "state=loadState();",
            "if(handled)return;",
            "root.addEventListener('storage'",
        ):
            self.assertIn(marker, source)

        script = textwrap.dedent(
            r"""
            const assert = require('assert');
            const fs = require('fs');
            const vm = require('vm');
            const source = fs.readFileSync('docs/prompt-kit-preference-gameplay.js', 'utf8');
            const KEY = 'promptKit.usage.v1';

            function createStorage() {
              const values = new Map();
              return {
                getItem(key) { return values.has(key) ? values.get(key) : null; },
                setItem(key, value) { values.set(key, String(value)); },
                removeItem(key) { values.delete(key); }
              };
            }

            const storage = createStorage();
            function boot(mode) {
              let storageHandler = null;
              const toasts = [];
              const context = {
                console,
                localStorage: storage,
                PROMPTS: [
                  {id: 'P95', seq: 95, name: 'P95', type: 'Standard', copyContent: 'copy-p95'},
                  {id: 'P14', seq: 14, name: 'P14', type: 'Standard', copyContent: 'copy-p14'}
                ],
                isFavoritePrompt() { return false; },
                configuredPromptShortcutIds() { return ['P95']; },
                showCopyConfirmation(id) { toasts.push(id); },
                addEventListener(type, handler) { if (type === 'storage') storageHandler = handler; }
              };
              context.copyToClipboard = function(_text, callback) {
                if (mode === 'success') callback();
                else if (mode === 'duplicate') { callback(); callback(); }
                else if (mode === 'throw') throw new Error('clipboard unavailable');
              };
              context.globalThis = context;
              vm.createContext(context);
              vm.runInContext(source, context);
              return {context, toasts, getStorageHandler() { return storageHandler; }};
            }

            const tabA = boot('success');
            const tabB = boot('success');
            tabA.context.copyPrompt('P95');
            tabB.context.copyPrompt('P14');
            let persisted = JSON.parse(storage.getItem(KEY));
            assert.strictEqual(persisted.totalCopies, 2);
            assert.strictEqual(persisted.byPrompt.P95.count, 1);
            assert.strictEqual(persisted.byPrompt.P14.count, 1);

            const duplicate = boot('duplicate');
            duplicate.context.copyPrompt('P95');
            persisted = JSON.parse(storage.getItem(KEY));
            assert.strictEqual(persisted.totalCopies, 3);
            assert.strictEqual(persisted.byPrompt.P95.count, 2);
            assert.deepStrictEqual(duplicate.toasts, ['P95']);

            const failure = boot('failure');
            failure.context.copyPrompt('P14');
            persisted = JSON.parse(storage.getItem(KEY));
            assert.strictEqual(persisted.totalCopies, 3);
            assert.deepStrictEqual(failure.toasts, []);

            const throwing = boot('throw');
            assert.throws(() => throwing.context.copyPrompt('P14'), /clipboard unavailable/);
            persisted = JSON.parse(storage.getItem(KEY));
            assert.strictEqual(persisted.totalCopies, 3);
            assert.deepStrictEqual(throwing.toasts, []);

            const storageHandler = tabA.getStorageHandler();
            assert.strictEqual(typeof storageHandler, 'function');
            storageHandler({key: KEY});
            assert.strictEqual(tabA.context.PromptKitPreferenceGameplay.getState().totalCopies, 3);

            process.stdout.write(JSON.stringify({
              totalCopies: persisted.totalCopies,
              p95: persisted.byPrompt.P95.count,
              p14: persisted.byPrompt.P14.count
            }));
            """
        )
        completed = subprocess.run(
            ["node", "-e", script],
            cwd=ROOT,
            check=True,
            capture_output=True,
            text=True,
        )
        self.assertEqual(
            json.loads(completed.stdout),
            {"totalCopies": 3, "p95": 2, "p14": 1},
        )

'''
          test_text = test_text[:start] + executable_test + test_text[end:]
          test_text = test_text.replace(
              '        self.assertIn("recordSuccessfulCopy(id);root.showCopyConfirmation(id)", deployed)\n',
              '        self.assertIn("if(handled)return;", deployed)\n',
              1,
          )
          test_path.write_text(test_text, encoding='utf-8')
          PY

          node --check docs/prompt-kit-preference-gameplay.js
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_prompt_kit_favorite_gameplay tests.test_prompt_kit_hotkey_completion -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          python - <<'PY'
          import subprocess
          expected = {
              'docs/prompt-kit-preference-gameplay.js',
              'tests/test_prompt_kit_favorite_gameplay.py',
              'web/prompt-kit/index.html',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise RuntimeError(f'unexpected repair delta: {sorted(changed)}')
          PY

          git rm .github/workflows/tmp-favorite-gameplay-converge-20260823.yml
          git add docs/prompt-kit-preference-gameplay.js tests/test_prompt_kit_favorite_gameplay.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'fix(prompt-kit): prove exactly-once favorite usage'
          git push origin HEAD:feat/prompt-kit-favorite-gameplay-20260822
