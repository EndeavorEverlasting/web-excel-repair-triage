name: Temporary Prompt Kit favorite hotkey focus sprint

on:
  push:
    branches:
      - feat/prompt-kit-favorite-hotkey-focus-20260908

permissions:
  contents: write

concurrency:
  group: prompt-kit-favorite-hotkey-focus-20260908
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-favorite-hotkey-focus-20260908
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Refresh exact branch floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/prompt-kit-favorite-hotkey-focus-20260908 --prune
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/prompt-kit-favorite-hotkey-focus-20260908)"
          git merge-base --is-ancestor origin/main HEAD
          git status --short
          git log --oneline --decorate -5
      - name: Apply bounded feature patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/tmp_favorite_hotkey_focus_patch.py
          python .github/tmp_favorite_hotkey_focus_center_fix.py
      - name: Generate and validate pass 1
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/prompt-kit-polish.js
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_prompt_kit_hotkey_completion tests.test_prompt_kit_mobile_quick_controls tests.test_prompt_kit_mobile tests.test_prompt_kit_product_interactions -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_prompt_kit_interactions.py --summary
          git diff --check
      - name: Install Chromium proof dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Observed mobile journey
        run: python tests/prompt_kit_mobile_quick_controls_browser_proof.py
      - name: Deliberate second-pass falsification
        shell: bash
        run: |
          set -euo pipefail
          python .github/tmp_favorite_hotkey_focus_falsify.py
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_hotkey_completion tests.test_prompt_kit_mobile_quick_controls -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit durable feature and self-remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-favorite-hotkey-focus-sprint.yml .github/tmp_favorite_hotkey_focus_patch.py .github/tmp_favorite_hotkey_focus_center_fix.py .github/tmp_favorite_hotkey_focus_falsify.py
          git add docs/prompt-kit-polish.js docs/PROMPT_KIT_HOTKEY_PROGRAM_DESIGN.md harness/contracts/prompt-kit-mobile.v1.json OPEN_PROMPT_KIT_ON_PHONE.md tests/test_prompt_kit_hotkey_completion.py tests/test_prompt_kit_mobile_quick_controls.py tests/prompt_kit_mobile_quick_controls_browser_proof.py web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --name-only
          git diff --cached --stat
          git commit -m "feat(prompt-kit): favorite prompts into hotkeys and centered detail"
          git push origin HEAD:"${GITHUB_REF_NAME}"
