name: Temporary Favorite Gameplay Review Closeout

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prompt-kit-favorite-review-closeout-20260823
  cancel-in-progress: false

jobs:
  closeout:
    if: github.event.pull_request.head.ref == 'fix/prompt-kit-favorite-review-closeout-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-kit-favorite-review-closeout-20260823
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair canonical owners, rebuild, prove, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          git merge-base --is-ancestor 39bcd7288785dd80c20c85979e8a5f1aa1b1aee1 HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one repair anchor, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          js = Path('docs/prompt-kit.js')
          text = js.read_text(encoding='utf-8')
          reset = "function resetPromptKitView(){activeCat='all';activeSection=null;activeType=null;activeColor=null;activeProfile=null;collapsedSections={};var search=document.getElementById('search');if(search)search.value='';var clear=document.getElementById('searchClear');if(clear)clear.style.display='none';promptDetailOrigin=null;closePromptDetail(false);closeRef();var detail=document.getElementById('doctrineDetail');if(detail)detail.classList.remove('active');var list=document.getElementById('doctrineList');if(list)list.style.display='grid';syncLibraryTabs();renderSections();renderTypes();render();try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){window.scrollTo(0,0)}showToast('Returned to all prompts')}"
          owner = reset + "\nfunction activatePromptKitView(view){activeCat='all';activeSection=null;activeType=null;activeColor=null;activeProfile=null;if(view==='standard')activeCat='standard';else if(view==='favorites')activeSection='__favorites__';else if(view==='triage')activeProfile='triage-management';else if(view==='fun')activeProfile='fun-management';else if(view!=='all')return false;var search=document.getElementById('search');if(search)search.value='';var clear=document.getElementById('searchClear');if(clear)clear.style.display='none';document.querySelectorAll('.cat-tab').forEach(function(button){button.classList.toggle('active',button.dataset.view===view||(view==='all'&&button.dataset.cat==='all')||(view==='standard'&&button.dataset.cat==='standard'))});renderSections();renderTypes();render();return true}"
          if 'function activatePromptKitView(view)' not in text:
              if text.count(reset) != 1:
                  raise RuntimeError('resetPromptKitView anchor drifted')
              text = text.replace(reset, owner, 1)

          click_old = "var ct=e.target.closest('.cat-tab[data-cat]');if(ct){activeProfile=null;activeCat=ct.dataset.cat;"
          click_new = "var view=e.target.closest('.cat-tab[data-view]');if(view){e.preventDefault();activatePromptKitView(view.dataset.view);return}var ct=e.target.closest('.cat-tab[data-cat]');if(ct){activeProfile=null;activeSection=null;activeCat=ct.dataset.cat;"
          if click_new not in text:
              if text.count(click_old) != 1:
                  raise RuntimeError('category click anchor drifted')
              text = text.replace(click_old, click_new, 1)

          key_old = "document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;switch(e.key){case'1':activeProfile=null;activeCat='all';break;case'2':activeProfile=null;activeCat='standard';break;case'r':"
          key_new = "document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key>='1'&&e.key<='5'){var views={'1':'all','2':'standard','3':'favorites','4':'triage','5':'fun'};if(activatePromptKitView(views[e.key])){e.preventDefault();return}}switch(e.key){case'r':"
          if key_new not in text:
              if text.count(key_old) != 1:
                  raise RuntimeError('numeric key anchor drifted')
              text = text.replace(key_old, key_new, 1)
          js.write_text(text, encoding='utf-8')

          registry_path = Path('registry/prompts/spec-architecture-prompts.v1.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          old_acceptance = 'Prove favorite shortcut -> successful clipboard write -> normal success toast -> exactly one semantic usage event -> live dashboard refresh.'
          new_acceptance = 'Prove favorite shortcut -> successful clipboard write -> exactly one semantic usage event -> live dashboard refresh -> normal success toast.'
          changed = 0
          for prompt in registry.get('prompts', []):
              if prompt.get('id') != 'P99':
                  continue
              content = prompt.get('copyContent', '')
              if old_acceptance in content:
                  prompt['copyContent'] = content.replace(old_acceptance, new_acceptance, 1)
                  changed += 1
              elif new_acceptance in content:
                  changed += 1
          if changed != 1:
              raise RuntimeError(f'P99 runtime acceptance owner count={changed}')
          registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          readme = Path('web/README.md')
          readme_text = readme.read_text(encoding='utf-8')
          old_readme = 'and open the canonical prompt detail immediately.'
          new_readme = 'and copy the canonical prompt content immediately with the normal clipboard success feedback.'
          if new_readme not in readme_text:
              if readme_text.count(old_readme) != 1:
                  raise RuntimeError('README configured-shortcut semantics anchor drifted')
              readme_text = readme_text.replace(old_readme, new_readme, 1)
          readme.write_text(readme_text, encoding='utf-8')

          product_test = Path('tests/test_prompt_kit_product_interactions.py')
          test_text = product_test.read_text(encoding='utf-8')
          if 'import json\n' not in test_text:
              test_text = test_text.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nimport json\n', 1)
          old_contract = '''    def test_interaction_contract_is_marked_implemented(self) -> None:\n        text = CONTRACT.read_text(encoding="utf-8")\n        self.assertIn('"implementation_status": "implemented"', text)\n'''
          new_contract = '''    def test_interaction_contract_is_marked_implemented(self) -> None:\n        payload = json.loads(CONTRACT.read_text(encoding="utf-8"))\n        self.assertEqual(payload["status"], "implemented")\n'''
          if new_contract not in test_text:
              if test_text.count(old_contract) != 1:
                  raise RuntimeError('interaction status test anchor drifted')
              test_text = test_text.replace(old_contract, new_contract, 1)
          old_strict = '''        report = module.evaluate_repository()\n        self.assertEqual(report["implementation_status"], "implemented")\n        self.assertEqual(report["missing_markers"], [])\n'''
          new_strict = '''        report = module.audit_implementation()\n        self.assertTrue(report["implementation_ready"], report["missing_static_markers"])\n        self.assertEqual(report["missing_static_markers"], [])\n'''
          if new_strict not in test_text:
              if test_text.count(old_strict) != 1:
                  raise RuntimeError('strict interaction test anchor drifted')
              test_text = test_text.replace(old_strict, new_strict, 1)
          product_test.write_text(test_text, encoding='utf-8')

          header = Path('tests/test_prompt_kit_header_contract.py')
          header_text = header.read_text(encoding='utf-8')
          anchor = '    assert "activateProfilePromptsView(\'fun-management\',\'fun\')" in polish\n'
          addition = (
              '    assert "function activatePromptKitView(view)" in js\n'
              '    assert "var view=e.target.closest(\'.cat-tab[data-view]\')" in js\n'
              '    assert "\'3\':\'favorites\',\'4\':\'triage\',\'5\':\'fun\'" in js\n'
          )
          if addition not in header_text:
              if header_text.count(anchor) != 1:
                  raise RuntimeError('header core-view assertion anchor drifted')
              header_text = header_text.replace(anchor, anchor + addition, 1)
          header.write_text(header_text, encoding='utf-8')
          PY

          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-polish.js
          node --check docs/prompt-kit-preference-gameplay.js
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest \
            tests.test_prompt_kit_hotkey_completion \
            tests.test_prompt_kit_favorite_gameplay \
            tests.test_prompt_kit_product_interactions \
            tests.test_prompt_kit_order_navigation_product \
            tests.test_spec_architecture_prompt_registry \
            -v
          python tests/test_prompt_kit_header_contract.py
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          python - <<'PY'
          import subprocess
          expected = {
              'docs/prompt-kit.js',
              'registry/prompts/spec-architecture-prompts.v1.json',
              'tests/test_prompt_kit_header_contract.py',
              'tests/test_prompt_kit_product_interactions.py',
              'web/README.md',
              'web/prompt-kit/index.html',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise RuntimeError(f'unexpected durable delta: {sorted(changed)}')
          PY

          git rm .github/workflows/tmp-favorite-review-closeout-20260823.yml
          git add docs/prompt-kit.js registry/prompts/spec-architecture-prompts.v1.json tests/test_prompt_kit_header_contract.py tests/test_prompt_kit_product_interactions.py web/README.md web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'fix(prompt-kit): close favorite gameplay review gaps'
          git push origin HEAD:fix/prompt-kit-favorite-review-closeout-20260823
