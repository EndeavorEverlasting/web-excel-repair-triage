name: Temporary feedback AFK factoring carrier

on:
  push:
    branches:
      - refactor/prompt-kit-private-afk-feedback-factor-20260827
    paths:
      - scripts/tmp_feedback_afk_factor_trigger.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-feedback-afk-factor-carrier
  cancel-in-progress: false

jobs:
  factor-and-prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout factoring branch
        uses: actions/checkout@v7
        with:
          ref: refactor/prompt-kit-private-afk-feedback-factor-20260827
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Reconcile main, factor owners, and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main refactor/prompt-kit-private-afk-feedback-factor-20260827 --prune
          test "$(git branch --show-current)" = 'refactor/prompt-kit-private-afk-feedback-factor-20260827'
          git merge --no-edit origin/main
          python scripts/tmp_factor_feedback_afk_harness.py
          python scripts/tmp_fix_feedback_afk_workflow.py
          python scripts/tmp_reconcile_feedback_afk_root_harness.py
          python scripts/validate_prompt_kit_feedback_afk_routing.py --summary
          python -m unittest tests.test_prompt_kit_feedback_afk_routing tests.test_prompt_kit_feedback_production -v
          python -m unittest tests.test_prompt_kit_portability tests.test_prompt_kit_portability_regressions tests.test_prompt_kit_portable_health -v
          python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
          python -m unittest tests.test_harness_contract -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git rm -f .github/workflows/tmp-feedback-afk-factor-carrier.yml scripts/tmp_factor_feedback_afk_harness.py scripts/tmp_fix_feedback_afk_workflow.py scripts/tmp_reconcile_feedback_afk_root_harness.py scripts/tmp_feedback_afk_factor_trigger.txt
          git add .ai/skills/prompt-kit-feedback-afk-routing/SKILL.md CAPABILITIES.md SKILLS.md TRIGGERS.md WORKFLOW.md \
            .githooks/pre-push .github/workflows/prompt-kit-web.yml harness/contracts/prompt-kit-feedback-afk-routing.v1.json \
            harness/capabilities.v1.json harness/triggers.v1.json harness/workflows.v1.json harness/validators.v1.json harness/manifest.v1.json \
            scripts/prompt_kit_afk_signal_router.py scripts/validate_harness.py scripts/validate_prompt_kit_feedback_afk_routing.py tests/test_prompt_kit_feedback_afk_routing.py
          git diff --cached --check
          git commit -m 'refactor(prompt-kit): factor private feedback AFK routing'
          git push origin HEAD:refactor/prompt-kit-private-afk-feedback-factor-20260827
