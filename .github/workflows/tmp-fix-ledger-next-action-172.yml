name: Temporary strict-DONE ledger fix 172

on:
  push:
    branches:
      - chore/browser-proof-cleanup-ledger-closeout-20260810

permissions:
  contents: write

jobs:
  fix-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/browser-proof-cleanup-ledger-closeout-20260810
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Canonicalize TRQ-006 terminal action
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('.ai/WORK_QUEUE.md'); t=p.read_text(encoding='utf-8'); old='- **Next action:** none; no safe actionable repository work remains; native P-Top preview of the operator-owned scratch path is the next external proof gate'; new='- **Next action:** none; no safe actionable work remains'; assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new,1),encoding='utf-8')"
          python scripts/validate_repository_work_ledger.py
          python -m unittest tests.test_repository_work_ledger -v
          git diff --check
      - name: Commit ledger only
        shell: bash
        run: |
          git add -- .ai/WORK_QUEUE.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ledger): use canonical terminal action'
          git push origin HEAD:chore/browser-proof-cleanup-ledger-closeout-20260810
