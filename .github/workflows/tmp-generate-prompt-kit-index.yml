name: Temporary Prompt Kit index regeneration

on:
  push:
    branches:
      - feat/prompt-finder-classifier-evals-20260911
    paths:
      - '.github/workflows/tmp-generate-prompt-kit-index.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owned branch
        uses: actions/checkout@v7
        with:
          ref: feat/prompt-finder-classifier-evals-20260911
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Regenerate canonical Prompt Kit artifact
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Commit only the generated artifact
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/prompt-kit/index.html; then
            echo 'Prompt Kit index already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'build(prompt-kit): refresh generated registry [skip ci]'
          git push origin HEAD:feat/prompt-finder-classifier-evals-20260911
