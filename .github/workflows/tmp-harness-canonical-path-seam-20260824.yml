name: Temporary harness canonical-path seam builder

on:
  push:
    branches:
      - feat/harness-canonical-path-seam-20260824

permissions:
  contents: write

jobs:
  build-harness-seam:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin evidence floor
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git rev-parse HEAD^)" = "6e4f7b4fb0fdf78cd739189e5c4198b0ef8bb8c6"
          test "$(git merge-base HEAD origin/main)" = "6e4f7b4fb0fdf78cd739189e5c4198b0ef8bb8c6"
          git status --short
          git log --oneline --decorate -5
      - name: Build canonical path seam through existing harness owners
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import copy
          import json
          from pathlib import Path

          ROOT = Path.cwd()
          REMOTE = "https://github.com/EndeavorEverlasting/web-excel-repair-triage.git"
          PUBLIC_PROMPT_KIT = "https://endeavoreverlasting.github.io/web-excel-repair-triage/prompt-kit/"
          PUBLIC_PWA = "https://endeavoreverlasting.github.io/web-excel-repair-triage/"

          def load_json(path: str):
              return json.loads((ROOT / path).read_text(encoding="utf-8"))

          def write_json(path: str, payload):
              (ROOT / path).write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")

          def replace_once(path: str, old: str, new: str):
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          canonical_paths = {
              "schema_version": "web-excel-canonical-paths/v1",
              "repository": "EndeavorEverlasting/web-excel-repair-triage",
              "canonical_remote": REMOTE,
              "default_branch": "main",
              "deep_repair_owner": {
                  "prompt_id": "P92",
                  "name": "Canonical Path Prompt",
                  "role": "Deep path/profile audit and repair. This registry is the one canonical harness seam P92 inspects and strengthens."
              },
              "policy": {
                  "path_authority": "harness/canonical-paths.v1.json",
                  "model_chosen_paths": False,
                  "second_mutable_clone_allowed": False,
                  "parallel_writer_strategy": "git-worktree",
                  "canonical_checkout_resolution": "existing checkout with canonical origin; resolve its runtime root with git rev-parse --show-toplevel",
                  "temporary_worktree_root_strategy": "sibling-under-canonical-parent",
                  "proof_implication": "none"
              },
              "profiles": [
                  {
                      "id": "repository-development",
                      "purpose": "Edit, test, commit, push, inspect source, or run repository tooling.",
                      "supported_machines": ["windows", "linux", "macos", "android-termux"],
                      "canonical_development_checkout": {
                          "applicable": True,
                          "kind": "runtime-resolved-git-root",
                          "resolver": "git rev-parse --show-toplevel",
                          "required_remote": REMOTE,
                          "canonical_branch": "main",
                          "allow_isolated_feature_worktree": True,
                          "hardcoded_absolute_path": False,
                          "when_missing": "Do not invent a directory. Route through the registered technician acquisition workflow or an explicit operator-selected parent."
                      },
                      "production_use_path": {
                          "applicable": False,
                          "reason": "This profile is the source-development path; application use/served paths are separate profiles."
                      },
                      "temporary_worktree_root": {
                          "applicable": True,
                          "kind": "derived-sibling-worktree-root",
                          "template": "<canonical-checkout-parent>/.worktrees/web-excel-repair-triage/<branch-slug>",
                          "second_mutable_clone_allowed": False,
                          "rule": "Parallel writers use git worktree from the proven canonical checkout; a second mutable clone is not an isolation mechanism."
                      },
                      "operator_entrypoint": {
                          "kind": "repository-command",
                          "value": "git rev-parse --show-toplevel"
                      }
                  },
                  {
                      "id": "public-web",
                      "purpose": "Normal Prompt Kit browser use without a repository checkout.",
                      "supported_machines": ["browser-capable"],
                      "canonical_development_checkout": {
                          "applicable": True,
                          "reference_profile": "repository-development",
                          "consumer_requires_checkout": False
                      },
                      "production_use_path": {
                          "applicable": True,
                          "kind": "https",
                          "value": PUBLIC_PROMPT_KIT,
                          "source_artifact": "web/prompt-kit/index.html"
                      },
                      "temporary_worktree_root": {
                          "applicable": False,
                          "reason": "Consumer route; no writer worktree is involved."
                      },
                      "operator_entrypoint": {
                          "kind": "url",
                          "value": PUBLIC_PROMPT_KIT
                      }
                  },
                  {
                      "id": "windows-portable",
                      "purpose": "Windows stable local Prompt Kit with portable Favorites and loopback serving.",
                      "supported_machines": ["windows"],
                      "canonical_development_checkout": {
                          "applicable": True,
                          "reference_profile": "repository-development",
                          "checkout_management": "Open-Latest-PromptKit.cmd and scripts/Open-LatestPromptKitPortable.ps1 own safe acquisition/update; callers do not guess a checkout path."
                      },
                      "production_use_path": {
                          "applicable": True,
                          "kind": "generated-local-artifact",
                          "value": "Outputs/prompt-kit-portable/index.html",
                          "served_at": "http://127.0.0.1:8765/",
                          "source_artifact": "web/prompt-kit/index.html"
                      },
                      "temporary_worktree_root": {
                          "applicable": False,
                          "reason": "Ordinary launcher-owned use is not a parallel writer lane."
                      },
                      "operator_entrypoint": {
                          "kind": "launcher",
                          "value": "Open-Latest-PromptKit.cmd"
                      }
                  },
                  {
                      "id": "phone-tablet-pwa",
                      "purpose": "Open, install, or share the Prompt Kit from a phone or tablet system browser.",
                      "supported_machines": ["ios", "android"],
                      "canonical_development_checkout": {
                          "applicable": True,
                          "reference_profile": "repository-development",
                          "consumer_requires_checkout": False
                      },
                      "production_use_path": {
                          "applicable": True,
                          "kind": "https",
                          "value": PUBLIC_PWA,
                          "source_artifact": "web/prompt-kit/index.html"
                      },
                      "temporary_worktree_root": {
                          "applicable": False,
                          "reason": "Consumer route; source-work isolation is a separate repository-development profile."
                      },
                      "operator_entrypoint": {
                          "kind": "system-browser-url",
                          "value": PUBLIC_PWA
                      }
                  }
              ],
              "proof_states": [
                  {
                      "id": "remote_main_contains_sha",
                      "requires": ["provider default-branch ref plus ancestry/containment evidence"],
                      "does_not_prove": ["canonical_development_checkout_current", "production_use_path_current", "operator_entrypoint_observes_current"]
                  },
                  {
                      "id": "canonical_development_checkout_current",
                      "requires": ["runtime-resolved checkout root", "canonical origin", "clean/current branch or explicitly isolated worktree", "fetched remote containment evidence"],
                      "does_not_prove": ["production_use_path_current", "operator_entrypoint_observes_current"]
                  },
                  {
                      "id": "production_use_path_current",
                      "requires": ["profile-specific deployed/served/generated path evidence bound to the intended source commit or artifact"],
                      "does_not_prove": ["operator_entrypoint_observes_current"]
                  },
                  {
                      "id": "operator_entrypoint_observes_current",
                      "requires": ["the real profile entrypoint was executed or observed against the intended current artifact/path"],
                      "does_not_prove": []
                  }
              ]
          }
          write_json("harness/canonical-paths.v1.json", canonical_paths)

          validator_source = r'''#!/usr/bin/env python3
          """Fail-closed validation for the repository canonical path/profile contract."""
          from __future__ import annotations

          import argparse
          import json
          import re
          import sys
          from pathlib import Path
          from typing import Any

          ROOT = Path(__file__).resolve().parents[1]
          CONTRACT_PATH = ROOT / "harness" / "canonical-paths.v1.json"
          REPOSITORY = "EndeavorEverlasting/web-excel-repair-triage"
          REMOTE = "https://github.com/EndeavorEverlasting/web-excel-repair-triage.git"
          EXPECTED_PROFILES = {
              "repository-development",
              "public-web",
              "windows-portable",
              "phone-tablet-pwa",
          }
          EXPECTED_PROOF_STATES = [
              "remote_main_contains_sha",
              "canonical_development_checkout_current",
              "production_use_path_current",
              "operator_entrypoint_observes_current",
          ]
          WINDOWS_PERSON_PATH = re.compile(r"(?i)[A-Z]:[\\/]Users[\\/](?!<|%|\$)[^\\/]+")
          UNIX_PERSON_PATH = re.compile(r"/(?:home|Users)/(?!<|%|\$)[^/]+")


          class CanonicalPathValidationError(ValueError):
              """Raised when the canonical path contract is missing or malformed."""


          def load_contract(path: Path = CONTRACT_PATH) -> dict[str, Any]:
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except FileNotFoundError as exc:
                  raise CanonicalPathValidationError(f"missing canonical path contract: {path}") from exc
              except json.JSONDecodeError as exc:
                  raise CanonicalPathValidationError(f"invalid canonical path JSON: {exc}") from exc
              if not isinstance(payload, dict):
                  raise CanonicalPathValidationError("canonical path contract root must be an object")
              return payload


          def _all_strings(value: Any):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, dict):
                  for key, item in value.items():
                      yield str(key)
                      yield from _all_strings(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from _all_strings(item)


          def validate_contract(payload: dict[str, Any]) -> list[str]:
              errors: list[str] = []
              if payload.get("schema_version") != "web-excel-canonical-paths/v1":
                  errors.append("unsupported schema_version")
              if payload.get("repository") != REPOSITORY:
                  errors.append("repository identity is not canonical")
              if payload.get("canonical_remote") != REMOTE:
                  errors.append("canonical_remote drifted")
              if payload.get("default_branch") != "main":
                  errors.append("default_branch must be main")

              owner = payload.get("deep_repair_owner")
              if not isinstance(owner, dict) or owner.get("prompt_id") != "P92":
                  errors.append("P92 must remain the deep canonical-path repair owner")

              policy = payload.get("policy")
              if not isinstance(policy, dict):
                  errors.append("policy must be an object")
              else:
                  expected = {
                      "path_authority": "harness/canonical-paths.v1.json",
                      "model_chosen_paths": False,
                      "second_mutable_clone_allowed": False,
                      "parallel_writer_strategy": "git-worktree",
                      "temporary_worktree_root_strategy": "sibling-under-canonical-parent",
                      "proof_implication": "none",
                  }
                  for field, value in expected.items():
                      if policy.get(field) != value:
                          errors.append(f"policy.{field} must equal {value!r}")

              profiles = payload.get("profiles")
              if not isinstance(profiles, list):
                  errors.append("profiles must be a list")
                  profiles = []
              ids = [item.get("id") for item in profiles if isinstance(item, dict)]
              if len(ids) != len(set(ids)):
                  errors.append("profile IDs must be unique")
              if set(ids) != EXPECTED_PROFILES:
                  errors.append(f"profile IDs drifted: {sorted(str(item) for item in ids)}")
              by_id = {item["id"]: item for item in profiles if isinstance(item, dict) and item.get("id")}
              for profile_id, profile in by_id.items():
                  for field in (
                      "purpose",
                      "supported_machines",
                      "canonical_development_checkout",
                      "production_use_path",
                      "temporary_worktree_root",
                      "operator_entrypoint",
                  ):
                      if field not in profile:
                          errors.append(f"profile {profile_id} missing {field}")
                  for field in ("canonical_development_checkout", "production_use_path", "temporary_worktree_root"):
                      item = profile.get(field)
                      if not isinstance(item, dict) or not isinstance(item.get("applicable"), bool):
                          errors.append(f"profile {profile_id}.{field} must declare applicable true/false")
                  entrypoint = profile.get("operator_entrypoint")
                  if not isinstance(entrypoint, dict) or not entrypoint.get("kind") or not entrypoint.get("value"):
                      errors.append(f"profile {profile_id} must declare the real operator entrypoint")

              dev = by_id.get("repository-development", {})
              dev_checkout = dev.get("canonical_development_checkout", {}) if isinstance(dev, dict) else {}
              if dev_checkout.get("resolver") != "git rev-parse --show-toplevel":
                  errors.append("repository-development must runtime-resolve the Git root")
              if dev_checkout.get("required_remote") != REMOTE:
                  errors.append("repository-development must require canonical origin")
              if dev_checkout.get("hardcoded_absolute_path") is not False:
                  errors.append("repository-development must forbid a hard-coded absolute checkout path")
              if dev_checkout.get("allow_isolated_feature_worktree") is not True:
                  errors.append("repository-development must allow isolated feature worktrees")
              dev_worktree = dev.get("temporary_worktree_root", {}) if isinstance(dev, dict) else {}
              if dev_worktree.get("second_mutable_clone_allowed") is not False:
                  errors.append("temporary writer isolation must forbid a second mutable clone")
              if ".worktrees/web-excel-repair-triage/" not in str(dev_worktree.get("template", "")):
                  errors.append("temporary worktree root must use the canonical .worktrees family")

              public = by_id.get("public-web", {})
              if public.get("production_use_path", {}).get("value") != "https://endeavoreverlasting.github.io/web-excel-repair-triage/prompt-kit/":
                  errors.append("public-web production/use URL drifted")
              if public.get("operator_entrypoint", {}).get("value") != "https://endeavoreverlasting.github.io/web-excel-repair-triage/prompt-kit/":
                  errors.append("public-web operator entrypoint drifted")

              windows = by_id.get("windows-portable", {})
              if windows.get("production_use_path", {}).get("value") != "Outputs/prompt-kit-portable/index.html":
                  errors.append("windows-portable production/use artifact drifted")
              if windows.get("production_use_path", {}).get("served_at") != "http://127.0.0.1:8765/":
                  errors.append("windows-portable served_at drifted")
              if windows.get("operator_entrypoint", {}).get("value") != "Open-Latest-PromptKit.cmd":
                  errors.append("windows-portable operator entrypoint drifted")

              mobile = by_id.get("phone-tablet-pwa", {})
              if mobile.get("production_use_path", {}).get("value") != "https://endeavoreverlasting.github.io/web-excel-repair-triage/":
                  errors.append("phone-tablet-pwa production/use URL drifted")

              states = payload.get("proof_states")
              if not isinstance(states, list):
                  errors.append("proof_states must be a list")
                  states = []
              state_ids = [item.get("id") for item in states if isinstance(item, dict)]
              if state_ids != EXPECTED_PROOF_STATES:
                  errors.append(f"proof state order drifted: {state_ids}")
              for index, state in enumerate(states):
                  if not isinstance(state, dict):
                      errors.append("proof state entries must be objects")
                      continue
                  required = state.get("requires")
                  if not isinstance(required, list) or not required:
                      errors.append(f"proof state {state.get('id')} must declare evidence requirements")
                  forbidden = state.get("does_not_prove")
                  if not isinstance(forbidden, list):
                      errors.append(f"proof state {state.get('id')} must declare does_not_prove")
                      continue
                  expected_later = EXPECTED_PROOF_STATES[index + 1 :]
                  missing = [item for item in expected_later if item not in forbidden]
                  if missing:
                      errors.append(f"proof state {state.get('id')} improperly promotes evidence; missing does_not_prove={missing}")

              for text in _all_strings(payload):
                  if WINDOWS_PERSON_PATH.search(text) or UNIX_PERSON_PATH.search(text):
                      errors.append(f"hard-coded person-specific absolute path is forbidden: {text!r}")
                      break
              return errors


          def require_valid_contract(path: Path = CONTRACT_PATH) -> dict[str, Any]:
              payload = load_contract(path)
              errors = validate_contract(payload)
              if errors:
                  raise CanonicalPathValidationError("; ".join(errors))
              return payload


          def main(argv: list[str] | None = None) -> int:
              parser = argparse.ArgumentParser(description="Validate the canonical path/profile contract.")
              parser.add_argument("--summary", action="store_true")
              args = parser.parse_args(sys.argv[1:] if argv is None else argv)
              try:
                  payload = require_valid_contract()
              except CanonicalPathValidationError as exc:
                  print(f"Canonical path contract: FAIL - {exc}")
                  return 1
              if args.summary:
                  print(
                      "Canonical path contract: PASS "
                      f"({len(payload['profiles'])} profiles, {len(payload['proof_states'])} independent proof states)"
                  )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''
          (ROOT / "scripts/validate_canonical_paths.py").write_text(
              "\n".join(line[10:] if line.startswith("          ") else line for line in validator_source.splitlines()).lstrip() + "\n",
              encoding="utf-8",
          )

          test_source = r'''from __future__ import annotations

          import copy
          import sys
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SCRIPTS = ROOT / "scripts"
          if str(SCRIPTS) not in sys.path:
              sys.path.insert(0, str(SCRIPTS))

          import validate_canonical_paths


          class CanonicalPathContractTests(unittest.TestCase):
              def payload(self):
                  return validate_canonical_paths.load_contract()

              def assert_invalid(self, payload, phrase: str) -> None:
                  errors = validate_canonical_paths.validate_contract(payload)
                  self.assertTrue(errors)
                  self.assertIn(phrase, " | ".join(errors))

              def test_current_contract_passes(self) -> None:
                  self.assertEqual(validate_canonical_paths.validate_contract(self.payload()), [])
                  self.assertEqual(validate_canonical_paths.main([]), 0)

              def test_second_mutable_clone_fails_closed(self) -> None:
                  payload = copy.deepcopy(self.payload())
                  payload["policy"]["second_mutable_clone_allowed"] = True
                  self.assert_invalid(payload, "second_mutable_clone_allowed")

              def test_hard_coded_person_path_fails_closed(self) -> None:
                  payload = copy.deepcopy(self.payload())
                  profile = next(item for item in payload["profiles"] if item["id"] == "repository-development")
                  profile["canonical_development_checkout"]["invented_path"] = r"C:\Users\someone\Desktop\dev\web-excel-repair-triage"
                  self.assert_invalid(payload, "person-specific")

              def test_missing_production_use_path_declaration_fails_closed(self) -> None:
                  payload = copy.deepcopy(self.payload())
                  profile = next(item for item in payload["profiles"] if item["id"] == "public-web")
                  del profile["production_use_path"]["applicable"]
                  self.assert_invalid(payload, "production_use_path")

              def test_remote_main_cannot_promote_to_operator_observation(self) -> None:
                  payload = copy.deepcopy(self.payload())
                  state = payload["proof_states"][0]
                  state["does_not_prove"].remove("operator_entrypoint_observes_current")
                  self.assert_invalid(payload, "improperly promotes evidence")


          if __name__ == "__main__":
              unittest.main()
          '''
          (ROOT / "tests/test_canonical_paths.py").write_text(
              "\n".join(line[10:] if line.startswith("          ") else line for line in test_source.splitlines()).lstrip() + "\n",
              encoding="utf-8",
          )

          manifest = load_json("harness/manifest.v1.json")
          manifest["components"]["canonical_path_registry"] = "harness/canonical-paths.v1.json"
          manifest["domain_contracts"]["canonical_paths"] = {
              "contract": "harness/canonical-paths.v1.json",
              "validator": "scripts/validate_canonical_paths.py",
              "contract_tests": "tests/test_canonical_paths.py",
              "workflow": "WORKFLOW.md#c-harness-infrastructure-change",
              "harness_gate": "python scripts/validate_canonical_paths.py --summary",
              "skill": ".ai/skills/harness-infrastructure-maintenance/SKILL.md",
              "operator_report": "harness/reports/CURRENT_STATE.md",
              "deep_repair_owner": "P92"
          }
          canonical_commands = [
              "python scripts/validate_canonical_paths.py --summary",
              "python -m unittest tests.test_canonical_paths -v",
          ]
          order = manifest["validation_order"]
          for command in reversed(canonical_commands):
              if command not in order:
                  order.insert(2, command)
          write_json("harness/manifest.v1.json", manifest)

          artifacts = load_json("harness/artifacts.v1.json")
          if not any(item.get("id") == "canonical-path-contract" for item in artifacts["artifacts"]):
              artifacts["artifacts"].insert(1, {
                  "id": "canonical-path-contract",
                  "kind": "tracked",
                  "canonical_path": "harness/canonical-paths.v1.json",
                  "producer": "Harness infrastructure workflow; P92 owns deep repair/audit",
                  "validator": "canonical-path-contract",
                  "naming": "Stable versioned canonical path/profile owner under harness/.",
                  "tracking_policy": "Tracked; all launchers, updaters, worktree helpers, and operator status must resolve paths through this owner instead of inventing directories.",
                  "proof_ceiling": "Static path/profile routing and proof-state separation; does not prove a workstation checkout, deployed surface, or operator entrypoint is current."
              })
          write_json("harness/artifacts.v1.json", artifacts)

          validators = load_json("harness/validators.v1.json")
          new_validators = [
              {
                  "id": "canonical-path-contract",
                  "class": "contract",
                  "command": "python scripts/validate_canonical_paths.py --summary",
                  "blocking": True,
                  "output": "process log",
                  "proof_ceiling": "Machine-readable canonical development/use/worktree/entrypoint routing and non-promotion proof-state contract."
              },
              {
                  "id": "canonical-path-tests",
                  "class": "test",
                  "command": "python -m unittest tests.test_canonical_paths -v",
                  "blocking": True,
                  "output": "process log",
                  "proof_ceiling": "Mutation regression proof for path sprawl, person-specific paths, missing use paths, and evidence promotion."
              },
          ]
          ids = {item["id"] for item in validators["validators"]}
          insert_at = next(i for i, item in enumerate(validators["validators"]) if item["id"] == "harness-contract-tests") + 1
          for item in reversed(new_validators):
              if item["id"] not in ids:
                  validators["validators"].insert(insert_at, item)
          for profile_id in ("harness", "pre_push"):
              profile = validators["profiles"][profile_id]
              anchor = profile.index("harness-contract-tests") + 1
              for validator_id in reversed(["canonical-path-contract", "canonical-path-tests"]):
                  if validator_id not in profile:
                      profile.insert(anchor, validator_id)
          pre_commit = validators["profiles"]["pre_commit"]
          anchor = pre_commit.index("harness-contract-tests") + 1
          for validator_id in reversed(["canonical-path-contract", "canonical-path-tests"]):
              if validator_id not in pre_commit:
                  pre_commit.insert(anchor, validator_id)
          write_json("harness/validators.v1.json", validators)

          replace_once(
              "scripts/validate_harness.py",
              "import evaluate_prompt_language\n",
              "import evaluate_prompt_language\nimport validate_canonical_paths\n",
          )
          replace_once(
              "scripts/validate_harness.py",
              '    "artifact_registry_machine",\n',
              '    "artifact_registry_machine",\n    "canonical_path_registry",\n',
          )
          replace_once(
              "scripts/validate_harness.py",
              '    "harness-control-plane",\n',
              '    "harness-control-plane",\n    "canonical-path-contract",\n',
          )
          replace_once(
              "scripts/validate_harness.py",
              '    "harness-contract-tests",\n',
              '    "harness-contract-tests",\n    "canonical-path-contract",\n    "canonical-path-tests",\n',
          )
          replace_once(
              "scripts/validate_harness.py",
              '            "harness/validators.v1.json",\n',
              '            "harness/validators.v1.json",\n            "harness/canonical-paths.v1.json",\n',
          )
          replace_once(
              "scripts/validate_harness.py",
              '            "### C. Harness infrastructure change",\n',
              '            "### C. Harness infrastructure change",\n            "harness/canonical-paths.v1.json",\n',
          )
          replace_once(
              "scripts/validate_harness.py",
              '            "Machine artifact registry",\n',
              '            "Machine artifact registry",\n            "Canonical path contract",\n',
          )
          replace_once(
