name: Temporary hierarchy convergence executor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  converge:
    if: contains(github.event.head_commit.message, 'execute hierarchy convergence')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-hierarchical-filters-20260823
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconcile feature with product floor
        shell: bash
        env:
          PRODUCT_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/prompt-kit-hierarchical-filters-20260823 --prune
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/prompt-kit-hierarchical-filters-20260823)"
          git cat-file -e "$PRODUCT_BASE_SHA^{commit}"
          echo "feature_pre=$(git rev-parse HEAD)"
          echo "product_base=$PRODUCT_BASE_SHA"
          git merge --no-edit "$PRODUCT_BASE_SHA"

      - name: Restrict patch to hierarchy-only durable state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.prompt-contrib/hierarchical_filter_patch.py')
          if not path.exists():
              raise SystemExit('hierarchical filter patch transport missing')
          text = path.read_text(encoding='utf-8')

          anchor = 'test = test.replace("self.assertIn(\\"aria-label\x27,\x27Prompt types\\", js)", "self.assertIn(\\"aria-label\x27,\x27Prompt subcategories\\", js)")'
          label_patch = 'test = test.replace(\x27        self.assertIn("All Types", js)\\n\x27, \x27        self.assertIn("All Subcategories", js)\\n\x27)'
          if label_patch not in text:
              if anchor not in text:
                  raise SystemExit('hierarchical filter label-repair anchor missing')
              text = text.replace(anchor, label_patch + '\n' + anchor, 1)

          cleanup_old = '''if WORKFLOW.exists():\n    run("git", "rm", str(WORKFLOW.relative_to(ROOT)))\nrun("git", "rm", str(SELF.relative_to(ROOT)))'''
          cleanup_new = '''for relative in (\n    ".github/workflows/prompt-kit-hierarchical-filter-repair.yml",\n    ".prompt-contrib/hierarchical_filter_patch.py",\n    ".prompt-contrib/hierarchical_filter_search_suppression.yml",\n    ".prompt-contrib/hierarchical_filter_trigger.txt",\n    ".prompt-contrib/search_filter_suppression_patch.py",\n    ".prompt-contrib/tmp-filter-mainline-trigger.txt",\n):\n    candidate = ROOT / relative\n    if candidate.exists():\n        run("git", "rm", relative)'''
          if cleanup_new not in text:
              if cleanup_old not in text:
                  raise SystemExit('hierarchy transport-cleanup anchor missing')
              text = text.replace(cleanup_old, cleanup_new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Execute hierarchy patch and owning proof
        shell: bash
        run: |
          set -euo pipefail
          python .prompt-contrib/hierarchical_filter_patch.py

      - name: Prove remote branch contains only durable hierarchy files
        shell: bash
        env:
          PRODUCT_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch origin feat/prompt-kit-hierarchical-filters-20260823 --prune
          remote_head="$(git rev-parse origin/feat/prompt-kit-hierarchical-filters-20260823)"
          test "$(git rev-parse HEAD)" = "$remote_head"
          expected="docs/prompt-kit.js
harness/contracts/prompt-kit-filtering.v1.json
tests/test_prompt_kit_filtering_access.py
web/prompt-kit/index.html"
          actual="$(git diff --name-only "$PRODUCT_BASE_SHA"...HEAD | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check "$PRODUCT_BASE_SHA"...HEAD
