name: Temporary hierarchy state-transition repair

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: prompt-kit-versioning-owner-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: github.event.issue.pull_request && github.event.issue.number == 391 && github.event.comment.body == '/discover-versioning-owner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-versioning-system-establisher-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh branch and main evidence
        run: |
          set -euo pipefail
          git fetch origin main feat/prompt-kit-versioning-system-establisher-20260908 --prune
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MAIN=$(git rev-parse origin/main)"
          git status --short
      - name: Inspect Prompt Kit registry routing
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py inspect | tee "$RUNNER_TEMP/prompt-registry-inspect.json"
      - name: Search registered prompts.chat catalog
        run: |
          set -euo pipefail
          python scripts/search_operant_external_catalog.py --source prompts-chat --query "repository versioning semantic versioning release strategy" --limit 10 --json | tee "$RUNNER_TEMP/prompts-chat-versioning-search.json"
      - name: Search registered skill projections
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('web/prompt-kit/resources.v1.json').read_text(encoding='utf-8'))
          wanted={'version','versioning','semantic','semver','release','releases','tag','tags','changelog'}
          rows=[]
          for r in data.get('resources',[]):
              if r.get('source_id') not in {'deepseek-harness','mattpocock-skills'}:
                  continue
              hay=' '.join([str(r.get('title','')), *map(str,r.get('search_terms',[]))]).lower()
              hits=sorted(t for t in wanted if t in hay)
              if hits:
                  rows.append({'source_id':r.get('source_id'),'title':r.get('title'),'path':r.get('path'),'matched_terms':hits,'url':r.get('url')})
          print(json.dumps({'query_terms':sorted(wanted),'hits':rows},indent=2))
          PY
      - name: Validate external-resource owner
        run: |
          set -euo pipefail
          python scripts/validate_operant_external_resources.py --summary
          python -m unittest tests.test_operant_external_resources -v
