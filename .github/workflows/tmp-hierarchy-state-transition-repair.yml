name: Temporary hierarchy state-transition repair

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: prompt-kit-versioning-system-establisher
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.issue.pull_request && github.event.issue.number == 391 && github.event.comment.body == '/apply-versioning-prompt-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-versioning-system-establisher-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute bounded versioning prompt contribution
        run: python tmp/versioning_prompt_executor.py
