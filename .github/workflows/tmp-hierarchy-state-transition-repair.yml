name: Temporary hierarchy state-transition repair

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: prompt-kit-versioning-system-establisher
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.issue.pull_request && github.event.issue.number == 391 && github.event.comment.body == '/apply-versioning-prompt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-versioning-system-establisher-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile restored main floor without transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/prompt-kit-versioning-system-establisher-20260908 --prune
          CARRIER_HEAD="$(git rev-parse origin/main)"
          BASE="$(git rev-parse "${CARRIER_HEAD}^")"
          echo "carrier_head=$CARRIER_HEAD"
          echo "semantic_base=$BASE"
          test "$BASE" = "61fe7ed44f2ea7ed3925ce6898eddc767e80c41a"
          test "$(git diff --name-only "$BASE" "$CARRIER_HEAD")" = ".github/workflows/tmp-hierarchy-state-transition-repair.yml"
          git merge --no-edit "$BASE"
          if test -f .github/workflows/tmp-versioning-owner-discovery.yml; then
            git rm .github/workflows/tmp-versioning-owner-discovery.yml
          fi
          git status --short

      - name: Record baseline and create semantic draft
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_prompt_kit_registry import load_prompt_registry
          prompts=load_prompt_registry()
          Path('/tmp/versioning-baseline.json').write_text(json.dumps({'count':len(prompts),'ids':[p['id'] for p in prompts]}),encoding='utf-8')
          draft={
            'name':'Repository Versioning System Establisher',
            'type':'BUILD + FACTOR',
            'class':'REPOSITORY / VERSIONING + RELEASE IDENTITY',
            'sprintRole':'Establish one evidence-based, enforceable repository/product versioning authority, bump policy, synchronized version surfaces, and release identity path before ordinary release execution begins',
            'progress':'YES',
            'useWhen':'A repository or product has no coherent human-facing release version, has multiple drifting version labels, uses commit hashes or schema versions without an operator-facing release sequence, applies version bumps inconsistently, or needs a durable versioning system before normal merge/release execution can be trusted.',
            'inspectFirst':'Current default branch and recent tags/releases; package/plugin/app manifests; visible version labels; schemas/protocol versions; changelog/release-note tooling; CI/release workflows; artifact identity contracts; consumers and compatibility promises; rollback/deprecation history; then credible existing release/versioning tooling already present in the stack.',
            'expectedOutput':'A repository-native versioning authority and policy with justified scheme selection, deterministic bump rules, synchronized product-version surfaces, changelog/tag/release wiring, compatibility/migration/rollback rules, bootstrap/cutover evidence, focused regression proof, and integration into the current default branch; actual publishing remains a downstream gate when release credentials or production authority are separate.',
            'nextStep':'Implement the selected version authority and its smallest enforceable automation now, prove bump and synchronization behavior with fixtures or dry runs, integrate the exact green change into the current default branch, then hand ordinary release execution to the repository release owner.',
            'proofGate':'One canonical human-facing product release authority is named; exact Git/artifact identity remains distinct; the scheme choice is evidence-based rather than cargo-culted; bump/no-bump semantics and synchronized surfaces are machine-checkable; migration does not rewrite history or reuse released versions; compatibility, deprecation, rollback, changelog, tag, and release behavior are explicit; focused tests and registered validators pass; and the validated owned change is contained in the refreshed default branch.',
            'color':'Teal',
            'category':'standard',
            'profile':'spec-architecture',
            'copyContent':'''ESTABLISH AND ENFORCE ONE VERSIONING SYSTEM FOR THIS REPOSITORY. DO NOT MERELY EXPLAIN THE CURRENT LABELS, ADD A DECORATIVE VERSION NUMBER, OR START TAGGING RELEASES WITHOUT FIRST DEFINING THE AUTHORITY THAT MAKES THOSE TAGS MEAN SOMETHING.

Repository / product: xyz_repo_or_product
Current version clues, if known: xyz_tags_manifests_labels_or_unknown
Compatibility / consumers: xyz_consumers_or_resolve_from_evidence
Release target, if any: xyz_release_target_or_not_yet

MISSION
Turn ambiguous, missing, or fragmented versioning into one durable repository-native system. Establish how a human-facing product release is identified, how the next version is derived from changes, which files/surfaces must agree, how tags/releases/changelogs are produced, and how compatibility or rollback is handled. Preserve exact commit/artifact identity as proof; a friendly release label supplements exact identity and must never replace it.

1. REFRESH AND INVENTORY THE REAL VERSION SURFACES
- Refresh the remote default branch and inspect current tags/releases before mutation.
- Find every version-like surface that can be mistaken for product authority: package/application manifests, plugin metadata, desktop/mobile bundle versions, UI labels, API versions, schema/protocol versions, database migration generations, generated artifacts, docs, release workflows, changelogs, and Git tags.
- Classify each as PRODUCT RELEASE VERSION, SCHEMA/PROTOCOL VERSION, BUILD/ARTIFACT IDENTITY, DEPENDENCY VERSION, or DESCRIPTIVE DISPLAY ONLY.
- Do not promote a schema version, capability version, visible vXX label, date, or commit abbreviation into product authority merely because it already exists.
- Identify current consumers and compatibility promises. If no meaningful compatibility boundary exists, say so instead of pretending SemVer semantics exist.

2. REUSE PRIOR ART WITHOUT CARGO-CULTING IT
- Inspect release/version tooling already present in the repository and ecosystem before creating a new mechanism.
- Consider established patterns such as Changesets-style reviewed version PRs and synchronized manifest/plugin versions, release-please or semantic-release style automation, conventional changelog tooling, or a small repository-owned version command when those fit the stack.
- Adopt mechanics, not slogans. Do not install a heavyweight release framework when a small deterministic owner is sufficient.
- Preserve one source of truth. Generated or mirrored version fields must derive from or be validated against that owner.

3. CHOOSE THE VERSION SCHEME FROM PRODUCT SEMANTICS
Select and justify the smallest scheme that matches the actual product:
- SemVer when MAJOR/MINOR/PATCH can be tied to a real public compatibility contract.
- CalVer when time/cadence is the primary release identity and compatibility is governed separately.
- A monotonic release/build sequence, or another documented scheme, when neither SemVer nor CalVer truthfully models the product.
Do not choose SemVer merely because it is familiar. Record why the selected scheme fits and what evidence would justify changing schemes later.

4. DEFINE DETERMINISTIC BUMP AND NO-BUMP RULES
Create a change-to-version matrix. For SemVer, define what this repository specifically means by breaking/major, compatible feature/minor, and compatible fix/patch. For another scheme, define equivalent advancement rules.
Explicitly decide how to handle:
- docs-only, tests-only, refactors, internal tooling, generated-file-only changes;
- user-visible fixes and features;
- breaking API/config/data-format/CLI behavior;
- prereleases, release candidates, hotfixes, and backports when relevant.
The rule must let two competent executors derive the same next version from the same accepted change set. If human judgment remains, name the narrow judgment gate instead of disguising it as automation.

5. ESTABLISH ONE CANONICAL VERSION AUTHORITY
- Name the authoritative file/metadata source or release record.
- List every synchronized version surface and whether it is generated, mirrored, or independently schema-versioned.
- Add a deterministic check that fails when product-version mirrors drift.
- Keep schema/API/protocol versions independent when their compatibility lifecycle is not identical to the product release lifecycle.
- A Git tag must resolve to the exact validated release commit/artifact; a UI badge alone is never freshness proof.

6. BOOTSTRAP WITHOUT REWRITING HISTORY
- Infer a defensible starting version from existing releases/tags/product maturity when possible; otherwise choose and document an explicit cutover version.
- Do not rename old tags, rewrite published history, decrement a version, or reuse a released version number to make history look cleaner.
- Record the cutover rule so old ad-hoc labels remain interpretable without remaining authoritative.

7. INSTALL THE RELEASE MECHANICS
Implement the smallest repository-native path that fits the chosen policy:
- a version/bump or version-PR command;
- synchronized manifest/update logic where required;
- changelog or release-note generation from reviewed change evidence;
- tag/release creation wiring only after owning validation succeeds;
- CI or hooks that reject impossible versions, drift, reused tags, or releases from an unvalidated/stale commit.
Where release publication needs credentials, protected environments, stores, registries, or production authority, install and prove everything up to that boundary and name the exact downstream gate.

8. COMPATIBILITY, DEPRECATION, MIGRATION, AND ROLLBACK
- Define what a consumer can infer from a version change.
- For breaking changes, require migration/deprecation evidence appropriate to the product.
- Treat rollback as redeploying/restoring a previously identified artifact or commit, not decrementing or reusing a version.
- If a release must be withdrawn, preserve its historical identity and document replacement/yank behavior rather than erasing it.

9. PROVE THE SYSTEM BEFORE CALLING IT DONE
Add focused tests/fixtures or dry-run proofs that cover at least:
- representative no-bump and bump cases;
- the highest-impact compatibility/breaking case for the chosen scheme;
- synchronization of all declared product-version mirrors;
- idempotent calculation from the same accepted change set;
- tag/release identity pointing at the exact validated commit/artifact;
- failure when a version surface drifts or a released version would be reused.
Run the repository's owning validators/builds and git diff checks. Do not claim a published/runtime release merely from static or CI policy proof.

10. CONVERGE, THEN RELEASE THROUGH THE DOWNSTREAM OWNER
Integrate the exact validated versioning-system change into the refreshed default branch when authorized. Report the canonical version authority, current/cutover version, scheme and bump matrix, synchronized surfaces, automation entrypoint, changelog/tag path, compatibility/rollback rules, validation evidence, and proof ceiling.
Once the system is established, ordinary merge/release execution is downstream work. Reuse the repository's existing release executor rather than turning this prompt into a perpetual release prompt.

DEFINITION OF DONE
The repository has one human-friendly release-version authority whose semantics are deterministic and enforced; exact Git/artifact identity remains available for forensic freshness; competing version-like surfaces are classified instead of conflated; release mechanics cannot silently drift mirrors or reuse history; compatibility and rollback meaning is documented; representative bump behavior is tested; and the validated system is integrated into the current default branch or stopped at one exact external publication/authority blocker.''',
            'keywords':['versioning system','repository versioning','product version','semantic versioning','semver','calver','version authority','version bump','release identity','release tags','changelog','changesets','release automation','version drift','compatibility version','version policy']
          }
          Path('/tmp/versioning-prompt-draft.json').write_text(json.dumps(draft,indent=2),encoding='utf-8')
          PY

      - name: Add through canonical registry helper
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py add --input /tmp/versioning-prompt-draft.json --registry spec-architecture-prompts > /tmp/versioning-helper-receipt.json
          cat /tmp/versioning-helper-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('/tmp/versioning-helper-receipt.json').read_text())
          assert receipt['site_parity'] is True, receipt
          assert receipt['registry_id']=='spec-architecture-prompts', receipt
          assert receipt['name']=='Repository Versioning System Establisher', receipt
          Path('/tmp/allocated-id').write_text(receipt['id'])
          PY

      - name: Add focused semantic regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          prompt_id=Path('/tmp/allocated-id').read_text().strip()
          code=f'''import unittest\n\nfrom scripts.build_prompt_kit_registry import load_prompt_registry\n\n\nclass RepositoryVersioningSystemPromptTests(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        cls.prompts = load_prompt_registry()\n        cls.prompt = next(p for p in cls.prompts if p.get("name") == "Repository Versioning System Establisher")\n        cls.p15 = next(p for p in cls.prompts if p.get("id") == "P15")\n\n    def test_helper_allocated_identity_and_downstream_owner_remain_distinct(self):\n        self.assertEqual(self.prompt["id"], {prompt_id!r})\n        self.assertNotEqual(self.prompt["id"], self.p15["id"])\n        p15_text = " ".join(str(self.p15.get(k, "")) for k in ("name", "sprintRole", "useWhen", "copyContent")).lower()\n        self.assertIn("release", p15_text)\n        self.assertIn("merge", p15_text)\n\n    def test_versioning_owner_establishes_policy_before_release_execution(self):\n        text = self.prompt["copyContent"].lower()\n        required = [\n            "one canonical version authority",\n            "exact commit/artifact identity",\n            "semver",\n            "calver",\n            "do not choose semver merely because it is familiar",\n            "change-to-version matrix",\n            "synchronized version surface",\n            "changelog",\n            "do not rename old tags",\n            "rollback",\n            "deprecation",\n            "idempotent",\n            "released version would be reused",\n            "ordinary merge/release execution is downstream work",\n        ]\n        for phrase in required:\n            self.assertIn(phrase, text)\n\n    def test_scheme_selection_preserves_schema_and_release_identity_boundaries(self):\n        text = self.prompt["copyContent"].lower()\n        self.assertIn("schema/protocol version", text)\n        self.assertIn("product release version", text)\n        self.assertIn("ui badge alone is never freshness proof", text)\n        self.assertIn("does not prove a published/runtime release", text.replace("do not claim a published/runtime release", "does not prove a published/runtime release"))\n\n\nif __name__ == "__main__":\n    unittest.main()\n'''
          Path('tests/test_repository_versioning_system_prompt.py').write_text(code,encoding='utf-8')
          PY
          python -m unittest tests.test_repository_versioning_system_prompt -v

      - name: Validate contribution pass 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery -v
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/evaluate_prompt_language.py --output "$RUNNER_TEMP/prompt-language-audit.json" --summary
          python -m unittest tests.test_skill_prompt_registry -v
          python scripts/validate_prompt_kit_order_navigation.py --output "$RUNNER_TEMP/prompt-kit-order-navigation-audit.json" --summary
          python -m unittest tests.test_prompt_kit_order_navigation_contract -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Whole-chat harvest pass 2 and distinctness falsification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/search_operant_external_catalog.py --source prompts-chat --query "repository versioning semantic versioning release strategy" --limit 10 > "$RUNNER_TEMP/prompts-chat-versioning-pass2.json"
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_prompt_kit_registry import load_prompt_registry
          baseline=json.loads(Path('/tmp/versioning-baseline.json').read_text())
          prompts=load_prompt_registry()
          assert len(prompts)==baseline['count']+1, (baseline['count'],len(prompts))
          added=[p for p in prompts if p['id'] not in baseline['ids']]
          assert len(added)==1, [p['id'] for p in added]
          p=added[0]
          assert p['name']=='Repository Versioning System Establisher', p['name']
          assert p['id']==Path('/tmp/allocated-id').read_text().strip(), (p['id'],Path('/tmp/allocated-id').read_text())
          p15=next(x for x in prompts if x['id']=='P15')
          assert p15['id'] in baseline['ids']
          text=p['copyContent'].lower()
          for phrase in ('semver','calver','one canonical version authority','change-to-version matrix','bootstrap without rewriting history','ordinary merge/release execution is downstream work'):
              assert phrase in text, phrase
          external=json.loads(Path(__import__('os').environ['RUNNER_TEMP']).joinpath('prompts-chat-versioning-pass2.json').read_text())
          assert external['automatic_prompt_authoring'] is False
          assert external['policy']['promotion_owner_prompt']=='P79'
          assert external['hit_count']>0
          assert all(h['disposition'] in {'REFERENCE_ONLY','ADAPT'} for h in external['hits'])
          PY
          python -m unittest tests.test_repository_versioning_system_prompt -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Commit durable contribution and push
        shell: bash
        run: |
          set -euo pipefail
          git add registry/prompts/spec-architecture-prompts.v1.json tests/test_repository_versioning_system_prompt.py web/prompt-kit/index.html
          git diff --cached --check
          echo '--- durable staged files ---'
          git diff --cached --name-only
          test ! -e .github/workflows/tmp-versioning-owner-discovery.yml
          git commit -m "feat(prompt-kit): add repository versioning system establisher"
          git push origin HEAD:feat/prompt-kit-versioning-system-establisher-20260908
          echo "FEATURE_HEAD=$(git rev-parse HEAD)"
