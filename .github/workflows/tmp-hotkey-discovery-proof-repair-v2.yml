name: Temporary natural hotkey convergence

on:
  push:
    branches:
      - fix/operant-natural-prompt-hotkeys-20260908

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owning branch
        uses: actions/checkout@v7
        with:
          ref: fix/operant-natural-prompt-hotkeys-20260908
          fetch-depth: 0

      - name: Reconcile refreshed main with bounded conflict ownership
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          owned_head="$(git rev-parse HEAD)"
          main_floor="$(git rev-parse origin/main)"
          echo "OWNED_HEAD=$owned_head" >> "$GITHUB_ENV"
          echo "MAIN_FLOOR=$main_floor" >> "$GITHUB_ENV"
          echo "owned_head=$owned_head"
          echo "main_floor=$main_floor"

          if ! git merge-base --is-ancestor origin/main HEAD; then
            set +e
            git merge --no-edit origin/main
            merge_status=$?
            set -e
            if [ "$merge_status" -ne 0 ]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
              printf 'conflicts=%s\n' "${conflicts[*]}"
              expected=(
                "docs/prompt-kit-polish.js"
                "tests/test_prompt_kit_hotkey_completion.py"
                "tests/test_prompt_kit_hotkey_identity_runtime.py"
                "web/README.md"
                "web/prompt-kit/index.html"
              )
              mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
              if [ "$(printf '%s\n' "${conflicts[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]; then
                echo "Unexpected conflict set; refusing to guess." >&2
                git status --short
                exit 31
              fi

              # #376 owns the keyboard implementation and its focused test.
              git checkout --ours -- docs/prompt-kit-polish.js tests/test_prompt_kit_hotkey_completion.py
              # Current main owns the newer runtime regression, human guide, and generated artifact floor.
              git checkout --theirs -- tests/test_prompt_kit_hotkey_identity_runtime.py web/README.md web/prompt-kit/index.html
              git add -- \
                docs/prompt-kit-polish.js \
                tests/test_prompt_kit_hotkey_completion.py \
                tests/test_prompt_kit_hotkey_identity_runtime.py \
                web/README.md \
                web/prompt-kit/index.html
              git commit --no-edit
            fi
          fi

          git merge-base --is-ancestor origin/main HEAD
          echo "reconciled_head=$(git rev-parse HEAD)"

      - name: Converge current contracts on catalog-derived numeric hotkeys
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          # ---- Human hotkey design: retire persistence/Favorite activation doctrine without rewriting unrelated design. ----
          design_path = Path('docs/PROMPT_KIT_HOTKEY_PROGRAM_DESIGN.md')
          design = design_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "- Every current Favorite automatically publishes its canonical lower-case prompt ID as a typed shortcut such as `p95`; manual shortcut configuration remains a compatibility/repair path, not a second commitment step.",
                  "- Every canonical prompt publishes its bare numeric identity as the primary typed shortcut (`126` → `P126`); the `p126` form remains a compatibility alias. Favorites are organizational metadata and never authorize shortcut activation.",
              ),
              (
                  "- Every current Favorite automatically publishes its canonical lower-case prompt ID as a stored shortcut such as `p95`; the keyboard matching grammar publishes digit aliases (`95`) so operators type digits only. Manual shortcut configuration remains a compatibility/repair path, not a second commitment step.",
                  "- Every canonical prompt publishes its bare numeric identity as the primary typed shortcut (`126` → `P126`); the `p126` form remains a compatibility alias. Favorites are organizational metadata and never authorize shortcut activation.",
              ),
              (
                  "- Built-ins and user bindings cannot silently collide.",
                  "- Built-ins and header commands keep their reserved key domains outside an active prompt-number buffer; prompt digits belong to catalog-derived prompt identity.",
              ),
              (
                  "- Durable binding writes are fail-closed: storage failure does not publish a new in-memory binding.",
                  "- Manual prompt-shortcut persistence is retired; the canonical catalog is the production authority for prompt-number activation.",
              ),
              (
                  "- **ShortcutGesture**: normalized key or typed sequence (`f`, `[`, `]`, `p95`).",
                  "- **ShortcutGesture**: normalized key or typed sequence (`f`, `[`, `]`, `126`, `p126`).",
              ),
              (
                  "- **ShortcutRegistry**: canonical effective map of built-ins plus persisted user bindings.",
                  "- **ShortcutRegistry**: effective map of built-ins plus prompt bindings derived from the canonical `PROMPTS` catalog.",
              ),
              (
                  "- **ShortcutStore**: persistence port for user bindings; a namespaced/versioned `localStorage` adapter is the expected production implementation.\n",
                  "",
              ),
              (
                  "Owns built-ins and user bindings.\n\nPublic seam:\n- `effectiveBindings()`\n- `configure(binding)`\n- later: `remove(gesture)`\n\nMutation rule: validate → assemble candidate → persist candidate → publish candidate. A failed save returns `PERSISTENCE_FAILED` and leaves the prior effective map intact.",
                  "Owns built-ins and catalog-derived prompt bindings.\n\nPublic seam:\n- `effectiveBindings()`\n\nPrompt bindings are rebuilt from canonical prompt identities; there is no production configure/remove persistence path for prompt shortcuts.",
              ),
              (
                  "Owns transient sequence state (`p` → `p9` → `p95`).",
                  "Owns transient sequence state (`1` → `12` → `126`, with optional compatibility prefix `p`).",
              ),
              (
                  "Dependencies: ShortcutRegistry, ShortcutPolicy, FilterVisibility, PromptNavigator, and existing semantic navigation actions. It must not know card selectors or storage serialization.",
                  "Dependencies: ShortcutRegistry, ShortcutPolicy, FilterVisibility, PromptNavigator, and existing semantic navigation actions. It must not know card selectors or invent a second prompt-identity source.",
              ),
              (
                  "### ShortcutStore\nPublic seam: `load()` / `save(config)`.\n\nSerialization ends here. Domain validation begins after loading.\n\n",
                  "",
              ),
              (
                  "`keydown / pointer UI → ShortcutDispatcher → ShortcutPolicy + ShortcutRegistry → semantic action → DOM/storage adapter`",
                  "`keydown / pointer UI → ShortcutDispatcher → ShortcutPolicy + ShortcutRegistry → semantic action → DOM adapter`",
              ),
              (
                  "Starting state: `P11`, `P13`, and `P111` exist and their canonical lower-case sequences are configured.\n\n`p13` → exact non-prefix binding resolves immediately → `PromptNavigator.openPrompt('P13')`.\n\n`p11` → exact binding is also a prefix of `p111` → dispatcher holds the candidate → the existing\n1.2-second boundary expires with no continuation → `PromptNavigator.openPrompt('P11')`.\n\n`p111` → the buffered `p11` candidate receives the final `1` before timeout → the longer exact binding\nresolves → the pending shorter match is cancelled → `PromptNavigator.openPrompt('P111')`.",
                  "Starting state: `P11`, `P13`, and `P111` exist in the canonical catalog; no Favorite or manual setup is required.\n\n`13` → exact non-prefix binding resolves immediately → copy + snap `P13`.\n\n`11` → exact binding is also a prefix of `111` → dispatcher holds the candidate → the existing\n1.2-second boundary expires with no continuation → copy + snap `P11`.\n\n`111` → the buffered `11` candidate receives the final `1` before timeout → the longer exact binding\nresolves → the pending shorter match is cancelled → copy + snap `P111`. `p13`, `p11`, and `p111` remain compatibility aliases.",
              ),
              (
                  "- **Collision:** configure `f → OPEN_PROMPT(P95)` → policy sees reserved built-in → `RESERVED_COLLISION` → no store write.\n- **Unknown target:** configure `p999 → OPEN_PROMPT(P999)` → catalog rejection → `UNKNOWN_PROMPT` → no store write.\n- **Storage failure:** validated `p95` candidate → `ShortcutStore.save` fails → `PERSISTENCE_FAILED` → previous effective registry remains authoritative.\n- **Editable target:** key event from search/input → `EDITABLE_TARGET`/ignored → sequence state and product state unchanged.",
                  "- **Reserved domain:** outside an active prompt-number buffer, built-ins/header keys retain precedence and are not reinterpreted as prompt identities.\n- **Unknown target:** an unmatched numeric candidate has no canonical prompt target and performs no prompt activation.\n- **Editable target:** key event from search/input → `EDITABLE_TARGET`/ignored → sequence state and product state unchanged.",
              ),
              (
                  "**Selected:** one dispatcher + semantic state owners. It keeps the interface small while centralizing the hard behavior: collision resolution, sequence buffering, persistence publication, and command dispatch.",
                  "**Selected:** one dispatcher + semantic state owners. It keeps the interface small while centralizing the hard behavior: reserved-domain resolution, sequence buffering, catalog-derived prompt lookup, and command dispatch.",
              ),
              (
                  "- `p95` is an ordinary configured sequence, not a special prompt-ID handler.\n- sequence state belongs in the dispatcher, not storage or PromptNavigator.\n- persistence must succeed before a new binding becomes effective.",
                  "- bare numeric identity is the ordinary catalog-derived prompt route; `p###` is compatibility only.\n- sequence state belongs in the dispatcher, not Favorites or PromptNavigator.\n- manual prompt-shortcut persistence is retired; catalog membership is the activation authority.",
              ),
              ("- configured prompt-ID sequences expire after 1.2 seconds.", "- prompt-number sequences expire after 1.2 seconds."),
              (
                  "- shortcut persistence uses versioned `promptKit.promptShortcuts.v1` storage and publishes only after a successful durable write.",
                  "- **Superseded:** the earlier `promptKit.promptShortcuts.v1` persistence design is retired; production derives prompt shortcuts directly from `PROMPTS`.",
              ),
              (
                  "- opening Hotkeys by either the visible button or unmodified backtick reveals and focuses the Favorite prompt ID input; `Escape` closes Hotkeys even while that editable input owns focus and restores focus to the Hotkeys toggle.",
                  "- **Superseded:** Hotkeys no longer exposes a Favorite prompt-ID shortcut input. Opening by the visible button or backtick reveals the help surface and focuses its close control; `Escape` closes it and restores focus to the Hotkeys toggle.",
              ),
              ("- configured shortcut rows sort by numeric prompt sequence rather than lexicographic ID text.", "- displayed prompt-shortcut rows sort by numeric prompt identity rather than lexicographic ID text."),
              (
                  "- a registry prompt may publish a shared recommended shortcut by shipping `sharedShortcut: true` in its canonical registry record; the effective typed sequence is the lowercase prompt ID.\n- shared recommended shortcuts are active for every user without requiring a Favorite and complete through the same copy + reveal dispatch path.",
                  "- a registry prompt may publish `sharedShortcut: true` as recommendation/discoverability metadata; that flag does not authorize activation.\n- every canonical prompt is active for every user through the same catalog-derived copy + snap dispatch path, regardless of recommendation or Favorite metadata.",
              ),
              (
                  "Repository proof must cover the production source, generated-site parity, input/modifier suppression, filter commands, sequence collision ordering, timeout semantics, fail-closed persistence, target validation, and canonical prompt-detail dispatch.",
                  "Repository proof must cover the production source, generated-site parity, input/modifier suppression, filter commands, sequence collision ordering, timeout semantics, catalog target validation, copy + snap dispatch, and observed bare-numeric browser input.",
              ),
              (
                  "- Prompt detail exposes the same Favorite state as the card star. Favoriting from either surface immediately makes the canonical lower-case prompt ID an effective hotkey; no second Save-shortcut action is required.",
                  "- Prompt detail exposes the same Favorite state as the card star. Favoriting from either surface changes organization only; the prompt's catalog-derived numeric hotkey was already effective and remains effective after unfavoriting.",
              ),
          ]
          for old, new in replacements:
              if old in design:
                  design = design.replace(old, new, 1)
          stale_design = (
              'Every current Favorite automatically publishes',
              'manual shortcut configuration remains a compatibility/repair path',
              '**ShortcutStore**',
              'ShortcutStore.save',
              'Favoriting from either surface immediately makes the canonical lower-case prompt ID an effective hotkey',
          )
          found = [marker for marker in stale_design if marker in design]
          if found:
              raise SystemExit(f'stale hotkey doctrine remains: {found}')
          design_path.write_text(design, encoding='utf-8')

          # ---- Preserve current-main documentation, changing only the hotkey ownership paragraphs. ----
          readme_path = Path('web/README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'The glowing **Hotkeys** module beside the floating reference control is the in-product shortcut reference, five-tab profile editor, profile-pack importer, and favorite-prompt shortcut configurator.',
              'The glowing **Hotkeys** module beside the floating reference control is the in-product shortcut reference, five-tab profile editor, and profile-pack importer.',
              1,
          )
          start = readme.index('Favorite-prompt shortcuts are configured from the Hotkeys panel.')
          end = readme.index('\n\n**Mode separation for known prompt IDs:**', start)
          readme = readme[:start] + (
              'Every canonical prompt has a natural keyboard identity derived from the `PROMPTS` catalog. '
              'Type the digits after `P` anywhere outside editable fields: `126` → `P126`; no Favorite and no Save-shortcut step is required. '
              'The compatibility form `p126` remains accepted. Sequences expire after 1.2 seconds; a shorter exact ID waits when it prefixes a longer ID, and dots may be used as visual separators while the buffer is active. '
              'Successful activation copies the canonical prompt and instant-snaps its card to center without opening detail. The Hotkeys panel teaches this route and may label Favorites or registry recommendations without making either state an activation gate.'
          ) + readme[end:]
          readme = readme.replace(
              '- **Keyboard:** digits-only sequences for favorite/recommended bindings (copy + reveal).',
              '- **Keyboard:** digits-only sequences for every canonical prompt (copy + instant snap); Favorites/recommendations do not gate activation.',
              1,
          )
          p_start = readme.index('A configured shortcut is rejected when its target is unknown or not currently a Favorite.')
          p_end = readme.index('\n\nNavigation shortcuts are ignored while typing', p_start)
          readme = readme[:p_start] + (
              'Unknown numeric identities do not activate a prompt. Prompt-number activation has no browser-storage publication step: the canonical catalog is the authority, while Favorites remain independent user organization. '
              'Registry `sharedShortcut: true` remains recommendation/discoverability metadata (currently `P95`) and does not grant or revoke activation. Once a prompt-number buffer is active, it owns following digits; header navigation remains letter-only.'
          ) + readme[p_end:]
          stale_readme = (
              'Favorite-prompt shortcuts are configured from the Hotkeys panel',
              'promptKit.promptShortcuts.v1',
              'not currently a Favorite',
              'favorite/recommended bindings',
              'favorite-prompt shortcut configurator',
          )
          found = [marker for marker in stale_readme if marker in readme]
          if found:
              raise SystemExit(f'stale README hotkey ownership remains: {found}')
          readme_path.write_text(readme, encoding='utf-8')

          # ---- Preserve the fresh P129 three-mode contract but advance keyboard authority to every catalog prompt. ----
          contract_path = Path('harness/contracts/prompt-kit-cross-input-modality.v1.json')
          payload = json.loads(contract_path.read_text(encoding='utf-8'))
          by_id = {item['id']: item for item in payload['capabilities']}
          by_id['favorites_view']['keyboard'] = 'Favorites profile slot (default C); prompt-number activation remains catalog-derived and independent of Favorite membership'
          by_id['copy_act']['keyboard'] = 'Space on focused card; catalog-derived prompt-number sequences copy + instant-snap without detail'
          by_id['copy_known_id']['capability'] = 'Copy known canonical prompt ID'
          by_id['copy_known_id']['keyboard'] = 'type digits only (126 for P126) for every canonical prompt → copy + instant-snap without detail; leading p remains a compatibility alias'
          by_id['copy_known_id']['state_owner'] = 'canonical PROMPTS catalog + clipboard adapter + copy acknowledgement UI'
          by_id['copy_known_id']['proof'] = 'hotkey completion + identity runtime + interaction contract + mobile card-tap browser proof'
          by_id['command_surface']['phone'] = 'More command sheet (labeled buttons; desktop hotkey help/configuration chrome hidden)'
          rules = payload.get('semantic_convergence_rules') or []
          for index, rule in enumerate(rules):
              if 'Known-ID locator grammars are mode-separated' in rule:
                  rules[index] = 'Known-ID locator grammars are mode-separated, but terminal copy converges on copyPrompt: phone Go to P# snaps to the card then card tap copies; keyboard digits resolve every canonical catalog prompt and copy+instant-snap; mouse locates then card click/Copy. Go to P# must not auto-open detail.'
          payload['semantic_convergence_rules'] = rules
          contract_path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # ---- Carry branch-owned hotkey tests while retaining any non-overlapping tests added on current main. ----
          hotkey_test_path = Path('tests/test_prompt_kit_hotkey_completion.py')
          current = hotkey_test_path.read_text(encoding='utf-8')
          stale_method_names = (
              'test_hotkey_open_focuses_favorite_input_and_escape_recovers_from_editable',
              'test_favorite_prompt_shortcuts_are_persisted_fail_closed',
              'test_favorites_automatically_publish_shortcuts_and_detail_favorite_control',
              'test_configuration_ui_and_generated_parity_are_present',
              'test_shared_registry_shortcuts_publish_without_favorite_gate',
              'test_human_contract_and_design_close_previous_ux_decisions',
              'test_keyboard_digit_grammar_does_not_require_leading_p',
          )

          def method_spans(text: str):
              matches = list(re.finditer(r'^    def (test_[A-Za-z0-9_]+)\(', text, flags=re.M))
              result = {}
              trailer = text.index('\n\nif __name__')
              for i, match in enumerate(matches):
                  end = matches[i + 1].start() if i + 1 < len(matches) else trailer
                  result[match.group(1)] = (match.start(), end)
              return result

          for name in stale_method_names:
              spans = method_spans(current)
              if name in spans:
                  s, e = spans[name]
                  current = current[:s] + current[e:]

          # The branch-selected conflict version already contains the replacement tests. Add one explicit
          # current-main grammar regression so the fresh modality decision is not lost in convergence.
          if 'def test_catalog_numeric_grammar_is_global_and_keeps_p_alias' not in current:
              insertion = '''    def test_catalog_numeric_grammar_is_global_and_keeps_p_alias(self) -> None:\n        source = POLISH.read_text(encoding="utf-8")\n        readme = README.read_text(encoding="utf-8")\n        self.assertIn("function catalogPromptShortcutBindings()", source)\n        self.assertIn("bindings[digits]=promptId", source)\n        self.assertIn("bindings['p'+digits]=promptId", source)\n        self.assertIn("return catalogPromptShortcutBindings()", source)\n        self.assertIn("`126` → `P126`", readme)\n        self.assertNotIn("promptKit.promptShortcuts.v1", source)\n\n'''
              current = current.replace('\n\nif __name__', '\n' + insertion + '\nif __name__', 1)
          hotkey_test_path.write_text(current, encoding='utf-8')
          PY

          cat > tests/test_prompt_kit_hotkey_identity_runtime.py <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          POLISH = ROOT / "docs" / "prompt-kit-polish.js"
          DEPLOYED = ROOT / "web" / "prompt-kit" / "index.html"


          def function_block(text: str, name: str) -> str:
              start = text.index(f"function {name}(")
              brace = text.index("{", start)
              depth = 0
              quote = None
              escaped = False
              for index in range(brace, len(text)):
                  char = text[index]
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in ("'", '"', "`"):
                      quote = char
                  elif char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          return text[start : index + 1]
              raise AssertionError(f"unterminated JavaScript function: {name}")


          class PromptKitHotkeyIdentityRuntimeTests(unittest.TestCase):
              def test_catalog_dispatcher_distinguishes_prefix_zero_padding_and_compatibility_aliases(self) -> None:
                  source = POLISH.read_text(encoding="utf-8")
                  blocks = "\n\n".join(
                      function_block(source, name)
                      for name in (
                          "normalizePromptShortcutId",
                          "catalogPromptShortcutBindings",
                          "resetPromptShortcutBuffer",
                          "schedulePromptShortcutBufferReset",
                          "promptShortcutHasLongerPrefix",
                          "effectivePromptShortcutBindings",
                          "handleConfiguredPromptShortcutKey",
                      )
                  )
                  script = f"""
          var PROMPT_KIT_SHORTCUT_SEQUENCE_TIMEOUT_MS=25;
          var PROMPTS=[{{id:'P00'}},{{id:'P01'}},{{id:'P11'}},{{id:'P13'}},{{id:'P111'}},{{id:'P126'}}];
          var promptShortcutBuffer='';
          var promptShortcutBufferTimer=null;
          var activations=[];
          function activatePromptShortcutTarget(promptId){{activations.push(promptId);return true}}
          {blocks}
          function eventStub(){{return{{preventDefault:function(){{}},stopImmediatePropagation:function(){{}}}}}}
          function press(key){{return handleConfiguredPromptShortcutKey(eventStub(),key)}}
          function resetProbe(){{resetPromptShortcutBuffer();activations=[]}}
          function sleep(ms){{return new Promise(function(resolve){{setTimeout(resolve,ms)}})}}
          function assert(condition,message){{if(!condition)throw new Error(message)}}
          (async function(){{
            assert(normalizePromptShortcutId('p1.1')==='P11','p1.1 normalization');
            assert(normalizePromptShortcutId('p1.11')==='P111','p1.11 normalization');
            var bindings=catalogPromptShortcutBindings();
            assert(bindings['126']==='P126','bare catalog binding');
            assert(bindings['p126']==='P126','compatibility p alias');
            assert(bindings['00']==='P00','zero-padded catalog binding');

            ['1','1'].forEach(press);
            assert(activations.length===0,'11 fired before longer-prefix ambiguity closed');
            await sleep(40);
            assert(JSON.stringify(activations)==='["P11"]','11 timeout resolution');

            resetProbe();
            ['1','1','1'].forEach(press);
            assert(JSON.stringify(activations)==='["P111"]','111 longer exact resolution');

            resetProbe();
            ['1','2','6'].forEach(press);
            assert(JSON.stringify(activations)==='["P126"]','126 catalog resolution');

            resetProbe();
            ['p','1','2','6'].forEach(press);
            assert(JSON.stringify(activations)==='["P126"]','p126 compatibility resolution');

            resetProbe();
            ['0','0'].forEach(press);
            assert(JSON.stringify(activations)==='["P00"]','zero-padded P00 resolution');

            resetProbe();
            ['1','.','1'].forEach(press);
            assert(activations.length===0,'1.1 fired before longer-prefix ambiguity closed');
            await sleep(40);
            assert(JSON.stringify(activations)==='["P11"]','1.1 dotted timeout resolution');

            console.log(JSON.stringify({{status:'PASS',cases:['11','111','126','p126','00','1.1']}}));
          }})().catch(function(error){{console.error(error.stack||error);process.exit(1)}});
          """
                  completed = subprocess.run(
                      ["node", "-e", script], cwd=ROOT, check=True, capture_output=True, text=True
                  )
                  proof = json.loads(completed.stdout)
                  self.assertEqual(proof["status"], "PASS")
                  self.assertEqual(proof["cases"], ["11", "111", "126", "p126", "00", "1.1"])

              def test_generated_runtime_contains_catalog_identity_dispatcher(self) -> None:
                  source = POLISH.read_text(encoding="utf-8")
                  deployed = DEPLOYED.read_text(encoding="utf-8")
                  for name in (
                      "normalizePromptShortcutId",
                      "catalogPromptShortcutBindings",
                      "schedulePromptShortcutBufferReset",
                      "promptShortcutHasLongerPrefix",
                      "effectivePromptShortcutBindings",
                      "handleConfiguredPromptShortcutKey",
                  ):
                      self.assertEqual(function_block(source, name), function_block(deployed, name))
                  for marker in (
                      "replace(/\\./g,'')",
                      "bindings[digits]=promptId",
                      "bindings['p'+digits]=promptId",
                      "if(key==='.'&&promptShortcutBuffer)",
                      "if(exact&&!promptShortcutHasLongerPrefix(candidate,gestures))",
                      "return catalogPromptShortcutBindings()",
                  ):
                      self.assertIn(marker, deployed)

              def test_header_and_prompt_identity_domains_do_not_overlap(self) -> None:
                  source = POLISH.read_text(encoding="utf-8")
                  base = (ROOT / "docs" / "prompt-kit.js").read_text(encoding="utf-8")
                  for digit in "12345":
                      self.assertNotIn(f"if(key==='{digit}')", source)
                      self.assertNotIn(f"case'{digit}'", base)
                  for key in "ABCDE":
                      self.assertIn(f"{{key:'{key}'", source)


          if __name__ == "__main__":
              unittest.main()
          PY

          python - <<'PY'
          # Heredoc indentation above is YAML indentation only; normalize accidental leading spaces if present.
          from pathlib import Path
          path = Path('tests/test_prompt_kit_hotkey_identity_runtime.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          nonblank = [line for line in lines if line.strip()]
          common = min((len(line) - len(line.lstrip(' ')) for line in nonblank), default=0)
          if common:
              lines = [line[common:] if line.strip() else '' for line in lines]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Regenerate canonical site and run combined fresh-floor validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          node --check docs/prompt-kit-polish.js
          node --check docs/prompt-kit-hotkey-prototype.js
          python -m unittest \
            tests.test_prompt_kit_hotkey_completion \
            tests.test_prompt_kit_hotkey_identity_runtime \
            tests.test_prompt_kit_interactions_contract \
            tests.test_prompt_kit_discovery \
            tests.test_prompt_kit_cross_input_modality \
            tests.test_prompt_kit_mobile_quick_controls \
            tests.test_observed_behavior_proof_harness -v
          python scripts/validate_prompt_kit_interactions.py --summary
          git diff --check
          git status --short
          git diff --stat

      - name: Commit durable convergence and remove temporary carriers
        shell: bash
        run: |
          set -euo pipefail
