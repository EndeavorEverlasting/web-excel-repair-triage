name: Temporary hotkey review repair

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/prompt-kit-hotkey-favorite-focus-escape-20260825'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-kit-hotkey-favorite-focus-escape-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded review repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --all --prune --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo 'branch lost current-main ancestry before review repair' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path

          browser_path=Path('tests/prompt_kit_favorite_browser_proof.py')
          browser=browser_path.read_text(encoding='utf-8')
          helper='''\n\ndef execution_environment_kind(env=None) -> str:\n    runtime_env = os.environ if env is None else env\n    return "github_actions_headless_browser" if str(runtime_env.get("GITHUB_ACTIONS", "")).lower() == "true" else "local_headless_browser"\n'''
          if 'def execution_environment_kind(env=None)' not in browser:
              anchor='\n\ndef main(argv=None) -> int:\n'
              if anchor not in browser: raise SystemExit('browser topology insertion anchor drifted')
              browser=browser.replace(anchor, helper+anchor, 1)
          old='"environment": {"kind": "github_actions_headless_browser", "engine": "chromium", "scenario": "hotkey-config-focus-escape-and-favorite-shortcut-copy-reveal"},'
          new='"environment": {"kind": execution_environment_kind(), "engine": "chromium", "scenario": "hotkey-config-focus-escape-and-favorite-shortcut-copy-reveal"},'
          if old in browser:
              browser=browser.replace(old,new,1)
          elif new not in browser:
              raise SystemExit('browser topology metadata anchor drifted')
          browser_path.write_text(browser, encoding='utf-8')

          test_path=Path('tests/test_prompt_kit_hotkey_completion.py')
          tests=test_path.read_text(encoding='utf-8')
          old_block='''        source_block = source[source.index(start_marker) : source.index(end_marker)]\n        deployed_block = deployed[deployed.index(start_marker) : deployed.index(end_marker)]\n        self.assertEqual(source_block, deployed_block)\n'''
          new_block=old_block+'''\n        def function_block(text: str, name: str) -> str:\n            start = text.index(f"function {name}(")\n            brace = text.index("{", start)\n            depth = 0\n            for index in range(brace, len(text)):\n                if text[index] == "{":\n                    depth += 1\n                elif text[index] == "}":\n                    depth -= 1\n                    if depth == 0:\n                        return text[start : index + 1]\n            self.fail(f"unterminated JavaScript function: {name}")\n\n        for function_name in ("focusFavoritePromptShortcutInput", "setHotkeyHelpOpen"):\n            self.assertEqual(function_block(source, function_name), function_block(deployed, function_name))\n\n        escape_start = "var escapeHelpPanel=document.getElementById('hotkeyHelpPanel');"\n        escape_end = "if(editable)return;"\n        source_escape = source[source.index(escape_start) : source.index(escape_end) + len(escape_end)]\n        deployed_escape = deployed[deployed.index(escape_start) : deployed.index(escape_end) + len(escape_end)]\n        self.assertEqual(source_escape, deployed_escape)\n'''
          if 'unterminated JavaScript function' not in tests:
              if old_block not in tests: raise SystemExit('runtime-block parity insertion anchor drifted')
              tests=tests.replace(old_block,new_block,1)

          if 'def test_browser_proof_reports_actual_execution_topology' not in tests:
              anchor='    def test_configuration_ui_and_generated_parity_are_present(self) -> None:\n'
              method='''    def test_browser_proof_reports_actual_execution_topology(self) -> None:\n        proof = (ROOT / "tests" / "prompt_kit_favorite_browser_proof.py").read_text(encoding="utf-8")\n        for marker in (\n            "def execution_environment_kind(env=None)",\n            "GITHUB_ACTIONS",\n            "github_actions_headless_browser",\n            "local_headless_browser",\n            '"kind": execution_environment_kind()',\n        ):\n            self.assertIn(marker, proof)\n\n'''
              if anchor not in tests: raise SystemExit('browser topology test insertion anchor drifted')
              tests=tests.replace(anchor,method+anchor,1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate review repair
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/prompt_kit_favorite_browser_proof.py tests/test_prompt_kit_hotkey_completion.py
          python -m unittest tests.test_prompt_kit_hotkey_completion -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Self-clean and push review-clean head
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tmp-hotkey-review-repair-20260825.yml
          git add tests/prompt_kit_favorite_browser_proof.py tests/test_prompt_kit_hotkey_completion.py
          git diff --cached --check
          git commit -m 'test(prompt-kit): bind hotkey proof topology and runtime blocks'
          git fetch origin main --prune
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo 'main moved after review repair proof; refusing stale push' >&2
            exit 1
          fi
          git push origin HEAD:fix/prompt-kit-hotkey-favorite-focus-escape-20260825
          echo "REVIEW_CLEAN_HEAD=$(git rev-parse HEAD)"
