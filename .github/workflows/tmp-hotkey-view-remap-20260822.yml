name: Temporary Prompt Kit Numeric View Remap

on:
  push:
    branches:
      - feat/prompt-kit-favorite-gameplay-20260822

permissions:
  contents: write

concurrency:
  group: prompt-kit-numeric-view-remap-20260822
  cancel-in-progress: true

jobs:
  remap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-favorite-gameplay-20260822
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconcile current main and implement numeric view mapping
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main

          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one anchor, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          def replace_between(path, start_marker, end_marker, replacement):
              text = read(path)
              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(f'{path}: missing start marker {start_marker!r}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise RuntimeError(f'{path}: missing end marker {end_marker!r}')
              end += len(end_marker)
              write(path, text[:start] + replacement + text[end:])

          # Core filter state: profile views are first-class filter state, not DOM-only hiding.
          replace_once(
              'docs/prompt-kit.js',
              "var activeCat='all',activeSection=null,activeType=null,activeColor=null;",
              "var activeCat='all',activeSection=null,activeType=null,activeColor=null,activeProfile=null;",
          )
          replace_once(
              'docs/prompt-kit.js',
              "function resetPromptKitView(){activeCat='all';activeSection=null;activeType=null;activeColor=null;collapsedSections={};",
              "function resetPromptKitView(){activeCat='all';activeSection=null;activeType=null;activeColor=null;activeProfile=null;collapsedSections={};",
          )
          replace_once(
              'docs/prompt-kit.js',
              "  if(activeCat!=='all'&&activeCat!=='doctrine')f=f.filter(function(p){return p.category===activeCat});\n",
              "  if(activeCat!=='all'&&activeCat!=='doctrine')f=f.filter(function(p){return p.category===activeCat});\n  if(activeProfile)f=f.filter(function(p){return String(p.profile||'').toLowerCase()===activeProfile});\n",
          )
          replace_once(
              'docs/prompt-kit.js',
              "var ct=e.target.closest('.cat-tab');if(ct){activeCat=ct.dataset.cat;",
              "var ct=e.target.closest('.cat-tab[data-cat]');if(ct){activeProfile=null;activeCat=ct.dataset.cat;",
          )
          replace_once(
              'docs/prompt-kit.js',
              "switch(e.key){case'1':activeCat='all';break;case'2':activeCat='standard';break;case'3':activeCat='gnhf';break;case'4':activeCat='doctrine';break;",
              "switch(e.key){case'1':activeProfile=null;activeCat='all';break;case'2':activeProfile=null;activeCat='standard';break;",
          )
          replace_once(
              'docs/prompt-kit.js',
              "if(activeSection){activeSection=null;render();return}if(activeCat!=='all')",
              "if(activeSection){activeSection=null;render();return}if(activeProfile){activeProfile=null;render();return}if(activeCat!=='all')",
          )

          # Canonical static header: first five controls now match the operator's one-hand numeric map.
          builder = read('build_prompt_kit.py')
          start_marker = "    html.append('      <div class=\"cat-tabs\">')"
          end_marker = "    html.append('      </div>')"
          start = builder.find(start_marker)
          if start < 0:
              raise RuntimeError('build_prompt_kit.py: cat-tabs start not found')
          end = builder.find(end_marker, start)
          if end < 0:
              raise RuntimeError('build_prompt_kit.py: cat-tabs end not found')
          end += len(end_marker)
          header = '''    html.append('      <div class="cat-tabs">')
    html.append('        <button class="cat-tab active" data-cat="all"><span class="tab-icon">📋</span>All<span class="kbd">1</span></button>')
    html.append('        <button class="cat-tab" data-cat="standard"><span class="tab-icon">📄</span>Standard<span class="kbd">2</span></button>')
    html.append('        <button class="cat-tab" id="favoritesShortcut" data-view="favorites"><span class="tab-icon">★</span>Favorites<span class="kbd">3</span></button>')
    html.append('        <button class="cat-tab" id="triageShortcut" data-view="triage"><span class="tab-icon">▣</span>Triage<span class="kbd">4</span></button>')
    html.append('        <button class="cat-tab" id="funShortcut" data-view="fun"><span class="tab-icon">◆</span>Fun<span class="kbd">5</span></button>')
    html.append('        <button class="cat-tab" data-cat="gnhf"><span class="tab-icon">★</span>GNHF</button>')
    html.append('        <button class="cat-tab" data-cat="doctrine"><span class="tab-icon">📜</span>Doctrine</button>')
    html.append('      </div>')'''
          write('build_prompt_kit.py', builder[:start] + header + builder[end:])

          # Production runtime: all numeric view commands share semantic filter state.
          replace_once(
              'docs/prompt-kit-polish.js',
              "function activateFavoritesView(){\n  activeCat='all';\n  activeSection='__favorites__';",
              "function activateFavoritesView(){\n  activeCat='all';\n  activeSection='__favorites__';\n  activeProfile=null;",
          )
          start = "function activateAllPromptsView(){"
          end = "function installCompactBrowsingViewSwitches(){"
          replacement = r'''function activateAllPromptsView(){
  resetPromptKitView();
}

function activateStandardPromptsView(){
  activeCat='standard';
  activeSection=null;
  activeProfile=null;
  clearTransientPromptFilters();
  document.querySelectorAll('.cat-tab').forEach(function(button){button.classList.toggle('active',button.dataset.cat==='standard')});
  document.querySelectorAll('.section-tab').forEach(function(button){button.classList.toggle('active',button.dataset.section==='__all__')});
  render();
}

function activateFavoritesView(){
  activeCat='all';
  activeSection='__favorites__';
  activeProfile=null;
  clearTransientPromptFilters();
  document.querySelectorAll('.cat-tab').forEach(function(button){button.classList.toggle('active',button.id==='favoritesShortcut')});
  document.querySelectorAll('.section-tab').forEach(function(button){button.classList.toggle('active',button.dataset.section==='__favorites__')});
  render();
}

function activateProfilePromptsView(profile,view){
  activeCat='all';
  activeSection=null;
  activeProfile=profile;
  clearTransientPromptFilters();
  document.querySelectorAll('.cat-tab').forEach(function(button){button.classList.toggle('active',button.dataset.view===view)});
  document.querySelectorAll('.section-tab').forEach(function(button){button.classList.toggle('active',button.dataset.section==='__all__')});
  render();
}

function bindPromptViewButton(button,handler){
  if(!button||button.dataset.promptViewBound==='true')return;
  button.dataset.promptViewBound='true';
  button.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();handler()});
}

function ensureCompactBrowsingControls(){
  var header=document.querySelector('.header');
  var headerTop=document.querySelector('.header-top');
  var search=document.querySelector('.search-container');
  var catTabs=document.querySelector('.cat-tabs');
  if(!header||!headerTop||!catTabs)return;

  bindPromptViewButton(document.getElementById('favoritesShortcut'),activateFavoritesView);
  bindPromptViewButton(document.getElementById('triageShortcut'),function(){activateProfilePromptsView('triage-management','triage')});
  bindPromptViewButton(document.getElementById('funShortcut'),function(){activateProfilePromptsView('fun-management','fun')});

  if(!document.getElementById('filterPanelToggle')){
    var toggle=document.createElement('button');
    toggle.className='filter-panel-toggle';
    toggle.id='filterPanelToggle';
    toggle.type='button';
    toggle.setAttribute('aria-expanded','true');
    toggle.setAttribute('aria-controls','search sectionsNav typeNav');
    toggle.setAttribute('aria-keyshortcuts','F');
    toggle.setAttribute('title','Hide filters to maximize prompt browsing space (F)');
    toggle.textContent='Hide filters ↑';
    toggle.addEventListener('click',function(){toggleCompactFilters()});
    if(search)headerTop.insertBefore(toggle,search);else headerTop.appendChild(toggle)
  }
}

function installCompactBrowsingViewSwitches(){'''
          replace_between('docs/prompt-kit-polish.js', start, end, replacement)
          replace_once('docs/prompt-kit-polish.js', "  {key:'3',label:'GNHF prompts'},\n  {key:'4',label:'Favorites'},\n  {key:'5',label:'Doctrine'},", "  {key:'3',label:'Favorites'},\n  {key:'4',label:'Triage prompts'},\n  {key:'5',label:'Fun prompts'},")
          replace_once(
              'docs/prompt-kit-polish.js',
              "    if(key==='1'){e.preventDefault();e.stopImmediatePropagation();activateAllPromptsView();return}\n    if(key==='4'){e.preventDefault();e.stopImmediatePropagation();activateFavoritesView();return}\n    if(key==='5'){\n      var doctrine=document.querySelector('.cat-tab[data-cat=\"doctrine\"]');\n      if(doctrine){e.preventDefault();e.stopImmediatePropagation();doctrine.click()}\n      return\n    }",
              "    if(key==='1'){e.preventDefault();e.stopImmediatePropagation();activateAllPromptsView();return}\n    if(key==='2'){e.preventDefault();e.stopImmediatePropagation();activateStandardPromptsView();return}\n    if(key==='3'){e.preventDefault();e.stopImmediatePropagation();activateFavoritesView();return}\n    if(key==='4'){e.preventDefault();e.stopImmediatePropagation();activateProfilePromptsView('triage-management','triage');return}\n    if(key==='5'){e.preventDefault();e.stopImmediatePropagation();activateProfilePromptsView('fun-management','fun');return}",
          )

          # Executable seam prototype mirrors all five core numeric commands.
          replace_once('docs/prompt-kit-hotkey-prototype.js', "constructor(reserved = ['`', 'f', '[', ']', '1', '4', '5'])", "constructor(reserved = ['`', 'f', '[', ']', '1', '2', '3', '4', '5'])")
          replace_once(
              'docs/prompt-kit-hotkey-prototype.js',
              "      ['1', {gesture: '1', command: 'VIEW_ALL'}],\n      ['4', {gesture: '4', command: 'VIEW_FAVORITES'}],\n      ['5', {gesture: '5', command: 'VIEW_DOCTRINE'}],",
              "      ['1', {gesture: '1', command: 'VIEW_ALL'}],\n      ['2', {gesture: '2', command: 'VIEW_STANDARD'}],\n      ['3', {gesture: '3', command: 'VIEW_FAVORITES'}],\n      ['4', {gesture: '4', command: 'VIEW_TRIAGE'}],\n      ['5', {gesture: '5', command: 'VIEW_FUN'}],",
          )
          replace_once(
              'docs/prompt-kit-hotkey-prototype.js',
              "    else if (binding.command === 'VIEW_ALL') result = this.viewNavigator.open('all');\n    else if (binding.command === 'VIEW_FAVORITES') result = this.viewNavigator.open('favorites');\n    else if (binding.command === 'VIEW_DOCTRINE') result = this.viewNavigator.open('doctrine');",
              "    else if (binding.command === 'VIEW_ALL') result = this.viewNavigator.open('all');\n    else if (binding.command === 'VIEW_STANDARD') result = this.viewNavigator.open('standard');\n    else if (binding.command === 'VIEW_FAVORITES') result = this.viewNavigator.open('favorites');\n    else if (binding.command === 'VIEW_TRIAGE') result = this.viewNavigator.open('triage');\n    else if (binding.command === 'VIEW_FUN') result = this.viewNavigator.open('fun');",
          )
          replace_once(
              'docs/prompt-kit-hotkey-prototype.js',
              "  program.dispatcher.handleKey({key: '5'});\n  assert(program.viewNavigator.views[0] === 'doctrine', 'built-in 5 remains active with no sequence buffer');",
              "  [['1','all'],['2','standard'],['3','favorites'],['4','triage'],['5','fun']].forEach(function(pair){\n    program.dispatcher.handleKey({key: pair[0]});\n    assert(program.viewNavigator.views[program.viewNavigator.views.length-1] === pair[1], 'built-in '+pair[0]+' opens '+pair[1]);\n  });",
          )
          replace_once(
              'docs/prompt-kit-hotkey-prototype.js',
              "success_paths: ['HOTKEY_HELP_TOGGLE', 'FILTER_HIDE', 'FILTER_SHOW', 'FILTER_TOGGLE', 'COPY_PROMPT(P95)', 'COPY_PROMPT(P14)', 'VIEW_DOCTRINE'],",
              "success_paths: ['HOTKEY_HELP_TOGGLE', 'FILTER_HIDE', 'FILTER_SHOW', 'FILTER_TOGGLE', 'COPY_PROMPT(P95)', 'COPY_PROMPT(P14)', 'VIEW_ALL', 'VIEW_STANDARD', 'VIEW_FAVORITES', 'VIEW_TRIAGE', 'VIEW_FUN'],",
          )

          # Focused runtime test follows the effective map rather than the obsolete GNHF/Doctrine digits.
          replace_once(
              'tests/test_prompt_kit_hotkey_completion.py',
              "        for built_in in (\"if(key==='1')\", \"if(key==='4')\", \"if(key==='5')\"):",
              "        for built_in in (\"if(key==='1')\", \"if(key==='2')\", \"if(key==='3')\", \"if(key==='4')\", \"if(key==='5')\"):",
          )
          replace_once(
              'tests/test_prompt_kit_hotkey_completion.py',
              "            \"VIEW_DOCTRINE\",\n",
              "            \"VIEW_ALL\",\n            \"VIEW_STANDARD\",\n            \"VIEW_FAVORITES\",\n            \"VIEW_TRIAGE\",\n            \"VIEW_FUN\",\n",
          )
          hotkey_tests = read('tests/test_prompt_kit_hotkey_completion.py')
          insert_marker = "    def test_executable_prototype_proves_success_failure_and_digit_collision_paths(self) -> None:\n"
          if 'def test_numeric_views_filter_by_semantic_owner' not in hotkey_tests:
              idx = hotkey_tests.find(insert_marker)
              if idx < 0:
                  raise RuntimeError('hotkey completion insertion marker missing')
              new_test = '''    def test_numeric_views_filter_by_semantic_owner(self) -> None:\n        source = POLISH.read_text(encoding="utf-8")\n        core = (ROOT / "docs" / "prompt-kit.js").read_text(encoding="utf-8")\n        for marker in (\n            "{key:'3',label:'Favorites'}",\n            "{key:'4',label:'Triage prompts'}",\n            "{key:'5',label:'Fun prompts'}",\n            "activateProfilePromptsView('triage-management','triage')",\n            "activateProfilePromptsView('fun-management','fun')",\n        ):\n            self.assertIn(marker, source)\n        self.assertIn("if(activeProfile)f=f.filter", core)\n        self.assertIn("String(p.profile||'').toLowerCase()===activeProfile", core)\n        self.assertNotIn("case'3':activeCat='gnhf'", core)\n        self.assertNotIn("case'4':activeCat='doctrine'", core)\n\n'''
              hotkey_tests = hotkey_tests[:idx] + new_test + hotkey_tests[idx:]
              write('tests/test_prompt_kit_hotkey_completion.py', hotkey_tests)

          # Header contract: first five are the numeric cluster; GNHF/Doctrine remain available without stealing digits.
          header_test = read('tests/test_prompt_kit_header_contract.py')
          start = header_test.index('EXPECTED = [')
          end = header_test.index(']\nBUTTON_RE', start) + 2
          header_test = header_test[:start] + '''EXPECTED = [\n    ("data-cat", "all", "All", "1"),\n    ("data-cat", "standard", "Standard", "2"),\n    ("data-view", "favorites", "Favorites", "3"),\n    ("data-view", "triage", "Triage", "4"),\n    ("data-view", "fun", "Fun", "5"),\n    ("data-cat", "gnhf", "GNHF", None),\n    ("data-cat", "doctrine", "Doctrine", None),\n]\n''' + header_test[end:]
          old_regex = '''BUTTON_RE = re.compile(\n    r'<button class="cat-tab(?P<active> active)?" data-cat="(?P<cat>[^\"]+)">(?P<body>.*?)</button>'\n)'''
          new_regex = '''BUTTON_RE = re.compile(\n    r'<button class="cat-tab(?P<active> active)?"[^>]*?(?P<attr>data-(?:cat|view))="(?P<value>[^\"]+)"[^>]*>(?P<body>.*?)</button>'\n)'''
          if old_regex not in header_test:
              raise RuntimeError('header BUTTON_RE anchor missing')
          header_test = header_test.replace(old_regex, new_regex, 1)
          old_parse = '''        key_match = KBD_RE.search(body)\n        assert key_match, f"{match.group('cat')} button is missing a hotkey label"\n        label_source = re.sub(r'<span class="tab-icon">.*?</span>', "", body)\n        label_source = KBD_RE.sub("", label_source)\n        label = html.unescape(TAG_RE.sub("", label_source)).strip()\n        parsed.append((match.group("cat"), label, key_match.group("key"), bool(match.group("active"))))'''
          new_parse = '''        key_match = KBD_RE.search(body)\n        label_source = re.sub(r'<span class="tab-icon">.*?</span>', "", body)\n        label_source = KBD_RE.sub("", label_source)\n        label = html.unescape(TAG_RE.sub("", label_source)).strip()\n        parsed.append((match.group("attr"), match.group("value"), label, key_match.group("key") if key_match else None, bool(match.group("active"))))'''
          if old_parse not in header_test:
              raise RuntimeError('header parse anchor missing')
          header_test = header_test.replace(old_parse, new_parse, 1)

          def replace_test_function(text, name, next_name, body):
              a = text.index(f'def {name}() -> None:')
              b = text.index(f'def {next_name}() -> None:', a)
              return text[:a] + body.rstrip() + '\n\n\n' + text[b:]

          header_test = replace_test_function(header_test, 'test_exact_operator_artifact_header_order', 'test_gnhf_is_a_filter_not_a_stats_substitute', '''def test_exact_operator_artifact_header_order() -> None:\n    buttons = parse_header_buttons(read_deployed())\n    assert [(attr, value, label, key) for attr, value, label, key, _ in buttons[:7]] == EXPECTED\n    assert buttons[0][4] is True, "All must remain the default active filter"\n    assert all(not active for *_, active in buttons[1:7])''')
          header_test = replace_test_function(header_test, 'test_gnhf_is_a_filter_not_a_stats_substitute', 'test_keyboard_routes_match_visible_contract', '''def test_gnhf_is_a_filter_not_a_stats_substitute() -> None:\n    text = read_deployed()\n    buttons = parse_header_buttons(text)\n    assert any(attr == "data-cat" and value == "gnhf" and label == "GNHF" and key is None for attr, value, label, key, _ in buttons)\n    assert any(attr == "data-cat" and value == "doctrine" and label == "Doctrine" and key is None for attr, value, label, key, _ in buttons)\n    stats = text.split('<div class="stats">', 1)[1].split("</div>\\n    </div>", 1)[0]\n    assert "> GNHF<" not in stats''')
          header_test = replace_test_function(header_test, 'test_keyboard_routes_match_visible_contract', 'test_builder_owns_the_same_fixed_header', '''def test_keyboard_routes_match_visible_contract() -> None:\n    js = JS.read_text(encoding="utf-8")\n    polish = POLISH.read_text(encoding="utf-8")\n    assert "case'1':activeProfile=null;activeCat='all';break;" in js\n    assert "case'2':activeProfile=null;activeCat='standard';break;" in js\n    assert "case'3':activeCat='gnhf';break;" not in js\n    assert "case'4':activeCat='doctrine';break;" not in js\n    for marker in (\n        "if(key==='1')",\n        "if(key==='2')",\n        "if(key==='3'){e.preventDefault();e.stopImmediatePropagation();activateFavoritesView();return}",\n        "if(key==='4'){e.preventDefault();e.stopImmediatePropagation();activateProfilePromptsView('triage-management','triage');return}",\n        "if(key==='5'){e.preventDefault();e.stopImmediatePropagation();activateProfilePromptsView('fun-management','fun');return}",\n    ):\n        assert marker in polish''')
          header_test = replace_test_function(header_test, 'test_builder_owns_the_same_fixed_header', 'test_responsive_header_reflows_before_collision', '''def test_builder_owns_the_same_fixed_header() -> None:\n    source = BUILDER.read_text(encoding="utf-8")\n    header_source = source.split("html.append('      <div class=\\\"cat-tabs\\\">')", 1)[1].split("html.append('      </div>')", 1)[0]\n    positions = []\n    for attr, value, label, key in EXPECTED:\n        marker = f'{attr}="{value}"'\n        position = header_source.find(marker)\n        assert position >= 0, f"builder missing {label} view"\n        positions.append(position)\n        if key is None:\n            segment = header_source[position:header_source.find("</button>", position)]\n            assert '<span class="kbd">' not in segment, f"{label} must not claim a numeric hotkey"\n        else:\n            assert f'>{label}<span class="kbd">{key}</span>' in header_source\n    assert positions == sorted(positions), "builder may not reorder the numeric view cluster"\n\n\ndef test_triage_fun_views_use_stable_prompt_profiles() -> None:\n    js = JS.read_text(encoding="utf-8")\n    polish = POLISH.read_text(encoding="utf-8")\n    assert "if(activeProfile)f=f.filter(function(p){return String(p.profile||'').toLowerCase()===activeProfile});" in js\n    assert "activateProfilePromptsView('triage-management','triage')" in polish\n    assert "activateProfilePromptsView('fun-management','fun')" in polish''')
          # Add new test to explicit main() list.
          header_test = header_test.replace('        test_builder_owns_the_same_fixed_header,\n        test_responsive_header_reflows_before_collision,', '        test_builder_owns_the_same_fixed_header,\n        test_triage_fun_views_use_stable_prompt_profiles,\n        test_responsive_header_reflows_before_collision,', 1)
          # Update effective runtime marker expectations.
          header_test = header_test.replace('''        "{key:'4',label:'Favorites'}",\n        "{key:'5',label:'Doctrine'}",''', '''        "{key:'3',label:'Favorites'}",\n        "{key:'4',label:'Triage prompts'}",\n        "{key:'5',label:'Fun prompts'}",''', 1)
          # Replace README contract test body.
          header_test = replace_test_function(header_test, 'test_readme_records_exact_deployed_surface', 'test_effective_p07_requires_mainline_convergence', '''def test_readme_records_exact_deployed_surface() -> None:\n    text = README.read_text(encoding="utf-8")\n    assert "### Header navigation contract" in text\n    assert "1. All (`1`)\\n2. Standard (`2`)\\n3. Favorites (`3`)\\n4. Triage (`4`)\\n5. Fun (`5`)" in text\n    assert "GNHF and Doctrine remain available as non-numeric library views" in text\n    assert "`web/prompt-kit/index.html`" in text\n    assert "| `` ` `` | Show / hide Hotkeys |" in text\n    for key, label in (\n        ("1", "All prompts"),\n        ("2", "Standard prompts"),\n        ("3", "Favorites"),\n        ("4", "Triage prompts"),\n        ("5", "Fun prompts"),\n        ("F", "Show / hide filters"),\n        ("T", "Scroll to top"),\n        ("B", "Scroll to bottom"),\n    ):\n        assert f"| `{key}` | {label} |" in text''')
          write('tests/test_prompt_kit_header_contract.py', header_test)

          # Human contracts: describe numeric map and exact semantic profile boundaries.
          replace_once('web/README.md', '1. **Library view:** All / Standard / GNHF / Doctrine.', '1. **Library view:** All / Standard / Favorites / Triage / Fun, with GNHF and Doctrine retained as non-numeric library views.')
          replace_once('web/README.md', "| `3` | GNHF prompts |\n| `4` | Favorites |\n| `5` | Doctrine |", "| `3` | Favorites |\n| `4` | Triage prompts |\n| `5` | Fun prompts |")
          replace_once('web/README.md', "built-in `1`, `4`, or `5` navigation", "built-in `1`–`5` navigation")
          old_header_contract = '''1. All\n2. Standard\n3. GNHF\n\nTheir keyboard shortcuts are `1`, `2`, and `3` respectively. The generated base header still carries Doctrine's legacy `4` label before supplemental runtime enhancement. The supplemental polish runtime assigns `4` to Favorites and remaps Doctrine to `5`; the visible Hotkeys module and effective dispatcher must remain aligned without displacing GNHF.'''
