name: Temporary isolated-writer convergence carrier

on:
  push:
    branches:
      - feat/prompt-kit-isolated-writer-convergence-20260915

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact base ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git merge-base --is-ancestor b36fbf9b09e0ad0f4c802f219a939694c6049769 HEAD
      - name: Materialize shared isolation and convergence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path.cwd()
          policy_path = root / "registry/prompts/actionable-next-step-policy.v1.json"
          policy = json.loads(policy_path.read_text(encoding="utf-8"))

          marker = "ISOLATED WRITER / CONVERGENCE CONTRACT"
          contract = """ISOLATED WRITER / CONVERGENCE CONTRACT
          - Apply this contract whenever work mutates version-controlled repository state or dispatches concurrent mutating writers; read-only work does not require a writer lane.
          - Before writing, refresh the default branch/provider floor and inspect current/open/recent pull requests, branches, worktrees, commits, and expected changed files for ownership collision. Reuse the canonical owner when safe. Otherwise give each independent writer one isolated lane pinned to the refreshed base: prefer a Git worktree + dedicated branch; when worktrees are unavailable, use an environment-provided isolated clone/workspace pinned to the same base. Never reuse or modify another writer's branch/worktree/workspace.
          - Isolation is not merely a branch name. Keep each writer's filesystem and dependency environment separate when the toolchain requires it. Git worktrees do not automatically isolate shared ports, databases, caches, lockfiles, environment files, credentials, services, or generated shared outputs; allocate separate resources or serialize those collisions.
          - Each writer commits only its owned scope. The first finisher may advance its own integration gate, but must not reset, clean, delete, repurpose, overwrite, or merge-away unfinished sibling work. Preserve every sibling lane and its unique commits, untracked artifacts, evidence, and handoff state.
          - CONVERGE LOCALLY BEFORE REMOTE DEFAULT when local Git is available: use a dedicated convergence worktree/branch based on the refreshed default, integrate completed lanes in dependency order, resolve collisions explicitly, keep unfinished lanes untouched, and rerun the combined owning validators/build/tests on the integrated candidate. Update the local default only when repository policy permits and the candidate is proven; then push/open/merge through the normal remote gates. Do not mutate a shared default checkout while independent writers are active unless governing repository policy explicitly requires a singular default-branch writer.
          - In a provider-only or remote execution environment where local Git/worktrees are unavailable, an isolated remote branch/PR is the fallback. State that local convergence is unavailable, validate the exact remote candidate, and never promote provider proof into local-main/workstation proof.
          - Cleanup is last. Remove a worktree/workspace or delete a task branch only after its integration/closure state is known and a preservation check proves no unique unmerged commits, untracked artifacts, evidence, or operator-owned work would be lost. Prune stale worktree metadata only after that check."""
          contract = "\n".join(line.strip() for line in contract.splitlines()).strip()

          writer_isolation = {
              "marker": marker,
              "applies_when": "version-controlled repository mutation or concurrent mutating writers",
              "preferred_lane": "one Git worktree plus one dedicated branch per independent writer, pinned to the refreshed default-branch floor",
              "fallback_lane": "environment-provided isolated clone/workspace or isolated remote branch/PR when local worktrees are unavailable",
              "collision_floor": [
                  "open/current/recent pull requests and branches",
                  "active worktrees or environment-assigned isolated workspaces",
                  "expected changed-file overlap",
                  "shared runtime resources such as ports, databases, caches, lockfiles, services, and generated outputs",
              ],
              "preservation_rule": "A completed writer must never destroy, reset, clean, repurpose, overwrite, or merge-away unfinished sibling work.",
              "local_convergence_rule": "When local Git is available, integrate completed lanes in dependency order into a dedicated convergence worktree/branch based on refreshed default, rerun combined proof, and only then advance the local/remote default-branch gate under repository policy.",
              "remote_only_rule": "When local Git/worktrees are unavailable, isolate on a remote branch/PR and report local convergence as unavailable rather than claiming local-main proof.",
              "cleanup_rule": "Cleanup only after integration/closure is known and preservation proof shows no unique commits, untracked artifacts, evidence, or operator-owned work remain solely in the lane.",
          }

          existing_marker = policy.get("isolation_marker")
          if existing_marker not in (None, marker):
              raise SystemExit(f"conflicting isolation marker: {existing_marker!r}")
          policy["isolation_marker"] = marker
          policy["writer_isolation"] = writer_isolation

          appendix = policy["copy_content_appendix"]
          if marker not in appendix:
              policy["copy_content_appendix"] = appendix.rstrip() + "\n\n" + contract + "\n"
          elif contract not in appendix:
              raise SystemExit("isolation marker already exists with different contract text")

          suffix_clause = (
              " For repository-mutating work with concurrent or separately owned writers, apply the "
              "ISOLATED WRITER / CONVERGENCE CONTRACT: isolate each writer, preserve siblings, prove the combined "
              "local convergence candidate when local Git is available, and clean up only after preservation proof."
          )
          if "ISOLATED WRITER / CONVERGENCE CONTRACT" not in policy["next_step_suffix"]:
              policy["next_step_suffix"] = policy["next_step_suffix"].rstrip() + suffix_clause

          policy_path.write_text(json.dumps(policy, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          doc = """# Prompt Kit Isolated Writer + Convergence Contract

          ## Decision

          Prompt Kit uses a shared conditional contract rather than a new prompt identity. The invariant applies to every effective prompt, but activates only when a task mutates version-controlled repository state or dispatches concurrent mutating writers.

          ## External precedent

          This design was informed by Michael Shimeles' public `michaelshimeles/skills` repository, especially `new-feature/SKILL.md` and the repository `AGENTS.md`. The useful mechanics are: scope-check open pull requests before writing, start each feature from a fresh default-branch floor, give each task its own Git worktree and branch, install task dependencies inside that isolated directory, and keep the lane until its pull request is resolved.

          Sources:
          - https://github.com/michaelshimeles/skills/blob/main/new-feature/SKILL.md
          - https://github.com/michaelshimeles/skills/blob/main/AGENTS.md

          No external source code is copied. The repository adapts the workflow mechanics to its existing governance and mainline-convergence contracts.

          ## Prompt Kit adaptation

          Prompt Kit strengthens the precedent in two directions.

          First, isolation covers more than Git refs. A writer lane is a separate filesystem/worktree or environment-provided isolated workspace, with a dedicated branch and fresh dependency state when required. Ports, databases, services, caches, lockfiles, environment files, credentials, and generated shared outputs remain shared resources unless explicitly separated, so those collisions must be allocated or serialized.

          Second, finishing a lane is not permission to destroy siblings. A completed writer commits only owned scope. Unfinished worktrees/workspaces remain intact. Completed lanes converge in dependency order into a dedicated local convergence worktree/branch based on refreshed default; combined validators/build/tests run against that integrated candidate. Only after that proof may the normal local-default and remote-default integration gates advance under repository policy.

          ## Environment modes

          ### Local Git available

          Prefer one worktree plus one branch per independent writer. Use a separate convergence worktree/branch for completed lanes. Do not use the shared default checkout as a scratch integration surface while sibling writers are active.

          ### Local worktree unavailable but isolated workspace/clone available

          Use the environment-provided isolated workspace pinned to the same refreshed base. Preserve the same ownership, collision, convergence, and cleanup semantics.

          ### Provider-only / remote execution

          Use one isolated remote branch/PR per writer. Exact-head CI/provider validation may prove the remote candidate, but local convergence remains explicitly unavailable/unproven. Do not relabel remote proof as local-main or workstation proof.

          ## Cleanup gate

          Cleanup happens after integration, never because another lane finished first. Before removing a worktree/workspace or task branch, prove that no unique unmerged commit, untracked artifact, evidence file, or operator-owned work would disappear. Then remove the worktree through the repository-approved mechanism, prune stale metadata, and delete the task branch only when it is no longer needed for recovery or review.

          ## Why this is shared policy instead of a new prompt

          P07, P13, P50, repository bootstrap/continuity prompts, harness workflows, and future mutation owners all need the same writer-safety invariant. A standalone prompt would require every caller to remember to route through it. The global actionability policy is already compiled into every effective Prompt Kit prompt, so it is the lowest-duplication enforcement point. Read-only prompts inherit the text but have no writer-isolation action to perform.
          """
          doc = "\n".join(line[10:] if line.startswith("          ") else line for line in doc.splitlines()).strip() + "\n"
          (root / "docs/PROMPT_KIT_ISOLATED_WRITER_CONVERGENCE.md").write_text(doc, encoding="utf-8")

          test = '''from __future__ import annotations

          import json
          import sys
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SCRIPTS = ROOT / "scripts"
          if str(SCRIPTS) not in sys.path:
              sys.path.insert(0, str(SCRIPTS))

          import build_prompt_kit_registry

          POLICY = ROOT / "registry/prompts/actionable-next-step-policy.v1.json"
          MARKER = "ISOLATED WRITER / CONVERGENCE CONTRACT"


          class IsolatedWriterConvergencePolicyTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.policy = json.loads(POLICY.read_text(encoding="utf-8"))
                  cls.prompts = build_prompt_kit_registry.load_prompt_registry()

              def test_policy_owns_writer_isolation_and_convergence(self) -> None:
                  self.assertEqual(self.policy["isolation_marker"], MARKER)
                  contract = self.policy["writer_isolation"]
                  self.assertEqual(contract["marker"], MARKER)
                  self.assertIn("worktree", contract["preferred_lane"].lower())
                  self.assertIn("isolated", contract["fallback_lane"].lower())
                  self.assertIn("dependency order", contract["local_convergence_rule"])
                  self.assertIn("local convergence", contract["remote_only_rule"].lower())
                  self.assertIn("unique commits", contract["cleanup_rule"].lower())

              def test_compiled_contract_covers_writer_safety_lifecycle(self) -> None:
                  appendix = self.policy["copy_content_appendix"]
                  for phrase in (
                      MARKER,
                      "each independent writer one isolated lane",
                      "Never reuse or modify another writer's branch/worktree/workspace",
                      "Git worktrees do not automatically isolate shared ports, databases, caches, lockfiles",
                      "The first finisher",
                      "must not reset, clean, delete, repurpose, overwrite, or merge-away unfinished sibling work",
                      "CONVERGE LOCALLY BEFORE REMOTE DEFAULT",
                      "integrate completed lanes in dependency order",
                      "rerun the combined owning validators/build/tests",
                      "provider-only or remote execution environment",
                      "local convergence is unavailable",
                      "Cleanup is last",
                      "no unique unmerged commits, untracked artifacts, evidence, or operator-owned work",
                  ):
                      self.assertIn(phrase, appendix)

              def test_every_effective_prompt_inherits_contract_exactly_once(self) -> None:
                  self.assertGreater(len(self.prompts), 1)
                  for prompt in self.prompts:
                      with self.subTest(prompt=prompt["id"]):
                          self.assertEqual(prompt["copyContent"].count(MARKER), 1)

              def test_p07_inherits_contract_without_new_prompt_identity(self) -> None:
                  by_id = {item["id"]: item for item in self.prompts}
                  self.assertIn("P07", by_id)
                  self.assertIn(MARKER, by_id["P07"]["copyContent"])
                  self.assertIn(MARKER, by_id["P07"]["nextStep"])

              def test_reference_document_records_external_precedent_and_prompt_kit_delta(self) -> None:
                  text = (ROOT / "docs/PROMPT_KIT_ISOLATED_WRITER_CONVERGENCE.md").read_text(encoding="utf-8")
                  for phrase in (
                      "Michael Shimeles",
                      "new-feature/SKILL.md",
                      "Completed lanes converge in dependency order",
                      "Provider-only / remote execution",
                      "Why this is shared policy instead of a new prompt",
                  ):
                      self.assertIn(phrase, text)


          if __name__ == "__main__":
              unittest.main()
          '''
          test = "\n".join(line[10:] if line.startswith("          ") else line for line in test.splitlines()).lstrip()
          (root / "tests/test_isolated_writer_convergence_policy.py").write_text(test, encoding="utf-8")
          PY
      - name: Build and validate exact branch candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_isolated_writer_convergence_policy -v
          python -m unittest tests.test_actionable_prompt_registry tests.test_remote_freshness_p13_iteration tests.test_green_branch_integration_policy -v
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
          git diff --check
      - name: Commit durable result and self-remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-isolated-writer-convergence.yml
          git add registry/prompts/actionable-next-step-policy.v1.json docs/PROMPT_KIT_ISOLATED_WRITER_CONVERGENCE.md tests/test_isolated_writer_convergence_policy.py web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m "feat(prompt-kit): add isolated writer convergence contract"
          git push origin HEAD:feat/prompt-kit-isolated-writer-convergence-20260915
