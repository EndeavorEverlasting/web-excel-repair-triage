name: Temporary Job Application Pack Regression Repair

on:
  push:
    branches:
      - feat/job-application-pack-prompt-20260911

permissions:
  contents: write

concurrency:
  group: job-application-pack-regression-repair-20260911
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/job-application-pack-prompt-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile, prove collection, clean carrier, and push exact head
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/job-application-pack-prompt-20260911 --prune --tags
          git merge --no-edit origin/main

          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName('tests.test_job_search_prompt_registry')
          count = suite.countTestCases()
          print(f'COLLECTED_JOB_SEARCH_TESTS={count}')
          if count != 6:
              raise SystemExit(f'expected exactly 6 focused job-search tests, got {count}')
          PY
          python -m unittest tests.test_job_search_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_harness.py
          git diff --check

          git rm -f .github/workflows/tmp-job-application-pack-regression-repair.yml
          git diff --cached --check
          git commit -m 'chore(prompt-kit): remove application-pack validation carrier'

          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName('tests.test_job_search_prompt_registry')
          count = suite.countTestCases()
          print(f'EXACT_HEAD_COLLECTED_JOB_SEARCH_TESTS={count}')
          if count != 6:
              raise SystemExit(f'expected exactly 6 focused job-search tests, got {count}')
          PY
          python -m unittest tests.test_job_search_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_harness.py
          git diff --check
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          git push origin HEAD:feat/job-application-pack-prompt-20260911
