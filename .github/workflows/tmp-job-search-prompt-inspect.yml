name: Temporary job search prompt contribution

on:
  push:
    branches:
      - feat/prompt-kit-job-search-workflows-20260903

permissions:
  contents: write

concurrency:
  group: tmp-job-search-prompt-contribution
  cancel-in-progress: false

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-job-search-workflows-20260903
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Add job search prompts and validate
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/prompt-kit-job-search-workflows-20260903 --prune
          test "$(git branch --show-current)" = "feat/prompt-kit-job-search-workflows-20260903"
          git merge-base --is-ancestor 6ad9ef6d746829bcc7e06344223e7706fa52c5f4 HEAD

          if [ ! -f tmp/apply_job_search_prompt_contribution.py ]; then
            echo 'Contribution carrier already consumed.'
            exit 0
          fi

          python tmp/apply_job_search_prompt_contribution.py

          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_job_search_prompt_registry -v
          python -m unittest tests.test_management_operations_prompt_registry -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_harness.py
          git diff --check

          python - <<'PY'
          from scripts import build_prompt_kit_registry
          prompts = build_prompt_kit_registry.load_prompt_kit_registry()
          by_name = {p['name']: p for p in prompts}
          portable = by_name['Job Opportunity Search & Trajectory Mapper']
          sync = by_name['Connected Job Search Workspace & Tracker Synchronizer']
          assert portable['id'] != sync['id']
          assert 'SEARCH TO BOUNDED SOURCE SATURATION' in portable['copyContent']
          assert 'Applied? | Priority | Status | Company | Role | Work Mode' in portable['copyContent']
          assert 'DISCOVER BEFORE CREATING' in sync['copyContent']
          assert 'Report exact spreadsheet ranges/row IDs/files changed' in sync['copyContent']
          print(f"JOB_SEARCH_FIXED_POINT portable={portable['id']} sync={sync['id']} prompts={len(prompts)}")
          PY

          git add \
            registry/prompts/management-operations-prompts.v1.json \
            tests/test_job_search_prompt_registry.py \
            web/prompt-kit/index.html
          git rm \
            tmp/apply_job_search_prompt_contribution.py \
            tmp/job-opportunity-search-draft.json \
            tmp/job-search-workspace-sync-draft.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): add job search discovery and tracker workflows'
          git push origin HEAD:feat/prompt-kit-job-search-workflows-20260903
