name: Temporary job search prompt second-pass review

on:
  push:
    branches:
      - feat/prompt-kit-job-search-workflows-20260903

permissions:
  contents: write

concurrency:
  group: tmp-job-search-prompt-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-job-search-workflows-20260903
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Repair inert profile and rerun contribution proof
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/prompt-kit-job-search-workflows-20260903 --prune
          test "$(git branch --show-current)" = "feat/prompt-kit-job-search-workflows-20260903"
          git merge-base --is-ancestor 6ad9ef6d746829bcc7e06344223e7706fa52c5f4 HEAD

          if [ ! -f tmp/review_job_search_prompt_contribution.py ]; then
            echo 'Review carrier already consumed.'
            exit 0
          fi

          python tmp/review_job_search_prompt_contribution.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_job_search_prompt_registry -v
          python -m unittest tests.test_management_operations_prompt_registry -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_harness.py
          git diff --check

          python - <<'PY'
          from scripts import build_prompt_kit_registry
          prompts={p['id']:p for p in build_prompt_kit_registry.load_prompt_kit_registry()}
          for pid in ('P126','P127'):
              assert 'profile' not in prompts[pid], (pid,prompts[pid].get('profile'))
          assert prompts['P126']['actionabilityPolicy']=='actionable-next-command/v1'
          assert prompts['P127']['actionabilityPolicy']=='actionable-next-command/v1'
          print(f"SECOND_PASS_FIXED_POINT P126=P126 P127=P127 prompts={len(prompts)} inert_profile=REMOVED")
          PY

          git add \
            registry/prompts/management-operations-prompts.v1.json \
            tests/test_job_search_prompt_registry.py \
            web/prompt-kit/index.html
          git rm tmp/review_job_search_prompt_contribution.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(prompt-kit): keep job search prompts profile-neutral'
          git push origin HEAD:feat/prompt-kit-job-search-workflows-20260903
