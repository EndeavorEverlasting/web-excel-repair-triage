name: Temporary repository local action bootstrap

on:
  push:
    branches:
      - fix/local-proof-continuity-20260917
    paths:
      - .github/workflows/tmp-local-proof-action-bootstrap.yml

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  CI: "true"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/local-proof-continuity-20260917
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pinned repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test-floor.txt

      - name: Build durable repository-local action seam
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_bootstrap_repository_actions.py
          python scripts/run_repository_action.py \
            --action prompt-kit-build-proof \
            --report Outputs/repository-actions/bootstrap-proof.json
          python scripts/validate_harness.py \
            --report Outputs/harness-completeness-report.json
          python -m unittest tests.test_harness_contract -v
          git diff --check

      - name: Enforce bounded diff and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-local-proof-action-bootstrap.yml
          rm scripts/tmp_bootstrap_repository_actions.py
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/repository-local-action.yml',
              '.github/workflows/tmp-local-proof-action-bootstrap.yml',
              'harness/contracts/repository-local-proof-continuity.v1.json',
              'harness/repository-actions.v1.json',
              'harness/specs/prompt-operations.md',
              'registry/prompts/actionable-next-step-policy.v1.json',
              'scripts/run_repository_action.py',
              'scripts/tmp_bootstrap_repository_actions.py',
              'tests/test_repository_actions.py',
              'web/prompt-kit/index.html',
          }
          output = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True)
          changed = set()
          for line in output.splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path.startswith('Outputs/'):
                  continue
              changed.add(path)
          extra = sorted(changed - allowed)
          if extra:
              raise SystemExit(f'unexpected durable paths: {extra}')
          print('bounded changed paths:', sorted(changed))
          PY
          git diff --check

      - name: Commit durable local-action seam
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EndeavorEverlasting"
          git config user.email "71802818+EndeavorEverlasting@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(prompt-kit): add quota-resilient repository local actions"
          git push origin HEAD:fix/local-proof-continuity-20260917
