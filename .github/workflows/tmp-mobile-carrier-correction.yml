name: Temporary mobile carrier correction

on:
  push:
    branches:
      - fix/operant-mobile-prompt-copy-snap-20260908

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/operant-mobile-prompt-copy-snap-20260908
          fetch-depth: 0
      - name: Correct contract phrase and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/tmp-mobile-prompt-copy-snap-repair.yml')
          s=p.read_text(encoding='utf-8')
          old='actionable viewport without opening prompt detail, More, browser Find, or a search-result step. '
          new='actionable viewport with prompt detail closed, without opening More, browser Find, or a search-result step. '
          if old not in s:
              raise SystemExit('carrier phrase anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-mobile-carrier-correction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/tmp-mobile-prompt-copy-snap-repair.yml .github/workflows/tmp-mobile-carrier-correction.yml
          git diff --cached --check
          git commit -m "chore(operant): align mobile repair contract phrase"
          git push origin HEAD:fix/operant-mobile-prompt-copy-snap-20260908
