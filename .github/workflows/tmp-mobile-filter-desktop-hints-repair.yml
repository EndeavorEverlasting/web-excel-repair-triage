name: TEMP mobile filter desktop-hints repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-mobile-filter-desktop-hints-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/mobile-filter-desktop-hints-20260914'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Reconcile current main without discarding owned work
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main
      - name: Repair touch-medium filter chrome and strengthen recurrence gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          js_path = Path('docs/prompt-kit.js')
          js = js_path.read_text(encoding='utf-8')
          old = '@media (hover:none), (pointer:coarse){.prompt-open-btn'
          new = '@media (hover:none), (pointer:coarse){.header .search-kbd,.header .cat-tab .kbd{display:none}.prompt-open-btn'
          if js.count(old) != 1:
              raise SystemExit(f'expected one touch-medium CSS seam, found {js.count(old)}')
          js_path.write_text(js.replace(old, new, 1), encoding='utf-8')

          contract_path = Path('harness/contracts/prompt-kit-mobile.v1.json')
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          req = next(item for item in contract['requirements'] if item['id'] == 'mobile_medium_orientation_invariant')
          sentence = ' Desktop-only keyboard shortcut hint chrome inside Search and filter/profile tabs stays hidden whenever the touch/coarse-pointer mobile medium is active, including while Filters are expanded in landscape.'
          if sentence.strip() in req['expected']:
              raise SystemExit('mobile contract strengthening already present; refusing duplicate patch')
          req['expected'] += sentence
          contract_path.write_text(json.dumps(contract, indent=2) + '\n', encoding='utf-8')

          unit_path = Path('tests/test_prompt_kit_mobile.py')
          unit = unit_path.read_text(encoding='utf-8')
          unit_needle = '            ".ref-sidebar{width:100vw;max-width:100vw",\n            "touch-action:manipulation",\n'
          unit_replacement = '            ".ref-sidebar{width:100vw;max-width:100vw",\n            ".header .search-kbd,.header .cat-tab .kbd{display:none}",\n            "touch-action:manipulation",\n'
          if unit.count(unit_needle) != 1:
              raise SystemExit(f'expected one mobile static marker seam, found {unit.count(unit_needle)}')
          unit_path.write_text(unit.replace(unit_needle, unit_replacement, 1), encoding='utf-8')

          proof_path = Path('tests/prompt_kit_medium_stability_browser_proof.py')
          proof = proof_path.read_text(encoding='utf-8')
          mobile_needle = '    assert not visible(page, ".hotkey-desktop-label"), f"{label}: desktop Hotkeys label leaked into mobile mode"\n'
          mobile_addition = mobile_needle + '''    filter_toggle = page.locator("#filterPanelToggle")\n    if filter_toggle.get_attribute("aria-expanded") != "true":\n        filter_toggle.click()\n    assert filter_toggle.get_attribute("aria-expanded") == "true", f"{label}: Filters could not be expanded"\n    search_hint_display = page.locator(".search-kbd").evaluate("el => getComputedStyle(el).display")\n    assert search_hint_display == "none", f"{label}: desktop Search shortcut hint leaked into mobile filters"\n    visible_filter_hints = page.locator(".cat-tabs .kbd").evaluate_all("els => els.filter(el => getComputedStyle(el).display !== 'none').length")\n    assert visible_filter_hints == 0, f"{label}: {visible_filter_hints} desktop filter shortcut hints leaked into mobile filters"\n'''
          if proof.count(mobile_needle) != 1:
              raise SystemExit(f'expected one mobile identity seam, found {proof.count(mobile_needle)}')
          proof = proof.replace(mobile_needle, mobile_addition, 1)

          desktop_needle = '    assert not visible(page, ".mobile-quick-label"), f"{label}: mobile More label leaked into desktop mode"\n'
          desktop_addition = desktop_needle + '''    search_hint_display = page.locator(".search-kbd").evaluate("el => getComputedStyle(el).display")\n    assert search_hint_display != "none", f"{label}: desktop Search shortcut hint was incorrectly hidden"\n    visible_filter_hints = page.locator(".cat-tabs .kbd").evaluate_all("els => els.filter(el => getComputedStyle(el).display !== 'none').length")\n    assert visible_filter_hints > 0, f"{label}: desktop filter shortcut hints were incorrectly hidden"\n'''
          if proof.count(desktop_needle) != 1:
              raise SystemExit(f'expected one desktop identity seam, found {proof.count(desktop_needle)}')
          proof = proof.replace(desktop_needle, desktop_addition, 1)

          portrait_needle = '                search = page.locator("#search")\n                search.fill("P110 orientation sentinel")\n                navigation_count = page.evaluate("performance.getEntriesByType(\'navigation\').length")\n                assert_mobile_identity(page, "portrait")\n'
          portrait_replacement = '                search = page.locator("#search")\n                assert_mobile_identity(page, "portrait-expanded-filters")\n                search.fill("P110 orientation sentinel")\n                navigation_count = page.evaluate("performance.getEntriesByType(\'navigation\').length")\n                assert_mobile_identity(page, "portrait")\n'
          if proof.count(portrait_needle) != 1:
              raise SystemExit(f'expected one portrait journey seam, found {proof.count(portrait_needle)}')
          proof = proof.replace(portrait_needle, portrait_replacement, 1)

          landscape_needle = '                page.wait_for_timeout(80)\n                assert_mobile_identity(page, "landscape")\n                assert search.input_value() == "P110 orientation sentinel", "phone rotation reset search state"\n'
          landscape_replacement = '''                page.wait_for_timeout(80)\n                filter_toggle = page.locator("#filterPanelToggle")\n                if filter_toggle.get_attribute("aria-expanded") != "true":\n                    filter_toggle.click()\n                filter_toggle.click()\n                assert filter_toggle.get_attribute("aria-expanded") == "false", "landscape: Filters did not collapse before regression toggle"\n                filter_toggle.click()\n                assert filter_toggle.get_attribute("aria-expanded") == "true", "landscape: Filters did not re-expand for regression check"\n                page.wait_for_timeout(40)\n                assert_mobile_identity(page, "landscape-expanded-filters")\n                assert search.input_value() == "P110 orientation sentinel", "phone rotation reset search state"\n'''
          if proof.count(landscape_needle) != 1:
              raise SystemExit(f'expected one landscape journey seam, found {proof.count(landscape_needle)}')
          proof_path.write_text(proof.replace(landscape_needle, landscape_replacement, 1), encoding='utf-8')

          workflow_path = Path('.github/workflows/prompt-kit-mobile-quick-controls.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          path_needle = "      - 'docs/prompt-kit-polish.js'\n"
          if workflow.count(path_needle) != 2:
              raise SystemExit(f'expected two mobile workflow path seams, found {workflow.count(path_needle)}')
          workflow = workflow.replace(path_needle, "      - 'docs/prompt-kit.js'\n" + path_needle)
          syntax_needle = '          node --check docs/prompt-kit-polish.js\n'
          if workflow.count(syntax_needle) != 1:
              raise SystemExit(f'expected one mobile syntax-check seam, found {workflow.count(syntax_needle)}')
          workflow = workflow.replace(syntax_needle, '          node --check docs/prompt-kit.js\n' + syntax_needle, 1)
          workflow_path.write_text(workflow, encoding='utf-8')
          PY
      - name: Rebuild canonical generated Prompt Kit
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Syntax validation
        run: |
          set -euo pipefail
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-polish.js
      - name: Mobile contract unit validation
        run: python -m unittest tests.test_prompt_kit_mobile -v
      - name: Mobile quick-controls unit validation
        run: python -m unittest tests.test_prompt_kit_mobile_quick_controls -v
      - name: Product interactions unit validation
        run: python -m unittest tests.test_prompt_kit_product_interactions -v
      - name: Filtering-access unit validation
        run: python -m unittest tests.test_prompt_kit_filtering_access -v
      - name: Cross-input unit validation
        run: python -m unittest tests.test_prompt_kit_cross_input_modality -v
      - name: Generated-site parity validation
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Diff validation
        run: git diff --check
      - name: Install Chromium proof dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Browser regression proof
        run: |
          set -euo pipefail
          python tests/prompt_kit_mobile_quick_controls_browser_proof.py
          python tests/prompt_kit_medium_stability_browser_proof.py
      - name: Commit durable repair and self-remove carrier
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-mobile-filter-desktop-hints-repair.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(prompt-kit): hide desktop shortcut hints on mobile filters'
          git push origin HEAD:${{ github.head_ref }}
