name: Temporary natural hotkey mainline convergence

on:
  push:
    branches:
      - fix/operant-natural-prompt-hotkeys-mainline-20260908

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated mainline lane
        uses: actions/checkout@v7
        with:
          ref: fix/operant-natural-prompt-hotkeys-mainline-20260908
          fetch-depth: 0

      - name: Refresh and reconcile current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/operant-natural-prompt-hotkeys-20260908 --prune
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "branch_before=$(git rev-parse HEAD)"
          echo "main_floor=$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          git merge-base --is-ancestor origin/main HEAD
          echo "reconciled_head=$(git rev-parse HEAD)"

      - name: Apply bounded mainline repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_converge_natural_hotkeys.py

      - name: Regenerate canonical Prompt Kit and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          node --check docs/prompt-kit-polish.js
          node --check docs/prompt-kit-hotkey-prototype.js
          python -m py_compile tests/prompt_kit_favorite_browser_proof.py tests/prompt_kit_hotkey_identity_browser_proof.py
          python -m unittest tests.test_prompt_kit_hotkey_completion tests.test_prompt_kit_hotkey_identity_runtime tests.test_prompt_kit_interactions_contract tests.test_prompt_kit_discovery tests.test_prompt_kit_cross_input_modality tests.test_observed_behavior_proof_harness tests.test_prompt_kit_product_interactions tests.test_prompt_kit_filtering_access -v
          python scripts/validate_prompt_kit_interactions.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          git diff --check

      - name: Bound changed surfaces
        shell: bash
        run: |
          set -euo pipefail
          unexpected=0
          while IFS= read -r file; do
            case "$file" in
              docs/prompt-kit-polish.js|docs/PROMPT_KIT_HOTKEY_PROGRAM_DESIGN.md|docs/PROMPT_KIT_OPERATOR_GUIDE.md|web/README.md|web/prompt-kit/index.html|tests/test_prompt_kit_hotkey_completion.py|tests/test_prompt_kit_hotkey_identity_runtime.py|tests/test_prompt_kit_discovery.py|tests/prompt_kit_favorite_browser_proof.py|tests/prompt_kit_hotkey_identity_browser_proof.py|.github/workflows/prompt-kit-observed-browser-proof.yml|scripts/tmp_converge_natural_hotkeys.py|.github/workflows/tmp-natural-hotkey-mainline-convergence.yml) ;;
              *) echo "unexpected changed surface: $file" >&2; unexpected=1 ;;
            esac
          done < <(git diff --name-only)
          test "$unexpected" -eq 0

      - name: Commit durable repair and self-remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/tmp_converge_natural_hotkeys.py .github/workflows/tmp-natural-hotkey-mainline-convergence.yml
          git status --short
          git diff --stat
          git diff --check
          git add -A -- docs/prompt-kit-polish.js docs/PROMPT_KIT_HOTKEY_PROGRAM_DESIGN.md docs/PROMPT_KIT_OPERATOR_GUIDE.md web/README.md web/prompt-kit/index.html tests/test_prompt_kit_hotkey_completion.py tests/test_prompt_kit_hotkey_identity_runtime.py tests/test_prompt_kit_discovery.py tests/prompt_kit_favorite_browser_proof.py tests/prompt_kit_hotkey_identity_browser_proof.py .github/workflows/prompt-kit-observed-browser-proof.yml scripts/tmp_converge_natural_hotkeys.py .github/workflows/tmp-natural-hotkey-mainline-convergence.yml
          git diff --cached --check
          git commit -m "fix(operant): make catalog prompt numbers authoritative"
          git push origin HEAD:fix/operant-natural-prompt-hotkeys-mainline-20260908
