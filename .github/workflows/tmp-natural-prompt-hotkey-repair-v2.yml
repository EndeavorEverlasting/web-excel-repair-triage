name: Temporary natural prompt hotkey repair v2

on:
  push:
    branches:
      - fix/operant-natural-prompt-hotkeys-20260908

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout owning branch
        uses: actions/checkout@v7
        with:
          ref: fix/operant-natural-prompt-hotkeys-20260908
          fetch-depth: 0

      - name: Reconcile current main floor without rewriting owned history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "branch_head_before=$(git rev-parse HEAD)"
          echo "main_floor=$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          git merge-base --is-ancestor origin/main HEAD
          echo "reconciled_head=$(git rev-parse HEAD)"

      - name: Repair transport guard and apply bounded product patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp_repair_natural_prompt_hotkeys.py')
          text = path.read_text(encoding='utf-8')
          old = '''for forbidden in (\n    "PROMPT_KIT_SHORTCUT_STORAGE_KEY",\n    "PROMPT_KIT_SHORTCUT_SCHEMA",\n    "promptShortcutBindings",\n    "function configurePromptShortcut(",\n    "function removePromptShortcut(",\n    "promptShortcutPromptId",\n    "saveShortcut",\n):'''
          new = '''for forbidden in (\n    "PROMPT_KIT_SHORTCUT_STORAGE_KEY",\n    "PROMPT_KIT_SHORTCUT_SCHEMA",\n    "var promptShortcutBindings=",\n    "Object.keys(promptShortcutBindings)",\n    "promptShortcutBindings[",\n    "loadPromptShortcutBindings(",\n    "writePromptShortcutBindings(",\n    "function configurePromptShortcut(",\n    "function removePromptShortcut(",\n    "promptShortcutPromptId",\n    "saveShortcut",\n):'''
          if old not in text:
              raise SystemExit('transport guard anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/tmp_repair_natural_prompt_hotkeys.py

      - name: Repair observed proof drift after retiring manual shortcuts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: anchor missing')
              return text.replace(old, new, 1)

          test_path = Path('tests/test_prompt_kit_hotkey_completion.py')
          test = test_path.read_text(encoding='utf-8')
          test = replace_once(
              test,
              'self.assertIn("Number(a.slice(1))-Number(b.slice(1))", source)',
              'self.assertIn("Number(a)-Number(b)", source)',
              'numeric sort assertion',
          )
          test = replace_once(
              test,
              'self.assertIn("manual prompt-shortcut persistence is retired", design)',
              'self.assertIn("manual prompt-shortcut persistence is retired", design.lower())',
              'design casefold assertion',
          )
          method_pattern = re.compile(
              r'^    def test_browser_proof_reports_actual_execution_topology\(self\) -> None:\n.*?(?=^    def |^if __name__ ==)',
              re.MULTILINE | re.DOTALL,
          )
          method = '''    def test_browser_proof_reports_actual_execution_topology(self) -> None:\n        proof = (ROOT / "tests" / "prompt_kit_favorite_browser_proof.py").read_text(encoding="utf-8")\n        identity = (ROOT / "tests" / "prompt_kit_hotkey_identity_browser_proof.py").read_text(encoding="utf-8")\n        for marker in (\n            "def execution_environment_kind(env=None)",\n            "GITHUB_ACTIONS",\n            "github_actions_headless_browser",\n            "local_headless_browser",\n            '\"kind\": execution_environment_kind()',\n            'page.keyboard.press("/")',\n            'search_escape_recovery',\n            'empty_search_focus_released',\n            'global_hotkey_restored',\n            'for slot_key in "ABCDE":',\n            'profile_header_hotkeys_a_to_e',\n            'page.keyboard.type("126")',\n            'catalog_numeric_shortcut_dispatched',\n            'clipboard equals canonical P126 copyContent',\n            "def canonical_clipboard_text(text: str) -> str:",\n            'canonical_clipboard_text(actual) == canonical_clipboard_text(expected)',\n        ):\n            self.assertIn(marker, proof)\n        for marker in (\n            'TARGETS = ("P11", "P13", "P111", "P126")',\n            'Natural prompt hotkeys are catalog-derived',\n            'P126',\n        ):\n            self.assertIn(marker, identity)\n        self.assertNotIn('promptShortcutPromptId', proof)\n        self.assertNotIn('Save favorite prompt keyboard shortcut', proof)\n        source = POLISH.read_text(encoding="utf-8")\n        self.assertIn("window.PromptKitProfiles.activateSlot('A',true)", source)\n'''
          match = method_pattern.search(test)
          if not match:
              raise SystemExit('browser topology test method anchor missing')
          test = test[:match.start()] + method + '\n' + test[match.end():]
          test_path.write_text(test, encoding='utf-8')

          proof_path = Path('tests/prompt_kit_favorite_browser_proof.py')
          proof = proof_path.read_text(encoding='utf-8')
          proof = replace_once(
              proof,
              'expected = page.evaluate("PROMPTS.find(p => p.id === \'P79\').copyContent")',
              'expected = page.evaluate("PROMPTS.find(p => p.id === \'P126\').copyContent")',
              'P126 clipboard expectation',
          )
          start_marker = '            # Configure the Favorite through the actual product UI, not closure internals.\n'
          end_marker = '            with closing(browser.new_context(\n'
          start = proof.find(start_marker)
          end = proof.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('favorite browser desktop block anchor missing')
          desktop = '''            # Hotkeys help must expose the natural numeric route without manual shortcut setup.\n            page.locator('#hotkeyHelpToggle').click()\n            page.wait_for_timeout(50)\n            click_focus = page.evaluate("document.activeElement && document.activeElement.classList.contains('hotkey-help-close')")\n            click_visible = page.locator('#hotkeyHelpPanel').is_visible()\n            help_text = page.locator('#hotkeyHelpPanel').inner_text()\n            natural_help_visible = '126' in help_text and 'Favorites need no shortcut setup' in help_text\n            page.keyboard.press('Escape')\n            page.wait_for_timeout(50)\n            escape_closed = page.evaluate("document.getElementById('hotkeyHelpPanel').hidden")\n            escape_focus_returned = page.evaluate("document.activeElement && document.activeElement.id === 'hotkeyHelpToggle'")\n            page.keyboard.press('Backquote')\n            page.wait_for_timeout(50)\n            backtick_focus = page.evaluate("document.activeElement && document.activeElement.classList.contains('hotkey-help-close')")\n            backtick_visible = page.locator('#hotkeyHelpPanel').is_visible()\n            page.keyboard.press('Escape')\n            page.wait_for_timeout(50)\n\n            # Force a filtered-out target, then type the bare catalog number through the real keyboard path.\n            page.locator('#search').fill('definitely-no-p126-match-xyz')\n            page.wait_for_timeout(100)\n            before_present = page.locator('[data-prompt-id="P126"]').count() > 0\n            page.evaluate("document.activeElement && document.activeElement.blur()")\n            page.keyboard.type("126")\n            try:\n                page.wait_for_function("""() => {\n                  const card=document.querySelector('[data-prompt-id=\\"P126\\"]');\n                  if(!card)return false;\n                  const r=card.getBoundingClientRect();\n                  return r.bottom>0 && r.top<innerHeight;\n                }""", timeout=4000)\n            except Exception:\n                pass\n            page.wait_for_timeout(150)\n            toast_text = page.locator('#toast').inner_text()\n            shortcut_copied = 'Copied' in toast_text\n            try:\n                actual = page.evaluate('navigator.clipboard.readText()')\n                clipboard_read = True\n            except Exception:\n                actual = ''\n                clipboard_read = False\n\n            target = page.locator('[data-prompt-id="P126"]')\n            target_present = target.count() > 0\n            visible = False\n            if target_present:\n                visible = page.evaluate("""() => {\n                  const r=document.querySelector('[data-prompt-id="P126"]').getBoundingClientRect();\n                  return r.bottom>0 && r.top<innerHeight;\n                }""")\n            modal_closed = page.evaluate("""() => {\n              const o=document.getElementById('promptDetailOverlay');\n              return !o || !o.classList.contains('open');\n            }""")\n            close_focused = page.evaluate("""() => !!(\n              document.activeElement &&\n              (document.activeElement.classList.contains('pd-close') || document.activeElement.id==='promptDetailClose')\n            )""")\n\n            page.keyboard.press('Enter')\n            page.wait_for_timeout(100)\n            enter_modal_closed = page.evaluate("""() => {\n              const o=document.getElementById('promptDetailOverlay');\n              return !o || !o.classList.contains('open');\n            }""")\n            try:\n                after_enter = page.evaluate('navigator.clipboard.readText()')\n            except Exception:\n                after_enter = ''\n\n            screenshot.parent.mkdir(parents=True, exist_ok=True)\n            page.screenshot(path=str(screenshot), full_page=False)\n            observations = [\n                {"id": "search_escape_recovery", "event": "Slash focuses search; Escape clears and releases populated or empty search and restores global hotkeys", "occurred": True, "passed": bool(all((search_escape["slash_focused"], search_escape["typed_value"] == "P79", search_escape["clear_visible_before"], search_escape["cleared"], search_escape["focus_released"], search_escape["clear_hidden_after"], search_escape["empty_refocused"], search_escape["empty_focus_released"], search_escape["global_hotkey_restored"]))), **search_escape},\n                {"id": "profile_header_hotkeys_a_to_e", "event": "A-E header hotkeys activate their matching profile slots", "occurred": True, "passed": bool(set(profile_hotkeys) == set("ABCDE") and all(profile_hotkeys.values())), "slots": profile_hotkeys},\n                {"id": "hotkey_click_exposes_numeric_route", "event": "Hotkeys button opens the panel, focuses its close control, and exposes the natural numeric route", "occurred": True, "passed": bool(click_focus and click_visible and natural_help_visible), "focused": bool(click_focus), "visible": bool(click_visible)},\n                {"id": "escape_closes_hotkeys_from_close", "event": "Escape closes Hotkeys and returns focus to the Hotkeys toggle", "occurred": True, "passed": bool(escape_closed and escape_focus_returned), "closed": bool(escape_closed), "toggle_focused": bool(escape_focus_returned)},\n                {"id": "hotkey_backtick_exposes_numeric_route", "event": "Backtick opens Hotkeys with its close control focused and numeric route visible", "occurred": True, "passed": bool(backtick_focus and backtick_visible and natural_help_visible), "focused": bool(backtick_focus), "visible": bool(backtick_visible)},\n                {"id": "natural_numeric_route_discoverable", "event": "Hotkeys teaches bare 126 without a manual Favorite shortcut setup step", "occurred": True, "passed": bool(natural_help_visible)},\n                {"id": "alternate_scope_precondition", "event": "A nonmatching search excludes P126 before the catalog shortcut", "occurred": True, "passed": bool(not before_present), "present_before": bool(before_present)},\n                {"id": "catalog_numeric_shortcut_dispatched", "event": "typed bare catalog shortcut 126", "occurred": True, "passed": bool(shortcut_copied), "toast": toast_text},\n                {"id": "prompt_card_scrolled_visible", "event": "P126 card exists and intersects viewport after shortcut", "occurred": True, "passed": bool(target_present and visible), "present": bool(target_present), "visible": bool(visible)},\n                {"id": "clipboard_exact_match", "event": "clipboard equals canonical P126 copyContent", "occurred": bool(clipboard_read), "passed": bool(clipboard_read and canonical_clipboard_text(actual) == canonical_clipboard_text(expected)), "actual_length": len(actual), "expected_length": len(expected)},\n                {"id": "detail_modal_closed", "event": "catalog shortcut does not open detail modal or focus its close control", "occurred": True, "passed": bool(modal_closed and not close_focused), "modal_closed": bool(modal_closed), "close_focused": bool(close_focused)},\n                {"id": "enter_does_not_close_prompt", "event": "Enter after shortcut leaves detail modal closed and clipboard intact", "occurred": True, "passed": bool(enter_modal_closed and canonical_clipboard_text(after_enter) == canonical_clipboard_text(expected))},\n            ]\n'''
          proof = proof[:start] + desktop + proof[end:]
          replacements = {
              "('hotkey_click_focuses_favorite_input', 'escape_closes_hotkeys_from_favorite_input', 'hotkey_backtick_focuses_favorite_input')": "('hotkey_click_exposes_numeric_route', 'escape_closes_hotkeys_from_close', 'hotkey_backtick_exposes_numeric_route')",
              "('favorite_setup_saved', 'favorite_shortcut_dispatched', 'clipboard_exact_match')": "('natural_numeric_route_discoverable', 'catalog_numeric_shortcut_dispatched', 'clipboard_exact_match')",
              "('alternate_scope_precondition', 'favorite_shortcut_dispatched', 'prompt_card_scrolled_visible')": "('alternate_scope_precondition', 'catalog_numeric_shortcut_dispatched', 'prompt_card_scrolled_visible')",
              '"id": "favorite_auto_copy"': '"id": "catalog_numeric_auto_copy"',
              '"id": "favorite_scroll"': '"id": "catalog_numeric_snap"',
              'Typing configured Favorite P79 automatically copies canonical prompt content': 'Typing bare numeric 126 automatically copies canonical P126 content',
              'Typing configured Favorite P79 exits an alternate scope and scrolls the P79 card into view': 'Typing bare numeric 126 clears the filtered scope and snaps the P126 card into view',
              'search-escape-profile-tabs-a-e-favorite-shortcut-and-mobile-favorites-definitive-journey': 'search-escape-profile-tabs-a-e-catalog-numeric-shortcut-and-mobile-favorites-definitive-journey',
          }
          for old, new in replacements.items():
              if old not in proof:
                  raise SystemExit(f'favorite browser receipt anchor missing: {old}')
              proof = proof.replace(old, new, 1)
          proof_path.write_text(proof, encoding='utf-8')
          PY

      - name: Regenerate canonical Prompt Kit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          node --check docs/prompt-kit-polish.js
          python -m py_compile tests/prompt_kit_favorite_browser_proof.py tests/prompt_kit_hotkey_identity_browser_proof.py

      - name: Validate natural hotkey contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_prompt_kit_interactions_contract \
            tests.test_prompt_kit_hotkey_completion \
            tests.test_observed_behavior_proof_harness -v
          python scripts/validate_prompt_kit_interactions.py --summary
          git diff --check

      - name: Commit durable repair and self-remove transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/tmp_repair_natural_prompt_hotkeys.py \
            .github/workflows/tmp-natural-prompt-hotkey-repair.yml \
            .github/workflows/tmp-natural-prompt-hotkey-repair-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git diff --stat
          git diff --check
          git add -A -- \
            docs/prompt-kit-polish.js \
            docs/PROMPT_KIT_HOTKEY_PROGRAM_DESIGN.md \
            docs/PROMPT_KIT_OPERATOR_GUIDE.md \
            web/README.md \
            tests/test_prompt_kit_interactions_contract.py \
            tests/test_prompt_kit_hotkey_completion.py \
            tests/prompt_kit_favorite_browser_proof.py \
            tests/prompt_kit_hotkey_identity_browser_proof.py \
            .github/workflows/prompt-kit-observed-browser-proof.yml \
            web/prompt-kit/index.html \
            scripts/tmp_repair_natural_prompt_hotkeys.py \
            .github/workflows/tmp-natural-prompt-hotkey-repair.yml \
            .github/workflows/tmp-natural-prompt-hotkey-repair-v2.yml
          git commit -m "fix(operant): derive numeric prompt hotkeys from catalog"
          git push origin HEAD:fix/operant-natural-prompt-hotkeys-20260908
