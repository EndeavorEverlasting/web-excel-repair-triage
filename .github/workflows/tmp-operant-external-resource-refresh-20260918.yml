name: Temporary Operant external resource projection refresh

on:
  push:
    branches:
      - fix/external-resource-projection-refresh-20260918

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/external-resource-projection-refresh-20260918
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate canonical projections
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/sync_operant_external_resources.py             --output web/prompt-kit/resources.v1.json             --gaps-output registry/resources/operant-external-resource-gaps.v1.json
      - name: Prove regenerated projections
        run: |
          python scripts/validate_operant_external_resources.py --summary
          python -m unittest tests.test_operant_external_resources tests.test_external_prior_art_gate -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Remove execution carrier and assert durable scope
        run: |
          rm .github/workflows/tmp-operant-external-resource-refresh-20260918.yml
          python - <<'PY'
          import subprocess
          allowed = {
              "web/prompt-kit/resources.v1.json",
              "registry/resources/operant-external-resource-gaps.v1.json",
              ".github/workflows/tmp-operant-external-resource-refresh-20260918.yml",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "status", "--short"], text=True
              ).splitlines()
          )
          paths = {line[3:] for line in changed}
          unexpected = sorted(paths - allowed)
          required = {
              "web/prompt-kit/resources.v1.json",
              "registry/resources/operant-external-resource-gaps.v1.json",
          }
          missing = sorted(required - paths)
          if unexpected or missing:
              raise SystemExit(
                  f"durable scope mismatch unexpected={unexpected} missing={missing}"
              )
          PY
      - name: Commit canonical refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/resources.v1.json             registry/resources/operant-external-resource-gaps.v1.json             .github/workflows/tmp-operant-external-resource-refresh-20260918.yml
          git commit -m "chore(operant): refresh external resource projection"
          git push origin HEAD:fix/external-resource-projection-refresh-20260918
