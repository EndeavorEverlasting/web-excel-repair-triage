name: Temporary Operant resource refresh carrier

on:
  push:
    branches:
      - refresh/operant-external-resources-20260905
    paths:
      - '.github/workflows/tmp-operant-resource-refresh-carrier.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact carrier head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Generate canonical external resource projections
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/sync_operant_external_resources.py \
            --output web/prompt-kit/resources.v1.json \
            --gaps-output registry/resources/operant-external-resource-gaps.v1.json
      - name: Validate generated projections
        run: |
          node --check docs/prompt-kit-external-resources.js
          python scripts/validate_operant_external_resources.py --summary
          python -m unittest tests.test_operant_external_resources -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Enforce bounded durable diff and self-remove carrier
        env:
          BASE_SHA: b1faf0db48f801a62e4eab4925f2ea43de8fa67c
        run: |
          rm .github/workflows/tmp-operant-resource-refresh-carrier.yml
          changed="$(git diff --name-only "$BASE_SHA" | sort)"
          expected="$(printf '%s\n' 'registry/resources/operant-external-resource-gaps.v1.json' 'web/prompt-kit/resources.v1.json' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected durable diff:\n%s\n' "$changed" >&2
            exit 1
          }
      - name: Commit generated refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/prompt-kit/resources.v1.json registry/resources/operant-external-resource-gaps.v1.json .github/workflows/tmp-operant-resource-refresh-carrier.yml
          git diff --cached --check
          git commit -m 'chore(operant): refresh external resource projection'
          git push origin HEAD:refresh/operant-external-resources-20260905
