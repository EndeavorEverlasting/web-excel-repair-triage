name: Temporary P07 binary parallel execution repair

on:
  push:
    branches:
      - fix/p07-binary-parallel-execution-20260910

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Refresh current main
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          git merge --no-edit origin/main
      - name: Mutate canonical P07 owner
        run: |
          set -euo pipefail
          python .github/tmp_p07_binary_parallel_execution.py mutate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate P07 and Prompt Kit contracts
        run: |
          set -euo pipefail
          python -m unittest tests.test_p02_p07_autonomous_iteration -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output Outputs/p07-prompt-kit-order-navigation-audit.json --summary
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_kit_guidance tests.test_skill_prompt_registry -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Second-pass semantic and scope review
        run: |
          set -euo pipefail
          PYTHONPATH=. python .github/tmp_p07_binary_parallel_execution.py review
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Fx 'docs/prompts.json'
          printf '%s\n' "$changed" | grep -Fx 'tests/test_p02_p07_autonomous_iteration.py'
          printf '%s\n' "$changed" | grep -Fx 'web/prompt-kit/index.html'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(docs/prompts\.json|tests/test_p02_p07_autonomous_iteration\.py|web/prompt-kit/index\.html)$' || true)"
          test -z "$unexpected"
      - name: Commit durable repair and remove carriers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-p07-binary-parallel-execution.yml .github/tmp_p07_binary_parallel_execution.py
          git diff --check
          git add docs/prompts.json tests/test_p02_p07_autonomous_iteration.py web/prompt-kit/index.html
          git status --short
          git diff --cached --stat
          git commit -m 'fix(prompt-kit): make P07 parallel execution binary'
          git push origin HEAD:fix/p07-binary-parallel-execution-20260910
