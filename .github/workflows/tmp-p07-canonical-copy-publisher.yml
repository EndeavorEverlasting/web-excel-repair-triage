name: Temporary P07 canonical copy publisher

on:
  push:
    branches:
      - fix/p07-canonical-copy-publication-20260917

permissions:
  contents: write

concurrency:
  group: p07-canonical-copy-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[p07-publisher]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Prove canonical clipboard identity
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_p07_effective_prompt_identity \
            tests.test_prompt_kit_compute_mode \
            tests.test_prompt_kit_product_interactions -v
          node --check docs/prompt-kit-compute-mode.js
      - name: Regenerate canonical website
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit generated website only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Canonical website already current; no generated commit required."
            exit 0
          fi
          git commit -m "chore(prompt-kit): regenerate canonical website [p07-publisher]"
          git push origin HEAD:${GITHUB_REF_NAME}
