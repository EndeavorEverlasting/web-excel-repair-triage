name: Temporary P07 effective identity repair

on:
  pull_request:
    paths:
      - .github/workflows/tmp-p07-effective-identity-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/p07-effective-panel-identity-20260917') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p07-effective-panel-identity-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair P07 identity and panel wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def patch_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          builder = Path('scripts/build_prompt_kit_registry.py')
          marker = 'def attach_compiled_effective_prompts(\n'
          helper = '''def _compose_compiled_effective_prompt(\n    base_prompt: str, compiled_overlay: str, profile_name: str\n) -> str:\n    """Preserve the canonical prompt contract and append only a compute-profile overlay."""\n    base = str(base_prompt).rstrip()\n    overlay = str(compiled_overlay).strip()\n    profile = str(profile_name).strip().lower()\n    if not base:\n        raise SystemExit("compiled prompt base contract must be non-empty")\n    if not overlay:\n        raise SystemExit("compiled prompt execution-profile overlay must be non-empty")\n    if profile == "exhaustive":\n        posture = (\n            "Exhaustive mode is the active compute contract. It reinforces the canonical "\n            "prompt's authorization to use all safe, decision-relevant compute until an "\n            "evidence-defined fixed point; canonical prompt obligations remain in force."\n        )\n    elif profile == "efficient":\n        posture = (\n            "Efficient mode is the active tighter compute ceiling for this run. It changes "\n            "compute volume only; canonical prompt obligations remain in force and may not "\n            "be weakened."\n        )\n    else:\n        raise SystemExit(f"unsupported compiled prompt profile: {profile_name}")\n    return (\n        f"{base}\\n\\n"\n        f"EXECUTION PROFILE OVERLAY — {profile.upper()}\\n"\n        f"{posture}\\n\\n"\n        f"{overlay}\\n"\n    )\n\n\n'''
          text = builder.read_text(encoding='utf-8')
          if '_compose_compiled_effective_prompt' not in text:
              patch_once(builder, marker, helper + marker)
          patch_once(
              builder,
              '            compiled[profile_name] = result["effective_prompt"]\n',
              '            compiled[profile_name] = _compose_compiled_effective_prompt(\n'
              '                item["copyContent"], result["effective_prompt"], profile_name\n'
              '            )\n',
          )

          semantics_path = Path('harness/prompt-compilation/semantics/P07.json')
          semantics = json.loads(semantics_path.read_text(encoding='utf-8'))
          for invariant in (
              'canonical_prompt_preservation',
              'exhaustive_compute_until_fixed_point',
              'progress_bearing_continuation',
          ):
              if invariant not in semantics['invariants']:
                  semantics['invariants'].append(invariant)
          semantics_path.write_text(json.dumps(semantics, indent=2) + '\n', encoding='utf-8')

          js = Path('docs/prompt-kit.js')
          patch_once(
              js,
              'function canonicalOpenPrompt(id){var p=',
              "function resolvePromptDetailContent(prompt){if(!prompt)return'';try{if(window.PromptKitComputeMode&&typeof window.PromptKitComputeMode.resolveCopyContent==='function'){var resolved=window.PromptKitComputeMode.resolveCopyContent(prompt);if(typeof resolved==='string'&&resolved)return resolved}}catch(e){}return prompt.copyContent?String(prompt.copyContent):''}\\nfunction canonicalOpenPrompt(id){var p=",
          )
          patch_once(
              js,
              "safeCopyContent=escapePromptHtml(p.copyContent||'');var el=",
              "resolvedCopyContent=resolvePromptDetailContent(p),safeCopyContent=escapePromptHtml(resolvedCopyContent);var el=",
          )
          patch_once(
              js,
              "if(p.copyContent){html+='<div class=\"pd-section\"><h4>Prompt Content</h4><pre>'+safeCopyContent+'</pre></div>'}",
              "if(resolvedCopyContent){html+='<div class=\"pd-section\"><h4>Prompt Content</h4><pre data-prompt-effective-content=\"true\">'+safeCopyContent+'</pre></div>'}",
          )

          compute = Path('docs/prompt-kit-compute-mode.js')
          patch_once(
              compute,
              'function refreshDetail(doc,storage,promptId){\n',
              'function refreshDetail(doc,storage,promptId,promptCatalog){\n',
          )
          patch_once(
              compute,
              "  if(!detail||String(detail.getAttribute('data-prompt-id')||'').toUpperCase()!==String(promptId||'').toUpperCase())return;\n  var resolution=resolveProfile({\n",
              "  if(!detail||String(detail.getAttribute('data-prompt-id')||'').toUpperCase()!==String(promptId||'').toUpperCase())return;\n  var catalog=Array.isArray(promptCatalog)?promptCatalog:[];\n  var prompt=catalog.find(function(item){return item&&String(item.id||'').toUpperCase()===String(promptId||'').toUpperCase()});\n  var contentNode=detail.querySelector('[data-prompt-effective-content=\"true\"]');\n  if(contentNode&&prompt)contentNode.textContent=resolveCopyContent(prompt,{storage:storage});\n  var resolution=resolveProfile({\n",
          )
          patch_once(compute, '    refreshDetail(doc,storage,promptId)\n', '    refreshDetail(doc,storage,promptId,promptCatalog)\n')
          patch_once(compute, "if(openId&&openId.getAttribute('data-prompt-id'))refreshDetail(doc,storage,openId.getAttribute('data-prompt-id'));", "if(openId&&openId.getAttribute('data-prompt-id'))refreshDetail(doc,storage,openId.getAttribute('data-prompt-id'),root.PROMPTS);")
          patch_once(compute, 'try{refreshDetail(doc,storage,id)}catch(error){}', 'try{refreshDetail(doc,storage,id,root.PROMPTS)}catch(error){}')
          patch_once(compute, 'refreshDetail:function(promptId){return refreshDetail(doc,storage,promptId)}', 'refreshDetail:function(promptId){return refreshDetail(doc,storage,promptId,root.PROMPTS)}')

          browser = Path('tests/prompt_kit_detail_browser_proof.py')
          p07_block = '''            # P07 detail must display and copy the exact compute-resolved effective prompt identity.\n            p07_card = page.locator('[data-prompt-id="P07"]')\n            p07_card.scroll_into_view_if_needed()\n            p07_card.locator('.prompt-open-btn').click()\n            page.wait_for_timeout(100)\n            p07_expected_exhaustive = canonical(page.evaluate("""() => {\n              const prompt=PROMPTS.find(p => p.id === 'P07');\n              return PromptKitComputeMode.resolveCopyContent(prompt);\n            }"""))\n            p07_display_exhaustive = canonical(page.locator('#promptDetail [data-prompt-effective-content="true"]').inner_text())\n            p07_exhaustive_display_match = p07_display_exhaustive == p07_expected_exhaustive\n            page.evaluate("navigator.clipboard.writeText('sentinel-p07-exhaustive')")\n            page.locator('#promptDetailCopyTop').click()\n            page.wait_for_timeout(100)\n            p07_exhaustive_copy_match = canonical(page.evaluate('navigator.clipboard.readText()')) == p07_expected_exhaustive\n\n            page.locator('#promptComputeOverride').select_option('efficient')\n            page.wait_for_timeout(100)\n            p07_expected_efficient = canonical(page.evaluate("""() => {\n              const prompt=PROMPTS.find(p => p.id === 'P07');\n              return PromptKitComputeMode.resolveCopyContent(prompt);\n            }"""))\n            p07_display_efficient = canonical(page.locator('#promptDetail [data-prompt-effective-content="true"]').inner_text())\n            p07_efficient_display_match = p07_display_efficient == p07_expected_efficient\n            p07_modes_differ = p07_expected_exhaustive != p07_expected_efficient\n            page.evaluate("navigator.clipboard.writeText('sentinel-p07-efficient')")\n            page.locator('#promptDetailCopyTop').click()\n            page.wait_for_timeout(100)\n            p07_efficient_copy_match = canonical(page.evaluate('navigator.clipboard.readText()')) == p07_expected_efficient\n            page.locator('#promptComputeOverride').select_option('')\n            page.keyboard.press('Escape')\n            page.wait_for_timeout(50)\n\n'''
          marker = '            screenshot.parent.mkdir(parents=True, exist_ok=True)\n'
          text = browser.read_text(encoding='utf-8')
          if 'p07_exhaustive_display_match' not in text:
              patch_once(browser, marker, p07_block + marker)
          observations = '''            observations.extend([\n                {"id":"p07_effective_exhaustive_identity","event":"P07 Exhaustive detail text and clipboard both equal the compute-resolved effective prompt","occurred":True,"passed":bool(p07_exhaustive_display_match and p07_exhaustive_copy_match)},\n                {"id":"p07_effective_efficient_identity","event":"Changing P07 to Efficient updates the open detail and clipboard to the same newly resolved effective prompt","occurred":True,"passed":bool(p07_efficient_display_match and p07_efficient_copy_match and p07_modes_differ)},\n            ])\n'''
          close_marker = '            context.close()\n'
          text = browser.read_text(encoding='utf-8')
          if 'p07_effective_exhaustive_identity' not in text:
              patch_once(browser, close_marker, observations + close_marker)
          PY
      - name: Run focused regressions and rebuild canonical Prompt Kit
        run: |
          python -m unittest tests.test_p07_effective_prompt_identity tests.test_prompt_kit_compute_mode tests.test_prompt_kit_product_interactions -v
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-compute-mode.js
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit proved repair and remove bootstrap
        run: |
          rm .github/workflows/tmp-p07-effective-identity-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_prompt_kit_registry.py harness/prompt-compilation/semantics/P07.json docs/prompt-kit.js docs/prompt-kit-compute-mode.js tests/test_p07_effective_prompt_identity.py tests/prompt_kit_detail_browser_proof.py web/prompt-kit/index.html .github/workflows/tmp-p07-effective-identity-repair.yml
          git diff --cached --check
          git commit -m 'fix(prompt-kit): preserve P07 effective prompt identity'
          git push origin HEAD:fix/p07-effective-panel-identity-20260917
