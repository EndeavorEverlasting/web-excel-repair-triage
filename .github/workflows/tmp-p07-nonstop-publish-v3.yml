name: Temporary P07 nonstop publisher v3

on:
  push:
    branches:
      - fix/p07-nonstop-publication-20260917

permissions:
  contents: write

jobs:
  publish-p07-v3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: fix/p07-nonstop-publication-20260917
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deterministic floor dependencies
        run: python -m pip install -r requirements-test-floor.txt

      - name: Apply deterministic P07 publication mutation
        run: python scripts/tmp_publish_p07_nonstop.py

      - name: Rebuild canonical Prompt Kit website
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Validate focused P07 and representation seams
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_p07_effective_prompt_identity \
            tests.test_prompt_kit_compute_mode \
            tests.test_prompt_kit_product_interactions \
            tests.test_prompt_kit_mobile -v
          python scripts/prompt_language_compiler.py validate-fixtures --summary
          python scripts/validate_prompt_quality_history.py --summary
          python scripts/build_prompt_kit_registry.py --output /tmp/prompt-kit-index.html
          cmp -s /tmp/prompt-kit-index.html web/prompt-kit/index.html
          git diff --check

      - name: Run deterministic repository floor
        run: python scripts/run_deterministic_test_floor.py --report /tmp/p07-deterministic-floor.json

      - name: Remove temporary publisher surfaces and commit proven candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/tmp-p07-nonstop-publish.yml \
            .github/workflows/tmp-p07-nonstop-publish-v2.yml \
            .github/workflows/tmp-p07-nonstop-publish-v3.yml \
            scripts/tmp_publish_p07_nonstop.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(prompt-kit): make P07 continue to fixed point'
          git push origin HEAD:fix/p07-nonstop-publication-20260917
