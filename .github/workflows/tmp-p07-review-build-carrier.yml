name: Temporary P07 review build carrier

on:
  push:
    branches:
      - fix/local-proof-continuity-20260917
    paths:
      - .github/workflows/tmp-p07-review-build-carrier.yml

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  CI: "true"

jobs:
  build-and-persist-generated-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/local-proof-continuity-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test-floor.txt
      - name: Run canonical repository-local Prompt Kit action
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_repository_action.py \
            --action prompt-kit-build-proof \
            --report Outputs/repository-actions/p07-review-proof.json
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          allowed = {'web/prompt-kit/index.html'}
          extra = sorted(set(changed) - allowed)
          if extra:
              raise SystemExit(f'unexpected tracked build changes: {extra}')
          print('generated-site changes:', changed)
          PY
          git diff --check
      - name: Persist only canonical generated Prompt Kit output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/prompt-kit/index.html; then
            echo 'Generated Prompt Kit already current.'
            exit 0
          fi
          git config user.name "EndeavorEverlasting"
          git config user.email "71802818+EndeavorEverlasting@users.noreply.github.com"
          git add web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "build(prompt-kit): regenerate after P07 convergence review repair"
          git push origin HEAD:fix/local-proof-continuity-20260917
