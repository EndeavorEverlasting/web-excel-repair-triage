name: Temporary P08 compute authority contracts carrier

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: prompt-kit-p08-compute-authority-contracts
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.issue.pull_request && github.event.comment.body == '/apply-p08-compute-authority-contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh exact main floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -f tmp-p08-compute-authority-trigger.txt
          git status --short
          git log --oneline --decorate -5

      - name: Strengthen shared compute authority and contract horizon
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          policy_path = Path('registry/prompts/actionable-next-step-policy.v1.json')
          p08_test_path = Path('tests/test_prompt_registry_expansion_regression_design_teach.py')
          policy_test_path = Path('tests/test_actionable_prompt_registry.py')

          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          suffix_sentence = (
              ' A bounded sprint limits mutation scope, not useful compute volume: when broad compute/iteration authority is granted, '
              'continue safe evidence-reducing passes to a fixed point rather than stopping at the first pass. Before terminal closeout, '
              'emit the end-state contract horizon for the whole requested outcome, including required contracts owned outside the current '
              'slice without treating that visibility as mutation authority.'
          )
          if 'A bounded sprint limits mutation scope, not useful compute volume' not in policy['next_step_suffix']:
              policy['next_step_suffix'] = policy['next_step_suffix'].rstrip() + suffix_sentence

          appendix = policy['copy_content_appendix'].rstrip()
          section = """

COMPUTE AUTHORITY / SCOPE-BOUNDARY CONTRACT
- A bounded sprint limits mutation ownership and blast radius; it does not imply minimal reasoning, one attempt, one test case, or the earliest passing stop.
- When the operator or execution environment grants broad compute/iteration authority, use as much safe available compute as is materially useful inside authorized surfaces: repeated evidence passes, variants, falsification, diagnostics, instrumentation, controlled retries, cross-checks, and independent validation. Prefer useful evidence volume over token-conserving minimalism.
- Treat the first PASS as a checkpoint, not an automatic stop signal. Continue while another practical safe experiment can materially reduce uncertainty, falsify the current conclusion, cover an acceptance condition, or close an evidence gap. Stop at an evidence-backed fixed point or exact blocker, not an arbitrary attempt count.
- Bounded waits/retries mean each wait, retry, mutation, and external action is bounded and observable; they do not impose a one-pass ceiling on the overall investigation.
- Broad compute authority never expands safety or mutation authority: it does not authorize unbounded spend, destructive or personal-data mutation, secret exposure, unrelated feature work, bypassing required approval, monopolizing shared resources, or crossing a forbidden scope.
- If deeper proof requires another canonical owner, invoke or route that owner when safely executable and then return to the current proof/acceptance gate. Routing is not terminal merely because the current bounded slice passed.

END-STATE CONTRACT HORIZON
- Before terminal closeout, identify the contracts that define the whole requested outcome, including contracts whose canonical owner or proof surface sits outside the bounded sprint that just ran. Local scope limits mutation; it does not erase downstream obligations from the completion picture.
- At minimum consider each applicable contract family: implementation/behavior; regression/protected behavior; validation/evidence; integration/default-branch; deployment/environment; live runtime; operator/user acceptance; safety/privacy/data; durability/automation/observability; documentation/runbook/handoff.
- For every applicable contract, report: CONTRACT; canonical OWNER; STATUS as PROVEN, SAFE & EXECUTABLE, BLOCKED, UNPROVEN/UNKNOWN, NOT APPLICABLE, or OUT OF CURRENT SCOPE; strongest EVIDENCE; required NEXT TRANSITION; and the exact ACTION/GATE that closes or advances it.
- The contract horizon is broader than mutation authority. Do not modify unrelated or separately owned surfaces merely because they appear in the horizon, but do not call the whole outcome complete while a required contract remains unproven.
- Distinguish `LOCAL PROMPT CONTRACT CLOSED` from `WHOLE OUTCOME CONTRACT CLOSED`. A local pass may close the current prompt while deployment, runtime, acceptance, durability, or another required contract remains open.
- If a required contract outside the current slice is SAFE & EXECUTABLE now and an authorized canonical owner can advance it, continue into that successor owner instead of stopping at the local pass. If it is blocked, name the exact external/user-only gate and the action that advances it.
- Include a compact `CONTRACT HORIZON` table or equivalent structured block in the final response whenever more than one material completion contract applies.
""".rstrip()
          if 'COMPUTE AUTHORITY / SCOPE-BOUNDARY CONTRACT' not in appendix:
              appendix = appendix + '\n\n' + section
          policy['copy_content_appendix'] = appendix
          policy_path.write_text(json.dumps(policy, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          p08_test = p08_test_path.read_text(encoding='utf-8')
          anchor = '        self.assertIn("After any runtime repair, rerun both paths", p08)\n'
          addition = '''        for phrase in (\n            "COMPUTE AUTHORITY / SCOPE-BOUNDARY CONTRACT",\n            "A bounded sprint limits mutation ownership and blast radius",\n            "Treat the first PASS as a checkpoint, not an automatic stop signal",\n            "END-STATE CONTRACT HORIZON",\n            "The contract horizon is broader than mutation authority",\n            "LOCAL PROMPT CONTRACT CLOSED",\n            "WHOLE OUTCOME CONTRACT CLOSED",\n            "CONTRACT HORIZON",\n        ):\n            self.assertIn(phrase, p08)\n        self.assertIn(\n            "A bounded sprint limits mutation scope, not useful compute volume",\n            self.full["P08"]["nextStep"],\n        )\n'''
          if 'A bounded sprint limits mutation ownership and blast radius' not in p08_test:
              if anchor not in p08_test:
                  raise SystemExit('P08 regression anchor missing')
              p08_test = p08_test.replace(anchor, anchor + addition, 1)
          p08_test_path.write_text(p08_test, encoding='utf-8')

          policy_test = policy_test_path.read_text(encoding='utf-8')
          method_anchor = '    def test_existing_work_and_pr_reuse_is_global_policy(self) -> None:\n'
          new_method = '''    def test_compute_authority_and_end_state_contract_horizon_are_global_policy(self) -> None:\n        appendix = self.policy["copy_content_appendix"]\n        for phrase in (\n            "COMPUTE AUTHORITY / SCOPE-BOUNDARY CONTRACT",\n            "bounded sprint limits mutation ownership and blast radius",\n            "use as much safe available compute as is materially useful",\n            "first PASS as a checkpoint",\n            "Broad compute authority never expands safety or mutation authority",\n            "END-STATE CONTRACT HORIZON",\n            "implementation/behavior",\n            "operator/user acceptance",\n            "durability/automation/observability",\n            "The contract horizon is broader than mutation authority",\n            "LOCAL PROMPT CONTRACT CLOSED",\n            "WHOLE OUTCOME CONTRACT CLOSED",\n            "CONTRACT HORIZON",\n        ):\n            self.assertIn(phrase, appendix)\n\n        self.assertIn(\n            "A bounded sprint limits mutation scope, not useful compute volume",\n            self.policy["next_step_suffix"],\n        )\n        by_id = {prompt["id"]: prompt for prompt in self.prompts}\n        self.assertIn("COMPUTE AUTHORITY / SCOPE-BOUNDARY CONTRACT", by_id["P08"]["copyContent"])\n        self.assertIn("END-STATE CONTRACT HORIZON", by_id["P08"]["copyContent"])\n\n'''
          if 'def test_compute_authority_and_end_state_contract_horizon_are_global_policy' not in policy_test:
              if method_anchor not in policy_test:
                  raise SystemExit('actionability regression insertion anchor missing')
              policy_test = policy_test.replace(method_anchor, new_method + method_anchor, 1)
          policy_test_path.write_text(policy_test, encoding='utf-8')
          PY

      - name: Build and validate pass 1
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_actionable_prompt_registry tests.test_prompt_registry_expansion_regression_design_teach -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Deliberate second-pass falsification
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python - <<'PY'
          from scripts import build_prompt_kit_registry
          prompts = build_prompt_kit_registry.load_prompt_registry()
          by_id = {p['id']: p for p in prompts}
          p08 = by_id['P08']
          content = p08['copyContent']
          required = (
              'COMPUTE AUTHORITY / SCOPE-BOUNDARY CONTRACT',
              'first PASS as a checkpoint',
              'END-STATE CONTRACT HORIZON',
              'The contract horizon is broader than mutation authority',
              'LOCAL PROMPT CONTRACT CLOSED',
              'WHOLE OUTCOME CONTRACT CLOSED',
              'CONTRACT HORIZON',
          )
          missing = [item for item in required if item not in content]
          if missing:
              raise SystemExit(f'P08 effective contract missing: {missing}')
          if 'A bounded sprint limits mutation scope, not useful compute volume' not in p08['nextStep']:
              raise SystemExit('P08 nextStep did not inherit compute-authority continuation rule')
          if content.count('COMPUTE AUTHORITY / SCOPE-BOUNDARY CONTRACT') != 1:
              raise SystemExit('P08 compute-authority contract duplicated')
          if content.count('END-STATE CONTRACT HORIZON') != 1:
              raise SystemExit('P08 contract-horizon section duplicated')
          inherited = [p['id'] for p in prompts if 'END-STATE CONTRACT HORIZON' not in p['copyContent']]
          if inherited:
              raise SystemExit(f'operational prompts missing shared contract horizon: {inherited}')
          print(f'P08 authority/horizon falsification: PASS | operational_prompts={len(prompts)}')
          PY
          python -m unittest tests.test_actionable_prompt_registry tests.test_prompt_registry_expansion_regression_design_teach -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Commit durable change and self-remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-p08-compute-authority-contracts.yml tmp-p08-compute-authority-trigger.txt
          git add \
            registry/prompts/actionable-next-step-policy.v1.json \
            tests/test_actionable_prompt_registry.py \
            tests/test_prompt_registry_expansion_regression_design_teach.py \
            web/prompt-kit/index.html
          git diff --cached --check
          echo '--- staged files ---'
          git diff --cached --name-only
          git commit -m "feat(prompt-kit): expand compute authority and contract horizon"
          git fetch origin main --prune
          git push origin HEAD:main
