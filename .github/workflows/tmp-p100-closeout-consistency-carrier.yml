name: Temporary P100 closeout consistency carrier

on:
  push:
    branches: [main]
    paths:
      - scripts/tmp_apply_p100_closeout_consistency.py

permissions:
  contents: write

concurrency:
  group: p100-closeout-consistency-main
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply, validate, and converge P100 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          git merge --ff-only origin/main
          test -f scripts/tmp_apply_p100_closeout_consistency.py
          python scripts/tmp_apply_p100_closeout_consistency.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_ai_engineering_level_up -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git rm -f .github/workflows/tmp-p100-closeout-consistency-carrier.yml scripts/tmp_apply_p100_closeout_consistency.py
          git add registry/prompts/ai-engineering-level-up-prompts.v1.json tests/test_ai_engineering_level_up.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'fix(prompt-kit): reject contradictory terminal closeouts'
          git push origin HEAD:main
