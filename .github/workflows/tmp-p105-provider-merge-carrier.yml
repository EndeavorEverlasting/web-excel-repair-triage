name: Temporary P105 provider-side merge carrier

on:
  push:
    branches:
      - feat/p105-provider-side-merge-executor-20260828

permissions:
  contents: write

concurrency:
  group: tmp-p105-provider-side-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p105-provider-side-merge-executor-20260828
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strengthen P105, rebuild parity, prove, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/p105-provider-side-merge-executor-20260828 --prune
          git merge --no-edit origin/main
          python scripts/tmp_strengthen_p105_provider_merge.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          python scripts/tmp_strengthen_p105_provider_merge.py
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git rm -f scripts/tmp_strengthen_p105_provider_merge.py .github/workflows/tmp-p105-provider-merge-carrier.yml
          git add registry/prompts/spec-architecture-prompts.v1.json tests/test_spec_architecture_prompt_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'feat(prompt-kit): automate provider-side merge convergence'
          git push origin HEAD:feat/p105-provider-side-merge-executor-20260828
