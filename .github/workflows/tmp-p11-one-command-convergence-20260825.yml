name: Temporary P11 one-command convergence

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  converge:
    if: github.event.pull_request.head.ref == 'feat/p11-one-command-harness-proof-20260825'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p11-one-command-harness-proof-20260825
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and reconcile current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --all --prune --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            set +e
            git merge --no-edit origin/main
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicts" = "web/prompt-kit/index.html" ]; then
                git checkout --ours web/prompt-kit/index.html
                git add web/prompt-kit/index.html
                git commit --no-edit
              else
                echo "unexpected merge conflicts:" >&2
                printf '%s\n' "$conflicts" >&2
                exit 1
              fi
            fi
          fi
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Prove one-command synthetic harness contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_app_harness.py tests/test_app_harness_validator.py
          python -m unittest tests.test_app_harness_validator -v
          python scripts/validate_app_harness.py --output Outputs/app-harness-validation.json
          python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Falsify boundary, self-clean, and push exact head
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import validate_app_harness as v

          root=Path.cwd()
          report=v.validate(root, runner=lambda command, root: __import__('subprocess').CompletedProcess(command,0,('test-branch\n' if tuple(command)==('git','branch','--show-current') else ('a'*40+'\n' if tuple(command)==('git','rev-parse','HEAD') else 'PASS\n')),''), env={})
          workflow=(root/'.github/workflows/app-harness-validation.yml').read_text(encoding='utf-8')
          tests=(root/'tests/test_app_harness_validator.py').read_text(encoding='utf-8')
          checks={
            'offline proof level': report['proof_level']=='offline_synthetic' and report['runtime_proof'] is False,
            'expected matrix': report['summary']=={'passed':5,'skipped':1,'failed':0},
            'optional MCP honest skip': report['skipped_checks']==[{'id':'optional_mcp_symbol_smoke','requirement':'OPTIONAL','reason':'lsp_project_not_loaded'}],
            'required skip fails closed': v.final_status([v.Check('r','required','REQUIRED','SKIP','missing',[])])=='FAIL',
            'canonical command once in CI': workflow.count(v.CANONICAL_COMMAND)==1,
            'CI does not absorb browser lane': 'playwright' not in workflow.lower() and 'start-process' not in workflow.lower() and 'curl ' not in workflow,
            'tests reject runtime mutation': all(token in tests for token in ('["python", "app.py"]','["curl", "https://example.invalid"]','["git", "push"]','["playwright", "test"]')),
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit(f'P11 falsification failed: {failed}')
          print(json.dumps({'pass_two':'bounded fixed point', **checks}, indent=2))
          PY
          git rm -f .github/workflows/tmp-p11-one-command-convergence-20260825.yml
          git add \
            .githooks/pre-push \
            .github/workflows/app-harness-validation.yml \
            ARTIFACT_REGISTRY.md \
            docs/prompts.json \
            harness/artifacts.v1.json \
            harness/manifest.v1.json \
            harness/reports/APP_HARNESS_VALIDATION.md \
            harness/validators.v1.json \
            scripts/validate_app_harness.py \
            scripts/validate_harness.py \
            tests/test_app_harness_validator.py \
            web/prompt-kit/index.html
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat(harness): converge P11 one-command synthetic proof'
          fi
          git fetch origin main --prune
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo 'main moved after P11 proof; refusing stale push' >&2
            exit 1
          fi
          git push origin HEAD:feat/p11-one-command-harness-proof-20260825
          echo "PROVEN_HEAD=$(git rev-parse HEAD)"
