name: Temporary P114 Canary network strengthener

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: p114-canary-network-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  strengthen:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/p114-canary-network-20260826'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact staged candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin main --prune
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          git status --short

      - name: Strengthen P114 with required network posture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          registry_path = Path('registry/prompts/spec-architecture-prompts.v1.json')
          payload = json.loads(registry_path.read_text(encoding='utf-8'))
          matches = [p for p in payload['prompts'] if p.get('id') == 'P114' and p.get('name') == 'Conversation Context Canary & Handoff Guard']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one P114 Canary owner, found {len(matches)}')
          p = matches[0]
          p['sprintRole'] = (
              'Keep a tiny per-response computer-profile and required-network signal visible during ordinary AI work '
              'so context drift or network-posture substitution is caught early, recoverable drift is re-anchored once, '
              'and repeated degradation produces a clean fresh-chat handoff before useful workflow state is lost'
          )
          p['useWhen'] = (
              'A long-running AI conversation depends on a stable computer profile, required network posture, or execution identity '
              'and the operator wants a lightweight visible signal on every response that can reveal context drift before the chat becomes unreliable.'
          )
          p['inspectFirst'] = (
              "The current conversation's explicitly established computer profile, required network posture, and active execution identity; "
              'use the exact network labels WAB, Guest, Hardwire, Local, or Arbitrary/N/A when established; when repository work is active, '
              'the canonical profile/path/network owner plus current repo, branch, lane, and task evidence; the latest proven artifacts or handoff state; '
              'and any accessible prior context needed to recover those facts without asking the operator to repeat them.'
          )
          p['expectedOutput'] = (
              'One compact Canary line before every response, anchored to the canonical computer profile and the network the user should be on, '
              'with only the smallest already-established execution fields that matter; exact WAB/Guest/Hardwire/Local/Arbitrary/N/A network labeling; '
              'fail-closed UNKNOWN handling instead of invented identity or network requirements; one bounded re-anchor attempt on drift; '
              'and a compact continuity handoff when drift repeats or core execution identity can no longer be recovered reliably.'
          )
          p['nextStep'] = (
              "Keep doing the user's substantive work while both PROFILE and NETWORK remain semantically correct; on the first material mismatch recover "
              'the authoritative profile, required network, and current task from accessible evidence, and on repeated or unrecoverable drift emit the '
              'continuity handoff that lets the operator open a fresh conversation with the same proven floor.'
          )
          p['proofGate'] = (
              'Representative multi-response sequences keep the Canary compact and semantically stable; WAB, Guest, Hardwire, Local, and Arbitrary/N/A '
              'are preserved as exact required-network labels; Arbitrary/N/A is never used to hide an unknown requirement; a seeded omission or wrong '
              'profile/network is detected and recoverable from authoritative context; unknown identity or network requirement is never fabricated; '
              'stylistic variation is not falsely treated as context exhaustion; explicit validation order covers stable baseline, recovery, legitimate change, '
              'repeated drift, then unrecoverable state; repeated drift crosses the handoff threshold; and the handoff preserves the current task, proof floor, '
              'forbidden scope, required network, and first executable continuation without duplicating full closeout or context-factoring owners.'
          )
          p['copyContent'] = r'''RUN A LIGHTWEIGHT CONVERSATION CANARY THROUGHOUT THE CHAT. DO NOT TURN IT INTO A SECOND TASK REPORT, A GIANT HEADER, OR A TOKEN COUNTER.

CANARY ANCHOR
Computer profile: xyz_profile_or_resolve_from_accessible_context
Required network: xyz_WAB_Guest_Hardwire_Local_Arbitrary_NA_or_resolve_from_accessible_context
Repository, branch, and lane: include only when they are already established and materially affect the current work.

MISSION
Make silent context drift visible early enough to preserve workflow continuity. The computer profile and the network the user should be on are the primary repeated canary because they are small, operationally meaningful, and easy for the operator to notice when an agent begins forgetting or substituting context. Keep the signal lighter than the work it protects.

MANDATORY FIRST LINE
Before every response, emit one compact first line:
`CANARY | PROFILE=<canonical computer profile> | NETWORK=<WAB|Guest|Hardwire|Local|Arbitrary/N/A>`
When repository identity materially affects the response and those values are already established, the line may append only the useful fields:
` | REPO=<repo> | BRANCH=<branch> | LANE=<lane>`
Do not expand the normal Canary into scope narration, a status report, a checklist, or a recap. The substantive answer begins immediately after it.

REQUIRED NETWORK SEMANTICS
`NETWORK` means the network the user should be on for the current task; it is not, by itself, a claim that the agent has observed the user's live connection. Use these exact established labels: `WAB`, `Guest`, `Hardwire`, `Local`, or `Arbitrary/N/A`.
- `Arbitrary/N/A` means the task has no specific network requirement or the network is intentionally irrelevant. It must never be used as a synonym for unknown.
- If the task is network-sensitive and the required posture cannot be recovered, emit `NETWORK=UNKNOWN` and execute the re-anchor procedure.
- If live/current network evidence is actually available and it conflicts with the required posture, keep the Canary's required `NETWORK` value truthful and surface the mismatch in the substantive response; do not silently redefine the requirement to match the observed connection.
- Do not invent SSIDs, VPNs, domains, credentials, trust state, or technical meaning behind these labels. Existing operator/repository network authority defines what the labels mean; the Canary only carries the smallest required label.

AUTHORITATIVE PROFILE + NETWORK RULE
Use the strongest accessible current evidence for the computer profile and required network: explicit current-chat state, repository-owned profile/path/network contracts, active harness state, or a current handoff. Prefer current evidence over remembered model context. Never invent a machine, profile, network requirement, path, repo, branch, or lane merely to keep the Canary populated. If the computer profile cannot be recovered, emit `PROFILE=UNKNOWN`; if a relevant required network cannot be recovered, emit `NETWORK=UNKNOWN`; then execute the re-anchor procedure. Do not ask the operator to repeat recoverable context.

CANARY IS A SENSOR, NOT PROOF
A wrong or missing canary is a drift signal, not mathematical proof that the context window is exhausted. Do not claim a token count, context percentage, remaining-window estimate, or observed live network unless the runtime actually exposes authoritative telemetry. Do not treat harmless wording changes as drift when the semantic computer profile, required network, and active task identity remain correct. Stronger drift evidence includes a wrong or omitted profile, a wrong required network, misuse of `Arbitrary/N/A` to hide uncertainty, contradiction of established repo/branch/lane facts, forgetting current mission or forbidden scope, reintroducing closed decisions, or repeatedly losing the last proven state.

NORMAL LOOP
1. Emit the one-line Canary before every response.
2. Perform the actual requested work normally.
3. Keep PROFILE and NETWORK semantically stable and compact; optional repo/branch/lane fields appear only when they help detect a material execution-context error.
4. Refresh the Canary from newer authoritative evidence when the machine/profile, required network, or execution lane legitimately changes. A legitimate change is not drift when current evidence explains it.

RE-ANCHOR ONCE
On the first material Canary mismatch, omission, contradiction, `PROFILE=UNKNOWN`, or network-sensitive `NETWORK=UNKNOWN`:
- stop adding new scope while identity or required network is uncertain;
- recover the canonical computer profile, required network, and current task from accessible chat, repository, harness, artifact, or handoff evidence;
- correct the Canary explicitly;
- verify the current mission, last proven state, required network, and next action still agree with that evidence;
- continue the requested work when the re-anchor succeeds.
Do not force a new conversation for one recoverable slip. Do not make the operator serve as a context courier when the evidence is accessible to the agent.

HANDOFF ON REPEATED OR UNRECOVERABLE DRIFT
Cross the handoff threshold when the Canary fails again after a re-anchor, the canonical profile or required network remains unrecoverable, or multiple core execution facts continue contradicting established evidence. At that point, stop expanding the current conversation's work and emit a compact continuity packet containing:
- canonical computer profile or explicit UNKNOWN blocker;
- required network (`WAB`, `Guest`, `Hardwire`, `Local`, `Arbitrary/N/A`) or explicit UNKNOWN blocker;
- repo, branch, PR, lane, and scope only when active;
- current mission and forbidden scope;
- last proven artifacts, SHAs, checks, or other evidence;
- unresolved gap or blocker;
- the first executable next action.
Then state that the operator should continue with that packet in a fresh conversation. Do not pretend that the agent can terminate the current chat or open the next one itself. For a fresh-chat continuation that must recover a previous conversation and resume active implementation, use P02; this Canary owns continuity detection and the smallest viable handoff, while P02 owns the resumed execution.

ONE CANONICAL CONTRACT, LIGHTWEIGHT EMBEDDING
Maintain this prompt as the full Canary owner. Other prompts and normal chats should embed only the lightweight stub when continuous context monitoring is useful; do not paste this entire contract into every prompt. Recommended embedded form:
`CANARY STUB — Before every response emit CANARY | PROFILE=<canonical computer profile> | NETWORK=<WAB|Guest|Hardwire|Local|Arbitrary/N/A>. NETWORK is the required posture, not observed connectivity. Never invent either value: use PROFILE=UNKNOWN and/or NETWORK=UNKNOWN and re-anchor from accessible evidence. Repeated or unrecoverable profile/network/context drift => emit a compact fresh-chat handoff.`
The host prompt still owns its mission, scope, proof, and closure. The Canary stub owns only the repeated identity/network signal and drift-to-handoff transition. This keeps the mechanism portable without multiplying authorities or consuming the context it is meant to protect.

BOUNDARIES WITH NEIGHBOR OWNERS
- P02 owns previous-chat recovery and active sprint execution after a new chat starts. Use it to consume a Canary handoff and resume implementation; do not duplicate its execution doctrine here.
- P76 owns repository spec/harness progressive disclosure and context-budget reduction. Use it when the problem is repository information architecture rather than a drifting live conversation.
- Repository machine/profile/path/network contracts remain authoritative for what the computer profile and required network actually are; this Canary observes those facts and must not create a competing profile or network registry.

FAIL-CLOSED RULES
- Never fabricate the profile or silently substitute a different machine.
- Never fabricate a required network or use `Arbitrary/N/A` merely because the requirement was forgotten.
- Never claim the Canary observed live connectivity unless authoritative runtime evidence exists.
- Never infer context exhaustion from style alone.
- Never bloat every response with a full sprint declaration just to prove the Canary is alive.
- Never keep working through repeated identity/network contradictions merely because the answer still sounds plausible.
- Never let the continuity packet claim proof that the current chat did not actually establish.
- Never duplicate P02 or P76 inside the Canary.

SEMANTIC FALSIFICATION — VALIDATION ORDER
Exercise the Canary in this order so later cases depend on the earlier recovery behavior rather than isolated phrase presence:
1. STABLE BASELINE — keep the same correct profile and required network across several responses; harmless wording variation must not count as drift.
2. RECOVERY CASE — seed one omission, one wrong profile, and one wrong required-network label; recover from authoritative accessible context once and restore the correct Canary.
3. LEGITIMATE CHANGE — change the profile or required network only when newer authoritative evidence establishes the change; the updated Canary must be accepted without a false drift alarm.
4. REPEATED DRIFT — after a successful re-anchor, seed another material profile/network/context contradiction; cross the handoff threshold and emit the compact continuity packet.
5. UNRECOVERABLE STATE — make the canonical profile or a relevant required network unrecoverable; emit `UNKNOWN` for only the unresolved field and produce the compact fresh-chat handoff instead of inventing a value.
The expected terminal behavior is ordinary continuation for stable, recovered, and evidence-backed legitimate-change cases, and a compact fresh-chat handoff for repeated or unrecoverable drift.

DELIVER
Keep the normal Canary to one line. When a handoff is required, keep it small but evidence-bearing: profile, required network, active execution identity, mission, proven floor, gap, forbidden scope, and first executable continuation. The purpose is to preserve momentum, not to make every response heavier.'''
          for keyword in ('required network', 'network canary', 'WAB', 'Guest', 'Hardwire', 'Local', 'Arbitrary/N/A'):
              if keyword not in p['keywords']:
                  p['keywords'].append(keyword)
          registry_path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Strengthen focused semantic regression
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_conversation_context_canary_prompt.py <<'PY'
          from __future__ import annotations

          import json
          import unittest
          from pathlib import Path

          from scripts import build_prompt_kit_registry


          REPO_ROOT = Path(__file__).resolve().parents[1]
          RAW_REGISTRY = REPO_ROOT / "registry" / "prompts" / "spec-architecture-prompts.v1.json"
          TEST_FLOOR = REPO_ROOT / "harness" / "test-floor.v1.json"
          TARGET_NAME = "Conversation Context Canary & Handoff Guard"
          TEST_PATH = "tests/test_conversation_context_canary_prompt.py"


          class ConversationContextCanaryPromptTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.full = build_prompt_kit_registry.load_prompt_kit_registry()
                  cls.by_id = {prompt["id"]: prompt for prompt in cls.full}
                  matches = [prompt for prompt in cls.full if prompt.get("name") == TARGET_NAME]
                  if len(matches) != 1:
                      raise AssertionError(f"expected one {TARGET_NAME!r}, found {len(matches)}")
                  cls.target = matches[0]
                  raw_prompts = json.loads(RAW_REGISTRY.read_text(encoding="utf-8"))["prompts"]
                  raw_matches = [prompt for prompt in raw_prompts if prompt.get("name") == TARGET_NAME]
                  if len(raw_matches) != 1:
                      raise AssertionError(f"expected one raw {TARGET_NAME!r}, found {len(raw_matches)}")
                  cls.raw = raw_matches[0]

              def test_helper_owns_identity_and_profile(self) -> None:
                  self.assertRegex(self.target["id"], r"^P\d+$")
                  self.assertEqual(self.target["seq"], self.target["id"][1:])
                  self.assertEqual(self.target["copySheet"], f"{self.target['id']}_COPY_SAFE")
                  self.assertEqual(self.target["profile"], "spec-architecture")
                  self.assertEqual(self.target["class"], "CONTEXT / CONTINUITY")
                  self.assertEqual(self.raw["id"], self.target["id"])
                  self.assertEqual(self.target["id"], "P114")

              def test_canary_requires_profile_and_required_network_every_response(self) -> None:
                  content = self.target["copyContent"]
                  for phrase in (
                      "MANDATORY FIRST LINE",
                      "Before every response, emit one compact first line",
                      "CANARY | PROFILE=<canonical computer profile> | NETWORK=<WAB|Guest|Hardwire|Local|Arbitrary/N/A>",
                      "Do not expand the normal Canary into scope narration",
                      "Keep the normal Canary to one line",
                  ):
                      self.assertIn(phrase, content)
                  for network in ("WAB", "Guest", "Hardwire", "Local", "Arbitrary/N/A"):
                      self.assertIn(network, content)

              def test_network_semantics_are_required_posture_not_observed_connectivity(self) -> None:
                  content = self.target["copyContent"]
                  for phrase in (
                      "REQUIRED NETWORK SEMANTICS",
                      "network the user should be on for the current task",
                      "not, by itself, a claim that the agent has observed the user's live connection",
                      "Arbitrary/N/A` means the task has no specific network requirement",
                      "It must never be used as a synonym for unknown",
                      "NETWORK=UNKNOWN",
                      "do not silently redefine the requirement to match the observed connection",
                  ):
                      self.assertIn(phrase, content)

              def test_unknown_profile_or_network_fails_closed_and_reanchors_from_evidence(self) -> None:
                  content = self.target["copyContent"]
                  for phrase in (
                      "PROFILE=UNKNOWN",
                      "NETWORK=UNKNOWN",
                      "Never invent a machine, profile, network requirement, path, repo, branch, or lane",
                      "RE-ANCHOR ONCE",
                      "Do not ask the operator to repeat recoverable context",
                  ):
                      self.assertIn(phrase, content)

              def test_canary_is_signal_not_fake_context_or_network_telemetry(self) -> None:
                  content = self.target["copyContent"]
                  self.assertIn("CANARY IS A SENSOR, NOT PROOF", content)
                  self.assertIn("not mathematical proof that the context window is exhausted", content)
                  self.assertIn("Do not claim a token count, context percentage, remaining-window estimate, or observed live network", content)
                  self.assertIn("Do not treat harmless wording changes as drift", content)

              def test_repeated_drift_crosses_to_evidence_bearing_handoff(self) -> None:
                  content = self.target["copyContent"]
                  for phrase in (
                      "HANDOFF ON REPEATED OR UNRECOVERABLE DRIFT",
                      "fails again after a re-anchor",
                      "required network (`WAB`, `Guest`, `Hardwire`, `Local`, `Arbitrary/N/A`) or explicit UNKNOWN blocker",
                      "current mission and forbidden scope",
                      "last proven artifacts, SHAs, checks, or other evidence",
                      "first executable next action",
                      "Do not pretend that the agent can terminate the current chat or open the next one itself",
                  ):
                      self.assertIn(phrase, content)

              def test_one_canonical_contract_exports_only_a_lightweight_stub(self) -> None:
                  content = self.target["copyContent"]
                  self.assertIn("ONE CANONICAL CONTRACT, LIGHTWEIGHT EMBEDDING", content)
                  self.assertIn("do not paste this entire contract into every prompt", content)
                  self.assertIn(
                      "CANARY STUB — Before every response emit CANARY | PROFILE=<canonical computer profile> | NETWORK=<WAB|Guest|Hardwire|Local|Arbitrary/N/A>",
                      content,
                  )
                  self.assertIn("NETWORK is the required posture, not observed connectivity", content)
                  self.assertIn("The host prompt still owns its mission, scope, proof, and closure", content)

              def test_neighbor_owners_remain_distinct(self) -> None:
                  self.assertEqual(
                      self.by_id["P02"]["name"],
                      "Previous Chat → Active Sprint Executor",
                  )
                  self.assertEqual(
                      self.by_id["P76"]["name"],
                      "Progressive-Disclosure Spec & Harness Factorer",
                  )
                  self.assertNotEqual(self.target["id"], "P02")
                  self.assertNotEqual(self.target["id"], "P76")
                  self.assertIn("P02 owns previous-chat recovery and active sprint execution", self.target["copyContent"])
                  self.assertIn("P76 owns repository spec/harness progressive disclosure", self.target["copyContent"])
                  self.assertIn("must not create a competing profile or network registry", self.target["copyContent"])

              def test_semantic_falsification_has_explicit_validation_order(self) -> None:
                  content = self.target["copyContent"]
                  ordered = (
                      "1. STABLE BASELINE",
                      "2. RECOVERY CASE",
                      "3. LEGITIMATE CHANGE",
                      "4. REPEATED DRIFT",
                      "5. UNRECOVERABLE STATE",
                  )
                  positions = [content.index(marker) for marker in ordered]
                  self.assertEqual(positions, sorted(positions))
                  for phrase in (
                      "one wrong required-network label",
                      "change the profile or required network only when newer authoritative evidence establishes the change",
                      "after a successful re-anchor, seed another material profile/network/context contradiction",
                      "make the canonical profile or a relevant required network unrecoverable",
                  ):
                      self.assertIn(phrase, content)

              def test_registered_in_deterministic_test_floor(self) -> None:
                  floor = json.loads(TEST_FLOOR.read_text(encoding="utf-8"))
                  self.assertEqual(floor["self_tests"].count(TEST_PATH), 1)
                  self.assertIn("tests/test_*_prompt.py", floor["prompt_semantic_test_globs"])

              def test_generated_site_is_exact_and_contains_canary(self) -> None:
                  html = build_prompt_kit_registry.DEFAULT_OUTPUT.read_text(encoding="utf-8")
                  self.assertEqual(html, build_prompt_kit_registry.render())
                  self.assertIn(self.target["id"], html)
                  self.assertIn(TARGET_NAME, html)
                  self.assertIn("NETWORK=&lt;WAB|Guest|Hardwire|Local|Arbitrary/N/A&gt;", html)


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Build and validate pass 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_conversation_context_canary_prompt -v
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Whole-context pass 2 and semantic falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('registry/prompts/spec-architecture-prompts.v1.json').read_text(encoding='utf-8'))
          p = next(x for x in data['prompts'] if x.get('id') == 'P114')
          c = p['copyContent']
          checks = {
              'exact network vocabulary': all(x in c for x in ('WAB', 'Guest', 'Hardwire', 'Local', 'Arbitrary/N/A')),
              'unknown distinct from n/a': 'It must never be used as a synonym for unknown' in c and 'NETWORK=UNKNOWN' in c,
              'required vs observed': 'network the user should be on for the current task' in c and 'observed live network' in c,
              'lightweight stub': 'CANARY STUB — Before every response emit CANARY | PROFILE=<canonical computer profile> | NETWORK=<WAB|Guest|Hardwire|Local|Arbitrary/N/A>' in c,
              'ordered falsification': all(x in c for x in ('1. STABLE BASELINE', '2. RECOVERY CASE', '3. LEGITIMATE CHANGE', '4. REPEATED DRIFT', '5. UNRECOVERABLE STATE')),
              'neighbor boundary': 'must not create a competing profile or network registry' in c,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'P114 pass-2 semantic falsification failed: {failed}')
          positions = [c.index(x) for x in ('1. STABLE BASELINE', '2. RECOVERY CASE', '3. LEGITIMATE CHANGE', '4. REPEATED DRIFT', '5. UNRECOVERABLE STATE')]
          if positions != sorted(positions):
              raise SystemExit('P114 validation order is not monotonic')
          PY
          python -m unittest tests.test_conversation_context_canary_prompt -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Commit durable P114 contribution and push branch
        shell: bash
        run: |
          set -euo pipefail
          git add registry/prompts/spec-architecture-prompts.v1.json tests/test_conversation_context_canary_prompt.py web/prompt-kit/index.html
          git diff --cached --check
          echo '--- durable staged files ---'
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "feat(prompt-kit): add network posture to P114 canary"
          git push origin HEAD:feat/p114-canary-network-20260826
