name: Temporary P114 cloud artifact pairing carrier

on:
  push:
    branches:
      - feat/p114-cloud-artifact-pairing-20260924

permissions:
  contents: write

concurrency:
  group: p114-cloud-artifact-pairing
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p114-cloud-artifact-pairing-20260924
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Adopt, strengthen, validate, and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main feat/p114-cloud-artifact-pairing-20260924 --prune
          git merge --no-edit origin/main

          python scripts/tmp_apply_p114_cloud_artifact_pairing.py

          python -m unittest             tests.test_conversation_context_canary_prompt             tests.test_google_drive_handoff_prompt_strengthening             tests.test_repository_drive_artifact_synchronizer_prompt             tests.test_prompt_semantic_coverage             tests.test_prompt_semantic_validator_1b             tests.test_spec_architecture_prompt_registry             tests.test_skill_prompt_registry -v

          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
          python scripts/run_local_required_checks.py --report Outputs/local-required-checks-receipt.json
          git diff --check

          # Deliberate second pass after the first green result.
          python -m unittest tests.test_conversation_context_canary_prompt -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          git rm -f             scripts/tmp_apply_p114_cloud_artifact_pairing.py             .github/workflows/tmp-p114-cloud-artifact-pairing.yml

          git add             registry/prompts/spec-architecture-prompts.v1.json             harness/prompt-topology/prompt-capability-profiles.v1.json             harness/prompt-topology/prompt-capability-migrations.v1.json             harness/prompt-compilation/prompt-semantic-migrations.v1.json             tests/test_conversation_context_canary_prompt.py             web/prompt-kit/index.html

          git diff --cached --check
          git diff --cached --stat
          git status --short
          git commit -m "feat(prompt-kit): pair Canary local and cloud artifacts"
          git push origin HEAD:feat/p114-cloud-artifact-pairing-20260924
