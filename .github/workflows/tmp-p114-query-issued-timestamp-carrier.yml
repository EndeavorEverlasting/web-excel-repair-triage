name: Temporary P114 query-issued timestamp carrier

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: p114-query-issued-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/p114-query-issued-timestamp-20260910' && github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile, strengthen P114, and prove durable candidate
        shell: bash
        env:
          EXPECTED_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVENT_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/p114-query-issued-timestamp-20260910 --prune
          test "$(git rev-parse origin/feat/p114-query-issued-timestamp-20260910)" = "$EXPECTED_EVENT_HEAD"
          git merge --no-edit origin/main

          # PASS 1 — implement on the refreshed current-main floor.
          python -m py_compile scripts/tmp_apply_p114_query_issued_timestamp.py
          python scripts/tmp_apply_p114_query_issued_timestamp.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_conversation_context_canary_prompt -v
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery -v
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output /tmp/p114-query-issued-order-navigation.json --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          # PASS 2 — temporal falsification plus preservation of prior P114 semantics.
          python scripts/tmp_apply_p114_query_issued_timestamp.py --verify-only
          python -m unittest tests.test_conversation_context_canary_prompt -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output /tmp/p114-query-issued-order-navigation-pass2.json --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          # Self-remove transport. The resulting branch diff versus refreshed main must contain only durable Prompt Kit surfaces.
          git rm -f scripts/tmp_apply_p114_query_issued_timestamp.py .github/workflows/tmp-p114-query-issued-timestamp-carrier.yml scripts/tmp_p114_query_issued_timestamp_trigger.txt
          git add registry/prompts/spec-architecture-prompts.v1.json tests/test_conversation_context_canary_prompt.py web/prompt-kit/index.html
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected_staged=(
            .github/workflows/tmp-p114-query-issued-timestamp-carrier.yml
            registry/prompts/spec-architecture-prompts.v1.json
            scripts/tmp_apply_p114_query_issued_timestamp.py
            scripts/tmp_p114_query_issued_timestamp_trigger.txt
            tests/test_conversation_context_canary_prompt.py
            web/prompt-kit/index.html
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_staged[@]}" | sort)
          test "$(printf '%s\n' "${staged[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          git diff --cached --check
          git commit -m 'feat(prompt-kit): timestamp P114 query issuance'

          mapfile -t durable < <(git diff --name-only origin/main...HEAD | sort)
          expected_durable=(
            registry/prompts/spec-architecture-prompts.v1.json
            tests/test_conversation_context_canary_prompt.py
            web/prompt-kit/index.html
          )
          mapfile -t durable_expected_sorted < <(printf '%s\n' "${expected_durable[@]}" | sort)
          if [[ "$(printf '%s\n' "${durable[@]}")" != "$(printf '%s\n' "${durable_expected_sorted[@]}")" ]]; then
            printf 'Unexpected durable PR surface(s):\n%s\n' "${durable[*]}" >&2
            exit 1
          fi
          git status --short

      - name: Push exact durable candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch https://github.com/${GITHUB_REPOSITORY}.git feat/p114-query-issued-timestamp-20260910
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_EVENT_HEAD"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feat/p114-query-issued-timestamp-20260910
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
