name: Temporary P123 domain-agnostic ledger strengthening

on:
  push:
    branches:
      - feat/p123-domain-agnostic-knowledge-ledger-20260903

permissions:
  contents: write

concurrency:
  group: tmp-p123-domain-agnostic-ledger
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p123-domain-agnostic-knowledge-ledger-20260903
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Strengthen P123 and validate
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/p123-domain-agnostic-knowledge-ledger-20260903 --prune
          test "$(git branch --show-current)" = "feat/p123-domain-agnostic-knowledge-ledger-20260903"
          git merge-base --is-ancestor 4a0df32a38dc49c04ab3fec4424f9c3aee8d895e HEAD

          if [ ! -f tmp/apply_p123_domain_agnostic_ledger.py ]; then
            echo 'P123 strengthening carrier already consumed.'
            exit 0
          fi

          python tmp/apply_p123_domain_agnostic_ledger.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

          python -m py_compile tests/test_gemini_youtube_playlist_ingestion_prompt.py
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_gemini_youtube_playlist_ingestion_prompt -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_harness.py
          git diff --check

          python - <<'PY'
          import json
          from pathlib import Path
          p = next(x for x in json.loads(Path('registry/prompts/ai-engineering-level-up-prompts.v1.json').read_text())['prompts'] if x['id'] == 'P123')
          c = p['copyContent']
          assert len(c) <= 12000, len(c)
          assert 'Examples prove range, not defaults' in c
          assert 'recent conversation themes' in c
          assert '`Sources`, `Findings`, and `Domains`' in c
          assert 'favored-domain views are projections, not separate data authorities' in c
          assert 'never pretend the spreadsheet was updated' in c
          assert 'Cybersecurity; Agentic Software Development; Culinary & Food' in c
          print(f"SECOND_PASS_FIXED_POINT P123_COPY_LENGTH={len(c)} domain_bias_guard=PASS ledger_ownership=PASS")
          PY

          git add \
            registry/prompts/ai-engineering-level-up-prompts.v1.json \
            tests/test_gemini_youtube_playlist_ingestion_prompt.py \
            web/prompt-kit/index.html
          git rm tmp/apply_p123_domain_agnostic_ledger.py
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): generalize P123 knowledge extraction'
          git push origin HEAD:feat/p123-domain-agnostic-knowledge-ledger-20260903
