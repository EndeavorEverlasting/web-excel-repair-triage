name: Temporary P123 preceding YouTube source hardening

on:
  push:
    branches:
      - feat/p123-preceding-youtube-source-20260831

permissions:
  contents: write

concurrency:
  group: tmp-p123-preceding-youtube-source
  cancel-in-progress: false

jobs:
  execute:
    if: github.ref == 'refs/heads/feat/p123-preceding-youtube-source-20260831'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p123-preceding-youtube-source-20260831
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strengthen P123, regenerate, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/p123-preceding-youtube-source-20260831 --prune
          test "$(git branch --show-current)" = "feat/p123-preceding-youtube-source-20260831"
          git merge-base --is-ancestor 9e76ca44969ad7b475fb6f07c45757f08f32302c HEAD

          if [ ! -f tmp/apply_p123_preceding_youtube_source.py ]; then
            echo 'P123 carrier already consumed.'
            exit 0
          fi

          python tmp/apply_p123_preceding_youtube_source.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

          python -m py_compile tests/test_gemini_youtube_playlist_ingestion_prompt.py
          python -m unittest tests.test_gemini_youtube_playlist_ingestion_prompt -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          python - <<'PY'
          from scripts import build_prompt_kit_registry
          prompts = {p['id']: p for p in build_prompt_kit_registry.load_prompt_kit_registry()}
          p = prompts['P123']
          assert p['name'] == 'Gemini YouTube Video / Playlist Ingestion Builder'
          assert 'SOURCE INPUT RESOLUTION' in p['copyContent']
          assert 'immediately above this prompt' in p['copyContent']
          assert 'bind it as `SOURCE_INPUT` automatically' in p['copyContent']
          assert 'yt-dlp owns machine-readable YouTube metadata extraction' in p['copyContent']
          assert 'single video is valid input' in p['copyContent']
          assert len(p['copyContent']) <= 12000
          print(f"P123_PRECEDING_SOURCE_FIXED_POINT prompts={len(prompts)} copy_chars={len(p['copyContent'])}")
          PY

          git add \
            registry/prompts/ai-engineering-level-up-prompts.v1.json \
            tests/test_gemini_youtube_playlist_ingestion_prompt.py \
            web/prompt-kit/index.html
          git rm tmp/apply_p123_preceding_youtube_source.py
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): let P123 consume preceding YouTube source'
          git push origin HEAD:feat/p123-preceding-youtube-source-20260831
