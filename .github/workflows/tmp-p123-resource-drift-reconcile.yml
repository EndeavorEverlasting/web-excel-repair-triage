name: Temporary P123 external resource drift reconcile

on:
  push:
    branches:
      - feat/p123-domain-agnostic-knowledge-ledger-20260903

permissions:
  contents: write

concurrency:
  group: tmp-p123-resource-drift-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p123-domain-agnostic-knowledge-ledger-20260903
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Refresh canonical donor projection and prove it
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/p123-domain-agnostic-knowledge-ledger-20260903 --prune
          test "$(git branch --show-current)" = "feat/p123-domain-agnostic-knowledge-ledger-20260903"

          python scripts/sync_operant_external_resources.py \
            --output web/prompt-kit/resources.v1.json \
            --gaps-output registry/resources/operant-external-resource-gaps.v1.json
          node --check docs/prompt-kit-external-resources.js
          python scripts/validate_operant_external_resources.py --summary
          python -m unittest tests.test_operant_external_resources -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          git add web/prompt-kit/resources.v1.json registry/resources/operant-external-resource-gaps.v1.json
          if git diff --cached --quiet; then
            echo 'No donor projection drift remains.'
            exit 0
          fi
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'chore(operant): refresh external resource donor floor'
          git push origin HEAD:feat/p123-domain-agnostic-knowledge-ledger-20260903
