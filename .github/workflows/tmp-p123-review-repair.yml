name: Temporary P123 review repair

on:
  push:
    branches:
      - feat/p123-domain-agnostic-knowledge-ledger-20260903

permissions:
  contents: write

concurrency:
  group: tmp-p123-review-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p123-domain-agnostic-knowledge-ledger-20260903
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply review repairs and validate
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/p123-domain-agnostic-knowledge-ledger-20260903 --prune
          test "$(git branch --show-current)" = "feat/p123-domain-agnostic-knowledge-ledger-20260903"

          if [ ! -f tmp/apply_p123_review_repairs.py ]; then
            echo 'Review repair carrier already consumed.'
            exit 0
          fi

          python tmp/apply_p123_review_repairs.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_gemini_youtube_playlist_ingestion_prompt -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_operant_external_resources.py --summary
          python scripts/validate_harness.py
          git diff --check

          python - <<'PY'
          import json
          from pathlib import Path
          p = next(x for x in json.loads(Path('registry/prompts/ai-engineering-level-up-prompts.v1.json').read_text())['prompts'] if x['id'] == 'P123')
          c = p['copyContent']
          site = Path('web/prompt-kit/index.html').read_text()
          assert len(c) <= 12000, len(c)
          for marker in (
              'Resolve spreadsheet write capability + authority',
              'exact written ranges/IDs as the mutation receipt',
              'Otherwise emit row-ready Source and Findings records',
          ):
              assert marker in c
              assert marker in site
          print(f"P123_REVIEW_FIXED_POINT length={len(c)} write_receipt=PASS generated_surface=PASS")
          PY

          git add \
            registry/prompts/ai-engineering-level-up-prompts.v1.json \
            tests/test_gemini_youtube_playlist_ingestion_prompt.py \
            web/prompt-kit/index.html
          git rm tmp/apply_p123_review_repairs.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(prompt-kit): bind P123 ledger writes and site proof'
          git push origin HEAD:feat/p123-domain-agnostic-knowledge-ledger-20260903
