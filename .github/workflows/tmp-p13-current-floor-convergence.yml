name: TEMP P13 current-floor convergence

on:
  push:
    branches:
      - fix/p13-owner-displacement-20260914

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p13-owner-displacement-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure merge identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Refresh floor and prove required isolation slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor 017f78369f22e13a54f5992c683c30b1b6013a9f origin/main
          git show origin/main:registry/prompts/actionable-next-step-policy.v1.json | grep -F 'ISOLATED WRITER / CONVERGENCE CONTRACT' >/dev/null
          git show origin/main:tests/test_isolated_writer_convergence_policy.py >/dev/null
      - name: Merge refreshed main without destroying branch work
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git merge --no-edit origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf 'Conflicts:\n%s\n' "$conflicts"
            if [ -z "$conflicts" ]; then
              echo "Merge failed without unresolved paths; fail closed."
              exit "$rc"
            fi
            unexpected="$(printf '%s\n' "$conflicts" | grep -v '^web/prompt-kit/index.html$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected source conflict; fail closed."
              exit 2
            fi
            git checkout --ours web/prompt-kit/index.html
            git add web/prompt-kit/index.html
            git commit --no-edit
          fi
      - name: Remove stale carriers and regenerate canonical Prompt Kit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-p13-displacement-proof-hardening.yml
          rm -f .github/workflows/tmp-p13-current-floor-convergence.yml
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate focused and inherited contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_p13_owner_displacement -v
          python -m unittest tests.test_skill_prompt_registry -v
          python -m unittest tests.test_remote_freshness_p13_iteration -v
          python -m unittest tests.test_actionable_prompt_registry tests.test_isolated_writer_convergence_policy -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
          git diff --check
      - name: Commit converged branch and self-remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No durable changes after convergence.'
          else
            git commit -m 'fix(prompt-kit): converge P13 owner displacement onto current floor'
          fi
          git push origin HEAD:fix/p13-owner-displacement-20260914
