name: TEMP P13 displacement-proof hardening

on:
  push:
    branches:
      - fix/p13-owner-displacement-20260914

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p13-owner-displacement-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current floor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "0fc1e9c43dba779461a06b56162df882eab880d4"
          git merge-base --is-ancestor origin/main HEAD
          test "$(git status --porcelain)" = ""
      - name: Require evidence before owner displacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('registry/prompts/prompt-overrides.v1.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          p13 = next(item for item in payload['overrides'] if item['id'] == 'P13')

          old = '''- After each material refresh and before an overlapping write, resolve the canonical owner; newer overlapping work/ownership is a state transition.\n- If it supersedes this lane, mark `SUPERSEDED WRITER` and stop competing writes. Do not rebase, spawn sidecars, or keep mutating because authority remains.\n- Hand off branch/PR/SHA, reusable findings/tests, passed/failed proof, and unsafe work in the existing PR/ledger/handoff; retire the stale integration vehicle when authorized.\n- Rejoin the surviving owner at its first unproven gate. Exhaustive compute/full authority apply there, never as permission for a superseded writer to continue.\n'''
          new = '''- After each material refresh and before overlapping writes, resolve current owner. Newer overlap/claims are collision evidence, not displacement proof.\n- `SUPERSEDED WRITER` requires necessary replacement slices on refreshed default branch and material under owning validators; otherwise retain/reconcile this writer and serialize.\n- Once proven, stop competing writes; do not rebase/spawn sidecars because authority remains. Hand off branch/PR/SHA, reusable findings/tests, passed/failed proof, unsafe work in existing PR/ledger/handoff; retire stale vehicle when authorized.\n- Rejoin surviving owner at first unproven gate. Exhaustive compute/full authority applies there, never to a superseded writer.\n'''
          if p13['copyContent'].count(old) != 1:
              raise SystemExit('expected exactly one prior owner-displacement block')
          p13['copyContent'] = p13['copyContent'].replace(old, new, 1)
          p13['sprintRole'] = p13['sprintRole'].replace(
              'When refreshed truth establishes a newer overlapping canonical owner, retire the stale writer, preserve reusable evidence, and continue through the surviving owner instead of competing with it.',
              'When refreshed truth proves an overlapping replacement displaced this lane, retire the stale writer, preserve reusable evidence, and continue through the surviving owner instead of competing with it.'
          )
          p13['nextStep'] = p13['nextStep'].replace(
              'when a newer overlapping owner supersedes the lane, stop competing writes, hand off reusable evidence, and resume at the first unproven gate in the surviving owner.',
              'when replacement evidence proves supersession, stop competing writes, hand off reusable evidence, and resume at the first unproven gate in the surviving owner.'
          )
          p13['proofGate'] = p13['proofGate'].replace(
              'Owner displacement is proven convergent: no superseded writer continues mutation, reusable findings are preserved in an actionable handoff, and execution resumes from the refreshed canonical owner when safe work remains.',
              'Owner displacement requires replacement slices on refreshed default branch plus owning-validator materiality; then no superseded writer continues mutation, reusable findings are preserved in an actionable handoff, and execution resumes from the refreshed canonical owner when safe work remains.'
          )
          if len(p13['copyContent']) >= 18000:
              raise SystemExit(f"P13 copyContent too large: {len(p13['copyContent'])}")
          print(f"P13 copyContent chars={len(p13['copyContent'])}")
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test = Path('tests/test_p13_owner_displacement.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              '"Do not rebase, spawn sidecars",\n            "because authority remains",',
              '"do not rebase/spawn sidecars",\n            "because authority remains",'
          )
          text = text.replace(
              'self.assertIn("newer overlapping work/ownership is a state transition", copy)\n        self.assertIn("If it supersedes this lane", copy)\n        self.assertIn("Rejoin the surviving owner", copy)',
              'self.assertIn("Newer overlap/claims are collision evidence, not displacement proof", copy)\n        self.assertIn("necessary replacement slices on refreshed default branch", copy)\n        self.assertIn("material under owning validators", copy)\n        self.assertIn("otherwise retain/reconcile this writer", copy)\n        self.assertIn("Rejoin surviving owner", copy)'
          )
          test.write_text(text, encoding='utf-8')
          PY
      - name: Rebuild canonical Prompt Kit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate focused and owning contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_p13_owner_displacement -v
          python -m unittest tests.test_skill_prompt_registry -v
          python -m unittest tests.test_remote_freshness_p13_iteration -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/evaluate_prompt_language.py --summary
          git diff --check
      - name: Commit durable repair and self-remove adapter
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-p13-displacement-proof-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/prompts/prompt-overrides.v1.json tests/test_p13_owner_displacement.py web/prompt-kit/index.html .github/workflows/tmp-p13-displacement-proof-hardening.yml
          git diff --cached --check
          git commit -m 'fix(prompt-kit): require proof before P13 owner displacement'
          git push origin HEAD:fix/p13-owner-displacement-20260914
