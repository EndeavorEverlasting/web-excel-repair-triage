name: TEMP P13 floor reconciliation

on:
  push:
    branches:
      - fix/p13-owner-displacement-20260914

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p13-owner-displacement-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile exact refreshed main floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "accfc10c9a7ff64e056e57df912f5098d1c0cf11"
          git merge --no-ff --no-edit origin/main

      - name: Validate P13 and effective exhaustive-compute contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_p13_owner_displacement -v
          python -m unittest tests.test_skill_prompt_registry -v
          python -m unittest tests.test_remote_freshness_p13_iteration -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/evaluate_prompt_language.py --summary
          git diff --check origin/main...HEAD

      - name: Self-remove adapter and push reconciled candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-p13-floor-reconcile.yml
          git add -A
          git diff --cached --check
          git commit -m 'chore(prompt-kit): finish latest P13 floor reconciliation'
          git push origin HEAD:fix/p13-owner-displacement-20260914
