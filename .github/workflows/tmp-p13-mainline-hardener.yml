name: Temporary P13 mainline hardener

on:
  push:
    branches:
      - feat/p13-mainline-convergence-20260822

permissions:
  contents: write

jobs:
  harden-p13:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p13-mainline-convergence-20260822
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh and reconcile current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --all --prune --tags
          echo "REMOTE_MAIN_BEFORE=$(git rev-parse origin/main)"
          git merge --no-edit origin/main
          echo "FEATURE_AFTER_RECONCILE=$(git rev-parse HEAD)"

      - name: Harden canonical P13
        run: python .prompt-contrib/harden_p13_mainline.py

      - name: Build canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Focused semantic and donor-boundary proof
        run: |
          python -m unittest \
            tests.test_prompt_kit_mainline_delivery \
            tests.test_remote_freshness_p13_iteration \
            tests.test_green_branch_integration_policy \
            tests.test_agentic_loop_prompts \
            -v

      - name: Registry and generated-site proof
        run: |
          python scripts/prompt_registry_ops.py validate
          python -m unittest \
            tests.test_skill_prompt_registry \
            tests.test_spec_architecture_prompt_registry \
            tests.test_repository_work_ledger_prompt \
            -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py \
            --require-implementation \
            --output "$RUNNER_TEMP/prompt-kit-order-navigation-audit.json" \
            --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/evaluate_prompt_language.py
          git diff --check

      - name: Deliberate second-pass critique
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('registry/prompts/prompt-overrides.v1.json').read_text(encoding='utf-8'))
          p13 = next(item for item in payload['overrides'] if item['id'] == 'P13')
          copy = p13['copyContent']
          required = (
              'P13 CONTINUOUS MAINLINE CONVERGENCE',
              'merge the exact validated owned head into the current default branch',
              'Do not stop merely because one bounded slice merged',
              'deliberate second pass',
          )
          missing = [item for item in required if item not in copy]
          if missing:
              raise SystemExit(f'second-pass missing semantics: {missing}')
          forbidden = ('factuality hallucination', 'faithfulness hallucination', 'dumb zone')
          leaked = [item for item in forbidden if item in copy.lower()]
          if leaked:
              raise SystemExit(f'P13 absorbed unrelated hallucination-role doctrine: {leaked}')
          if len(copy) >= 18000:
              raise SystemExit(f'P13 copyContent exceeds anti-bloat ceiling: {len(copy)}')
          print(f'SECOND_PASS_P13_COPY_SIZE={len(copy)}')
          print('SECOND_PASS=PASS')
          PY
          git diff -- registry/prompts/prompt-overrides.v1.json tests/test_prompt_kit_mainline_delivery.py | sed -n '1,260p'

      - name: Remove transport and revalidate durable result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .prompt-contrib/harden_p13_mainline.py .github/workflows/tmp-p13-mainline-hardener.yml
          python -m unittest tests.test_prompt_kit_mainline_delivery tests.test_remote_freshness_p13_iteration -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          changed="$(git diff --name-only origin/main...HEAD; git diff --name-only)"
          printf '%s\n' "$changed" | sort -u

      - name: Commit and push durable hardening
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No durable P13 changes to commit' >&2
            exit 1
          fi
          git commit -m 'feat(prompt-kit): force P13 through mainline convergence'
          git push origin HEAD:feat/p13-mainline-convergence-20260822
          echo "DURABLE_HEAD=$(git rev-parse HEAD)"
