name: Temporary trusted P139 artifact promoter

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: read

concurrency:
  group: trusted-p139-artifact-promoter
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.issue.pull_request && github.event.issue.number == 399 && github.event.comment.body == '/promote-p139-cd5886'
    runs-on: ubuntu-latest
    env:
      FEATURE_BRANCH: feat/repository-ssh-setup-usage-prompt-20260909
      EXPECTED_FEATURE_HEAD: cd5886a37a36716e5f73f2e00b26da1fccf50a25
      PROVEN_MAIN_FLOOR: 1c7fb72e98541344642576ba165baf8a8e8029b1
      SOURCE_RUN_ID: '34551475061'
      ARTIFACT_NAME: p139-current-main-cd5886a37a36716e5f73f2e00b26da1fccf50a25
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact feature head without executing it
        uses: actions/checkout@v7
        with:
          ref: ${{ env.FEATURE_BRANCH }}
          path: candidate
          fetch-depth: 0
      - name: Verify provenance and artifact digest manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_FEATURE_HEAD"
          git -C trusted merge-base --is-ancestor "$PROVEN_MAIN_FLOOR" HEAD
          mkdir -p staging
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir staging
          test -s staging/Outputs/sha256.txt
          (cd staging && sha256sum -c Outputs/sha256.txt)
      - name: Revalidate exact candidate using trusted main code
        shell: bash
        run: |
          set -euo pipefail
          cp staging/registry/prompts/ai-engineering-level-up-prompts.v1.json trusted/registry/prompts/
          cp staging/tests/test_repository_ssh_setup_prompt.py trusted/tests/
          cp staging/web/prompt-kit/index.html trusted/web/prompt-kit/
          cd trusted
          python -m unittest tests.test_repository_ssh_setup_prompt -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Materialize only durable P139 surfaces
        shell: bash
        run: |
          set -euo pipefail
          cp staging/registry/prompts/ai-engineering-level-up-prompts.v1.json candidate/registry/prompts/
          cp staging/tests/test_repository_ssh_setup_prompt.py candidate/tests/
          cp staging/web/prompt-kit/index.html candidate/web/prompt-kit/
          rm -f candidate/.github/workflows/tmp-p139-current-main-builder.yml
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_FEATURE_HEAD"
          git -C candidate diff --check
          changed="$(git -C candidate status --short | sed -E 's/^.. //')"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sort)" = "$(printf '%s\n' \
            .github/workflows/tmp-p139-current-main-builder.yml \
            web/prompt-kit/index.html | sort)"
          git -C candidate config user.name 'github-actions[bot]'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate add -A
          git -C candidate diff --cached --check
          git -C candidate commit -m 'build(prompt-kit): materialize P139 on current main'
          git -C candidate push origin HEAD:"$FEATURE_BRANCH"
