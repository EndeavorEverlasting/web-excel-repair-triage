name: Temporary P19 direct deployment guidance carrier

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: p19-direct-deployment-guidance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/p19-direct-deployment-guidance-20260909'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p19-direct-deployment-guidance-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile, strengthen P19/P13, validate, and push durable candidate
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main fix/p19-direct-deployment-guidance-20260909 --prune

          if [ ! -f scripts/tmp_apply_p19_direct_deployment_guidance.py ]; then
            echo 'P19 deployment guidance already materialized; no transport work remains'
            exit 0
          fi

          git merge --no-edit origin/main

          echo '--- external prior-art catalog search (reference only; no ADD planned) ---'
          python scripts/search_operant_external_catalog.py \
            --source prompts-chat \
            --query 'deployment deploy install operator interface buttons relative location direct entry point' \
            --limit 5 \
            --summary

          echo '--- implementation ---'
          python scripts/tmp_apply_p19_direct_deployment_guidance.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

          echo '--- focused proof ---'
          python -m unittest \
            tests.test_prompt_kit_mainline_delivery.PromptKitMainlineDeliveryTests.test_p19_gives_direct_operator_deployment_guidance_without_hunting \
            tests.test_prompt_kit_mainline_delivery.PromptKitMainlineDeliveryTests.test_p13_routes_specialized_failures_without_absorbing_their_doctrine \
            -v

          echo '--- owning Prompt Kit proof ---'
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_order_navigation_contract -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          echo '--- deliberate pass 2 / fixed-point proof ---'
          python scripts/tmp_apply_p19_direct_deployment_guidance.py --verify-only
          python -m unittest \
            tests.test_prompt_kit_mainline_delivery.PromptKitMainlineDeliveryTests.test_p19_gives_direct_operator_deployment_guidance_without_hunting \
            tests.test_prompt_kit_mainline_delivery.PromptKitMainlineDeliveryTests.test_p13_routes_specialized_failures_without_absorbing_their_doctrine \
            -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          git rm -f scripts/tmp_apply_p19_direct_deployment_guidance.py
          git add registry/prompts/prompt-overrides.v1.json tests/test_prompt_kit_mainline_delivery.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'feat(prompt-kit): harden P19 direct deployment guidance'
          git push origin HEAD:fix/p19-direct-deployment-guidance-20260909
