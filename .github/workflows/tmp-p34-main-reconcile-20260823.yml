name: Temporary P34 Main Reconcile

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-p34-main-reconcile-20260823.yml

permissions:
  contents: write

jobs:
  reconcile-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p34-terminal-evidence-survival-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh and reconcile main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --all --prune --tags
          if ! git merge --no-edit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "web/prompt-kit/index.html"
            git checkout --ours web/prompt-kit/index.html
            git add web/prompt-kit/index.html
            git commit --no-edit
          fi
      - name: Rebuild and validate combined Prompt Kit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_actionable_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/evaluate_prompt_language.py --summary
          git diff --check
      - name: Commit generated reconciliation and push
        shell: bash
        run: |
          set -euo pipefail
          git add web/prompt-kit/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore(prompt-kit): rebuild P34 on current main'
          fi
          git push origin HEAD:fix/p34-terminal-evidence-survival-20260823
