name: Temporary P34 Terminal Survival Hardening

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-p34-terminal-survival-20260823.yml
      - scripts/tmp_harden_p34_terminal_survival_20260823.py

concurrency:
  group: p34-terminal-survival-20260823
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harden-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p34-terminal-evidence-survival-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded P34 hardening
        run: python scripts/tmp_harden_p34_terminal_survival_20260823.py
      - name: Rebuild canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Focused semantic proof
        run: python -m unittest tests.test_actionable_prompt_registry -v
      - name: Registry and generated-site proof
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/evaluate_prompt_language.py --summary
          git diff --check
      - name: Commit durable hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/tmp_harden_p34_terminal_survival_20260823.py
          git add docs/prompts.json tests/test_actionable_prompt_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'fix(prompt-kit): preserve terminal evidence in P34'
          git push origin HEAD:fix/p34-terminal-evidence-survival-20260823
