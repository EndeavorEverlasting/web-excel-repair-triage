name: Temporary P55 context-grounded repository bootstrap carrier

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: p55-context-grounded-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/p55-context-grounded-repo-bootstrap-20260907'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p55-context-grounded-repo-bootstrap-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strengthen P55, prove semantics, and push durable candidate
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f scripts/tmp_apply_p55_context_grounded_bootstrap.py ]; then
            echo 'P55 context-grounded repair already materialized; no transport work remains'
            exit 0
          fi
          python scripts/tmp_apply_p55_context_grounded_bootstrap.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_prompt_registry_expansion_regression_design_teach -v
          python -m unittest tests.test_prompt_kit_discovery tests.test_skill_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git rm -f scripts/tmp_apply_p55_context_grounded_bootstrap.py scripts/tmp_p55_context_grounded_bootstrap_trigger.txt .github/workflows/tmp-p55-context-grounded-bootstrap-carrier.yml
          git add docs/prompts.json tests/test_prompt_registry_expansion_regression_design_teach.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'feat(prompt-kit): make P55 context-grounded repo creation'
          python -m unittest tests.test_prompt_registry_expansion_regression_design_teach -v
          python -m unittest tests.test_prompt_kit_discovery tests.test_skill_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/p55-context-grounded-repo-bootstrap-20260907
