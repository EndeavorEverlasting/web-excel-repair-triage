name: Temporary P55 current-main reconcile

on:
  push:
    branches:
      - feat/p55-provider-neutral-repo-bootstrap-20260920
    paths:
      - '.github/p55-current-main-reconcile-trigger'

permissions:
  contents: write

concurrency:
  group: p55-current-main-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p55-provider-neutral-repo-bootstrap-20260920
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Configure carrier commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Rebuild and validate reconciled Prompt Kit
        run: python scripts/tmp_p55_current_main_reconcile.py
