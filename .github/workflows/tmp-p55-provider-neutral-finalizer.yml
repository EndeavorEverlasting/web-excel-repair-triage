name: Temporary P55 provider-neutral repository bootstrap finalizer

on:
  push:
    branches:
      - feat/p55-provider-neutral-repo-bootstrap-20260920
    paths:
      - '.github/p55-provider-neutral-trigger'

permissions:
  contents: write

concurrency:
  group: p55-provider-neutral-repo-bootstrap
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/p55-provider-neutral-repo-bootstrap-20260920
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Configure carrier commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run canonical P55 lifecycle finalizer
        run: python scripts/tmp_p55_provider_neutral_finalizer.py
