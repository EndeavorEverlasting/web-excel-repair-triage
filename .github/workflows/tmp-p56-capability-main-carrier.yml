name: Temporary P56 capability-bounded main carrier

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: prompt-kit-p56-capability-bounded-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.event.issue.pull_request && github.event.issue.number == 315 && github.event.comment.body == '/build-p56-capability-boundary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p56-capability-bounded-artifact-synthesis-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh branch and apply canonical P56 transform
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/p56-capability-bounded-artifact-synthesis-20260826 --prune
          test "$(git branch --show-current)" = 'feat/p56-capability-bounded-artifact-synthesis-20260826'
          python scripts/tmp_p56_builder.py
      - name: Rebuild and focused proof
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_context_to_artifact_prompt -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Whole-chat second-pass semantic falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path('docs/prompts.json').read_text(encoding='utf-8'))
          p56 = next(p for p in base if p['id'] == 'P56')
          text = p56['copyContent']
          required = [
              'REPO_CAPABLE', 'DOSSIER_ONLY', 'ARTIFACT_ONLY',
              'SUPPLIED_CONTEXT', 'PROPOSED', 'UNKNOWN_REQUIRES_REPO_INSPECTION',
              'PROPOSED LOCATION — REQUIRES REPO-CAPABLE AGENT TO VERIFY',
              'DOSSIER-ONLY REPOSITORY-CAPABLE HANDOFF',
              'P101', 'P100',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'P56 second-pass missing: {missing}')
          for project_specific in ('StudySyndicate', 'yt-dlp', 'YouTube playlist'):
              if project_specific in text:
                  raise SystemExit(f'P56 leaked invocation-specific content: {project_specific}')
          ext = json.loads(Path('registry/prompts/ai-engineering-level-up-prompts.v1.json').read_text(encoding='utf-8'))['prompts']
          p100 = next(p for p in ext if p['id'] == 'P100')
          p101 = next(p for p in ext if p['id'] == 'P101')
          if p100['name'] != 'Factuality vs Faithfulness Hallucination Diagnoser':
              raise SystemExit('P100 identity drifted')
          if p101['name'] != 'Grounded Agent Output & Tool-Call Gate':
              raise SystemExit('P101 identity drifted')
          site = Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          for marker in required[:7]:
              if marker not in site:
                  raise SystemExit(f'generated site missing {marker}')
          print('P56 second-pass semantic falsification PASS')
          PY
          python -m unittest tests.test_context_to_artifact_prompt -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit durable branch and self-remove branch transport
        shell: bash
        env:
          BRANCH: feat/p56-capability-bounded-artifact-synthesis-20260826
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/prompt-kit-web.yml
          rm -f .github/workflows/tmp-p56-capability-bounded-builder.yml scripts/tmp_p56_builder.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prompts.json tests/test_context_to_artifact_prompt.py web/prompt-kit/index.html .github/workflows/prompt-kit-web.yml .github/workflows/tmp-p56-capability-bounded-builder.yml scripts/tmp_p56_builder.py
          git diff --cached --check
          git commit -m 'feat(prompt-kit): bound P56 by available capabilities'
          git push origin "HEAD:${BRANCH}"
