name: Temporary P65 granular prompt-finder repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tmp-p65-verifier-routing-repair.yml

permissions:
  contents: write

concurrency:
  group: prompt-kit-p65-granular-finder-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feat/p65-granular-grill-routing-20260825'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p65-granular-grill-routing-20260825
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh and reconcile current main floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --prune --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          echo "MAIN_FLOOR=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git status --short

      - name: Execute P65 granular finder contribution and proof
        shell: bash
        run: |
          set -euo pipefail
          python .prompt-contrib/execute_p65_granular.py

      - name: Remove transport and commit durable contribution
        shell: bash
        run: |
          set -euo pipefail
          rm .prompt-contrib/execute_p65_granular.py
          rm .github/workflows/tmp-p65-verifier-routing-repair.yml
          git add registry/prompts/tutorial-discovery-prompts.v1.json \
                  tests/test_prompt_kit_discovery.py \
                  web/prompt-kit/index.html \
                  .prompt-contrib/execute_p65_granular.py \
                  .github/workflows/tmp-p65-verifier-routing-repair.yml
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/tmp-p65-verifier-routing-repair.yml|.prompt-contrib/execute_p65_granular.py|registry/prompts/tutorial-discovery-prompts.v1.json|tests/test_prompt_kit_discovery.py|web/prompt-kit/index.html)$' || true)"
          test -z "$unexpected"
          git commit -m 'feat(prompt-kit): make P65 a granular adaptive finder'

      - name: Refresh final floor and rerun exact-head proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune --tags
          test "$MAIN_FLOOR" = "$(git rev-parse origin/main)"
          python -m unittest tests.test_prompt_kit_discovery.PromptKitDiscoveryTests.test_guided_finder_granularly_resolves_need_and_prompt_behavior -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          test -z "$(git status --porcelain)"
          echo "VALIDATED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Push exact validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/p65-granular-grill-routing-candidate-20260825
          echo "validated_head=$VALIDATED_HEAD"
          echo "validated_main_floor=$MAIN_FLOOR"
