name: Temporary P65 legacy marker repair carrier

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/tmp-p65-verifier-routing-repair.yml

permissions:
  contents: write

concurrency:
  group: prompt-kit-p65-legacy-marker-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/p65-granular-legacy-marker-trigger-20260825'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p65-granular-grill-routing-candidate-20260825
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconcile candidate to exact current main floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --prune --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          echo "MAIN_FLOOR=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git status --short

      - name: Restore exact legacy marker and rebuild
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('registry/prompts/tutorial-discovery-prompts.v1.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          p65 = next(p for p in payload['prompts'] if p['id'] == 'P65')
          old = (
              'Use the AI Harness Prompt Kit prompt IDs and names below as the recommendation vocabulary. Run an adaptive, granular routing '
              'interview: ask one concise question at a time, wait for my answer, and choose the next question from the unresolved decision '
              'tree instead of marching through a fixed script.'
          )
          new = (
              'Use the AI Harness Prompt Kit prompt IDs and names below as the recommendation vocabulary. Run an adaptive, granular routing '
              'interview. Ask one concise question at a time, wait for my answer, and choose the next question from the unresolved decision '
              'tree instead of marching through a fixed script.'
          )
          if new not in p65['copyContent']:
              if old not in p65['copyContent']:
                  raise SystemExit('P65 adaptive intro repair anchor missing')
              p65['copyContent'] = p65['copyContent'].replace(old, new, 1)
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Prove old and new P65 contracts together
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_skill_prompt_registry.SkillPromptRegistryTests.test_guided_prompt_finder_is_bounded_and_registry_aware -v
          python -m unittest tests.test_skill_prompt_registry -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python -m unittest tests.test_prompt_kit_discovery.PromptKitDiscoveryTests.test_guided_finder_granularly_resolves_need_and_prompt_behavior -v
          python -m unittest tests.test_prompt_kit_discovery -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Remove all P65 transport and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-p65-verifier-routing-repair.yml
          rm -f .github/workflows/tmp-p65-legacy-marker-repair.yml
          git add registry/prompts/tutorial-discovery-prompts.v1.json \
                  web/prompt-kit/index.html \
                  .github/workflows/tmp-p65-verifier-routing-repair.yml \
                  .github/workflows/tmp-p65-legacy-marker-repair.yml
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/tmp-p65-verifier-routing-repair.yml|.github/workflows/tmp-p65-legacy-marker-repair.yml|registry/prompts/tutorial-discovery-prompts.v1.json|web/prompt-kit/index.html)$' || true)"
          test -z "$unexpected"
          git commit -m 'fix(prompt-kit): preserve P65 concise-question marker'

      - name: Refresh exact-head proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune --tags
          test "$MAIN_FLOOR" = "$(git rev-parse origin/main)"
          python -m unittest tests.test_skill_prompt_registry.SkillPromptRegistryTests.test_guided_prompt_finder_is_bounded_and_registry_aware -v
          python -m unittest tests.test_prompt_kit_discovery.PromptKitDiscoveryTests.test_guided_finder_granularly_resolves_need_and_prompt_behavior -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          test -z "$(git status --porcelain)"
          echo "VALIDATED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Push exact validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/p65-granular-grill-routing-candidate-20260825
          echo "validated_head=$VALIDATED_HEAD"
          echo "validated_main_floor=$MAIN_FLOOR"
