name: Temporary P68 mainline hardener v2

on:
  push:
    branches: [main]
    paths:
      - .prompt-contrib/p68-mainline-executor-trigger.txt

permissions:
  contents: write

concurrency:
  group: prompt-kit-p68-mainline-hardener-v2
  cancel-in-progress: false

jobs:
  harden:
    if: contains(github.event.head_commit.message, 'trigger P68 mainline hardener')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh current floor and print applicability matrix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --all --prune --tags
          git pull --ff-only origin main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cat <<'EOF'
          principle | owner | presence | P68 gap | decision | source action | proof
          bounded repeated progress loop | Continuous Agentic Repo Loop Runner + P07/P83 | ABSENT raw | one-pass context cleanup | COMPATIBLE | add P68 context-convergence loop | focused P68 assertions
          deliberate second pass / bounded fixed point | P13/P83 | ABSENT raw | first green candidate can terminate | COMPATIBLE | compact second-pass/fixed-point semantics | focused P68 assertions
          mainline convergence | shared green-branch policy + P07/P13 | EFFECTIVE only | raw direct consumer remains weak | COMPATIBLE | small P68-specific landing invariant, no copied global boilerplate | raw/effective boundary test
          freshness/stale proof | shared actionability policy | EFFECTIVE | already inherited | NOT NEEDED | NO CHANGE | effective marker remains
          50k/30k/15k spec factoring | P76 | ABSENT | different repository-spec owner | INCOMPATIBLE | NO CHANGE | negative assertions
          prior-agent claim verification | P83 | ABSENT | different trigger/role | NOT NEEDED | NO CHANGE | negative assertion
          hallucination diagnosis/grounding | P100/P101 | adjacent | P68 owns context load/selection only | NOT NEEDED | NO CHANGE | attention-saturation semantics retained
          EOF

      - name: Patch canonical P68 and closest focused regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('registry/prompts/ai-engineering-level-up-prompts.v1.json')
          payload = json.loads(registry_path.read_text(encoding='utf-8'))
          p68 = next(item for item in payload['prompts'] if item['id'] == 'P68')
          expected = {
              'id':'P68','seq':'68','name':'Context Engineering System Refactorer',
              'type':'BUILD + FACTOR','class':'AI ENGINEERING / CONTEXT','color':'Purple',
              'copySheet':'P68_COPY_SAFE','category':'standard','profile':'ai-engineering',
          }
          actual = {key:p68[key] for key in expected}
          if actual != expected:
              raise SystemExit(f'P68 identity/profile drift: {actual!r}')
          before = p68['copyContent']
          before_len = len(before)
          if 'CONTINUOUS CONTEXT-CONVERGENCE LOOP' in before:
              raise SystemExit('P68 convergence section already present; refuse duplicate hardening')
          if 'RECOVER FROM ATTENTION SATURATION / THE DUMB ZONE' not in before:
              raise SystemExit('P68 attention-saturation identity semantics missing')

          p68['sprintRole'] = 'Refactor the model context system through repeated measured context-selection passes until a bounded fixed point, preserving task quality and converging the exact validated owned changes onto the current default branch when authorized'
          p68['expectedOutput'] = 'A context map and budget, measured baseline, deterministic routing/pruning changes, tests for context selection and precedence, repeated before/after context-quality evidence through a deliberate second pass, reduced unnecessary context load with preserved task quality, and the exact validated owned change integrated into and verified on the current default branch when authorized. When attention saturation is observed, include a provenance-preserving compaction or fresh-session handoff and prove critical constraints survive it.'
          p68['nextStep'] = 'Repeat REFRESH -> MEASURE -> SELECT HIGHEST-IMPACT CONTEXT DEFECT -> REFACTOR -> VALIDATE -> CRITIQUE -> INTEGRATE -> REMEASURE -> CONTINUE until a bounded fixed point or exact external/user-only blocker; integrate independently green owned slices when authorized and do not stop at the first green candidate, open PR, or merged slice.'
          p68['proofGate'] = 'Every loaded context source has a purpose and owner; deterministic routing replaces default prompt bloat where practical; precedence is explicit; measured context reduction preserves required behavior; and no hidden context dependency is claimed away without tests. If required truth is already present but ignored, the first repair reduces/reprioritizes context rather than adding more; compaction must preserve authoritative constraints and provenance. Completion additionally requires repeated measured refactor/validate/critique passes through a deliberate second pass, no practical in-scope context-system improvement remaining at the bounded fixed point, and the exact validated owned head integrated into and verified on the current default branch when authorized; a branch, PR, or green CI result alone is insufficient completion.'

          anchor = '\n\n6. DELIVER MEASURED IMPROVEMENT\n'
          if anchor not in before:
              raise SystemExit('P68 delivery anchor missing')
          section = '''

6. CONTINUOUS CONTEXT-CONVERGENCE LOOP
Run context engineering as a bounded evidence loop, not a one-pass cleanup:
REFRESH -> MEASURE -> SELECT HIGHEST-IMPACT CONTEXT DEFECT -> REFACTOR -> VALIDATE -> CRITIQUE -> INTEGRATE -> REMEASURE -> CONTINUE
- A pass counts only when it removes or reroutes a measured context defect, closes a quality/precedence failure, produces decision-changing evidence, or integrates a validated owned slice. Re-reading the same telemetry, branch status, or PR is not progress.
- After the first green candidate, perform a deliberate second pass over remaining context load, stale/duplicated authority, selection failures, representative task quality, and the exact diff. Repair practical in-scope misses and rerun affected proof.
- Integrate independently green context slices when authorized rather than stranding them while broader refactoring remains. A branch, worktree, commit, push, open PR, review-ready state, or green CI is intermediate evidence.
- When the exact validated owned head is mergeable and the repository's shared integration gates permit, merge it into the current default branch in the same run, refresh that branch, and verify the context-system changes and owning validation are present there.
- Continue from refreshed default-branch truth when another safe bounded context defect remains. Do not stop merely because one context slice is green or one bounded slice merged.
- Stop only at the bounded fixed point: measured context-load/quality criteria are satisfied, the deliberate second pass finds no practical in-scope improvement, authorized integration is complete and verified, and no safe executable continuation remains. Otherwise continue or prove the exact blocker and the action that advances it.

7. DELIVER MEASURED IMPROVEMENT
'''
          p68['copyContent'] = before.replace(anchor, section, 1)
          after_len = len(p68['copyContent'])
          if after_len >= 7000 or after_len - before_len > 2500:
              raise SystemExit(f'P68 anti-bloat gate failed: before={before_len} after={after_len} delta={after_len-before_len}')
          registry_path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test_path = Path('tests/test_ai_engineering_level_up.py')
          text = test_path.read_text(encoding='utf-8')
          if 'test_p68_repeats_context_refactor_until_fixed_point_and_mainline' in text:
              raise SystemExit('P68 hardening regression already present')
          anchor_test = '    def test_prompt_finder_and_search_route_the_five_tracks(self) -> None:\n'
          if anchor_test not in text:
              raise SystemExit('P68 test insertion anchor missing')
          method = '''    def test_p68_repeats_context_refactor_until_fixed_point_and_mainline(self) -> None:
        raw = json.loads((ROOT / "registry/prompts/ai-engineering-level-up-prompts.v1.json").read_text(encoding="utf-8"))
        source = next(item for item in raw["prompts"] if item["id"] == "P68")
        effective = {item["id"]: item for item in build_prompt_kit_registry.load_prompt_registry()}["P68"]
        policy = build_prompt_kit_registry.load_actionability_policy()
        self.assertEqual(source["name"], "Context Engineering System Refactorer")
        self.assertEqual(source["class"], "AI ENGINEERING / CONTEXT")
        self.assertEqual(source["profile"], "ai-engineering")
        self.assertIn("bounded fixed point", source["sprintRole"])
        self.assertIn("current default branch", source["expectedOutput"])
        self.assertIn("REFRESH -> MEASURE -> SELECT HIGHEST-IMPACT CONTEXT DEFECT -> REFACTOR -> VALIDATE -> CRITIQUE -> INTEGRATE -> REMEASURE -> CONTINUE", source["nextStep"])
        self.assertIn("branch, PR, or green CI result alone is insufficient completion", source["proofGate"])
        copy = source["copyContent"]
        for phrase in (
            "ENGINEER THE FULL CONTEXT SYSTEM AROUND THE MODEL",
            "RECOVER FROM ATTENTION SATURATION / THE DUMB ZONE",
            "CONTINUOUS CONTEXT-CONVERGENCE LOOP",
            "A pass counts only when",
            "deliberate second pass",
            "merge it into the current default branch in the same run",
            "verify the context-system changes and owning validation are present there",
            "Do not stop merely because one context slice is green or one bounded slice merged",
            "Stop only at the bounded fixed point",
        ):
            self.assertIn(phrase, copy)
        self.assertNotIn(policy["integration_marker"], copy)
        self.assertIn(policy["integration_marker"], effective["copyContent"])
        for forbidden in ("50,000 FT", "30,000 FT", "15,000 FT", "TREAT CLAIMS AS HYPOTHESES"):
            self.assertNotIn(forbidden, copy)
        self.assertLess(len(copy), 7000)

'''
          test_path.write_text(text.replace(anchor_test, method + anchor_test, 1), encoding='utf-8')
          print(json.dumps({'target':'P68','before_copy_chars':before_len,'after_copy_chars':after_len,'delta_copy_chars':after_len-before_len}, indent=2))
          PY
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Run focused and shared proof
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/test_ai_engineering_level_up.py
          python -m unittest tests.test_ai_engineering_level_up -v
          python -m unittest tests.test_agentic_loop_prompts tests.test_green_branch_integration_policy tests.test_prompt_kit_mainline_delivery -v
          python scripts/prompt_registry_ops.py validate | tee "$RUNNER_TEMP/p68-validation.json"
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Deliberate second pass
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts import build_prompt_kit_registry
          raw = json.loads(Path('registry/prompts/ai-engineering-level-up-prompts.v1.json').read_text(encoding='utf-8'))
          p68 = next(p for p in raw['prompts'] if p['id'] == 'P68')
          copy = p68['copyContent']
          for phrase in ('RECOVER FROM ATTENTION SATURATION / THE DUMB ZONE','CONTINUOUS CONTEXT-CONVERGENCE LOOP','deliberate second pass','bounded fixed point'):
              if phrase not in copy and phrase not in p68['sprintRole'] and phrase not in p68['proofGate']:
                  raise SystemExit(f'missing required P68 concept: {phrase}')
          for forbidden in ('50,000 FT','30,000 FT','15,000 FT','TREAT CLAIMS AS HYPOTHESES','GREEN BRANCH INTEGRATION CONTRACT'):
              if forbidden in copy:
                  raise SystemExit(f'P68 absorbed non-owner/global doctrine: {forbidden}')
          if len(copy) >= 7000:
              raise SystemExit(f'P68 raw copy too large: {len(copy)}')
          effective = {p['id']:p for p in build_prompt_kit_registry.load_prompt_registry()}['P68']
          policy = build_prompt_kit_registry.load_actionability_policy()
          if policy['integration_marker'] not in effective['copyContent']:
              raise SystemExit('effective P68 lost shared integration contract')
          receipt = json.loads(Path(os.environ['RUNNER_TEMP'], 'p68-validation.json').read_text(encoding='utf-8'))
          if receipt.get('status') != 'valid' or receipt.get('site_parity') is not True:
              raise SystemExit(f'invalid parity receipt: {receipt!r}')
          print(json.dumps({'second_pass':'clean','raw_chars':len(copy),'prompt_count':receipt['prompt_count'],'site_parity':receipt['site_parity']}, indent=2))
          PY
          git diff --stat

      - name: Remove transport and commit exact durable result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-p68-mainline-executor-v2.yml .github/workflows/tmp-p68-continuous-convergence-hardener.yml .prompt-contrib/p68-mainline-executor-trigger.txt
          git add registry/prompts/ai-engineering-level-up-prompts.v1.json tests/test_ai_engineering_level_up.py web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m "feat(prompt-kit): harden P68 continuous context convergence"
          echo "PROVEN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Reconcile moved main and integrate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            git fetch origin main --prune
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
              python -m unittest tests.test_ai_engineering_level_up tests.test_agentic_loop_prompts tests.test_green_branch_integration_policy tests.test_prompt_kit_mainline_delivery -v
              python scripts/prompt_registry_ops.py validate
              python -m unittest tests.test_prompt_language_audit -v
              python scripts/validate_prompt_kit_discovery.py --summary
              python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
              python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
              git diff --check HEAD
              export PROVEN_SHA="$(git rev-parse HEAD)"
            fi
            if git push origin HEAD:main; then break; fi
            test "$attempt" -lt 2 || exit 1
          done
          git fetch origin main --prune
          git merge-base --is-ancestor "$PROVEN_SHA" origin/main
          echo "PROVEN_INTEGRATION_SHA=$PROVEN_SHA"
          echo "RESULTING_MAIN_SHA=$(git rev-parse origin/main)"
