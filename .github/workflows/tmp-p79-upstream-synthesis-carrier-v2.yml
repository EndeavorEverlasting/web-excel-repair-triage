name: Temporary P79 upstream synthesis carrier v2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: p79-upstream-synthesis-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/p79-upstream-synthesis-20260909'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p79-upstream-synthesis-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize repaired P79 upstream synthesis and prove it
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main fix/p79-upstream-synthesis-20260909 --prune --tags

          if [ ! -f scripts/tmp_apply_p79_upstream_synthesis_v2.py ]; then
            echo 'P79 upstream synthesis already materialized; no v2 carrier work remains'
            exit 0
          fi

          git merge --no-edit origin/main
          python scripts/tmp_apply_p79_upstream_synthesis_v2.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

          mkdir -p Outputs
          python scripts/prompt_registry_ops.py prior-art \
            --query 'prompt registry adder upstream prior art DeepSeek Pocock prompt kits synthesis user use case' \
            > Outputs/p79-upstream-prior-art.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('Outputs/p79-upstream-prior-art.json').read_text(encoding='utf-8'))
          contract=json.loads(Path('harness/contracts/operant-external-resource-intake.v1.json').read_text(encoding='utf-8'))
          configured={row['id'] for row in contract['sources']}
          searched={row['source_id'] for row in receipt['sources']}
          assert receipt['all_registered_sources_searched'] is True
          assert searched == configured, (searched, configured)
          assert receipt['automatic_prompt_authoring'] is False
          assert receipt['distinct_residual_terms']
          print('P79_PREDRAFT_ALL_SOURCE_RECEIPT_PASS', sorted(searched))
          PY

          python -m unittest \
            tests.test_operant_external_resources.OperantExternalResourceTests.test_registered_donors_and_roots_are_explicit \
            tests.test_operant_external_resources.OperantExternalResourceTests.test_prompt_adder_exposes_predraft_all_registered_source_review \
            tests.test_operant_external_resources.OperantExternalResourceTests.test_prompt_adder_binds_external_gate_before_identity_allocation \
            tests.test_prompt_registry_expansion_regression_design_teach.PromptRegistryExpansionTests.test_p79_harvests_whole_chat_twice_and_complements_utility \
            tests.test_spec_architecture_prompt_registry.SpecArchitecturePromptRegistryTests.test_prompt_adder_uses_low_friction_helper_without_losing_semantic_proof \
            -v

          python -m unittest tests.test_operant_external_resources -v
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_order_navigation_contract -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          python scripts/tmp_apply_p79_upstream_synthesis_v2.py --verify-only
          python -m unittest \
            tests.test_operant_external_resources.OperantExternalResourceTests.test_prompt_adder_exposes_predraft_all_registered_source_review \
            tests.test_prompt_registry_expansion_regression_design_teach.PromptRegistryExpansionTests.test_p79_harvests_whole_chat_twice_and_complements_utility \
            -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          git rm -f scripts/tmp_apply_p79_upstream_synthesis.py scripts/tmp_apply_p79_upstream_synthesis_v2.py
          git add \
            registry/prompts/spec-architecture-prompts.v1.json \
            scripts/prompt_registry_external_prior_art.py \
            scripts/prompt_registry_ops.py \
            tests/test_prompt_registry_expansion_regression_design_teach.py \
            tests/test_operant_external_resources.py \
            web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'feat(prompt-kit): make P79 synthesize registered upstream prior art'
          git push origin HEAD:fix/p79-upstream-synthesis-20260909
