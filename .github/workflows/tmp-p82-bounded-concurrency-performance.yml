name: Temporary P82 bounded-concurrency performance sprint

on:
  push:
    branches:
      - feat/p82-bounded-concurrency-performance-20260909

permissions:
  contents: write

concurrency:
  group: p82-bounded-concurrency-performance-20260909
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p82-bounded-concurrency-performance-20260909
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh exact repository floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/p82-bounded-concurrency-performance-20260909 --prune
          test "$(git rev-parse origin/main)" = "b60fc83db448b2c7a3999044531cdc85446b67af"
          test "$(git merge-base origin/main HEAD)" = "b60fc83db448b2c7a3999044531cdc85446b67af"
          git status --short
          git branch --show-current
          git log --oneline --decorate -5

      - name: Strengthen P82 and focused semantic regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('registry/prompts/spec-architecture-prompts.v1.json')
          text = registry_path.read_text(encoding='utf-8')
          payload = json.loads(text)
          p82 = next(p for p in payload['prompts'] if p['id'] == 'P82')

          def replace_json_value(raw, key, old_value, new_value):
              old = f'"{key}": ' + json.dumps(old_value, ensure_ascii=False)
              new = f'"{key}": ' + json.dumps(new_value, ensure_ascii=False)
              count = raw.count(old)
              if count != 1:
                  raise SystemExit(f'{key}: expected exactly one P82 value anchor, found {count}')
              return raw.replace(old, new, 1)

          updates = {
              'useWhen': p82['useWhen'] + " This also owns performance/concurrency claims where a proposed mechanism such as a semaphore, worker pool, queue cap, rate limiter, batching, or more parallelism must be tested as a hypothesis rather than assumed to improve speed.",
              'inspectFirst': p82['inspectFirst'] + " For performance/concurrency hypotheses, inspect the representative workload, current concurrency and queueing, CPU/memory/I/O/network pressure, connection/thread/process pools, downstream quotas or rate limits, latency distribution, throughput, errors/retries, cancellation, fairness or ordering requirements, backpressure, and cleanup/release behavior.",
              'expectedOutput': p82['expectedOutput'] + " For performance/concurrency work, include baseline/current and bounded-candidate evidence, a practical concurrency sweep, resource/error metrics, and an explicit KEEP/ADJUST/REVERT decision rather than a mechanism-first recommendation.",
              'proofGate': p82['proofGate'] + " A claimed performance win from concurrency control requires representative before/after evidence; correctness, required ordering/fairness, cancellation/backpressure, error handling, and release/cleanup remain green; and the simpler baseline is retained when the bounded candidate does not produce a material measured gain.",
          }

          anchor = "A prototype may be narrow; it may not fake the very behavior being evaluated.\n\nPROTOTYPE LADDER"
          if anchor not in p82['copyContent']:
              raise SystemExit('P82 performance insertion anchor missing')
          section = "\n".join([
              "A prototype may be narrow; it may not fake the very behavior being evaluated.",
              "",
              "2A. PERFORMANCE / CONCURRENCY HYPOTHESIS — MEASURE, DON'T CARGO-CULT",
              "When a proposal claims that a semaphore, worker pool, queue cap, rate limiter, batching, or more parallelism will make a system faster, treat the mechanism as a falsifiable hypothesis. A semaphore caps in-flight work; it does not make each operation intrinsically faster. It can improve wall clock, throughput, or tail latency when the current path is oversubscribed or contending for CPU, memory, I/O, sockets/connections, downstream quotas, or another finite resource. It can also make performance worse when the cap is too low or the true bottleneck is elsewhere.",
              "",
              "- Measure the representative baseline first. Record workload shape plus throughput/wall clock, p50/p95/p99 latency when meaningful, CPU/memory/I/O/network saturation, active workers/connections, queue depth, error/retry/rate-limit counts, and the actual limiting resource when evidence can identify it.",
              "- Compare the current path with a bounded candidate under the SAME workload. Sweep a practical concurrency range rather than choosing one magic semaphore count. Include a deliberately high/unbounded control only when safe and useful for diagnosis.",
              "- Set candidate bounds from evidence such as available parallelism, memory budget, connection/thread/process pools, downstream rate limits, queue behavior, and service SLOs—not folklore.",
              "- Preserve correctness before speed: ordering where required, fairness/starvation behavior, cancellation/timeouts, backpressure, idempotency, and release permits/resources on every success, error, timeout, and cancellation path.",
              "- Decide from evidence: KEEP the simpler baseline when bounding concurrency gives no material gain; ADJUST the cap when a stable knee is measured; adopt a different mechanism when the bottleneck is not in-flight concurrency. Do not label serialization or mutual exclusion itself a performance optimization without measured proof.",
              "",
              "Performance experiment path: baseline → bounded candidate → practical concurrency sweep → correctness/resource review → KEEP / ADJUST / REVERT.",
          ])
          updates['copyContent'] = p82['copyContent'].replace(anchor, section + "\n\nPROTOTYPE LADDER", 1)

          for key, new_value in updates.items():
              text = replace_json_value(text, key, p82[key], new_value)
          registry_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_spec_architecture_prompt_registry.py')
          test_text = test_path.read_text(encoding='utf-8')
          old = '        self.assertIn("must not erase an active query", content)\n        self.assertEqual(prompt["actionabilityPolicy"], self.policy["policy_id"])'
          new = "\n".join([
              '        self.assertIn("must not erase an active query", content)',
              '        for phrase in (',
              '            "PERFORMANCE / CONCURRENCY HYPOTHESIS — MEASURE, DON\'T CARGO-CULT",',
              '            "A semaphore caps in-flight work; it does not make each operation intrinsically faster.",',
              '            "p50/p95/p99 latency",',
              '            "queue depth",',
              '            "fairness/starvation behavior",',
              '            "backpressure",',
              '            "release permits/resources on every success, error, timeout, and cancellation path",',
              '            "baseline → bounded candidate → practical concurrency sweep",',
              '            "KEEP the simpler baseline",',
              '        ):',
              '            self.assertIn(phrase, content)',
              '        self.assertIn("semaphore", prompt["useWhen"])',
              '        self.assertIn("representative before/after evidence", prompt["proofGate"])',
              '        self.assertIn("KEEP/ADJUST/REVERT", prompt["expectedOutput"])',
              '        self.assertEqual(prompt["actionabilityPolicy"], self.policy["policy_id"])',
          ])
          count = test_text.count(old)
          if count != 1:
              raise SystemExit(f'focused P82 test anchor count: {count}')
          test_path.write_text(test_text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Validate contribution pass 1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_ai_engineering_level_up -v
          python -m unittest tests.test_prompt_kit_discovery -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_harness.py
          git diff --check

      - name: Whole-chat pass 2 and fixed-point falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path('registry/prompts/spec-architecture-prompts.v1.json')
          current = json.loads(path.read_text(encoding='utf-8'))
          base = json.loads(subprocess.check_output(
              ['git', 'show', 'origin/main:registry/prompts/spec-architecture-prompts.v1.json'],
              text=True,
          ))
          current_ids = [p['id'] for p in current['prompts']]
          base_ids = [p['id'] for p in base['prompts']]
          if current_ids != base_ids:
              raise SystemExit('strengthen-only sprint unexpectedly changed prompt identities')
          p82 = next(p for p in current['prompts'] if p['id'] == 'P82')
          markers = (
              "falsifiable hypothesis",
              "does not make each operation intrinsically faster",
              "p50/p95/p99 latency",
              "practical concurrency range",
              "actual limiting resource",
              "fairness/starvation behavior",
              "cancellation/timeouts",
              "backpressure",
              "KEEP the simpler baseline",
              "bottleneck is not in-flight concurrency",
          )
          missing = [m for m in markers if m not in p82['copyContent']]
          if missing:
              raise SystemExit(f'P82 bounded-concurrency semantic gaps: {missing}')
          if p82['name'] != next(p for p in base['prompts'] if p['id'] == 'P82')['name']:
              raise SystemExit('P82 owner identity/name drifted during strengthening')
          PY
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Commit durable contribution and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git add registry/prompts/spec-architecture-prompts.v1.json tests/test_spec_architecture_prompt_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(prompt-kit): harden P82 concurrency performance proof"
          git rm .github/workflows/tmp-p82-bounded-concurrency-performance.yml
          git commit -m "chore: remove P82 concurrency sprint carrier"
          git push origin HEAD:feat/p82-bounded-concurrency-performance-20260909
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          git diff --name-only origin/main...HEAD
