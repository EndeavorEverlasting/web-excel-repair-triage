name: Temporary P92 canonical path hardener

on:
  push:
    branches: [feat/p92-canonical-path-prompt-20260823]

permissions:
  contents: write

concurrency:
  group: prompt-kit-p92-canonical-path-hardener
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p92-canonical-path-prompt-20260823
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh and reconcile current main floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --all --prune --tags
          git merge --no-edit origin/main
          echo "RECONCILED_BASE=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git status --short
          git log --oneline --decorate -8

      - name: Apply P01 and P92 canonical path contribution
        shell: bash
        run: |
          set -euo pipefail
          python .prompt-contrib/p92_canonical_path_patch.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          git rm .prompt-contrib/p92_canonical_path_patch.py
          git rm .github/workflows/tmp-p92-canonical-path-hardener.yml
          git add docs/prompts.json registry/prompts/spec-architecture-prompts.v1.json tests/test_spec_architecture_prompt_registry.py build_prompt_kit.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "feat(prompt-kit): establish canonical path prompt"
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Focused and canonical Prompt Kit proof
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/test_spec_architecture_prompt_registry.py build_prompt_kit.py
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate | tee "$RUNNER_TEMP/p92-registry-validation.json"
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          test -z "$(git status --short)"

      - name: Whole-chat pass two and owner-boundary critique
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import build_prompt_kit
          from scripts import build_prompt_kit_registry

          root = Path('.')
          spec = json.loads((root / 'registry/prompts/spec-architecture-prompts.v1.json').read_text(encoding='utf-8'))
          p92s = [p for p in spec['prompts'] if p['id'] == 'P92']
          if len(p92s) != 1:
              raise SystemExit(f'P92 identity count drift: {len(p92s)}')
          p92 = p92s[0]
          base = json.loads((root / 'docs/prompts.json').read_text(encoding='utf-8'))
          p01 = next(p for p in base if p['id'] == 'P01')
          full = {p['id']: p for p in build_prompt_kit_registry.load_prompt_kit_registry()}

          required_p92 = (
              'Canonical Path Prompt',
              'CANONICAL DEVELOPMENT CHECKOUT',
              'CANONICAL PRODUCTION / USE PATH',
              'PREVENT PATH SPRAWL AND COMPUTER BLOAT',
              'REMOTE INTEGRATION IS NOT LOCAL DEPLOYMENT',
              'REMOTE_INTEGRATED',
              'DEV_CHECKOUT_CURRENT',
              'PROD_PATH_CURRENT',
              'ENTRYPOINT_PROVED',
              'MAP BOTH PATHS WHEN TEST PROOF IS INVOLVED',
              'Green helper tests do not prove a production wrapper',
          )
          corpus = p92['name'] + '\n' + p92['copyContent']
          missing = [x for x in required_p92 if x not in corpus]
          if missing:
              raise SystemExit('P92 canonical-path semantic gap: ' + repr(missing))

          required_p01 = (
              'CANONICAL PATH CONTRACT',
              'Every app harness must answer where normal development occurs',
              'P92 Canonical Path Prompt owns deep repair/audit of this contract',
          )
          missing = [x for x in required_p01 if x not in p01['copyContent']]
          if missing:
              raise SystemExit('P01 harness seam gap: ' + repr(missing))

          # Preserve distinct neighboring owners rather than turning P92 into a bootstrap/closure super-prompt.
          if build_prompt_kit.SYNONYMS['clone repo'] != 'P61':
              raise SystemExit('P61 generic clone ownership was stolen')
          if build_prompt_kit.SYNONYMS['repository checkout'] != 'P61':
              raise SystemExit('P61 generic checkout ownership was stolen')
          for key in ('canonical path', 'canonical checkout', 'production path', 'path drift'):
              if build_prompt_kit.SYNONYMS[key] != 'P92':
                  raise SystemExit(f'P92 discovery alias missing: {key}')
          for neighbor in ('P61', 'P91', 'P93', 'P94'):
              if neighbor not in full:
                  raise SystemExit(f'neighbor owner missing: {neighbor}')

          # The reusable prompt must not freeze one operator's literal workstation path into global semantics.
          forbidden_literals = ('CheeksMcClappeth', 'pa_rperez26', 'AgentSwitchBoard-Live', 'C:\\Users\\')
          for literal in forbidden_literals:
              if literal in p92['copyContent'] or literal in p01['copyContent']:
                  raise SystemExit(f'operator-specific path leaked into canonical prompt: {literal}')

          receipt_path = Path(os.environ['RUNNER_TEMP']) / 'p92-registry-validation.json'
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          if receipt.get('status') != 'valid' or receipt.get('site_parity') is not True:
              raise SystemExit(f'bad registry validation receipt: {receipt!r}')
          if receipt.get('prompt_count') != len(full):
              raise SystemExit('prompt-count receipt does not match loaded registry')
          print(json.dumps({
              'pass_two': 'clean',
              'strengthened': ['P01', 'P92'],
              'new_prompt_ids': [],
              'prompt_count': len(full),
              'site_parity': True,
              'p61_bootstrap_owner_preserved': True,
              'legacy_p92_production_test_audit_preserved': True,
          }, indent=2))
          PY
          git diff --check
          test -z "$(git status --short)"

      - name: Reconcile a moved main once, then revalidate exact head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            python -m unittest tests.test_spec_architecture_prompt_registry -v
            python scripts/prompt_registry_ops.py validate
            python scripts/validate_prompt_kit_discovery.py --summary
            python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
            python -m unittest tests.test_prompt_language_audit -v
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
            git diff --check
            test -z "$(git status --short)"
          fi
          echo "VALIDATED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VALIDATED_BASE=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Publish exact validated head only if base is still contained
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test -z "$(git status --short)"
          test "$(git rev-parse HEAD)" = "$VALIDATED_HEAD"
          git push origin HEAD:feat/p92-canonical-path-prompt-20260823
          printf 'P92_CANONICAL_PATH_VALIDATED\nhead=%s\nbase=%s\n' "$VALIDATED_HEAD" "$(git rev-parse origin/main)"
