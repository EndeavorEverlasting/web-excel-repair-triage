name: Temporary P92 dev-production path safety carrier

on:
  push:
    branches:
      - feat/p92-dev-prod-path-safety-20260827
    paths:
      - scripts/tmp_apply_p92_dev_prod_path_safety.py
      - .github/workflows/tmp-p92-dev-prod-path-safety-carrier.yml

permissions:
  contents: write

concurrency:
  group: p92-dev-prod-path-safety-carrier
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p92-dev-prod-path-safety-20260827
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply P92 hardening, prove it, and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main --prune
          git merge --no-edit origin/main

          python scripts/tmp_apply_p92_dev_prod_path_safety.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          git rm -f \
            .github/workflows/tmp-p92-dev-prod-path-safety-carrier.yml \
            scripts/tmp_apply_p92_dev_prod_path_safety.py
          git add \
            registry/prompts/spec-architecture-prompts.v1.json \
            tests/test_spec_architecture_prompt_registry.py \
            web/prompt-kit/index.html
          git diff --cached --check

          git commit -m 'fix(prompt-kit): separate dev mutation from active production use'
          git push origin HEAD:feat/p92-dev-prod-path-safety-20260827
