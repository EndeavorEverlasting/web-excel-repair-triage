name: Temporary P92 environment path hardening

on:
  push:
    branches:
      - feat/p92-environment-path-resolution-20260826

permissions:
  contents: write

jobs:
  harden-p92:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/p92-environment-path-resolution-20260826
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh default branch floor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          echo "branch_before=$(git rev-parse HEAD)"
          echo "main_floor=$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git merge --no-edit origin/main
          fi

      - name: Strengthen canonical P92 owner
        run: python .prompt-contrib/p92_environment_path_resolution.py

      - name: Rebuild generated Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Focused semantic and registry proof
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Deliberate P92 second pass
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import build_prompt_kit
          from scripts import build_prompt_kit_registry

          root = Path('.')
          raw = json.loads((root / 'registry/prompts/spec-architecture-prompts.v1.json').read_text(encoding='utf-8'))['prompts']
          matches = [p for p in raw if p['id'] == 'P92']
          assert len(matches) == 1
          p = matches[0]
          assert p['name'] == 'Canonical Path Prompt'
          assert len(p['copyContent']) < 9000
          for phrase in (
              'ENVIRONMENT-DERIVED MACHINE / PROFILE PATH RESOLUTION',
              'PATH INPUT RECEIPT',
              'TARGET_FOLDER_REDIRECTED',
              'Known Folder location',
              'do not assume `%USERPROFILE%\\Desktop`',
              'Ambiguous roots/redirection -> CONFLICT/UNKNOWN',
              'tracked canonical-path/profile contract -> authorized machine/profile override',
          ):
              assert phrase in p['copyContent'], phrase
          for synonym in (
              'onedrive path',
              'onedrive repository path',
              'known folder redirection',
              'user profile path',
              'os path resolution',
          ):
              assert build_prompt_kit.SYNONYMS[synonym] == 'P92', synonym
          effective = {item['id']: item for item in build_prompt_kit_registry.load_prompt_kit_registry()}
          assert effective['P92']['name'] == 'Canonical Path Prompt'
          assert 'PATH INPUT RECEIPT' in effective['P92']['copyContent']
          print('P92 second pass: PASS')
          print('prompt_count:', len(effective))
          print('raw_chars:', len(p['copyContent']))
          print('owner_action: STRENGTHEN P92; new_ids=0')
          PY

      - name: Fail closed if main moved during proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "main moved after proof; refusing stale push" >&2
            exit 41
          fi

      - name: Remove transport and commit only durable surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm .prompt-contrib/p92_environment_path_resolution.py
          rm .github/workflows/tmp-p92-environment-path-resolution-20260826.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            registry/prompts/spec-architecture-prompts.v1.json \
            build_prompt_kit.py \
            tests/test_spec_architecture_prompt_registry.py \
            web/prompt-kit/index.html
          git diff --cached --check
          expected=$(printf '%s\n' \
            build_prompt_kit.py \
            registry/prompts/spec-architecture-prompts.v1.json \
            tests/test_spec_architecture_prompt_registry.py \
            web/prompt-kit/index.html | sort)
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
          test -z "$(git status --porcelain --untracked-files=all | grep -vE '^(D | D) (\.prompt-contrib/p92_environment_path_resolution.py|\.github/workflows/tmp-p92-environment-path-resolution-20260826.yml)$' || true)" || {
            git status --short
            exit 42
          }
          git commit -m "feat(prompt-kit): derive P92 paths from environment truth"
          git push origin HEAD:feat/p92-environment-path-resolution-20260826
          echo "PROVEN_HEAD=$(git rev-parse HEAD)"
