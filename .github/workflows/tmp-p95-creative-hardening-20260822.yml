name: Temporary P95 Creative Hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden-p95:
    if: github.head_ref == 'feat/prompt-kit-flow-preference-telemetry-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-flow-preference-telemetry-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh floor, reconcile main, and harden canonical P95
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
          python scripts/tmp_p95_creative_hardening_20260822.py
