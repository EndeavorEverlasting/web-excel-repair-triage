name: Prompt Kit permissioned polling contribution executor

on:
  push:
    branches:
      - feat/prompt-kit-permissioned-polling-20260823

permissions:
  contents: write

concurrency:
  group: prompt-kit-permissioned-polling-20260823
  cancel-in-progress: false

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify bounded executor head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f .prompt-contrib/permissioned-repository-polling.json
          test -f tests/test_permissioned_repository_polling_prompt.py
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Add through canonical prompt helper
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py inspect | tee "$RUNNER_TEMP/prompt-registry-inspect.json"
          python scripts/prompt_registry_ops.py add \
            --input .prompt-contrib/permissioned-repository-polling.json \
            --registry spec-architecture-prompts \
            | tee "$RUNNER_TEMP/prompt-registry-add-receipt.json"
          python scripts/prompt_registry_ops.py validate

      - name: Focused semantic and Prompt Kit proof
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_permissioned_repository_polling_prompt -v
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/evaluate_prompt_language.py \
            --strict \
            --output "$RUNNER_TEMP/prompt-language-audit.json" \
            --summary
          python scripts/build_prompt_kit_registry.py --check
          git diff --check

      - name: Deliberate second-pass bounded review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import build_prompt_kit_registry

          name = "Permissioned Repository Polling & Scheduled Sync Builder"
          prompts = build_prompt_kit_registry.load_prompt_kit_registry()
          matches = [p for p in prompts if p.get("name") == name]
          if len(matches) != 1:
              raise SystemExit(f"expected one polling prompt, found {len(matches)}")
          p = matches[0]
          content = p["copyContent"]
          required = (
              "Recurring local execution is opt-in product state",
              "NO_CHANGE IS A SUCCESSFUL TERMINAL STATE",
              "Never reset, clean, force-pull, or overwrite unique work",
              "Do not create a fresh clone, cache tree, temp directory, or generated-site copy every interval",
              "single-instance lock",
              "AGENTSWITCHBOARD / PROMPT KIT REFERENCE USE CASE",
              "rather than owning a duplicate prompt registry or rewriting prompt IDs",
          )
          missing = [item for item in required if item not in content]
          if missing:
              raise SystemExit("second-pass semantic gap: " + repr(missing))
          raw = json.loads(Path("registry/prompts/spec-architecture-prompts.v1.json").read_text(encoding="utf-8"))
          raw_match = [item for item in raw["prompts"] if item.get("name") == name]
          if len(raw_match) != 1:
              raise SystemExit("raw registry identity is not unique")
          if len(raw_match[0]["copyContent"]) >= 10000:
              raise SystemExit("polling prompt exceeded bounded source ceiling")
          print(f"second-pass review: PASS id={p['id']} seq={p['seq']}")
          PY
          git diff --check

      - name: Remove temporary contribution transport and publish durable head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EndeavorEverlasting"
          git config user.email "71802818+EndeavorEverlasting@users.noreply.github.com"
          git rm .prompt-contrib/permissioned-repository-polling.json
          git rm .github/workflows/tmp-permissioned-polling-prompt-20260823.yml
          git add registry/prompts/spec-architecture-prompts.v1.json
          git add web/prompt-kit/index.html
          git add tests/test_permissioned_repository_polling_prompt.py
          git diff --cached --check
          git status --short
          git commit -m "feat(prompt-kit): add permissioned repository polling builder"
          git push origin HEAD:feat/prompt-kit-permissioned-polling-20260823
