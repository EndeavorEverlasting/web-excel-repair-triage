name: Temporary Phase 1 lifecycle canonical promotion

on:
  push:
    branches:
      - feat/prompt-kit-local-storage-lifecycle-20260913
    paths:
      - .github/workflows/tmp-phase1-lifecycle-promote.yml
      - docs/prompt-kit-storage-lifecycle.js
      - tests/test_prompt_kit_storage_lifecycle_runtime.py
      - scripts/build_prompt_kit_registry.py
      - web/prompt-kit/index.html

permissions:
  contents: write

concurrency:
  group: prompt-kit-phase1-lifecycle-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact owned branch head
        uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-local-storage-lifecycle-20260913
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Refresh exact branch and main floor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --prune
          git merge-base --is-ancestor origin/main HEAD
          git status --short
          git log --oneline --decorate -5

      - name: Build and validate canonical Phase 1 site
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/prompt-kit-storage-lifecycle.js
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/validate_prompt_kit_serverless_runtime_lifecycle.py --summary
          python -m unittest tests.test_prompt_kit_serverless_runtime_lifecycle tests.test_prompt_kit_storage_lifecycle_runtime -v
          python scripts/validate_prompt_kit_privacy_storage.py --summary
          python scripts/validate_prompt_kit_cross_device_access.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Deliberate second-pass lifecycle falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          runtime = Path('docs/prompt-kit-storage-lifecycle.js').read_text(encoding='utf-8')
          html = Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          markers = [
              "var latest=Object.create(null);",
              "reason:'item-exceeds-store-bounds'",
              "if(value==null||value==='')return Date.now()",
              "event.key==='Escape'",
              "first.focus()",
          ]
          missing = [marker for marker in markers if marker not in runtime]
          generated_missing = [marker for marker in markers if marker not in html]
          if missing or generated_missing:
              raise SystemExit(f'lifecycle promotion falsification failed: runtime={missing}; generated={generated_missing}')
          PY
          python -m unittest tests.test_prompt_kit_storage_lifecycle_runtime -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Commit exact generated bytes and self-remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/index.html
          git rm .github/workflows/tmp-phase1-lifecycle-promote.yml
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' '.github/workflows/tmp-phase1-lifecycle-promote.yml' 'web/prompt-kit/index.html' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/staged.txt
          git commit -m "chore(prompt-kit): promote reviewed lifecycle site"
          git push origin HEAD:"$GITHUB_REF_NAME"
