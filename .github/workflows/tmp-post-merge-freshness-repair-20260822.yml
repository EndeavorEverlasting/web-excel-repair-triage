name: Temporary Post-Merge Freshness Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: post-merge-freshness-repair-20260822
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'fix/prompt-kit-post-merge-freshness-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prompt-kit-post-merge-freshness-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair stale post-merge verification contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main

          python - <<'PY'
          import json
          from pathlib import Path

          policy_path = Path('registry/prompts/actionable-next-step-policy.v1.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))

          suffix_addition = (
              ' After an integration SHA has been proven, a later default-branch advance is not a failure by itself: '
              'verify that the proven merge or commit is an ancestor of the refreshed default branch and rerun only proof '
              'affected by intervening changes; do not require the refreshed default-branch head to equal the historical integration SHA.'
          )
          if suffix_addition.strip() not in policy['next_step_suffix']:
              policy['next_step_suffix'] += suffix_addition

          anchor = (
              '- Re-fetch before final exact-head validation/integration. If the base or owned head moved after proof, '
              'reconcile and rerun affected checks before merge.\n'
          )
          addition = (
              '- Post-integration verification is containment-based, not head-equality-based: after refreshing the default branch, '
              'accept a later head when `git merge-base --is-ancestor <proven-integration-sha> <refreshed-default-head>` succeeds '
              'and relevant changed-surface validation remains current. Do not fail merely because the default branch advanced after the recorded merge.\n'
              '- If the proven integration SHA is not an ancestor of the refreshed default head, treat prior integration proof as stale or invalid, '
              'reconcile the discrepancy, and rerun affected proof before claiming completion.\n'
          )
          appendix = policy['copy_content_appendix']
          if 'Post-integration verification is containment-based, not head-equality-based' not in appendix:
              if appendix.count(anchor) != 1:
                  raise RuntimeError(f'freshness anchor count was {appendix.count(anchor)}, expected 1')
              appendix = appendix.replace(anchor, anchor + addition, 1)
              policy['copy_content_appendix'] = appendix

          policy_path.write_text(json.dumps(policy, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test_path = Path('tests/test_remote_freshness_p13_iteration.py')
          text = test_path.read_text(encoding='utf-8')
          anchor_test = '        self.assertIn("versioned proof", appendix)\n'
          assertions = (
              '        self.assertIn("Post-integration verification is containment-based, not head-equality-based", appendix)\n'
              '        self.assertIn("git merge-base --is-ancestor", appendix)\n'
              '        self.assertIn("Do not fail merely because the default branch advanced", appendix)\n'
              '        self.assertIn("not an ancestor of the refreshed default head", appendix)\n'
          )
          if 'Post-integration verification is containment-based, not head-equality-based' not in text:
              if text.count(anchor_test) != 1:
                  raise RuntimeError(f'test anchor count was {text.count(anchor_test)}, expected 1')
              text = text.replace(anchor_test, anchor_test + assertions, 1)
              test_path.write_text(text, encoding='utf-8')
          PY

          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest \
            tests.test_remote_freshness_p13_iteration \
            tests.test_p02_p07_autonomous_iteration \
            tests.test_green_branch_integration_policy -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          git add \
            registry/prompts/actionable-next-step-policy.v1.json \
            tests/test_remote_freshness_p13_iteration.py \
            web/prompt-kit/index.html

          if git diff --cached --quiet; then
            echo 'No durable repair changes remain to commit.'
            exit 0
          fi

          git commit -m 'fix(prompt-kit): verify advanced main by ancestry'
          git push origin HEAD:fix/prompt-kit-post-merge-freshness-20260822
