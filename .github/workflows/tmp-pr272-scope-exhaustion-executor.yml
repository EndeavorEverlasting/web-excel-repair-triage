name: Temporary PR272 scope exhaustion executor

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: pr272-scope-exhaustion-executor
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.head.ref == 'feat/prompt-closeout-evidence-hardening-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-closeout-evidence-hardening-20260824
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh and load canonical patcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --all --prune --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          git show origin/main:.github/scripts/tmp_scope_exhaustion_closeout_patch.py > /tmp/scope_exhaustion_patch.py
          sed -i 's#ROOT = Path(__file__).resolve().parents\[2\]#ROOT = Path.cwd()#' /tmp/scope_exhaustion_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/scope_exhaustion_patch.py')
          text = path.read_text(encoding='utf-8')
          old = 'anchor = "\\n\\nSTOP ONLY AT THE REAL FIXED POINT"'
          new = 'anchor = "\\n\\n10. STOP ONLY AT THE REAL FIXED POINT"'
          if old not in text:
              raise SystemExit('stale P83 anchor patch target missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply, build, and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('registry/prompts/repository-work-ledger-prompts.v1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          p83 = next(p for p in data['prompts'] if p['id'] == 'P83')
          content = p83['copyContent']
          before = len(content)
          replacements = {
              "Find the strongest available identity for the work being checked: repository, current/default branch, feature branch or worktree, PR, exact commit SHA, changed files, generated artifacts, test/validator commands, CI runs, review comments, handoff/ledger entry, and acceptance criteria. Prefer direct repository/provider/artifact evidence over prose summaries.":
              "Resolve repository/default branch, feature lane, PR/SHA, changed files/artifacts, validators/CI/reviews, handoff/ledger, and acceptance criteria from direct evidence.",
              "Prefer surgical repair over replacement. Reuse existing contracts, helpers, schemas, tests, validators, naming, output paths, and repository conventions. Preserve unrelated concurrent work and stronger existing safeguards. When the previous agent chose a different but valid implementation than you would have, keep it unless evidence shows a requirement, reliability, maintainability, safety, or integration problem.":
              "Prefer surgical repair. Reuse repository contracts, helpers, tests, validators, names, and output paths; preserve concurrent work and stronger safeguards. Keep a different valid implementation unless evidence shows a requirement, reliability, maintainability, safety, or integration problem.",
              "Expansion is allowed when it is directly connected to the requested outcome and current review exposes a practical omission, adjacent regression, missing edge case, reusable enforcement point, or obvious bounded improvement that prevents recurrence. Keep it small and reversible. Do not use `expand on it` as permission for speculative architecture, unrelated refactors, extra documentation, or scope creep.":
              "Expand only for a directly connected omission, regression, edge case, reusable enforcement point, or bounded recurrence-prevention improvement. Keep it reversible; reject speculative architecture, unrelated refactors, extra documentation, and scope creep.",
              "During long work, give concise progress updates at meaningful evidence boundaries: what claim was checked, what was proven or disproven, what was changed, and what gate comes next. Do not flood the user with low-level tool narration. In the final report distinguish:":
              "At meaningful evidence boundaries, report what was checked, proved/disproved, changed, and what gate comes next. In the final report distinguish:"
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f'P83 compaction anchor missing: {old[:60]}')
              content = content.replace(old, new, 1)
          p83['copyContent'] = content
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps({'p83_before_compaction': before, 'p83_after_compaction': len(content), 'saved': before-len(content)}, indent=2))
          PY
          python /tmp/scope_exhaustion_patch.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_operational_closeout_contract -v
          python -m unittest tests.test_repository_work_ledger_prompt -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Falsify and commit durable head
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import build_prompt_kit_registry
          policy = json.loads(Path('registry/prompts/actionable-next-step-policy.v1.json').read_text(encoding='utf-8'))
          ledger = json.loads(Path('registry/prompts/repository-work-ledger-prompts.v1.json').read_text(encoding='utf-8'))
          p83 = next(p for p in ledger['prompts'] if p['id'] == 'P83')
          effective = {p['id']: p for p in build_prompt_kit_registry.load_prompt_registry()}
          checks = {
            'safe residual invalidates none': 'SAFE & EXECUTABLE means work remains' in policy['copy_content_appendix'],
            'unsafe evidence required': 'UNSAFE is a narrow evidence-bearing classification' in policy['copy_content_appendix'],
            'blocked differs from unsafe': 'Missing access is not evidence that the work is unsafe' in policy['copy_content_appendix'],
            'out-of-scope boundary': 'Do not move unfinished requested work out of scope' in policy['copy_content_appendix'],
            'P83 reusable audit': 'SCOPE-EXHAUSTION AUDIT — CHALLENGE `NONE`' in p83['copyContent'],
            'appendix single': effective['P83']['copyContent'].count(policy['marker']) == 1,
            'P83 under anti-bloat ceiling': len(p83['copyContent']) < 8000,
          }
          failed = [k for k,v in checks.items() if not v]
          if failed: raise SystemExit(f'closeout falsification failed: {failed}')
          print(json.dumps({'pass_two':'bounded fixed point', 'p83_raw_size':len(p83['copyContent']), **checks}, indent=2))
          PY
          git rm -f .github/workflows/tmp-pr272-scope-exhaustion-executor.yml .prompt-contrib/scope_exhaustion_after_ci.txt
          git add registry/prompts/actionable-next-step-policy.v1.json registry/prompts/repository-work-ledger-prompts.v1.json tests/test_operational_closeout_contract.py docs/PROMPT_FINDER_QUESTIONNAIRE_TUTORIAL.md web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m 'fix(prompt-kit): make scope exhaustion evidence-bearing'
          git fetch origin main --prune
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
            python scripts/prompt_registry_ops.py validate
            python -m unittest tests.test_operational_closeout_contract tests.test_repository_work_ledger_prompt tests.test_actionable_prompt_registry -v
            python -m unittest tests.test_prompt_language_audit -v
            python scripts/validate_prompt_kit_discovery.py --summary
            python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
            git add web/prompt-kit/index.html
            if ! git diff --cached --quiet; then git commit -m 'chore(prompt-kit): refresh scope closeout site after main reconciliation'; fi
          fi
          git diff --check HEAD
          git push origin HEAD:feat/prompt-closeout-evidence-hardening-20260824
          echo "PROVEN_HEAD=$(git rev-parse HEAD)"
