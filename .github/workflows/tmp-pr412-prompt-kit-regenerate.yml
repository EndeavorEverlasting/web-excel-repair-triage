name: Temporary PR 412 Prompt Kit Regenerator

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/tmp-pr412-prompt-kit-regenerate.yml
      - .github/workflows/promotion-candidate.yml
      - docs/prompts.json
      - registry/prompts/prompt-strengthenings.v1.json
      - registry/prompts/spec-architecture-prompts.v1.json
      - scripts/build_prompt_kit_registry.py
      - scripts/prompt_registry_ops.py
      - tests/test_p105_local_first_tutorial_freshness.py
      - tests/test_repository_promotion.py
      - tests/test_sysadminsuite_prompt_registry.py
      - tests/test_ux_design_prompt_suite.py

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.pull_request.number == 412 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'EndeavorEverlasting' &&
      github.head_ref == 'feat/repository-promotion-pipeline-20260909'
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate canonical Prompt Kit candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output "$RUNNER_TEMP/index.html"
          test -s "$RUNNER_TEMP/index.html"
          sha256sum "$RUNNER_TEMP/index.html"
      - name: Upload generated candidate
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: pr412-prompt-kit-generated-index
          path: ${{ runner.temp }}/index.html
          if-no-files-found: error

  commit-generated-site:
    needs: [build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.head_ref }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
    steps:
      - name: Verify candidate has not moved
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/$HEAD_REF" --jq '.commit.sha')"
          test "$current" = "$EXPECTED_HEAD"
      - name: Download generated artifact without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          mkdir generated
          unzip -q artifact.zip -d generated
          test -s generated/index.html
          sha256sum generated/index.html
      - name: Commit exact generated site with expected-head parent
        shell: bash
        run: |
          set -euo pipefail
          base_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$EXPECTED_HEAD" --jq '.tree.sha')"
          export BASE_TREE="$base_tree"
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          encoded = base64.b64encode(Path("generated/index.html").read_bytes()).decode("ascii")
          Path("blob.json").write_text(
              json.dumps({"content": encoded, "encoding": "base64"}), encoding="utf-8"
          )
          PY
          blob_sha="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input blob.json --jq '.sha')"
          export BLOB_SHA="$blob_sha"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "base_tree": os.environ["BASE_TREE"],
              "tree": [
                  {
                      "path": "web/prompt-kit/index.html",
                      "mode": "100644",
                      "type": "blob",
                      "sha": os.environ["BLOB_SHA"],
                  }
              ],
          }
          Path("tree.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          tree_sha="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/trees" --input tree.json --jq '.sha')"
          export TREE_SHA="$tree_sha"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "message": "build(prompt-kit): regenerate canonical site for PR 412",
              "tree": os.environ["TREE_SHA"],
              "parents": [os.environ["EXPECTED_HEAD"]],
          }
          Path("commit.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          new_commit="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/commits" --input commit.json --jq '.sha')"
          export NEW_COMMIT="$new_commit"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("ref.json").write_text(
              json.dumps({"sha": os.environ["NEW_COMMIT"], "force": False}),
              encoding="utf-8",
          )
          PY
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" --input ref.json >/dev/null
          echo "generated-site-commit=$new_commit"
