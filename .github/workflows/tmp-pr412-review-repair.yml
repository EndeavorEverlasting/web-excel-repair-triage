name: Temporary PR 412 Review Repair

on:
  push:
    branches: [feat/repository-promotion-pipeline-20260909]
    paths:
      - .github/workflows/tmp-pr412-review-repair.yml

permissions:
  contents: write

concurrency:
  group: pr412-review-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: feat/repository-promotion-pipeline-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Reconcile current main and repair reviewed surfaces
        shell: bash
        env:
          BRANCH: feat/repository-promotion-pipeline-20260909
        run: |
          set -euo pipefail
          START_HEAD="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          echo "start-head=$START_HEAD"
          echo "main-floor=$BASE_SHA"

          if ! git merge --no-commit --no-ff "$BASE_SHA"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'conflicts=%s\n' "${conflicts[*]-}"
            if [[ "${#conflicts[@]}" -ne 1 || "${conflicts[0]}" != "web/prompt-kit/index.html" ]]; then
              echo "Unexpected reconciliation conflict; refusing mutation." >&2
              exit 1
            fi
            git checkout --ours -- web/prompt-kit/index.html
            git add web/prompt-kit/index.html
          fi

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one repair anchor, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          adapter = "scripts/github_promotion_adapter.py"
          replace_once(
              adapter,
              '''    result = gh.rest(\n        "GET",\n        f"/repos/{gh.repo}/compare/{integration_sha}...{urllib.parse.quote(target, safe='')}",\n    )\n    return str(result.get("status") or "") in {"ahead", "identical"}\n''',
              '''    result = gh.rest(\n        "GET",\n        f"/repos/{gh.repo}/compare/{integration_sha}...{urllib.parse.quote(target, safe='')}",\n    )\n    if not isinstance(result, dict):\n        raise ProviderError(\n            "PROVIDER_PARTIAL_TRUTH",\n            "default-branch containment response is malformed",\n        )\n    return str(result.get("status") or "") in {"ahead", "identical"}\n''',
          )
          replace_once(
              adapter,
              '''    pr = gh.rest("GET", f"/repos/{gh.repo}/pulls/{number}")\n    observed_head = str((pr.get("head") or {}).get("sha") or "")\n''',
              '''    pr = gh.rest("GET", f"/repos/{gh.repo}/pulls/{number}")\n    if not isinstance(pr, dict):\n        raise ProviderError(\n            "PROVIDER_PARTIAL_TRUTH",\n            "pull-request reconciliation response is malformed",\n        )\n    observed_head = str((pr.get("head") or {}).get("sha") or "")\n''',
          )

          gate = "scripts/run_repository_promotion_gate.py"
          replace_once(
              gate,
              '''    actual_head = git("rev-parse", "HEAD")\n    if actual_head != candidate["head_sha"]:\n        print(f"Promotion gate blocked: checkout HEAD {actual_head} != event head {candidate['head_sha']}", file=sys.stderr)\n        return 1\n''',
              '''    actual_head = git("rev-parse", "HEAD")\n    if actual_head != candidate["head_sha"]:\n        reason = (\n            f"Promotion gate blocked: checkout HEAD {actual_head} != "\n            f"event head {candidate['head_sha']}"\n        )\n        receipt = {\n            "schema_version": "repository-promotion-validation-receipt/v1",\n            "gate": args.gate,\n            "status": "FAIL",\n            "repository": candidate["repository"],\n            "pr_number": candidate["pr_number"],\n            "candidate_head_sha": candidate["head_sha"],\n            "candidate_base_sha": candidate["base_sha"],\n            "base_ref": candidate["base_ref"],\n            "head_ref": candidate["head_ref"],\n            "policy_version": policy["policy_version"],\n            "changed_paths": [],\n            "commands": [],\n            "run_id": os.environ.get("GITHUB_RUN_ID"),\n            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),\n            "created_at": datetime.now(timezone.utc).isoformat(),\n            "reason": reason,\n            "actual_head": actual_head,\n            "proof_ceiling": "Promotion blocked before repository validation because checkout identity is stale.",\n        }\n        args.output.parent.mkdir(parents=True, exist_ok=True)\n        args.output.write_text(json.dumps(receipt, indent=2) + "\\n", encoding="utf-8")\n        print(reason, file=sys.stderr)\n        return 1\n''',
          )

          workflow = ".github/workflows/promotion-candidate.yml"
          guards = [
              ("harness E2E", "harness-receipt", "promotion-harness-receipt.json", "Upload harness E2E receipt"),
              ("application E2E", "application-receipt", "promotion-application-e2e-receipt.json", "Upload application E2E receipt"),
              ("exact-candidate", "candidate-receipt", "promotion-candidate-receipt.json", "Upload exact-candidate receipt"),
          ]
          for label, step_id, filename, upload_name in guards:
              old = f'''      - name: {upload_name}\n        if: always()\n'''
              new = f'''      - name: Detect {label} receipt\n        id: {step_id}\n        if: always() && !cancelled()\n        shell: bash\n        run: |\n          if test -f "$RUNNER_TEMP/{filename}"; then\n            echo "exists=true" >> "$GITHUB_OUTPUT"\n          else\n            echo "exists=false" >> "$GITHUB_OUTPUT"\n          fi\n      - name: {upload_name}\n        if: always() && !cancelled() && steps.{step_id}.outputs.exists == 'true'\n'''
              replace_once(workflow, old, new)

          tests = "tests/test_repository_promotion.py"
          replace_once(
              tests,
              '''        self.assertEqual(text.count("        if: always()"), 3)\n''',
              '''        self.assertEqual(text.count("        if: always() && !cancelled()\\n        shell: bash"), 3)\n        self.assertEqual(text.count("if: always() && !cancelled() && steps."), 3)\n''',
          )
          insertion = '''\n    def test_direct_merge_reconciliation_rejects_malformed_provider_truth(self) -> None:\n        head = "a" * 40\n        integration = "c" * 40\n\n        class BadPullRequestGitHub:\n            repo = "EndeavorEverlasting/web-excel-repair-triage"\n\n            def rest(self, method: str, path: str, body=None):\n                return []\n\n        with self.assertRaisesRegex(github_adapter.ProviderError, "pull-request reconciliation response"):\n            github_adapter.reconcile_direct_merge(BadPullRequestGitHub(), 42, head, "main")\n\n        class BadComparisonGitHub:\n            repo = "EndeavorEverlasting/web-excel-repair-triage"\n\n            def rest(self, method: str, path: str, body=None):\n                if path.endswith("/pulls/42"):\n                    return {\n                        "merged": True,\n                        "merge_commit_sha": integration,\n                        "head": {"sha": head},\n                    }\n                if "/compare/" in path:\n                    return []\n                raise AssertionError(path)\n\n        with self.assertRaisesRegex(github_adapter.ProviderError, "containment response"):\n            github_adapter.reconcile_direct_merge(BadComparisonGitHub(), 42, head, "main")\n\n    def test_checkout_identity_failure_writes_receipt_before_return(self) -> None:\n        text = (ROOT / "scripts/run_repository_promotion_gate.py").read_text(encoding="utf-8")\n        start = text.index('if actual_head != candidate["head_sha"]:')\n        end = text.index("    paths = changed_paths", start)\n        block = text[start:end]\n        self.assertIn("args.output.write_text", block)\n        self.assertLess(block.index("args.output.write_text"), block.index("return 1"))\n        self.assertIn('"status": "FAIL"', block)\n\n'''
          marker = '''    def test_pr_floor_integration_registers_concrete_promotion_pipeline(self) -> None:\n'''
          replace_once(tests, marker, insertion + marker)
          PY

          git rm -f .github/workflows/tmp-pr412-prompt-kit-regenerate.yml
          git rm -f .github/workflows/tmp-pr412-review-repair.yml

          python scripts/build_prompt_kit_registry.py
          python scripts/validate_repository_promotion.py --summary
          python -m unittest -v \
            tests.test_repository_promotion \
            tests.test_pr_merge_gate \
            tests.test_p105_local_first_tutorial_freshness \
            tests.test_sysadminsuite_prompt_registry
          git diff --check
          git status --short
          git diff --stat

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_head" = "$START_HEAD"

          git add -A
          git commit -m "fix(promotion): reconcile review findings and current main"
          git push origin "HEAD:$BRANCH"
