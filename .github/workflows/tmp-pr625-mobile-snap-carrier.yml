name: Temporary PR625 mobile snap carrier

on:
  push:
    branches: [fix/shared-prompt-focus-interaction-20260921]

permissions:
  contents: write

concurrency:
  group: pr625-mobile-snap-carrier
  cancel-in-progress: false

jobs:
  repair-proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/shared-prompt-focus-interaction-20260921
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build and validate source repair
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main fix/shared-prompt-focus-interaction-20260921 --prune
          test "$(git rev-parse origin/main)" = "d0ca894005ace5772a29b79df8b6042a63639d2d"
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-polish.js
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_interactions.py --require-implementation --summary
          python -m unittest tests.test_prompt_kit_selected_prompt tests.test_prompt_kit_discovery tests.test_prompt_kit_interactions_contract tests.test_prompt_kit_mobile -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit canonical artifact and retire carrier
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tmp-pr625-mobile-snap-carrier.yml
          git add web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "fix(ux): restore mobile prompt snap ordering"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Prove mobile and desktop focus behavior
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python tests/prompt_kit_mobile_quick_controls_browser_proof.py
          python tests/prompt_kit_favorite_browser_proof.py --receipt Outputs/observed-proof/favorite-shortcut-receipt.json --screenshot Outputs/observed-proof/favorite-shortcut.png
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - name: Push validated exact head
        run: git push origin HEAD:fix/shared-prompt-focus-interaction-20260921
