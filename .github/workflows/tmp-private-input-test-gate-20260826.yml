name: Temporary private-input test gate builder

on:
  push:
    branches:
      - feat/private-input-test-gate-20260826

permissions:
  contents: write

concurrency:
  group: tmp-private-input-test-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-private-input-gate:
    if: github.repository == 'EndeavorEverlasting/web-excel-repair-triage' && github.ref == 'refs/heads/feat/private-input-test-gate-20260826' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/private-input-test-gate-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned test-floor dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test-floor.txt
      - name: Build, falsify, repair, validate, and self-remove
        env:
          PYTHONHASHSEED: '0'
          TZ: UTC
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
          CI: 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git rev-parse HEAD)" = '93be7dfc139d3b8a68e9fb8934ec7dc00f3b2485' || {
            echo "Unexpected builder parent; refusing stale execution" >&2
            exit 1
          }
          python scripts/tmp_build_private_input_test_gate_20260826.py
