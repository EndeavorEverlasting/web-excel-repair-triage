name: TEMP Prompt Kit mainline mobile repair diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-product-interaction-baseline-diagnostic.yml'

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Switch to exact refreshed main floor
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout --detach origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Apply mainline carrier pre-validation patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new):
              if new in text:
                  return text
              assert text.count(old) == 1, (old, text.count(old))
              return text.replace(old, new, 1)

          polish_path = Path('docs/prompt-kit-polish.js')
          polish = polish_path.read_text(encoding='utf-8')
          for old, new in (
              ('.filter-panel-toggle{min-height:40px;justify-self:end}', '.filter-panel-toggle{display:none!important}'),
              ('.header-top>.search-container{grid-column:1/-1;width:100%}', '.header-top>.search-container{grid-column:1/-1;width:100%}.header-top>.search-container .search-kbd{display:none!important}'),
              ('.header-top>.header-controls{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr);width:100%;justify-items:stretch;gap:8px}', '.header-top>.header-controls{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr);width:100%;justify-items:stretch;gap:8px}.header-top>.header-controls>:not(.cat-tabs){display:none!important}'),
              ('.header-top>.header-controls .cat-tab{min-height:42px}', '.header-top>.header-controls .cat-tab{min-height:42px}.header-top>.header-controls .cat-tab .kbd{display:none!important}'),
          ):
              polish = replace_once(polish, old, new)
          polish_path.write_text(polish, encoding='utf-8')

          contract_path = Path('harness/contracts/prompt-kit-mobile.v1.json')
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          req = next(item for item in contract['requirements'] if item['id'] == 'mobile_medium_orientation_invariant')
          sentence = ' Expanding Filters from More on a mobile medium exposes only the shared filter surfaces; the standalone desktop filter toggle, search/profile keyboard-hint badges, and non-filter header controls stay hidden in portrait and landscape.'
          if sentence.strip() not in req['expected']:
              req['expected'] = req['expected'].rstrip() + sentence
          contract_path.write_text(json.dumps(contract, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test_path = Path('tests/test_prompt_kit_mobile_quick_controls.py')
          test = test_path.read_text(encoding='utf-8')
          if 'def test_mobile_filter_expansion_hides_desktop_only_chrome' not in test:
              anchor = '    def test_contract_and_phone_guide_define_fast_p111_route(self) -> None:\n'
              addition = '''    def test_mobile_filter_expansion_hides_desktop_only_chrome(self) -> None:\n        source = POLISH.read_text(encoding="utf-8")\n        for marker in (\n            ".filter-panel-toggle{display:none!important}",\n            ".header-top>.search-container .search-kbd{display:none!important}",\n            ".header-top>.header-controls>:not(.cat-tabs){display:none!important}",\n            ".header-top>.header-controls .cat-tab .kbd{display:none!important}",\n        ):\n            self.assertIn(marker, source)\n\n        contract = json.loads(CONTRACT.read_text(encoding="utf-8"))\n        requirement = next(item for item in contract["requirements"] if item["id"] == "mobile_medium_orientation_invariant")\n        for phrase in (\n            "Expanding Filters from More",\n            "standalone desktop filter toggle",\n            "keyboard-hint badges",\n            "non-filter header controls",\n            "portrait and landscape",\n        ):\n            self.assertIn(phrase, requirement["expected"])\n\n'''
              assert anchor in test
              test = test.replace(anchor, addition + anchor, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: polish syntax
        continue-on-error: true
        run: node --check docs/prompt-kit-polish.js
      - name: quick-controls tests
        continue-on-error: true
        run: python -m unittest tests.test_prompt_kit_mobile_quick_controls -v
      - name: layout validator
        continue-on-error: true
        run: python scripts/validate_prompt_kit_layout_harness.py --summary
      - name: layout harness tests
        continue-on-error: true
        run: python -m unittest tests.test_prompt_kit_layout_harness -v
      - name: header contract tests
        continue-on-error: true
        run: python -m unittest tests.test_prompt_kit_header_contract -v
      - name: filtering access tests
        continue-on-error: true
        run: python -m unittest tests.test_prompt_kit_filtering_access -v
      - name: mobile tests
        continue-on-error: true
        run: python -m unittest tests.test_prompt_kit_mobile -v
      - name: order-navigation tests
        continue-on-error: true
        run: python -m unittest tests.test_prompt_kit_order_navigation_product -v
