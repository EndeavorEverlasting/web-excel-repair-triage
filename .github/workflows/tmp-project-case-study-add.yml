name: Temporary project case-study prompt contribution

on:
  push:
    branches:
      - feat/project-development-case-study-presentation-20260909
    paths:
      - .github/workflows/tmp-project-case-study-add.yml

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/project-development-case-study-presentation-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Refresh and reconcile current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune --tags
          echo "branch-before=$(git rev-parse HEAD)"
          echo "main=$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          git merge-base --is-ancestor origin/main HEAD
      - name: Add through canonical helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          draft=json.load(open('.tmp-project-case-study-draft.json', encoding='utf-8'))
          forbidden={'id','seq','copySheet'} & set(draft)
          assert not forbidden, forbidden
          print('SEMANTIC_DRAFT_ONLY=true')
          PY
          python scripts/prompt_registry_ops.py add --input .tmp-project-case-study-draft.json --registry spec-architecture-prompts | tee /tmp/add-receipt.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/add-receipt.json', encoding='utf-8'))
          assert p['status']=='added', p
          assert p['registry_id']=='spec-architecture-prompts', p
          assert p['site_parity'] is True, p
          assert p['actionability_policy'], p
          ext=p['external_prior_art']
          assert ext['all_registered_sources_searched'] is True, ext
          print('ADDED_ID='+p['id'])
          print('PROMPT_COUNT='+str(p['prompt_count']))
          print('ALL_REGISTERED_SOURCES_SEARCHED=true')
          PY
      - name: Add focused semantic regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import textwrap
          from pathlib import Path
          receipt=json.load(open('/tmp/add-receipt.json', encoding='utf-8'))
          pid=receipt['id']
          path=Path('tests/test_spec_architecture_prompt_registry.py')
          text=path.read_text(encoding='utf-8')
          marker='\n\nif __name__ == "__main__":'
          assert marker in text
          body=f'''
          def test_{pid.lower()}_builds_evidence_backed_project_case_study_and_demo_deck(self) -> None:
              prompt = self.full["{pid}"]
              content = prompt["copyContent"]
              self.assertEqual(prompt["name"], "Evidence-Backed Project Case Study & Demo Deck Builder")
              self.assertEqual(prompt["type"], "BUILD + ARTIFACT")
              self.assertEqual(prompt["class"], "PROJECT DEVELOPMENT / PORTFOLIO ANALYTICS")
              self.assertEqual(prompt["profile"], "spec-architecture")
              for phrase in (
                  "INSPIRATION / ORIGIN",
                  "FIRST STEPS",
                  "DELIVERY / OUTCOME QUALITY",
                  "WHAT I LEARNED",
                  "HOW I WOULD DO IT AGAIN",
                  "SCALE AND EXPANSION",
                  "SYSTEM-DESIGN ALTERNATIVES",
                  "TIME-SPENT MODEL",
                  "ACTUAL DISTRIBUTION PIE CHARTS",
                  "PERSPECTIVE / COUNTERFACTUAL PIE CHARTS",
                  "MEASURED, DERIVED, ESTIMATED, COUNTERFACTUAL",
                  "BASELINE VECTOR",
                  "SCENARIO VECTOR",
                  "DELTA TABLE",
                  "scenario-data table/sidecar",
                  "sum to 100% within rounding",
                  "AxTask, ASB, Triage",
                  "DATA-ANALYSIS PORTFOLIO VALUE",
              ):
                  self.assertIn(phrase, content)
              self.assertIn("measured, derived, estimated, or counterfactual", prompt["expectedOutput"].lower())
              self.assertIn("outcome-quality claims are tied to supported criteria", prompt["proofGate"].lower())
              self.assertIn("counterfactual pie chart", " ".join(prompt["keywords"]).lower())
              self.assertNotEqual(prompt["id"], "P64")
              self.assertNotEqual(prompt["id"], "P79")
              self.assertEqual(prompt["actionabilityPolicy"], self.policy["policy_id"])
              self.assertIn(self.policy["marker"], content)
          '''
          method=textwrap.indent(textwrap.dedent(body).strip('\n'), '    ')+'\n'
          text=text.replace(marker, '\n\n'+method+marker, 1)
          path.write_text(text, encoding='utf-8')
          print('FOCUSED_REGRESSION_ID='+pid)
          PY
          python -m py_compile tests/test_spec_architecture_prompt_registry.py
      - name: Validate contribution
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_language_audit tests.test_prompt_kit_order_navigation_contract -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python tests/test_prompt_kit_header_contract.py
          git diff --check
      - name: Deliberate second-pass semantic review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.load(open('/tmp/add-receipt.json', encoding='utf-8'))
          pid=receipt['id']
          registry=json.loads(Path('registry/prompts/spec-architecture-prompts.v1.json').read_text(encoding='utf-8'))
          item=next(p for p in registry['prompts'] if p['id']==pid)
          c=item['copyContent']
          checks={
              'origin_arc': all(x in c for x in ['INSPIRATION / ORIGIN','FIRST STEPS','WHAT I LEARNED','HOW I WOULD DO IT AGAIN']),
              'outcome_quality': 'DELIVERY / OUTCOME QUALITY' in c and 'does not prove one decision caused it' in c,
              'scale_design': all(x in c for x in ['SCALE AND EXPANSION','SYSTEM-DESIGN ALTERNATIVES']),
              'actual_pies': 'ACTUAL DISTRIBUTION PIE CHARTS' in c and 'sum to 100% within rounding' in c,
              'counterfactual_model': all(x in c for x in ['BASELINE VECTOR','INTERVENTION','CAUSAL ASSUMPTION','SCENARIO VECTOR','DELTA TABLE']),
              'regenerable_scenarios': 'scenario-data table/sidecar' in c and 'regenerate the perspectives' in c,
              'evidence_classes': all(x in c for x in ['MEASURED','DERIVED','ESTIMATED','COUNTERFACTUAL']),
              'portfolio_analysis': 'DATA-ANALYSIS PORTFOLIO VALUE' in c,
              'real_artifact': 'DO NOT STOP AT AN OUTLINE' in c and 'create the actual files' in c,
              'privacy': 'Remove secrets, private operational details' in c,
          }
          print(json.dumps(checks, indent=2))
          assert all(checks.values()), checks
          PY
          git diff --stat
      - name: Commit durable contribution and remove temporary carriers
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .tmp-project-case-study-draft.json .github/workflows/tmp-project-case-study-prior-art.yml .github/workflows/tmp-project-case-study-add.yml
          git diff --check
          git status --short
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/prompts/spec-architecture-prompts.v1.json tests/test_spec_architecture_prompt_registry.py web/prompt-kit/index.html
          git commit -m "feat(prompt-kit): add project case-study demo deck builder"
          git push origin HEAD:feat/project-development-case-study-presentation-20260909
          echo "DURABLE_HEAD=$(git rev-parse HEAD)"
