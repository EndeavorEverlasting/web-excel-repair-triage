name: Temporary Prompt Artifact Risk Final Reconcile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'feat/prompt-kit-artifact-risk-path-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-artifact-risk-path-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile current main and prove exact Prompt Kit state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          git config user.name 'EndeavorEverlasting'
          git config user.email '71802818+EndeavorEverlasting@users.noreply.github.com'
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_prompt_artifact_risk_path_prompts -v
          python -m unittest tests.test_spec_architecture_prompt_registry tests.test_skill_prompt_registry -v
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_kit_guidance tests.test_prompt_language_audit -v
          python -m unittest tests.test_prompt_kit_order_navigation_contract tests.test_prompt_kit_order_navigation_product -v
          python scripts/evaluate_prompt_language.py --output Outputs/prompt-language-audit.json --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output Outputs/prompt-kit-order-navigation-audit.json --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git push origin HEAD:feat/prompt-kit-artifact-risk-path-20260822
