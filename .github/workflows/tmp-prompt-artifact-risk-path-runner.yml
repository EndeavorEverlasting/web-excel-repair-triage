name: Temporary Prompt Artifact Risk Path Runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-contribution:
    if: github.head_ref == 'feat/prompt-kit-artifact-risk-path-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-artifact-risk-path-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/tmp_prompt_artifact_risk_path_executor.py
