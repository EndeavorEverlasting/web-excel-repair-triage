name: Temporary prompt classification helper contribution

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  contribute:
    if: github.event.pull_request.head.ref == 'feat/prompt-kit-classification-refiner-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-classification-refiner-20260823
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure contributor identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          git status --short
          git log --oneline --decorate -5

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Inspect registry routing and allocate through helper
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py inspect | tee /tmp/prompt-registry-inspect.json
          python scripts/prompt_registry_ops.py add \
            --input .prompt-contrib/prompt-classification-refiner.draft.json \
            --registry spec-architecture-prompts | tee /tmp/prompt-classification-helper-receipt.json

      - name: Prove classification semantics and parity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py validate
          python -m pytest \
            tests/test_prompt_classification_refiner_prompt.py \
            tests/test_spec_architecture_prompt_registry.py \
            -q
          python scripts/build_prompt_kit_registry.py --check
          git diff --check

      - name: Remove temporary contribution transport and push generated result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .prompt-contrib/prompt-classification-refiner.draft.json
          rm -f .github/workflows/tmp-prompt-classification-helper-contribution.yml
          git add -A
          git diff --cached --check
          git commit -m "feat(prompt-kit): add iterative classification refiner"
          git push origin HEAD:feat/prompt-kit-classification-refiner-20260823
