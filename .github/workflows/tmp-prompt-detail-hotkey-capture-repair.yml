name: Temporary Prompt detail hotkey capture repair

on:
  push:
    branches:
      - "feat/prompt-detail-quick-actions-20260914"

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply capture-phase and regression repairs
        run: python scripts/tmp_prompt_detail_hotkey_capture_repair.py
      - name: Regenerate canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Re-run affected static gates twice
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "validation pass=$pass"
            node --check docs/prompt-kit.js
            node --check docs/prompt-kit-polish.js
            python scripts/validate_prompt_kit_interactions.py --require-implementation --summary
            python -m unittest tests.test_prompt_kit_interactions_contract tests.test_prompt_kit_product_interactions tests.test_prompt_kit_cross_input_modality tests.test_prompt_kit_order_navigation_product -v
            python scripts/operant_version.py validate
            python scripts/operant_version.py validate-release-candidate --base origin/main
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
            git diff --check
          done
      - name: Remove transport and commit durable repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-prompt-detail-hotkey-capture-repair.yml
          rm scripts/tmp_prompt_detail_hotkey_capture_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(prompt-kit): route detail Home End before page hotkeys"
          git push origin HEAD:feat/prompt-detail-quick-actions-20260914
