name: Temporary Prompt detail quick-actions carrier

on:
  push:
    branches:
      - feat/prompt-detail-quick-actions-20260914

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply bounded detail-panel interaction repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          js_path = root / 'docs/prompt-kit.js'
          js = js_path.read_text(encoding='utf-8')

          old = "function focusPromptOrigin(){if(promptDetailOrigin&&document.body.contains(promptDetailOrigin)){try{promptDetailOrigin.focus({preventScroll:true})}catch(e){promptDetailOrigin.focus()}}}\nfunction canonicalOpenPrompt(id){"
          new = """function focusPromptOrigin(){if(promptDetailOrigin&&document.body.contains(promptDetailOrigin)){try{promptDetailOrigin.focus({preventScroll:true})}catch(e){promptDetailOrigin.focus()}}}
var promptDetailCopyTimer=null;
function promptDetailScrollBehavior(){try{return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}catch(e){return 'auto'}}
function scrollPromptDetailTo(edge){var el=document.getElementById('promptDetail');if(!el)return false;var top=edge==='top'?0:el.scrollHeight;try{el.scrollTo({top:top,behavior:promptDetailScrollBehavior()})}catch(e){el.scrollTop=top}return true}
function promptDetailHasTextSelection(){try{var selection=window.getSelection&&window.getSelection();return !!(selection&&String(selection).trim())}catch(e){return false}}
function isPromptDetailCopyConflict(target){if(!target)return true;if(promptDetailHasTextSelection())return true;if(!target.closest)return false;return !!target.closest('button,a,input,textarea,select,option,label,summary,details,[role=button],[role=link],[role=textbox],[contenteditable=true],[data-prompt-detail-no-copy]')}
function cancelPromptDetailSurfaceCopy(){if(promptDetailCopyTimer){clearTimeout(promptDetailCopyTimer);promptDetailCopyTimer=null}}
function handlePromptDetailSurfaceCopy(e){var el=document.getElementById('promptDetail');if(!el||!openPromptId||e.target===el.parentElement)return;if(e.detail&&e.detail>1)return;var target=e.target;cancelPromptDetailSurfaceCopy();promptDetailCopyTimer=setTimeout(function(){if(openPromptId&&!isPromptDetailCopyConflict(target))copyPrompt(openPromptId);promptDetailCopyTimer=null},180)}
function handlePromptDetailKeydown(e){if(!openPromptId||e.defaultPrevented||e.altKey||e.metaKey||e.ctrlKey)return;var target=e.target,tag=String(target&&target.tagName||'').toUpperCase();if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||target&&target.isContentEditable)return;if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closePromptDetail();return}if(e.key==='Home'||e.key==='End'){e.preventDefault();e.stopImmediatePropagation();scrollPromptDetailTo(e.key==='Home'?'top':'bottom')}}
function canonicalOpenPrompt(id){"""
          if old not in js:
              raise SystemExit('focus/canonicalOpenPrompt seam not found')
          js = js.replace(old, new, 1)

          old = "var el=document.getElementById('promptDetail');var html='<button class=\"prompt-detail-close\" onclick=\"closePromptDetail()\" aria-label=\"Close prompt detail\">&times;</button>';html+='<div class=\"pd-glow\" style=\"background:'+hex+'\"></div>';html+='<div class=\"pd-header\"><span class=\"pd-id\">'+safeId+'</span><span class=\"pd-name\">'+safeName+'</span></div>';"
          new = "var el=document.getElementById('promptDetail');el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',p.id+' '+p.name+' prompt detail');el.setAttribute('data-prompt-id',p.id);var html='<button class=\"prompt-detail-close\" data-prompt-detail-no-copy type=\"button\" onclick=\"closePromptDetail()\" aria-label=\"Close prompt detail\">&times;</button>';html+='<div class=\"pd-glow\" style=\"background:'+hex+'\"></div>';html+='<div class=\"pd-panel-actions\" data-prompt-detail-no-copy><button class=\"pd-edge-jump\" id=\"promptDetailTop\" type=\"button\" aria-label=\"Go to top of prompt detail\" aria-keyshortcuts=\"Home\" title=\"Top of panel (Home)\">&#8593; Top</button><span class=\"pd-panel-hint\">Click a non-control area to copy · Home/End jump</span><button class=\"pd-copy pd-copy-compact\" id=\"promptDetailCopyTop\" type=\"button\">Copy</button><button class=\"pd-edge-jump\" id=\"promptDetailBottom\" type=\"button\" aria-label=\"Go to bottom of prompt detail\" aria-keyshortcuts=\"End\" title=\"Bottom of panel (End)\">Bottom &#8595;</button></div>';html+='<div class=\"pd-header\"><span class=\"pd-id\">'+safeId+'</span><span class=\"pd-name\">'+safeName+'</span></div>';"
          if old not in js:
              raise SystemExit('canonicalOpenPrompt markup seam not found')
          js = js.replace(old, new, 1)

          old = "html+='<button class=\"pd-copy\" id=\"promptDetailCopy\" type=\"button\">Copy to Clipboard</button>';el.innerHTML=html;var detailCopy=document.getElementById('promptDetailCopy');if(detailCopy){detailCopy.onclick=function(){copyPrompt(p.id);detailCopy.classList.add('copied');detailCopy.textContent='Copied!';setTimeout(function(){detailCopy.classList.remove('copied');detailCopy.textContent='Copy to Clipboard'},1500)}}document.getElementById('promptDetailOverlay').classList.add('open');var closeButton=el.querySelector('.prompt-detail-close');if(closeButton)closeButton.focus()}"
          new = """html+='<button class="pd-copy" id="promptDetailCopy" data-prompt-detail-no-copy type="button">Copy to Clipboard</button>';el.innerHTML=html;var markCopied=function(button,label){if(!button)return;button.classList.add('copied');button.textContent='Copied!';setTimeout(function(){button.classList.remove('copied');button.textContent=label},1500)};var detailCopy=document.getElementById('promptDetailCopy'),detailCopyTop=document.getElementById('promptDetailCopyTop');if(detailCopy){detailCopy.onclick=function(e){e.stopPropagation();copyPrompt(p.id);markCopied(detailCopy,'Copy to Clipboard')}}if(detailCopyTop){detailCopyTop.onclick=function(e){e.stopPropagation();copyPrompt(p.id);markCopied(detailCopyTop,'Copy')}}var topJump=document.getElementById('promptDetailTop'),bottomJump=document.getElementById('promptDetailBottom');if(topJump)topJump.onclick=function(e){e.stopPropagation();scrollPromptDetailTo('top')};if(bottomJump)bottomJump.onclick=function(e){e.stopPropagation();scrollPromptDetailTo('bottom')};el.onclick=handlePromptDetailSurfaceCopy;el.ondblclick=cancelPromptDetailSurfaceCopy;el.onkeydown=handlePromptDetailKeydown;document.getElementById('promptDetailOverlay').classList.add('open');el.scrollTop=0;var closeButton=el.querySelector('.prompt-detail-close');if(closeButton)closeButton.focus()}"""
          if old not in js:
              raise SystemExit('canonicalOpenPrompt action seam not found')
          js = js.replace(old, new, 1)

          old = "function closePromptDetail(restoreFocus){canonicalClosePrompt(openPromptId);if(openPromptId)openPromptId=null;syncPromptListDOM();if(restoreFocus!==false)focusPromptOrigin()}"
          new = "function closePromptDetail(restoreFocus){cancelPromptDetailSurfaceCopy();canonicalClosePrompt(openPromptId);if(openPromptId)openPromptId=null;syncPromptListDOM();if(restoreFocus!==false)focusPromptOrigin()}"
          if old not in js:
              raise SystemExit('closePromptDetail seam not found')
          js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8')

          renderer_path = root / 'build_prompt_kit.py'
          renderer = renderer_path.read_text(encoding='utf-8')
          needle = ".prompt-detail-close:hover{background:var(--bg-card);color:var(--text-primary)}\n"
          addition = """.prompt-detail-close:hover{background:var(--bg-card);color:var(--text-primary)}
.pd-panel-actions{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px;margin:-4px 34px 16px 0;padding:8px;background:rgba(17,24,39,.96);border:1px solid var(--border);border-radius:9px;backdrop-filter:blur(10px)}
.pd-panel-hint{min-width:0;color:var(--text-muted);font-size:10px;line-height:1.3;text-align:center;white-space:normal}.pd-edge-jump,.pd-copy-compact{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:6px 9px;border:1px solid var(--border);border-radius:7px;background:var(--bg-surface);color:var(--text-secondary);font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s}.pd-edge-jump:hover,.pd-edge-jump:focus-visible,.pd-copy-compact:hover,.pd-copy-compact:focus-visible{outline:none;border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
@media(max-width:760px){.pd-panel-actions{grid-template-columns:auto 1fr auto;margin-right:0;top:0}.pd-panel-hint{display:none}.pd-copy-compact{min-height:40px}.pd-edge-jump{min-height:40px}}
"""
          if needle not in renderer:
              raise SystemExit('renderer detail-close style seam not found')
          renderer = renderer.replace(needle, addition, 1)
          renderer_path.write_text(renderer, encoding='utf-8')

          contract_path = root / 'harness/contracts/prompt-kit-interactions.v1.json'
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          reqs = contract['requirements']
          existing = {item['id'] for item in reqs}
          additions = [
              {
                  'id': 'detail_surface_click_copy',
                  'event': 'single pointer click or touch tap on a non-conflicting, non-control area inside an open prompt detail panel',
                  'expected': 'Copy the open prompt exact copyContent through the canonical copyPrompt path. Ignore buttons, links, form/editable controls, explicit no-copy regions, active text selection, and multi-click gestures so reading, feedback, navigation, selection, and other controls retain their own behavior.',
                  'forbidden': 'Copying from backdrop clicks, button/link/form activation, text selection, double-click gestures, or any interaction that already owns another action.'
              },
              {
                  'id': 'detail_local_edge_navigation',
                  'event': 'activate Top/Bottom inside an open prompt detail panel or press Home/End while the detail surface owns keyboard context',
                  'expected': 'Scroll the prompt detail container itself to its top or bottom while keeping the modal open. Home/End are panel-local while detail is open, and text-editing controls retain native Home/End behavior.',
                  'forbidden': 'Scrolling the underlying page, moving prompt-list selection, closing the detail, or hijacking Home/End inside an input, textarea, select, or editable field.'
              },
          ]
          for item in additions:
              if item['id'] not in existing:
                  reqs.append(item)
          contract['validation']['browser_field_gate'] = 'Observe detail non-control click-to-copy conflict guards, detail Top/Bottom controls, modal-local Home/End, text-editing Home/End preservation, plus existing card copy/open/backdrop/focus/Escape behavior in the canonical Prompt Kit website.'
          contract_path.write_text(json.dumps(contract, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          modality_path = root / 'harness/contracts/prompt-kit-cross-input-modality.v1.json'
          modality = json.loads(modality_path.read_text(encoding='utf-8'))
          by_id = {item['id']: item for item in modality['capabilities']}
          copy_act = by_id['copy_act']
          copy_act['mouse'] = 'Copy button; single-click card; inside an open detail panel, click any non-conflicting non-control surface'
          copy_act['keyboard'] = 'Space on focused card; configured/recommended prompt sequences (copy + reveal); explicit Copy remains available in detail'
          copy_act['phone'] = 'Tap/click any non-control prompt-card surface; inside deliberate detail Open, tap a non-conflicting non-control panel surface or explicit Copy'
          copy_act['proof'] = 'prompt-kit-interactions whole-card/detail safe-surface copy + mobile browser proof'
          scroll = by_id['scroll_edges']
          scroll['mouse'] = 'Page Top/Bottom links; open detail has sticky panel-local Top/Bottom controls'
          scroll['keyboard'] = 'Home / End target the active surface: prompt detail container while detail is open, otherwise the page/list context'
          scroll['phone'] = 'More → page Top / Bottom; open detail has visible panel-local Top/Bottom controls'
          scroll['semantic_action'] = 'scrollPromptKitTo / scrollPromptDetailTo'
          scroll['state_owner'] = 'window scroll position / #promptDetail scroll position'
          scroll['proof'] = 'mobile quick controls page markers + prompt-kit-interactions detail edge-navigation markers'
          modality_path.write_text(json.dumps(modality, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          validator_path = root / 'scripts/validate_prompt_kit_interactions.py'
          validator = validator_path.read_text(encoding='utf-8')
          old_ids = '''REQUIRED_REQUIREMENT_IDS = {
    "single_click_copy",
    "double_click_expand",
    "outside_click_collapse_restore",
    "escape_close_preserved",
    "copy_button_compatibility",
}'''
          new_ids = '''REQUIRED_REQUIREMENT_IDS = {
    "single_click_copy",
    "double_click_expand",
    "outside_click_collapse_restore",
    "escape_close_preserved",
    "copy_button_compatibility",
    "detail_surface_click_copy",
    "detail_local_edge_navigation",
}'''
          if old_ids not in validator:
              raise SystemExit('validator requirement-id seam not found')
          validator = validator.replace(old_ids, new_ids, 1)
          old_return = '''        "copy_button_compatibility": bool(button_body and "copyPrompt(" in button_body and "stopPropagation" in button_body),
    }'''
          new_return = '''        "copy_button_compatibility": bool(button_body and "copyPrompt(" in button_body and "stopPropagation" in button_body),
        "detail_surface_click_copy": bool(
            "function handlePromptDetailSurfaceCopy" in js
            and "isPromptDetailCopyConflict" in js
            and "promptDetailHasTextSelection" in js
            and "copyPrompt(openPromptId)" in js
            and "[data-prompt-detail-no-copy]" in js
        ),
        "detail_local_edge_navigation": bool(
            "function scrollPromptDetailTo(edge)" in js
            and "function handlePromptDetailKeydown" in js
            and "e.key==='Home'||e.key==='End'" in js
            and "scrollPromptDetailTo(e.key==='Home'?'top':'bottom')" in js
            and "promptDetailTop" in js
            and "promptDetailBottom" in js
        ),
    }'''
          if old_return not in validator:
              raise SystemExit('validator evaluate_source return seam not found')
          validator = validator.replace(old_return, new_return, 1)
          validator_path.write_text(validator, encoding='utf-8')

          test_path = root / 'tests/test_prompt_kit_interactions_contract.py'
          test = test_path.read_text(encoding='utf-8')
          old_synthetic = '''        btn.onclick=function(e){e.stopPropagation();copyPrompt(p.id)};
        document.addEventListener('keydown',function(e){'''
          new_synthetic = '''        btn.onclick=function(e){e.stopPropagation();copyPrompt(p.id)};
        function promptDetailHasTextSelection(){return false}
        function isPromptDetailCopyConflict(target){return target.closest('[data-prompt-detail-no-copy]')}
        function handlePromptDetailSurfaceCopy(e){if(isPromptDetailCopyConflict(e.target))return;copyPrompt(openPromptId)}
        function scrollPromptDetailTo(edge){return true}
        function handlePromptDetailKeydown(e){if(e.key==='Home'||e.key==='End'){scrollPromptDetailTo(e.key==='Home'?'top':'bottom')}}
        var promptDetailTop=true,promptDetailBottom=true;
        document.addEventListener('keydown',function(e){'''
          if old_synthetic not in test:
              raise SystemExit('contract test synthetic seam not found')
          test = test.replace(old_synthetic, new_synthetic, 1)
          marker = '''        self.assertIn("must not have to scroll through a detail modal", single["expected"])
'''
          addition = '''        self.assertIn("must not have to scroll through a detail modal", single["expected"])
        detail_copy = next(item for item in contract["requirements"] if item["id"] == "detail_surface_click_copy")
        self.assertIn("non-conflicting", detail_copy["event"])
        self.assertIn("active text selection", detail_copy["expected"])
        detail_edges = next(item for item in contract["requirements"] if item["id"] == "detail_local_edge_navigation")
        self.assertIn("Home/End are panel-local", detail_edges["expected"])
'''
          if marker not in test:
              raise SystemExit('contract test marker seam not found')
          test = test.replace(marker, addition, 1)
          test_path.write_text(test, encoding='utf-8')

          product_path = root / 'tests/test_prompt_kit_product_interactions.py'
          product = product_path.read_text(encoding='utf-8')
          old_method = '''    def test_single_click_copy_is_disambiguated_from_double_click_expand(self) -> None:
        js = JS.read_text(encoding="utf-8")
        self.assertRegex(
            js,
            re.compile(
                r"card\\.onclick=function\\(e\\)\\{cancelPromptCardCopy\\(card\\);"
                r"card\\._copyTimer=setTimeout\\(function\\(\\)\\{copyPrompt\\(p\\.id\\);"
                r"card\\._copyTimer=null\\},300\\)\\};"
            ),
        )
        self.assertIn(
            "card.ondblclick=function(e){cancelPromptCardCopy(card);e.preventDefault();showPromptDetail(p.id,card)};",
            js,
        )
        self.assertIn("function cancelPromptCardCopy(card)", js)
'''
          new_method = '''    def test_single_click_copy_is_disambiguated_from_double_click_expand(self) -> None:
        js = JS.read_text(encoding="utf-8")
        self.assertIn("if(e.target.closest&&e.target.closest('button'))return", js)
        self.assertIn("selectPrompt(p.id,'pointer');cancelPromptCardCopy(card)", js)
        self.assertIn("card._copyTimer=setTimeout(function(){copyPrompt(p.id);card._copyTimer=null},160)", js)
        self.assertIn(
            "card.ondblclick=function(e){cancelPromptCardCopy(card);e.preventDefault();selectPrompt(p.id,'pointer');showPromptDetail(p.id,card)};",
            js,
        )
        self.assertIn("function cancelPromptCardCopy(card)", js)
'''
          if old_method not in product:
              raise SystemExit('stale card interaction test seam not found')
          product = product.replace(old_method, new_method, 1)

          start = product.index('    def test_prompt_cards_remain_keyboard_accessible_without_nested_button_semantics')
          end = product.index('    def test_prompt_fields_are_escaped_before_card_or_detail_html', start)
          replacement = '''    def test_prompt_cards_remain_keyboard_accessible_without_nested_button_semantics(self) -> None:
        js = JS.read_text(encoding="utf-8")
        self.assertIn("card.tabIndex=isRoving?0:-1", js)
        self.assertIn("card.setAttribute('role','option')", js)
        self.assertIn("card.setAttribute('aria-selected',String(isSelected))", js)
        self.assertNotIn("card.setAttribute('role','button')", js)
        self.assertIn("Double-click or press Enter to inspect", js)
        self.assertIn("if(e.key==='Enter')", js)
        self.assertIn("showPromptDetail(p.id,card)", js)
        self.assertIn("else if(e.key===' ')", js)
        self.assertIn("copyPrompt(p.id)", js)
        self.assertIn("openBtn.className='prompt-open-btn'", js)
        self.assertIn("btn.className='prompt-copy-btn'", js)

'''
          product = product[:start] + replacement + product[end:]

          insertion_point = '''    def test_checked_in_site_contains_current_interaction_and_navigation_source(self) -> None:
'''
          new_tests = '''    def test_detail_panel_click_copy_is_safe_and_conflict_aware(self) -> None:
        js = JS.read_text(encoding="utf-8")
        for marker in (
            "function handlePromptDetailSurfaceCopy(e)",
            "function isPromptDetailCopyConflict(target)",
            "function promptDetailHasTextSelection()",
            "function cancelPromptDetailSurfaceCopy()",
            "copyPrompt(openPromptId)",
            "[data-prompt-detail-no-copy]",
            "if(e.detail&&e.detail>1)return",
            "el.onclick=handlePromptDetailSurfaceCopy",
            "el.ondblclick=cancelPromptDetailSurfaceCopy",
            "el.setAttribute('role','dialog')",
            "el.setAttribute('aria-modal','true')",
        ):
            self.assertIn(marker, js)

    def test_detail_panel_has_local_edge_controls_and_home_end_hotkeys(self) -> None:
        js = JS.read_text(encoding="utf-8")
        for marker in (
            "function scrollPromptDetailTo(edge)",
            "id=\\\"promptDetailTop\\\"",
            "id=\\\"promptDetailBottom\\\"",
            "Home/End jump",
            "aria-keyshortcuts=\\\"Home\\\"",
            "aria-keyshortcuts=\\\"End\\\"",
            "function handlePromptDetailKeydown(e)",
            "e.key==='Home'||e.key==='End'",
            "scrollPromptDetailTo(e.key==='Home'?'top':'bottom')",
            "el.onkeydown=handlePromptDetailKeydown",
        ):
            self.assertIn(marker, js)
        self.assertIn("tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'", js)
        self.assertIn("if(e.key==='Escape')", js)

'''
          if insertion_point not in product:
              raise SystemExit('product test insertion seam not found')
          product = product.replace(insertion_point, new_tests + insertion_point, 1)
          product_path.write_text(product, encoding='utf-8')

          cross_path = root / 'tests/test_prompt_kit_cross_input_modality.py'
          cross = cross_path.read_text(encoding='utf-8')
          insertion_point = '''    def test_generated_site_embeds_converged_reference_route(self) -> None:
'''
          new_cross = '''    def test_detail_copy_and_edge_navigation_converge_across_modes(self) -> None:
        payload = json.loads(CONTRACT.read_text(encoding="utf-8"))
        by_id = {item["id"]: item for item in payload["capabilities"]}
        self.assertIn("open detail panel", by_id["copy_act"]["mouse"])
        self.assertIn("non-conflicting", by_id["copy_act"]["mouse"])
        self.assertIn("panel-local Top/Bottom", by_id["scroll_edges"]["mouse"])
        self.assertIn("active surface", by_id["scroll_edges"]["keyboard"])
        self.assertIn("prompt detail container", by_id["scroll_edges"]["keyboard"])
        self.assertEqual(by_id["scroll_edges"]["semantic_action"], "scrollPromptKitTo / scrollPromptDetailTo")

'''
          if insertion_point not in cross:
              raise SystemExit('cross-input test insertion seam not found')
          cross = cross.replace(insertion_point, new_cross + insertion_point, 1)
          cross_path.write_text(cross, encoding='utf-8')
          PY

      - name: Regenerate canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Focused validation pass 1
        run: |
          python scripts/validate_prompt_kit_interactions.py --require-implementation --output Outputs/prompt-kit-interaction-audit.json --summary
          python -m unittest tests.test_prompt_kit_interactions_contract tests.test_prompt_kit_product_interactions tests.test_prompt_kit_cross_input_modality -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m py_compile scripts/validate_prompt_kit_interactions.py tests/test_prompt_kit_interactions_contract.py tests/test_prompt_kit_product_interactions.py tests/test_prompt_kit_cross_input_modality.py
          git diff --check

      - name: Falsification pass
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          js=Path('docs/prompt-kit.js').read_text(encoding='utf-8')
          required=[
            "button,a,input,textarea,select,option,label,summary,details",
            "promptDetailHasTextSelection",
            "if(e.detail&&e.detail>1)return",
            "el.onclick=handlePromptDetailSurfaceCopy",
            "el.ondblclick=cancelPromptDetailSurfaceCopy",
            "el.onkeydown=handlePromptDetailKeydown",
            "e.stopImmediatePropagation()",
            "scrollPromptDetailTo(e.key==='Home'?'top':'bottom')",
            "data-prompt-detail-no-copy",
          ]
          missing=[m for m in required if m not in js]
          if missing: raise SystemExit('missing detail safeguards: '+repr(missing))
          if js.count('id="promptDetailTop"') != 1 or js.count('id="promptDetailBottom"') != 1:
              raise SystemExit('detail edge controls are not unique in canonical runtime')
          print('detail interaction falsification markers: PASS')
          PY
          python scripts/validate_prompt_kit_interactions.py --require-implementation --summary
          python -m unittest tests.test_prompt_kit_interactions_contract tests.test_prompt_kit_product_interactions tests.test_prompt_kit_cross_input_modality -v
          git diff --check

      - name: Remove carrier and commit durable result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-prompt-detail-quick-actions-carrier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(prompt-kit): add prompt detail quick actions"
          git push origin HEAD:feat/prompt-detail-quick-actions-20260914
