name: Temporary Prompt Kit canonical refresh 169

on:
  push:
    branches:
      - feat/prompt-kit-chat-continuation-all-reset-20260810

permissions:
  contents: write

jobs:
  refresh-canonical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-chat-continuation-all-reset-20260810
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate only the canonical Prompt Kit artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "EndeavorEverlasting/web-excel-repair-triage"
          test "$(git branch --show-current)" = "feat/prompt-kit-chat-continuation-all-reset-20260810"
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          git diff --check
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -v '^web/prompt-kit/index.html$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated/worktree changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet -- web/prompt-kit/index.html; then
            echo 'Canonical Prompt Kit already current.'
            exit 0
          fi
          git add -- web/prompt-kit/index.html
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(prompt-kit): refresh canonical website'
          git push origin HEAD:feat/prompt-kit-chat-continuation-all-reset-20260810
