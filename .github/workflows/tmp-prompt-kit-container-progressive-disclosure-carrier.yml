name: Temporary Prompt Kit container progressive disclosure carrier

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: prompt-kit-container-progressive-disclosure-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/prompt-kit-container-progressive-disclosure-20260905'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-container-progressive-disclosure-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Implement, prove, and push progressive-disclosure prompt repair
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f scripts/tmp_apply_container_progressive_disclosure.py ]; then
            echo 'container progressive-disclosure repair already materialized; no transport work remains'
            exit 0
          fi
          python scripts/tmp_apply_container_progressive_disclosure.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_prompt_registry_expansion_regression_design_teach -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git rm -f scripts/tmp_apply_container_progressive_disclosure.py scripts/tmp_container_progressive_disclosure_trigger.txt .github/workflows/tmp-prompt-kit-container-progressive-disclosure-carrier.yml
          git add registry/prompts/spec-architecture-prompts.v1.json tests/test_prompt_registry_expansion_regression_design_teach.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'feat(prompt-kit): demand-load deployment topology detail'
          python -m unittest tests.test_prompt_registry_expansion_regression_design_teach -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/prompt-kit-container-progressive-disclosure-20260905
