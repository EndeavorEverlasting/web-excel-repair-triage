name: Temporary Prompt Kit container progressive disclosure reconciliation carrier

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: prompt-kit-container-progressive-disclosure-reconcile-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/prompt-kit-container-progressive-disclosure-20260905'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-container-progressive-disclosure-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Reconcile mobile main, rebuild, prove, and push
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/prompt-kit-container-progressive-disclosure-20260905 --prune
          if [ ! -f scripts/tmp_container_progressive_disclosure_reconcile_trigger.txt ]; then
            echo 'reconciliation already materialized; no transport work remains'
            exit 0
          fi
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "web/prompt-kit/index.html" ]; then
              echo "unexpected merge conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              git merge --abort || true
              exit 2
            fi
            git checkout --theirs web/prompt-kit/index.html
            git add web/prompt-kit/index.html
          fi
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_prompt_registry_expansion_regression_design_teach tests.test_prompt_kit_mobile -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git rm -f scripts/tmp_container_progressive_disclosure_reconcile_trigger.txt .github/workflows/tmp-prompt-kit-container-progressive-disclosure-carrier.yml
          git add -A
          git diff --cached --check
          git commit -m 'merge(prompt-kit): reconcile deployment guidance with mobile main'
          python -m unittest tests.test_prompt_registry_expansion_regression_design_teach tests.test_prompt_kit_mobile -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/prompt-kit-container-progressive-disclosure-20260905
