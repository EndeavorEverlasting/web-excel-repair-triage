name: Temporary Prompt Kit external fallback review repair

on:
  push:
    branches:
      - feat/prompt-kit-external-fallback-routing-20260908

permissions:
  contents: write

concurrency:
  group: prompt-kit-external-fallback-review-repair-20260908
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-external-fallback-routing-20260908
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh exact floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/prompt-kit-external-fallback-routing-20260908 --prune
          test "$(git rev-parse origin/main)" = "947dd607eac4eda3ea47ce99c75c2a7121a87832"
          test "$(git merge-base origin/main HEAD)" = "947dd607eac4eda3ea47ce99c75c2a7121a87832"
          git status --short
          git branch --show-current
          git log --oneline --decorate -5

      - name: Apply bounded review repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_prompt_kit_external_fallback_review_repair.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Validate repair before durable commit
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/prompt-kit-external-resources.js
          node --check docs/prompt-kit-guided-recommendations.js
          python -m py_compile tests/prompt_kit_external_resources_browser_proof.py
          python -m unittest tests.test_external_prior_art_gate tests.test_operant_external_resources -v
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_kit_guidance -v
          python scripts/validate_operant_external_resources.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_harness.py
          git diff --check

      - name: Commit repair before exact-head browser proof
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/PROMPT_FINDER_QUESTIONNAIRE_TUTORIAL.md \
            docs/prompt-kit-external-resources.js \
            tests/test_operant_external_resources.py \
            tests/prompt_kit_external_resources_browser_proof.py \
            web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "fix(prompt-kit): pin fallback sources and restore focus"
          git push origin HEAD:feat/prompt-kit-external-fallback-routing-20260908
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Observe repaired browser behavior on clean exact head
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
          mkdir -p Outputs/observed-proof
          python tests/prompt_kit_external_resources_browser_proof.py \
            --receipt Outputs/observed-proof/external-resource-review-repair.json \
            --screenshot Outputs/observed-proof/external-resource-review-repair.png
          python scripts/validate_observed_behavior_proof.py Outputs/observed-proof/external-resource-review-repair.json

      - name: Deliberate second-pass falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          runtime = Path('docs/prompt-kit-external-resources.js').read_text(encoding='utf-8')
          tutorial = Path('docs/PROMPT_FINDER_QUESTIONNAIRE_TUTORIAL.md').read_text(encoding='utf-8')
          receipt = json.loads(Path('Outputs/observed-proof/external-resource-review-repair.json').read_text(encoding='utf-8'))
          obs = {row['id']: row for row in receipt['observations']}
          checks = {
              'source cards are SHA pinned': "catalogPath?'/blob/'+sha+'/'+catalogPath:'/tree/'+sha" in runtime,
              'moving repository-root source card removed': "return repository?'https://github.com/'+repository:'#'" not in runtime,
              'focus origin retained': 'externalResourceOrigin' in runtime,
              'hidden async focus guarded': 'if(!surface.hidden)input.focus()' in runtime,
              'close restores connected origin': 'document.contains(origin)' in runtime,
              'browser floor links pinned': obs['source_floor_links_are_commit_pinned']['passed'],
              'browser focus restoration': obs['resource_close_restores_keyboard_origin']['passed'],
              'tutorial describes pinning': 'commit-pinned repository links' in tutorial,
              'tutorial describes focus restoration': 'Closing Resources returns keyboard focus' in tutorial,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'review-repair fixed-point failures: {failed}')
          PY
          node --check docs/prompt-kit-external-resources.js
          python -m unittest tests.test_external_prior_art_gate tests.test_operant_external_resources -v
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_kit_guidance -v
          python scripts/validate_operant_external_resources.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Remove temporary transport and verify final branch scope
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/tmp-prompt-kit-external-fallback-review-repair.yml \
            scripts/tmp_prompt_kit_external_fallback_review_repair.py
          git commit -m "chore: remove external fallback review carrier"
          git push origin HEAD:feat/prompt-kit-external-fallback-routing-20260908
          git fetch origin main feat/prompt-kit-external-fallback-routing-20260908 --prune
          test "$(git rev-parse origin/main)" = "947dd607eac4eda3ea47ce99c75c2a7121a87832"
          test "$(git merge-base origin/main origin/feat/prompt-kit-external-fallback-routing-20260908)" = "947dd607eac4eda3ea47ce99c75c2a7121a87832"
          python - <<'PY'
          import subprocess
          expected = {
              'docs/PROMPT_FINDER_QUESTIONNAIRE_TUTORIAL.md',
              'docs/prompt-kit-external-resources.js',
              'docs/prompt-kit-guided-recommendations.js',
              'tests/prompt_kit_external_resources_browser_proof.py',
              'tests/test_operant_external_resources.py',
              'web/prompt-kit/index.html',
          }
          actual = set(subprocess.check_output([
              'git','diff','--name-only','origin/main...origin/feat/prompt-kit-external-fallback-routing-20260908'
          ], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected final branch scope: {sorted(actual)}')
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
