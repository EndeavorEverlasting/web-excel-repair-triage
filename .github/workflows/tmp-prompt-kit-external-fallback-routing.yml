name: Temporary Prompt Kit external fallback routing sprint

on:
  push:
    branches:
      - feat/prompt-kit-external-fallback-routing-20260908

permissions:
  contents: write

concurrency:
  group: prompt-kit-external-fallback-routing-20260908
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-external-fallback-routing-20260908
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh exact repository floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/prompt-kit-external-fallback-routing-20260908 --prune
          test "$(git merge-base HEAD origin/main)" = "6405c27d465c2d86de09357bb495f8a3f5359960"
          test "$(git rev-parse origin/main)" = "6405c27d465c2d86de09357bb495f8a3f5359960"
          git status --short
          git branch --show-current
          git log --oneline --decorate -5

      - name: Implement bounded fallback routing
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_prompt_kit_external_fallback_carrier.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Validate pass 1
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/prompt-kit-guided-recommendations.js
          node --check docs/prompt-kit-external-resources.js
          python -m unittest tests.test_operant_external_resources -v
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_kit_guidance -v
          python scripts/validate_operant_external_resources.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/validate_harness.py
          git diff --check

      - name: Deliberate second-pass falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          guided = Path('docs/prompt-kit-guided-recommendations.js').read_text(encoding='utf-8')
          resources = Path('docs/prompt-kit-external-resources.js').read_text(encoding='utf-8')
          tutorial = Path('docs/PROMPT_FINDER_QUESTIONNAIRE_TUTORIAL.md').read_text(encoding='utf-8')
          site = Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          checks = {
              'internal-first external escape': 'data-finder-external' in guided and 'OperantExternalResources.openForUseCase' in guided,
              'deterministic query order': "var order=['goal','problemKnown','shape','startingPoint']" in guided,
              'registered floor source cards': 'externalResourceIndex.source_floor' in resources and 'function renderExternalSourceChoices()' in resources,
              'prompts.chat fallback preference': 'catalogBonus' in resources,
              'all requested donors documented': all(repo in tutorial for repo in ('f/prompts.chat','mattpocock/skills','deepseek-ai/deepseek-harness')),
              'generated parity markers': 'data-finder-external' in site and 'openForUseCase:openExternalResourcesForUseCase' in site,
              'obsolete no-match loop removed': 'No registered prompt matched strongly enough. Search for P65' not in guided,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'external fallback second-pass falsification failed: {failed}')
          PY
          node --check docs/prompt-kit-guided-recommendations.js
          node --check docs/prompt-kit-external-resources.js
          python -m unittest tests.test_operant_external_resources -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Commit durable slice and self-remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-prompt-kit-external-fallback-routing.yml scripts/tmp_prompt_kit_external_fallback_carrier.py
          git add docs/prompt-kit-guided-recommendations.js docs/prompt-kit-external-resources.js docs/PROMPT_FINDER_QUESTIONNAIRE_TUTORIAL.md tests/test_operant_external_resources.py web/prompt-kit/index.html
          git diff --cached --check
          python - <<'PY'
          import subprocess
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          expected = {
              '.github/workflows/tmp-prompt-kit-external-fallback-routing.yml',
              'scripts/tmp_prompt_kit_external_fallback_carrier.py',
              'docs/prompt-kit-guided-recommendations.js',
              'docs/prompt-kit-external-resources.js',
              'docs/PROMPT_FINDER_QUESTIONNAIRE_TUTORIAL.md',
              'tests/test_operant_external_resources.py',
              'web/prompt-kit/index.html',
          }
          if actual != expected:
              raise SystemExit(f'unexpected staged scope: {sorted(actual)}')
          PY
          git commit -m "feat(prompt-kit): route tutorial gaps to external resources"
          git push origin HEAD:feat/prompt-kit-external-fallback-routing-20260908
