var PROMPT_KIT_USAGE_STORAGE_KEY='promptKit.usage.v1';
var PROMPT_KIT_USAGE_SCHEMA='prompt-kit-usage/v1';
var PROMPT_KIT_LEVEL_SIZE=5;
var promptUsageState=loadPromptUsageState();

function emptyPromptUsageState(){return{schema:PROMPT_KIT_USAGE_SCHEMA,totalCopies:0,byPrompt:{},recent:[]}}

function loadPromptUsageState(){
  var state=emptyPromptUsageState();
  try{
    if(!window.localStorage)return state;
    var raw=window.localStorage.getItem(PROMPT_KIT_USAGE_STORAGE_KEY);
    if(!raw)return state;
    var parsed=JSON.parse(raw);
    if(!parsed||parsed.schema!==PROMPT_KIT_USAGE_SCHEMA)return state;
    state.totalCopies=Math.max(0,Number(parsed.totalCopies)||0);
    state.recent=Array.isArray(parsed.recent)?parsed.recent.filter(function(id){return /^P\d+$/.test(String(id||''))}).slice(0,12):[];
    if(parsed.byPrompt&&typeof parsed.byPrompt==='object'){
      Object.keys(parsed.byPrompt).forEach(function(id){
        if(!/^P\d+$/.test(id))return;
        var item=parsed.byPrompt[id]||{};
        var count=Math.max(0,Number(item.count)||0);
        if(count)state.byPrompt[id]={count:count,lastCopiedAt:item.lastCopiedAt||null}
      })
    }
  }catch(e){}
  return state
}

function savePromptUsageState(){
  try{if(window.localStorage)window.localStorage.setItem(PROMPT_KIT_USAGE_STORAGE_KEY,JSON.stringify(promptUsageState));return true}catch(e){return false}
}

function recordPromptCopy(id){
  var prompt=PROMPTS.find(function(item){return item.id===id});
  if(!prompt)return false;
  var now=new Date().toISOString();
  var current=promptUsageState.byPrompt[id]||{count:0,lastCopiedAt:null};
  current.count+=1;
  current.lastCopiedAt=now;
  promptUsageState.byPrompt[id]=current;
  promptUsageState.totalCopies+=1;
  promptUsageState.recent=[id].concat(promptUsageState.recent.filter(function(item){return item!==id})).slice(0,12);
  savePromptUsageState();
  renderPreferenceDashboard();
  return true
}

function promptUsageRows(){
  return Object.keys(promptUsageState.byPrompt).map(function(id){
    var prompt=PROMPTS.find(function(item){return item.id===id});
    return prompt?{prompt:prompt,count:promptUsageState.byPrompt[id].count}:null
  }).filter(Boolean).sort(function(a,b){return b.count-a.count||Number(a.prompt.seq)-Number(b.prompt.seq)})
}

function favoritePromptCount(){
  return PROMPTS.reduce(function(total,prompt){return total+(typeof isFavoritePrompt==='function'&&isFavoritePrompt(prompt.id)?1:0)},0)
}

function promptPreferenceSignals(){
  var buckets={};
  promptUsageRows().forEach(function(row){
    var key=String(row.prompt.type||row.prompt.class||'Other');
    buckets[key]=(buckets[key]||0)+row.count
  });
  return Object.keys(buckets).map(function(key){return{label:key,count:buckets[key]}}).sort(function(a,b){return b.count-a.count||a.label.localeCompare(b.label)}).slice(0,4)
}

function escapeDashboardHtml(value){return String(value==null?'':value).replace(/[&<>\"]/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[ch]})}

function promptGameLevel(){
  var total=promptUsageState.totalCopies;
  var level=Math.floor(total/PROMPT_KIT_LEVEL_SIZE)+1;
  var inLevel=total%PROMPT_KIT_LEVEL_SIZE;
  return{level:level,inLevel:inLevel,remaining:PROMPT_KIT_LEVEL_SIZE-inLevel,percent:Math.round((inLevel/PROMPT_KIT_LEVEL_SIZE)*100)}
}

function ensurePreferenceDashboardStyles(){
  if(document.getElementById('prompt-kit-preference-dashboard-styles'))return;
  var style=document.createElement('style');
  style.id='prompt-kit-preference-dashboard-styles';
  style.textContent='.prompt-dashboard-toggle{min-height:32px;padding:6px 10px;border:1px solid rgba(168,85,247,.45);border-radius:7px;background:linear-gradient(135deg,rgba(88,28,135,.82),rgba(30,41,59,.96));color:#f3e8ff;font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 0 14px rgba(168,85,247,.18)}.prompt-dashboard-toggle:hover,.prompt-dashboard-toggle:focus-visible{outline:none;border-color:#c084fc;box-shadow:0 0 0 2px rgba(192,132,252,.18),0 0 22px rgba(168,85,247,.3)}.prompt-game-dashboard{position:fixed;inset:0;z-index:340;display:grid;place-items:center;padding:18px;background:rgba(2,6,23,.76);backdrop-filter:blur(8px)}.prompt-game-dashboard[hidden]{display:none}.prompt-game-panel{width:min(820px,96vw);max-height:88vh;overflow:auto;border:1px solid rgba(168,85,247,.42);border-radius:18px;background:linear-gradient(145deg,#111827,#171426 58%,#0f172a);box-shadow:0 28px 80px rgba(0,0,0,.55),0 0 36px rgba(168,85,247,.2);padding:18px}.prompt-game-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.prompt-game-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#c084fc;font-weight:800}.prompt-game-head h2{margin:2px 0 3px;font-size:22px}.prompt-game-subtitle{font-size:11px;color:var(--text-muted)}.prompt-game-close{width:36px;height:36px;border:1px solid var(--border);border-radius:9px;background:var(--bg-surface);color:var(--text-secondary);font-size:20px;cursor:pointer}.prompt-game-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:16px 0}.prompt-game-stat{padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(15,23,42,.75)}.prompt-game-stat strong{display:block;font-size:21px;color:#e9d5ff}.prompt-game-stat span{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}.prompt-level-card{padding:13px;border:1px solid rgba(168,85,247,.35);border-radius:13px;background:linear-gradient(135deg,rgba(88,28,135,.28),rgba(15,23,42,.76));margin-bottom:14px}.prompt-level-row{display:flex;justify-content:space-between;gap:10px;font-size:11px}.prompt-level-row strong{color:#d8b4fe}.prompt-level-track{height:9px;margin-top:8px;border-radius:999px;background:#1e293b;overflow:hidden}.prompt-level-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#8b5cf6,#c084fc,#22d3ee);box-shadow:0 0 14px rgba(192,132,252,.45)}.prompt-game-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.prompt-game-section{border:1px solid var(--border);border-radius:13px;background:rgba(15,23,42,.62);padding:12px}.prompt-game-section h3{font-size:12px;margin:0 0 9px;color:var(--text-primary)}.prompt-game-empty{font-size:11px;color:var(--text-muted);line-height:1.5}.prompt-game-list{display:grid;gap:7px}.prompt-game-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border:1px solid rgba(51,65,85,.82);border-radius:9px;background:rgba(15,23,42,.78)}.prompt-game-row button{border:0;background:none;color:var(--accent);font:800 10px ui-monospace,SFMono-Regular,Consolas,monospace;cursor:pointer}.prompt-game-row .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--text-secondary)}.prompt-game-row .count{font-size:10px;color:#e9d5ff;font-weight:800}.prompt-signal{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid rgba(51,65,85,.55);font-size:10px}.prompt-signal:last-child{border-bottom:0}.prompt-signal strong{color:#c4b5fd}.prompt-loadout{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.prompt-loadout button{padding:5px 7px;border:1px solid rgba(245,158,11,.3);border-radius:8px;background:rgba(120,53,15,.18);color:#fbbf24;font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace;cursor:pointer}@media(max-width:760px){.prompt-game-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.prompt-game-grid{grid-template-columns:1fr}.prompt-dashboard-toggle{min-height:42px}}';
  document.head.appendChild(style)
}

function renderPreferenceDashboard(){
  var shell=document.getElementById('promptGameDashboard');
  if(!shell)return;
  var level=promptGameLevel();
  var rows=promptUsageRows();
  var signals=promptPreferenceSignals();
  var favoriteIds=PROMPTS.filter(function(prompt){return typeof isFavoritePrompt==='function'&&isFavoritePrompt(prompt.id)}).map(function(prompt){return prompt.id}).slice(0,12);
  var configured=typeof configuredPromptShortcutIds==='function'?configuredPromptShortcutIds():[];
  var unique=rows.length;
  var topHtml=rows.slice(0,6).map(function(row){return '<div class="prompt-game-row"><button type="button" data-dashboard-copy="'+escapeDashboardHtml(row.prompt.id)+'">'+escapeDashboardHtml(row.prompt.id)+'</button><span class="name">'+escapeDashboardHtml(row.prompt.name)+'</span><span class="count">'+row.count+'×</span></div>'}).join('');
  var signalHtml=signals.map(function(item){return '<div class="prompt-signal"><span>'+escapeDashboardHtml(item.label)+'</span><strong>'+item.count+' copies</strong></div>'}).join('');
  var loadoutHtml=favoriteIds.map(function(id){var shortcut=configured.indexOf(id)>=0?' · '+id.toLowerCase():'';return '<button type="button" data-dashboard-copy="'+escapeDashboardHtml(id)+'">★ '+escapeDashboardHtml(id+shortcut)+'</button>'}).join('');
  var body=shell.querySelector('.prompt-game-body');
  if(!body)return;
  body.innerHTML='<div class="prompt-game-stats"><div class="prompt-game-stat"><strong>'+promptUsageState.totalCopies+'</strong><span>Successful copies</span></div><div class="prompt-game-stat"><strong>'+unique+'</strong><span>Prompts explored</span></div><div class="prompt-game-stat"><strong>'+favoritePromptCount()+'</strong><span>Favorites</span></div><div class="prompt-game-stat"><strong>'+level.level+'</strong><span>Prompt level</span></div></div><div class="prompt-level-card"><div class="prompt-level-row"><strong>Level '+level.level+'</strong><span>'+level.remaining+' successful '+(level.remaining===1?'copy':'copies')+' to Level '+(level.level+1)+'</span></div><div class="prompt-level-track"><div class="prompt-level-fill" style="width:'+level.percent+'%"></div></div></div><div class="prompt-game-grid"><section class="prompt-game-section"><h3>Most used prompts</h3>'+(topHtml?'<div class="prompt-game-list">'+topHtml+'</div>':'<div class="prompt-game-empty">Copy a prompt to start revealing your play style. Only successful clipboard writes earn progress.</div>')+'</section><section class="prompt-game-section"><h3>Preference signals</h3>'+(signalHtml||'<div class="prompt-game-empty">Your preferred prompt types will appear here as you use them.</div>')+'<h3 style="margin-top:14px">Favorite loadout</h3>'+(loadoutHtml?'<div class="prompt-loadout">'+loadoutHtml+'</div>':'<div class="prompt-game-empty">Star prompts to build a reusable loadout. Favorite shortcuts copy immediately.</div>')+'</section></div>';
  body.querySelectorAll('[data-dashboard-copy]').forEach(function(button){button.addEventListener('click',function(){copyPrompt(button.getAttribute('data-dashboard-copy'))})})
}

function setPreferenceDashboardOpen(open){
  var shell=document.getElementById('promptGameDashboard');
  if(!shell)return;
  shell.hidden=!open;
  if(open){renderPreferenceDashboard();var close=shell.querySelector('.prompt-game-close');if(close)close.focus()}
}

