        self.assertIn("label.textContent='Copy '+promptId;", source)
        self.assertIn("to copy it immediately", source)

    def test_usage_counts_only_after_successful_clipboard_write(self) -> None:
        source = POLISH.read_text(encoding="utf-8")
        copy_block = re.search(r"window\.copyPrompt=function\(id\)\{.*?\n\};", source, re.S)
        self.assertIsNotNone(copy_block)
        text = copy_block.group(0)
        self.assertIn("copyToClipboard(p.copyContent,function(){recordPromptCopy(id);showCopyConfirmation(id)})", text)
        self.assertNotIn("recordPromptCopy(id);\n  copyToClipboard", text)
        self.assertIn("PROMPT_KIT_USAGE_STORAGE_KEY='promptKit.usage.v1'", source)
        self.assertIn("PROMPT_KIT_USAGE_SCHEMA='prompt-kit-usage/v1'", source)

    def test_dashboard_is_interactive_and_game_like_without_badge_scope(self) -> None:
        source = POLISH.read_text(encoding="utf-8")
        for marker in (
            "Preference Dashboard",
            "Prompt Playbook",
            "PROMPT_KIT_LEVEL_SIZE=5",
            "Most used prompts",
            "Preference signals",
            "Favorite loadout",
            "data-dashboard-copy",
            "Only successful clipboard writes earn progress",
            "ensurePreferenceDashboard();",
        ):
            self.assertIn(marker, source)
        self.assertNotIn("Badge Cabinet", source)

    def test_p99_forces_runtime_acceptance_for_runtime_requests(self) -> None:
        payload = json.loads(REGISTRY.read_text(encoding="utf-8"))
        p99 = next(prompt for prompt in payload["prompts"] if prompt["id"] == "P99")
        combined = "\n".join(str(p99.get(field, "")) for field in ("expectedOutput", "nextStep", "proofGate", "copyContent"))
        for marker in (
