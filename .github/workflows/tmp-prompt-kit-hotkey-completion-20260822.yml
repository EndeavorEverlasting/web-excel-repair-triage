name: Prompt Kit hotkey completion executor

on:
  push:
    branches:
      - feat/prompt-kit-hotkey-completion-20260822
    paths:
      - '.github/workflows/tmp-prompt-kit-hotkey-completion-20260822.yml'

permissions:
  contents: write

jobs:
  implement-validate-commit:
    if: github.repository == 'EndeavorEverlasting/web-excel-repair-triage' && github.ref_name == 'feat/prompt-kit-hotkey-completion-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh current floor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          test "$(git rev-parse origin/main)" = '19dbe0186c777f89d21775c688fdf34bd48eaab2'
          test "$(git merge-base HEAD origin/main)" = '19dbe0186c777f89d21775c688fdf34bd48eaab2'
      - name: Implement hotkey completion slice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          polish_path = Path('docs/prompt-kit-polish.js')
          polish = polish_path.read_text(encoding='utf-8')

          anchor = "var copyToastTimer=null;\n"
          addition = """var copyToastTimer=null;
          var PROMPT_KIT_SHORTCUT_STORAGE_KEY='promptKit.promptShortcuts.v1';
          var PROMPT_KIT_SHORTCUT_SCHEMA='prompt-kit-shortcuts/v1';
          var PROMPT_KIT_SHORTCUT_SEQUENCE_TIMEOUT_MS=1200;
          var promptShortcutBindings=loadPromptShortcutBindings();
          var promptShortcutBuffer='';
          var promptShortcutBufferTimer=null;
          """
          if polish.count(anchor) != 1:
              raise SystemExit(f'top-state anchor mismatch: {polish.count(anchor)}')
          polish = polish.replace(anchor, addition, 1)

          old_click = """    toggle.addEventListener('click',function(){
                var collapsed=header.classList.toggle('filters-collapsed');
                toggle.setAttribute('aria-expanded',collapsed?'false':'true');
                toggle.setAttribute('title',collapsed?'Show Prompt Kit filters (F)':'Hide filters to maximize prompt browsing space (F)');
                toggle.textContent=collapsed?'Show filters ↓':'Hide filters ↑';
              });
          """
          new_click = """    toggle.addEventListener('click',function(){toggleCompactFilters()});
          """
          if polish.count(old_click) != 1:
              raise SystemExit(f'filter click anchor mismatch: {polish.count(old_click)}')
          polish = polish.replace(old_click, new_click, 1)

          old_shortcuts = """var PROMPT_KIT_SHORTCUTS=[
            {key:'1',label:'All prompts'},
            {key:'2',label:'Standard prompts'},
            {key:'3',label:'GNHF prompts'},
            {key:'4',label:'Favorites'},
            {key:'5',label:'Doctrine'},
            {key:'/',label:'Focus search'},
            {key:'R',label:'Reference panel'},
            {key:'F',label:'Show / hide filters'},
            {key:'T',label:'Scroll to top'},
            {key:'B',label:'Scroll to bottom'},
            {key:'Esc',label:'Close / clear active surface'}
          ];
          """
          new_shortcuts = """var PROMPT_KIT_SHORTCUTS=[
            {key:'Ctrl+/',label:'Show / hide Hotkeys'},
            {key:'1',label:'All prompts'},
            {key:'2',label:'Standard prompts'},
            {key:'3',label:'GNHF prompts'},
            {key:'4',label:'Favorites'},
            {key:'5',label:'Doctrine'},
            {key:'/',label:'Focus search'},
            {key:'R',label:'Reference panel'},
            {key:'F',label:'Toggle filters'},
            {key:'[',label:'Hide filters'},
            {key:']',label:'Show filters'},
            {key:'T',label:'Scroll to top'},
            {key:'B',label:'Scroll to bottom'},
            {key:'Esc',label:'Close / clear active surface'}
          ];
          """
          if polish.count(old_shortcuts) != 1:
              raise SystemExit(f'shortcut map anchor mismatch: {polish.count(old_shortcuts)}')
          polish = polish.replace(old_shortcuts, new_shortcuts, 1)

          old_toggle = """function toggleCompactFilters(){
            var toggle=document.getElementById('filterPanelToggle');
            if(toggle)toggle.click()
          }
          """
          new_toggle = """function setCompactFiltersVisible(visible){
            var header=document.querySelector('.header');
            var toggle=document.getElementById('filterPanelToggle');
            if(!header||!toggle)return false;
            var collapsed=!visible;
            header.classList.toggle('filters-collapsed',collapsed);
            toggle.setAttribute('aria-expanded',collapsed?'false':'true');
            toggle.setAttribute('title',collapsed?'Show Prompt Kit filters (F)':'Hide filters to maximize prompt browsing space (F)');
            toggle.textContent=collapsed?'Show filters ↓':'Hide filters ↑';
            return !collapsed
          }

          function showCompactFilters(){return setCompactFiltersVisible(true)}
          function hideCompactFilters(){return setCompactFiltersVisible(false)}
          function toggleCompactFilters(){
            var header=document.querySelector('.header');
            if(!header)return false;
            return setCompactFiltersVisible(header.classList.contains('filters-collapsed'))
          }

          function normalizePromptShortcutId(raw){
            var value=String(raw||'').trim().toUpperCase();
            return /^P\\d+$/.test(value)?value:null
          }

          function clonePromptShortcutBindings(source){
            var copy={};
            Object.keys(source||{}).forEach(function(gesture){copy[gesture]=source[gesture]});
            return copy
          }

          function loadPromptShortcutBindings(){
            var bindings={};
            try{
              if(!window.localStorage)return bindings;
              var raw=window.localStorage.getItem(PROMPT_KIT_SHORTCUT_STORAGE_KEY);
              if(!raw)return bindings;
              var payload=JSON.parse(raw);
              if(!payload||payload.schema!==PROMPT_KIT_SHORTCUT_SCHEMA||!Array.isArray(payload.bindings))return bindings;
              payload.bindings.forEach(function(item){
                if(!item||typeof item.promptId!=='string')return;
                var promptId=normalizePromptShortcutId(item.promptId);
                if(promptId)bindings[promptId.toLowerCase()]=promptId
              })
            }catch(e){}
            return bindings
          }

          function persistPromptShortcutBindings(candidate){
            try{
              if(!window.localStorage)throw new Error('localStorage unavailable');
              var payload={schema:PROMPT_KIT_SHORTCUT_SCHEMA,bindings:Object.keys(candidate).sort().map(function(gesture){return{gesture:gesture,promptId:candidate[gesture]}})};
              window.localStorage.setItem(PROMPT_KIT_SHORTCUT_STORAGE_KEY,JSON.stringify(payload));
              return true
            }catch(e){
              showToast('Prompt shortcut save failed');
              return false
            }
          }

          function configuredPromptShortcutIds(){
            return Object.keys(promptShortcutBindings).sort().map(function(gesture){return promptShortcutBindings[gesture]})
          }

          function configurePromptShortcut(rawPromptId){
            var promptId=normalizePromptShortcutId(rawPromptId);
            if(!promptId){showToast('Use a prompt ID such as P95');return false}
            var prompt=PROMPTS.find(function(item){return item.id===promptId});
            if(!prompt){showToast(promptId+' is not in this Prompt Kit');return false}
            if(!isFavoritePrompt(promptId)){showToast('Favorite '+promptId+' before assigning its shortcut');return false}
            var candidate=clonePromptShortcutBindings(promptShortcutBindings);
            candidate[promptId.toLowerCase()]=promptId;
            if(!persistPromptShortcutBindings(candidate))return false;
            promptShortcutBindings=candidate;
            renderPromptShortcutBindings();
            showToast('Shortcut '+promptId.toLowerCase()+' saved','success');
            return true
          }

          function removePromptShortcut(rawPromptId){
            var promptId=normalizePromptShortcutId(rawPromptId);
            if(!promptId)return false;
            var gesture=promptId.toLowerCase();
            if(!promptShortcutBindings[gesture])return false;
            var candidate=clonePromptShortcutBindings(promptShortcutBindings);
            delete candidate[gesture];
            if(!persistPromptShortcutBindings(candidate))return false;
            promptShortcutBindings=candidate;
            renderPromptShortcutBindings();
            showToast('Removed shortcut '+gesture);
            return true
          }

          function renderPromptShortcutBindings(){
            var host=document.getElementById('promptShortcutBindings');
            if(!host)return;
            host.innerHTML='';
            var ids=configuredPromptShortcutIds();
            if(!ids.length){var empty=document.createElement('span');empty.className='hotkey-shortcut-empty';empty.textContent='No favorite prompt shortcuts configured.';host.appendChild(empty);return}
            ids.forEach(function(promptId){
              var row=document.createElement('div');row.className='hotkey-shortcut-row';
              var key=document.createElement('kbd');key.textContent=promptId.toLowerCase();
              var label=document.createElement('span');label.textContent='Open '+promptId;
              var remove=document.createElement('button');remove.type='button';remove.className='hotkey-shortcut-remove';remove.setAttribute('aria-label','Remove '+promptId+' keyboard shortcut');remove.textContent='Remove';
              remove.addEventListener('click',function(){removePromptShortcut(promptId)});
              row.appendChild(key);row.appendChild(label);row.appendChild(remove);host.appendChild(row)
            })
          }

          function resetPromptShortcutBuffer(){
            promptShortcutBuffer='';
            if(promptShortcutBufferTimer){clearTimeout(promptShortcutBufferTimer);promptShortcutBufferTimer=null}
          }

          function schedulePromptShortcutBufferReset(){
            if(promptShortcutBufferTimer)clearTimeout(promptShortcutBufferTimer);
            promptShortcutBufferTimer=setTimeout(resetPromptShortcutBuffer,PROMPT_KIT_SHORTCUT_SEQUENCE_TIMEOUT_MS)
          }

          function openPromptShortcutTarget(promptId){
            var prompt=PROMPTS.find(function(item){return item.id===promptId});
            if(!prompt)return false;
            if(!isFavoritePrompt(promptId)){showToast(promptId+' is no longer a Favorite');return false}
            showPromptDetail(promptId,null);
            return true
          }

          function handleConfiguredPromptShortcutKey(e,key){
            if(!/^[a-z0-9]$/.test(key)){resetPromptShortcutBuffer();return false}
            var gestures=Object.keys(promptShortcutBindings);
            if(!gestures.length){resetPromptShortcutBuffer();return false}
            var candidate=promptShortcutBuffer+key;
            var exact=promptShortcutBindings[candidate];
            if(exact){
              e.preventDefault();e.stopImmediatePropagation();resetPromptShortcutBuffer();openPromptShortcutTarget(exact);return true
            }
            var prefix=gestures.some(function(gesture){return gesture.indexOf(candidate)===0});
            if(prefix){
              e.preventDefault();e.stopImmediatePropagation();promptShortcutBuffer=candidate;schedulePromptShortcutBufferReset();return true
            }
            resetPromptShortcutBuffer();
            candidate=key;
            exact=promptShortcutBindings[candidate];
            if(exact){e.preventDefault();e.stopImmediatePropagation();openPromptShortcutTarget(exact);return true}
            prefix=gestures.some(function(gesture){return gesture.indexOf(candidate)===0});
            if(prefix){e.preventDefault();e.stopImmediatePropagation();promptShortcutBuffer=candidate;schedulePromptShortcutBufferReset();return true}
            return false
          }
          """
          if polish.count(old_toggle) != 1:
              raise SystemExit(f'filter owner anchor mismatch: {polish.count(old_toggle)}')
          polish = polish.replace(old_toggle, new_toggle, 1)

          aria_anchor = "  toggle.setAttribute('aria-label','Open keyboard shortcut help');\n"
          aria_new = aria_anchor + "  toggle.setAttribute('aria-keyshortcuts','Control+/');\n"
          if polish.count(aria_anchor) != 1:
              raise SystemExit(f'hotkey help aria anchor mismatch: {polish.count(aria_anchor)}')
          polish = polish.replace(aria_anchor, aria_new, 1)

          list_anchor = """  panel.appendChild(list);
            shell.appendChild(panel);
          """
          list_new = """  panel.appendChild(list);

            var config=document.createElement('div');
            config.className='hotkey-shortcut-config';
            var configTitle=document.createElement('strong');
            configTitle.textContent='Favorite prompt shortcuts';
            var configHint=document.createElement('span');
            configHint.className='hotkey-shortcut-hint';
            configHint.textContent='Favorite a prompt, enter its ID, then type that ID anywhere outside editable fields.';
            var configControls=document.createElement('div');
            configControls.className='hotkey-shortcut-controls';
            var promptInput=document.createElement('input');
            promptInput.id='promptShortcutPromptId';
            promptInput.type='text';
            promptInput.inputMode='text';
            promptInput.autocomplete='off';
            promptInput.placeholder='P95';
            promptInput.setAttribute('aria-label','Favorite prompt ID for keyboard shortcut');
            var saveShortcut=document.createElement('button');
            saveShortcut.type='button';
            saveShortcut.textContent='Save';
            saveShortcut.setAttribute('aria-label','Save favorite prompt keyboard shortcut');
            configControls.appendChild(promptInput);configControls.appendChild(saveShortcut);
            var bindings=document.createElement('div');
            bindings.id='promptShortcutBindings';
            bindings.className='hotkey-shortcut-bindings';
            config.appendChild(configTitle);config.appendChild(configHint);config.appendChild(configControls);config.appendChild(bindings);
            panel.appendChild(config);
            shell.appendChild(panel);
          """
          if polish.count(list_anchor) != 1:
              raise SystemExit(f'help config anchor mismatch: {polish.count(list_anchor)}')
          polish = polish.replace(list_anchor, list_new, 1)

          listener_anchor = """  toggle.addEventListener('click',function(){setHotkeyHelpOpen(panel.hidden)});
            close.addEventListener('click',function(){setHotkeyHelpOpen(false,true)});
            document.addEventListener('click',function(e){if(!panel.hidden&&!shell.contains(e.target))setHotkeyHelpOpen(false,false)})
          """
          listener_new = """  toggle.addEventListener('click',function(){setHotkeyHelpOpen(panel.hidden)});
            close.addEventListener('click',function(){setHotkeyHelpOpen(false,true)});
            saveShortcut.addEventListener('click',function(){if(configurePromptShortcut(promptInput.value))promptInput.value=''});
            promptInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();if(configurePromptShortcut(promptInput.value))promptInput.value=''}});
            document.addEventListener('click',function(e){if(!panel.hidden&&!shell.contains(e.target))setHotkeyHelpOpen(false,false)});
            if(!document.getElementById('prompt-kit-hotkey-config-styles')){
              var configStyle=document.createElement('style');configStyle.id='prompt-kit-hotkey-config-styles';
              configStyle.textContent='.hotkey-shortcut-config{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:grid;gap:7px}.hotkey-shortcut-hint,.hotkey-shortcut-empty{color:var(--text-muted);font-size:10px;line-height:1.4}.hotkey-shortcut-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.hotkey-shortcut-controls input,.hotkey-shortcut-controls button,.hotkey-shortcut-remove{min-height:32px;border:1px solid var(--border);border-radius:6px;background:var(--bg-surface);color:var(--text-primary);font:inherit}.hotkey-shortcut-controls input{padding:5px 7px}.hotkey-shortcut-controls button,.hotkey-shortcut-remove{padding:5px 8px;cursor:pointer}.hotkey-shortcut-bindings{display:grid;gap:5px}.hotkey-shortcut-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:7px;color:var(--text-secondary);font-size:10px}.hotkey-shortcut-row kbd{padding:3px 6px;border:1px solid var(--border);border-radius:6px;color:var(--accent);font:700 10px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace}.hotkey-shortcut-remove{min-height:28px;font-size:9px}';
              document.head.appendChild(configStyle)
            }
            renderPromptShortcutBindings()
          """
          if polish.count(listener_anchor) != 1:
              raise SystemExit(f'help listener anchor mismatch: {polish.count(listener_anchor)}')
          polish = polish.replace(listener_anchor, listener_new, 1)

          hotkey_pattern = re.compile(r"function installCompactBrowsingHotkeys\(\)\{.*?\n\}\n\nwindow\.appendPromptCard=", re.S)
          hotkey_replacement = """function installCompactBrowsingHotkeys(){
            document.addEventListener('keydown',function(e){
              var key=String(e.key||'').toLowerCase();
              var target=e.target;
              var editable=!!(target&&(target.tagName==='INPUT'||target.tagName==='TEXTAREA'||target.tagName==='SELECT'||target.isContentEditable));
              if(e.ctrlKey&&!e.altKey&&!e.metaKey&&key==='/'&&!editable){
                e.preventDefault();e.stopImmediatePropagation();
                var helpPanel=document.getElementById('hotkeyHelpPanel');
                setHotkeyHelpOpen(helpPanel?helpPanel.hidden:true,false);
                resetPromptShortcutBuffer();
                return
              }
              if(e.defaultPrevented||e.altKey||e.metaKey||e.ctrlKey)return;
              if(editable)return;
              if(key==='escape'){
                resetPromptShortcutBuffer();
                var openHelp=document.getElementById('hotkeyHelpPanel');
                if(openHelp&&!openHelp.hidden){e.preventDefault();e.stopImmediatePropagation();setHotkeyHelpOpen(false,true);return}
              }
              if(key==='1'){e.preventDefault();e.stopImmediatePropagation();activateAllPromptsView();return}
              if(key==='4'){e.preventDefault();e.stopImmediatePropagation();activateFavoritesView();return}
              if(key==='5'){
                var doctrine=document.querySelector('.cat-tab[data-cat=\"doctrine\"]');
                if(doctrine){e.preventDefault();e.stopImmediatePropagation();doctrine.click()}
                return
              }
              if(key==='f'){e.preventDefault();e.stopImmediatePropagation();toggleCompactFilters();return}
              if(key==='['){e.preventDefault();e.stopImmediatePropagation();hideCompactFilters();return}
              if(key===']'){e.preventDefault();e.stopImmediatePropagation();showCompactFilters();return}
              if(key==='t'){e.preventDefault();e.stopImmediatePropagation();scrollPromptKitTo('top');return}
              if(key==='b'){e.preventDefault();e.stopImmediatePropagation();scrollPromptKitTo('bottom');return}
              handleConfiguredPromptShortcutKey(e,key)
            },true)
          }

          window.appendPromptCard="""
          polish, count = hotkey_pattern.subn(hotkey_replacement, polish, count=1)
          if count != 1:
              raise SystemExit(f'hotkey dispatcher replacement mismatch: {count}')

          polish_path.write_text(polish, encoding='utf-8')

          readme_path=Path('web/README.md')
          readme=readme_path.read_text(encoding='utf-8')
          hotkeys=re.compile(r"### Hotkeys\n.*?\n### Header navigation contract", re.S)
          hotkeys_text="""### Hotkeys

          The glowing **Hotkeys** module beside the floating reference control is the in-product shortcut reference and favorite-prompt shortcut configurator. Select it or press **Ctrl+/** to toggle it; select outside it, use its close control, or press **Esc** to dismiss it.

          | Key | Action |
          |---|---|
          | `Ctrl+/` | Show / hide Hotkeys |
          | `/` | Focus search |
          | `1` | All prompts |
          | `2` | Standard prompts |
          | `3` | GNHF prompts |
          | `4` | Favorites |
          | `5` | Doctrine |
          | `R` | Toggle reference panel |
          | `F` | Toggle filters |
          | `[` | Hide filters |
          | `]` | Show filters |
          | `T` | Scroll to top |
          | `B` | Scroll to bottom |
          | `Esc` | Close the active surface or clear filters |

          Favorite-prompt shortcuts are configured from the Hotkeys panel. Favorite a prompt first, enter its canonical ID such as `P95`, and save it; the persisted binding is then the lower-case prompt ID (`p95`). Typed prompt sequences expire after 1.2 seconds, are ignored in editable fields, and open the canonical prompt detail immediately. A configured shortcut is rejected when its target is unknown or not currently a Favorite. Shortcut storage uses the versioned key `promptKit.promptShortcuts.v1` and publishes an in-memory binding only after the browser storage write succeeds.

          Navigation shortcuts are ignored while typing in an input, textarea, select, or content-editable surface. Top/bottom scrolling respects reduced-motion preferences.

          ### Header navigation contract"""
          readme, count=hotkeys.subn(hotkeys_text,readme,count=1)
          if count!=1: raise SystemExit(f'README hotkeys section mismatch: {count}')
          readme_path.write_text(readme,encoding='utf-8')

          design_path=Path('docs/PROMPT_KIT_HOTKEY_PROGRAM_DESIGN.md')
          design=design_path.read_text(encoding='utf-8')
          unresolved=re.compile(r"Still unresolved by design proof:\n(?:- .*\n)+\nThese are UX policy choices and do not require changing the selected seams\.\n",re.M)
          resolved="""Production decisions closed on 2026-08-22:
          - `Ctrl+/` toggles the Hotkeys surface while preserving editable-field safety.
          - `F` remains filter toggle; `[` explicitly hides filters and `]` explicitly shows filters.
          - configured prompt-ID sequences expire after 1.2 seconds.
          - only prompts that are currently Favorites may be assigned a prompt-ID shortcut.
          - a completed prompt-ID shortcut opens canonical prompt detail immediately through `showPromptDetail`.
          - shortcut persistence uses versioned `promptKit.promptShortcuts.v1` storage and publishes only after a successful durable write.

          These production choices preserve the selected seams and remove the prior UX-policy ambiguity.
          """
          design,count=unresolved.subn(resolved,design,count=1)
          if count!=1: raise SystemExit(f'design unresolved section mismatch: {count}')
          design_path.write_text(design,encoding='utf-8')

          test_path=Path('tests/test_prompt_kit_hotkey_completion.py')
          test_path.write_text('''from __future__ import annotations\n\nimport unittest\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nPOLISH = ROOT / "docs" / "prompt-kit-polish.js"\nDEPLOYED = ROOT / "web" / "prompt-kit" / "index.html"\nREADME = ROOT / "web" / "README.md"\nDESIGN = ROOT / "docs" / "PROMPT_KIT_HOTKEY_PROGRAM_DESIGN.md"\n\n\nclass PromptKitHotkeyCompletionTests(unittest.TestCase):\n    def test_ctrl_slash_and_filter_commands_share_effective_runtime(self) -> None:\n        source = POLISH.read_text(encoding="utf-8")\n        for marker in (\n            "{key:'Ctrl+/',label:'Show / hide Hotkeys'}",\n            "toggle.setAttribute('aria-keyshortcuts','Control+/')",\n            "if(e.ctrlKey&&!e.altKey&&!e.metaKey&&key==='/'&&!editable)",\n            "function setCompactFiltersVisible(visible)",\n            "function hideCompactFilters()",\n            "function showCompactFilters()",\n            "if(key==='[')",\n            "if(key===']')",\n        ):\n            self.assertIn(marker, source)\n        self.assertLess(source.index("if(e.ctrlKey&&!e.altKey&&!e.metaKey&&key==='/'&&!editable)"), source.index("if(e.defaultPrevented||e.altKey||e.metaKey||e.ctrlKey)return"))\n\n    def test_favorite_prompt_shortcuts_are_persisted_fail_closed(self) -> None:\n        source = POLISH.read_text(encoding="utf-8")\n        for marker in (\n            "promptKit.promptShortcuts.v1",\n            "prompt-kit-shortcuts/v1",\n            "PROMPT_KIT_SHORTCUT_SEQUENCE_TIMEOUT_MS=1200",\n            "function configurePromptShortcut(rawPromptId)",\n            "if(!isFavoritePrompt(promptId))",\n            "if(!persistPromptShortcutBindings(candidate))return false",\n            "promptShortcutBindings=candidate",\n            "function handleConfiguredPromptShortcutKey(e,key)",\n            "showPromptDetail(promptId,null)",\n        ):\n            self.assertIn(marker, source)\n        self.assertLess(source.index("if(!persistPromptShortcutBindings(candidate))return false"), source.index("promptShortcutBindings=candidate"))\n\n    def test_configuration_ui_and_generated_parity_are_present(self) -> None:\n        source = POLISH.read_text(encoding="utf-8")\n        deployed = DEPLOYED.read_text(encoding="utf-8")\n        for marker in (\n            "Favorite prompt shortcuts",\n            "promptShortcutPromptId",\n            "promptShortcutBindings",\n            "Favorite a prompt, enter its ID",\n            "Save favorite prompt keyboard shortcut",\n        ):\n            self.assertIn(marker, source)\n            self.assertIn(marker, deployed)\n\n    def test_human_contract_and_design_close_previous_ux_decisions(self) -> None:\n        readme = README.read_text(encoding="utf-8")\n        design = DESIGN.read_text(encoding="utf-8")\n        for row in (\n            "| `Ctrl+/` | Show / hide Hotkeys |",\n            "| `[` | Hide filters |",\n            "| `]` | Show filters |",\n        ):\n            self.assertIn(row, readme)\n        self.assertIn("Typed prompt sequences expire after 1.2 seconds", readme)\n        self.assertIn("only prompts that are currently Favorites", design)\n        self.assertIn("opens canonical prompt detail immediately", design)\n        self.assertNotIn("Still unresolved by design proof:", design)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''',encoding='utf-8')
          PY
      - name: Rebuild canonical Prompt Kit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Targeted validation
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_hotkey_completion -v
          python tests/test_prompt_kit_header_contract.py
          python -m unittest tests.test_prompt_kit_order_navigation_contract tests.test_prompt_kit_order_navigation_product -v
          python -m unittest tests.test_prompt_kit_product_interactions tests.test_prompt_kit_filtering_access tests.test_prompt_kit_mobile -v
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output /tmp/prompt-kit-order-navigation-audit.json --summary
