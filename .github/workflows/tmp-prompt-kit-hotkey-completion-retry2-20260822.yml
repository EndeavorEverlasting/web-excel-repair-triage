name: Prompt Kit hotkey completion retry 2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-prompt-kit-hotkey-completion-retry2-20260822.yml'

permissions:
  contents: write

jobs:
  implement-validate-commit:
    if: github.repository == 'EndeavorEverlasting/web-excel-repair-triage' && github.head_ref == 'feat/prompt-kit-hotkey-completion-main-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh current floor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          test "$(git rev-parse origin/main)" = 'c733458610df59542a185995edb7928ca2db9be5'
          test "$(git merge-base HEAD origin/main)" = 'c733458610df59542a185995edb7928ca2db9be5'
      - name: Apply runtime patch and preserve escape contract
        shell: bash
        run: |
          set -euo pipefail
          python .github/tmp_prompt_kit_hotkey_completion_retry.py
          python - <<'PY'
          from pathlib import Path
          path=Path('docs/prompt-kit-polish.js')
          text=path.read_text(encoding='utf-8')
          old="""    if(key==='escape'){
                resetPromptShortcutBuffer();
                var openHelp=document.getElementById('hotkeyHelpPanel');
                if(openHelp&&!openHelp.hidden){e.preventDefault();e.stopImmediatePropagation();setHotkeyHelpOpen(false,true);return}
              }
          """
          new="""    if(key==='escape')resetPromptShortcutBuffer();
              if(key==='escape'&&!document.getElementById('hotkeyHelpPanel').hidden){
                e.preventDefault();e.stopImmediatePropagation();setHotkeyHelpOpen(false,true);return
              }
          """
          if text.count(old)!=1: raise SystemExit(f'escape contract anchor mismatch: {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Rebuild and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          node --check docs/prompt-kit-polish.js
          python -m unittest tests.test_prompt_kit_hotkey_completion -v
          python tests/test_prompt_kit_header_contract.py
          python -m unittest tests.test_prompt_kit_order_navigation_contract tests.test_prompt_kit_order_navigation_product -v
          python -m unittest tests.test_prompt_kit_product_interactions tests.test_prompt_kit_filtering_access tests.test_prompt_kit_mobile -v
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output /tmp/prompt-kit-order-navigation-audit.json --summary
          python scripts/validate_prompt_kit_interactions.py --require-implementation --output /tmp/prompt-kit-interaction-audit.json --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Third-pass evidence critique
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source=Path('docs/prompt-kit-polish.js').read_text(encoding='utf-8')
          deployed=Path('web/prompt-kit/index.html').read_text(encoding='utf-8')
          readme=Path('web/README.md').read_text(encoding='utf-8')
          design=Path('docs/PROMPT_KIT_HOTKEY_PROGRAM_DESIGN.md').read_text(encoding='utf-8')
          markers=("{key:'Ctrl+/',label:'Show / hide Hotkeys'}", "{key:'F',label:'Show / hide filters'}", "if(key==='escape'&&!document.getElementById('hotkeyHelpPanel').hidden)", "if(key==='[')", "if(key===']')", "if(!isFavoritePrompt(promptId))", "if(!persistPromptShortcutBindings(candidate))return false", "showPromptDetail(promptId,null)", 'PROMPT_KIT_SHORTCUT_SEQUENCE_TIMEOUT_MS=1200')
          missing=[m for m in markers if m not in source or m not in deployed]
          if missing: raise SystemExit('third-pass missing runtime/generated markers: '+repr(missing))
          if source.index("if(!persistPromptShortcutBindings(candidate))return false") > source.index("promptShortcutBindings=candidate"):
              raise SystemExit('persistence publication ordering regressed')
          for row in ("| `Ctrl+/` | Show / hide Hotkeys |", "| `F` | Show / hide filters |", "| `[` | Hide filters |", "| `]` | Show filters |"):
              if row not in readme: raise SystemExit('README parity missing: '+row)
          if 'Still unresolved by design proof:' in design: raise SystemExit('design decisions still unresolved')
          print('THIRD PASS PASS: established contracts, generated parity, storage ordering, and UX decisions align')
          PY
      - name: Commit durable files and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tmp-prompt-kit-hotkey-completion-pr-20260822.yml .github/workflows/tmp-prompt-kit-hotkey-completion-retry-20260822.yml .github/workflows/tmp-prompt-kit-hotkey-completion-retry2-20260822.yml .github/tmp_prompt_kit_hotkey_completion_retry.py
          git add docs/prompt-kit-polish.js docs/PROMPT_KIT_HOTKEY_PROGRAM_DESIGN.md tests/test_prompt_kit_hotkey_completion.py web/README.md web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m 'feat(prompt-kit): complete configurable hotkey runtime'
          git push origin HEAD:${{ github.head_ref }}
