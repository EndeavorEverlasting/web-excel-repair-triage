name: Prompt Kit hotkey focus repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-prompt-kit-hotkey-focus-20260822.yml'

permissions:
  contents: write

jobs:
  repair-and-prove:
    if: github.head_ref == 'feat/prompt-kit-hotkeys-help-20260822' && github.repository == 'EndeavorEverlasting/web-excel-repair-triage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh floor and verify trusted builders
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          test "$(git rev-parse origin/main)" = '447bd6d18c1591759486cf1afacd58bccd7782cd'
          git diff --exit-code origin/main -- scripts/build_prompt_kit_registry.py build_prompt_kit.py
      - name: Apply exact accessibility repair and focused assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          polish = Path('docs/prompt-kit-polish.js')
          text = polish.read_text(encoding='utf-8')
          old = """  panel.hidden=!open;
            toggle.setAttribute('aria-expanded',open?'true':'false');
            if(!open&&restoreFocus){try{toggle.focus({preventScroll:true})}catch(e){toggle.focus()}}
          """
          new = """  panel.hidden=!open;
            toggle.setAttribute('aria-expanded',open?'true':'false');
            if(open){
              var close=panel.querySelector('.hotkey-help-close');
              if(close){try{close.focus({preventScroll:true})}catch(e){close.focus()}}
              return;
            }
            if(restoreFocus){try{toggle.focus({preventScroll:true})}catch(e){toggle.focus()}}
          """
          if text.count(old) != 1:
              raise SystemExit(f'hotkey focus source anchor mismatch: {text.count(old)}')
          polish.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_prompt_kit_header_contract.py')
          text = test.read_text(encoding='utf-8')
          anchor = '''        "panel.setAttribute('role','dialog')",\n'''
          addition = '''        "panel.setAttribute('role','dialog')",\n        "var close=panel.querySelector('.hotkey-help-close');",\n        "if(close){try{close.focus({preventScroll:true})}catch(e){close.focus()}}",\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'header focus assertion anchor mismatch: {text.count(anchor)}')
          test.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY
      - name: Rebuild and validate repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          node --check docs/prompt-kit-polish.js
          python tests/test_prompt_kit_header_contract.py
          python -m unittest tests.test_prompt_kit_order_navigation_contract tests.test_prompt_kit_order_navigation_product -v
          python -m unittest tests.test_prompt_kit_product_interactions tests.test_prompt_kit_filtering_access tests.test_prompt_kit_mobile -v
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output /tmp/prompt-kit-order-navigation-audit.json --summary
          python scripts/validate_prompt_kit_interactions.py --require-implementation --output /tmp/prompt-kit-interaction-audit.json --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Commit durable focus repair only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tmp-prompt-kit-hotkey-focus-20260822.yml
          git add docs/prompt-kit-polish.js tests/test_prompt_kit_header_contract.py web/prompt-kit/index.html
          git diff --cached --check
          echo '=== FINAL STAGED STATUS ==='
          git status --short
          git commit -m 'fix(prompt-kit): focus shortcut help on open'
          git push origin HEAD:${{ github.head_ref }}
