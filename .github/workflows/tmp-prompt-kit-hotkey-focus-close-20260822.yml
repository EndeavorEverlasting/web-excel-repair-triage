name: Prompt Kit backtick focus-close canonical repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-prompt-kit-hotkey-focus-close-20260822.yml'

permissions:
  contents: read

jobs:
  repair-build-and-prove:
    if: github.repository == 'EndeavorEverlasting/web-excel-repair-triage' && github.head_ref == 'feat/prompt-kit-hotkey-completion-main-20260822'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify trusted floor and apply bounded focus repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = 'c733458610df59542a185995edb7928ca2db9be5'
          git diff --exit-code origin/main -- scripts/build_prompt_kit_registry.py build_prompt_kit.py
          python - <<'PY'
          from pathlib import Path

          polish = Path('docs/prompt-kit-polish.js')
          text = polish.read_text(encoding='utf-8')
          old = """      var helpPanel=document.getElementById('hotkeyHelpPanel');
          setHotkeyHelpOpen(helpPanel?helpPanel.hidden:true,false);
          """
          new = """      var helpPanel=document.getElementById('hotkeyHelpPanel');
          var openHotkeys=helpPanel?helpPanel.hidden:true;
          setHotkeyHelpOpen(openHotkeys,!openHotkeys);
          """
          if text.count(old) != 1:
              raise SystemExit(f'backtick focus source anchor mismatch: {text.count(old)}')
          polish.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_prompt_kit_hotkey_completion.py')
          text = test.read_text(encoding='utf-8')
          old = '''            "if(key==='`')",\n            "if(e.defaultPrevented||e.altKey||e.metaKey||e.ctrlKey)return",\n'''
          new = '''            "if(key==='`')",\n            "var openHotkeys=helpPanel?helpPanel.hidden:true;",\n            "setHotkeyHelpOpen(openHotkeys,!openHotkeys);",\n            "if(e.defaultPrevented||e.altKey||e.metaKey||e.ctrlKey)return",\n'''
          if text.count(old) != 1:
              raise SystemExit(f'backtick focus test anchor mismatch: {text.count(old)}')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Rebuild and validate repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          node --check docs/prompt-kit-polish.js
          node docs/prompt-kit-hotkey-prototype.js
          python -m unittest tests.test_prompt_kit_hotkey_completion -v
          python tests/test_prompt_kit_header_contract.py
          python -m unittest tests.test_prompt_kit_product_interactions tests.test_prompt_kit_filtering_access tests.test_prompt_kit_mobile -v
          python scripts/validate_prompt_kit_interactions.py --require-implementation --output /tmp/prompt-kit-interaction-audit.json --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output /tmp/prompt-kit-order-navigation-audit.json --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Upload allowlisted repaired files
        uses: actions/upload-artifact@v4
        with:
          name: prompt-kit-hotkey-focus-close-files
          path: |
            docs/prompt-kit-polish.js
            tests/test_prompt_kit_hotkey_completion.py
            web/prompt-kit/index.html
          if-no-files-found: error

  commit-repaired-files:
    needs: repair-build-and-prove
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: prompt-kit-hotkey-focus-close-files
          path: ${{ runner.temp }}/repaired
      - name: Install prevalidated allowlist and remove transport
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_REF" --prune
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/$HEAD_REF)" = "$EXPECTED_HEAD"
          cp "$RUNNER_TEMP/repaired/docs/prompt-kit-polish.js" docs/prompt-kit-polish.js
          cp "$RUNNER_TEMP/repaired/tests/test_prompt_kit_hotkey_completion.py" tests/test_prompt_kit_hotkey_completion.py
          cp "$RUNNER_TEMP/repaired/web/prompt-kit/index.html" web/prompt-kit/index.html
          git rm .github/workflows/tmp-prompt-kit-hotkey-focus-close-20260822.yml
          git add docs/prompt-kit-polish.js tests/test_prompt_kit_hotkey_completion.py web/prompt-kit/index.html
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(.github/workflows/tmp-prompt-kit-hotkey-focus-close-20260822.yml docs/prompt-kit-polish.js tests/test_prompt_kit_hotkey_completion.py web/prompt-kit/index.html)
          test "${#changed[@]}" -eq 4
          for i in 0 1 2 3; do test "${changed[$i]}" = "${expected[$i]}"; done
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(prompt-kit): restore focus on backtick close'
          git push origin "HEAD:$HEAD_REF"
