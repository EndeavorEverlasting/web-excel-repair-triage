name: Prompt Kit hotkey sprint proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/tmp_prompt_kit_hotkeys_20260822.py'
      - '.github/workflows/tmp-prompt-kit-hotkeys-20260822.yml'

permissions:
  contents: write

jobs:
  implement-and-prove:
    if: github.head_ref == 'feat/prompt-kit-hotkeys-help-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh provider floor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          echo "HEAD=$(git rev-parse HEAD)"
          echo "origin/main=$(git rev-parse origin/main)"
          test "$(git rev-parse origin/main)" = '447bd6d18c1591759486cf1afacd58bccd7782cd'
      - name: Apply bounded hotkey implementation
        run: python .github/tmp_prompt_kit_hotkeys_20260822.py
      - name: Rebuild canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Targeted JavaScript and header contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/prompt-kit-polish.js
          python tests/test_prompt_kit_header_contract.py
      - name: Adjacent interaction regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_prompt_kit_product_interactions tests.test_prompt_kit_filtering_access tests.test_prompt_kit_mobile -v
          python scripts/validate_prompt_kit_interactions.py --require-implementation --output /tmp/prompt-kit-interaction-audit.json --summary
      - name: Exact generated parity and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git diff --stat
      - name: Commit durable Prompt Kit result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/tmp_prompt_kit_hotkeys_20260822.py .github/workflows/tmp-prompt-kit-hotkeys-20260822.yml
          git add docs/prompt-kit-polish.js tests/test_prompt_kit_header_contract.py web/README.md web/prompt-kit/index.html
          git diff --cached --check
          echo '=== FINAL STAGED STATUS ==='
          git status --short
          git commit -m 'feat(prompt-kit): add navigation hotkeys and shortcut help'
          git push origin HEAD:${{ github.head_ref }}
