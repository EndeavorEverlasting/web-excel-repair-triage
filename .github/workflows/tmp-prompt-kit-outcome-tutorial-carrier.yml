name: Temporary Prompt Kit outcome tutorial carrier

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: prompt-kit-p122-gemini-regression
  cancel-in-progress: false

jobs:
  execute:
    if: github.repository == 'EndeavorEverlasting/web-excel-repair-triage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gemini-youtube-ingestion-prompt-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Strengthen, rebuild, and prove P122
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/gemini-youtube-ingestion-prompt-20260827 --prune
          test "$(git branch --show-current)" = 'feat/gemini-youtube-ingestion-prompt-20260827'
          python scripts/tmp_strengthen_p122_gemini.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_gemini_youtube_playlist_ingestion_prompt -v
          python -m unittest tests.test_sysadminsuite_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output "$RUNNER_TEMP/prompt-kit-order-navigation-audit.json" --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Remove temporary branch carriers and commit durable owner
        shell: bash
        run: |
          set -euo pipefail
          git rm -f scripts/tmp_strengthen_p122_gemini.py
          for path in .github/workflows/tmp-prompt-kit-gemini-live-proof.yml .github/workflows/tmp-prompt-kit-gemini-source-builder.yml .github/workflows/tmp-prompt-kit-gemini-source-builder2.yml .github/workflows/tmp-prompt-kit-gemini-source-builder3.yml; do
            if [ -e "$path" ]; then git rm -f "$path"; fi
          done
          git add registry/prompts/ai-engineering-level-up-prompts.v1.json web/prompt-kit/index.html tests/test_gemini_youtube_playlist_ingestion_prompt.py tests/test_sysadminsuite_prompt_registry.py harness/test-floor.v1.json
          git diff --cached --check
          git commit -m 'fix(prompt-kit): encode Gemini regressions in P122'
          git push origin HEAD:feat/gemini-youtube-ingestion-prompt-20260827
