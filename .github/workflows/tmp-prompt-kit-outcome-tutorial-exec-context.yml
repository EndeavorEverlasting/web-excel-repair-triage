name: Temporary Prompt Kit outcome tutorial and execution-context strengthener

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: prompt-kit-outcome-tutorial-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  strengthen:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/prompt-kit-outcome-tutorial-exec-context-20260826'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact current-main floor and fetch donor canary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/p114-canary-network-20260826 --prune
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          echo "candidate=$(git rev-parse HEAD)"
          echo "main=$(git rev-parse origin/main)"

      - name: Strengthen canonical owners and tutorial routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json
          import subprocess
          from pathlib import Path

          REG = Path('registry/prompts/spec-architecture-prompts.v1.json')
          payload = json.loads(REG.read_text(encoding='utf-8'))
          by_id = {p['id']: p for p in payload['prompts']}
          p92 = by_id['P92']
          if p92['name'] != 'Canonical Path Prompt':
              raise SystemExit('P92 identity mismatch')

          p92['sprintRole'] = (
              'Establish and enforce one repository-owned canonical development checkout and production/use path per supported machine/profile, '
              'derive literal paths from current OS/user/special-folder/cloud-sync evidence, resolve the material terminal/shell/kernel/runtime boundary before '
              'choosing syntax or agent tooling, prevent duplicate working copies, and separate remote integration proof from local workstation deployment proof'
          )
          p92['useWhen'] = (
              'Agents or humans are using, cloning, installing, launching, or updating a repository and its canonical development or production path is missing, '
              'ambiguous, inconsistent across tools, or varies with OS, user profile, special-folder redirection, OneDrive/cloud state, terminal host, shell/interpreter, '
              'kernel/runtime boundary, or machine profile; especially when GitHub main is current but the workstation checkout/install may still be stale.'
          )
          p92['inspectFirst'] = (
              'Current remote/default-branch truth; repository governance and harness entrypoints; existing canonical-path or machine/profile contracts; current working '
              'directory and verified checkout candidates; native OS home/profile and special-folder resolution; username/account only as runtime evidence; OneDrive/cloud '
              'roots plus target-folder redirection/availability state when relevant; terminal surface, shell/interpreter, kernel/OS/runtime boundary, local/remote/container '
              'execution target, filesystem/path semantics, and agent/tool availability when command selection depends on them; launcher/installer/updater/worktree contracts; '
              'dirty or unique work; and tests/CI that claim path or deployment readiness.'
          )
          p92['expectedOutput'] = (
              'A canonical-path ledger plus a repo-owned harness contract, PATH INPUT RECEIPT, and material EXECUTION CONTEXT RECEIPT that identify the machine/profile '
              'resolution rule, OS/home/special-folder/cloud inputs, terminal/shell/kernel/runtime boundary, development checkout, production/use path, optional worktree root, '
              'and entrypoint; resolvers/validators that consume the contract; safe disposition of noncanonical copies without deleting unique work; and separate evidence for '
              'remote integration, local development freshness, production/install freshness, and real-entrypoint behavior.'
          )
          p92['nextStep'] = (
              'Resolve current repository and machine/profile truth; derive host path inputs from native OS/environment evidence including special-folder and OneDrive redirection '
              'state when relevant; resolve the material terminal, shell/interpreter, kernel/runtime, and execution target before emitting shell-specific commands or selecting '
              'shell-bound agent tooling; find or repair the single canonical path contract; reconcile conflicting checkouts without destroying unique work; then prove development '
              'and production paths separately before calling the app locally ready.'
          )
          p92['proofGate'] = (
              'The repository has exactly one authoritative path owner per supported machine/profile; literal paths are reproducibly derived from current OS/home/special-folder/'
              'cloud evidence rather than a hard-coded username; material execution context distinguishes terminal host, shell/interpreter, kernel/runtime, and target instead of '
              'guessing syntax from a terminal label; command/agent selection fails closed when that context is unknown; local Desktop and redirected Desktop/OneDrive states resolve '
              'according to the same tracked rule; ambiguous or unavailable roots fail closed; development, production/use, and temporary worktree roles are explicit; normal '
              'harness/launcher/update flows consume the owner; noncanonical locations are blocked or clearly diagnosed without destructive cleanup; a remote merged SHA is never '
              'treated as local deployment proof; and the strongest safe same-entrypoint check confirms the resolved production path or reports an exact inaccessible-runtime blocker.'
          )
          content = p92['copyContent']
          anchor = '''Resolution precedence: tracked canonical-path/profile contract -> authorized machine/profile override -> native home/special-folder/environment resolution -> verified existing-checkout evidence. Lower-precedence evidence may expose drift but may not silently replace the owner. If current host and target profile differ, route/handoff rather than fabricate a target path locally.\n\n6. FAIL CLOSED ON PATH DRIFT'''
          replacement = '''Resolution precedence: tracked canonical-path/profile contract -> authorized machine/profile override -> native home/special-folder/environment resolution -> verified existing-checkout evidence. Lower-precedence evidence may expose drift but may not silently replace the owner. If current host and target profile differ, route/handoff rather than fabricate a target path locally.\n\n5A. EXECUTION CONTEXT RECEIPT BEFORE COMMANDS OR AGENT SELECTION\nWhen command syntax, path semantics, launcher behavior, or agent/tool availability depends on the execution environment, resolve that environment before choosing the command or agent. Record only the material fields:\n- TERMINAL SURFACE / HOST — for example Windows Terminal, a console host, IDE terminal, SSH client, or CI runner. A terminal application is not the shell.\n- SHELL / INTERPRETER — for example `pwsh`, Windows PowerShell, `cmd.exe`, `bash`, `zsh`, Python, or another actual command interpreter.\n- KERNEL / OS / RUNTIME BOUNDARY — for example native Windows, WSL/Linux distribution, native Linux, macOS, container, VM, or another execution boundary.\n- EXECUTION TARGET — local host, WSL distro, container, VM, SSH/remote host, CI runner, or another explicitly resolved target.\n- PATH / FILESYSTEM SEMANTICS — Windows vs POSIX path rules plus material drive, mount, junction, symlink, case, or translation behavior.\n- TOOL / AGENT AVAILABILITY — only tools or AI-agent runtimes whose location/compatibility materially changes the next command.\n\nDo not infer the shell or kernel from a terminal brand. Windows Terminal can host PowerShell, `cmd.exe`, WSL shells, and other profiles. Likewise, a PowerShell prompt does not prove the target command will run against the Windows kernel rather than entering WSL, a container, VM, or remote host. When a syntax-sensitive command or agent choice is required and the material execution context cannot be recovered, classify `EXECUTION_CONTEXT=UNKNOWN`, re-anchor from current host/repository evidence, and do not emit a guessed shell-specific mutation command. If the current host differs from the intended target, route/handoff or construct an explicitly target-scoped invocation instead of executing the wrong-shell form locally.\n\n6. FAIL CLOSED ON PATH DRIFT'''
          if anchor not in content:
              raise SystemExit('P92 execution-context insertion anchor missing')
          content = content.replace(anchor, replacement, 1)
          content = content.replace(
              '- Could OS/user/home, Desktop Known Folder, OneDrive redirection, mount/junction, or profile state make the same logical rule resolve differently?\n',
              '- Could OS/user/home, Desktop Known Folder, OneDrive redirection, mount/junction, or profile state make the same logical rule resolve differently?\n- Could the terminal host mask a different shell, kernel/runtime, execution target, or path semantics and cause the next command or agent selection to be wrong?\n',
              1,
          )
          content = content.replace(
              'Report the PATH INPUT RECEIPT/resolution source; canonical development/use/worktree paths;',
              'Report the PATH INPUT RECEIPT/resolution source; the material EXECUTION CONTEXT RECEIPT when command/agent choice depends on it; canonical development/use/worktree paths;',
              1,
          )
          p92['copyContent'] = content
          for kw in ('terminal context', 'shell context', 'kernel context', 'runtime context', 'powershell vs bash', 'wsl shell'):
              if kw not in p92['keywords']:
                  p92['keywords'].append(kw)

          donor_text = subprocess.check_output([
              'git','show','origin/feat/p114-canary-network-20260826:registry/prompts/spec-architecture-prompts.v1.json'
          ], text=True)
          donor = json.loads(donor_text)
          donor_p114 = next(p for p in donor['prompts'] if p.get('id') == 'P114')
          if donor_p114.get('name') != 'Conversation Context Canary & Handoff Guard':
              raise SystemExit('P114 donor identity mismatch')
          p114 = by_id['P114']
          identity = {k: p114[k] for k in ('id','seq','name','type','class','progress','color','copySheet','category','profile')}
          p114.clear(); p114.update(donor_p114)
          for k, v in identity.items():
              p114[k] = v
          p114['sprintRole'] = (
              'Keep a tiny per-response computer-profile and required-network signal visible during ordinary AI work, append material shell/kernel execution context only when '
              'command or agent choice depends on it, catch context drift early, re-anchor recoverable drift once, and produce a clean fresh-chat handoff on repeated degradation'
          )
          p114['useWhen'] = (
              'A long-running AI conversation depends on a stable computer profile, required network posture, or execution identity and the operator wants a lightweight visible '
              'signal on every response; append execution context when shell syntax, path semantics, terminal/kernel boundary, or AI-agent/tool selection materially affects the work.'
          )
          p114['inspectFirst'] = (
              "The current conversation's explicitly established computer profile, required network posture, and active execution identity; exact WAB, Guest, Hardwire, Local, or "
              'Arbitrary/N/A network labels when established; when command or agent choice is context-sensitive, the actual terminal host, shell/interpreter, kernel/OS/runtime '
              'boundary, execution target, and path semantics; when repository work is active, the canonical profile/path/network owner plus current repo, branch, lane, and task '
              'evidence; latest proven artifacts or handoff state; and accessible prior context needed to recover those facts without asking the operator to repeat them.'
          )
          p114['expectedOutput'] = (
              'One compact Canary line before every response with canonical PROFILE and required NETWORK, optionally `EXEC=<shell>@<kernel/runtime>` only when execution context '
              'materially affects command or agent selection; exact WAB/Guest/Hardwire/Local/Arbitrary/N/A network labeling; fail-closed UNKNOWN handling; one bounded re-anchor on '
              'drift; and a compact continuity handoff when drift repeats or core execution identity can no longer be recovered reliably.'
          )
          p114['nextStep'] = (
              'Keep doing the substantive work while PROFILE and NETWORK remain correct and any material EXEC value matches current evidence; before syntax-sensitive commands or '
              'agent selection, resolve shell/kernel context when required; on the first mismatch re-anchor from accessible evidence, and on repeated or unrecoverable drift emit the '
              'continuity handoff with the same proven floor.'
          )
          p114['proofGate'] = (
              'Representative multi-response sequences keep the Canary compact; required network labels retain the P114 semantics; Arbitrary/N/A never hides unknown; execution '
              'context is omitted when irrelevant and distinguishes terminal host from shell/interpreter and kernel/runtime when material; `EXEC=UNKNOWN` blocks guessed shell-specific '
              'commands/agent selection; seeded profile/network/execution-context drift is recoverable once from authoritative context; stylistic variation is not false drift; '
              'validation order covers stable baseline, recovery, legitimate change, repeated drift, and unrecoverable state; repeated drift crosses to an evidence-bearing handoff.'
          )
          c = p114['copyContent']
          c = c.replace(
              'Required network: xyz_WAB_Guest_Hardwire_Local_Arbitrary_NA_or_resolve_from_accessible_context\nRepository, branch, and lane:',
              'Required network: xyz_WAB_Guest_Hardwire_Local_Arbitrary_NA_or_resolve_from_accessible_context\nExecution context when command/agent selection is material: xyz_shell_at_kernel_runtime_or_resolve_from_accessible_context\nRepository, branch, and lane:',
              1,
          )
          mandatory = '''`CANARY | PROFILE=<canonical computer profile> | NETWORK=<WAB|Guest|Hardwire|Local|Arbitrary/N/A>`\nWhen repository identity materially affects the response'''
          mandatory_new = '''`CANARY | PROFILE=<canonical computer profile> | NETWORK=<WAB|Guest|Hardwire|Local|Arbitrary/N/A>`\nWhen command syntax, path semantics, or agent/tool selection materially depends on the execution environment, append only this compact field:\n` | EXEC=<shell>@<kernel/runtime>`\nExamples of shape are `pwsh@Windows`, `bash@WSL2-Ubuntu`, or `bash@Linux`; use evidence-backed runtime labels rather than inventing one. When execution context is irrelevant, omit EXEC instead of bloating every response.\nWhen repository identity materially affects the response'''
          if mandatory not in c:
              raise SystemExit('P114 mandatory-line anchor missing')
          c = c.replace(mandatory, mandatory_new, 1)
          network_end = '''- Do not invent SSIDs, VPNs, domains, credentials, trust state, or technical meaning behind these labels. Existing operator/repository network authority defines what the labels mean; the Canary only carries the smallest required label.\n\nAUTHORITATIVE PROFILE + NETWORK RULE'''
          exec_section = '''- Do not invent SSIDs, VPNs, domains, credentials, trust state, or technical meaning behind these labels. Existing operator/repository network authority defines what the labels mean; the Canary only carries the smallest required label.\n\nEXECUTION CONTEXT SEMANTICS\n`EXEC` is conditional execution identity, not a mandatory third field. Use it when the next command, path, launcher, or AI-agent/tool choice could change because the environment changes. Resolve the actual shell/interpreter and kernel/OS/runtime boundary; treat the terminal application only as a host surface. Windows Terminal, for example, can host PowerShell, `cmd.exe`, WSL shells, and other profiles, so `TERMINAL=Windows Terminal` is not enough to choose syntax. Include the execution target (local, WSL, container, VM, SSH/remote, CI) in the substantive re-anchor when it matters.\n- If material execution context is established, emit `EXEC=<shell>@<kernel/runtime>`.\n- If it is required but unrecoverable, emit `EXEC=UNKNOWN`, re-anchor, and do not guess a shell-specific mutation command or shell-bound agent runtime.\n- If current host and intended target differ, keep that distinction explicit; do not silently treat host syntax/path semantics as target truth.\n- A legitimate shell/kernel/target change backed by newer evidence is not drift.\n\nAUTHORITATIVE PROFILE + NETWORK + EXECUTION CONTEXT RULE'''
          if network_end not in c:
              raise SystemExit('P114 network-section anchor missing')
          c = c.replace(network_end, exec_section, 1)
          c = c.replace(
              'Use the strongest accessible current evidence for the computer profile and required network:',
              'Use the strongest accessible current evidence for the computer profile, required network, and material execution context:',
              1,
          )
          c = c.replace(
              'If the computer profile cannot be recovered, emit `PROFILE=UNKNOWN`; if a relevant required network cannot be recovered, emit `NETWORK=UNKNOWN`; then execute the re-anchor procedure.',
              'If the computer profile cannot be recovered, emit `PROFILE=UNKNOWN`; if a relevant required network cannot be recovered, emit `NETWORK=UNKNOWN`; if syntax/agent selection requires execution context that cannot be recovered, emit `EXEC=UNKNOWN`; then execute the re-anchor procedure.',
              1,
          )
          c = c.replace(
              'Keep PROFILE and NETWORK semantically stable and compact;',
              'Keep PROFILE and NETWORK semantically stable and compact; keep EXEC omitted when irrelevant and stable when material;',
              1,
          )
          c = c.replace(
              'On the first material Canary mismatch, omission, contradiction, `PROFILE=UNKNOWN`, or network-sensitive `NETWORK=UNKNOWN`:',
              'On the first material Canary mismatch, omission, contradiction, `PROFILE=UNKNOWN`, network-sensitive `NETWORK=UNKNOWN`, or command-sensitive `EXEC=UNKNOWN`:',
              1,
          )
          c = c.replace(
              '- recover the canonical computer profile, required network, and current task from accessible chat, repository, harness, artifact, or handoff evidence;',
              '- recover the canonical computer profile, required network, material shell/kernel/target context, and current task from accessible chat, repository, harness, artifact, or handoff evidence;',
              1,
          )
          c = c.replace(
              '- required network (`WAB`, `Guest`, `Hardwire`, `Local`, `Arbitrary/N/A`) or explicit UNKNOWN blocker;\n- repo, branch, PR, lane, and scope only when active;',
              '- required network (`WAB`, `Guest`, `Hardwire`, `Local`, `Arbitrary/N/A`) or explicit UNKNOWN blocker;\n- material execution context (`<shell>@<kernel/runtime>` plus target detail when needed) or explicit UNKNOWN blocker;\n- repo, branch, PR, lane, and scope only when active;',
              1,
          )
          c = c.replace(
              'CANARY STUB — Before every response emit CANARY | PROFILE=<canonical computer profile> | NETWORK=<WAB|Guest|Hardwire|Local|Arbitrary/N/A>. NETWORK is the required posture, not observed connectivity.',
              'CANARY STUB — Before every response emit CANARY | PROFILE=<canonical computer profile> | NETWORK=<WAB|Guest|Hardwire|Local|Arbitrary/N/A>. Append ` | EXEC=<shell>@<kernel/runtime>` only when command/agent choice materially depends on execution context. NETWORK is the required posture, not observed connectivity.',
              1,
          )
          c = c.replace(
              '- Repository machine/profile/path/network contracts remain authoritative for what the computer profile and required network actually are;',
              '- P92 Canonical Path Prompt and repository machine/profile/path/network contracts remain authoritative for canonical paths and material execution context; this Canary carries only the smallest observed profile/network/execution signal and must not create a competing registry.\n- Repository machine/profile/path/network contracts remain authoritative for what the computer profile and required network actually are;',
              1,
          )
          c = c.replace(
              '- Never fabricate a required network or use `Arbitrary/N/A` merely because the requirement was forgotten.\n',
              '- Never fabricate a required network or use `Arbitrary/N/A` merely because the requirement was forgotten.\n- Never infer shell/kernel/runtime from a terminal brand, and never choose syntax-sensitive mutation commands or shell-bound agent tooling from an unresolved EXEC context.\n',
              1,
          )
          c = c.replace(
              '2. RECOVERY CASE — seed one omission, one wrong profile, and one wrong required-network label;',
              '2. RECOVERY CASE — seed one omission, one wrong profile, one wrong required-network label, and one wrong material shell/kernel execution context;',
              1,
          )
          c = c.replace(
              '3. LEGITIMATE CHANGE — change the profile or required network only when newer authoritative evidence establishes the change;',
              '3. LEGITIMATE CHANGE — change the profile, required network, shell/kernel runtime, or execution target only when newer authoritative evidence establishes the change;',
              1,
          )
          c = c.replace(
              '5. UNRECOVERABLE STATE — make the canonical profile or a relevant required network unrecoverable;',
              '5. UNRECOVERABLE STATE — make the canonical profile, a relevant required network, or a command-sensitive execution context unrecoverable;',
              1,
          )
          c = c.replace(
              'profile, required network, active execution identity, mission, proven floor, gap, forbidden scope, and first executable continuation.',
              'profile, required network, material execution context when relevant, active execution identity, mission, proven floor, gap, forbidden scope, and first executable continuation.',
              1,
          )
          p114['copyContent'] = c
          for kw in ('execution canary','shell canary','kernel runtime','terminal context','exec unknown'):
              if kw not in p114['keywords']:
                  p114['keywords'].append(kw)

          REG.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # P92 focused regression additions.
          test_path = Path('tests/test_spec_architecture_prompt_registry.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '            "tracked canonical-path/profile contract -> authorized machine/profile override",\n'
          addition = anchor + '''            "EXECUTION CONTEXT RECEIPT BEFORE COMMANDS OR AGENT SELECTION",\n            "A terminal application is not the shell",\n            "KERNEL / OS / RUNTIME BOUNDARY",\n            "EXECUTION_CONTEXT=UNKNOWN",\n            "Windows Terminal can host PowerShell",\n            "do not emit a guessed shell-specific mutation command",\n'''
          if anchor not in test:
              raise SystemExit('P92 test anchor missing')
          test = test.replace(anchor, addition, 1)
          test_path.write_text(test, encoding='utf-8')

          # Replace the P114 focused regression with the combined network + execution-context contract.
          Path('tests/test_conversation_context_canary_prompt.py').write_text(r'''from __future__ import annotations

import json
import unittest
from pathlib import Path

from scripts import build_prompt_kit_registry

REPO_ROOT = Path(__file__).resolve().parents[1]
RAW_REGISTRY = REPO_ROOT / "registry" / "prompts" / "spec-architecture-prompts.v1.json"
TEST_FLOOR = REPO_ROOT / "harness" / "test-floor.v1.json"
TARGET_NAME = "Conversation Context Canary & Handoff Guard"
TEST_PATH = "tests/test_conversation_context_canary_prompt.py"


class ConversationContextCanaryPromptTests(unittest.TestCase):
    @classmethod
    def setUpClass(cls) -> None:
        cls.full = build_prompt_kit_registry.load_prompt_kit_registry()
        cls.by_id = {prompt["id"]: prompt for prompt in cls.full}
        matches = [prompt for prompt in cls.full if prompt.get("name") == TARGET_NAME]
        if len(matches) != 1:
            raise AssertionError(f"expected one {TARGET_NAME!r}, found {len(matches)}")
        cls.target = matches[0]
        raw_prompts = json.loads(RAW_REGISTRY.read_text(encoding="utf-8"))["prompts"]
        raw_matches = [prompt for prompt in raw_prompts if prompt.get("name") == TARGET_NAME]
        if len(raw_matches) != 1:
            raise AssertionError(f"expected one raw {TARGET_NAME!r}, found {len(raw_matches)}")
        cls.raw = raw_matches[0]

    def test_identity_and_profile_remain_stable(self) -> None:
        self.assertEqual(self.target["id"], "P114")
        self.assertEqual(self.target["seq"], "114")
        self.assertEqual(self.target["copySheet"], "P114_COPY_SAFE")
        self.assertEqual(self.target["profile"], "spec-architecture")
        self.assertEqual(self.target["class"], "CONTEXT / CONTINUITY")
        self.assertEqual(self.raw["id"], self.target["id"])

    def test_canary_requires_profile_and_required_network_every_response(self) -> None:
        content = self.target["copyContent"]
        for phrase in (
            "MANDATORY FIRST LINE",
            "CANARY | PROFILE=<canonical computer profile> | NETWORK=<WAB|Guest|Hardwire|Local|Arbitrary/N/A>",
            "Do not expand the normal Canary into scope narration",
            "Keep the normal Canary to one line",
        ):
            self.assertIn(phrase, content)
        for network in ("WAB", "Guest", "Hardwire", "Local", "Arbitrary/N/A"):
            self.assertIn(network, content)

    def test_network_is_required_posture_not_observed_connectivity(self) -> None:
        content = self.target["copyContent"]
        for phrase in (
            "REQUIRED NETWORK SEMANTICS",
            "network the user should be on for the current task",
            "not, by itself, a claim that the agent has observed the user's live connection",
            "It must never be used as a synonym for unknown",
            "NETWORK=UNKNOWN",
        ):
            self.assertIn(phrase, content)

    def test_execution_context_is_conditional_and_distinguishes_terminal_shell_kernel(self) -> None:
        content = self.target["copyContent"]
        for phrase in (
            "EXECUTION CONTEXT SEMANTICS",
            "EXEC=<shell>@<kernel/runtime>",
            "EXEC=UNKNOWN",
            "terminal application only as a host surface",
            "Windows Terminal, for example, can host PowerShell, `cmd.exe`, WSL shells",
            "do not guess a shell-specific mutation command or shell-bound agent runtime",
            "When execution context is irrelevant, omit EXEC",
        ):
            self.assertIn(phrase, content)

    def test_unknown_material_context_fails_closed_and_reanchors(self) -> None:
        content = self.target["copyContent"]
        for phrase in (
            "PROFILE=UNKNOWN",
            "NETWORK=UNKNOWN",
            "command-sensitive `EXEC=UNKNOWN`",
            "RE-ANCHOR ONCE",
            "Do not ask the operator to repeat recoverable context",
        ):
            self.assertIn(phrase, content)

    def test_canary_is_sensor_not_fake_telemetry(self) -> None:
        content = self.target["copyContent"]
        self.assertIn("CANARY IS A SENSOR, NOT PROOF", content)
        self.assertIn("not mathematical proof that the context window is exhausted", content)
        self.assertIn("Do not treat harmless wording changes as drift", content)

    def test_handoff_preserves_network_and_material_execution_context(self) -> None:
        content = self.target["copyContent"]
        for phrase in (
            "HANDOFF ON REPEATED OR UNRECOVERABLE DRIFT",
            "required network (`WAB`, `Guest`, `Hardwire`, `Local`, `Arbitrary/N/A`)",
            "material execution context (`<shell>@<kernel/runtime>` plus target detail when needed)",
            "current mission and forbidden scope",
            "last proven artifacts, SHAs, checks, or other evidence",
            "first executable next action",
        ):
            self.assertIn(phrase, content)

    def test_lightweight_stub_does_not_duplicate_owner(self) -> None:
        content = self.target["copyContent"]
        self.assertIn("ONE CANONICAL CONTRACT, LIGHTWEIGHT EMBEDDING", content)
        self.assertIn("do not paste this entire contract into every prompt", content)
        self.assertIn("Append ` | EXEC=<shell>@<kernel/runtime>` only when command/agent choice materially depends", content)
        self.assertIn("P92 Canonical Path Prompt", content)
        self.assertIn("must not create a competing profile or network registry", content)

    def test_semantic_falsification_order_covers_exec_context(self) -> None:
        content = self.target["copyContent"]
        ordered = ("1. STABLE BASELINE", "2. RECOVERY CASE", "3. LEGITIMATE CHANGE", "4. REPEATED DRIFT", "5. UNRECOVERABLE STATE")
        positions = [content.index(marker) for marker in ordered]
        self.assertEqual(positions, sorted(positions))
        self.assertIn("wrong material shell/kernel execution context", content)
        self.assertIn("shell/kernel runtime, or execution target", content)
        self.assertIn("command-sensitive execution context unrecoverable", content)

    def test_neighbor_owners_remain_distinct(self) -> None:
        self.assertEqual(self.by_id["P02"]["name"], "Previous Chat → Active Sprint Executor")
        self.assertEqual(self.by_id["P76"]["name"], "Progressive-Disclosure Spec & Harness Factorer")
        self.assertNotEqual(self.target["id"], "P02")
        self.assertNotEqual(self.target["id"], "P76")

    def test_registered_in_deterministic_test_floor(self) -> None:
        floor = json.loads(TEST_FLOOR.read_text(encoding="utf-8"))
        self.assertEqual(floor["self_tests"].count(TEST_PATH), 1)
        self.assertIn("tests/test_*_prompt.py", floor["prompt_semantic_test_globs"])

    def test_generated_site_is_exact_and_contains_canary(self) -> None:
        html = build_prompt_kit_registry.DEFAULT_OUTPUT.read_text(encoding="utf-8")
        self.assertEqual(html, build_prompt_kit_registry.render())
        self.assertIn("P114", html)
        self.assertIn(TARGET_NAME, html)
        self.assertIn("EXEC=&lt;shell&gt;@&lt;kernel/runtime&gt;", html)


if __name__ == "__main__":
