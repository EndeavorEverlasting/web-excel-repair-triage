name: Temporary Prompt Kit programming paradigm campaign

on:
  push:
    branches:
      - feat/prompt-kit-programming-paradigm-guidance-20260906
    paths:
      - '.github/workflows/tmp-prompt-kit-paradigm-campaign.yml'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact campaign head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Strengthen canonical paradigm owners
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          docs_path = root / 'docs' / 'prompts.json'
          spec_path = root / 'registry' / 'prompts' / 'spec-architecture-prompts.v1.json'
          build_path = root / 'build_prompt_kit.py'
          test_path = root / 'tests' / 'test_spec_architecture_prompt_registry.py'

          docs = json.loads(docs_path.read_text(encoding='utf-8'))
          by_id = {p['id']: p for p in docs}
          p07 = by_id['P07']
          p14 = by_id['P14']

          p07_heading = 'CODE READABILITY / EDITABILITY FLOOR\n'
          p07_insert = (
              '- When touched source introduces or changes a meaningful design boundary, inspect the local programming paradigm at that seam rather than drifting into one accidentally. Preserve or deliberately choose object-oriented, functional, procedural/imperative, declarative, data-oriented, event/message-driven, or an explicit hybrid based on state/invariant ownership, side effects, coupling, concurrency, test seams, and repository/language/framework conventions; do not impose a favorite paradigm by taste.\n'
              '- Treat accidental mixed paradigms that obscure ownership or duplicate rules as readability/editability debt. Repair a bounded regression in-scope; route broader paradigm refactoring to P124.\n'
          )
          if 'local programming paradigm at that seam' not in p07['copyContent']:
              if p07_heading not in p07['copyContent']:
                  raise SystemExit('P07 readability heading not found')
              p07['copyContent'] = p07['copyContent'].replace(p07_heading, p07_heading + p07_insert, 1)
          if 'programming-paradigm mismatch' not in p07['proofGate']:
              p07['proofGate'] += ' Any material touched-source programming-paradigm mismatch that worsens coupling, ownership, side-effect clarity, or editability is repaired in-scope or explicitly routed to P124.'

          p14_heading = 'READABILITY / STRUCTURAL EDITABILITY CHECK — STANDARDS, NOT TASTE\n'
          p14_insert = (
              '- When a diff materially changes a design boundary, review paradigm coherence as an engineering property rather than a style preference. Require an evidence-backed local fit for object-oriented, functional, procedural/imperative, declarative, data-oriented, event/message-driven, or explicit hybrid structure; flag accidental mixing only when it increases coupling, hides state/side effects, duplicates rules, or obscures ownership. Route broad redesign to P124 instead of demanding a repository-wide rewrite.\n'
          )
          if 'review paradigm coherence as an engineering property' not in p14['copyContent']:
              if p14_heading not in p14['copyContent']:
                  raise SystemExit('P14 readability heading not found')
              p14['copyContent'] = p14['copyContent'].replace(p14_heading, p14_heading + p14_insert, 1)
          if 'paradigm coherence' not in p14['proofGate'].lower():
              p14['proofGate'] += ' Material paradigm-coherence findings are evidence-backed and tied to coupling, state/side-effect clarity, ownership, or editability rather than reviewer taste; broader refactors are routed to P124.'

          docs_path.write_text(json.dumps(docs, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          spec = json.loads(spec_path.read_text(encoding='utf-8'))
          p124 = next(p for p in spec['prompts'] if p['id'] == 'P124')
          if 'programming paradigm is accidental' not in p124['useWhen']:
              p124['useWhen'] += ' It also owns cases where a programming paradigm is accidental, internally inconsistent, or poorly matched to the responsibility being changed.'
          if 'dominant local programming paradigms' not in p124['inspectFirst']:
              p124['inspectFirst'] += ' Dominant local programming paradigms and language/framework idioms; state, mutability, side-effect, concurrency, lifecycle, and data-flow boundaries at the hotspot.'
          if 'paradigm-fit disposition' not in p124['expectedOutput']:
              p124['expectedOutput'] += ' For materially affected design boundaries, include a concise paradigm-fit disposition showing what was preserved or changed and why.'
          if 'paradigm choices are local' not in p124['proofGate']:
              p124['proofGate'] += ' Material paradigm choices are local and evidence-backed rather than ideological; explicit hybrids keep state, side effects, ownership, and execution boundaries obvious.'

          paradigm_section = '''\n\n4A. PROGRAMMING PARADIGM FIT — TOOL, NOT RELIGION\nFor each materially affected design boundary, identify the repository/language/framework idiom and record PRESERVE, ADOPT, HYBRIDIZE, or DEFER. Choose by responsibility, not fashion:\n- Object-oriented fits identity, lifecycle, encapsulated mutable state/invariants, or genuinely substitutable behavior. Avoid data-only service classes, inheritance ladders, and object ceremony around stateless transforms.\n- Functional fits deterministic transformations, rules, calculations, and pipelines; keep side effects explicit at boundaries. Avoid clever composition, hidden mutable closures, or purity theater around inherently stateful lifecycles.\n- Procedural/imperative fits clear ordered orchestration and I/O when sequence is the domain story. Do not wrap a readable linear workflow in classes or combinators without a real ownership/test seam.\n- Declarative fits configuration, schema/query, UI/state description, or policy where a framework/runtime owns execution. Do not hide imperative lifecycle effects inside opaque declarations.\n- Data-oriented fits measured throughput or layout-sensitive batch/hot-loop work; require evidence before architecture churn. Event/message-driven fits real asynchronous integration boundaries only when event identity, ordering, idempotency, retry, and failure semantics are explicit.\n- Hybrids are valid when seams are explicit, such as a functional core with an imperative shell or stateful objects using pure domain helpers. One module may mix techniques only while ownership and effects stay obvious.\nDo not rewrite coherent code merely to standardize on a favorite paradigm. Treat paradigm mismatch as debt only when it materially worsens coupling, state/side-effect clarity, testability, ownership, or maintainability.'''
          if '4A. PROGRAMMING PARADIGM FIT — TOOL, NOT RELIGION' not in p124['copyContent']:
              anchor = '\n\n5. DO NOT REPLACE A MONOLITH WITH A MAZE'
              if anchor not in p124['copyContent']:
                  raise SystemExit('P124 section anchor not found')
              p124['copyContent'] = p124['copyContent'].replace(anchor, paradigm_section + anchor, 1)
          second_pass_old = 'did extraction create new indirection, duplication, or scattered ownership; what high-impact structural debt remains?'
          second_pass_new = 'did extraction create new indirection, duplication, or scattered ownership; did each changed boundary preserve or choose its paradigm deliberately; what high-impact structural debt remains?'
          if second_pass_old in p124['copyContent']:
              p124['copyContent'] = p124['copyContent'].replace(second_pass_old, second_pass_new, 1)
          deliver_old = 'remaining deferred debt, and the exact next executable action.'
          deliver_new = 'paradigm-fit dispositions for materially changed boundaries, remaining deferred debt, and the exact next executable action.'
          if deliver_old in p124['copyContent']:
              p124['copyContent'] = p124['copyContent'].replace(deliver_old, deliver_new, 1)

          paradigm_keywords = [
              'programming paradigm',
              'functional programming',
              'object-oriented programming',
              'OOP',
              'procedural programming',
              'imperative programming',
              'declarative programming',
              'data-oriented programming',
              'event-driven programming',
              'functional core imperative shell',
          ]
          for keyword in paradigm_keywords:
              if keyword not in p124['keywords']:
                  p124['keywords'].append(keyword)
          spec_path.write_text(json.dumps(spec, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          build_text = build_path.read_text(encoding='utf-8')
          synonym_anchor = '    "structural refactor": "P124", "maintainability refactor": "P124", "god file": "P124", "giant function": "P124",\n'
          synonym_insert = (
              '    "programming paradigm": "P124", "functional programming": "P124", "object-oriented programming": "P124", "oop": "P124",\n'
              '    "procedural programming": "P124", "imperative programming": "P124", "declarative programming": "P124",\n'
              '    "data-oriented programming": "P124", "event-driven programming": "P124", "functional core imperative shell": "P124",\n'
          )
          if '"functional programming": "P124"' not in build_text:
              if synonym_anchor not in build_text:
                  raise SystemExit('P124 synonym anchor not found')
              build_text = build_text.replace(synonym_anchor, synonym_anchor + synonym_insert, 1)
              build_path.write_text(build_text, encoding='utf-8')

          test_text = test_path.read_text(encoding='utf-8')
          if 'test_programming_paradigm_guidance_is_owned_by_p124_and_enforced_at_execution_review_seams' not in test_text:
              method = '''\n    def test_programming_paradigm_guidance_is_owned_by_p124_and_enforced_at_execution_review_seams(self) -> None:\n        owner = self.full["P124"]\n        content = owner["copyContent"]\n        for phrase in (\n            "PROGRAMMING PARADIGM FIT — TOOL, NOT RELIGION",\n            "PRESERVE, ADOPT, HYBRIDIZE, or DEFER",\n            "Object-oriented fits identity, lifecycle",\n            "Functional fits deterministic transformations",\n            "Procedural/imperative fits clear ordered orchestration",\n            "Declarative fits configuration",\n            "Data-oriented fits measured throughput",\n            "Event/message-driven fits real asynchronous integration boundaries",\n            "Hybrids are valid when seams are explicit",\n            "Do not rewrite coherent code merely to standardize on a favorite paradigm",\n        ):\n            self.assertIn(phrase, content)\n        for keyword in (\n            "programming paradigm",\n            "functional programming",\n            "object-oriented programming",\n            "OOP",\n            "procedural programming",\n            "declarative programming",\n            "data-oriented programming",\n            "event-driven programming",\n        ):\n            self.assertIn(keyword, owner["keywords"])\n        for synonym in (\n            "programming paradigm",\n            "functional programming",\n            "object-oriented programming",\n            "oop",\n            "procedural programming",\n            "imperative programming",\n            "declarative programming",\n            "data-oriented programming",\n            "event-driven programming",\n            "functional core imperative shell",\n        ):\n            self.assertEqual(build_prompt_kit.SYNONYMS[synonym], "P124")\n        self.assertIn("local programming paradigm at that seam", self.full["P07"]["copyContent"])\n        self.assertIn("programming-paradigm mismatch", self.full["P07"]["proofGate"])\n        self.assertIn("review paradigm coherence as an engineering property", self.full["P14"]["copyContent"])\n        self.assertIn("paradigm-coherence findings", self.full["P14"]["proofGate"])\n        self.assertEqual(self.full["P86"]["name"], "Prompt Semantic Hardener & Principle Integrator")\n        self.assertEqual(self.full["P79"]["name"], "Prompt Registry Prompt Adder")\n\n'''
              marker = '\nif __name__ == "__main__":\n'
              if marker not in test_text:
                  raise SystemExit('test module insertion marker not found')
              test_text = test_text.replace(marker, method + marker, 1)
              test_path.write_text(test_text, encoding='utf-8')
          PY
      - name: Rebuild canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate prompt contribution campaign
        run: |
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_kit_order_navigation_contract -v
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output Outputs/prompt-kit-order-navigation-audit.json --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Enforce bounded durable diff and remove carrier
        env:
          BASE_SHA: 193f6bbd3198bf1bf3ef210c5540ca979d0a9eae
        run: |
          rm .github/workflows/tmp-prompt-kit-paradigm-campaign.yml
          changed="$(git diff --name-only "$BASE_SHA" | sort)"
          expected="$(printf '%s\n' \
            'build_prompt_kit.py' \
            'docs/prompts.json' \
            'registry/prompts/spec-architecture-prompts.v1.json' \
            'tests/test_spec_architecture_prompt_registry.py' \
            'web/prompt-kit/index.html' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected durable diff:\n%s\n' "$changed" >&2
            exit 1
          }
      - name: Commit and push durable campaign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(prompt-kit): enforce programming paradigm fit'
          git push origin HEAD:feat/prompt-kit-programming-paradigm-guidance-20260906
