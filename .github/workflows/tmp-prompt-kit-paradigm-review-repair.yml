name: Temporary Prompt Kit paradigm review repair

on:
  push:
    branches:
      - feat/prompt-kit-programming-paradigm-guidance-20260906
    paths:
      - '.github/workflows/tmp-prompt-kit-paradigm-review-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Remove invalid legacy-builder aliases and strengthen canonical keyword proof
        run: |
          python - <<'PY'
          from pathlib import Path

          build_path = Path('build_prompt_kit.py')
          build_text = build_path.read_text(encoding='utf-8')
          alias_block = (
              '    "programming paradigm": "P128", "functional programming": "P128", "object-oriented programming": "P128", "oop": "P128",\n'
              '    "procedural programming": "P128", "imperative programming": "P128", "declarative programming": "P128",\n'
              '    "data-oriented programming": "P128", "event-driven programming": "P128", "functional core imperative shell": "P128",\n'
          )
          if alias_block not in build_text:
              raise SystemExit('expected P128 legacy-builder alias block not found')
          build_path.write_text(build_text.replace(alias_block, '', 1), encoding='utf-8')

          test_path = Path('tests/test_spec_architecture_prompt_registry.py')
          test_text = test_path.read_text(encoding='utf-8')
          old = '        for synonym in ("programming paradigm", "functional programming", "object-oriented programming", "oop", "procedural programming", "imperative programming", "declarative programming", "data-oriented programming", "event-driven programming", "functional core imperative shell"):\n            self.assertEqual(build_prompt_kit.SYNONYMS[synonym], sid)\n'
          new = (
              '        for keyword in (\n'
              '            "programming paradigm", "functional programming", "object-oriented programming", "OOP",\n'
              '            "procedural programming", "imperative programming", "declarative programming",\n'
              '            "data-oriented programming", "event-driven programming", "functional core imperative shell",\n'
              '        ):\n'
              '            self.assertIn(keyword, specialist["keywords"])\n'
          )
          if old not in test_text:
              raise SystemExit('expected legacy-builder synonym assertion block not found')
          test_path.write_text(test_text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Rebuild canonical combined Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Revalidate contribution and discovery ownership
        run: |
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_kit_order_navigation_contract -v
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output Outputs/prompt-kit-order-navigation-audit.json --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Enforce corrected durable ownership and self-remove
        env:
          BASE_SHA: 193f6bbd3198bf1bf3ef210c5540ca979d0a9eae
        run: |
          rm .github/workflows/tmp-prompt-kit-paradigm-review-repair.yml
          changed="$(git diff --name-only "$BASE_SHA" | sort)"
          expected="$(printf '%s\n' \
            'docs/prompts.json' \
            'registry/prompts/spec-architecture-prompts.v1.json' \
            'tests/test_spec_architecture_prompt_registry.py' \
            'web/prompt-kit/index.html' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected durable diff after review repair:\n%s\n' "$changed" >&2
            exit 1
          }
      - name: Commit and push review repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(prompt-kit): keep paradigm discovery on canonical registry'
          git push origin HEAD:feat/prompt-kit-programming-paradigm-guidance-20260906
