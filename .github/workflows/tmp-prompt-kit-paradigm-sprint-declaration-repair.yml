name: Temporary Prompt Kit P128 sprint declaration repair

on:
  push:
    branches:
      - feat/prompt-kit-programming-paradigm-guidance-20260906
    paths:
      - '.github/workflows/tmp-prompt-kit-paradigm-sprint-declaration-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Add mandatory P128 writing-sprint declaration and pin public identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          spec_path = Path('registry/prompts/spec-architecture-prompts.v1.json')
          spec = json.loads(spec_path.read_text(encoding='utf-8'))
          p128 = next(p for p in spec['prompts'] if p['id'] == 'P128')
          old_header = (
              'Repo: xyz_repo_or_path\n'
              'Target responsibility/boundary: xyz_boundary_or_resolve_from_evidence\n'
              'Observed paradigm concern: xyz_concern_or_unknown\n'
              'Forbidden behavior changes: xyz_forbidden_behavior_or_resolve_from_repo\n\n'
              'MISSION\n'
          )
          new_header = (
              'Repo: xyz_repo_or_path\n'
              'Branch/worktree: xyz_branch_or_worktree_or_resolve_from_repo\n'
              'Lane/sprint: xyz_lane_or_sprint_name\n'
              'Owned scope: xyz_owned_scope\n'
              'Forbidden scope: xyz_forbidden_scope\n'
              'Dependencies/collision risks: xyz_dependencies_and_collisions_or_resolve_from_repo\n'
              'Expected tracked artifacts: xyz_expected_artifacts_or_resolve_from_repo\n'
              'Validation order: xyz_validation_commands_or_resolve_from_repo\n'
              'Integration authority: xyz_merge_or_integration_authority_or_resolve_from_provider\n'
              'Proof ceiling: xyz_proof_ceiling\n'
              'Commit/PR expectation: xyz_commit_pr_expectation_or_resolve_from_repo\n'
              'Target responsibility/boundary: xyz_boundary_or_resolve_from_evidence\n'
              'Observed paradigm concern: xyz_concern_or_unknown\n'
              'Forbidden behavior changes: xyz_forbidden_behavior_or_resolve_from_repo\n\n'
              'SPRINT DECLARATION — REQUIRED BEFORE MUTATION\n'
              'Resolve the declaration above from repository/provider evidence before editing. Do not begin mutation with branch/lane/scope/collision/artifact/validation/integration/proof fields left implicit; involve the user only for a genuinely user-only decision.\n\n'
              'MISSION\n'
          )
          if 'SPRINT DECLARATION — REQUIRED BEFORE MUTATION' not in p128['copyContent']:
              if old_header not in p128['copyContent']:
                  raise SystemExit('P128 input header anchor not found')
              p128['copyContent'] = p128['copyContent'].replace(old_header, new_header, 1)
          declaration_gate = 'The repository writing-sprint declaration is resolved before mutation, including branch/worktree, lane, owned/forbidden scope, dependencies/collisions, expected artifacts, validation order, integration authority, proof ceiling, and commit/PR expectation.'
          if declaration_gate not in p128['proofGate']:
              p128['proofGate'] += ' ' + declaration_gate
          spec_path.write_text(json.dumps(spec, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test_path = Path('tests/test_spec_architecture_prompt_registry.py')
          text = test_path.read_text(encoding='utf-8')
          anchor = '        sid = specialist["id"]\n        content = specialist["copyContent"]\n'
          replacement = '        sid = specialist["id"]\n        self.assertEqual(sid, "P128")\n        self.assertEqual(specialist["seq"], "128")\n        content = specialist["copyContent"]\n'
          if 'self.assertEqual(sid, "P128")' not in text:
              if anchor not in text:
                  raise SystemExit('P128 identity assertion anchor not found')
              text = text.replace(anchor, replacement, 1)
          declaration_assertions = '''        for declaration_field in (
            "Branch/worktree:", "Lane/sprint:", "Owned scope:", "Forbidden scope:",
            "Dependencies/collision risks:", "Expected tracked artifacts:", "Validation order:",
            "Integration authority:", "Proof ceiling:", "Commit/PR expectation:",
            "SPRINT DECLARATION — REQUIRED BEFORE MUTATION",
        ):
            self.assertIn(declaration_field, content)
'''
          marker = '        self.assertLess(len(self.raw[sid]["copyContent"]), 7000)\n'
          if 'for declaration_field in (' not in text:
              if marker not in text:
                  raise SystemExit('P128 boundedness assertion anchor not found')
              text = text.replace(marker, declaration_assertions + marker, 1)
          test_path.write_text(text, encoding='utf-8')
          PY
      - name: Rebuild canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate repaired contribution
        run: |
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_kit_order_navigation_contract -v
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output Outputs/prompt-kit-order-navigation-audit.json --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Enforce four-file durable contribution and self-remove
        env:
          BASE_SHA: 193f6bbd3198bf1bf3ef210c5540ca979d0a9eae
        run: |
          rm .github/workflows/tmp-prompt-kit-paradigm-sprint-declaration-repair.yml
          changed="$(git diff --name-only "$BASE_SHA" | sort)"
          expected="$(printf '%s\n' \
            'docs/prompts.json' \
            'registry/prompts/spec-architecture-prompts.v1.json' \
            'tests/test_spec_architecture_prompt_registry.py' \
            'web/prompt-kit/index.html' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected durable diff after P128 declaration repair:\n%s\n' "$changed" >&2
            exit 1
          }
      - name: Commit and push declaration repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(prompt-kit): require P128 sprint declaration'
          git push origin HEAD:feat/prompt-kit-programming-paradigm-guidance-20260906
