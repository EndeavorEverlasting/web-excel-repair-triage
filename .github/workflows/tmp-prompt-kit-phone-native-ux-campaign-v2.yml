name: Temporary Prompt Kit phone-native UX modality campaign v2

on:
  push:
    branches:
      - feat/prompt-kit-phone-native-ux-modality-20260907
    paths:
      - '.github/workflows/tmp-prompt-kit-phone-native-ux-campaign-v2.yml'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Add bounded phone-native modality specialist through canonical helper
        shell: bash
        run: |
          set -o pipefail
          cat > /tmp/phone-native-ux-prompt.json <<'JSON'
          {
            "name": "Cross-Input UX Modality & Phone-Native Interaction Architect",
            "type": "DESIGN + BUILD",
            "class": "PRODUCT / UX INPUT MODALITY",
            "sprintRole": "Design and implement equivalent but mode-native interaction languages for mouse/pointer, keyboard power users, and phone/touch users, with phone treated as a first-class workflow rather than a resized desktop skin",
            "useWhen": "An app or UX-critical repository supports or should support mouse/pointer, keyboard, and phone/touch users, but one modality is an afterthought; especially when mobile means larger buttons or compressed desktop controls, touch depends on hover/double-click/browser Find, keyboard has a real power language while phone has no equivalent grammar, or equivalent capabilities diverge by input path.",
            "inspectFirst": "Fresh product/repository truth; primary user jobs and terminal actions; semantic command/action and state owners; pointer controls; keyboard shortcuts/sequences/focus rules; phone controls/gestures/command sheets, safe-area and software-keyboard behavior; responsive/accessibility contracts; browser/device proof; repeated cross-app patterns; overlapping UX/runtime work.",
            "expectedOutput": "A three-mode capability matrix, mouse/keyboard/phone interaction grammar, semantic-action convergence map, smallest phone-native repair for the highest-value gap, modality failure regressions, browser/device proof with explicit physical-phone ceiling, and routing of proven reusable patterns to P109.",
            "nextStep": "Audit one high-frequency terminal journey across mouse/pointer, keyboard-only, and phone/touch; repair the first missing, desktop-shaped, or semantically divergent phone capability on the existing action/state owner; then rerun all three modes plus phone-specific falsification before broadening.",
            "proofGate": "Every in-scope high-value capability has a reachable mode-native route; equivalent pointer, keyboard, and phone entrypoints converge on the same semantic action/state owner; phone does not depend on hover, tiny desktop chrome, double-click, browser Find, or accidental software-keyboard focus; gestures have labeled fallbacks and avoid scroll/browser conflicts; one physical action cannot double-dispatch through touch/pointer synthesis; touch emulation is not promoted to physical-phone ergonomic proof; and a second pass finds no practical in-scope modality gap.",
            "color": "Cyan",
            "profile": "spec-architecture",
            "copyContent": "DESIGN THREE REAL UX LANGUAGES: MOUSE DIRECT CONTROLS, KEYBOARD POWER COMMANDS, AND PHONE-NATIVE TOUCH. DO NOT CALL BIGGER BUTTONS A MOBILE EXPERIENCE.\n\nRepo/product: xyz_repo_or_product\nBranch/worktree: xyz_branch_or_worktree_or_resolve_from_repo\nLane/sprint: xyz_lane_or_sprint_name\nOwned scope: xyz_owned_scope\nForbidden scope: xyz_forbidden_scope\nDependencies/collision risks: xyz_dependencies_and_collisions_or_resolve_from_repo\nExpected tracked artifacts: xyz_expected_artifacts_or_resolve_from_repo\nValidation order: xyz_validation_commands_or_resolve_from_repo\nIntegration authority: xyz_merge_or_integration_authority_or_resolve_from_provider\nProof ceiling: xyz_proof_ceiling\nCommit/PR expectation: xyz_commit_pr_expectation_or_resolve_from_repo\nUX surface/journey: xyz_surface_or_resolve_from_context\nObserved phone failure: xyz_phone_failure_or_resolve_from_evidence\n\nSPRINT DECLARATION — REQUIRED BEFORE MUTATION\nResolve the declaration above from repository/provider evidence before editing. Recover existing interaction contracts instead of making the user restate them.\n\nMISSION\nGive mouse, keyboard, and phone users intentional interaction languages over one product model. Mouse gets direct pointer-native controls. Keyboard gets a real power-user command language. Phone gets touch-native journeys, not compressed desktop chrome or bigger buttons. Equivalent intent converges on the same semantic actions, state owners, feedback, and terminal results.\n\nOWNED SCOPE\n- Cross-input capability mapping, mode-native interaction grammar, phone/touch design, semantic-action convergence, bounded modality repair, regressions, and honest device proof.\n\nFORBIDDEN SCOPE\n- Do not replace P106 overall UX architecture, P99 flow/telemetry repair, P109 cross-app factoring, P110 acceptance-only certification, or P95 runtime architecture. Do not create a second mobile state machine or command registry.\n\n1. PIN CAPABILITIES BEFORE CONTROLS\nFor each high-value terminal capability record MOUSE, KEYBOARD, PHONE, semantic action owner, state owner, and proof. Include discover/navigate/search/select/inspect/act/recover/reset/filter/saved-state/error behaviors as applicable. Missing is not equivalent to “use the desktop control.”\n\n2. DESIGN THREE MODE-NATIVE LANGUAGES\nMOUSE / POINTER — visible direct controls, click, double-click, hover, context actions, drag/scroll where natural. Hover may enrich; it may not be the only route to an essential action.\nKEYBOARD — direct shortcuts, command/finder entry, navigation, focus recovery, and short sequences where useful. Prompt Kit’s language includes `/`, `A–E`, `F`, `[`, `]`, `R`, `Home/End`, `Esc`, and prompt sequences; other products must resolve their own bindings rather than cargo-cult these keys. A command should reach terminal value, not merely reveal a mouse control.\nPHONE / TOUCH-NATIVE — tap, structured command sheets/quick controls, conflict-safe gestures, thumb-reachable frequent actions, intentional text-entry focus, safe-area/viewport behavior, and structured destinations. Do not require hover, double-click, tiny desktop chrome, browser Find, or precision pointer behavior. Do not automatically summon the software keyboard when opening a non-text command surface.\n\n3. SHARE SEMANTICS, NOT CONTROL SHAPES\nUse CAPABILITY -> SEMANTIC ACTION -> MODE ADAPTER -> FEEDBACK/STATE. Equivalent click, shortcut, and touch routes call the same canonical action and preserve orthogonal state. Different mode-specific controls are healthy; duplicated business rules, preference truth, selection state, or success semantics are not. Prevent one touch from double-firing through synthesized pointer/click events.\n\n4. MAKE PHONE FEATURE-COMPLETE\nWalk the phone path from entry to terminal value. In Prompt-Kit-like products inspect discover/browse hierarchy, search, Favorites/saved destinations, open/read, terminal action such as copy, back/recovery, reset, filters, and zero-results/error. Mobile simplification is not permission to omit capabilities.\n\n5. GESTURES NEED FALLBACKS AND CONFLICT RULES\nEvery important non-obvious gesture needs a labeled route or command-sheet equivalent. Define cancellation/thresholds so vertical scroll, browser/OS back, text selection, long-press, and tap/click synthesis do not fight the app. Gestures accelerate; they do not become invisible single points of access.\n\n6. HANDLE PHONE-SPECIFIC FOCUS + VIEWPORT FAILURES\nCheck initial focus, software-keyboard invocation, obscured actions, safe areas, orientation/visual-viewport changes, and back/Escape/dismiss restoration. A narrow desktop screenshot does not prove phone usability.\n\n7. IMPLEMENT THE SMALLEST MISSING MODE SEAM\nChoose the highest-value capability with the weakest modality. Reuse the canonical semantic action/state owner and add only the adapter/control surface needed. Route unsound overall journey/IA to P106 and redundant-step/lost-state flow debt to P99.\n\n8. FALSIFY AFTER FIRST GREEN\nMouse: hover-only dependence, hidden direct action, double-click ambiguity.\nKeyboard: collisions, focus loss/traps, intermediate-only completion, sequence ambiguity, Escape erasing unrelated state.\nPhone: accidental software-keyboard opening, action sheet scroll, swipe vs scroll/back conflict, touch/pointer double dispatch, unreachable thumb action, safe-area/orientation breakage, gesture-only capability, long-press/text-selection conflict.\nRepair practical findings and rerun the shared semantic action plus adjacent controls.\n\n9. PROVE EQUIVALENT TERMINAL CAPABILITY\nProve each supported mode reaches the intended terminal result with equivalent state/feedback semantics. Use state tests for convergence, browser automation for focus/geometry/input, and touch emulation for deterministic gesture mechanics. Physical-phone ergonomics, software-keyboard feel, thumb reach, OS/browser gesture conflict, and real touch comfort require an observed phone/device pass before claiming phone acceptance.\n\n10. SECOND PASS + FACTORING\nReverse the journey for hidden desktop assumptions, skipped phone states, duplicated modality logic, missing recovery, and one-mode-only features. When a proven modality pattern repeats across apps, route it to P109 instead of copying adapters.\n\nROUTING BOUNDARY\nUse P106 for overall UX architecture; P99 for flow/state/telemetry refinement; P109 for proven cross-app patterns; P110 for release-grade cross-mode/device acceptance; P95 when semantic command/state ownership itself is unresolved.\n\nDELIVER\nReport the three-mode capability matrix; interaction grammar; semantic convergence; phone-native repair; failures found/repaired; regressions; browser/device evidence; physical-phone proof ceiling; files; integration state; exact next unproven modality action.\n\nCLOSURE RULE\nClose only when every in-scope capability has a mode-native route or explicit supported exclusion, equivalent intent shares canonical semantics/state, phone is a complete interaction language rather than resized desktop chrome, practical modality failures are repaired, and proof claims match observed runtime/device evidence.",
            "keywords": ["phone native ux", "mobile interaction design", "touch first ux", "cross input ux", "input modality", "mouse keyboard phone ux", "phone interaction language", "mobile not bigger buttons", "touch gestures", "keyboard power user ux", "semantic action convergence", "mobile quick controls", "software keyboard ux", "physical phone acceptance", "one handed ux", "gesture discoverability"]
          }
          JSON
          python scripts/prompt_registry_ops.py add --input /tmp/phone-native-ux-prompt.json --registry spec-architecture-prompts | tee /tmp/phone-native-ux-receipt.json
      - name: Strengthen P106 P109 P110 and P65, plus focused UX regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          spec_path = Path('registry/prompts/spec-architecture-prompts.v1.json')
          discovery_path = Path('registry/prompts/tutorial-discovery-prompts.v1.json')
          test_path = Path('tests/test_ux_design_prompt_suite.py')
          spec = json.loads(spec_path.read_text(encoding='utf-8'))
          ps = spec['prompts']
          s = next(p for p in ps if p['name'] == 'Cross-Input UX Modality & Phone-Native Interaction Architect')
          sid, seq = s['id'], s['seq']
          p106 = next(p for p in ps if p['id'] == 'P106')
          p109 = next(p for p in ps if p['id'] == 'P109')
          p110 = next(p for p in ps if p['id'] == 'P110')

          p106['useWhen'] += f' When the overall UX is sound but mouse/keyboard/phone interaction languages are the primary gap or phone is a resized desktop fallback, route that bounded modality design to {sid} {s["name"]}.'
          p106['nextStep'] += f' If the critique shows a mode-native interaction-language gap rather than overall UX architecture, route that seam to {sid} instead of expanding P106.'
          p106['proofGate'] += f' Cross-input modality debt is resolved at the architecture level or routed to {sid}; phone is not accepted merely because desktop controls were enlarged or reflowed.'
          p106['copyContent'] = p106['copyContent'].replace('\n\n6. IMPLEMENT ONE REAL VERTICAL UX SLICE', f'\n\n5A. RECOGNIZE WHEN INPUT MODALITY IS ITS OWN DESIGN PROBLEM\nPhone users are not desktop users with bigger buttons. When mouse direct controls, keyboard power commands, and phone/touch need distinct interaction grammars for the same capabilities, preserve shared semantic action/state owners here and route the dedicated three-mode design/repair to {sid} {s["name"]}. Do not make P106 absorb a second modality doctrine.\n\n6. IMPLEMENT ONE REAL VERTICAL UX SLICE', 1)
          for k in ('phone native ux', 'cross input ux', 'input modality ux'):
              if k not in p106['keywords']: p106['keywords'].append(k)

          p109['useWhen'] += f' It also owns factoring a proven three-mode interaction contract across apps after {sid} establishes mode-native behavior in representative products.'
          p109['nextStep'] += f' If the mouse/keyboard/phone contract is not yet proven in one product, establish it with {sid} before standardizing it across apps.'
          p109['proofGate'] += ' Shared modality patterns keep one semantic capability/action owner while allowing different mouse, keyboard, and phone control shapes; reuse does not flatten mode-native behavior.'
          p109['copyContent'] = p109['copyContent'].replace('\n\n5. PRESERVE PRODUCT IDENTITY THROUGH CONTROLLED EXTENSION', f'\n\n4A. FACTOR CAPABILITIES, NOT IDENTICAL CONTROLS\nFor cross-input patterns use CAPABILITY -> SEMANTIC ACTION -> MODE ADAPTER. Mouse may use direct click/hover controls, keyboard a power command language, and phone touch-native quick controls or gestures. Standardize semantics, state/feedback, discoverability, and failure boundaries; do not force one desktop control shape onto every modality. Use {sid} to prove the modality design before making it cross-app doctrine.\n\n5. PRESERVE PRODUCT IDENTITY THROUGH CONTROLLED EXTENSION', 1)
          for k in ('cross input design system', 'input modality pattern', 'phone interaction pattern'):
              if k not in p109['keywords']: p109['keywords'].append(k)

          p110['expectedOutput'] += f' When multiple input modalities are supported, include an explicit three-mode capability matrix and route upstream design defects to {sid}.'
          p110['proofGate'] += ' Touch emulation may prove deterministic gesture/focus mechanics but cannot alone prove physical-phone ergonomics, software-keyboard feel, thumb reach, or OS/browser gesture conflict; those claims require observed device evidence.'
          p110['copyContent'] = p110['copyContent'].replace('\n\n3. AUTOMATE WHAT CAN BE PROVEN DETERMINISTICALLY', f'\n\n2A. PROVE MODE-NATIVE EQUIVALENCE, NOT IDENTICAL CONTROL SHAPES\n- MOUSE / POINTER: direct controls and supported click/double-click/hover behavior must reach terminal action without hover-only essential capability.\n- KEYBOARD POWER LANGUAGE: shortcuts, command/finder entry, navigation, sequences, focus recovery, and Escape semantics must complete terminal capabilities without a mouse-only intermediate.\n- PHONE / TOUCH-NATIVE: labeled tap/command surfaces and gestures must preserve feature reachability without tiny desktop chrome, browser Find, accidental software-keyboard focus, scroll/back conflict, or duplicate touch+pointer dispatch.\nEquivalent intent converges on canonical semantic actions/state owners; if that design is missing, route upstream to {sid}. Touch-emulated Chromium is useful runtime evidence, but physical-phone ergonomics remain unproven until an actual device pass.\n\n3. AUTOMATE WHAT CAN BE PROVEN DETERMINISTICALLY', 1)
          for k in ('three mode ux acceptance', 'physical phone ux', 'phone native acceptance'):
              if k not in p110['keywords']: p110['keywords'].append(k)
          spec_path.write_text(json.dumps(spec, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          d = json.loads(discovery_path.read_text(encoding='utf-8'))
          p65 = next(p for p in d['prompts'] if p['id'] == 'P65')
          p65['useWhen'] += ' It also routes input-modality UX when mouse, keyboard, and phone/touch need distinct interaction languages or mobile has degraded into enlarged/compressed desktop controls.'
          p65['expectedOutput'] += f' For cross-input UX, distinguish general P106 architecture, {sid} phone-native modality design, P99 flow friction, P109 pattern factoring, and P110 acceptance.'
          p65['copyContent'] += f'\n\nUX INPUT-MODALITY ROUTE\n- Use {sid} {s["name"]} when the same product capabilities need deliberate mouse/pointer, keyboard power-user, and phone/touch interaction languages, especially when mobile is only bigger buttons or compressed desktop chrome.\n- Keep P106 for overall UX architecture, P99 for flow/state/telemetry repair, P109 for proven cross-app patterns, and P110 for release-grade cross-mode/device acceptance.\n'
          for k in ('phone native ux', 'touch first ux', 'cross input ux', 'input modality ux', 'mobile interaction design', 'mouse keyboard phone ux'):
              if k not in p65['keywords']: p65['keywords'].append(k)
          discovery_path.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          text = test_path.read_text(encoding='utf-8')
          text = text.replace('    "accept": "UX Integrity & Cross-Viewport Acceptance Guard",\n}', '    "accept": "UX Integrity & Cross-Viewport Acceptance Guard",\n    "modality": "Cross-Input UX Modality & Phone-Native Interaction Architect",\n}', 1)
          text = text.replace('    "UX Integrity & Cross-Viewport Acceptance Guard": "P110"\n}', f'    "UX Integrity & Cross-Viewport Acceptance Guard": "P110",\n    "Cross-Input UX Modality & Phone-Native Interaction Architect": "{sid}"\n}}', 1)
          text = text.replace('def test_suite_has_five_distinct_helper_allocated_owners', 'def test_suite_has_six_distinct_helper_allocated_owners')
          text = text.replace('self.assertEqual(len({p["id"] for p in prompts}), 5)', 'self.assertEqual(len({p["id"] for p in prompts}), 6)')
          modality_test = (
              '\n    def test_modality_architect_makes_phone_a_first_class_interaction_language(self) -> None:\n'
              '        prompt = self.by_name[NAMES["modality"]]\n'
              '        self.assertEqual(prompt["class"], "PRODUCT / UX INPUT MODALITY")\n'
              f'        self.assertEqual(prompt["id"], "{sid}")\n'
              f'        self.assertEqual(prompt["seq"], "{seq}")\n'
              '        content = prompt["copyContent"]\n'
              '        for phrase in (\n'
              '            "MOUSE DIRECT CONTROLS, KEYBOARD POWER COMMANDS, AND PHONE-NATIVE TOUCH",\n'
              '            "DO NOT CALL BIGGER BUTTONS A MOBILE EXPERIENCE",\n'
              '            "SPRINT DECLARATION — REQUIRED BEFORE MUTATION",\n'
              '            "MOUSE / POINTER", "KEYBOARD", "PHONE / TOUCH-NATIVE",\n'
              '            "`/`, `A–E`, `F`, `[`, `]`, `R`, `Home/End`, `Esc`",\n'
              '            "CAPABILITY -> SEMANTIC ACTION -> MODE ADAPTER -> FEEDBACK/STATE",\n'
              '            "Do not automatically summon the software keyboard",\n'
              '            "Gestures accelerate; they do not become invisible single points of access",\n'
              '            "Physical-phone ergonomics",\n'
              '            "Do not create a second mobile state machine",\n'
              '        ):\n'
              '            self.assertIn(phrase, content)\n'
              '        self.assertIn("physical-phone", prompt["proofGate"].lower())\n'
              '        self.assertLess(len(self.raw_by_name[prompt["name"]]["copyContent"]), 8000)\n'
          )
          text = text.replace('\n    def test_reference_emulator_requires_observed_vs_inferred_functional_fidelity', modality_test + '\n    def test_reference_emulator_requires_observed_vs_inferred_functional_fidelity', 1)
          text = text.replace('        self.assertNotIn("DERIVE THE DASHBOARD FROM EVENTS", content)\n', f'        self.assertIn("Phone users are not desktop users with bigger buttons", content)\n        self.assertIn("{sid} {s["name"]}", content)\n        self.assertNotIn("DERIVE THE DASHBOARD FROM EVENTS", content)\n', 1)
          text = text.replace('        self.assertIn("without becoming identical", prompt["sprintRole"])\n', '        self.assertIn("without becoming identical", prompt["sprintRole"])\n        self.assertIn("CAPABILITY -> SEMANTIC ACTION -> MODE ADAPTER", content)\n', 1)
          text = text.replace('        self.assertIn("P94 Regression Test & Live Behavior Guard", content)\n', '        self.assertIn("P94 Regression Test & Live Behavior Guard", content)\n        for phrase in ("MOUSE / POINTER", "KEYBOARD POWER LANGUAGE", "PHONE / TOUCH-NATIVE", "physical-phone ergonomics"):\n            self.assertIn(phrase, content)\n', 1)
          text = text.replace('        self.assertIn("PRESERVE ORTHOGONAL STATE", self.full["P99"]["copyContent"])\n', '        self.assertIn("PRESERVE ORTHOGONAL STATE", self.full["P99"]["copyContent"])\n        self.assertIn("Keyboard shortcuts, buttons, command palette items, touch controls", self.full["P99"]["copyContent"])\n', 1)
          text = text.replace('            "design system", "ux acceptance", "responsive ux", "visual regression",\n', '            "design system", "ux acceptance", "responsive ux", "visual regression",\n            "phone native ux", "touch first ux", "cross input ux", "input modality ux",\n', 1)
          text = text.replace('        for prompt_id in ("P106", "P107", "P108", "P109", "P110"):\n', f'        for prompt_id in ("P106", "P107", "P108", "P109", "P110", "{sid}"):\n', 1)
          text = text.replace('        self.assertIn("hand it to the correct owner", self.full["P110"]["copyContent"])\n', f'        self.assertIn("hand it to the correct owner", self.full["P110"]["copyContent"])\n        self.assertIn("Do not create a second mobile state machine", self.full["{sid}"]["copyContent"])\n', 1)
          test_path.write_text(text, encoding='utf-8')
          PY
      - name: Rebuild and validate exact Prompt Kit
        run: |
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_ux_design_prompt_suite -v
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_kit_order_navigation_contract -v
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output Outputs/prompt-kit-order-navigation-audit.json --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Enforce bounded durable diff and self-remove carriers
        env:
          BASE_SHA: 54fd353e823c8e4473126dd13003599d46dcc9c8
        run: |
          rm .github/workflows/tmp-prompt-kit-phone-native-ux-campaign.yml .github/workflows/tmp-prompt-kit-phone-native-ux-campaign-v2.yml
          changed="$(git diff --name-only "$BASE_SHA" | sort)"
          expected="$(printf '%s\n' 'registry/prompts/spec-architecture-prompts.v1.json' 'registry/prompts/tutorial-discovery-prompts.v1.json' 'tests/test_ux_design_prompt_suite.py' 'web/prompt-kit/index.html' | sort)"
          test "$changed" = "$expected" || { printf 'Unexpected durable diff:\n%s\n' "$changed" >&2; exit 1; }
      - name: Commit and push durable campaign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(prompt-kit): add phone-native UX modality guidance'
          git push origin HEAD:feat/prompt-kit-phone-native-ux-modality-20260907
