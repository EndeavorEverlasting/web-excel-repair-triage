name: Temporary Prompt Kit tutorial route coverage executor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: prompt-kit-tutorial-route-coverage-20260823
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.pull_request.head.ref == 'feat/prompt-kit-tutorial-route-coverage-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-tutorial-route-coverage-20260823
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh and reconcile default branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --all --prune --tags
          git merge --no-edit origin/main
          echo "RECONCILED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short
          git log --oneline --decorate -8

      - name: Update discovery validator, focused regression, and tutorial accuracy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          guided_path = Path('docs/prompt-kit-guided-recommendations.js')
          guided_text = guided_path.read_text(encoding='utf-8')
          old = 'Recover repeated friction, missed urgency, or a workflow that keeps stalling'
          new = 'The work keeps stalling, urgency is being missed, or I keep repeating the same correction'
          if old not in guided_text:
              raise RuntimeError('recurring-urgency compatibility label not found')
          guided_path.write_text(guided_text.replace(old, new, 1), encoding='utf-8')

          validator = Path('scripts/validate_prompt_kit_discovery.py')
          text = validator.read_text(encoding='utf-8')
          old = '    "guided_questionnaire",\n    "guided_uses_shared_search",'
          new = '    "guided_questionnaire",\n    "adaptive_questionnaire",\n    "tutorial_route_coverage",\n    "guided_uses_shared_search",'
          if old not in text:
              raise RuntimeError('discovery validator requirement insertion point not found')
          text = text.replace(old, new, 1)
          start = text.index('    guided_markers = (')
          end = text.index('    journey_markers = (', start)
          guided_block = '''    guided_markers = (\n        "FIXED_PROMPT_FINDER_QUESTIONS",\n        "id:'startingPoint'",\n        "id:'goal'",\n        "id:'proofNeed'",\n        "id:'repeated-stall'",\n        "work keeps stalling, urgency is being missed",\n        "function renderAdaptiveQuestion()",\n        "Something else — show every prompt",\n        "function renderSpecialistQuestion()",\n        "function specialistPrompts(query)",\n        "if(!q)return PROMPTS.slice().sort",\n        "filterPromptsForQuery(PROMPTS,query)",\n        "promptFinderBtn",\n        "✦ Tutorial · Find My Prompt",\n        "prompt-finder-beacon",\n        "prefers-reduced-motion:reduce",\n        "actions.appendChild(addButton)",\n    )\n    if any(marker not in guided_js for marker in guided_markers):\n        missing.append("guided_questionnaire")\n    if any(marker not in guided_js for marker in ("renderAdaptiveQuestion", "ADAPTIVE_CANDIDATE_LIMIT=6", "usually final")):\n        missing.append("adaptive_questionnaire")\n    if any(marker not in guided_js for marker in ("Something else — show every prompt", "PROMPTS.slice().sort", "data-finder-specialist-prompt")):\n        missing.append("tutorial_route_coverage")\n    if "filterPromptsForQuery(PROMPTS,query)" not in guided_js or "var R=" in guided_js or "sharedSearch(query).slice(0,5)" in guided_js:\n        missing.append("guided_uses_shared_search")\n    if any(marker not in guided_js for marker in ("PROMPTS.find", "copyPrompt(", "showPromptDetail(")):\n        missing.append("metadata_recommendations")\n    if any(marker not in guided_js for marker in ("prompt-finder-beacon", "animation:prompt-finder-beacon", "prefers-reduced-motion:reduce")):\n        missing.append("tutorial_beacon")\n    if "replaceChild(button,old)" in guided_js:\n        missing.append("guided_questionnaire")\n\n'''
          text = text[:start] + guided_block + text[end:]
          validator.write_text(text, encoding='utf-8')

          tests = Path('tests/test_prompt_kit_discovery.py')
          text = tests.read_text(encoding='utf-8')
          old = '                "guided_questionnaire",\n                "guided_uses_shared_search",'
          new = '                "guided_questionnaire",\n                "adaptive_questionnaire",\n                "tutorial_route_coverage",\n                "guided_uses_shared_search",'
          if old not in text:
              raise RuntimeError('discovery test requirement insertion point not found')
          text = text.replace(old, new, 1)
          start = text.index('    def test_guided_questionnaire_uses_shared_search_and_no_prompt_id_router')
          end = text.index('    def test_guided_journey_uses_registry_next_step_and_session_state', start)
          method = '''    def test_guided_questionnaire_uses_shared_search_and_no_prompt_id_router(self) -> None:\n        guided = GUIDED_JS.read_text(encoding="utf-8")\n        for marker in (\n            "FIXED_PROMPT_FINDER_QUESTIONS",\n            "id:'startingPoint'",\n            "id:'goal'",\n            "id:'proofNeed'",\n            "id:'repeated-stall'",\n            "work keeps stalling, urgency is being missed",\n            "renderAdaptiveQuestion",\n            "Something else — show every prompt",\n            "renderSpecialistQuestion",\n            "filterPromptsForQuery(PROMPTS,query)",\n            "PROMPTS.find",\n            "copyPrompt(",\n            "showPromptDetail(",\n            "promptFinderBtn",\n            "actions.appendChild(addButton)",\n        ):\n            self.assertIn(marker, guided)\n        self.assertNotIn("var R=", guided)\n        self.assertNotIn("replaceChild(button,old)", guided)\n        self.assertNotIn("sharedSearch(query).slice(0,5)", guided)\n        question_ids = ("startingPoint", "goal", "proofNeed")\n        self.assertEqual(sum(guided.count(f"id:'{item}'") for item in question_ids), 3)\n        self.assertIn("PROMPT_FINDER_MAX_QUESTIONS=5", guided)\n\n'''
          text = text[:start] + method + text[end:]
          tests.write_text(text, encoding='utf-8')

          tutorial = Path('docs/PROMPT_FINDER_QUESTIONNAIRE_TUTORIAL.md')
          text = tutorial.read_text(encoding='utf-8')
          text = text.replace(
              'Use the glowing **Tutorial · Find My Prompt** control to answer four short questions. The Prompt Kit then recommends one prompt to start with and, when useful, up to two follow-on prompts.',
              'Use the glowing **Tutorial · Find My Prompt** control to answer three short context questions and one adaptive fourth question. The Prompt Kit then recommends one prompt to start with and up to two related options. If none of the adaptive choices fits, an optional fifth question exposes the full live prompt registry without requiring you to know prompt IDs.'
          )
          start = text.index('## Start the questionnaire')
          end = text.index('## Use → prove → continue', start)
          replacement = '''## Start the questionnaire\n\n1. Open the generated Prompt Kit website at `web/prompt-kit/index.html` or the public Prompt Kit URL.\n2. Select the glowing **Tutorial · Find My Prompt** control in the header.\n3. Answer three compact context questions:\n   - where you are starting, including no checkout, unfamiliar repo, known repo, active failure, open PR/review, or an app/artifact already open;\n   - what you need to accomplish, with distinct choices for discovery, planning, coordination, repeated friction/urgency recovery, implementation, diagnosis, artifacts, proof, shipping, teaching, agent/harness work, management/correspondence, and closeout;\n   - what proof/result level you actually need.\n4. Use the adaptive fourth question to choose the closest current prompt route. Those choices are computed from the live registry and shared search evidence, not from a private prompt-ID table.\n5. If none fits, choose **Something else — show every prompt**. The optional fifth question renders every current registry prompt and lets you filter the list with ordinary Prompt Kit search terms.\n6. Review the **Primary recommendation** first.\n7. Select **Open** to read the full prompt or **Copy** to place it on the clipboard.\n8. Complete the current prompt's expected output or proof before moving through its registry-owned **Guided workflow**.\n\nThe default experience still ends after four questions. The fifth question exists as a coverage escape hatch, so newly added or highly specialized prompts remain reachable without making every user answer a longer questionnaire.\n\nThe finder does not maintain a second prompt-ID recommendation database. The first three answers contribute ordinary search phrases through `filterPromptsForQuery(PROMPTS, query)`, with overlapping evidence de-duplicated per question. The adaptive fourth question presents live registry records. The optional fifth question renders `PROMPTS` itself and uses the same shared search function only when you type a filter. This gives every current prompt a tutorial route while keeping prompt identity and semantics owned by the canonical registry.\n\n'''
          text = text[:start] + replacement + text[end:]
          tutorial.write_text(text, encoding='utf-8')
          PY

      - name: Build canonical Prompt Kit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Pass 1 focused validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_prompt_kit_discovery.py scripts/validate_prompt_kit_tutorial_routes.py tests/test_prompt_kit_discovery.py tests/test_prompt_kit_tutorial_route_coverage.py
          node --check docs/prompt-kit-guided-recommendations.js
          python scripts/validate_prompt_kit_tutorial_routes.py --output Outputs/prompt-kit-tutorial-route-coverage.json --summary
          python -m unittest tests.test_prompt_kit_tutorial_route_coverage tests.test_prompt_kit_discovery tests.test_prompt_kit_guidance -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Pass 2 falsification and fixed-point review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from scripts import build_prompt_kit_registry
          from scripts import validate_prompt_kit_tutorial_routes

          guided = Path('docs/prompt-kit-guided-recommendations.js').read_text(encoding='utf-8')
          tutorial = Path('docs/PROMPT_FINDER_QUESTIONNAIRE_TUTORIAL.md').read_text(encoding='utf-8')
          report = validate_prompt_kit_tutorial_routes.audit()
          prompts = build_prompt_kit_registry.load_prompt_kit_registry()
          assert report['ready'], report
          assert report['reachable_count'] == len(prompts)
          assert report['unreachable'] == []
          assert 'sharedSearch(query).slice(0,5)' not in guided
          assert guided.count("{id:'startingPoint'") == 1
          assert guided.count("{id:'goal'") == 1
          assert guided.count("{id:'proofNeed'") == 1
          assert "id:'repeated-stall'" in guided
          assert 'work keeps stalling, urgency is being missed' in guided
          assert 'Something else — show every prompt' in guided
          assert 'optional fifth question' in tutorial
          assert not re.search(r"(?:var|const|let)\s+\w+\s*=\s*\{[^}]*'P\d+':", guided)
          print(json.dumps({
              'prompt_count': len(prompts),
              'reachable_count': report['reachable_count'],
              'default_questions': report['default_questions'],
              'max_questions': report['max_questions'],
              'fixed_point': True,
          }, indent=2))
          PY
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python -m unittest tests.test_skill_prompt_registry -v
          git diff --check

      - name: Retire transport and commit durable change
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-prompt-kit-tutorial-route-coverage.yml
          git add docs/prompt-kit-guided-recommendations.js docs/PROMPT_FINDER_QUESTIONNAIRE_TUTORIAL.md harness/contracts/prompt-kit-discovery.v1.json scripts/validate_prompt_kit_discovery.py scripts/validate_prompt_kit_tutorial_routes.py tests/test_prompt_kit_discovery.py tests/test_prompt_kit_tutorial_route_coverage.py web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m "feat(prompt-kit): make tutorial routing coverage-complete"
          echo "PROVEN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Exact-head validation
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/prompt-kit.js
          node --check docs/prompt-kit-guided-recommendations.js
          node --check docs/prompt-kit-journey.js
          node --check docs/prompt-kit-polish.js
          python scripts/validate_prompt_kit_tutorial_routes.py --summary
          python -m unittest tests.test_prompt_kit_tutorial_route_coverage tests.test_prompt_kit_discovery tests.test_prompt_kit_guidance tests.test_skill_prompt_registry -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check HEAD

      - name: Push exact validated branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/prompt-kit-tutorial-route-coverage-20260823
          echo "PUSHED_SHA=$(git rev-parse HEAD)"
