name: Temporary prompt-panel compute variants materializer

on:
  push:
    branches:
      - feat/prompt-panel-compute-variants-20260920
    paths:
      - docs/prompt-kit-compute-mode.js
      - tests/test_p07_effective_prompt_identity.py
      - tests/test_prompt_kit_compute_mode.py
      - tests/prompt_kit_compute_mode_browser_proof.py
      - harness/test-floor.v1.json
      - .github/workflows/tmp-prompt-panel-compute-variants-materializer.yml

permissions:
  contents: write

concurrency:
  group: tmp-prompt-panel-compute-variants-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-panel-compute-variants-20260920
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements-test-floor.txt
      - name: Validate source before generation
        run: |
          set -euo pipefail
          python -m unittest tests.test_p07_effective_prompt_identity tests.test_prompt_kit_compute_mode -v
      - name: Generate canonical Prompt Kit
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
      - name: Commit generated artifact and retire materializer
        env:
          BRANCH: feat/prompt-panel-compute-variants-20260920
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/prompt-kit/index.html
          git rm .github/workflows/tmp-prompt-panel-compute-variants-materializer.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated change to publish' >&2
            exit 1
          fi
          git commit -m 'build(prompt-kit): materialize per-prompt compute variants'
          git push origin HEAD:${BRANCH}
