name: Temporary prompt principle hardening sync bridge

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: prompt-principle-hardening-sync-20260824
  cancel-in-progress: false

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'feat/prompt-kit-execution-brief-hardening-20260824'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-execution-brief-hardening-20260824
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh, mutate, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --all --prune --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then git merge --no-edit origin/main; fi
          test -f .prompt-contrib/prompt_principle_hardening.py
          python .prompt-contrib/prompt_principle_hardening.py
          if [ -f .prompt-contrib/p86_legacy_phrase_patch.py ]; then python .prompt-contrib/p86_legacy_phrase_patch.py; fi
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_actionable_prompt_registry tests.test_spec_architecture_prompt_registry tests.test_correspondence_prompt_registry -v
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git rm -f .prompt-contrib/prompt_principle_hardening.py
          if [ -f .prompt-contrib/retrigger-prompt-hardening.txt ]; then git rm -f .prompt-contrib/retrigger-prompt-hardening.txt; fi
          if [ -f .prompt-contrib/p86_legacy_phrase_patch.py ]; then git rm -f .prompt-contrib/p86_legacy_phrase_patch.py; fi
          git add docs/prompts.json registry/prompts/actionable-next-step-policy.v1.json registry/prompts/spec-architecture-prompts.v1.json registry/prompts/correspondence-prompts.v1.json tests/test_actionable_prompt_registry.py tests/test_spec_architecture_prompt_registry.py tests/test_correspondence_prompt_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m "feat(prompt-kit): bind prompts to source-grounded completion"
      - name: Reconcile moved main and prove exact head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            python scripts/prompt_registry_ops.py validate
            python -m unittest tests.test_actionable_prompt_registry tests.test_spec_architecture_prompt_registry tests.test_correspondence_prompt_registry -v
            python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_language_audit -v
            python scripts/validate_prompt_kit_discovery.py --summary
            python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
            git add web/prompt-kit/index.html
            if ! git diff --cached --quiet; then git commit -m "chore(prompt-kit): refresh generated site after main reconciliation"; fi
            git diff --check HEAD
          fi
          git status --short
          echo "PROVEN_HEAD=$(git rev-parse HEAD)"
      - name: Push exact validated head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/prompt-kit-execution-brief-hardening-20260824
