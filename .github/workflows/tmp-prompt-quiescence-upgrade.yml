name: Temporary Prompt Kit progress-quiescence upgrade

on:
  push:
    branches:
      - feat/prompt-kit-progress-quiescence-20260914

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install doctrine and focused regression
        run: python scripts/_tmp_install_prompt_quiescence_doctrine.py

      - name: Rebuild canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Validate registry helper contract
        run: python scripts/prompt_registry_ops.py validate

      - name: Focused actionability regression
        run: python -m unittest tests.test_actionable_prompt_registry -v

      - name: Skill registry regression
        run: python -m unittest tests.test_skill_prompt_registry -v

      - name: Language audit
        run: python scripts/evaluate_prompt_language.py --summary

      - name: Discovery validation
        run: python scripts/validate_prompt_kit_discovery.py --summary

      - name: Order and navigation regression
        run: python -m unittest tests.test_prompt_kit_order_navigation_contract -v

      - name: Order and navigation validation
        run: python scripts/validate_prompt_kit_order_navigation.py --require-implementation --output Outputs/prompt-kit-order-navigation-audit.json --summary

      - name: Generated-site parity
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check

      - name: Remove transport-only executor
        run: git rm scripts/_tmp_install_prompt_quiescence_doctrine.py .github/workflows/tmp-prompt-quiescence-upgrade.yml

      - name: Patch hygiene
        run: git diff --check

      - name: Commit durable contribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/prompts/actionable-next-step-policy.v1.json tests/test_actionable_prompt_registry.py web/prompt-kit/index.html
          if git diff --cached --quiet; then
            echo 'No durable changes produced.'
            exit 1
          fi
          git commit -m 'feat(prompt-kit): require progress-bearing execution and quiescence'
          git push origin HEAD:feat/prompt-kit-progress-quiescence-20260914
