name: Temporary Prompt Registry Grounding Gate

on:
  push:
    branches:
      - feat/prompt-registry-grounding-gate-20260822
    paths:
      - scripts/tmp_apply_prompt_registry_grounding_20260822.py
      - scripts/tmp_fix_prompt_registry_grounding_test_20260822.py
      - .github/workflows/tmp-prompt-registry-grounding-20260822.yml
  pull_request:
    branches:
      - main

concurrency:
  group: prompt-registry-grounding-gate-20260822
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply-and-prove:
    if: github.event_name == 'push' || github.head_ref == 'feat/prompt-registry-grounding-gate-20260822'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-registry-grounding-gate-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh exact floor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
      - name: Repair bootstrap regression and apply grounding gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_fix_prompt_registry_grounding_test_20260822.py
          python scripts/tmp_apply_prompt_registry_grounding_20260822.py
      - name: Prove focused boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/prompt_registry_ops.py scripts/prompt_registry_grounding.py tests/test_prompt_registry_grounding.py
          python -m unittest tests.test_prompt_registry_grounding -v
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python scripts/evaluate_prompt_language.py --summary
          git diff --check
      - name: Commit durable implementation and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/tmp_apply_prompt_registry_grounding_20260822.py scripts/tmp_fix_prompt_registry_grounding_test_20260822.py .github/workflows/tmp-prompt-registry-grounding-20260822.yml
          git add scripts/prompt_registry_ops.py scripts/prompt_registry_grounding.py tests/test_prompt_registry_grounding.py harness/specs/prompt-operations.md .github/workflows/skill-prompt-registry.yml
          git diff --cached --check
          git commit -m 'feat(prompt-kit): ground exact registry operations'
          git push origin HEAD:feat/prompt-registry-grounding-gate-20260822
