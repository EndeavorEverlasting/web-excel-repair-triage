name: Temporary Prompt Kit regression safety compiler

on:
  pull_request:
    paths:
      - .github/workflows/tmp-prompt-regression-safety-compiler.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-regression-safety:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/prompt-regression-safety-loop-20260917') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-regression-safety-loop-20260917
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic floor dependencies
        run: python -m pip install -r requirements-test-floor.txt
      - name: Compile recurring-defect contract into shared Prompt Kit policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          policy_path = root / 'registry/prompts/actionable-next-step-policy.v1.json'
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          marker = 'REGRESSION SAFETY / RECURRING DEFECT CONTRACT'
          appendix = '''REGRESSION SAFETY / RECURRING DEFECT CONTRACT
          - Treat validator, local-gate, hosted-CI, review, runtime, operator-feedback, retrospective, and commit-history failures as defect incidents rather than disposable cleanup. Repair the immediate instance, then classify its defect family.
          - When the same defect family has two or more independently evidenced occurrences, treat recurrence as a system defect. Repeating the local cleanup or editing one prompt is not completion when a shared owner exists.
          - Find and strengthen the smallest canonical prevention owner: shared policy, generator, validator, hook, required-check profile, schema, or test floor. P13 owns recurring-process hardening; P94 owns regression design/live behavior preservation; P100 may contribute transcript judgment incidents; P79 remains the Prompt Kit identity gate.
          - Every systemic repair requires a reproducing negative fixture or mutation case plus a positive control, and the focused semantic regression must be registered in the deterministic floor when repository convention applies.
          - For repository mutation, run patch hygiene before commit and integration: `git diff --check`; staged candidate `git diff --cached --check`; exact candidate `git diff --check <base>...<head>` or the repository-owned equivalent. A recurring whitespace repair that only strips the latest whitespace is incomplete.
          - Prefer repository-owned local required-check profiles and exact-candidate receipts before hosted provider checks when local Git is available. GitHub Actions, GitLab CI, and similar systems are execution adapters or independent proof, not the portable semantic owner of the command/profile contract.
          - Provider unavailability does not erase valid repository-defined local proof, but do not invent hostless merge authority when the active repository promotion contract still requires provider mutation, approval, protected runtime, or another external gate.
          - The retrospective matrix is one intake source, not the defect universe. Local validators, required checks, CI, review, runtime observation, operator feedback, and commit history can create or strengthen a regression family without any prompt-use matrix row.
          - Close the systemic defect only after the instance is repaired, the negative case proves sensitivity, the positive control passes, the shared owner is strengthened, affected local required checks pass when executable, and integration retains the regression. A later recurrence means the prevention mechanism itself needs strengthening.'''
          current = str(policy.get('copy_content_appendix', '')).rstrip()
          if marker not in current:
              policy['copy_content_appendix'] = current + '\n\n' + appendix
          elif current.count(marker) != 1:
              raise SystemExit(f'actionability policy contains {current.count(marker)} regression markers')
          policy_path.write_text(json.dumps(policy, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          floor_path = root / 'harness/test-floor.v1.json'
          floor_text = floor_path.read_text(encoding='utf-8')
          test_path = 'tests/test_prompt_regression_safety_prompt.py'
          if test_path not in floor_text:
              anchor = '    "tests/test_prompt_retrospective_evaluation_prompt.py",\n'
              if floor_text.count(anchor) != 1:
                  raise SystemExit('expected one retrospective test-floor anchor')
              floor_text = floor_text.replace(anchor, anchor + f'    "{test_path}",\n', 1)
              floor_path.write_text(floor_text, encoding='utf-8')

          validator_path = root / 'scripts/validate_prompt_regression_safety.py'
          validator_text = validator_path.read_text(encoding='utf-8')
          broken = '"matrix_is_exhaustive": false if False else False,'
          fixed = '"matrix_is_exhaustive": False,'
          if broken in validator_text:
              validator_path.write_text(validator_text.replace(broken, fixed, 1), encoding='utf-8')
          elif fixed not in validator_text:
              raise SystemExit('validator matrix boolean line is neither known pre-fix nor fixed form')

          retro_path = root / 'docs/PROMPT_RETROSPECTIVE_EVALUATION.md'
          retro = retro_path.read_text(encoding='utf-8').rstrip()
          heading = '## Regression safety is a separate layer'
          if heading not in retro:
              retro += '''\n\n## Regression safety is a separate layer

          The retrospective matrix evaluates prompt uses; it is not the complete defect detector. Repeated failures discovered by local validators, required checks, hosted CI, review, runtime observation, operator feedback, or commit history belong to the separate regression-safety loop in `docs/PROMPT_REGRESSION_SAFETY.md` and `harness/contracts/prompt-regression-safety.v1.json`.

          That loop can strengthen a shared Prompt Kit policy even when no single matrix row captures the defect. Trailing whitespace is the first registered example: repeated cross-repository incidents are owned as a patch-hygiene system defect rather than another one-off cleanup.\n'''
              retro_path.write_text(retro, encoding='utf-8')
          PY
      - name: Validate focused regression safety
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_prompt_regression_safety.py tests/test_prompt_regression_safety_prompt.py
          python scripts/validate_prompt_regression_safety.py --summary
          python -m unittest tests.test_prompt_regression_safety_prompt -v
          python -m unittest tests.test_actionable_prompt_registry -v
      - name: Rebuild and prove canonical Prompt Kit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Run deterministic repository floor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_deterministic_test_floor.py --report /tmp/prompt-regression-safety-test-floor.json
      - name: Commit proved durable change and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-prompt-regression-safety-compiler.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            registry/prompts/actionable-next-step-policy.v1.json \
            harness/contracts/prompt-regression-safety.v1.json \
            harness/evals/prompt-regression/defect-families.v1.json \
            harness/test-floor.v1.json \
            scripts/validate_prompt_regression_safety.py \
            tests/test_prompt_regression_safety_prompt.py \
            docs/PROMPT_REGRESSION_SAFETY.md \
            docs/PROMPT_RETROSPECTIVE_EVALUATION.md \
            web/prompt-kit/index.html \
            .github/workflows/tmp-prompt-regression-safety-compiler.yml
          git diff --cached --check
          git commit -m 'feat(prompt-kit): make recurring defects regression-safe'
          git push origin HEAD:feat/prompt-regression-safety-loop-20260917
