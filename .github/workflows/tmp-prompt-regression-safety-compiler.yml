name: Temporary Prompt Kit regression safety finalizer

on:
  push:
    branches:
      - feat/prompt-regression-safety-loop-20260917
    paths:
      - .github/workflows/tmp-prompt-regression-safety-compiler.yml
      - registry/prompts/actionable-next-step-policy.v1.json
      - harness/contracts/prompt-regression-safety.v1.json
      - harness/evals/prompt-regression/defect-families.v1.json
      - harness/test-floor.v1.json
      - scripts/validate_prompt_regression_safety.py
      - tests/test_prompt_regression_safety_prompt.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prompt-regression-safety-finalizer-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.ref_name }}
  CANDIDATE_SHA: ${{ github.sha }}

jobs:
  finalize:
    if: ${{ github.ref_name == 'feat/prompt-regression-safety-loop-20260917' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact candidate and branch tip
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$CANDIDATE_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deterministic floor dependencies
        run: python -m pip install -r requirements-test-floor.txt

      - name: Rebuild canonical Prompt Kit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          test "$(git diff --name-only)" = "web/prompt-kit/index.html"
          git diff --check

      - name: Prove regression safety and operational prompt inheritance
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate_prompt_regression_safety.py tests/test_prompt_regression_safety_prompt.py
          python scripts/validate_prompt_regression_safety.py --summary
          python -m unittest tests.test_prompt_regression_safety_prompt -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python -m unittest tests.test_operational_closeout_contract -v
          python -m unittest tests.test_skill_prompt_registry -v

      - name: Run deterministic repository floor on rebuilt candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_deterministic_test_floor.py --report /tmp/prompt-regression-safety-test-floor.json

      - name: Commit generated parity and self-remove transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$CANDIDATE_SHA"

          rm .github/workflows/tmp-prompt-regression-safety-compiler.yml
          git add web/prompt-kit/index.html .github/workflows/tmp-prompt-regression-safety-compiler.yml
          test -z "$(git diff --name-only)"
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/tmp-prompt-regression-safety-compiler.yml\nweb/prompt-kit/index.html'
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(prompt-kit): rebuild regression-safe site'
          git push origin "HEAD:$TARGET_BRANCH"
