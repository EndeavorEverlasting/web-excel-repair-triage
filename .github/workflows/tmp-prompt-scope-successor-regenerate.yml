name: Temporary successor-scope Prompt Kit regeneration

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: prompt-scope-successor-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/prompt-scope-successor-semantics-20260916'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/prompt-scope-successor-semantics-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Regenerate, prove, remove carrier, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main fix/prompt-scope-successor-semantics-20260916 --prune
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/prompt-scope-successor-semantics-20260916)"

          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          git rm .github/workflows/tmp-prompt-scope-successor-regenerate.yml

          python -m unittest tests.test_operational_closeout_contract -v
          python -m unittest tests.test_actionable_prompt_registry tests.test_green_branch_integration_policy -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          git add web/prompt-kit/index.html tests/test_operational_closeout_contract.py registry/prompts/actionable-next-step-policy.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated update remains."
            exit 0
          fi
          git commit -m 'build(prompt-kit): regenerate successor-scope policy'
          echo "validated_commit=$(git rev-parse HEAD)"
          git push origin HEAD:fix/prompt-scope-successor-semantics-20260916
