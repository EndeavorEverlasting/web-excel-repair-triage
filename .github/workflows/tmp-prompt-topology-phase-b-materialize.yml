name: Temporary Prompt Topology Phase B materializer

on:
  push:
    branches:
      - feat/prompt-topology-phase-b-projection

permissions:
  contents: write

env:
  PYTHONHASHSEED: '0'
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  materialize-validate-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/prompt-topology-phase-b-projection
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Materialize bounded Phase B payload
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/phase-b-payload/part-* | base64 -d > "$RUNNER_TEMP/phase-b.tgz"
          echo 'ab052f5d5609ddc5d8e1c4e5bd62901e79d702afb44a91e9fa1128bc3c4f3e9c  '"$RUNNER_TEMP/phase-b.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/phase-b.tgz" -C .
          rm -rf .tmp/phase-b-payload
          rm .github/workflows/tmp-prompt-topology-phase-b-materialize.yml
          python -m py_compile \
            scripts/prompt-topology/projection.py \
            scripts/prompt-topology/project.py \
            scripts/prompt-topology/validate_projection.py \
            scripts/validate_prompt_topology.py \
            tests/test_prompt_topology_phase_b.py
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('harness/prompt-topology/phase-b-projection.v1.json'),
              Path('harness/contracts/prompt-topology-classifier.v1.json'),
          ):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'JSON PASS {path}')
          PY
          git diff --check
      - name: Install scoped topology runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-prompt-topology.txt
      - name: Validate Phase A+B before durable commit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_prompt_topology.py --summary
          python -m unittest tests.test_prompt_topology_phase_a tests.test_prompt_topology_phase_b -v
          python scripts/prompt-topology/run.py --output "$RUNNER_TEMP/topology.v1.json" --summary
          python scripts/prompt-topology/project.py \
            --topology "$RUNNER_TEMP/topology.v1.json" \
            --output "$RUNNER_TEMP/projection-3d.json" \
            --state-output "$RUNNER_TEMP/projection-state.v1.json" \
            --summary
          python scripts/prompt-topology/project.py \
            --topology "$RUNNER_TEMP/topology.v1.json" \
            --output "$RUNNER_TEMP/projection-3d.json" \
            --state-output "$RUNNER_TEMP/projection-state.v1.json" \
            --check
          python scripts/prompt-topology/validate_projection.py \
            --topology "$RUNNER_TEMP/topology.v1.json" \
            --projection "$RUNNER_TEMP/projection-3d.json" \
            --state "$RUNNER_TEMP/projection-state.v1.json" \
            --rebuild --summary
          git diff --check
      - name: Commit and push durable Phase B slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage tracked modifications/deletions first. This deliberately captures removal
          # of the ignored-but-tracked transport payload without trying to re-add `.tmp`.
          git add -u
          git add \
            .github/workflows/prompt-topology-phase-b.yml \
            harness/contracts/prompt-topology-classifier.v1.json \
            harness/prompt-topology/EXECUTABLE_PHASE_B.md \
            harness/prompt-topology/phase-b-projection.v1.json \
            requirements-prompt-topology.txt \
            scripts/prompt-topology/README.md \
            scripts/prompt-topology/project.py \
            scripts/prompt-topology/projection.py \
            scripts/prompt-topology/validate_projection.py \
            scripts/validate_prompt_topology.py \
            tests/test_prompt_topology_phase_b.py
          git status --short
          git diff --cached --check
          git commit -m 'feat(prompt-topology): execute deterministic Phase B projection'
          git push origin HEAD:feat/prompt-topology-phase-b-projection
