name: Temporary recipient-need Prompt Kit carrier

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: recipient-need-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'prompt-kit/recipient-need-gate-20260909'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prompt-kit/recipient-need-gate-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strengthen correspondence owners, prove, and remove transport
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main prompt-kit/recipient-need-gate-20260909 --prune
          git merge --no-edit origin/main
          python scripts/tmp_apply_recipient_need_gate.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python -m unittest tests.test_correspondence_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          python scripts/tmp_apply_recipient_need_gate.py --verify-only
          python -m unittest tests.test_correspondence_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          git rm -f scripts/tmp_apply_recipient_need_gate.py .github/workflows/tmp-recipient-need-gate-carrier.yml
          git add registry/prompts/correspondence-prompts.v1.json tests/test_correspondence_prompt_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'feat(prompt-kit): gate recipient disclosure'
          git push origin HEAD:prompt-kit/recipient-need-gate-20260909
