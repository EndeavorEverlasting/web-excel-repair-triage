name: Temporary Prompt Kit final feedback regeneration

on:
  push:
    branches:
      - feat/prompt-kit-production-feedback-promotion-20260825
    paths:
      - .github/workflows/tmp-regenerate-prompt-kit-feedback-final-falsification.yml

permissions:
  contents: write

concurrency:
  group: tmp-prompt-kit-final-feedback-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate canonical Prompt Kit
        run: python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Validate final falsification fixes and generated parity
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          python -m unittest tests.test_prompt_kit_feedback_production tests.test_prompt_kit_feedback_prototype tests.test_prompt_kit_promotion_pipeline tests.test_prompt_kit_pages -v
          node --check docs/prompt-kit-feedback-production.js
          grep -F 'FEEDBACK_STORAGE_CORRUPT' web/prompt-kit/index.html >/dev/null
          ! grep -F 'slice(-MAX_EVENTS)' web/prompt-kit/index.html
          git diff --check
      - name: Self-remove authoring transport and commit generated output
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-regenerate-prompt-kit-feedback-final-falsification.yml
          git add web/prompt-kit/index.html .github/workflows/tmp-regenerate-prompt-kit-feedback-final-falsification.yml
          test -n "$(git status --short)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(prompt-kit): refresh final feedback safeguards'
          git push origin HEAD:feat/prompt-kit-production-feedback-promotion-20260825
