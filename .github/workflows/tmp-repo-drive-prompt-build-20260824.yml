name: Temporary repo Drive artifact sync prompt build

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: repo-drive-artifact-sync-prompt-20260824
  cancel-in-progress: false

jobs:
  build-prompt:
    if: >-
      github.event.pull_request.head.ref == 'feat/prompt-kit-repo-drive-artifact-sync-20260824' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-repo-drive-artifact-sync-20260824
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh floor and reconcile main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --all --prune --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          test -f .prompt-contrib/repo_drive_artifact_sync_draft.json
          test -f .prompt-contrib/repo_drive_sync_test_patch.py
          git status --short
          git log --oneline --decorate -8

      - name: Allocate canonical prompt with helper
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py add \
            --input .prompt-contrib/repo_drive_artifact_sync_draft.json \
            --registry repository-work-ledger-prompts
          python .prompt-contrib/repo_drive_sync_test_patch.py

      - name: Focused semantic and Prompt Kit validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_repository_work_ledger_prompt -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Whole-chat pass two and boundary falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import build_prompt_kit_registry

          root = Path('.')
          raw_doc = json.loads((root / 'registry/prompts/repository-work-ledger-prompts.v1.json').read_text(encoding='utf-8'))
          raw_matches = [p for p in raw_doc['prompts'] if p['name'] == 'Repository + Google Drive Artifact Synchronizer']
          if len(raw_matches) != 1:
              raise SystemExit(f'expected exactly one generic Drive sync raw owner, got {len(raw_matches)}')
          raw = raw_matches[0]
          full = {p['id']: p for p in build_prompt_kit_registry.load_prompt_kit_registry()}
          effective = full[raw['id']]
          p77 = full['P77']
          policy = build_prompt_kit_registry.load_actionability_policy()

          required = (
              "DO NOT MIRROR THE WHOLE REPOSITORY",
              "REPO-AUTHORITATIVE",
              "DRIVE-AUTHORITATIVE",
              "BIDIRECTIONAL-BY-CONTRACT",
              "PRIVATE / DO-NOT-SYNC",
              "MAP IDENTITIES, NOT JUST FILENAMES",
              "FAIL CLOSED ON TWO-SIDED DIVERGENCE",
              "Timestamp-newer alone is not a safe conflict resolver",
              "READ BACK AND VERIFY",
              "SECOND PASS TO A BOUNDED FIXED POINT",
          )
          missing = [phrase for phrase in required if phrase not in raw['copyContent']]
          if missing:
              raise SystemExit(f'generic Drive sync semantics missing: {missing}')
          for forbidden in ('EndeavorEverlasting', 'Neuron Track Hours', 'NTH billing', 'Triage + FUN + Drive Context Synchronizer'):
              if forbidden in raw['copyContent']:
                  raise SystemExit(f'generic prompt absorbed specialized domain wording: {forbidden}')
          if raw.get('profile'):
              raise SystemExit(f'generic prompt unexpectedly gained domain profile: {raw.get("profile")}')
          if raw['color'] != 'Teal' or raw['category'] != 'standard':
              raise SystemExit('generic prompt did not inherit repository-work-ledger visual/category route')
          if len(raw['copyContent']) >= 8000:
              raise SystemExit(f'generic prompt exceeded focused anti-bloat ceiling: {len(raw["copyContent"])}')
          if policy['marker'] in raw['copyContent']:
              raise SystemExit('raw generic prompt duplicated shared actionability policy')
          if policy['marker'] not in effective['copyContent']:
              raise SystemExit('effective generic prompt did not receive shared actionability policy')
          if p77.get('profile') != 'triage-management' or p77.get('type') != 'MAINTENANCE + CROSS-REPO':
              raise SystemExit('P77 specialized owner boundary drifted')
          print(json.dumps({
              'pass_two': 'bounded fixed point',
              'new_prompt_id': raw['id'],
              'new_prompt_raw_size': len(raw['copyContent']),
              'registry': 'repository-work-ledger-prompts',
              'p77_boundary': 'preserved',
              'whole_repo_mirroring': 'rejected',
              'silent_two_sided_overwrite': 'rejected',
              'domain_specific_management_semantics': 'left with P77',
          }, indent=2))
          PY
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Remove transport and commit durable contribution
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .prompt-contrib/repo_drive_prompt_inspect.txt \
            .prompt-contrib/repo_drive_artifact_sync_draft.json \
            .prompt-contrib/repo_drive_sync_test_patch.py
          git add \
            registry/prompts/repository-work-ledger-prompts.v1.json \
            tests/test_repository_work_ledger_prompt.py \
            web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m "feat(prompt-kit): add repository Drive artifact synchronizer"

      - name: Refresh moved main and rerun exact-head proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            python scripts/prompt_registry_ops.py validate
            python -m unittest tests.test_repository_work_ledger_prompt tests.test_actionable_prompt_registry -v
            python -m unittest tests.test_prompt_language_audit -v
            python scripts/validate_prompt_kit_discovery.py --summary
            python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
            git add web/prompt-kit/index.html
            if ! git diff --cached --quiet; then
              git commit -m "chore(prompt-kit): refresh Drive sync generated site after main reconciliation"
            fi
            git diff --check HEAD
          fi
          echo "PROVEN_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short

      - name: Push exact validated head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/prompt-kit-repo-drive-artifact-sync-20260824
          echo "PUSHED_HEAD=$PROVEN_HEAD"
