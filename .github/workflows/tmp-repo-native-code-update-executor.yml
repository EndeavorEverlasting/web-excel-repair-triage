name: Temporary repo-native prompt executor

on:
  push:
    branches: [main]
    paths:
      - .prompt-contrib/repo-native-code-update-trigger.txt
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: repo-native-code-update-prompt-contribution
  cancel-in-progress: false

jobs:
  execute:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'chore/repo-native-prompt-trigger-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh exact main floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --all --prune --tags
          git pull --ff-only origin main
          git status --short
          git log --oneline --decorate -5

      - name: Execute contribution through canonical prompt helper
        shell: bash
        run: |
          set -euo pipefail
          python .prompt-contrib/repo_native_code_update_prompt_contribution.py

      - name: Focused semantic and registry proof
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/test_p02_p07_autonomous_iteration.py tests/test_spec_architecture_prompt_registry.py
          python -m unittest tests.test_p02_p07_autonomous_iteration -v
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate | tee "$RUNNER_TEMP/registry-validation.json"
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Verify bounded durable diff and helper parity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path(os.environ['RUNNER_TEMP'], 'registry-validation.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'valid'
          assert receipt['site_parity'] is True
          assert receipt['prompt_count'] > 0
          print(json.dumps(receipt, indent=2))
          PY
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(docs/prompts.json|registry/prompts/spec-architecture-prompts.v1.json|tests/test_p02_p07_autonomous_iteration.py|tests/test_spec_architecture_prompt_registry.py|web/prompt-kit/index.html)$' || true)"
          test -z "$unexpected" || { echo "Unexpected durable changed paths: $unexpected" >&2; exit 1; }

      - name: Remove temporary execution transport
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/tmp-repo-native-code-update-executor.yml \
            .github/workflows/tmp-repo-native-code-update-prompt-contrib.yml \
            .prompt-contrib/repo_native_code_update_prompt_contribution.py \
            .prompt-contrib/repo-native-code-update-trigger.txt

      - name: Commit exact validated contribution
        shell: bash
        run: |
          set -euo pipefail
          git add docs/prompts.json registry/prompts/spec-architecture-prompts.v1.json tests/test_p02_p07_autonomous_iteration.py tests/test_spec_architecture_prompt_registry.py web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m "feat(prompt-kit): add repository-native code update harness prompt"

      - name: Refresh floor again and rerun exact-head proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          python -m unittest tests.test_p02_p07_autonomous_iteration tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check HEAD
          echo "FINAL_SHA=$(git rev-parse HEAD)"

      - name: Integrate exact green head into main
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git status --short
