name: Temporary SSH prompt reconcile builder

on:
  push:
    branches: [feat/repository-ssh-setup-usage-prompt-20260909]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build canonical Prompt Kit from reconciled inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest tests.test_repository_ssh_setup_prompt -v
          python scripts/evaluate_prompt_language.py --summary
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/build_prompt_kit_registry.py --output "$RUNNER_TEMP/prompt-kit-index.html"
          test -s "$RUNNER_TEMP/prompt-kit-index.html"
          sha256sum "$RUNNER_TEMP/prompt-kit-index.html" | tee "$RUNNER_TEMP/prompt-kit-index.sha256"
      - name: Upload canonical generated bytes
        uses: actions/upload-artifact@v7
        with:
          name: repository-ssh-reconciled-prompt-kit
          path: |
            ${{ runner.temp }}/prompt-kit-index.html
            ${{ runner.temp }}/prompt-kit-index.sha256
          if-no-files-found: error
          retention-days: 2
