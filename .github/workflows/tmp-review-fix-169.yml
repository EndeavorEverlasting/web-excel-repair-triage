name: Temporary Prompt Kit review fixes 169

on:
  push:
    branches:
      - feat/prompt-kit-chat-continuation-all-reset-20260810

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-chat-continuation-all-reset-20260810
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply bounded review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one review-fix target in {path}; found {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/build_prompt_kit_registry.py",
              '''        prompt_id = str(override["id"]).upper()\n        if prompt_id in seen:\n            raise SystemExit(f"Duplicate prompt override id: {prompt_id}")\n        seen.add(prompt_id)\n        if prompt_id not in positions:\n            raise SystemExit(f"Prompt override references unknown prompt id: {prompt_id}")\n        current = result[positions[prompt_id]]\n        if str(override["seq"]) != str(current.get("seq")):\n''',
              '''        override_id = str(override["id"])\n        prompt_id = override_id.upper()\n        if prompt_id in seen:\n            raise SystemExit(f"Duplicate prompt override id: {prompt_id}")\n        seen.add(prompt_id)\n        if prompt_id not in positions:\n            raise SystemExit(f"Prompt override references unknown prompt id: {prompt_id}")\n        current = result[positions[prompt_id]]\n        canonical_id = str(current.get("id", ""))\n        if override_id != canonical_id:\n            raise SystemExit(\n                "Prompt override id must exactly match canonical identity: "\n                f"{override_id} != {canonical_id}"\n            )\n        if str(override["seq"]) != str(current.get("seq")):\n''',
          )

          replace_once(
              "scripts/evaluate_prompt_language.py",
              '''        raw.extend(prompts)\n    return raw\n\n\ndef load_effective_registry()''',
              '''        raw.extend(prompts)\n    try:\n        return build_prompt_kit_registry.apply_prompt_overrides(raw)\n    except SystemExit as exc:\n        raise PromptLanguageAuditError(str(exc)) from exc\n\n\ndef load_effective_registry()''',
          )

          replace_once(
              "tests/test_prompt_language_audit.py",
              '''        self.assertIn("P62", {item["prompt_id"] for item in report["prompts"]})\n\n    def test_strict_mode_fails_warning_only_registry(self) -> None:\n''',
              '''        self.assertIn("P62", {item["prompt_id"] for item in report["prompts"]})\n\n    def test_raw_registry_uses_effective_override_authority(self) -> None:\n        raw = evaluate_prompt_language.load_raw_registry()\n        p02 = next(item for item in raw if item["id"] == "P02")\n        self.assertEqual(p02["name"], "Previous Chat → Active Sprint Executor")\n        report = evaluate_prompt_language.evaluate_registry(policy=self.policy)\n        p02_result = next(item for item in report["prompts"] if item["prompt_id"] == "P02")\n        self.assertEqual(p02_result["name"], "Previous Chat → Active Sprint Executor")\n\n    def test_strict_mode_fails_warning_only_registry(self) -> None:\n''',
          )

          replace_once(
              "tests/test_skill_prompt_registry.py",
              '''        self.assertEqual(source_p02["seq"], override["seq"])\n\n    def test_skill_eval_prompt_requires_correctness_weakness_and_efficiency_proof(self) -> None:\n''',
              '''        self.assertEqual(source_p02["seq"], override["seq"])\n\n    def test_prompt_override_rejects_id_casing_drift(self) -> None:\n        source_p02 = next(\n            item\n            for item in json.loads(build_prompt_kit_registry.BASE_REGISTRY.read_text(encoding="utf-8"))\n            if item["id"] == "P02"\n        )\n        bad = dict(source_p02)\n        bad["id"] = "p02"\n        original = build_prompt_kit_registry.PROMPT_OVERRIDES\n        try:\n            with tempfile.TemporaryDirectory() as temp_dir:\n                path = Path(temp_dir) / "overrides.json"\n                path.write_text(\n                    json.dumps({"schema_version": "prompt-registry-overrides/v1", "overrides": [bad]}),\n                    encoding="utf-8",\n                )\n                build_prompt_kit_registry.PROMPT_OVERRIDES = path\n                with self.assertRaisesRegex(SystemExit, "exactly match canonical identity"):\n                    build_prompt_kit_registry.apply_prompt_overrides([source_p02])\n        finally:\n            build_prompt_kit_registry.PROMPT_OVERRIDES = original\n\n    def test_skill_eval_prompt_requires_correctness_weakness_and_efficiency_proof(self) -> None:\n''',
          )
          PY
          python -m py_compile scripts/build_prompt_kit_registry.py scripts/evaluate_prompt_language.py tests/test_prompt_language_audit.py tests/test_skill_prompt_registry.py
          python -m unittest tests.test_prompt_language_audit tests.test_skill_prompt_registry -v
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(scripts/build_prompt_kit_registry.py|scripts/evaluate_prompt_language.py|tests/test_prompt_language_audit.py|tests/test_skill_prompt_registry.py)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected review-fix changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git add -- scripts/build_prompt_kit_registry.py scripts/evaluate_prompt_language.py tests/test_prompt_language_audit.py tests/test_skill_prompt_registry.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(prompt-kit): preserve override identity and audit authority'
          git push origin HEAD:feat/prompt-kit-chat-continuation-all-reset-20260810
