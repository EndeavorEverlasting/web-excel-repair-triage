name: Temporary S0 state presentation builder

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test-floor.txt
      - name: Run S0 focused tests and build canonical Prompt Kit
        run: |
          set -euo pipefail
          python -m unittest tests.test_operational_closeout_contract -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Upload generated Prompt Kit
        uses: actions/upload-artifact@v7
        with:
          name: s0-state-presentation-generated-${{ github.sha }}
          path: web/prompt-kit/index.html
          if-no-files-found: error
          retention-days: 7
