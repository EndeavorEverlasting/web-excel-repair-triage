name: Temporary SAS prompt materializer

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: prompt-kit-sas-prompt-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.number == 310 && github.event.comment.body == '/materialize-sas-prompts') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.number == 310 && github.event.pull_request.head.ref == 'feat/prompt-kit-sas-use-case-prompts-20260826' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prompt-kit-sas-use-case-prompts-20260826
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Refresh exact branch and main floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --all --prune --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/prompt-kit-sas-use-case-prompts-20260826)"
          git merge-base --is-ancestor origin/main HEAD
          echo "sas branch=$(git rev-parse HEAD)"
          echo "main floor=$(git rev-parse origin/main)"

      - name: Materialize six SAS owners with canonical helper
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_materialize_sas_prompt_owners.py

      - name: Whole-chat pass 2 overlap and boundary falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from scripts import build_prompt_kit_registry as r
          expected={
            'SysAdminSuite Protected-Network Endpoint Probe & Identity Gate': ('SYSADMINSUITE / ENDPOINT RECON','read-only'),
            'SysAdminSuite Clinical-Core Deployment with AutoLogon Isolation': ('SYSADMINSUITE / CLINICAL ENDPOINT','AutoLogon'),
            'SysAdminSuite AutoLogon-Only Crash-Safe Recovery': ('SYSADMINSUITE / AUTOLOGON','S4U'),
            'SysAdminSuite Fleet Batch Endpoint Change Orchestrator': ('SYSADMINSUITE / FLEET OPERATIONS','bounded concurrency'),
            'SysAdminSuite Reversible Printer Mapping & Audit': ('SYSADMINSUITE / PRINTER OPERATIONS','UNMAP'),
            'SysAdminSuite Active Directory Computer OU Move & Verification': ('SYSADMINSUITE / DIRECTORY OPERATIONS','distinguished name'),
          }
          prompts=r.load_prompt_kit_registry()
          by_name={p['name']:p for p in prompts}
          ids=[]
          for name,(klass,phrase) in expected.items():
              p=by_name[name]
              ids.append(p['id'])
              assert p['class']==klass,(name,p['class'])
              assert phrase in p['copyContent'],(name,phrase)
              assert p.get('profile')=='sysadminsuite'
          assert len(ids)==len(set(ids))==6
          generic=['Repo Sprint Executor','End-to-End Harness Validator','Canonical Development & Production Path Resolver','Prompt Registry Prompt Adder']
          for name in generic:
              assert name in by_name, name
              assert by_name[name]['id'] not in ids
          print({'sas_ids':ids,'generic_owners_preserved':generic})
          PY
          python -m unittest tests.test_sysadminsuite_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Remove temporary prompt drafts and carrier transport
        shell: bash
        run: |
          set -euo pipefail
          git rm -r tmp/sas-prompt-drafts
          git rm .github/workflows/temp-sas-prompt-inspect.yml
          git rm .github/workflows/tmp-sas-prompt-materializer.yml
          git rm scripts/tmp_materialize_sas_prompt_owners.py
          python -m unittest tests.test_sysadminsuite_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Commit exact durable SAS contribution
        shell: bash
        run: |
          set -euo pipefail
          git add \
            registry/prompts/spec-architecture-prompts.v1.json \
            web/prompt-kit/index.html \
            tests/test_sysadminsuite_prompt_registry.py \
            harness/test-floor.v1.json
          git diff --cached --check
          echo '--- durable staged files ---'
          git diff --cached --name-only
          git commit -m 'feat(prompt-kit): add durable SysAdminSuite workflow prompts'
          git push origin HEAD:feat/prompt-kit-sas-use-case-prompts-20260826
          echo "durable_head=$(git rev-parse HEAD)"
