name: Temporary scope exhaustion closeout hardening

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: scope-exhaustion-closeout-hardening-20260824
  cancel-in-progress: false

jobs:
  harden-closeout:
    if: >-
      github.event.pull_request.head.ref == 'feat/prompt-closeout-evidence-hardening-20260824' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-closeout-evidence-hardening-20260824
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh floor and reconcile main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --all --prune --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          test -f .prompt-contrib/scope_exhaustion_closeout_trigger.txt
          git status --short
          git log --oneline --decorate -8

      - name: Harden shared closeout and P83 scope exhaustion audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          policy_path = root / 'registry/prompts/actionable-next-step-policy.v1.json'
          policy = json.loads(policy_path.read_text(encoding='utf-8'))

          policy['next_step_suffix'] = (
              "Do not leave the next step empty or generic: identify the first executable, dependency-aware action that advances or consumes the canonical artifact or proof; PR, status, branch, or log inspection alone is invalid when safe executable work remains. "
              "Before claiming completion, emit a compact evidence-bearing closeout and reconstruct the original requested/owned scope. Disposition every material item as PROVEN DONE, SAFE & EXECUTABLE, BLOCKED, UNSAFE, or OUT OF SCOPE. Any SAFE & EXECUTABLE item disproves `none; no safe actionable work remains` and must be advanced. UNSAFE requires the exact action, concrete hazard and evidence, consequence, and safer alternative or gate; missing tools, credentials, approval, or access is BLOCKED rather than unsafe, and uncertainty or inconvenience alone is not danger. OUT OF SCOPE requires an explicit scope boundary. "
              "If the owned branch or pull request is mergeable, merge only when the exact validated head is still current, all required checks and owning validators pass, dependencies are satisfied, no unresolved review/conflict/branch-protection/approval gate remains, merge authority exists, and the user has not prohibited merging. Report changed surfaces/artifacts, commands/examples actually verified, remaining gaps/risks/blockers, unproven runtime or field steps, review/reconciliation state when relevant, proof ceiling, integration state, and the first executable continuation. "
              "After an integration SHA has been proven, a later default-branch advance is not a failure by itself: verify that the proven merge or commit is an ancestor of the refreshed default branch and rerun only proof affected by intervening changes; do not require the refreshed default-branch head to equal the historical integration SHA."
          )

          marker = 'OPERATIONAL CLOSEOUT / GAP-RISK CONTRACT\n'
          appendix = policy['copy_content_appendix']
          if marker not in appendix:
              raise SystemExit('closeout marker missing from policy appendix')
          prefix = appendix.split(marker, 1)[0]
          closeout = marker + """- Before any legitimate stop, report these fields explicitly: COMPLETED / PROVEN; REMAINING GAPS; RISKS; BLOCKERS; PROOF CEILING; INTEGRATION STATE; NEXT ACTION / NEXT STEPS.
- Reconstruct the original request, owned scope, explicit constraints, acceptance criteria, and proof requirements before declaring scope exhausted. Disposition every material item exactly once as PROVEN DONE, SAFE & EXECUTABLE, BLOCKED, UNSAFE, or OUT OF SCOPE.
- SAFE & EXECUTABLE means work remains and the agent must continue. It is incompatible with `none; no safe actionable work remains`.
- BLOCKED means the item is still in scope but cannot advance because of a named dependency, permission, credential, review, protected runtime, user-only decision, or unavailable external system. Missing access is not evidence that the work is unsafe.
- UNSAFE is a narrow evidence-bearing classification. Name the exact action that would be unsafe, the concrete hazard, supporting evidence, likely consequence, and the safer alternative or gate. Do not relabel uncertainty, inconvenience, time cost, lack of tools, missing credentials, or ordinary review requirements as danger.
- OUT OF SCOPE requires an explicit scope boundary from the request, governing contract, or forbidden scope. Do not move unfinished requested work out of scope merely to close the task.
- A gap, risk, or blocker must name the affected scope, evidence, consequence, and the action that reduces or closes it. Do not hide known uncertainty behind `looks good`, `green`, `ready`, or an empty section.
- NEXT ACTION must be the first executable continuation, with owner, dependency, exact command or operator action, expected artifact/proof, and completion gate. If several actions remain, order them by dependency and keep executing agent-capable steps instead of merely listing them.
- Use `none; no safe actionable work remains` only when every material requested-scope item has a supported terminal disposition, no SAFE & EXECUTABLE item remains, owned acceptance criteria are proven, authorized integration is complete or explicitly blocked, and remaining gaps/risks are either closed, explicitly accepted by scope, BLOCKED, UNSAFE with evidence, or OUT OF SCOPE with a cited boundary.
"""
          policy['copy_content_appendix'] = prefix + closeout
          policy_path.write_text(json.dumps(policy, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          ledger_path = root / 'registry/prompts/repository-work-ledger-prompts.v1.json'
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          p83 = next(p for p in ledger['prompts'] if p['id'] == 'P83')

          p83['useWhen'] = (
              "Another agent, chat, handoff, branch, PR, report, artifact, or implementation claims work is complete or partially complete—including `none; no safe actionable work remains`—and you need a fresh agent to verify the real state, audit requested-scope exhaustion, repair errors, advance unfinished work, expand useful in-scope coverage, and report what changed without repeatedly asking the user to mediate."
          )
          p83['expectedOutput'] = (
              "An evidence-backed continuation that distinguishes verified facts from inherited claims, reconstructs the original requested scope, dispositions every material item as PROVEN DONE / SAFE & EXECUTABLE / BLOCKED / UNSAFE / OUT OF SCOPE, closes safe in-scope gaps through repeated verify/repair/advance/revalidate passes, preserves stronger correct work, integrates authorized green work when appropriate, and reports remaining gaps, risks, blockers, proof ceiling, integration state, and the next executable action or exact user-only gate."
          )
          p83['nextStep'] = (
              "Resolve the exact prior work and current repository floor, reconstruct the original requested scope and acceptance criteria, build a scope-item/evidence/disposition matrix, execute the highest-value SAFE & EXECUTABLE item, validate it, critique the new evidence, integrate any independently verified green slice, refresh main/evidence, and repeat until every material scope item has a supported terminal disposition or a genuine external gate remains."
          )
          p83['proofGate'] = (
              p83['proofGate'].rstrip() + " Scope-exhaustion proof additionally requires every material requested-scope item to be classified as PROVEN DONE, SAFE & EXECUTABLE, BLOCKED, UNSAFE, or OUT OF SCOPE; any SAFE & EXECUTABLE item invalidates a terminal `none` claim; UNSAFE names the exact action, concrete hazard/evidence/consequence, and safer alternative or gate; BLOCKED is not mislabeled unsafe merely because tools, credentials, access, approval, or a protected runtime are missing; and OUT OF SCOPE cites an explicit boundary rather than convenience."
          )

          section = """

SCOPE-EXHAUSTION AUDIT — CHALLENGE `NONE`
If prior work says `none; no safe actionable work remains`, reconstruct the original requested scope and disposition every material item as PROVEN DONE, SAFE & EXECUTABLE, BLOCKED, UNSAFE, or OUT OF SCOPE. Any SAFE & EXECUTABLE item disproves closure and must be advanced. UNSAFE requires the exact action, concrete hazard/evidence/consequence, and safer alternative or gate. Missing tools, credentials, approval, or access is BLOCKED—not unsafe; uncertainty or inconvenience alone is not danger. OUT OF SCOPE requires an explicit boundary.
"""
          if 'SCOPE-EXHAUSTION AUDIT — CHALLENGE `NONE`' not in p83['copyContent']:
              anchor = '\n\nSTOP ONLY AT THE REAL FIXED POINT'
              if anchor not in p83['copyContent']:
                  raise SystemExit('P83 stop-condition anchor not found')
              p83['copyContent'] = p83['copyContent'].replace(anchor, section + anchor, 1)

          for keyword in (
              'no safe actionable work remains',
              'scope exhaustion',
              'premature closeout',
              'what is unsafe',
              'unfinished requested scope',
          ):
              if keyword not in p83['keywords']:
                  p83['keywords'].append(keyword)

          if len(p83['copyContent']) >= 8000:
              raise SystemExit(f'P83 anti-bloat ceiling exceeded: {len(p83["copyContent"])}')
          ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          test_path = root / 'tests/test_operational_closeout_contract.py'
          text = test_path.read_text(encoding='utf-8')

          old = '''        for phrase in (
            "EVIDENCE-BEARING CLOSEOUT", "CHANGED SURFACES / ARTIFACTS",
            "COMMANDS / EXAMPLES VERIFIED", "UNPROVEN RUNTIME / FIELD STEPS",
            "REVIEW / RECONCILIATION", "handoff",
        ):
            self.assertIn(phrase, appendix)
'''
          if old in text:
              new = old + '''        suffix = self.policy["next_step_suffix"]
        for phrase in (
            "exact validated head is still current",
            "no unresolved review/conflict/branch-protection/approval gate remains",
            "merge authority exists",
            "user has not prohibited merging",
            "PROVEN DONE, SAFE & EXECUTABLE, BLOCKED, UNSAFE, or OUT OF SCOPE",
            "Any SAFE & EXECUTABLE item disproves",
            "Missing access is not evidence that the work is unsafe",
        ):
            self.assertIn(phrase, suffix if phrase != "Missing access is not evidence that the work is unsafe" else appendix)
'''
              text = text.replace(old, new, 1)

          old_count = '                self.assertEqual(content.count(MARKER), 1)\n'
          if old_count in text and 'content.count(self.policy["marker"])' not in text:
              text = text.replace(old_count, old_count + '                self.assertEqual(content.count(self.policy["marker"]), 1)\n', 1)

          if 'def test_scope_exhaustion_requires_supported_residual_classification' not in text:
              insertion = '''
    def test_scope_exhaustion_requires_supported_residual_classification(self) -> None:
        appendix = self.policy["copy_content_appendix"]
        for phrase in (
            "Reconstruct the original request, owned scope",
            "PROVEN DONE, SAFE & EXECUTABLE, BLOCKED, UNSAFE, or OUT OF SCOPE",
            "SAFE & EXECUTABLE means work remains",
            "Missing access is not evidence that the work is unsafe",
            "UNSAFE is a narrow evidence-bearing classification",
            "OUT OF SCOPE requires an explicit scope boundary",
            "Do not move unfinished requested work out of scope",
            "no SAFE & EXECUTABLE item remains",
        ):
            self.assertIn(phrase, appendix)

        p83 = self.ledger["P83"]
        for phrase in (
            "SCOPE-EXHAUSTION AUDIT — CHALLENGE `NONE`",
            "Any SAFE & EXECUTABLE item disproves closure",
            "Missing tools, credentials, approval, or access is BLOCKED—not unsafe",
            "OUT OF SCOPE requires an explicit boundary",
        ):
            self.assertIn(phrase, p83["copyContent"])
        self.assertIn("no safe actionable work remains", p83["keywords"])
        self.assertIn("scope exhaustion", p83["keywords"])
        self.assertLess(len(p83["copyContent"]), 8000)

'''
              marker2 = '    def test_live_cert_domain_law_requires_actionable_closeout(self) -> None:\n'
              if marker2 not in text:
                  raise SystemExit('operational closeout test insertion anchor missing')
              text = text.replace(marker2, insertion + marker2, 1)

          test_path.write_text(text, encoding='utf-8')
          print(json.dumps({
              'p83_raw_size': len(p83['copyContent']),
              'scope_exhaustion_owner': 'P83',
              'shared_owner': policy['policy_id'],
          }, indent=2))
          PY

      - name: Rebuild and validate exact changed surface
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_operational_closeout_contract -v
          python -m unittest tests.test_repository_work_ledger_prompt -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Whole-chat pass two and closeout falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import build_prompt_kit_registry

          root = Path('.')
          policy = json.loads((root / 'registry/prompts/actionable-next-step-policy.v1.json').read_text(encoding='utf-8'))
          ledger = json.loads((root / 'registry/prompts/repository-work-ledger-prompts.v1.json').read_text(encoding='utf-8'))
          p83 = next(p for p in ledger['prompts'] if p['id'] == 'P83')
          effective = {p['id']: p for p in build_prompt_kit_registry.load_prompt_registry()}

          if 'SAFE & EXECUTABLE means work remains' not in policy['copy_content_appendix']:
              raise SystemExit('shared policy can still hide safe unfinished work')
          if 'UNSAFE is a narrow evidence-bearing classification' not in policy['copy_content_appendix']:
              raise SystemExit('unsafe classification is not evidence-bounded')
          if 'SCOPE-EXHAUSTION AUDIT — CHALLENGE `NONE`' not in p83['copyContent']:
              raise SystemExit('P83 lacks direct reusable scope-exhaustion audit')
          if policy['closeout_marker'] not in effective['P83']['copyContent']:
              raise SystemExit('P83 effective prompt lost shared closeout policy')
          if effective['P83']['copyContent'].count(policy['marker']) != 1:
              raise SystemExit('P83 effective prompt has duplicate shared appendix')
          print(json.dumps({
              'pass_two': 'bounded fixed point',
              'new_prompt_ids': [],
              'strengthened_prompt': 'P83 Agent Work Verifier & Iterative Advancer',
              'shared_policy': policy['policy_id'],
              'unsafe_escape_hatch': 'rejected',
              'safe_unfinished_closeout': 'rejected',
              'blocked_vs_unsafe': 'separated',
              'out_of_scope_requires_boundary': True,
          }, indent=2))
          PY
          git diff --check

      - name: Remove transport, commit durable contribution, and push
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .prompt-contrib/scope_exhaustion_closeout_trigger.txt
          git add \
            registry/prompts/actionable-next-step-policy.v1.json \
            registry/prompts/repository-work-ledger-prompts.v1.json \
            tests/test_operational_closeout_contract.py \
            docs/PROMPT_FINDER_QUESTIONNAIRE_TUTORIAL.md \
            web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m "fix(prompt-kit): make scope exhaustion evidence-bearing"
          git fetch origin main --prune
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
            python scripts/prompt_registry_ops.py validate
            python -m unittest tests.test_operational_closeout_contract tests.test_repository_work_ledger_prompt tests.test_actionable_prompt_registry -v
            python -m unittest tests.test_prompt_language_audit -v
            python scripts/validate_prompt_kit_discovery.py --summary
            python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
            git add web/prompt-kit/index.html
            if ! git diff --cached --quiet; then
              git commit -m "chore(prompt-kit): refresh closeout site after main reconciliation"
            fi
          fi
          git diff --check HEAD
          git push origin HEAD:feat/prompt-closeout-evidence-hardening-20260824
          echo "PROVEN_HEAD=$(git rev-parse HEAD)"
