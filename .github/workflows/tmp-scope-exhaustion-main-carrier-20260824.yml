name: Temporary scope exhaustion main carrier

on:
  push:
    branches: [main]
    paths:
      - '.prompt-contrib/scope_exhaustion_main_carrier.txt'

permissions:
  contents: write

concurrency:
  group: scope-exhaustion-main-carrier-20260824
  cancel-in-progress: false

jobs:
  mutate-pr272:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-closeout-evidence-hardening-20260824
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh branch from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --all --prune --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          test -f .github/scripts/tmp_scope_exhaustion_closeout_patch.py
          test -f .prompt-contrib/scope_exhaustion_closeout_trigger.txt
      - name: Apply bounded scope-exhaustion hardening
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/tmp_scope_exhaustion_closeout_patch.py
      - name: Rebuild and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_operational_closeout_contract -v
          python -m unittest tests.test_repository_work_ledger_prompt -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Pass two and falsification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import build_prompt_kit_registry
          root = Path('.')
          policy = json.loads((root / 'registry/prompts/actionable-next-step-policy.v1.json').read_text(encoding='utf-8'))
          ledger = json.loads((root / 'registry/prompts/repository-work-ledger-prompts.v1.json').read_text(encoding='utf-8'))
          p83 = next(p for p in ledger['prompts'] if p['id'] == 'P83')
          effective = {p['id']: p for p in build_prompt_kit_registry.load_prompt_registry()}
          assert 'SAFE & EXECUTABLE means work remains' in policy['copy_content_appendix']
          assert 'UNSAFE is a narrow evidence-bearing classification' in policy['copy_content_appendix']
          assert 'SCOPE-EXHAUSTION AUDIT — CHALLENGE `NONE`' in p83['copyContent']
          assert policy['closeout_marker'] in effective['P83']['copyContent']
          assert effective['P83']['copyContent'].count(policy['marker']) == 1
          print(json.dumps({
            'pass_two': 'bounded fixed point',
            'new_prompt_ids': [],
            'strengthened_prompt': 'P83 Agent Work Verifier & Iterative Advancer',
            'shared_policy': policy['policy_id'],
            'unsafe_escape_hatch': 'rejected',
            'safe_unfinished_closeout': 'rejected',
            'blocked_vs_unsafe': 'separated',
            'out_of_scope_requires_boundary': True,
          }, indent=2))
          PY
      - name: Commit durable PR contribution
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .prompt-contrib/scope_exhaustion_closeout_trigger.txt
          git add \
            registry/prompts/actionable-next-step-policy.v1.json \
            registry/prompts/repository-work-ledger-prompts.v1.json \
            tests/test_operational_closeout_contract.py \
            docs/PROMPT_FINDER_QUESTIONNAIRE_TUTORIAL.md \
            web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m "fix(prompt-kit): make scope exhaustion evidence-bearing"
          git fetch origin main --prune
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
            python scripts/prompt_registry_ops.py validate
            python -m unittest tests.test_operational_closeout_contract tests.test_repository_work_ledger_prompt tests.test_actionable_prompt_registry -v
            python -m unittest tests.test_prompt_language_audit -v
            python scripts/validate_prompt_kit_discovery.py --summary
            python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
            git add web/prompt-kit/index.html
            if ! git diff --cached --quiet; then
              git commit -m "chore(prompt-kit): refresh closeout site after main reconciliation"
            fi
          fi
          git diff --check HEAD
          git push origin HEAD:feat/prompt-closeout-evidence-hardening-20260824
          echo "PROVEN_HEAD=$(git rev-parse HEAD)"
