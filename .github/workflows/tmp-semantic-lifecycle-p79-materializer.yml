name: Temporary P79 semantic lifecycle materializer

on:
  pull_request:
    paths:
      - .github/workflows/tmp-semantic-lifecycle-p79-materializer.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate without write credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate canonical Prompt Kit
        run: |
          set -euo pipefail
          mkdir -p Outputs/p79-materializer
          python3 scripts/build_prompt_kit_registry.py --output Outputs/p79-materializer/index.html
      - name: Upload generated site
        uses: actions/upload-artifact@v7
        with:
          name: p79-semantic-site-${{ github.event.pull_request.head.sha }}
          path: Outputs/p79-materializer/index.html
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Refuse moved branch
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Download generated site
        uses: actions/download-artifact@v7
        with:
          name: p79-semantic-site-${{ github.event.pull_request.head.sha }}
          path: Outputs/p79-materializer
      - name: Publish generated file only
        run: |
          set -euo pipefail
          cp Outputs/p79-materializer/index.html web/prompt-kit/index.html
          git diff --check -- web/prompt-kit/index.html
          if git diff --quiet -- web/prompt-kit/index.html; then
            echo "Prompt Kit already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/prompt-kit/index.html
          git commit -m "build(prompt-kit): refresh P79 semantic lifecycle projection [generated]"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
