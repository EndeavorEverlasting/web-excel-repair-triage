name: Temporary strategic scout contribution

on:
  push:
    branches:
      - feat/repository-strategic-opportunity-scout-20260912
    paths:
      - .github/workflows/tmp-strategic-scout-contribution.yml

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/repository-strategic-opportunity-scout-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Refresh current main before authoring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune --tags
          echo "HEAD_BEFORE=$(git rev-parse HEAD)"
          echo "MAIN=$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          git merge-base --is-ancestor origin/main HEAD
      - name: Verify semantic-only draft
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('.tmp-strategic-scout-draft.json', encoding='utf-8'))
          forbidden={'id','seq','copySheet'} & set(p)
          assert not forbidden, forbidden
          assert p['name']=='Repository Strategic Opportunity Scout'
          assert p['type']=='ANALYZE'
          print('SEMANTIC_DRAFT_ONLY=true')
          PY
      - name: Add Scout through canonical helper
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py add --input .tmp-strategic-scout-draft.json --registry spec-architecture-prompts | tee /tmp/add-receipt.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/add-receipt.json', encoding='utf-8'))
          assert p['status']=='added', p
          assert p['registry_id']=='spec-architecture-prompts', p
          assert p['site_parity'] is True, p
          assert p['external_prior_art']['all_registered_sources_searched'] is True, p
          print('ALLOCATED_ID='+p['id'])
          print('PROMPT_COUNT='+str(p['prompt_count']))
          print('ALL_REGISTERED_SOURCES_SEARCHED=true')
          PY
      - name: Strengthen P07 and add focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python .tmp-strategic-scout-mutator.py /tmp/add-receipt.json
          python -m py_compile tests/test_p02_p07_autonomous_iteration.py tests/test_spec_architecture_prompt_registry.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
      - name: Run focused and connected validation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_p02_p07_autonomous_iteration -v
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_prompt_kit_discovery tests.test_prompt_kit_guidance tests.test_prompt_kit_order_navigation_contract tests.test_prompt_classification_refiner_prompt tests.test_skill_prompt_registry -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
      - name: Whole-chat pass two and bounded scope review
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import build_prompt_kit_registry
          receipt=json.load(open('/tmp/add-receipt.json', encoding='utf-8'))
          sid=receipt['id']
          prompts={p['id']:p for p in build_prompt_kit_registry.load_prompt_kit_registry()}
          scout=prompts[sid]
          p07=prompts['P07']
          checks={
            'scout_identity_distinct': sid not in {'P03','P20','P22','P23','P79','P82','P95','P97'},
            'three_to_five': 'at least 3 and no more than 5' in scout['copyContent'],
            'falsify_before_rank': scout['copyContent'].index('FALSIFY EACH THESIS BEFORE RANKING') < scout['copyContent'].index('COMPARE SURVIVING THESES'),
            'one_recommendation': 'SELECT EXACTLY ONE NEXT THESIS TO INVESTIGATE' in scout['copyContent'],
            'routes_all_owners': all(x in scout['copyContent'] for x in ['P95 Program Design','P97 Open-Source','P82 prototyping owner','P79 Prompt Registry','P07 Repo Sprint Executor']),
            'stops_before_execution': 'Do not continue into bounded execution' in scout['copyContent'],
            'p20_boundary': 'P20 executes an already-selected Opportunity_Discovery row' in scout['copyContent'],
            'p22_p23_boundary': 'P22/P23 rank which repository should move first across a portfolio' in scout['copyContent'],
            'p07_optional_follow_on': 'STRATEGIC FOLLOW-ON is optional and evidence-triggered' in p07['copyContent'],
            'p07_omits_when_absent': 'If no qualifying opportunity was exposed, omit the section entirely' in p07['copyContent'],
            'p07_routes_scout': f'{sid} Repository Strategic Opportunity Scout' in p07['copyContent'],
            'p07_bounded_execution_preserved': p07['type']=='BUILD' and 'The sprint remains incomplete whenever safe owned execution or integration work remains' in p07['copyContent'],
          }
          print(json.dumps(checks, indent=2))
          assert all(checks.values()), checks
          PY
          allowed=$(printf '%s\n' docs/prompts.json registry/prompts/spec-architecture-prompts.v1.json tests/test_p02_p07_autonomous_iteration.py tests/test_spec_architecture_prompt_registry.py web/prompt-kit/index.html | sort)
          actual=$(git diff --name-only origin/main | grep -v '^\.github/workflows/tmp-strategic-scout-' | grep -v '^\.tmp-strategic-scout-' | sort)
          printf 'DURABLE_DIFF_CANDIDATES:\n%s\n' "$actual"
          test "$actual" = "$allowed"
      - name: Remove temporary transport and commit durable contribution
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .tmp-strategic-scout-draft.json .tmp-strategic-scout-mutator.py .github/workflows/tmp-strategic-scout-prior-art.yml .github/workflows/tmp-strategic-scout-contribution.yml
          git diff --check
          git status --short
          git diff --stat origin/main
          git add -A
          git commit -m "feat(prompt-kit): add repository strategic opportunity scout"
          git push origin HEAD:feat/repository-strategic-opportunity-scout-20260912
          echo "DURABLE_HEAD=$(git rev-parse HEAD)"
