name: Temporary raw verifier successor-semantics carrier

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: prompt-scope-successor-raw-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/prompt-scope-successor-semantics-20260916'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/prompt-scope-successor-semantics-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Harden raw P83, regenerate, prove, remove carrier, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main fix/prompt-scope-successor-semantics-20260916 --prune
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/prompt-scope-successor-semantics-20260916)"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('registry/prompts/repository-work-ledger-prompts.v1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          p83 = next(item for item in data['prompts'] if item['id'] == 'P83')

          def replace_once(field: str, old: str, new: str) -> None:
              value = p83[field]
              if value.count(old) != 1:
                  raise SystemExit(f'{field}: expected one occurrence of {old!r}, found {value.count(old)}')
              p83[field] = value.replace(old, new, 1)

          replace_once(
              'expectedOutput',
              'PROVEN DONE / SAFE & EXECUTABLE / BLOCKED / UNSAFE / OUT OF SCOPE',
              'PROVEN DONE / SAFE & EXECUTABLE / BLOCKED / UNSAFE / OUT OF SCOPE / REQUIRED SUCCESSOR WORK',
          )
          replace_once(
              'nextStep',
              'supported terminal disposition or a genuine external gate remains',
              'supported terminal disposition, a durable REQUIRED SUCCESSOR WORK handoff, or a genuine external gate remains',
          )
          replace_once(
              'proofGate',
              'PROVEN DONE, SAFE & EXECUTABLE, BLOCKED, UNSAFE, or OUT OF SCOPE',
              'PROVEN DONE, SAFE & EXECUTABLE, BLOCKED, UNSAFE, OUT OF SCOPE, or REQUIRED SUCCESSOR WORK',
          )
          replace_once(
              'proofGate',
              'OUT OF SCOPE cites an explicit boundary rather than convenience.',
              'OUT OF SCOPE cites an explicit boundary that excludes the item from the whole requested outcome rather than convenience; REQUIRED SUCCESSOR WORK preserves downstream obligations across a phase, sprint, lane, prompt, or agent boundary with a named owner, dependency, first executable action, and completion gate.',
          )
          replace_once(
              'copyContent',
              'If prior work says `none; no safe actionable work remains`, reconstruct the original requested scope and disposition every material item as PROVEN DONE, SAFE & EXECUTABLE, BLOCKED, UNSAFE, or OUT OF SCOPE. Any SAFE & EXECUTABLE item disproves closure and must be advanced. UNSAFE requires the exact action, concrete hazard/evidence/consequence, and safer alternative or gate. Missing tools, credentials, approval, or access is BLOCKED—not unsafe; uncertainty or inconvenience alone is not danger. OUT OF SCOPE requires an explicit boundary.',
              'If prior work says `none; no safe actionable work remains`, reconstruct the original requested scope and disposition every material item as PROVEN DONE, SAFE & EXECUTABLE, BLOCKED, UNSAFE, OUT OF SCOPE, or REQUIRED SUCCESSOR WORK. Any SAFE & EXECUTABLE item disproves closure and must be advanced. UNSAFE requires the exact action, concrete hazard/evidence/consequence, and safer alternative or gate. Missing tools, credentials, approval, or access is BLOCKED—not unsafe; uncertainty or inconvenience alone is not danger. OUT OF SCOPE requires an explicit boundary that excludes the item from the whole requested outcome. A phase, sprint, lane, prompt, or agent boundary is not such a boundary when the item remains required for the whole outcome; classify that item as REQUIRED SUCCESSOR WORK and preserve its named owner, dependency, first executable action, and completion gate.',
          )

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          git rm .github/workflows/tmp-successor-semantics-raw-verifier.yml

          python -m unittest tests.test_operational_closeout_contract -v
          python -m unittest tests.test_actionable_prompt_registry tests.test_green_branch_integration_policy -v
          python scripts/prompt_registry_ops.py validate
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          git add registry/prompts/repository-work-ledger-prompts.v1.json registry/prompts/actionable-next-step-policy.v1.json tests/test_operational_closeout_contract.py web/prompt-kit/index.html
          git diff --cached --check
          git commit -m 'fix(prompt): harden raw verifier successor semantics'
          echo "validated_commit=$(git rev-parse HEAD)"
          git push origin HEAD:fix/prompt-scope-successor-semantics-20260916
