name: Scheduled one-shot teach Prompt Kit contribution

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribute-owned-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-teach-workspace-bootstrap-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute canonical helper payload and commit validated durable files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feat/prompt-kit-teach-workspace-bootstrap-20260822 --prune
          git checkout origin/main -- .github/workflows/prompt-kit-web.yml
          git rm -f .github/workflows/tmp-prompt-kit-teach-workspace-bootstrap-20260822.yml
          python scripts/tmp_teach_workspace_contribution_20260822.py
          rm -f .teach-bootstrap-receipt.tmp.json
          git rm scripts/tmp_teach_workspace_contribution_20260822.py
          git add .github/workflows/prompt-kit-web.yml registry/prompts/tutorial-discovery-prompts.v1.json tests/test_prompt_registry_expansion_regression_design_teach.py tests/test_prompt_kit_discovery.py web/prompt-kit/index.html
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(prompt-kit): add teach workspace bootstrap protocol'
          git push origin HEAD:feat/prompt-kit-teach-workspace-bootstrap-20260822
