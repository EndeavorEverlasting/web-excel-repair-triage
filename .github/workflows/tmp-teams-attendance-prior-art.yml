name: Temporary Teams attendance prior-art probe

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: teams-attendance-prior-art-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prior-art:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/teams-attendance-roster-20260910' && github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run registered prior-art search
        shell: bash
        env:
          EXPECTED_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVENT_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feat/teams-attendance-roster-20260910 --prune
          test "$(git rev-parse origin/feat/teams-attendance-roster-20260910)" = "$EXPECTED_EVENT_HEAD"
          git merge --no-edit origin/main
          QUERY='Microsoft Teams named chats technician attendance roster reconstruction site task check-in cadence expected check-in notches conflicts missing check-ins attendance evidence distinct from billing work-evidence harvesting'
          python scripts/prompt_registry_ops.py prior-art --query "$QUERY" | tee /tmp/teams-attendance-prior-art.txt
          grep -q 'all_registered_sources_searched' /tmp/teams-attendance-prior-art.txt
          grep -q 'true' /tmp/teams-attendance-prior-art.txt
          cp /tmp/teams-attendance-prior-art.txt scripts/tmp_teams_attendance_prior_art_receipt.txt
          git rm -f .github/workflows/tmp-teams-attendance-prior-art.yml scripts/tmp_teams_attendance_prior_art_trigger.txt
          git add scripts/tmp_teams_attendance_prior_art_receipt.txt
          git diff --cached --check
          git commit -m 'chore: capture Teams attendance prior-art receipt'
      - name: Push exact receipt head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch https://github.com/${GITHUB_REPOSITORY}.git feat/teams-attendance-roster-20260910
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_EVENT_HEAD"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feat/teams-attendance-roster-20260910
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
