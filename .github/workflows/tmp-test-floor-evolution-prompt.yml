name: Temporary test-floor evolution prompt contribution

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  contribute:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/prompt-kit-test-floor-evolution-20260824'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-test-floor-evolution-20260824
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh and reconcile current main floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --prune --tags
          echo "MAIN_BEFORE=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          git status --short

      - name: Execute helper-owned contribution and both harvest passes
        shell: bash
        run: |
          set -euo pipefail
          python .prompt-contrib/execute_test_floor_evolution.py

      - name: Remove transport and commit durable contribution
        shell: bash
        run: |
          set -euo pipefail
          git rm .prompt-contrib/test-floor-evolution-draft.json
          git rm .prompt-contrib/execute_test_floor_evolution.py
          git rm .github/workflows/tmp-test-floor-evolution-prompt.yml
          git add registry/prompts/spec-architecture-prompts.v1.json \
            tests/test_afk_deterministic_testing_prompt.py \
            tests/test_test_floor_evolution_prompt.py \
            web/prompt-kit/index.html
          git diff --cached --check
          echo '--- durable staged paths ---'
          git diff --cached --name-only
          git commit -m 'feat(prompt-kit): add risk-driven test floor evolution'

      - name: Refresh final floor and rerun exact-head proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          python -m unittest tests.test_afk_deterministic_testing_prompt tests.test_test_floor_evolution_prompt -v
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_actionable_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/evaluate_prompt_language.py --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check
          test -z "$(git status --porcelain)"
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_MAIN=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Push exact validated branch head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/prompt-kit-test-floor-evolution-20260824
          echo "validated_head=$FINAL_HEAD"
          echo "validated_main_floor=$FINAL_MAIN"
