name: Temporary TRQ-007 floor repair v2

on:
  push:
    branches:
      - fix/trq007-compute-authority-floor-20260914

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize staged TRQ-007 repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          carrier = Path('.github/workflows/tmp-trq007-floor-repair-20260914.yml').read_text(encoding='utf-8')
          start = carrier.index('          from pathlib import Path\n')
          end = carrier.index('\n          PY', start)
          exec(compile(textwrap.dedent(carrier[start:end]), 'trq007-repair-generator', 'exec'), {})
          PY
      - name: Validate repaired ledger and owning eval floor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_work_ledger.py --summary
          python -m unittest tests.test_repository_work_ledger -v
          python harness/evals/compute-authority/scripts/validate_fixtures.py --summary
          python -m unittest tests.test_compute_authority_eval_harness -v
          python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
          git diff --check
          git status --short
          git diff --stat
      - name: Commit durable repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-trq007-floor-repair-20260914.yml
          git rm .github/workflows/tmp-trq007-floor-repair-v2-20260914.yml
          git add .ai/WORK_QUEUE.md tests/test_repository_work_ledger.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(ledger): advance compute-authority to Sprint 2'
          git push origin HEAD:fix/trq007-compute-authority-floor-20260914
