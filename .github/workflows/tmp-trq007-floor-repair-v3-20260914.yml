name: Temporary TRQ-007 floor repair v3

on:
  push:
    branches:
      - fix/trq007-compute-authority-floor-20260914

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair TRQ-007 with exact substitutions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          ledger_path = Path('.ai/WORK_QUEUE.md')
          text = ledger_path.read_text(encoding='utf-8')
          start = text.index('## TRQ-007 — Measure Prompt Kit compute-authority effectiveness on external agents')
          end = text.index('## TRQ-008 — Execute Prompt Execution Evidence Spine sprint map', start)
          section = text[start:end]
          replacements = {
              '- **Branch / PR:** main planning floor; successor implementation branches/PRs are defined by the canonical sprint map': '- **Branch / PR:** main; Sprint 1 integrated by PR #464; Sprint 2 runtime-harness implementation not yet integrated',
              '- **Dependencies:** PR #452 merged at `fd3b3910e0ce80f3880ebd15426278354b065f48`; Sprint 1 must land before runtime pilot; Sprint 3 must reconcile open PR #450 before touching its shared P67 registry/test files': '- **Dependencies:** Sprint 1 integrated by PR #464 / merge `43b1953092b518fe3a76b5fe0bfab179f730e849`; Sprint 2 consumes that immutable fixture floor; Sprint 3 must reconcile open PR #450 before touching shared P67 registry/test files',
              '- **References:** `harness/evals/COMPUTE_AUTHORITY_EVALUATION_SPRINT_PLAN.md`, `harness/evals/repository-ai-evals.v1.json`, `.ai/skills/skill-evaluation/SKILL.md`, `harness/contracts/prompt-outcome-receipt.schema.v1.json`, `harness/prompt-topology/POST_PHASE_C_STRATEGIC_SCOUT.md`': '- **References:** `harness/evals/COMPUTE_AUTHORITY_EVALUATION_SPRINT_PLAN.md`, `harness/evals/compute-authority/manifest.json`, `harness/evals/compute-authority/README.md`, `harness/evals/repository-ai-evals.v1.json`, `.ai/skills/skill-evaluation/SKILL.md`, `harness/contracts/prompt-outcome-receipt.schema.v1.json`',
              '- **Gate:** Sprint 1 is SAFE & EXECUTABLE; model-runtime credentials/provider availability may later bound Sprints 2–3 but do not block the deterministic floor': '- **Gate:** Sprint 2 repository/runtime-harness implementation is SAFE & EXECUTABLE; provider credentials or an accessible external-agent runtime may block only the observed pilot and must remain `UNPROVEN_RUNTIME` rather than a synthetic PASS',
              '- **Last proof:** plan commit `6aa8f6b07c45697fb61a1782c13b105fa40a1d80` persisted the complete dependency map on current main after #452; exact #452 main floor had 12/12 observed push workflows successful': '- **Last proof:** merge:43b1953092b518fe3a76b5fe0bfab179f730e849 integrated PR #464 Compute-Authority Sprint 1; artifact:harness/evals/compute-authority/manifest.json artifact:harness/evals/compute-authority/fixtures/index.v1.json artifact:harness/evals/compute-authority/scripts/validate_fixtures.py',
              '- **Next action:** build Sprint 1 under `harness/evals/compute-authority/`: versioned eval contract, schemas, eight hidden gold fixtures, deterministic fixture/metric validator and focused tests; keep #450-shared repository-AI registry/test files read-only until convergence': '- **Next action:** Build Sprint 2 from `harness/evals/COMPUTE_AUTHORITY_EVALUATION_SPRINT_PLAN.md`: add the immutable condition resolver, disposable-run isolation, provider-neutral adapter/capture seam, paired-order pilot runner, invalid-run receipts, and focused tests without editing #450-owned shared P67 registry files; validate and integrate the deterministic harness before attempting external runs',
              '- **Updated:** 2026-09-14T12:55:00-04:00': '- **Updated:** 2026-09-14T13:06:00-04:00',
          }
          for old, new in replacements.items():
              if old not in section:
                  raise SystemExit(f'missing expected TRQ-007 line: {old}')
              section = section.replace(old, new, 1)
          ledger_path.write_text(text[:start] + section + text[end:], encoding='utf-8')
          tests = Path('tests/test_repository_work_ledger.py')
          source = tests.read_text(encoding='utf-8')
          test_name = 'test_trq007_continuation_tracks_integrated_compute_authority_floor'
          if test_name not in source:
              anchor = "\n\nif __name__ == '__main__':\n"
              if anchor not in source:
                  raise SystemExit('ledger unittest anchor missing')
              addition = "\n\n" + "\n".join([
                  '    def test_trq007_continuation_tracks_integrated_compute_authority_floor(self):',
                  "        ledger = (ROOT / '.ai' / 'WORK_QUEUE.md').read_text(encoding='utf-8')",
                  "        self.assertIn('merge:43b1953092b518fe3a76b5fe0bfab179f730e849', ledger)",
                  "        self.assertIn('Next action:** Build Sprint 2', ledger)",
                  "        self.assertIn('Sprint 2 repository/runtime-harness implementation is SAFE & EXECUTABLE', ledger)",
                  "        self.assertNotIn('Sprint 1 is SAFE & EXECUTABLE', ledger)",
                  "        self.assertNotIn('build Sprint 1 under `harness/evals/compute-authority/`', ledger)",
              ]) + "\n"
              tests.write_text(source.replace(anchor, addition + anchor), encoding='utf-8')
          PY
      - name: Validate ledger and Compute-Authority Sprint-1 floor
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_work_ledger.py --summary
          python -m unittest tests.test_repository_work_ledger -v
          python harness/evals/compute-authority/scripts/validate_fixtures.py --summary
          python -m unittest tests.test_compute_authority_eval_harness -v
          python scripts/validate_harness.py --report Outputs/harness-completeness-report.json
          git diff --check
          git status --short
          git diff --stat
      - name: Commit durable TRQ-007 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-trq007-floor-repair-20260914.yml
          git rm .github/workflows/tmp-trq007-floor-repair-v2-20260914.yml
          git rm .github/workflows/tmp-trq007-floor-repair-v3-20260914.yml
          git add .ai/WORK_QUEUE.md tests/test_repository_work_ledger.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(ledger): advance compute-authority to Sprint 2'
          git push origin HEAD:fix/trq007-compute-authority-floor-20260914
