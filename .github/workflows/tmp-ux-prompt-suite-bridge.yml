name: Temporary UX prompt ownership repair bridge

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: prompt-kit-ux-scope-repair-20260824
  cancel-in-progress: false

jobs:
  ux-scope-repair:
    if: github.event.pull_request.head.ref == 'feat/prompt-kit-ux-design-suite-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prompt-kit-ux-design-suite-20260823
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh floor and reconcile main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --all --prune --tags
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
          fi
          if [ ! -f .prompt-contrib/ux_scope_repair.py ]; then
            echo 'SKIP_REPAIR=1' >> "$GITHUB_ENV"
            echo 'Durable scope repair already replaced temporary executor.'
          else
            echo 'SKIP_REPAIR=0' >> "$GITHUB_ENV"
          fi
          git status --short
          git log --oneline --decorate -8

      - name: Apply reviewer-backed ownership repair
        if: env.SKIP_REPAIR != '1'
        shell: bash
        run: |
          set -euo pipefail
          python .prompt-contrib/ux_scope_repair.py
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html

      - name: Validate UX boundaries and canonical Prompt Kit
        if: env.SKIP_REPAIR != '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ux_design_prompt_suite -v
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python scripts/prompt_registry_ops.py validate
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Pass two boundary falsification
        if: env.SKIP_REPAIR != '1'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import build_prompt_kit_registry

          full = {p['id']: p for p in build_prompt_kit_registry.load_prompt_kit_registry()}
          raw = {p['id']: p for p in json.loads(Path('registry/prompts/spec-architecture-prompts.v1.json').read_text(encoding='utf-8'))['prompts']}
          for pid in ('P106', 'P107', 'P108', 'P109', 'P110'):
              for marker in ('OWNED SCOPE', 'FORBIDDEN SCOPE', 'ROUTING BOUNDARY'):
                  if marker not in raw[pid]['copyContent']:
                      raise SystemExit(f'{pid} missing {marker}')
              if len(raw[pid]['copyContent']) >= 8000:
                  raise SystemExit(f'{pid} exceeded anti-bloat ceiling')
              if pid not in full:
                  raise SystemExit(f'{pid} missing from effective registry')
          print(json.dumps({'pass_two':'bounded fixed point','scope_owners':5,'silent_boundary_gaps':[]}, indent=2))
          PY
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Remove repair executor and commit durable fix
        if: env.SKIP_REPAIR != '1'
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .prompt-contrib/ux_scope_repair.py
          git add \
            registry/prompts/spec-architecture-prompts.v1.json \
            tests/test_ux_design_prompt_suite.py \
            web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m "fix(prompt-kit): bound UX specialist ownership"

      - name: Refresh moved main and rerun exact-head proof
        if: env.SKIP_REPAIR != '1'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git merge --no-edit origin/main
            python -m unittest tests.test_ux_design_prompt_suite tests.test_spec_architecture_prompt_registry -v
            python scripts/prompt_registry_ops.py validate
            python scripts/validate_prompt_kit_discovery.py --summary
            python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
            git add web/prompt-kit/index.html
            if ! git diff --cached --quiet; then
              git commit -m "chore(prompt-kit): refresh UX generated site after main reconciliation"
            fi
            git diff --check HEAD
          fi
          echo "PROVEN_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Push exact validated PR head
        if: env.SKIP_REPAIR != '1'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feat/prompt-kit-ux-design-suite-20260823
          echo "PUSHED_HEAD=$PROVEN_HEAD"
