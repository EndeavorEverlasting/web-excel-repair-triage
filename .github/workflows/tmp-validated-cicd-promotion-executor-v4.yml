name: Temporary validated CI/CD promotion executor v4

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: prompt-kit-validated-cicd-promotion-v4
  cancel-in-progress: false

jobs:
  contribute:
    if: github.event.pull_request.head.ref == 'chore/validated-cicd-promotion-trigger-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh exact repository floor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --all --prune --tags
          base="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$base" HEAD
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "TRIGGER_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git status --short
          git log --oneline --decorate -8

      - name: Execute contribution through canonical helper
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .prompt-contrib/validated_cicd_promotion_contribution.py
          python .prompt-contrib/validated_cicd_promotion_contribution.py

      - name: Focused semantic and registry proof
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/test_p02_p07_autonomous_iteration.py tests/test_spec_architecture_prompt_registry.py tests/test_prompt_kit_mainline_delivery.py
          python -m unittest tests.test_p02_p07_autonomous_iteration -v
          python -m unittest tests.test_spec_architecture_prompt_registry -v
          python -m unittest tests.test_prompt_kit_mainline_delivery -v
          python scripts/prompt_registry_ops.py validate | tee "$RUNNER_TEMP/validate-receipt.json"
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

      - name: Verify parity and prompt identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts import build_prompt_kit_registry
          receipt = json.loads(Path(os.environ['RUNNER_TEMP'], 'validate-receipt.json').read_text(encoding='utf-8'))
          assert receipt['status'] == 'valid'
          assert receipt['site_parity'] is True
          prompts = build_prompt_kit_registry.load_prompt_kit_registry()
          by_name = {p['name']: p for p in prompts}
          generation = by_name['Repository-Native Code Update Harness Builder']
          promotion = by_name['Validated CI/CD Promotion Pipeline Builder']
          assert generation['id'] != promotion['id']
          print(json.dumps({'prompt_count': receipt['prompt_count'], 'site_parity': receipt['site_parity'], 'generation_id': generation['id'], 'promotion_id': promotion['id']}, indent=2))
          PY
          git diff --name-only | sort

      - name: Fail closed if main moved during proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$BASE_SHA" ]; then
            echo "main moved during proof: base=$BASE_SHA current=$current; rerun from fresh floor" >&2
            exit 75
          fi

      - name: Retire temporary transport and commit durable contribution
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/tmp-repo-native-code-update-prompt-contrib.yml \
            .github/workflows/tmp-repo-native-code-update-executor.yml \
            .github/workflows/tmp-repo-native-code-update-executor-v2.yml \
            .github/workflows/tmp-validated-cicd-promotion-prompt-contribution.yml \
            .github/workflows/tmp-validated-cicd-promotion-executor-v3.yml \
            .github/workflows/tmp-validated-cicd-promotion-executor-v4.yml \
            .prompt-contrib/repo_native_code_update_prompt_contribution.py \
            .prompt-contrib/repo-native-code-update-trigger.txt \
            .prompt-contrib/validated_cicd_promotion_contribution.py \
            .prompt-contrib/validated-cicd-promotion-trigger.txt
          do
            if [ -e "$path" ]; then git rm "$path"; fi
          done
          git add docs/prompts.json registry/prompts/spec-architecture-prompts.v1.json tests/test_p02_p07_autonomous_iteration.py tests/test_spec_architecture_prompt_registry.py tests/test_prompt_kit_mainline_delivery.py web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m "feat(prompt-kit): add validated CI/CD promotion pipeline builder"
          echo "PROVEN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Re-run exact-head proof
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_p02_p07_autonomous_iteration tests.test_spec_architecture_prompt_registry tests.test_prompt_kit_mainline_delivery -v
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check HEAD

      - name: Integrate exact green head and verify containment
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git fetch origin main --prune
          git merge-base --is-ancestor "$PROVEN_SHA" origin/main
          echo "RESULTING_MAIN_SHA=$(git rev-parse origin/main)"
          git status --short
