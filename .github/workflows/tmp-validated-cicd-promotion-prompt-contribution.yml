      - name: Fail closed if main moved during proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          current="$(git rev-parse origin/main)"
          if [ "$current" != "$BASE_SHA" ]; then
            echo "main moved during proof: base=$BASE_SHA current=$current; rerun contribution from fresh floor" >&2
            exit 75
          fi

      - name: Remove superseded temporary transport and commit durable contribution
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/tmp-repo-native-code-update-prompt-contrib.yml \
            .github/workflows/tmp-repo-native-code-update-executor.yml \
            .github/workflows/tmp-repo-native-code-update-executor-v2.yml \
            .prompt-contrib/repo_native_code_update_prompt_contribution.py \
            .prompt-contrib/repo-native-code-update-trigger.txt \
            .github/workflows/tmp-validated-cicd-promotion-prompt-contribution.yml
          do
            if [ -e "$path" ]; then git rm "$path"; fi
          done
          git add docs/prompts.json registry/prompts/spec-architecture-prompts.v1.json tests/test_p02_p07_autonomous_iteration.py tests/test_spec_architecture_prompt_registry.py tests/test_prompt_kit_mainline_delivery.py web/prompt-kit/index.html
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m "feat(prompt-kit): add validated CI/CD promotion pipeline builder"

      - name: Re-run exact-head proof after durable commit
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_p02_p07_autonomous_iteration tests.test_spec_architecture_prompt_registry tests.test_prompt_kit_mainline_delivery -v
          python scripts/prompt_registry_ops.py validate
          python -m unittest tests.test_prompt_language_audit -v
          python scripts/validate_prompt_kit_discovery.py --summary
          python scripts/validate_prompt_kit_order_navigation.py --require-implementation --summary
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check HEAD
          echo "PROVEN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Integrate exact green head and verify containment
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git fetch origin main --prune
          git merge-base --is-ancestor "$PROVEN_SHA" origin/main
          echo "RESULTING_MAIN_SHA=$(git rev-parse origin/main)"
          git status --short
