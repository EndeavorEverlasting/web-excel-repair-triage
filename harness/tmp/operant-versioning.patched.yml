name: Operant Deterministic Versioning

on:
  pull_request:
    paths:
      - OPERANT_VERSION
      - build_prompt_kit.py
      - docs/OPERANT_CHANGELOG.md
      - docs/OPERANT_VERSIONING.md
      - docs/prompts.json
      - docs/reference.json
      - harness/contracts/operant-product-identity.v1.json
      - scripts/build_prompt_kit_registry.py
      - scripts/operant_version.py
      - scripts/validate_operant_product_identity.py
      - tests/test_operant_product_identity.py
      - tests/test_prompt_kit_order_navigation_product.py
      - web/prompt-kit/index.html
      - .github/workflows/operant-versioning.yml
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: operant-versioning-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-policy:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify deterministic authority and mirrors
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python scripts/operant_version.py validate
          python scripts/operant_version.py validate-release-candidate --base origin/main
          python scripts/validate_operant_product_identity.py --summary
          python -m unittest tests.test_operant_product_identity tests.test_prompt_kit_order_navigation_product -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

  mainline-version-owner:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact mainline head with release history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Tag validated mainline version changes before planning again
        shell: bash
        run: |
          set -euo pipefail
          python scripts/operant_version.py validate
          version="$(python scripts/operant_version.py current)"
          tag="operant-v${version}"
          anchor="$(python scripts/operant_version.py release-anchor)"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            target="$(git rev-list -n 1 "$tag")"
            if [[ "$target" != "$anchor" ]]; then
              echo "Released version reuse/drift: ${tag} -> ${target}; expected anchor=${anchor}" >&2
              exit 1
            fi
          else
            python scripts/validate_operant_product_identity.py --summary
            python -m unittest tests.test_operant_product_identity tests.test_operant_release_anchor -v
            python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
            gh release create "$tag" \
              --target "$anchor" \
              --title "Operant v${version}" \
              --generate-notes
          fi
          git fetch --tags
          python scripts/operant_version.py validate --require-tag

      - name: Derive next release from natural mainline development
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Outputs
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python scripts/operant_version.py plan --output Outputs/operant-version-plan.json
          release_type="$(python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('Outputs/operant-version-plan.json').read_text(encoding='utf-8'))
          print(payload['release_type'] or '')
          PY
          )"
          next_version="$(python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('Outputs/operant-version-plan.json').read_text(encoding='utf-8'))
          print(payload['next_version'])
          PY
          )"
          echo "release_type=${release_type}" >> "$GITHUB_OUTPUT"
          echo "next_version=${next_version}" >> "$GITHUB_OUTPUT"

      - name: Prepare or refresh one reviewable release PR when a bump is earned
        if: ${{ steps.plan.outputs.release_type != '' }}
        shell: bash
        run: |
          set -euo pipefail
          next_version="${{ steps.plan.outputs.next_version }}"
          main_sha="$(git rev-parse origin/main)"
          existing_branch="$(gh pr list --state open --base main --json headRefName,url,number --jq '[.[] | select(.headRefName | startswith("automation/operant-release-"))] | first | .headRefName // empty')"
          existing_url="$(gh pr list --state open --base main --json headRefName,url --jq '[.[] | select(.headRefName | startswith("automation/operant-release-"))] | first | .url // empty')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$existing_branch" ]]; then
            echo "Refreshing open Operant release PR branch in place: $existing_branch ($existing_url)"
            git fetch origin "$existing_branch"
            git checkout -B "$existing_branch" "origin/$existing_branch"
            git merge --no-edit origin/main
            git checkout origin/main -- \
              OPERANT_VERSION \
              harness/contracts/operant-product-identity.v1.json \
              docs/OPERANT_CHANGELOG.md \
              web/prompt-kit/index.html
            branch="$existing_branch"
          else
            branch="automation/operant-release-v${next_version}-${main_sha:0:8}"
            git checkout -B "$branch" origin/main
          fi

          python scripts/operant_version.py apply --plan Outputs/operant-version-plan.json
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html
          python scripts/operant_version.py validate
          python scripts/operant_version.py validate-release-candidate --base origin/main
          python scripts/validate_operant_product_identity.py --summary
          python -m unittest tests.test_operant_product_identity tests.test_prompt_kit_order_navigation_product -v
          python scripts/build_prompt_kit_registry.py --output web/prompt-kit/index.html --check
          git diff --check

          git add OPERANT_VERSION \
            harness/contracts/operant-product-identity.v1.json \
            docs/OPERANT_CHANGELOG.md \
            web/prompt-kit/index.html
          if git diff --cached --quiet; then
            echo "Release candidate already matches recomputed plan on $branch"
          else
            git commit -m "chore(operant): release v${next_version}"
          fi
          git push origin HEAD:"$branch"

          NEXT_VERSION="$next_version" SOURCE_SHA="$main_sha" python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["NEXT_VERSION"]
          source_sha = os.environ["SOURCE_SHA"]
          body = f"""## Operant deterministic release

          This PR was derived AFK from accepted mainline development by `scripts/operant_version.py`.

          - next version: `{version}`
          - source mainline: `{source_sha}`
          - plan: `Outputs/operant-version-plan.json` in the workflow run
          - authority: `OPERANT_VERSION`
          - validation: Operant version + identity tests, generated-site parity, stale-candidate rejection, and `git diff --check`

          Merge is the explicit release gate. After this exact version change reaches `main`, the mainline owner validates it again and creates `operant-v{version}` plus the GitHub Release at the exact merged commit.
          """
          Path("Outputs/operant-release-pr.md").write_text(body, encoding="utf-8")
          PY

          if [[ -n "$existing_url" ]]; then
            gh pr edit "$existing_url" \
              --title "chore(operant): release v${next_version}" \
              --body-file Outputs/operant-release-pr.md
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(operant): release v${next_version}" \
              --body-file Outputs/operant-release-pr.md
          fi
